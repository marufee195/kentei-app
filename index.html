 choices:["課長は外出中ですが、すぐにお戻りになりますのでお待ちください。","課長は会議室にいらっしゃいますので、ご案内します。","現在渡辺は席を外されていますが、いかがいたしましょうか。","現在渡辺は不在ですが、よろしければ伝言を承ります。"], answer:3,
 explain:"他社(ソト)の人に対して自社(ウチ)の人物について話す場合、身内である自社の課長には尊敬語を使わず、謙譲的な表現(呼び捨て、「不在です」「承ります」など)を用いるのが適切です。他の選択肢は、自社の人物(渡辺課長)に対して誤って尊敬語(いらっしゃる、お戻りになる、席を外される)を使ってしまっています。"},

{id:"R2-16-67", tag:"R2 試験III 問題14 問2", cat:"語用論:ボールドオンレコード",
 text:"問2 文章中の下線部B「ポライトネス・ストラテジー」の一種である「ボールド・オン・レコード・ストラテジー(直言)」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["(近況を尋ねてきた人に)詳細は話さず「別に、普通かな」と言う。","(免許をとった友人に)誇張して褒めて「本当に?すごーい!」と言う。","(食事に誘う際に)誘いの表現を用いず「おなかがすいたな」と言う。","(車道に飛び出した人に)情報伝達を優先して「危ない!」と言う。"], answer:3,
 explain:"ボールド・オン・レコード・ストラテジー(直言)は、相手への配慮(フェイスの保持)よりも、情報を明確かつ直接的に伝えることを優先する方略です。緊急事態で「危ない!」と直接的に警告することは、この典型例です。"},

{id:"R2-16-68", tag:"R2 試験III 問題14 問3", cat:"敬語:敬語の指針",
 text:"問3 文章中の下線部C「敬語の指針」で述べられている内容として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["美化語は、行為者や所有者を立てるために使われる。","丁寧語は、相手側や「立てるべき人物」の行為には使えない。","謙譲語II(丁重語)は改まりを表すものであり、話題の人物を立てるものではない。","尊敬語における「立てるべき人物」は、身分や役割により固定的に決定される。"], answer:2,
 explain:"「敬語の指針」では、謙譲語II(丁重語、例:「参る」「申す」)は、話の聞き手に対して丁重に述べる(改まった言い方をする)ためのものであり、話題に登場する人物を立てる(敬う)働きを持つものではないとされています。"},

{id:"R2-16-69", tag:"R2 試験III 問題14 問4", cat:"敬語:尊敬語",
 text:"問4 文章中の下線部D「尊敬語」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["今日は大事なお話があります。","こちらにお名前をお書きください。","この安いほうのお魚をください。","先生にお手紙を書きます。"], answer:1,
 explain:"「お名前」は、相手の名前に「お」を付けて相手を立てる尊敬語の例です。「お話」「お魚」は美化語、「お手紙」は先生への行為を控えめに述べる謙譲語的な用法です。"},

{id:"R2-16-70", tag:"R2 試験III 問題14 問5", cat:"教授法:待遇表現の指導",
 text:"問5 文章中の下線部E「待遇表現の指導」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["現実場面での使用実態に即し、恩恵表現の指導は「てくださる」より「てさしあげる」を優先する。","目上の人には私的領域に踏み込む内容を尋ねることを避けるなど、形式面だけでなく内容面にも注意を向けさせる。","依頼表現の前に理由や状況説明をするなど、文レベルだけでなく談話レベルでも指導を行う。","「先生」に言及するときは「名前+さん」ではなく「名前+先生」を使うなど、初級の最初の授業から待遇表現を扱う。"], answer:0,
 explain:"実際の使用実態では、「てさしあげる」は恩着せがましい印象を与えやすく使用頻度も低いため、指導においてはむしろ「てくださる」のような表現の方が優先されるべきとされています。この記述は実態に即しておらず不適当です。"},

{id:"R2-16-71", tag:"R2 試験III 問題15 問1", cat:"言語政策:アイヌ語",
 text:"問題15 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本は世界の他の多くの社会と同じく,多言語多文化社会であるとされる。例えば,日本で用いられてきた言語の一つとしてアイヌ語がある。これは日本の先住民族であるアイヌ民族の言葉である。2019年には,アイヌ民族支援法が制定され,日本国内の多様な文化を尊重する機運が高まっている。\nアイヌ語は消滅が危惧される言語としてユネスコの「世界消滅危機言語地図」にも掲載されている。同地図においては,沖縄の方言である八重山語,沖縄語,宮古語なども消滅の危機にある言語と位置づけられている。文化庁はこのような消滅の危機にある言語・方言に対する保存・継承のための様々な取り組みを行っている。\nまた,手話を一つの言語として認め,国家の公用語に制定している国がある。日本社会においても手話を言語の一つとして認めようとする動きがある。\n\n問1 文章中の下線部A「アイヌ語」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本語と同じSOVの語順をとり、膠着語である。","日本語と同じSOVの語順をとり、抱合語である。","中国語と同じSVOの語順をとり、膠着語である。","中国語と同じSVOの語順をとり、抱合語である。"], answer:1,
 explain:"アイヌ語は、日本語と同じくSOV(主語-目的語-動詞)の語順をとりますが、動詞に人称接辞や名詞的要素が組み込まれる特徴を持つ抱合語(polysynthetic language)に分類されます。"},

{id:"R2-16-72", tag:"R2 試験III 問題15 問2", cat:"言語政策:アイヌ民族支援法",
 text:"問2 文章中の下線部B「アイヌ民族支援法」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["アイヌ民族を日本の先住民族として明記している。","アイヌ民族の文化振興のための環境整備を推進している。","アイヌ語を日本の公用語の一つとして明記している。","アイヌ文化を継承する者の育成を推進している。"], answer:2,
 explain:"アイヌ民族支援法は、アイヌ民族を先住民族として法的に位置づけ、文化振興や人材育成などを推進する法律ですが、アイヌ語を公用語として明記してはいません。"},

{id:"R2-16-73", tag:"R2 試験III 問題15 問3", cat:"社会言語学:沖縄の方言",
 text:"問3 文章中の下線部C「沖縄の方言」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["現代の東北方言との類似度が高く、九州方言がそれに次ぐ。","第二次世界大戦後、いわゆるヤマトグチとの混交が進んでいる。","近代までは口承伝達が一般的で、文書資料は残っていない。","米国統治時の英語の影響で生じたクレオールが普及している。"], answer:1,
 explain:"第二次世界大戦後、標準語(ヤマトグチ)との接触・混交が進み、伝統的な沖縄の方言と標準語的要素が混ざり合った言葉が広まったとされています。"},

{id:"R2-16-74", tag:"R2 試験III 問題15 問4", cat:"言語政策:方言の保存継承",
 text:"問4 文章中の下線部D「消滅の危機にある言語・方言に対する保存・継承のための様々な取り組み」の例として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["危機的な状況にある言語・方言サミットを開催している。","言語・方言を保存するためのアーカイブ化を行っている。","消滅の危機にひんしている言語・方言の実地調査をしている。","方言使用を推奨するための方言札を学校教育に導入している。"], answer:3,
 explain:"「方言札」は歴史的に、学校で方言を使った児童生徒に罰として掛けさせるなど、方言の使用を抑制・矯正するための道具として用いられてきたものであり、方言の「使用を推奨する」ための取り組みではありません。したがってこの記述は事実と逆であり不適当です。"},

{id:"R2-16-75", tag:"R2 試験III 問題15 問5", cat:"言語学:手話",
 text:"問5 文章中の下線部E「手話」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ろう者の親を持つ聴者の子どもをディスレクシアと呼ぶ。","世界中の手話の構造は共通しており、意思疎通が容易である。","日本では公的場面で手話通訳を付けることが義務づけられている。","日本手話は日本語とは異なる言語の体系を持っている。"], answer:3,
 explain:"日本手話は、音声日本語とは語順や文法構造が異なる、独自の文法体系を持つ独立した言語であるとされています。"},

{id:"R2-16-76", tag:"R2 試験III 問題16 問1", cat:"在留政策:在留外国人統計",
 text:"問題16 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n近年,日本に中長期的に滞在する外国人が増加している。それに伴って,在留外国人の状況も多様化している。\nこのような状況の下,2018年に「出入国管理及び難民認定法及び法務省設置法の一部を改正する法律」が成立した。これにより,新たな在留資格として「特定技能」が創設され,特定技能1号と特定技能2号が設けられた。特定技能1号の取得には一定の日本語能力の水準が求められる。また,2019年には「日本語教育の推進に関する法律」が成立した。そこには日本語教育の推進に関わる基本理念や基本的施策等が掲げられている。\n\n問1 文章中の下線部A「在留外国人の状況」に関して、2019年6月末現在の記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["在留外国人の数は、過去最多を記録し、280万人を超えている。","在留資格別の数は、「技能実習」が最も多く、次いで「永住者」が多い。","都道府県別の数は、東京都が最も多く、次いで神奈川県が多い。","出身の国籍・地域別の上位3か国は、「中国」「韓国」「ブラジル」である。"], answer:0,
 explain:"2019年6月末現在、在留外国人数は過去最多を更新し、280万人を超えていました。"},

{id:"R2-16-77", tag:"R2 試験III 問題16 問2", cat:"在留政策:2018年入管法改正",
 text:"問2 文章中の下線部Bに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「留学」と「就学」の在留資格が「留学」に一本化され、法務省告示日本語教育機関の学生も留学生と呼ばれるようになった。","新たな在留資格「介護」が創設され、介護福祉士の資格を有する外国人が介護業務に従事することが可能となった。","法務省の任務が改正され、「出入国在留管理庁」が出入国及び在留の公正な管理を担うこととなった。","「外国人登録制度」および「外国人登録証明書」が廃止され、在留期間の上限が3年から最長5年に延長された。"], answer:2,
 explain:"2018年の法改正により、法務省の外局として「出入国在留管理庁」が新設され、出入国および在留の公正な管理を担う体制が整備されました。"},

{id:"R2-16-78", tag:"R2 試験III 問題16 問3", cat:"在留政策:特定技能",
 text:"問3 文章中の下線部C「特定技能」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["技能、技術または知識の開発途上国などへの移転が目的とされている。","ポイント制による出入国在留管理上の優遇措置が設けられている。","国家間の経済連携強化の観点から、特例的な資格として位置づけられている。","介護、農業、外食業、建設など、対象の産業分野が限定されている。"], answer:3,
 explain:"「特定技能」は、介護・農業・外食業・建設など、人手不足が深刻とされる特定の産業分野に限定して設けられた在留資格です。"},

{id:"R2-16-79", tag:"R2 試験III 問題16 問4", cat:"在留政策:特定技能の日本語要件",
 text:"問4 文章中の下線部D「一定の日本語能力の水準」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ごく基本的な個人的情報や家族情報、買い物、近所、仕事など、直接的関係がある領域に関する、よく使われる文や表現が理解できる。","自分の専門分野の技術的な議論も含めて、抽象的かつ具体的な話題の複雑なテクストの主要な内容を理解できる。","具体的な欲求を満足させるための、よく使われる日常的表現と基本的な言い回しは理解し、用いることもできる。","仕事、学校、娯楽で普段出合うような身近な話題について、標準的な話し方であれば主要点を理解できる。"], answer:0,
 explain:"特定技能1号の取得に求められる日本語能力の水準は、国際交流基金日本語基礎テストやJLPT N4相当とされ、CEFRのA2レベル(基本的な個人情報や身近な事柄に関する表現が理解できるレベル)に相当するとされています。"},

{id:"R2-16-80", tag:"R2 試験III 問題16 問5", cat:"日本語教育政策:推進法の基本理念",
 text:"問5 文章中の下線部E「日本語教育の推進に関わる基本理念」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本語教育の推進は、外国人等に係る教育及び労働、出入国管理その他の関連施策等との有機的な連携が図られ、総合的に行われなければならない。","日本語教育の推進は、国内における日本語教育が地域の活力の向上に寄与するものであるとの認識のもとに行われなければならない。","日本語教育の推進は、これを義務的なものとし、全ての者に対して無償のものとして行われなければならない。","日本語教育の推進は、日本語を学習する意義についての外国人等の理解と関心が深められるように配慮して行われなければならない。"], answer:2,
 explain:"「日本語教育の推進に関する法律」には、日本語教育を「義務的」かつ「全ての者に対して無償」とする規定は設けられておらず、この記述は法律の内容として不適当です。"},

/* ===== 令和3年度(R3) 試験I ===== */
{id:"R3-1-1", tag:"R3 試験I 問題1(1)", cat:"音声学:口蓋音",
 text:"次の(1)〜(15)について、【 】内に示した観点から見て、他と性質の異なるものを、それぞれ1〜5の中から一つずつ選べ。\n\n(1) 【口蓋音】",
 choices:["[ʃ]","[ç]","[c]","[ɲ]","[j]"], answer:0,
 explain:"[ç][c][ɲ][j]はいずれも硬口蓋(こうこうがい)で調音される音(硬口蓋音)です。一方[ʃ]は後部歯茎(歯茎の少し奥)で調音される後部歯茎音であり、調音点が異なります。"},

{id:"R3-1-2", tag:"R3 試験I 問題1(2)", cat:"音声学:音節とモーラ",
 text:"(2) 【音節とモーラ】",
 choices:["黒板","教室","学校","欠席","見学"], answer:2,
 explain:"「学校(がっこう)」は、モーラ数(が・っ・こ・う=4拍)と音節数(がっ・こう=2音節)の対応関係が、他の語(黒板・教室・欠席・見学)とは異なるパターンを示す例です。"},

{id:"R3-1-3", tag:"R3 試験I 問題1(3)", cat:"表記:ローマ字",
 text:"(3) 【ローマ字のつづり方】",
 choices:["tsukue","kisya","chikuwa","shigoto","furo"], answer:1,
 explain:"tsukue(つ)・chikuwa(ち)・shigoto(し)はヘボン式のつづり方です。「kisya」は「きゃ・きゅ・きょ」型の拗音を「sya」と表す訓令式のつづり方であり(ヘボン式なら kisha)、他とローマ字表記の方式が異なります。"},

{id:"R3-1-4", tag:"R3 試験I 問題1(4)", cat:"語構成:合成語",
 text:"(4) 【合成語】",
 choices:["国際的","同窓会","会議室","うどん屋","グローバル化"], answer:1,
 explain:"国際的・うどん屋・グローバル化は、語根に接尾辞(「的」「屋」「化」)が付いて特定の意味・品詞を作る派生語的な合成語です。一方「同窓会」は「同窓」+「会」という、対等に近い名詞同士が結びついた複合語であり、成り立ちのタイプが異なります。(この設問はやや判断が難しいため、参考書等でも確認することをおすすめします。)"},

{id:"R3-1-5", tag:"R3 試験I 問題1(5)", cat:"語彙:接頭辞",
 text:"(5) 【接頭辞「本」】",
 choices:["本センター","本サイト","本分科会","本会館","本社"], answer:4,
 explain:"本センター・本サイト・本分科会・本会館の「本」は、いずれも「この、当該の」という意味を表す接頭辞的用法です。一方「本社」の「本」は、支社・支店に対する「本(もと)」という意味であり、単なる「この会社」という指示的な意味とは異なります。"},

{id:"R3-1-6", tag:"R3 試験I 問題1(6)", cat:"語彙:名詞の場所性",
 text:"(6) 【名詞の場所性】",
 choices:["信号","電信柱","ガードレール","バス停","道路標識"], answer:3,
 explain:"「バス停」は、それ自体が「待ち合わせる場所」のような場所を表す性質(場所性)を持つ名詞です。一方、信号・電信柱・ガードレール・道路標識は、あくまで物体そのものを指す名詞であり、場所を表す用法には結びつきにくい点で異なります。"},

{id:"R3-1-7", tag:"R3 試験I 問題1(7)", cat:"文法:時間の直示",
 text:"(7) 【時間の直示】",
 choices:["一昨日","翌日","明後日","去年","来年"], answer:1,
 explain:"一昨日・明後日・去年・来年は、いずれも発話時点(今日)を基準にした直示的な時間表現です。一方「翌日」は、発話時点ではなく文脈中で言及された特定の日を基準にした相対的な表現であり、直示性を持たない点で異なります。"},

{id:"R3-1-8", tag:"R3 試験I 問題1(8)", cat:"文法:自他の対応",
 text:"(8) 【自他の対応】",
 choices:["切れる","割れる","溶ける","直る","劣る"], answer:2,
 explain:"切れる・割れる・直るは、対応する他動詞(切る・割る・直す)が語形上明確に対応する自動詞です。「劣る」には明確に対応する他動詞がなく、「溶ける」は対応する他動詞「溶かす」を持ちますが、語形の対応パターン(音韻的な対応の仕方)が他とは異なります。(この設問は判断が細かいため、辞典等でも確認することをおすすめします。)"},

{id:"R3-1-9", tag:"R3 試験I 問題1(9)", cat:"文法:「きる」の意味",
 text:"(9) 【「きる」の意味】",
 choices:["走りきる","使いきる","読みきる","信じきる","食べきる"], answer:3,
 explain:"走りきる・使いきる・読みきる・食べきるの「きる」は、動作が最後まで完全に完了することを表す用法です。一方「信じきる」の「きる」は、物理的な完了ではなく「完全に、徹底的に」という程度の強調を表す用法であり、意味のタイプが異なります。"},

{id:"R3-1-10", tag:"R3 試験I 問題1(10)", cat:"文法:タ形の意味",
 text:"(10) 【タ形の意味】",
 choices:["頑張ったものの、彼女には全く追いつけなかった。","こんなところに、おしゃれなレストランがあったんだ。","去年の今ごろは、沖縄の海で泳いでいたんだ。","今は物腰の柔らかい彼も、昔は生意気だったな。","せっかくの日曜日に、彼には悪いことをしてしまったな。"], answer:1,
 explain:"「こんなところに、おしゃれなレストランがあったんだ」のタ形は、単なる過去の出来事ではなく、今まさに気づいたという「発見」を表すムードのタです。他の選択肢は、単純に過去の出来事を叙述する用法です。"},

{id:"R3-1-11", tag:"R3 試験I 問題1(11)", cat:"文法:「ような」の用法",
 text:"(11) 【「ような」の用法】",
 choices:["ライオンのような肉食動物の飼育にはお金がかかる。","コロッケのような洋食料理のほうが子どもに人気だ。","高級牛肉のような大豆ミートが発売された。","ジョギングのような有酸素運動を勧められた。","東京のような大都市では、国際的なイベントが多い。"], answer:0,
 explain:"「ライオンのような肉食動物」は、「肉食動物」というカテゴリーの具体例としてライオンを挙げる例示の用法です。他の選択肢は、性質や見た目が似ていることを表す比況(たとえ)の用法であり、性質が異なります。"},

{id:"R3-1-12", tag:"R3 試験I 問題1(12)", cat:"文法:「って」の用法",
 text:"(12) 【「って」の用法】",
 choices:["田中さん、元気だって。","お父さんが早く来いって。","山田さんが留学するって。","お母さんがこれおいしいねって。","全く本当にあなたって。"], answer:4,
 explain:"元気だって・来いって・留学するって・おいしいねっての「って」は、他者の発言を伝える伝聞・引用の用法です。一方「あなたって」は「あなたという人は(本当に)」という、話題を取り立てて感想を述べる用法であり、伝聞・引用とは性質が異なります。"},

{id:"R3-1-13", tag:"R3 試験I 問題1(13)", cat:"文法:「に限る」の用法",
 text:"(13) 【「に限る」の用法】",
 choices:["夏休みは海に限る。","購入は会員に限る。","領収書は原本に限る。","入館は17時までに限る。","応募は未発表の作品に限る。"], answer:3,
 explain:"夏休みは海に限る(〜が一番だ)、購入は会員に限る・領収書は原本に限る・応募は未発表の作品に限る(〜だけに制限する)は、いずれも慣用的な「に限る」(最善・限定)の用法です。一方「17時までに限る」は、単に「17時まで」という期限を「限る」という動詞で普通に述べたものであり、慣用的な特殊用法とは異なります。"},

{id:"R3-1-14", tag:"R3 試験I 問題1(14)", cat:"文法:「ものだ」の用法",
 text:"(14) 【「ものだ」の用法】",
 choices:["そういうときは意地を張らずにすぐに謝るものだ。","昔はよくみんなで集まって夜中まで飲んだものだ。","病気がちだったあの子もずいぶん大きくなったものだ。","この機械は穀物を粉砕して家畜の飼料を作るものだ。","いつの時代も人は他人に頼らなければ生きていけないものだ。"], answer:0,
 explain:"「すぐに謝るものだ」は、そうするのが当然だ・そうすべきだという当為・忠告を表す用法です。他の選択肢は、過去の回想(2)、感慨(3)、機能の説明(4)、普遍的な真理(5)を表しており、「ものだ」の意味タイプが異なります。"},

{id:"R3-1-15", tag:"R3 試験I 問題1(15)", cat:"文法:時間関係の従属節",
 text:"(15) 【時間関係を表す従属節】",
 choices:["彼と会うたびに、新しい発見がある。","電話をしているすきに、つまみ食いされた。","彼と話したところで、何も変わらないだろう。","玄関のドアを開けるなり、彼は倒れ込んだ。","明るくなるにつれ、心が落ち着いた。"], answer:2,
 explain:"たびに・すきに・なり・につれは、いずれも時間的な関係(〜する度に、〜する間に、〜すると同時に、〜するにつれて)を表す従属節です。一方「話したところで」の「ところで」は、「たとえ〜しても」という逆接の仮定を表す用法であり、時間関係とは異なります。"},

{id:"R3-2-1", tag:"R3 試験I 問題2(1)", cat:"誤用分析:聞き取り",
 text:"次の(1)〜(5)における【 】内の下線部は学習者による誤用を示す。これと異なる種類の誤用を、それぞれ1〜4の中から一つずつ選べ。\n\n(1) 【「後悔しないでください」のつもりが「公開しないでください」に聞こえる。】",
 choices:["「そんなことありません」のつもりが「損なことありません」に聞こえる。","「いい家ですね」のつもりが「いい絵ですね」に聞こえる。","「いつ買いましたか」のつもりが「五日いましたか」に聞こえる。","「厚い皿ですね」のつもりが「熱い皿ですね」に聞こえる。"], answer:1,
 explain:"target(後悔/公開)・選択肢1(そんな/損な)・選択肢3(いつ買い/五日い)・選択肢4(厚い/熱い)は、いずれも発音が完全に一致する同音異義的な聞き誤りです。一方選択肢2「いい家(いえ)」と「いい絵(え)」は、モーラ数が異なり(いえ=2拍、え=1拍)、発音が完全には一致していない点で、誤りの種類が異なります。"},

{id:"R3-2-2", tag:"R3 試験I 問題2(2)", cat:"誤用分析:数詞の言い直し",
 text:"(2) 【彼は1時間2時間前に帰りました。】",
 choices:["この店には4回5回行ったことがある。","日本で2年3年勉強しました。","たしか部屋には2人3人いたと思います。","全ての商品を1個2個丁寧にチェックする。"], answer:3,
 explain:"target・選択肢1・2・3は、数字を言い直す際に訂正前の数字を消さずにそのまま残してしまった誤り(自己修正の失敗)です。一方選択肢4「1個2個丁寧にチェックする」は、「一つ一つ、丁寧に」という意味にも解釈できる表現であり、単純な数字の言い直しの誤りとは性質が異なります。"},

{id:"R3-2-3", tag:"R3 試験I 問題2(3)", cat:"誤用分析:使役形",
 text:"(3) 【学生たちは学園祭の看板を立たせた。】",
 choices:["彼らは倉庫の電気を順番に消えさせた。","若者たちが公園の桜の枝を折れさせた。","部下に会場までお祝いの花を届かさせた。","非常に重いドアを協力して閉まらせた。"], answer:2,
 explain:"target(立つ→立たせた)・選択肢1(消える→消えさせた)・選択肢2(折れる→折れさせた)・選択肢4(閉まる→閉まらせた)は、いずれも対応する他動詞(立てる・消す・折る・閉める)が存在するのに、自動詞の使役形を誤って使ってしまった誤りです。一方選択肢3「届かさせた」は、五段動詞「届く」の正しい使役形「届かせる」に、不要な「さ」を挿入してしまった誤り(さ入れ言葉)であり、誤りの種類が異なります。"},

{id:"R3-2-4", tag:"R3 試験I 問題2(4)", cat:"誤用分析:になるの誤用",
 text:"(4) 【ある俳優のブログが炎上になった。】",
 choices:["世界中で、スマートフォンが普及になった。","地震による停電で、町が混乱になった。","工業廃水によって、川の水が変質になった。","市が土地を買い上げ、施設が公共になった。"], answer:0,
 explain:"target(炎上する→炎上になった)・選択肢2(混乱する→混乱になった)・選択肢3(変質する→変質になった)は、本来「〜する」の形で使うべき動作性名詞に、誤って「〜になる」を付けてしまった誤りです。一方選択肢4「公共になった」の「公共」は、本来「〜する」という動詞形を持たない名詞であり、「〜になる」という形自体は文法的に成立するため、誤りの性質が他とは異なります。(選択肢1については、他との判別がやや難しいため、参考書等でも確認することをおすすめします。)"},

{id:"R3-2-5", tag:"R3 試験I 問題2(5)", cat:"誤用分析:たほうがいい",
 text:"(5) 【このビルでは、どこにゴミを捨てたほうがいいですか。】",
 choices:["この本とあの本、どちらが買ったほうがいいですか。","来週の試験までに、何を勉強したほうがいいですか。","こんな個人的なことを、誰に相談したほうがいいですか。","この課題は、どう調べたほうがいいですか。"], answer:0,
 explain:"target・選択肢2・3・4は、規則やルールなど本来一意に定まる事柄を尋ねる文脈で、複数の選択肢を比較して推奨を求める「たほうがいい」を使ってしまった誤りです。一方選択肢1「この本とあの本、どちらが買ったほうがいいですか」は、実際に2つの選択肢を比較して助言を求めており、「たほうがいい」の正しい使い方の例である点で異なります。"},

{id:"R3-3-1", tag:"R3 試験I 問題3-A(1)", cat:"音声学:調音点",
 text:"問題3 次のA〜Dの文章を読み、(1)〜(20)の問いに答えよ。\n\nA 【韻律】\n言語音は様々な器官の働きによって生成される。個々の単音は,主に声帯から上の調音点と調音体によって制御され,多くの言語で文字として表記される。一方,言語音のもう一つの要素である韻律は,主に喉頭によって調整されるが,韻律的特徴を表現する表記体系を持つ言語はごく一部に限られる。\n韻律の一つの要素であるイントネーションに影響する要因として,語のアクセントがある。加えて,イントネーションには,語と語の修飾・被修飾といった(ア)や,話し手が伝えたい情報である(イ)なども関与する。また,イントネーションが原因でコミュニケーションに支障をきたすこともある。\n\n(1) 文章中の下線部A「調音点」に関して、声帯に最も近い調音点はどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["声門","咽頭","口蓋垂","硬口蓋"], answer:0,
 explain:"声門は声帯そのものが作る開口部であり、声帯から最も近い(声帯そのものに位置する)調音点です。"},

{id:"R3-3-2", tag:"R3 試験I 問題3-A(2)", cat:"音声学:韻律の表記",
 text:"(2) 文章中の下線部B「韻律的特徴を表現する表記体系」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["英語のアルファベット","韓国語のハングル","中国語のピンイン","日本語の平仮名"], answer:2,
 explain:"中国語のピンインには声調記号が含まれており、韻律的特徴(声調)を文字表記の中に組み込んでいる代表例です。"},

{id:"R3-3-3", tag:"R3 試験I 問題3-A(3)", cat:"音声学:東京方言のアクセント",
 text:"(3) 文章中の下線部C「アクセント」に関して、東京方言のアクセントに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["複合語のアクセントは、前部要素のアクセント型に大きく影響される。","声の上がり目が重要であり、アクセント核と呼ばれる。","動詞・形容詞の終止形のアクセントの型は、名詞のアクセントの型より数が多い。","4拍語の名詞で最も多いのは、平板型アクセントである。"], answer:3,
 explain:"東京方言の4拍名詞のアクセント型の分布では、平板型(下がり目のない型)が最も多いことが知られています。なお、アクセント核は「上がり目」ではなく「下がり目」によって特徴づけられます。"},

{id:"R3-3-4", tag:"R3 試験I 問題3-A(4)", cat:"音声学:イントネーション",
 text:"(4) 文章中の(ア)と(イ)に入れるのに最も適当な組み合わせを、次の1〜4の中から一つ選べ。",
 choices:["(ア)統語構造 / (イ)プロミネンス","(ア)統語構造 / (イ)フォーカス","(ア)範列関係 / (イ)プロミネンス","(ア)範列関係 / (イ)フォーカス"], answer:1,
 explain:"語と語の修飾・被修飾関係は文の「統語構造」に関わり、話し手が伝えたい情報の中心は「フォーカス」(焦点)と呼ばれます。"},

{id:"R3-3-5", tag:"R3 試験I 問題3-A(5)", cat:"音声学:パラ言語情報",
 text:"(5) 文章中の下線部Dの理由として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["イントネーションが聞き手にとってメタファーとして機能するから","イントネーションが聞き手へのダイクシスとして機能するから","イントネーションによって話し手のパラ言語情報が伝達されるから","イントネーションによって話し手のシソーラスが伝達されるから"], answer:2,
 explain:"イントネーションは、話し手の感情や態度といったパラ言語情報(言語そのものの意味以外の情報)を伝える働きを持つため、意図しない解釈をされコミュニケーション上の支障をきたすことがあります。"},

{id:"R3-3-6", tag:"R3 試験I 問題3-B(6)", cat:"文法:品詞の性質",
 text:"B 【品詞の性質】\n言語の基本的な単位である語は,その形態的特徴と意味,および文の中での機能によって,異なる品詞に分類される。例えば,動詞は典型的には「動き」を表し,活用する。これに対し名詞は,典型的には「もの」を表し,活用しない。名詞の中には数量名詞や動作名詞(動名詞)など文法的な特徴が異なるものも存在する。形容詞は名詞を修飾する機能を持つ。\nまた,語の中には二つ以上の品詞にまたがるものもある。さらに,その品詞としての典型的な意味を表さないために,話し言葉では活用に揺れが生じている語もある。\n\n(6) 文章中の下線部Aの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["レバーは鉄分を多く含む。","あそこには昔、教会があった。","この本は簡単に読める。","娘の作文を褒めた。"], answer:3,
 explain:"「褒めた」は、具体的な動作(行為)を表す典型的な動詞の例です。「含む」「あった」「読める」は、それぞれ状態・存在・可能を表しており、「動き」を典型的に表す動詞の例としてはふさわしくありません。"},

{id:"R3-3-7", tag:"R3 試験I 問題3-B(7)", cat:"文法:動作名詞",
 text:"(7) 文章中の下線部B「動作名詞(動名詞)」に該当するものはどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["火事","大会","感覚","意味"], answer:3,
 explain:"「意味する」のように、「意味」は「〜する」を伴って動詞として機能する動作名詞(動名詞)です。「火事する」「大会する」「感覚する」は不自然であり、これらは動作名詞には該当しません。"},

{id:"R3-3-8", tag:"R3 試験I 問題3-B(8)", cat:"文法:形容詞の性質",
 text:"(8) 文章中の下線部C「形容詞」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["程度副詞に修飾される。","アスペクトの対立がある。","接続助詞が後接しない。","モダリティ表現が後接しない。"], answer:0,
 explain:"形容詞は「とても」「かなり」のような程度副詞による修飾を受けるのが典型的な特徴です。"},

{id:"R3-3-9", tag:"R3 試験I 問題3-B(9)", cat:"文法:品詞のまたがり",
 text:"(9) 文章中の下線部D「二つ以上の品詞にまたがるもの」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["光","嘘","幸せ","学習"], answer:2,
 explain:"「幸せ」は、「幸せを感じる」のような名詞としての用法と、「幸せな生活」のようなナ形容詞としての用法の両方を持ち、二つの品詞にまたがる語の例です。"},

{id:"R3-3-10", tag:"R3 試験I 問題3-B(10)", cat:"文法:活用の揺れ",
 text:"(10) 文章中の下線部Eの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["違う","行く","曲がる","落とす"], answer:0,
 explain:"「違う」は文法上は動詞ですが、状態を表す意味を持つため、話し言葉では「違かった」のように、あたかも形容詞であるかのような活用の揺れが生じることが知られています。"},

{id:"R3-3-11", tag:"R3 試験I 問題3-C(11)", cat:"文法:「の」の用法",
 text:"C 【様々な「の」】\n日本語の「の」には,様々な意味・機能がある。「の」は「XのY」という形で名詞Xと名詞Yを結びつける。その際,XとYの関係を表すために,「XのY」のXと「の」の間に格助詞が入ることがある。また,Xに名詞ではなく(ア)が入る場合もある。ほかにも,名詞修飾節の中の(イ)と交替する「の」がある。さらに,「地震があったのは昨日の昼間ですか。夜ですか。」の「地震があったの」のように,「述語+の」という構造で用いられる「の」もある。この「述語+の」という構造でも,「の」の機能が異なるものがある。\n\n(11) 文章中の下線部Aに関して、Xと「の」の間に入る格助詞の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["が","と","に","を"], answer:1,
 explain:"「京都との交流」のように、「Xとの」という形で格助詞「と」が「X」と「の」の間に入る例があります。"},

{id:"R3-3-12", tag:"R3 試験I 問題3-C(12)", cat:"文法:「の」の用法",
 text:"(12) 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["副詞","連体詞","動詞の連体形","イ形容詞の終止形"], answer:0,
 explain:"「すぐの用事」のように、「X」の位置に名詞ではなく副詞が入り、「の」で後ろの名詞を修飾する場合があります。"},

{id:"R3-3-13", tag:"R3 試験I 問題3-C(13)", cat:"文法:ノガ交替",
 text:"(13) 文章中の(イ)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["主体を表す「が」","理由を表す「で」","場所を表す「に」","経路を表す「を」"], answer:0,
 explain:"「本が好きな人」→「本の好きな人」のように、名詞修飾節の中で主体(主語)を表す格助詞「が」が「の」と交替できる、いわゆる「ノガ交替」という現象があります。"},

{id:"R3-3-14", tag:"R3 試験I 問題3-C(14)", cat:"文法:述語+のの機能",
 text:"(14) 文章中の下線部Bの機能として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「地震があった」を主題化する。","「地震があった」を名詞化する。","「地震があった」を疑問節にする。","「地震があった」を並列節にする。"], answer:1,
 explain:"「地震があったの」の「の」は、「地震があった」という述語(節)を名詞のように扱えるようにする、名詞化(準体助詞)の機能を持っています。"},

{id:"R3-3-15", tag:"R3 試験I 問題3-C(15)", cat:"文法:「の」の機能の違い",
 text:"(15) 文章中の下線部C「『の』の機能」に関して、他と異なるものを、次の1〜4の中から一つ選べ。",
 choices:["母がこっそり冷蔵庫でスイカを冷やすのを、見てしまった。","冷蔵庫でスイカを冷やしたのが、失敗の始まりだった。","冷蔵庫でスイカを冷やすのは、単にそのほうがおいしくなるからだ。","冷蔵庫でよく冷やしたのを食べて以降、スイカが大好物になった。"], answer:3,
 explain:"選択肢1・2・3の「の」は、「冷やすこと/冷やしたこと」のように出来事(こと)を名詞化する用法です。一方選択肢4の「の」は「冷やしたもの(=スイカ)」という具体的な対象(もの)を指す用法であり、機能が異なります。"},

{id:"R3-3-16", tag:"R3 試験I 問題3-D(16)", cat:"文法:複文の従属節",
 text:"D 【日本語の複文】\n文において,述語を一つしか持たない文を単文,二つ以上の述語を持つ文を複文と呼ぶ。複文を構成する従属節の種類には,補足節,名詞修飾節,副詞節,等位・並列節などが挙げられる。補足節は,名詞と同じような役割を果たす名詞節,引用節,間接疑問とも呼ばれる疑問節に分類される。また,名詞修飾節は,名詞修飾節の述語と被修飾名詞との関係により「内の関係」と「外の関係」に下位分類される。そして副詞節は,条件節,目的節などに分類される。このうち,順接の条件節には「ば」「と」「たら」「なら」という四つの形式が主に用いられるが,(ア)には,主節に命令などの行為要求のモダリティが使えないなどの制約がある。なお,従属節には従属度の高いものから低いものまで階層がある。\n\n(16) 文章中の下線部A「等位・並列節」を含む例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["掃除もするし、洗濯もする。","ソファーに座って、テレビを見た。","息が止まるくらい、びっくりした。","好きなだけ、取っていいですよ。"], answer:0,
 explain:"「掃除もするし、洗濯もする」は、「し」によって対等な複数の事柄を並べる等位・並列節の典型例です。"},

{id:"R3-3-17", tag:"R3 試験I 問題3-D(17)", cat:"文法:間接疑問節",
 text:"(17) 文章中の下線部B「間接疑問とも呼ばれる疑問節」に関して、疑問節をガ格に取る述語として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["重要だ","問題だ","不満だ","心配だ"], answer:2,
 explain:"「〜かが重要だ/問題だ/心配だ」のように、重要だ・問題だ・心配だは疑問節をガ格として自然に取ることができます。一方「不満だ」は「〜かが不満だ」という言い方が不自然であり、疑問節をガ格に取る述語としては不適当です。"},

{id:"R3-3-18", tag:"R3 試験I 問題3-D(18)", cat:"文法:内の関係",
 text:"(18) 文章中の下線部C「内の関係」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["お菓子を買ったおつりを置いてきてしまった。","昨日駅前の宝石店に泥棒が入った事件が起こった。","彼は子どもに算数を教えるアルバイトをしている。","最近大学で広まっている噂は全くのでたらめだ。"], answer:3,
 explain:"「噂が広まっている」のように、被修飾名詞「噂」が修飾節内の動詞に対してガ格として直接位置づけられる関係にあり、これが「内の関係」の例です。他の選択肢は、被修飾名詞が修飾節内の格関係に直接対応しない「外の関係」の例です。"},

{id:"R3-3-19", tag:"R3 試験I 問題3-D(19)", cat:"文法:条件節の制約",
 text:"(19) 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「ば」条件節の述語が状態性である場合","「と」条件節の場合","「たら」条件節の述語が動作性である場合","「なら」条件節の場合"], answer:1,
 explain:"「と」を用いた条件節は、主節に命令・依頼・意志などの行為要求的なモダリティ表現を使うことができないという制約があることで知られています(例:「春になると、旅行に行こう」は不自然)。"},

{id:"R3-3-20", tag:"R3 試験I 問題3-D(20)", cat:"文法:従属度の階層",
 text:"(20) 文章中の下線部Dに関して、最も従属度の低い従属節を、次の1〜4の中から一つ選べ。",
 choices:["田中さんは来るが、山田さんは来ない。","鈴木さんは、会社に行く前に図書館に寄った。","子どもたちは、テレビを見ながらご飯を食べている。","先生がおかしなことを言うので、みんなは笑った。"], answer:0,
 explain:"逆接の「が」でつながれる節は、等位接続に近い性質を持ち、主節との結びつきが弱い(従属度が低い)とされています。「前に」「ながら」「ので」でつながれる節は、それぞれ主節との意味的な結びつきがより強く、従属度が高いとされます。"},

{id:"R3-4-1", tag:"R3 試験I 問題4 問1", cat:"読解指導:トップダウン処理",
 text:"問題4 読解の活動に関する次の問い(問1〜5)に答えよ。\n\n問1 読解授業において行うトップダウン処理に焦点を当てた活動として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["レストランの口コミに出てくる定型表現を見つける。","旅行のパンフレットから行きたいコースを選ぶ。","映画のシナリオを音読して読めない漢字を確認する。","論文内の語の意味を確認して翻訳する。"], answer:1,
 explain:"トップダウン処理は、既有の知識や文脈から全体的な意味を推測しながら読む処理です。「行きたいコースを選ぶ」ために全体を読み、目的達成に必要な情報を把握する活動は、トップダウン処理に焦点を当てた例です。他の選択肢は、語彙・表現・漢字など部分的要素に注目するボトムアップ処理の例です。"},

{id:"R3-4-2", tag:"R3 試験I 問題4 問2", cat:"読解指導:多読",
 text:"問2 読解活動の一つに「多読」がある。多読教材を選ぶときの留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者は、辞書を用いなくても全体の話の流れが理解できそうな本を選ぶ。","学習者は、自分のレベルに合うかどうかよりも興味を優先して本を選ぶ。","語彙の知識を増やすために、教師は学習者のレベルに合った長さの本を選ぶ。","クラスで感想を共有するために、教師は学習者が読む本を毎回1冊選ぶ。"], answer:0,
 explain:"多読の基本原則の一つに、辞書を使わずに読み進められる、自分のレベルに合った易しい本を選ぶ、というものがあります。辞書なしで話の流れが理解できることは、この原則に合致します。"},

{id:"R3-4-3", tag:"R3 試験I 問題4 問3", cat:"読解指導:再話",
 text:"問3 読解授業において行う活動の一つに「再話」がある。「再話」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["人により再生できることが違い混乱するため、グループ活動は避けたほうがよい。","読む力とともに話す力の育成を目的とするため、口頭で行う必要がある。","段落間の関係性の把握が不十分でも、文中の語や表現を理解していれば可能である。","読んだ内容を物語として筋が通るよう組み立てる過程を経て、理解が深まる。"], answer:3,
 explain:"再話は、読んだ内容を自分の言葉で筋の通った物語として再構成して語り直す活動です。この再構成の過程を通じて、文章全体の理解がより深まるとされています。"},

{id:"R3-4-4", tag:"R3 試験I 問題4 問4", cat:"評価論:読解テスト作成",
 text:"問4 読解テストを作る際の留意点として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["記憶力を測る試験にならないよう、授業で扱った文章を出題する際には質問内容を工夫する。","各問題で独立して能力を測れるよう、前の問題が解けなければ次も解けない問題は避ける。","書く技能の評価もできるよう、選択式の問題に加えて記述式の問題も取り入れる。","学習者が質問の意図を読み誤らないよう、質問文は簡潔で分かりやすいものにする。"], answer:2,
 explain:"読解テストは読解力を測定することが目的であるため、記述式の問題を取り入れて書く技能まで評価対象にしてしまうと、測定したい能力(構成概念)がぼやけてしまいます。読解テストの留意点としては不適当です。"},

{id:"R3-4-5", tag:"R3 試験I 問題4 問5", cat:"評価論:クローズテスト",
 text:"問5 読解力を測定する方法の一つに「クローズテスト」がある。クローズテストの説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["文章の内容について覚えていることを自分の言葉で書く。","文章の内容について書かれた選択肢の記述が正しいかどうか答える。","結末が書かれていない文章を読み、結末を予測して書く。","一定の間隔で空けられた文章の空欄に適切な語を入れる。"], answer:3,
 explain:"クローズテスト(クローズ法)は、文章中の語を一定の間隔で機械的に空欄にし、その空欄に適切な語を補わせることで、文脈理解を含めた読解力を測定する方法です。"},

{id:"R3-5-1", tag:"R3 試験I 問題5 問1", cat:"聴解指導:生教材",
 text:"問題5 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n聴解の授業では,様々な聴解教材を用いる。例えば,市販教材や生教材などである。聴解を主とする授業では,聞く態勢を整えるための前作業の後,本作業として聞く活動を実施する。本作業では,まとまった長さの話から全体的な主旨を聞き取る練習や,注目すべき情報に焦点を当てて内容を聞き取る練習などが行われる。これらの練習では,イラストが提示されることもある。また,対話を聞く場合,録音された会話を第三者として聞く練習や,対面聴解の練習が行われる。後作業では,覚えたほうがよい語や表現を定着させる練習が行われる。\n\n問1 文章中の下線部A「生教材」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["外国語教育用の視聴覚教材で、日本文化や日本事情が紹介されたもの","学習者向けの映像教材で、母語話者によって役割が演じられたもの","映画やアニメなど、母語話者向けに作られているもの","演劇や落語など、実際に目の前で演じられているもの"], answer:2,
 explain:"生教材は、日本語学習者のために作られたものではなく、映画やアニメのように本来母語話者向けに作られた本物の素材を指します。"},

{id:"R3-5-2", tag:"R3 試験I 問題5 問2", cat:"聴解指導:大意把握",
 text:"問2 文章中の下線部B「全体的な主旨を聞き取る練習」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["何を主張したいのか考えながら、クラスメートのプレゼンテーションを聞く。","傘が必要か考えながら、天気予報で自分の住んでいる地域の天気を聞く。","時間通りに目的地に着けるか考えながら、電車のアナウンスから遅延情報を聞く。","インターンシップに参加できるか考えながら、説明会で日程に注意して聞く。"], answer:0,
 explain:"「何を主張したいのか」を考えながら聞くことは、話全体の大意・主旨をつかむ練習です。他の選択肢は、天気・遅延情報・日程といった特定の情報のみに焦点を当てて聞き取る練習(スキャニング的な聞き方)です。"},

{id:"R3-5-3", tag:"R3 試験I 問題5 問3", cat:"聴解指導:イラストの活用",
 text:"問3 文章中の下線部C「イラスト」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["思考動詞や推量表現の意味の違いを、明示的に示すことができる。","学習者が既に持っていた知識を活性化し、内容の理解を促進することができる。","学習項目への気づきを促すことはできるが、記憶に結びつけることができない。","状況を提示することはできるが、人の心理状態を示すことができない。"], answer:1,
 explain:"イラストを提示することで、学習者が既に持っている背景知識(スキーマ)を活性化させ、聴解内容の理解を助けることができます。"},

{id:"R3-5-4", tag:"R3 試験I 問題5 問4", cat:"聴解指導:対面聴解",
 text:"問4 文章中の下線部D「対面聴解の練習」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["二人がストーリーを聞きながらメモを取った後、協力してスクリプトを復元する。","二人でストーリーを聞いた後、母語でその内容について感想を述べ合う。","一人が話し手になり、もう一人は質問や確認などをしながら聞く。","一人が文章を読み上げ、もう一人は同じ文章の空欄になっている箇所を埋める。"], answer:2,
 explain:"対面聴解は、録音された音声を一方的に聞くのではなく、実際に対面する相手の発話を、質問や確認をしながらインタラクティブに聞く練習です。"},

{id:"R3-5-5", tag:"R3 試験I 問題5 問5", cat:"聴解指導:語彙表現の定着",
 text:"問5 文章中の下線部E「覚えたほうがよい語や表現を定着させる練習」の例として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["語、フレーズ、文などの単位でモデル音声を聞かせ、その後にリピートさせる。","前後の内容から推測してスクリプトの空欄を埋めさせ、音声を聞かせて、正解と照合させる。","学習者が初めて聞く話を日本語で聞かせてから、その内容を母語で言わせる。","ペアでロールプレイをさせてから、同じ場面のやり取りのモデルを聞かせ、もう一度ロールプレイをさせる。"], answer:2,
 explain:"「話を聞いてその内容を母語で言わせる」活動は、内容理解の確認を目的とするものであり、特定の語や表現を繰り返し使わせて定着させることを目的とした練習ではありません。"},

{id:"R3-6-1", tag:"R3 試験I 問題6 問1", cat:"教授法:インプット強化",
 text:"問題6 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語教育の指導や学習の方法は進化を続けている。言語形式に注目したインプット強化などの指導法がある一方で,最近ではアクティブ・ラーニングが注目されている。アクティブ・ラーニングの土台となる学説には,ヴィゴツキー(L.S.Vygotsky)の最近接発達領域(ZPD)などがある。その実現方法の一つとして,プロジェクト型学習が挙げられる。活動の中では,学習者の能動的な学びを引き出すためにKJ法が使われることがある。また,ジグソー法を使って情報や意見のやり取りが行われることもある。\n\n問1 文章中の下線部A「インプット強化」を行う際の教師の行動として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者の作文に誤用が見られたとき、誤りを指摘して正しい文を書かせる。","学習者の発話で意味が不明確な点をはっきりさせるよう、聞き返す。","学習者に文字で文を提示するとき、注目させたい表現の色を変えて目立たせる。","学習者が理解可能な語彙、文法、文構造を使い、全体的に話す速度を遅くする。"], answer:2,
 explain:"インプット強化は、特定の言語形式を視覚的・聴覚的に際立たせることで、学習者の注意をその形式に向けさせる指導技術です。文字の色を変えて目立たせることは、この典型的な方法です。"},

{id:"R3-6-2", tag:"R3 試験I 問題6 問2", cat:"学習理論:最近接発達領域",
 text:"問2 文章中の下線部B「最近接発達領域(ZPD)」の概念に基づく考え方として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者は、自分より能力が高い仲間と関わることで刺激を受け、学び、一人ではできないこともできるようになっていく。","学習者は、日常の「なぜ」という疑問から出発し、実践への転換、反省という過程を繰り返しながら、学びを拡張していく。","学習者は、共同体の正式な構成員として社会的活動に参加し、参加の形を少しずつ変化させながらより深く関与できるようになる。","学習者は、生理的欲求や安全、帰属などの低次の欲求が満たされた後に、承認、自己実現といった高次の欲求を求めるようになる。"], answer:0,
 explain:"ヴィゴツキーの最近接発達領域(ZPD)は、学習者が一人では達成できないが、自分より能力の高い他者(仲間や大人)の助けを借りることで達成できるようになる領域を指す概念です。"},

{id:"R3-6-3", tag:"R3 試験I 問題6 問3", cat:"教授法:プロジェクト型学習",
 text:"問3 文章中の下線部C「プロジェクト型学習」で設定するテーマとして不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["信頼性のある実証的データや、関連資料を収集することのできるテーマ","実社会で起こっている課題で、答えが一つではない複雑なテーマ","グループでの議論や試行錯誤の過程を経なければ解決できないテーマ","解答に至るまでに必要とされる知識や手順の見通しが明確に持てるテーマ"], answer:3,
 explain:"プロジェクト型学習は、答えが一つに定まらない複雑な課題に対し、試行錯誤しながら探究していく過程を重視する学習法です。あらかじめ解決の手順や必要な知識の見通しが明確に持てるようなテーマは、探究的な学びを引き出しにくく、プロジェクト型学習のテーマとしては不適当です。"},

{id:"R3-6-4", tag:"R3 試験I 問題6 問4", cat:"教授法:KJ法",
 text:"問4 文章中の下線部D「KJ法」の手順として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["紙の中央にテーマを記入して、そこから枝を伸ばし、思いついたアイデアを書き出し、枝を増やしていく。","1枚の付箋に一つずつアイデアを書いた後で、類似したアイデアをグループにして上位概念でまとめる。","各自が思いつくだけアイデアを書き出した後にそれを貼り出し、よいと思うアイデアを一人が三つずつ選び、注目したいポイントを決める。","「自分が知っていること」「これから知りたいこと」「調べる方法」の三つに分けて、アイデアや自分の考えを書き出す。"], answer:1,
 explain:"KJ法は、1枚の付箋やカードに一つずつアイデアを書き出し、それらを類似性に基づいてグループ化し、それぞれのグループに見出し(上位概念)をつけて整理していく手法です。"},

{id:"R3-6-5", tag:"R3 試験I 問題6 問5", cat:"教授法:ジグソー法",
 text:"問5 文章中の下線部E「ジグソー法」の活動方法として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["グループごとに異なった情報が与えられ、その内容理解を深める。その後、異なる情報を持った学習者同士で別のグループを編成し、内容を教え合う。","二つのグループに分かれ、ある問題について自分とは異なる立場から議論する。その後、グループを作り直し、自分の立場で同じ問題について議論する。","円の内側と外側に座り、内側の学習者があるトピックについて話し合いをする。その際、外側の学習者はその話し合いを聞き、観察する。","問題の事例に関する記事を各自で読む。その後、ペアになり記事の内容についてそれぞれが考えた質問をお互いに行う。"], answer:0,
 explain:"ジグソー法は、学習者ごとに異なる部分的な情報を与えて理解させたうえで、異なる情報を持つ学習者同士で新しいグループを作り、互いに教え合うことで全体像を完成させる協働学習法です。"},

{id:"R3-7-1", tag:"R3 試験I 問題7 問1", cat:"教師教育:自己研修型教師",
 text:"問題7 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n1990年代以降,日本語教師の養成や研修において,「教師の成長」という考え方が注目されている。特に「自己研修型教師」の養成では(ア)の重要性が指摘されるようになった。教師の自己成長を実現するには様々な方法があり,アクション・リサーチもその一つである。また,教師自身のビリーフへの気づきが,実践や教師の成長に影響を与える可能性も示唆されている。\n授業を行う際に教師が考えるべきことは多い。例えば,教科書を使用する場合は教科書分析をする必要がある。授業や教え方の改善を継続し,成長し続けることが,養成課程の実習生や新任教師だけでなくベテランの教師にも期待されている。\n\n問1 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["協働","内省","動機","修復"], answer:1,
 explain:"自己研修型教師の養成では、自らの授業実践を振り返る「内省(リフレクション)」の重要性が指摘されています。"},

{id:"R3-7-2", tag:"R3 試験I 問題7 問2", cat:"教師教育:アクションリサーチ",
 text:"問2 文章中の下線部A「アクション・リサーチ」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["自分の授業を改善することを目指して行う小規模な調査であり、自身の授業の問題点や関心事を取り上げる。","同じ問題を抱える他の教育機関の教師の参考になるように、授業で収集したデータを分析し、結果を一般化する。","現場での取り組みはそのままでは研究になりにくいので、事前に計画を立てて研究に必要な授業の条件を整える。","同僚の教師に授業を観察し分析した結果をフィードバックしてもらい、その結果を自分の授業に反映する。"], answer:0,
 explain:"アクション・リサーチは、教師自身が自分の授業実践上の問題点や関心事を取り上げ、その改善を目指して行う小規模な調査・実践研究です。"},

{id:"R3-7-3", tag:"R3 試験I 問題7 問3", cat:"教師教育:教師のビリーフ",
 text:"問3 文章中の下線部B「教師自身のビリーフ」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["教育活動に関わる様々な項目を包括的に記録したもので、授業評価も含まれる。","教師の経験に基づく価値観から形成されるものであり、思い込みも含まれる。","理想的な教師像や教師の役割についての普遍的なイメージのことである。","教師が行う様々な決定や行動に影響を与える恒久的な考え方のことである。"], answer:1,
 explain:"教師のビリーフは、教師自身のこれまでの経験を通じて形成される、教育や学習に関する個人的な価値観・信念であり、時に思い込みの側面も含みます。「普遍的」「恒久的」なものではなく、経験によって変わりうるものです。"},

{id:"R3-7-4", tag:"R3 試験I 問題7 問4", cat:"教材論:教科書分析",
 text:"問4 文章中の下線部C「教科書分析」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["作成者の言語学習観や言語教育観を知るために、前書きを読んで確認する。","授業を効果的に行うために、漢字練習帳など関連教材があるかを確認する。","文型・文法の提出順序を把握するために、目次や巻末の一覧表を確認する。","提出文型を確認するために、会話場面に出てくる登場人物の関係を確認する。"], answer:3,
 explain:"会話場面の登場人物の関係を確認することは、提出文型の把握と直接関係するものではなく、教科書分析の観点としては不適当です。"},

{id:"R3-7-5", tag:"R3 試験I 問題7 問5", cat:"教師教育:授業改善のプロセス",
 text:"問5 文章中の下線部D「授業や教え方の改善」のプロセスに含まれないものを、次の1〜4の中から一つ選べ。",
 choices:["授業の問題点を特定し、その原因や関連する事柄を明らかにする。","授業の問題点の原因を踏まえ、授業の改善策を考える。","授業の問題点に関する肯定証拠の事例を集め、授業を実践する。","授業記録を分析し、改善の結果とその理由について考察する。"], answer:2,
 explain:"授業改善の一般的なプロセスは、問題の特定→原因分析→改善策の立案→実践→結果の考察という流れです。「問題点を裏付ける肯定証拠だけを集める」というのは、偏った視点に陥りやすく、授業改善の適切なプロセスには含まれません。"},

{id:"R3-8-1", tag:"R3 試験I 問題8 問1", cat:"学習支援:ソーシャルサポート",
 text:"問題8 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n留学生の受け入れ機関では,留学生が安心して日々の生活を送れるよう多方面にわたる支援が行われている。その支援の一つにソーシャル・サポートがある。ソーシャル・サポートはストレスの軽減に有効であるとされている。また,留学生の支援担当者がソーシャル・サポート・ネットワーキングを活用する事例もある。危機的状況に陥った留学生に対しては危機介入が求められる。\n日本語教師は留学生が自己開示できる身近な存在の一人であり,安心して生活するうえで重要な役割を果たしている。\n\n問1 文章中の下線部A「ソーシャル・サポート」のうち、「道具的サポート」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["就職活動がうまくいかない留学生に寄り添って話を聞き、慰める。","アルバイト先が見つからない留学生に学内のアルバイト情報を紹介する。","生活に困窮している留学生に対して、生活必需品や食料を提供する。","苦手な科目のある留学生に「いつも勉強を頑張っているね」と言って励ます。"], answer:2,
 explain:"道具的サポートは、物資や金銭など、具体的・実際的な形での援助を指します。生活必需品や食料を提供することは、この典型例です。他の選択肢は、情緒的サポートや情報的サポートの例です。"},

{id:"R3-8-2", tag:"R3 試験I 問題8 問2", cat:"心理学:ストレス",
 text:"問2 文章中の下線部B「ストレス」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["本人にとって好ましい変化でも好ましくない変化でも、ストレスは引き起こされる。","ストレスは有害なため、それが全くない状態にすることで生産性が上がる。","ある出来事から生じるストレスは、個人の耐性によらず同じ程度に感じられる。","ストレスは、緊張状態を保ちつつ解決法を考え続けることで軽減される。"], answer:0,
 explain:"ストレスは、進学や結婚といった一般的に望ましいとされる変化でも、失業や別れのような望ましくない変化でも、どちらでも生じうるとされています。"},

{id:"R3-8-3", tag:"R3 試験I 問題8 問3", cat:"学習支援:ネットワーキング",
 text:"問3 文章中の下線部C「ソーシャル・サポート・ネットワーキング」の例に当てはまらないものを、次の1〜4の中から一つ選べ。",
 choices:["ゼミの担当教員に留学生の状況を説明し、配慮するように依頼する。","医療機関に留学生が母語で受診できるか照会し、通院できるように手配する。","入学時の留学生向けオリエンテーションで、授業に必要な教科書を販売する。","留学生同士で支援し合える関係を作るために、自助グループを立ち上げる。"], answer:2,
 explain:"ソーシャル・サポート・ネットワーキングは、留学生を取り巻く人や機関とのつながりを構築・調整する支援です。教科書の販売は単なる物品の授受であり、人と人・機関をつなぐネットワーキングの例ではありません。"},

{id:"R3-8-4", tag:"R3 試験I 問題8 問4", cat:"学習支援:危機介入",
 text:"問4 文章中の下線部D「危機介入」の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["相談者を家族や友人と切り離し、個別に相談を行うようにする。","支援者の都合のよい場所と日時を指定し、相談者に来させるようにする。","相談者の内面に深く入るよりも、直面する問題の迅速な解決に集中するようにする。","相談者が心理的均衡を取り戻した後も、心理的成長が現れるまで支えるようにする。"], answer:2,
 explain:"危機介入は、危機的状況にある相談者に対して、まず当面の問題を迅速に解決し、心理的な安定を取り戻すことを優先する短期的・実際的な支援です。"},

{id:"R3-8-5", tag:"R3 試験I 問題8 問5", cat:"心理学:自己開示",
 text:"問5 文章中の下線部E「自己開示」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["自己開示の度合いは相手との関係性や立場によって異なる。","自己開示は相手に与える情報を調節し、恩恵を得る機能を持つ。","自分の能力を高く見せることを目的に自己開示が行われる。","自分と相手の自己開示の度合いに差があると、相手との親密度が上がる。"], answer:0,
 explain:"自己開示の量や内容は、相手との親密さや社会的立場などの関係性によって変化するとされています。"},

{id:"R3-9-1", tag:"R3 試験I 問題9 問1", cat:"第二言語習得:認知スタイル",
 text:"問題9 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n第二言語学習において教師は学習者の特性をどう考慮すべきだろうか。学習者は一人一人認知スタイルが違う。また,学習ストラテジーも学習者によって異なることが分かっている。例えば,新語を記憶する方法の一つとしてキーワード法があるが,誰にでも有効であるとは限らない。さらに,学習者の特性には言語適性もある。この言語適性の構成要素として,スキーハン(P.Skehan)は音韻処理能力,言語分析能力,記憶力の三つを挙げている。他にも動機づけや学習者自身のビリーフも言語習得に影響を与えると考えられている。\n\n問1 文章中の下線部A「認知スタイル」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「思考型」の学習者は課題に曖昧な部分があっても寛容に受け止めようとする。","「内向型」の学習者は課題に対して感情を重視した価値観で判断しようとする。","「場依存型」の学習者は物事の詳細を見ることよりも全体を捉えようとする。","「場独立型」の学習者は課題について推測力を働かせ、直感的に反応しようとする。"], answer:2,
 explain:"「場依存型(field-dependent)」の学習者は、物事を全体的・文脈依存的に捉える傾向があり、細部よりも全体的な状況把握を重視するとされています。"},

{id:"R3-9-2", tag:"R3 試験I 問題9 問2", cat:"第二言語習得:学習ストラテジー",
 text:"問2 文章中の下線部B「学習ストラテジー」に含まれるストラテジーとその例の最も適当な組み合わせを、次の1〜4の中から一つ選べ。",
 choices:["認知ストラテジー:定期的に計画を立てて学習を進める。","社会的ストラテジー:人前でうまく話せたと自分を褒める。","情意ストラテジー:目標言語の母語話者の友達を作る。","補償ストラテジー:文脈から分からない語を推測する。"], answer:3,
 explain:"補償ストラテジーは、不足している言語知識を他の手がかりで補うための方略です。「文脈から分からない語を推測する」は、まさに知識の不足を文脈情報で補う補償ストラテジーの例です。"},

{id:"R3-9-3", tag:"R3 試験I 問題9 問3", cat:"語彙指導:キーワード法",
 text:"問3 文章中の下線部C「キーワード法」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["音韻的に似ている母語の言葉と結びつけて新語を覚える。","学習者自身の体験したことに結びつけて新語を覚える。","短い文を作り文全体の意味を理解しながら新語を覚える。","意味のよく似た母語の言葉と関連づけて新語を覚える。"], answer:0,
 explain:"キーワード法は、覚えたい目標言語の単語と音が似ている母語の単語(キーワード)を思い浮かべ、そのイメージと結びつけて記憶する語彙学習法です。"},

{id:"R3-9-4", tag:"R3 試験I 問題9 問4", cat:"第二言語習得:音韻処理能力",
 text:"問4 文章中の下線部D「音韻処理能力」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["成人の第二言語習得には関わらないが、子どもの場合は重要である。","インプットと既有知識の共通点を抽出し、一般化する際に関わる。","未知の音を識別する能力やそれを記憶する能力を含む。","学習の初期段階より学習が進んだ段階で習得に有利に働く。"], answer:2,
 explain:"スキーハンの言語適性論における音韻処理能力は、未知の音を正確に識別し、それを記憶・処理する能力を含みます。"},

{id:"R3-9-5", tag:"R3 試験I 問題9 問5", cat:"第二言語習得:統合的動機づけ",
 text:"問5 文章中の下線部E「動機づけ」に関して、「統合的動機づけ」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本のアニメを字幕なしで楽しみたい。","昇進して給料を上げたい。","漢字の成り立ちについて知りたい。","日本人について理解を深めたい。"], answer:3,
 explain:"統合的動機づけは、目標言語の話者やその文化・社会に対する興味や、そのコミュニティに溶け込みたいという思いから生じる動機づけです。「日本人について理解を深めたい」は、この典型例です。"},

{id:"R3-10-1", tag:"R3 試験I 問題10 問1", cat:"第一言語習得:共同注意",
 text:"問題10 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n言語の学習において,注意は重要な役割を持つ。第一言語において,子どもは共同注意を通じて言語が発達すると考えられている。第二言語においても,シュミット(R.W.Schmidt)の気づき仮説によって,注意の重要性が認識されるようになった。\n最近は,認知心理学の観点から,維持リハーサルなど,記憶を留めるのに注意の制御が関わることが分かってきた。注意の制御には,ワーキングメモリが強く関わる。また,かつて言語教育ではチャンクが否定的に捉えられていたこともあったが,近年はその役割が見直され,チャンクの使用の効果が確認されている。\n\n問1 文章中の下線部A「共同注意」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["親が子どもに向けて、短いフレーズや繰り返しなどの簡単な形式で発話すること","声の強調や動作など言語以外の要素で、親が子どもに感情や意図を伝えること","子どもが言いたい言葉を親が補って、新しい言語構造を示すこと","親が視線や指で示した対象に、子どもも視線を向けること"], answer:3,
 explain:"共同注意(joint attention)は、養育者と子どもが同じ対象に注意を向け合う状態を指します。親が視線や指差しで示したものに子どもも視線を向けることは、その典型例です。"},

{id:"R3-10-2", tag:"R3 試験I 問題10 問2", cat:"第二言語習得:気づき仮説",
 text:"問2 文章中の下線部B「気づき仮説」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["豊富なインプットだけでは不十分で、言語形式への注意が習得につながる。","学習を開始した年齢により、文法や音韻を意識する度合いや習得度が異なる。","無意識に獲得した言語形式だけでなく、意識的に学んだ言語形式も習得される。","学習者が必要性を感じ、意味や用法に対する注意が向けられるほど習得が進む。"], answer:0,
 explain:"シュミットの気づき仮説は、単に大量のインプットにさらされるだけでなく、学習者がその言語形式に意識的に「気づく」ことが、習得が進むために必要であるとする仮説です。"},

{id:"R3-10-3", tag:"R3 試験I 問題10 問3", cat:"認知心理学:維持リハーサル",
 text:"問3 文章中の下線部C「維持リハーサル」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["対象の語を母語の意味と対応づける。","対象の語を何度も繰り返しつぶやく。","対象の語と共起する語を調べて使ってみる。","対象の語と類似の意味を持つ語を整理する。"], answer:1,
 explain:"維持リハーサルは、意味的な処理を伴わない単純な反復による記憶保持の方法です。対象の語を何度も繰り返し唱えることは、その典型例です。"},

{id:"R3-10-4", tag:"R3 試験I 問題10 問4", cat:"認知心理学:ワーキングメモリ",
 text:"問4 文章中の下線部D「ワーキングメモリ」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["語の記憶に集中すると、言語理解や産出の処理に問題が生じることがある。","談話の重要な部分を保持し、不要な情報を抑制する機能は高齢になると衰える。","第二言語では語の意味を思い出すのに時間がかかり、保持できる時間も短い。","第二言語の使用経験が浅い場合、思考や推論に多くの処理資源が割り当てられる。"], answer:3,
 explain:"第二言語の使用経験が浅い学習者は、基本的な言語処理(語彙の想起や文の産出など)自体に多くの処理資源を割かれてしまい、思考や推論といった高次の処理に回せる余裕がむしろ少なくなるとされています。この記述は実態と逆であり不適当です。"},

{id:"R3-10-5", tag:"R3 試験I 問題10 問5", cat:"第二言語習得:チャンク",
 text:"問5 文章中の下線部E「チャンクの使用の効果」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ある語を関係が深い別の語に置き換え、注意を向けさせる。","注意を払わなくても言語処理が進み、発話の流暢さが増す。","発話の間を埋めると同時に聞き手の注意をつなぎとめる。","ある語と意味的に関連した語が次々と思い浮かぶ。"], answer:1,
 explain:"チャンク(定型的な語句のまとまり)を一つのまとまりとして処理できるようになると、一語一語を組み立てる際の負担が減り、意識的な注意をあまり払わなくても言語処理がスムーズに進み、発話の流暢性が高まるという効果があります。"},

{id:"R3-11-1", tag:"R3 試験I 問題11 問1", cat:"語彙:和製英語",
 text:"問題11 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n母語話者と学習者が接触する場面では,コミュニケーション上の問題が生じやすい。例えば,日本語母語話者が安易に和製英語を使用することで,かえって意味が伝わりにくくなることがある。また,日本語学習者が尊敬語と謙譲語を混同することによって,誤解が生じることもある。言語上の問題だけでなく,国,地域による非言語行動の違いも誤解につながる要因となる。日本語母語話者がこうした問題を知っておくことで接触場面での誤解を減らすことができる。\nさらに,日本語母語話者が日本語会話の特徴を理解しておくことも重要である。また,接触場面の会話に現れるフォリナー・トークの特徴も知っておくとよい。\n\n問1 文章中の下線部A「和製英語」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["道路にバリケードを築く。","討論会のパネラーを紹介する。","写真をスキャナーで取り込む。","社員のモチベーションを上げる。"], answer:1,
 explain:"「パネラー」は日本語独自の和製英語で、英語では本来「パネリスト(panelist)」と言います。「バリケード」「スキャナー」「モチベーション」は、英語の語をそのまま使った表現です。"},

{id:"R3-11-2", tag:"R3 試験I 問題11 問2", cat:"敬語:尊敬語と謙譲語の混同",
 text:"問2 文章中の下線部B「尊敬語と謙譲語を混同する」例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["先生の近況を尋ねるとき、「先生の妻はお元気ですか」と言う。","先生が傘を持っていないので、「貸してさしあげましょうか」と言う。","先生に椅子を勧めるとき、「お座りください」と言う。","先生の家族の話を聞いて、「ご兄弟は3人おりますね」と言う。"], answer:3,
 explain:"「おります」は自分側の動作に使う謙譲語です。先生の家族(相手側、敬うべき対象)について述べる際に謙譲語を使ってしまっており、本来は「いらっしゃいますね」のような尊敬語を使うべきところで尊敬語と謙譲語を混同した誤用です。"},

{id:"R3-11-3", tag:"R3 試験I 問題11 問3", cat:"異文化理解:非言語行動",
 text:"問3 文章中の下線部C「国、地域による非言語行動の違い」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["フランスでは親指を下に向けると、「面白くない」と解釈される。","インドでは小指を立てると、「トイレに行きたい」と解釈される。","米国では手のひらを下にして相手に振ると、「あっちへ行け」と解釈される。","ブラジルでは人差し指と親指で丸い形を作ると、「分かった」と解釈される。"], answer:3,
 explain:"ブラジルでは、人差し指と親指で丸い形を作るジェスチャー(いわゆるOKサイン)は、「分かった」ではなく侮辱的な意味を持つ卑猥なジェスチャーとして解釈されることが知られており、この記述は事実と異なります。"},

{id:"R3-11-4", tag:"R3 試験I 問題11 問4", cat:"社会言語学:日本語会話の特徴",
 text:"問4 文章中の下線部D「日本語会話の特徴」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["心的態度を表す多様な終助詞が用いられる。","上位者への呼びかけには二人称代名詞が用いられる。","共話よりも対話の形式でやり取りが進行する。","コンテクストよりも言葉で表される内容に依存する。"], answer:0,
 explain:"日本語の会話には、「ね」「よ」「な」など、話し手の心的態度(気持ちや確認の意図など)を表す多様な終助詞が使われる特徴があります。日本語では上位者への呼びかけに二人称代名詞は避けられ、共話的なやり取りや、言葉にされない文脈(コンテクスト)への依存も特徴とされます。"},

{id:"R3-11-5", tag:"R3 試験I 問題11 問5", cat:"社会言語学:フォリナートーク",
 text:"問5 文章中の下線部E「フォリナー・トーク」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者が母語話者とのビジネスを成立させるために用いるもの","学習者が母語話者に生活で必要な内容を伝えるために用いるもの","母語話者が学習者の言語理解を助けるために用いるもの","母語話者が学習者の学習効果を高めるために用いるもの"], answer:2,
 explain:"フォリナー・トークは、母語話者が非母語話者(学習者)に対して、語彙や文法を簡略化するなど、理解を助けるために調整して用いる話し方を指します。"},

{id:"R3-12-1", tag:"R3 試験I 問題12 問1", cat:"言語政策:言語計画",
 text:"問題12 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n言語計画とは,国家などの共同体による言語に関する具体的な計画であり,大きく三つに分類される。一つ目は席次計画である。二つ目は実体計画で,ある言語の機能を計画することである。三つ目は(ア)計画で,習得計画とも呼ばれ,席次計画,実体計画の後に実施される。\n日本の言語政策の歴史を振り返ってみると,古代に初めて文字が導入され,その後も様々な変遷をたどってきた。文明開化以降は積極的に欧米文化を取り入れようとし,明治時代には近代化のための日本語のあり方が議論された。最近では常用漢字表が2010年に改定されている。\n\n問1 文章中の下線部A「席次計画」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["科学技術の発展により、ある言語において必要となった語彙を造成すること","複数の言語が使用されている地域で、ある言語に特定の地位を与えること","ある言語の中に多様性がある場合、それを統一して規範的な体系を作ること","ある言語において、どのような文字でどのように表記するかを決めること"], answer:1,
 explain:"席次計画(地位計画)は、多言語社会において特定の言語に公用語などの社会的な地位・役割を与える計画です。"},

{id:"R3-12-2", tag:"R3 試験I 問題12 問2", cat:"言語政策:習得計画",
 text:"問2 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["普及","洗練化","標準化","汎用"], answer:0,
 explain:"習得計画(普及計画)は、教育などを通じてその言語の話者・使用者を増やす(普及させる)ことを目的とした計画であり、席次計画・実体計画の後に実施されます。"},

{id:"R3-12-3", tag:"R3 試験I 問題12 問3", cat:"日本語史:文字の導入",
 text:"問3 文章中の下線部Bに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本語を表しやすい単音文字が導入された。","神道を伝えるための文字が導入された。","当時の上位文化の文字が導入された。","体系化されたくさび型文字が導入された。"], answer:2,
 explain:"日本に初めて導入された文字である漢字は、当時の先進的な文化を持つ中国(上位文化)からもたらされたものです。"},

{id:"R3-12-4", tag:"R3 試験I 問題12 問4", cat:"日本語史:明治期の国語論",
 text:"問4 文章中の下線部Cに関して、どのようなことが議論されたか。当てはまらないものを、次の1〜4の中から一つ選べ。",
 choices:["漢字と仮名を使わずローマ字を用いること","日本固有の文化として方言を守ること","書き言葉を話し言葉に近づけること","教養を得た東京人の口語を標準語とすること"], answer:1,
 explain:"明治時代の国語国字問題では、ローマ字化論、言文一致(書き言葉を話し言葉に近づける)、標準語の制定(東京の教養層の言葉を基準とする)などが議論されました。一方、方言を守るという議論は、この時期の中心的な議論ではなく、むしろ標準語普及政策の中で方言はしばしば抑制の対象とされていました。"},

{id:"R3-12-5", tag:"R3 試験I 問題12 問5", cat:"日本語政策:常用漢字表改定",
 text:"問5 文章中の下線部Dに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「令」など、印刷と手書きの字形が異なるものは教科書体に統一した。","「岡」「茨」など、都道府県名に用いる漢字を追加した。","制定時の2,136字から1,945字に、字種の数を削減した。","「亜」に併記されていた「亞」などの旧字体を削除した。"], answer:1,
 explain:"2010年の常用漢字表改定では、「岡」「茨」「埼」など、都道府県名に用いられる漢字が新たに追加されました。なお、字種数はこの改定で1,945字から2,136字へと増加しており、削減されたわけではありません。"},

{id:"R3-13-1", tag:"R3 試験I 問題13 問1", cat:"語用論:交話的機能",
 text:"問題13 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日常生活においては,場面や目的,人間関係に応じて多種多様な機能や会話スタイルを使ってコミュニケーションが行われている。コミュニケーションの機能に目を向けると,指示的機能や交話的機能などが存在する。また,会話のスタイルに注目すると,ラポート・トークやレポート・トークといったスタイルの違いもある。このような多様なコミュニケーションの仕組みは,発話行為理論をはじめとする語用論的な枠組みにより理論的に理解することができる。\n日本語の会話の細部を見ると,スピーチレベルシフトが頻繁に観察される。また,疑問文を用いたストラテジーなどを会話中に織り交ぜるという現象も見られる。このようなストラテジーを駆使することにより,円滑なコミュニケーションが目指されている。\n\n問1 文章中の下線部A「交話的機能」に関して、主に交話的機能を担う会話の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["X:久しぶり、最近どう? / Y:元気だよ。最近寒いね。","X:この本、ちょっと借りてもいい? / Y:うん。もう読み終わったからいいよ。","X:ちょっとこの荷物運ぶの手伝ってくれない? / Y:ごめん、今忙しいんだよね。","X:来週ジャズのコンサートに行くんだけど、一緒にどう? / Y:いいね。行きたい。"], answer:0,
 explain:"交話的機能(ファティック機能)は、情報伝達そのものよりも、あいさつなどを通じて人間関係を維持・確認することを主目的とする機能です。「久しぶり、最近どう?」という挨拶的なやり取りは、この典型例です。"},

{id:"R3-13-2", tag:"R3 試験I 問題13 問2", cat:"社会言語学:ラポートトーク",
 text:"問2 文章中の下線部B「ラポート・トーク」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["情報の伝達を会話の主な目的とした会話スタイル","会話における心理的つながりに重きを置いた会話スタイル","ある特定の場面で使用される画一化された話し方","ある特定の人物像を思い浮かべることのできるような話し方"], answer:1,
 explain:"ラポート・トークは、情報伝達よりも、話し相手との心理的なつながりや関係性の構築を重視する会話スタイルです。"},

{id:"R3-13-3", tag:"R3 試験I 問題13 問3", cat:"語用論:発語内行為",
 text:"問3 文章中の下線部C「発話行為理論」における「発語内行為」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["話し手の発話を聞き手が字義通りに解釈する行為","話し手の発話によって聞き手に効力を及ぼす行為","話し手が聞き手に音声を使って言葉を発する行為","話し手が聞き手に発話を介して意図を伝達する行為"], answer:3,
 explain:"発話行為理論における発語内行為(illocutionary act)は、発話することによって、依頼・約束・警告といった話し手の意図(発話の力)を聞き手に伝達する行為を指します。"},

{id:"R3-13-4", tag:"R3 試験I 問題13 問4", cat:"社会言語学:スピーチレベルシフト",
 text:"問4 文章中の下線部D「スピーチレベルシフト」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["会話において、メッセージの実質的な意味を明確にする行為","会話において、言い換えによって誤りを修復する行為","会話において、言語形式の選択によって丁寧度を切り替える現象","会話において、話し手と聞き手の役割が交替する現象"], answer:2,
 explain:"スピーチレベルシフトは、一つの会話の中で、普通体と丁寧体といった言語形式(スピーチレベル)を切り替えることで、丁寧さや心理的距離を調整する現象です。"},

{id:"R3-13-5", tag:"R3 試験I 問題13 問5", cat:"語用論:疑問文のストラテジー",
 text:"問5 文章中の下線部E「疑問文を用いたストラテジー」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「普通そんな言い方するか?」という文は、非難の感情を表示する。","「彼は緊張していたんじゃないか」という文は、情報提供として機能する。","「そんなもの食えるか!」という文は、話し手の主張を強調して伝える。","「いったい誰にこんなことができるの?」という文は、情報要求を表す。"], answer:3,
 explain:"「いったい誰にこんなことができるの?」は、文字通りの情報を求める疑問文ではなく、「誰もこんなことはできない」という強い否定を暗示する修辞疑問文(反語)です。単純な情報要求を表すという記述は不適当です。"},

{id:"R3-14-1", tag:"R3 試験I 問題14 問1", cat:"日本語教育政策:文化庁の事業",
 text:"問題14 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n近年,日本語教育に関わる人材の活動の場が広がっている。文化庁は,毎年,「国内の日本語教育の概要」を発表している。令和元年度(2019年度)の調査では日本語教師等の数は,約(ア)人となっている。この調査からは日本語教師等の現状も分かる。\nまた,文化庁は,平成31年(2019年)に「日本語教育人材の養成・研修の在り方について」(報告)改定版をまとめ,日本語教育人材に求められる資質・能力を,「知識・技能・(イ)」に分けて詳述している。そして,日本語教育人材の役割を「日本語教師」「日本語教育コーディネーター」「日本語学習支援者」の三つに分類した。そのうち「日本語教師」については,「養成」「初任」「中堅」の三段階に整理し,段階ごとに必要な教育内容およびモデルカリキュラムを示した。\n\n問1 文章中の下線部A「文化庁」が行っている事業はどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["地域日本語教育スタートアッププログラム","地域国際化推進アドバイザー派遣","大規模汎用日本語データベース構築","外国人留学生在籍状況調査"], answer:0,
 explain:"文化庁は地域における日本語教育の体制整備を推進しており、「地域日本語教育スタートアッププログラム」はその代表的な事業です。地域国際化推進アドバイザー派遣や外国人留学生在籍状況調査などは他機関の事業です。"},

{id:"R3-14-2", tag:"R3 試験I 問題14 問2", cat:"日本語教育政策:日本語教師等の数",
 text:"問2 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["1万6千","2万6千","4万6千","6万6千"], answer:2,
 explain:"令和元年度(2019年度)の「国内の日本語教育の概要」によると、日本語教師等の数は約4万6千人とされています。"},

{id:"R3-14-3", tag:"R3 試験I 問題14 問3", cat:"日本語教育政策:日本語教師等の内訳",
 text:"問3 文章中の下線部Bに関して、令和元年度(2019年度)の国内の日本語教師等の数の特徴として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["年代別では「20代」「40代」「60代」のうち、「40代」が最も多い。","地域別では「関東」「中部・北陸」「近畿」「九州・沖縄」のうち、「関東」が最も多く、次いで「中部・北陸」が多い。","職務別では「ボランティアによる者」「非常勤による者」「常勤による者」のうち、「非常勤による者」が最も多い。","機関・施設等別では「国際交流協会」「大学等機関」「法務省告示機関」のうち、「法務省告示機関」が最も多い。"], answer:3,
 explain:"機関・施設等別に見ると、法務省告示機関(日本語学校等)に所属する日本語教師等が最も多くなっています。地域別では関東の次に多いのは近畿であり、職務別ではボランティアによる者が最も多い点も誤りです。"},

{id:"R3-14-4", tag:"R3 試験I 問題14 問4", cat:"日本語教育政策:日本語教育人材の資質・能力",
 text:"問4 文章中の(イ)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["態度","経験","語学力","適応力"], answer:0,
 explain:"「日本語教育人材の養成・研修の在り方について」(報告)では、日本語教育人材に求められる資質・能力を「知識」「技能」「態度」の三つの観点に整理して詳述しています。"},

{id:"R3-14-5", tag:"R3 試験I 問題14 問5", cat:"日本語教育政策:日本語教育人材の役割",
 text:"問5 文章中の下線部Cに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「日本語学習支援者」を、行政や地域の関係機関との連携・協力を担う者として示した。","「日本語学習支援者」を、日本語教師や日本語教育コーディネーターと共に日本語学習を促進する者として示した。","「日本語教師」を、日本語教育プログラムの運営および改善をする者として示した。","「日本語教師」を、日本語教育コーディネーターや日本語学習支援者に対する指導・助言を行う者として示した。"], answer:1,
 explain:"「日本語学習支援者」は、日本語教師や日本語教育コーディネーターと共に学習者の日本語学習を促進する者として位置づけられています。プログラムの運営・改善や指導・助言を担うのは「日本語教育コーディネーター」の役割です。"},

{id:"R3-15-1", tag:"R3 試験I 問題15 問1", cat:"日本語教育史:キリスト教宣教師",
 text:"問題15 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n外国語としての日本語学習の歴史は古く,『日本書紀』にもその記録を見ることができる。16世紀には,フランシスコ・ザビエルとともに(ア)の宣教師たちが来日し,布教に必要な日本語を学んだ。\n明治維新から第二次世界大戦までは,主に日本の植民地政策のもとで日本語教育が行われた。台湾において(イ)はグアン・メソッドを導入し,日本語教育の普及に努めた。また,朝鮮半島や満州においても日本語教育が行われた。一方,東京においても国際学友会などによって日本語教育が行われていた。\n終戦とともに,海外における日本語普及事業は全面的に撤退した。その後,日本の国際社会への復帰を経て,徐々に日本語教育事業が再開していった。\n\n問1 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["フランシスコ会","イエズス会","ロシア正教会","イギリス国教会"], answer:1,
 explain:"フランシスコ・ザビエルはイエズス会の宣教師であり、16世紀に来日したイエズス会の宣教師たちが布教のために日本語を学びました。"},

{id:"R3-15-2", tag:"R3 試験I 問題15 問2", cat:"日本語教育史:台湾でのグアン・メソッド",
 text:"問2 文章中の(イ)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["山口喜一郎","伊沢修二","上田万年","森有礼"], answer:0,
 explain:"台湾でグアン・メソッド(グアン式教授法)を導入し日本語教育の普及に努めたのは山口喜一郎です。伊沢修二は台湾総督府学務部長として教育制度の基礎を築いた人物として知られています。"},

{id:"R3-15-3", tag:"R3 試験I 問題15 問3", cat:"日本語教育史:朝鮮半島の日本語教育",
 text:"問3 文章中の下線部A「朝鮮半島」の日本語教育に携わった人物に関して、その人名と活動内容の最も適当な組み合わせを、次の1〜4の中から一つ選べ。\n1 時枝誠記 ― オーラルメソッドを応用した「問答法」という教授法を開発し、『標準日本語読本』を刊行した。\n2 大出正篤 ― 言語の本質を言語活動そのものにあるとした「言語過程説」を唱えた。\n3 嘉納治五郎 ― 媒介語を用いるなど、複数の教授法を混合した「速成式教授法」を開発した。\n4 岡倉由三郎 ― 朝鮮半島の最初の日本語教育機関である「官立日語学堂」の設立時に招聘され、日本語教育を推し進めた。",
 choices:["1の組み合わせ","2の組み合わせ","3の組み合わせ","4の組み合わせ"], answer:3,
 explain:"岡倉由三郎は朝鮮半島最初の日本語教育機関「官立日語学堂」の設立時に招聘され、日本語教育を推し進めました。時枝誠記は「言語過程説」を唱えた国語学者、嘉納治五郎は柔道家・教育者として弘文学院を設立した人物であり、それぞれ活動内容が入れ替わっています。"},

{id:"R3-15-4", tag:"R3 試験I 問題15 問4", cat:"日本語教育史:国際学友会",
 text:"問4 文章中の下線部B「国際学友会」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["宣教師たちを対象とする日本語学校を創設し、多くの教材を作成した。","「南方特別留学生」など東南アジアからの留学生を受け入れた。","東南アジアに派遣される「南方派遣教員」の養成講座を開設した。","魯迅をはじめとした、その後の中国で活躍する人材を多く輩出した。"], answer:1,
 explain:"国際学友会は東京に設立され、「南方特別留学生」制度などにより東南アジアからの留学生を受け入れて日本語教育を行いました。"},

{id:"R3-15-5", tag:"R3 試験I 問題15 問5", cat:"日本語教育史:戦後の日本語普及事業",
 text:"問5 文章中の下線部Cに関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["国費外国人留学生招致制度が発足し、東京外国語大学と大阪外国語大学に留学生別科が設置された。","インドネシア賠償留学生制度が発足し、5年間にわたり毎年100名の留学生を受け入れた。","国際交流基金の文化交流事業により、青年海外協力隊として日本語教育専門家が派遣された。","コロンボ計画において、海外技術協力事業団から派遣専門家として日本語教師が派遣された。"], answer:2,
 explain:"青年海外協力隊は国際協力機構(JICA)の事業であり、国際交流基金の事業ではありません。国際交流基金は日本語専門家の海外派遣などを行いますが、青年海外協力隊とは異なる枠組みです。"},

{id:"R3-16-1", tag:"R3 試験III 問題1 問1", cat:"音声学:アメリカ構造主義言語学",
 text:"問題1 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n音声指導には様々な方法がある。時代を追って見ていくと,1930年代頃に起こったアメリカ構造主義言語学は様々な教授法の理論的背景となっている。その一つであるオーディオ・リンガル法による音声指導の方法として,ミニマルペア練習があり,現在でも教室活動として広く行われている。また,1960年代頃からヨーロッパの外国語教育に取り入れられた音声の教授法として「VT法」(Verbo-Tonal Method)が挙げられる。VT法は,「言語聴覚論」を背景とし,日本語教育においても方法論として取り入れられた。\n実際の指導の際には,このような音声指導の方法だけでなく,日本語の音韻の特徴や学習者の母語の音韻の特徴を知っておく必要がある。近年では,音声の自律的学習能力を高めることを目的とし,「自己モニター」を利用した音声教育も広く行われるようになっている。\n\n問1 文章中の下線部A「アメリカ構造主義言語学」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["人間には様々な認知的機能と同様に言語を獲得する機能が備わっていると考える。","言語は、知覚、カテゴリー化、記憶などの認知能力に動機づけられて成立していると考える。","未知の言語に対し、当該言語の音声を最小単位まで分析し、体系化を行う。","言語を歴史的に比較することによって、言語の系統関係を明らかにする。"], answer:2,
 explain:"アメリカ構造主義言語学は、未知の言語(特に文字を持たない先住民言語など)を対象に、その音声を最小単位まで分析し記述・体系化することを重視した言語学の立場です。1と2は認知言語学、4は比較言語学の立場です。"},

{id:"R3-16-2", tag:"R3 試験III 問題1 問2", cat:"音声学:ミニマルペア",
 text:"問2 文章中の下線部B「ミニマルペア」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「個体」と「広大」","「悪い」と「わりー」","「行ったの」と「行かなかったよ」","「知らない」と「死なない」"], answer:3,
 explain:"ミニマルペアとは、1箇所の音の違いだけで意味が異なる語のペアのことです。「知らない」と「死なない」は「し」と「し」以降の子音部分(sh/n)一箇所の違いのみで意味が変わる好例です。"},

{id:"R3-16-3", tag:"R3 試験III 問題1 問3", cat:"音声学:VT法",
 text:"問3 文章中の下線部C「VT法」による音声指導の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["身ぶりを付けながらわらべ歌を唱えさせ、拍感覚を意識しながら発音させる。","ティーチャー・トークにより、学習者にとって分かりやすい発音でモデルを示す。","音声分析ソフトを使い、モデル音声のイントネーションを視覚的に提示する。","模範となる音を示し、カラーチャートを用いて学習者に発話を促す。"], answer:0,
 explain:"VT法(Verbo-Tonal Method)は身体の動きやリズムを使って韻律(プロソディー)を体感的に習得させる指導法で、身ぶりを付けてわらべ歌を唱えさせ拍感覚を意識させる活動はその典型例です。"},

{id:"R3-16-4", tag:"R3 試験III 問題1 問4", cat:"音声学:日本語の音韻特徴",
 text:"問4 文章中の下線部D「日本語の音韻の特徴」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["母音連続が長音化することがある。","音節は閉音節が中心である。","拗音は2文字で表され2拍になる。","広母音に分類される母音が多い。"], answer:0,
 explain:"日本語では「おかあさん」のように同じ母音が連続すると長音化する現象が見られます。日本語の音節は開音節が中心であり、拗音(きゃ等)は2文字で表記されますが1拍として数えられ、広母音(a)は5母音のうち1つのみです。"},

{id:"R3-16-5", tag:"R3 試験III 問題1 問5", cat:"音声学:自己モニター",
 text:"問5 文章中の下線部E「「自己モニター」を利用した音声教育」において重要なこととして不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["教師が学習者に自身の発音のどこが問題か認識させること","教師が学習者に教師自身が持つ発音基準を記憶させること","教師が学習者に自己評価を通して発音を自己修正させること","教師が学習者に独自の発音基準を模索させること"], answer:1,
 explain:"自己モニターを利用した音声教育の目的は、学習者が自律的に自分の発音を評価・修正できる力を育てることです。教師自身の発音基準をそのまま記憶させることは自律的な学習能力の育成にはつながらず、不適当です。"},

{id:"R3-16-6", tag:"R3 試験III 問題2 問1", cat:"文法:数詞と数量表現",
 text:"問題2 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n事物の数や量,順序を表す語句を数詞という。例えば「3人」は人間の数を表し,「3」の部分を本数詞,「人」の部分を助数詞と呼ぶ。数詞の捉え方は様々で,数字で表す名詞だけではなく,数字で表さない数量を表す名詞や副詞を含める場合もある。\n数詞には名詞を修飾する名詞用法と副詞として使われる副詞用法がある。どちらの用法でも同じような意味を表す場合が多いが,名詞用法と副詞用法のいずれかでしか成立しない場合もある。\n日本語には助数詞が600以上もあると言われる。ある名詞に対してどのような助数詞を使うかは,時代とともに変化する。また,外来語の流入によって外来語の助数詞が出現することもある。\n本数詞と助数詞の組み合わせによって音変化があり,学習者にとって難しい場合がある。そのため,教師は学習者に音変化を全て暗記させるのではなく,そこに一定の法則性があることを理解させるとよい。\n\n問1 文章中の下線部A「数字で表さない数量を表す名詞や副詞」の例として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["大部分","どちらも","たくさん","いくらか"], answer:1,
 explain:"「大部分」「たくさん」「いくらか」はいずれも数量を表す名詞・副詞ですが、「どちらも」は数量ではなく対象の全体を指す表現であり、数量を表すものとして不適当です。"},

{id:"R3-16-7", tag:"R3 試験III 問題2 問2", cat:"文法:数詞の名詞用法・副詞用法",
 text:"問2 文章中の下線部B「名詞用法と副詞用法のいずれかでしか成立しない」数詞の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["本を3冊読んだ。","子どもを5人産んだ。","運動を2時間行った。","点数が10点上がった。"], answer:3,
 explain:"「点数が10点上がった」の「10点」は名詞的に「10点という点数」を表す用法としてしか成立せず、「10点上がる(副詞的)」という言い方には別の解釈が必要になります。他の例は名詞用法・副詞用法どちらでも自然に使えます。"},

{id:"R3-16-8", tag:"R3 試験III 問題2 問3", cat:"語彙:助数詞の変遷",
 text:"問3 文章中の下線部Cに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["イカの数え方は「1匹、2匹」から「1杯、2杯」に変化しつつある。","ウサギの数え方は「1羽、2羽」から「1匹、2匹」に変化しつつある。","タイヤの数え方は「1輪、2輪」から「1本、2本」に変化しつつある。","豆の数え方は「1粒、2粒」から「1グラム、2グラム」に変化しつつある。"], answer:1,
 explain:"実際には、ウサギは伝統的に「1羽、2羽」と数えられてきましたが、動物として捉える意識の高まりから「1匹、2匹」で数える言い方が広がりつつあります。他の選択肢はいずれも助数詞の変化の方向が実際とは逆、または不正確な記述です。"},

{id:"R3-16-9", tag:"R3 試験III 問題2 問4", cat:"語彙:外来語の助数詞",
 text:"問4 文章中の下線部D「外来語の助数詞」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["外来語の助数詞は和語の本数詞と組み合わせられない。","外来語の助数詞は英語の本数詞と組み合わせられない。","外来語の助数詞は単独で名詞として使用できない。","外来語の助数詞には連濁するものはない。"], answer:3,
 explain:"「パーセント」「メートル」などの外来語助数詞は連濁(濁音化)を起こさない点が和語の助数詞と異なる特徴です。和語の本数詞との組み合わせ(3パーセント等)は可能であり、単独で名詞として使う例(1パック買う等)もあります。"},

{id:"R3-16-10", tag:"R3 試験III 問題2 問5", cat:"音声学:数詞の音変化",
 text:"問5 文章中の下線部E「一定の法則性」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["本数詞「1」はカ行で始まる助数詞の場合、本数詞は変化しないが、助数詞は促音化する。","本数詞「3」はサ行で始まる助数詞の場合、本数詞は変化しないが、助数詞は連濁が起こる。","本数詞「6」はハ行で始まる助数詞の場合、本数詞は促音化し、助数詞は半濁音になる。","本数詞「8」はタ行で始まる助数詞の場合、本数詞が撥音化するものとしないものが両方使われる。"], answer:2,
 explain:"「6」+ハ行助数詞(例:6杯)の場合、本数詞「ろく」が促音化して「ろっぱい」のように助数詞側が半濁音(ぱ行)になるという規則的な音変化が見られます。"},

{id:"R3-16-11", tag:"R3 試験III 問題3 問1", cat:"文法:イ形容詞・ナ形容詞の分類",
 text:"問題3 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語教育においては,形容詞は,イ形容詞とナ形容詞に分類される。これは,(ア)による分類である。イ形容詞とナ形容詞を混同すると誤用が生まれる可能性がある。\n形容詞には,活用の一部が特殊なものがある。例えば,「(イ)」は,ナ形容詞であるが連体形が例外である。「(ウ)」は,単独では名詞の前で用いることができない。また,「大きな」「小さな」は,名詞を修飾する際に「〜な+名詞」になるが,一般的な国語辞典では,連体詞とされている。\n形容詞は意味的に属性形容詞と感情形容詞に分類され,感情形容詞には,人称制限と呼ばれる現象が見られる。これらの他にも指導の際に注意が必要な形容詞の特性がある。\n\n問1 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["形態","機能","形態と意味","機能と意味"], answer:0,
 explain:"イ形容詞・ナ形容詞という分類は、語末の活用語尾(「い」で終わるか「だ」で終わるか)という「形態」に基づく分類です。意味的な基準ではなく形態的な基準による分類である点がポイントです。"},

{id:"R3-16-12", tag:"R3 試験III 問題3 問2", cat:"文法:形容詞の誤用",
 text:"問2 文章中の下線部Aに関して、イ形容詞とナ形容詞の混同により起こった誤用の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["この果物は、ビタミンCが豊富だので、風邪の予防に効果があります。","この店のしょうゆラーメンは、安い、おいしいそうです。","山頂までの登山は、精神的にも肉体的にも苦しいでした。","他人の話をすぐに信じるのは、いくありません。"], answer:2,
 explain:"「苦しいでした」は、イ形容詞「苦しい」にナ形容詞・名詞述語で使う過去形「〜でした」を直接続けてしまった誤用で、正しくは「苦しかったです」となります。イ形容詞をナ形容詞と同じ活用パターンで扱ってしまった、両者の混同による典型的な誤用です。"},

{id:"R3-16-13", tag:"R3 試験III 問題3 問3", cat:"文法:特殊な活用を持つ形容詞",
 text:"問3 文章中の(イ)と(ウ)に入れるのに最も適当な組み合わせを、次の1〜4の中から一つ選べ。\n1 (イ)同じだ (ウ)多い\n2 (イ)同じだ (ウ)面白い\n3 (イ)いろいろだ (ウ)多い\n4 (イ)いろいろだ (ウ)面白い",
 choices:["1の組み合わせ","2の組み合わせ","3の組み合わせ","4の組み合わせ"], answer:0,
 explain:"「同じだ」はナ形容詞でありながら、連体形が「同じな」ではなく「同じ」になる例外的な活用を持ちます。また「多い」はイ形容詞ですが、「多い本」のように単独で名詞を直接修飾することができず、「多くの本」という形を取る特殊な語です。"},

{id:"R3-16-14", tag:"R3 試験III 問題3 問4", cat:"文法:連体詞としての「大きな」「小さな」",
 text:"問4 文章中の下線部Bの理由として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「大きな」「小さな」は「大きい」「小さい」というイ形容詞があるため","「大きな」「小さな」はイ形容詞と同じように活用するため","「大きな」「小さな」はナ形容詞とは異なり、活用しないため","「大きな」「小さな」は連体形と終止形しか活用形がないため"], answer:2,
 explain:"「大きな」「小さな」は「大きな本」のように連体修飾専用で使われ、活用変化をしない(終止形や仮定形などがない)ため、国語辞典では形容詞ではなく連体詞として扱われています。"},

{id:"R3-16-15", tag:"R3 試験III 問題3 問5", cat:"文法:形容詞の対義関係",
 text:"問5 文章中の下線部C「指導の際に注意が必要な形容詞の特性」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["形容詞述語は、名詞述語と異なり、丁寧体の否定形が一つである。","対義語が形容詞でなく、動詞になるイ形容詞がある。","変化を表す「なる」を付けることができないイ形容詞がある。","伝聞を表す「そうだ」を付けることができない形容詞がある。"], answer:1,
 explain:"「ない」の対義語が「ある」という動詞になるように、対義語が形容詞ではなく動詞になる形容詞が存在します。このような非対称性は学習者にとって分かりにくく、指導上の注意点となります。"},

{id:"R3-16-16", tag:"R3 試験III 問題4 問1", cat:"語彙:慣用句と共起制約",
 text:"問題4 次の文章を読み、下の問い(問1〜5)に答えよ。\n\nある語がどのような語と共起するかには,一定の制約がある。語と語の組み合わせが特別な慣用的意味を表す場合は,ひとまとまりのものとして教える必要がある。\nまた,共起関係は文法的な関係を考えるうえでも重要である。例えば,副詞的成分「どうやら」は(ア)の意味のモダリティと結びつきが強い。このような副詞的成分と述語との関係は(イ)と呼ばれることがある。\nさらに,文法形式の意味は,共起する動詞のタイプと深く関係している。動詞のタイプ以外にも,使役を表す「〜(さ)せる」の意味は,後続する語によって決定されることがある。多義語の意味の違いを説明する際にも,いくつもの意味や用法を並べて提示するだけではなく,共起する語の意味的な違いを意識させることが重要である。\n\n問1 文章中の下線部Aに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「気が短い」は慣用的な意味を持つが、「気が長い」は慣用的な意味を持たない。","「手を切る」は慣用的な意味を持つが、「手を焼く」は慣用的な意味を持たない。","「襟を正す」は慣用的な意味を持つが、「襟を繕う」は慣用的な意味を持たない。","「腕が鳴る」は慣用的な意味を持つが、「腕が立つ」は慣用的な意味を持たない。"], answer:2,
 explain:"「襟を正す」は「態度をきちんとする」という慣用的意味を持ちますが、「襟を繕う」はそのような特別な慣用的意味を持たず、字義通りの意味で使われます。他の選択肢はどちらも慣用的な意味を持っています。"},

{id:"R3-16-17", tag:"R3 試験III 問題4 問2", cat:"文法:副詞と述語の呼応",
 text:"問2 文章中の(ア)と(イ)に入れるのに最も適当な組み合わせを、次の1〜4の中から一つ選べ。\n1 (ア)推定 (イ)照応\n2 (ア)推定 (イ)呼応\n3 (ア)様態 (イ)照応\n4 (ア)様態 (イ)呼応",
 choices:["1の組み合わせ","2の組み合わせ","3の組み合わせ","4の組み合わせ"], answer:1,
 explain:"「どうやら」は「どうやら〜らしい」のように推定のモダリティと強く結びつく副詞です。副詞と文末の述語形式が特定の組み合わせを要求する関係は「呼応」と呼ばれます。"},

{id:"R3-16-18", tag:"R3 試験III 問題4 問3", cat:"文法:文法形式と動詞タイプの共起",
 text:"問3 文章中の下線部Bに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「〜(よ)う」が勧誘の意味を表すのは、意志動詞と共起したときに限られる。","「〜てある」が結果の残存の意味を表すのは、自動詞と共起したときに限られる。","受身の「〜(ら)れる」がはた迷惑の意味を表すのは、自動詞と共起したときに限られる。","「〜てしまう」が後悔していることを表すのは、無意志動詞と共起したときに限られる。"], answer:0,
 explain:"「〜(よ)う」が勧誘(一緒に〜しよう)の意味になるのは、意志動詞(行く、食べる等)と共起する場合に限られます。無意志動詞では勧誘の意味にはなりません。"},

{id:"R3-16-19", tag:"R3 試験III 問題4 問4", cat:"文法:使役形の意味",
 text:"問4 文章中の下線部Cに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「〜てある」と共起すると、「経験」の意味を表しやすい。","「〜てしまう」と共起すると、「強制」の意味を表しやすい。","受身の「〜(ら)れる」と共起すると、「放任」の意味を表しやすい。","「〜てやる」と共起すると、「許可・許容」の意味を表しやすい。"], answer:3,
 explain:"使役形「〜(さ)せる」が「〜てやる」と共起する(例:「休ませてやる」)場合、単なる強制ではなく相手の希望を許す「許可・許容」の意味を表しやすくなります。"},

{id:"R3-16-20", tag:"R3 試験III 問題4 問5", cat:"語彙:多義語と共起対象",
 text:"問5 文章中の下線部D「多義語の意味の違い」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「なめる」という語は、ヲ格対象が「飴、砂糖」などの具体的な名詞のときと「練習、試験」などの抽象的な名詞のときでは、別義になる。","「ほめる」という語は、ヲ格対象が「子ども、作品」などの具体的な名詞のときと「態度、性格」などの抽象的な名詞のときでは、別義になる。","「明るい」という語は、「部屋」などの具体的な名詞を修飾するときと「性格、話題」などの抽象的な名詞を修飾するときでは、別義になる。","「重い」という語は、「荷物」などの具体的な名詞を修飾するときと「立場、責任」などの抽象的な名詞を修飾するときでは、別義になる。"], answer:1,
 explain:"「ほめる」は対象が具体的な名詞(子ども、作品)でも抽象的な名詞(態度、性格)でも、基本的に「高く評価して言葉に表す」という同じ意味で使われ、別義にはなりません。他の語は対象の違いにより意味が変わる多義語の例です。"},

{id:"R3-16-21", tag:"R3 試験III 問題5 問1", cat:"教授法:場面による文型導入",
 text:"問題5 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n次の資料と文章を読み,後の問い(問1〜5)に答えよ。<資料>は,X先生の授業に関するメモである。\n新人のX先生が,同じクラスの授業を翌日担当する先輩のY先生に,授業の引き継ぎをしている。\n\n<資料> X先生の授業に関するメモ\n学習者:初中級レベル 10名\n授業時間:60分\n授業目標:丁寧に許可を求めることができる。\n学習項目:〜(さ)せていただけませんか\n指導方針:オーディオ・リンガル・メソッドを活用しつつ,発展的な練習も行う。\n活動の流れ:1 ウォーミングアップ・使役形の復習 2 場面・学習項目の導入 3 文型練習 4 会話練習\n\nX先生:Y先生,明日,使役形の復習をお願いできませんか。\nY先生:いいですよ。何かあったんですか。\nX先生:はい。応用練習として,上司と部下という設定で自由度を高めた会話練習をしてみたんですが,部下が許可を求める場面で,使役形を使わずに「休んでいただけませんか」になってしまう学生がいて。復習したときはできていたんですけど,まだ形が定着していないんだと思います。「休みます」を「休ませます」と言わせるような練習がもっと必要かもしれません。\nY先生:なるほど。それもそうですが,使役表現は学習者にとって難しい項目の一つですからね。活用練習もいいんですけど,もう少し使役表現のインプット理解に重点を置いた活動を取り入れてみましょうか。\nX先生:形の定着の問題だけではないんですね。Y先生,今度,授業を見せていただけませんか。それから,Y先生の授業内での媒介語の使い方も参考にさせていただきたいんですが。\nY先生:ええ,いいですよ。\n\n問1 <資料>の下線部A「場面・学習項目の導入」を会話文を用いて行う際の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["会話場面のイラストなどの視覚情報を与えないことで、導入する文型の音声情報に注目させる。","会話文を読み上げる速度や声色を変えないことで、導入する文型を聞き取りやすくする。","導入する文型が入った会話文を聞かせるのは1回に限定し、学習者が集中して聞くことができるようにする。","新出文型以外は既習の項目で構成された会話文を聞かせ、導入する文型の意味・用法が類推できるようにする。"], answer:3,
 explain:"新出文型の意味・用法を場面から自然に推測させるためには、それ以外の部分は既習の語彙・文型で構成された会話文を用いることが効果的です。イラストなどの視覚情報を活用し、状況に応じて声色を変え、繰り返し聞かせることも一般的には有効な指導法です。"},

{id:"R3-16-22", tag:"R3 試験III 問題5 問2", cat:"教授法:パターンプラクティスの種類",
 text:"問2 文章中の下線部Bのような練習を何と言うか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["応答練習","変換練習","拡張練習","代入練習"], answer:1,
 explain:"「休みます」という文を「休ませます」という使役形に変える練習は、文型を別の形に変換させる「変換練習」に当たります。"},

{id:"R3-16-23", tag:"R3 試験III 問題5 問3", cat:"文法:使役表現の難しさ",
 text:"問3 文章中の下線部Cの理由として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["主語が有情物か非情物かによって制約があるため","行為者と被行為者の関係が把握しにくいため","自動詞か他動詞かによって動作の主体を示す助詞が変わるため","使役形と形や意味、用法がよく似た自動詞があるため"], answer:3,
 explain:"使役形は「〜(さ)せる」という規則的な活用によって作られる文法形式であり、特定の自動詞と形や意味が似ていることそのものは、使役表現の理解や産出が難しい理由として一般化できるものではありません。他の選択肢(有情物・非情物の制約、行為者と被行為者の関係の把握、自他動詞による格助詞の違い)はいずれも使役表現の指導上よく挙げられる困難点です。"},

{id:"R3-16-24", tag:"R3 試験III 問題5 問4", cat:"教授法:インプット理解活動",
 text:"問4 文章中の下線部D「インプット理解に重点を置いた活動」として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習項目が入った文を示し、その文の意味に合う絵を選ばせる。","学習項目が入った会話を黙読させ、内容に関するクイズに○×で答えさせる。","学習項目が入った短い文を2、3文聞かせ、ディクテーションさせる。","学習項目を使って学習者自身のことを尋ね、「はい」か「いいえ」で答えさせる。"], answer:2,
 explain:"ディクテーション(書き取り)は音を正確に文字化する技能を問う活動であり、学習項目の意味理解というよりは音声知覚・表記の技能を問う産出寄りの活動です。他の3つは理解(意味とのマッチングや読解)に重点を置いた活動です。"},

{id:"R3-16-25", tag:"R3 試験III 問題5 問5", cat:"教授法:媒介語の使用",
 text:"問5 文章中の下線部E「授業内での媒介語の使い方」に関して、媒介語の使用が効果的なケースとして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["社会的・文化的背景について説明を行うとき、理解が深まるように媒介語で説明を加える。","教室活動に関する定型的な指示を行うとき、素早く的確に伝えるために媒介語を使用する。","学習者の理解の負担を減らしたいとき、教室内で最も多い学習者の母語を媒介語に定める。","学習者の発話の間違いを防ぎたいとき、学習者が発話している最中に媒介語でヒントを与える。"], answer:0,
 explain:"文化的背景など目標言語だけでは十分に伝えにくい抽象的・専門的な内容を説明する際に媒介語を補助的に使うことは効果的です。定型的な指示や、多数派の母語だけを媒介語にすること、発話中の割り込みは、学習機会を減らしたり他の学習者を疎外したりする恐れがあり不適当です。"},

{id:"R3-16-26", tag:"R3 試験III 問題6 問1", cat:"教授法:CEFRのレベル記述",
 text:"問題6 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n次の資料を読み,下の問い(問1〜5)に答えよ。<資料>は授業の概要である。\n\n<資料> 授業の概要\n学習者:CEFR B1レベル\n到達目標:・旅行先で,お勧めの場所や店などの詳しい情報について質問することができる。・自分が住んでいる町のお勧めの場所や店などに関する質問に対して答えることができる。\n必要な言葉や表現:・初対面の人に話しかけるときの言葉や表現 ・相手に何かを尋ねるときの言葉や表現 ・理由を述べるときの言葉や表現(例:お勧めの場所の説明)\n授業の流れ:①ウォーミングアップ ②モデル会話を聞く ③表現や文型の確認 ④モデル会話のシャドーイング ⑤会話のペア練習 ⑥ロールプレイ\n\n問1 <資料>の下線部A「CEFR B1レベル」に関する自己評価表の記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["単純な日常の仕事の中で、情報の直接のやり取りが必要ならば、身近な話題や活動について話し合いができる。","直接必要なことやごく身近な話題についての簡単な質問なら、聞いたり答えたりできる。","身近なコンテクストの議論に積極的に参加し、自分の意見を説明し、弁明できる。","日常生活に直接関係のあることや個人的な関心事について、準備なしで会話に入ることができる。"], answer:3,
 explain:"CEFRのB1レベル(自立した言語使用者の下位区分)は「日常生活に直接関係のあることや個人的な関心事について、準備なしで会話に入ることができる」と記述されています。選択肢1はB1のもう一段階、2はA2、3はB2の記述に近いものです。"},

{id:"R3-16-27", tag:"R3 試験III 問題6 問2", cat:"教授法:社会言語能力",
 text:"問2 <資料>の下線部B「到達目標」を達成するために必要な「社会言語能力」として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["初対面の人と話すときのルールを理解し、場面に適した表現を使う能力","初対面の人に尋ねて得た情報が理解できなかったときに、聞き返す能力","初対面の人に理由を述べるときに、順序立てて話を進める能力","初対面の人が理解できるように、正確な表現で尋ねる能力"], answer:0,
 explain:"社会言語能力とは、場面や相手との関係に応じて適切な言語使用ができる能力を指します。初対面の人と話すときの社会的なルールを理解し、場面にふさわしい表現を選択する能力がこれに当たります。聞き返しや話の順序立て、正確な表現の使用は主に方略的能力や言語能力に関わります。"},

{id:"R3-16-28", tag:"R3 試験III 問題6 問3", cat:"教授法:授業のウォーミングアップ",
 text:"問3 <資料>の下線部C「ウォーミングアップ」で行うこととして不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["授業で行う活動の目的を伝える。","新出文型の意味を推測させる。","話題に関する背景知識を活性化させる。","話題に関する語彙を導入する。"], answer:1,
 explain:"ウォーミングアップは授業の導入段階として、活動の目的の提示や背景知識の活性化、関連語彙の導入などを行う場です。新出文型の意味を推測させることは、その後の「モデル会話を聞く」段階以降で行う活動であり、ウォーミングアップの段階では行いません。"},

{id:"R3-16-29", tag:"R3 試験III 問題6 問4", cat:"教授法:シャドーイング",
 text:"問4 <資料>の下線部D「モデル会話のシャドーイング」を行う目的として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者の日本語レベルよりも高いレベルの発話を正確に理解させるため","モデル会話で使われている語句を効率的に記憶させるため","正しいイントネーションや発音を身につけさせるため","音のつながりやスピードに慣れさせ、リスニング能力を伸ばすため"], answer:0,
 explain:"シャドーイングは聞いた音声にすぐ続いて声に出す練習で、発音・イントネーションの習得や語句の記憶、リスニング力向上を目的として行われます。教材は基本的に学習者のレベルに合ったものを使用するため、レベルより高い発話を正確に理解させることは主目的ではありません。"},

{id:"R3-16-30", tag:"R3 試験III 問題6 問5", cat:"教授法:ロールプレイの設計",
 text:"問5 <資料>の下線部E「ロールプレイ」で次のロールカードを作成した。この二つのロールカードに関する記述として最も適当なものを、下の1〜4の中から一つ選べ。\nロールカードX:あなたの町は旅行先として有名です。歩いていると、知らない人に声をかけられました。その人からの質問に答えてください。※使用する語彙・文型:有名な、人気がある、おすすめ、〜といいですよ\nロールカードY:あなたは旅行をしています。旅行先でそこに住んでいる人を見つけました。おすすめの場所や店などを聞いてください。※使用する語彙・文型:すみません、おすすめ、人気がある、〜ていただけませんか",
 choices:["XとYのロールカードには情報差があり、表現の選択権が制限されていない。","XとYのロールカードには情報差があり、表現の選択権が制限されている。","XとYのロールカードには情報差がなく、表現の選択権が制限されていない。","XとYのロールカードには情報差がなく、表現の選択権が制限されている。"], answer:1,
 explain:"ロールカードXとYでは、Xが地元の情報を持ちYがそれを尋ねるという情報差(インフォメーションギャップ)が設定されています。一方で使用する語彙・文型が指定されているため、表現の選択権は制限されています。"},

{id:"R3-16-31", tag:"R3 試験III 問題7 問1", cat:"日本語教育:JSP教育",
 text:"問題7 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n近年,日本語教育では学習者の多様化が進んでいる。そのため特定の目的のための日本語「JSP」(Japanese for Specific Purposes)の教育が注目されている。「JSP」の教育では,目標言語調査などを行い,学習目的に合わせた教育を進める。例えば,業務で日本語を必要とするビジネスパーソンの教育ではシミュレーションなどの活動が行われる。地域社会に定住する生活者への日本語支援では生活場面に即した活動も行われる。また,児童生徒に対しては,教科学習のための日本語も指導する。このように,様々な学習者に対応した日本語教育が求められている。\n\n問1 文章中の下線部A「『JSP』(Japanese for Specific Purposes)の教育」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["自己評価能力を育成する必要があるため、学習者の周囲の関係者は評価に関わらず、学習者と教師で評価を行う。","学習者の日本語での活動範囲を広げるため、四技能をバランスよく伸ばせるようにコースを組み立てる。","学習者のニーズに合った教育を行うため、学習者主導のコースにし、学習目標や学習項目の設定にも学習者を関与させる。","現場で役立つ表現を身につけさせるため、分野別の市販教材を使用し、生教材を活用することは避ける。"], answer:2,
 explain:"JSP教育は特定の目的を持つ学習者のニーズに合わせて行う教育であり、学習者を主体としたコース設計、目標や項目設定への学習者の関与が重視されます。四技能を均等に伸ばすことよりも必要な技能に重点を置き、生教材の活用も積極的に行われます。"},

{id:"R3-16-32", tag:"R3 試験III 問題7 問2", cat:"日本語教育:目標言語調査",
 text:"問2 文章中の下線部B「目標言語調査」の方法として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["外国人児童生徒の教育を行うために、在籍学校の担任に聞き取り調査をする。","自動車開発エンジニアの教育を行うために、勤務先の同僚との会話を許可を得たうえで録画し分析する。","外国人研究者の教育を行うために、所属研究室の教員から専門用語のリストの提供を受ける。","在留資格「家族滞在」で来日した者の教育を行うために、母語や外国語の学習歴の情報を得る。"], answer:3,
 explain:"目標言語調査は、学習者が実際に使用する場面でどのような日本語が必要かを調べる調査です。母語や外国語の学習歴の情報は学習者の背景情報(レディネス調査)であり、目標言語調査には当たりません。"},

{id:"R3-16-33", tag:"R3 試験III 問題7 問3", cat:"教授法:シミュレーション活動",
 text:"問3 文章中の下線部C「シミュレーション」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["取引先との商談場面におけるモデル会話を暗記し、クラスメートとペアになってリピート練習をする。","日本の会社で働くことのメリットとデメリットについて発表し、クラスメートからよかった点、改善点などのコメントをもらう。","クラスメートを同僚に見立て、ある人物についての情報が書かれたカードを見ながらクラスメートに質問し、カードの人物を見つけ出すことを競う。","クラスメート全員に経営者、音楽講師、IT技術者の役を割り振り、オンライン音楽教室の立ち上げを目標に議論する。"], answer:3,
 explain:"シミュレーションは、現実に近い状況設定の中で複数の参加者がそれぞれ役割を持ち、共通の目標に向けて自由にやり取りを行う活動です。役割を割り振り具体的な目標(立ち上げ)に向けて議論する活動がこれに該当します。"},

{id:"R3-16-34", tag:"R3 試験III 問題7 問4", cat:"日本語教育:生活者としての外国人への日本語教育",
 text:"問4 文章中の下線部D「生活者への日本語支援」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["人間関係の構築においては、気持ちを伝える語の重要度が高く、「少ない」「若い」より「嬉しい」「欲しい」のような語が重視される。","ポスターの「注意」や道路標識の「止まれ」といった語は生命に関わる語であるため、読み書きができるようにする。","学習者にとって必要な日本語が正確に把握できるので、地域で生活を共にする日本人が教授者として指導を行う。","日常生活で行う口頭コミュニケーションの成否は文型の正しさに依存するところが大きいため、教室で誤りを指摘する必要がある。"], answer:0,
 explain:"生活者としての外国人への日本語支援では、実生活で人間関係を築くために必要なコミュニケーション能力の育成が重視され、感情や気持ちを伝える語彙が重要とされます。安全に関わる語の読み書き優先や、日本人であれば誰でも教授できるという考え方、文型の正確さの過度な重視は適切ではありません。"},

{id:"R3-16-35", tag:"R3 試験III 問題7 問5", cat:"日本語教育:児童生徒への日本語指導",
 text:"問5 文章中の下線部E「児童生徒」に対する日本語指導に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["入り込み指導では、個別の学習到達度を設定し学習活動を行うため、個別指導の形態で実施するようにする。","取り出し指導では、落ち着いて学習できる状況を確保するため、認知発達や自尊心、人間関係を考慮して同学年でグループを作るようにする。","読解の指導では、教科内容を理解させる必要があるため、大意をつかむ通読よりも、細部まで読み取る精読を重点的に行うようにする。","作文の指導では、書字力を向上させる必要があるため、内容に関する指導と文字を書く指導を同時期に行うようにする。"], answer:1,
 explain:"取り出し指導では、対象児童生徒が落ち着いて学習に取り組めるよう、認知発達の段階や自尊心、人間関係などに配慮してグループ編成を行うことが重要です。入り込み指導は通常クラス内で個別支援を行う形態を取り、精読の重視や書字と内容指導の一体化は必ずしも適切とは限りません。"},

{id:"R3-16-36", tag:"R3 試験III 問題8 問1", cat:"評価:プレースメント・テスト",
 text:"問題8 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語の四技能を学ぶ総合コースでは,コースの開始時から終了時に至るまで様々なテストを実施する。例えば,コースの開始時にはプレースメント・テストを実施し,その結果をクラス分けに利用する。また,コースの実施中には小テスト<資料1>や中間テストを行う。さらに,コースの終了時には学習した内容の理解を確認するために,期末テストを行う。テストの出題形式には,多肢選択式や記述式<資料2>などがある。テストを行った際には,テストの得点について識別力の観点から分析し問題の質を検証することで,その後の指導に役立てることができる。\n\n<資料1>\n( )の中の動詞を適切な形にして書きなさい。\n①ご飯を(食べます→ )とき、「ごちそうさま」と言います。\n②学校に(行きます→ )とき、いつも電車に乗ります。\n③財布を(忘れます→ )とき、友達に貸してもらいます。\n④言葉の意味が(分かります→ )とき、友達に教えてもらいます。\n\n<資料2>\n多肢選択式:___に何を入れますか。1・2・3・4から一つ選びなさい。\n(1)引っ越しのとき、友達が私の荷物を運んで___。\n1 もらいました 2 あげました 3 くれました 4 いただきました\n\n記述式:1〜4の絵を見てストーリーを書きなさい。(郵便受けにチラシお断りの表示を見る→廊下を走る→交番へ向かう→警官に届ける、という4コマの絵)\n\n問1 文章中の下線部A「プレースメント・テスト」を行う際の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["最後まで解けるよう、難易度の異なる問題をランダムに配列する。","採点者によって点数に違いが出ないよう、文法テストの得点を重視する。","学習者の知識や能力の違いを明確にするため、問題数を十分用意する。","総合力を測るため、正答した問題の項目より合計得点を重視する。"], answer:2,
 explain:"プレースメント・テストの目的は学習者の知識や能力の違いを的確に把握しレベル分けに活用することなので、識別力を高めるために十分な問題数を用意することが重要です。難易度をランダムに配列すると識別力が下がり、文法のみの重視や合計得点のみの重視も学習者の実態を十分に反映しません。"},

{id:"R3-16-37", tag:"R3 試験III 問題8 問2", cat:"評価:小テストの設問意図",
 text:"問2 文章中の下線部B「小テスト<資料1>」の設問の意図として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["従属節と主節の時制を一致させることができるかを確認する。","前接する助詞から判断して活用形が考えられるかを確認する。","動作主が誰かを推測して正しい形式で書けるかを確認する。","文の意味に合わせて正しい活用形が作れるかを確認する。"], answer:3,
 explain:"<資料1>は「(食べます→ )とき」のように文脈から動詞を適切な活用形に直させる問題であり、文全体の意味に合わせて正しい活用形を作れるかを確認する設問です。"},

{id:"R3-16-38", tag:"R3 試験III 問題8 問3", cat:"評価:期末テストの性質",
 text:"問3 文章中の下線部C「期末テスト」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ある学習者の正答率は、学習目標に対するその学習者の到達度として解釈できる。","学習者の理解度を表したテスト得点は、正規分布することが想定される。","出題の範囲を設けずに広範囲から作成されるため、学習者の実力が試される。","指導目的や内容が同じでも、担当教師が異なるときは新たに作成する必要がある。"], answer:0,
 explain:"期末テストは目標基準準拠テストとして設計されることが多く、正答率は学習目標に対する到達度として解釈できます。範囲は指導内容に基づいて設定され、得点分布が正規分布になることは前提とされず、指導目的・内容が同じであれば教師が異なっても共通のテストを使用できます。"},

{id:"R3-16-39", tag:"R3 試験III 問題8 問4", cat:"評価:テスト形式の特性",
 text:"問4 文章中の下線部D「多肢選択式や記述式<資料2>」で示されているそれぞれの問題の特性に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「問題の真正性」は、多肢選択式は高いが、記述式は低い。","「言語形式への焦点化」の度合いは、多肢選択式は低いが、記述式は高い。","「コンテクストへの依存度」は、多肢選択式は低いが、記述式は高い。","「採点の客観性」は、多肢選択式は低いが、記述式は高い。"], answer:2,
 explain:"記述式は実際の使用場面に近い文脈(コンテクスト)の中で言語運用能力を問うため、コンテクストへの依存度は多肢選択式より高くなります。真正性・採点の客観性は記述式より多肢選択式の方が高く、言語形式への焦点化は多肢選択式の方が高い傾向にあります。"},

{id:"R3-16-40", tag:"R3 試験III 問題8 問5", cat:"評価:識別力",
 text:"問5 文章中の下線部E「識別力」を確認する方法として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ある学習者の得点が平均点からどのくらい離れているかを見る。","テスト得点の上位群と下位群の各問題の正答率の差を見る。","クラス内の正答者数を見て、各問題の難しさを比較する。","クラスごとの得点の散らばりを見て、分布を比較する。"], answer:1,
 explain:"識別力とは、テストの得点が高い学習者と低い学習者を的確に区別できているかを示す指標であり、上位群と下位群の各設問の正答率の差(識別指数)によって確認します。"},

{id:"R3-16-41", tag:"R3 試験III 問題9 問1", cat:"日本語教育政策:留学生の進路状況",
 text:"問題9 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n近年,大学や専門学校等を卒業した後も,日本国内に留まる留学生が増えている。日本学生支援機構の「2019(令和元)年度外国人留学生進路状況・学位授与状況調査結果」によると,この年度に日本の大学(大学院)・短期大学・専門学校等を卒業(修了)した留学生のうち,(ア)が進学・就職等のために日本国内に留まっている。\n外国人の日本国内への定住化が進むと,異文化接触の場面において様々な葛藤が生じる。集団間の葛藤の解決を阻む要因の一つに内集団バイアスがある。オルポート(G.W. Allport)は接触仮説を提唱し,集団間接触を効果的に行う条件を示した。また,効果的な異文化接触のために,大学などでは異文化トレーニングが実施されている。異文化トレーニングでは,ファシリテーターの関わり方が重要である。\n\n問1 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["約15%","約35%","約55%","約75%"], answer:3,
 explain:"2019(令和元)年度の「外国人留学生進路状況・学位授与状況調査結果」によると、日本の大学等を卒業(修了)した留学生のうち、約75%が進学・就職等のために日本国内に留まっています。"},

{id:"R3-16-42", tag:"R3 試験III 問題9 問2", cat:"異文化間コミュニケーション:内集団バイアス",
 text:"問2 文章中の下線部A「内集団バイアス」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["集団の利益を最も優先して考えること","自分自身を集団の一員として考えること","外集団よりも内集団の態度や行動を好むこと","外集団よりも内集団のほうが公正だと信じること"], answer:2,
 explain:"内集団バイアスとは、自分が所属する集団(内集団)を、そうでない集団(外集団)よりも好意的に評価し、その態度や行動を好む傾向のことを指します。"},

{id:"R3-16-43", tag:"R3 試験III 問題9 問3", cat:"異文化間コミュニケーション:接触仮説",
 text:"問3 文章中の下線部B「集団間接触を効果的に行う条件」を満たす例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本語学校で教師が学習者の作文添削などの個別のチュータリング支援を行う。","地域の行政機関で相談窓口を開設し、職員が外国人住民の相談に応じる。","大学公認サークルで留学生と日本人学生が行事の準備をするなど日常的に交流する。","町内会主催の新年会に留学生を招待し、日本人が和楽器による演奏を披露する。"], answer:2,
 explain:"オルポートの接触仮説では、対等な立場での協力関係のもとで共通の目標に向かって持続的に接触することが集団間の偏見低減に効果的であるとされます。サークルでの行事準備を通じた日常的で対等な協働はこの条件を満たしますが、他の例は一方向的な支援や一時的な鑑賞にとどまります。"},

{id:"R3-16-44", tag:"R3 試験III 問題9 問4", cat:"異文化間コミュニケーション:異文化トレーニング",
 text:"問4 文章中の下線部C「異文化トレーニング」の例として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["講演会で、異文化環境での公共場面におけるマナーやルールについて説明を聞く。","異文化場面のロールプレイをした後に、演じた際の感情について話し合う。","異文化間交流において、実際に起きた出来事を題材に問題点を議論する。","バファバファやバーンガなどの異文化シミュレーションゲームに参加する。"], answer:0,
 explain:"異文化トレーニングは、参加者自身の体験や活動を通じて気づきを促す体験型の学習が中心です。一方的に講演を聞くだけの活動は、知識の伝達にとどまり体験的な気づきを促す異文化トレーニングの典型例とは言えません。"},

{id:"R3-16-45", tag:"R3 試験III 問題9 問5", cat:"異文化間コミュニケーション:ファシリテーター",
 text:"問5 文章中の下線部D「ファシリテーターの関わり方」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["活動の目標を設定せず、参加者の希望に応じて自由に活動させる。","活動中だけでなく休憩時間にも参加者の意見を聞き、活動に反映させる。","参加者全体の意見をまとめ、用意しておいた結論を示して共有する。","同じ参加者間での活動の際は、2回目以降のアイスブレイクを割愛する。"], answer:1,
 explain:"ファシリテーターは活動が円滑に進むよう、休憩時間などの非公式な場も含めて参加者の様子や意見を把握し、それを活動に柔軟に反映させることが重要です。目標を設定しない自由放任や、あらかじめ用意した結論への誘導は適切なファシリテーションとは言えません。"},

{id:"R3-16-46", tag:"R3 試験III 問題10 問1", cat:"第二言語習得論:情意フィルター仮説",
 text:"問題10 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n第二言語習得は学習者の情意要因の影響を受けると考えられている。この考えは情意フィルター仮説として知られている。また,第二言語学習において生じるネガティブな感情は第二言語不安と呼ばれる。\n学習者の情意要因に配慮して開発された教授法にコミュニティ・ランゲージ・ラーニングがある。ジャーナル・アプローチも,第二言語不安を軽減する方法の一つとして知られている。これらを踏まえて,教師は学習者の不安を軽減するような授業運営をすることが望ましい。\n\n問1 文章中の下線部A「情意フィルター仮説」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["第二言語の習得に対する心理的な抵抗感が強まるとインプットの取り込みが妨げられるという考え方","現在の言語レベルよりも少し高いレベルのインプットを受けることで習得が進むという考え方","対話する相手と意味のある言語的交流を持つことで第二言語が効率的に習得されるという考え方","学んでいる言語が使われている社会の一員になりたいという気持ちが学習動機を高めるという考え方"], answer:0,
 explain:"情意フィルター仮説(クラッシェン)は、不安や緊張などの否定的な情意要因が「フィルター」として働き、インプットの取り込みを妨げるという考え方です。2はインプット仮説、3は相互作用仮説、4は統合的動機づけの説明です。"},

{id:"R3-16-47", tag:"R3 試験III 問題10 問2", cat:"第二言語習得論:第二言語不安",
 text:"問2 文章中の下線部B「第二言語不安」の構成要素として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["試験の成績に対する心配から生じる不安","神経質や心配性など個人の性格から生じる不安","負の評価を受けることに対する恐怖から生じる不安","他者と交流することへの恐れから生じる不安"], answer:1,
 explain:"第二言語不安は、コミュニケーション不安・試験不安・否定的評価への恐れという要素から構成されるとされます。神経質や心配性といった個人の一般的な性格特性は、第二言語不安そのものの構成要素とは区別されます。"},

{id:"R3-16-48", tag:"R3 試験III 問題10 問3", cat:"教授法:コミュニティ・ランゲージ・ラーニング",
 text:"問3 文章中の下線部C「コミュニティ・ランゲージ・ラーニング」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["教師は学習者をリラックスさせ、音楽や絵画などの芸術的要素を取り入れる。","教師は学びの調整者となり、学習者の記憶を助ける特別な教具を使用する。","教師は目標言語の発話が困難な学習者の隣で、学習者が母語で言った内容を通訳してささやく。","教師は異文化理解や異文化交流の要素を取り入れ、十分なインプットを学習者に与える。"], answer:2,
 explain:"コミュニティ・ランゲージ・ラーニングでは、教師はカウンセラーのような役割を担い、学習者が母語で言いたいことを目標言語に通訳して耳元でささやき、それを学習者が繰り返すという方法で不安を軽減しながら学習を進めます。"},

{id:"R3-16-49", tag:"R3 試験III 問題10 問4", cat:"教授法:ジャーナル・アプローチ",
 text:"問4 文章中の下線部D「ジャーナル・アプローチ」の実践例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["教師は学習者にその日に習った文法項目や語彙を使って日記を書かせ、添削する。","教師は学習者に授業の感想を日記に書かせ、内容の理解度や参加態度について評価を行う。","教師は学習者に異文化に対する気づきを日記に書かせ、授業で異文化受容について指導する。","教師は学習者に日記を書かせ、学習者と日記を通じて感じたことを率直に伝え合う。"], answer:3,
 explain:"ジャーナル・アプローチは、学習者と教師が日記(ジャーナル)を通じて互いの感じたことや考えを率直にやり取りすることで、情意的な負担を軽減し信頼関係を築く方法です。文法添削や評価を目的とするものではありません。"},

{id:"R3-16-50", tag:"R3 試験III 問題10 問5", cat:"第二言語習得論:不安軽減の授業運営",
 text:"問5 文章中の下線部E「学習者の不安を軽減するような授業運営」として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["既習項目で、正誤がはっきりした多肢選択式テストを行う。","学習者が達成できるタスクを与え、成功体験を積ませる。","成績上位者に賞を与え、学習者同士の競争心を高める。","授業目標を明確にし、目標達成のための学習方略を指導する。"], answer:2,
 explain:"学習者同士の競争心を過度にあおることは、成績下位者にとって不安やプレッシャーを高める要因となり、不安軽減とは逆効果になり得ます。既習内容の確認や達成可能なタスクの提供、目標や方略の明確化は不安軽減に資する運営です。"},

{id:"R3-16-51", tag:"R3 試験III 問題11 問1", cat:"教授法:プロセス・アプローチ",
 text:"問題11 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n第二言語における作文教育については様々な研究が行われている。プロセス・アプローチは,フラワーとヘイズ(L.Flower & J.R.Hayes)の文章産出過程モデルの考え方が反映された作文指導法である。このモデルの文章産出過程では,メタ認知ストラテジーが重要な役割を担うとされている。\n熟達した書き手と未熟な書き手では,作文の書き方に多くの相違点があることが分かっている。また,日本語学習者の場合,事態描写における視点の置き方など,結束性の問題が作文の分かりにくさの原因として挙げられる。\n教師は学習者や状況に応じて,適切にフィードバックや評価を行っていくことが求められ,その際には,ルーブリックを用いることも効果的である。\n\n問1 文章中の下線部A「プロセス・アプローチ」における教師の役割として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["既習の語や文型を正確に使いこなせるように指導する。","文章の論理構造の型を習得できるよう支援する。","学習者が各活動で思考を深められるよう支援する。","ジャンルに沿った文体を適切に用いるよう指導する。"], answer:2,
 explain:"プロセス・アプローチは、完成した文章という「結果」ではなく、着想から推敲に至る「過程」を重視する指導法であり、教師は各段階で学習者の思考が深まるように支援する役割を担います。"},

{id:"R3-16-52", tag:"R3 試験III 問題11 問2", cat:"学習方略:メタ認知ストラテジー",
 text:"問2 文章中の下線部B「メタ認知ストラテジー」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["文章の前後のつながりや構成のよしあしを教師に相談する。","作文に重要な項目を把握するために、モデル文を分析する。","意図した内容と言語表現にずれがないか自分でチェックする。","伝えたいことを表す語が分からないとき、既習語で言い換える。"], answer:2,
 explain:"メタ認知ストラテジーとは、自分自身の学習・産出過程を客観的に把握し調整する方略のことです。自分の意図と実際の表現にずれがないかを自らチェックする行為はその典型例です。他の選択肢はそれぞれ他者への相談、モデル分析(認知ストラテジー)、言い換え(補償ストラテジー)にあたります。"},

{id:"R3-16-53", tag:"R3 試験III 問題11 問3", cat:"作文教育:熟達した書き手の特徴",
 text:"問3 文章中の下線部C「熟達した書き手」の作文活動の特徴として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["着想から執筆、推敲、清書の順を追って一方向的に書いていく。","何をどの順番で書くかについて、書く前に時間を取って構想を練る。","一貫した筋を通すために、書いている途中で読み直しながら書き進める。","誰に向かって書いているのか、具体的な特定の読み手を意識する。"], answer:0,
 explain:"熟達した書き手は、着想から清書までを一方向的に進めるのではなく、構想・執筆・推敲を行き来しながら文章を練り上げていく再帰的な過程を経ることが知られています。一方向的に書き進める特徴はむしろ未熟な書き手に見られる傾向です。"},

{id:"R3-16-54", tag:"R3 試験III 問題11 問4", cat:"作文教育:視点と結束性",
 text:"問4 文章中の下線部D「事態描写における視点の置き方」の観点から、指導が必要な文はどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["先生は日本語で推薦書を書いていいです。","昨日、母が私に電話して嬉しかったです。","リンさんは大学に合格しておめでとう。","歩きすぎたので、私の足は痛いです。"], answer:1,
 explain:"「昨日、母が私に電話して嬉しかったです」は、「母が電話する」という母親側の行為の描写から、話者自身の感情である「嬉しかった」に文の視点が途中で移ってしまっている文です。本来は「母が私に電話してくれて嬉しかったです」のように、恩恵を表す「くれる」を用いて話者の視点で一貫させる必要があり、視点の置き方の指導が必要な典型例です。"},

{id:"R3-16-55", tag:"R3 試験III 問題11 問5", cat:"評価:ルーブリック",
 text:"問5 文章中の下線部E「ルーブリック」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者に活動の振り返りを記述させ、計画通りに進んだか評価させることができる。","各評価項目にコメント欄があり、評価者は個別にコメントを付すことができる。","個人を集団内に相対的に位置づけ、評価者の主観を排除して客観性が保持できる。","いくつかの評価観点とその到達度が記述された表で、学習成果が把握できる。"], answer:3,
 explain:"ルーブリックとは、複数の評価観点(規準)ごとに到達度のレベルを段階的に記述した評価表のことで、これにより学習成果を多面的かつ具体的に把握することができます。"},

{id:"R3-16-56", tag:"R3 試験III 問題12 問1", cat:"語彙:語の借用",
 text:"問題12 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n言語の接触は様々なところで絶えず起こっている。言語の接触によって起こる現象の一つとして,言語間の語の借用がある。借用には,単純借用の他,翻訳借用などの形が見られる。また,借用された語でも一般の語と同様に,意味の縮小や拡大が起こることがある。\n国立国語研究所は意味の分かりにくい外来語に対応するため,平成18年(2006年)に「「外来語」言い換え提案」を作成した。日本語教育においては,外来語の意味・用法だけでなく,外来語の原語との音韻的違いに留意して指導をすることが重要である。\n\n問1 文章中の下線部A「語の借用」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["借用された語の品詞は原語の品詞に関係なく決まる。","形態素レベルでは起こらずに語レベルで起こる。","威信の高い言語からは借用されにくい。","同一概念を表す語が既に存在する場合には起こらない。"], answer:0,
 explain:"借用された語の品詞は、原語での品詞にかかわらず、借用先の言語の文法体系の中で独自に決まります。例えば英語の名詞が日本語で「〜する」を伴う動詞として使われるなど、原語の品詞とは異なる品詞として定着することがあります。"},

{id:"R3-16-57", tag:"R3 試験III 問題12 問2", cat:"語彙:翻訳借用",
 text:"問2 文章中の下線部B「翻訳借用」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「返事」を「返事」、「出張」を「出張」とするように訓読みから音読みに変化させたもの","clubを「倶楽部」、jokeを「冗句」とするように音だけでなく意味も利用して漢字を当てたもの","spoonを「さじ」、deskを「机」とするように新しい概念に既存語を当てたもの","airportを「空港」、keyboardを「鍵盤」とするように原語を逐語訳したもの"], answer:3,
 explain:"翻訳借用とは、外国語の複合語などの構成要素をそのまま自国語に置き換えて訳す借用の方法です。airport(air+port)を「空港」(空+港)、keyboard(key+board)を「鍵盤」(鍵+盤)とするように、構成要素ごとに逐語的に訳した例が該当します。"},

{id:"R3-16-58", tag:"R3 試験III 問題12 問3", cat:"語彙:意味変化(縮小)",
 text:"問3 文章中の下線部C「意味の縮小」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「芝居」の意味が「芝の生えている所」から「演劇・演技」に変化した。","「君」の意味が「天皇、仕える主人」から「同輩以下に対する代名詞」に変化した。","「玄関」の意味が「禅寺の門」から「家屋の入り口」に変化した。","「車」の意味が「車輪の付いた乗り物」から「自動車」に変化した。"], answer:3,
 explain:"「車」はもともと車輪のついた乗り物全般(荷車、人力車なども含む)を指しましたが、現代では主に「自動車」を指すようになっており、意味の範囲が狭まった「意味の縮小」の例です。他の選択肢は原義から別の意味に転じた例(意味変化)であり、縮小とは性質が異なります。"},

{id:"R3-16-59", tag:"R3 試験III 問題12 問4", cat:"語彙:外来語言い換え提案",
 text:"問4 文章中の下線部D「『外来語』言い換え提案」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["使用頻度は高いが適切に言い換えられる語がない外来語について、翻訳語の作り方を示している。","公共性の高い場面で使われる分かりにくい外来語について、言い換えられる語や説明をまとめている。","理解度の低い外来語の使用を減少させるために、言い換えられる和語をリスト化して提示している。","公的機関での難解な外来語使用を制限するために、基本語彙に言い換える指針をまとめている。"], answer:1,
 explain:"国立国語研究所の「『外来語』言い換え提案」は、白書や広報等の公共性の高い場面で使われる分かりにくい外来語について、分かりやすい言い換え語や説明をまとめて提示したものです。使用の制限や禁止を目的とするものではありません。"},

{id:"R3-16-60", tag:"R3 試験III 問題12 問5", cat:"音声学:外来語の音韻的特徴",
 text:"問5 文章中の下線部E「原語との音韻的違い」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["strikeが「ストライク」となるように、外来語音は日本語のモーラ規則に組み込まれる形で母音が挿入される。","missionが「ミッション」となるように、高低アクセントは英語の強弱アクセントのパターンによって決定される。","looseが「ルーズ」となるように、原音を日本語化する際に、語によっては音の一部が有声音化する。","whiteが「ワイシャツ」「ホワイトカラー」となるように、語によっては異なる形になる。"], answer:1,
 explain:"外来語の高低アクセントは、原語(英語)の強弱アクセントのパターンに単純に対応して決まるわけではなく、日本語独自のアクセント規則(後ろから数えたモーラ位置など)によって決定されます。したがってこの記述は不適当です。"},

{id:"R3-16-61", tag:"R3 試験III 問題13 問1", cat:"社会言語学:ネオ方言",
 text:"問題13 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n現在の日本では地域方言の特徴が急速に失われつつある。それと同時に,地域方言が共通語の影響を受け,新たにネオ方言が生まれている。また,方言と共通語を使い分ける人も多くなり,その際に使われる共通語の中には,気づかない方言が含まれることもある。\n一方,現在も残っている地域ごとの音韻規則の違いについて,日本語教師は理解しておく必要がある。アクセント体系の違いについても,同様である。また,地域方言が話されている地域で日本語教育を行う場合は,学習者に対する方言教育にも気を配らなければならない。\n\n問1 文章中の下線部A「ネオ方言」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["東北方言話者が「マチガエチャッタ(=間違えてしまった)」という表現を使う。","東京都内の若者が「ウザッタイ(=煩わしい)」という表現を使う。","関西方言話者が「アカンヤナイノ(=だめじゃないの)」という表現を使う。","全国各地の若者が「オキレ(=起きろ)」という表現を使う。"], answer:2,
 explain:"ネオ方言とは、伝統方言と共通語が接触・融合して生まれた新しい方言形式を指します。関西方言の「アカン(だめ)」と共通語的な言い方が組み合わさった「アカンヤナイノ」はその典型例です。"},

{id:"R3-16-62", tag:"R3 試験III 問題13 問2", cat:"社会言語学:気づかない方言",
 text:"問2 文章中の下線部B「気づかない方言」の例として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「エライ(=疲れた)」など、語の分布域がある程度広いもの","「ワシ(=私)」など、特定の語を使う人物像が共通語で認知されるもの","「ナオス(=しまう)」など、語形が共通語と同じで用法が異なるもの","「アッテル(=している)」など、形態素レベルで共通語に存在するもの"], answer:1,
 explain:"「気づかない方言」は、話者自身がそれを方言だと意識せずに使っている語や用法を指します。「ワシ」のように特定の人物像(年配の男性等)と強く結びつき、方言として広く認識されている語は、話者自身も方言と意識していることが多く、「気づかない方言」の例としては不適当です。"},

{id:"R3-16-63", tag:"R3 試験III 問題13 問3", cat:"音声学:方言の音韻規則",
 text:"問3 文章中の下線部C「地域ごとの音韻規則の違い」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["東北方言では、語中のガ・ダ行音等が鼻音で現れる。","西日本方言では、「ウ」が非円唇母音の音で現れる。","九州方言では、「エ」と「イ」が同一の音で現れる。","沖縄方言では、「ジ」と「ズ」が同一の音で現れる。"], answer:0,
 explain:"東北方言の特徴として、語中のガ行・ダ行音が鼻音化して現れる(鼻濁音化)ことが知られています。ウの円唇性は西日本方言でむしろ円唇的に現れる傾向があり、他の選択肢の記述も実際の方言特徴とは異なります。"},

{id:"R3-16-64", tag:"R3 試験III 問題13 問4", cat:"音声学:アクセント体系",
 text:"問4 文章中の下線部D「アクセント体系の違い」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["アクセントは地域ごとに類似性があり、関東全体でアクセントタイプが共通する。","無アクセント地域出身者は、共通語を話すときに抑揚が激しい話し方をする。","東京式と京阪式のアクセントパターンの数は、共に「音節数+1」である。","京阪式の2拍名詞には、拍内で音調が下降するアクセントの型がある。"], answer:3,
 explain:"京阪式アクセントの2拍名詞には、1拍目の中で音調が高から低へ下降する「下降式」のアクセント型が存在します。関東でもアクセントタイプは地域によって異なり、無アクセント地域出身者はむしろ抑揚が少ない傾向があり、アクセントの型数は「音節数+1」ではなく「拍数+1」で数えるのが一般的です。"},

{id:"R3-16-65", tag:"R3 試験III 問題13 問5", cat:"日本語教育:方言教育",
 text:"問5 文章中の下線部Eに関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["対話相手に失礼にならないよう、方言の使用場面や機能について正しく理解させる。","方言と共通語の使い分けには、話し手のパーソナリティーや相手への待遇の仕方が表れることを説明する。","方言の使用を望む学習者には、共通語の指導は行わず、方言指導を集中して行う。","方言を避けたがる学習者には、使用を強制せず、方言の役割・機能について正しい理解を促す。"], answer:2,
 explain:"方言指導を行う場合でも、共通語は社会生活を送るうえで基盤となる言語であるため、その指導を全く行わず方言のみに集中することは適切ではありません。学習者の希望に応じて方言教育を取り入れつつも、共通語の指導とバランスを取ることが求められます。"},

{id:"R3-16-66", tag:"R3 試験III 問題14 問1", cat:"語用論:フェイス",
 text:"問題14 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n会話における配慮のあり方を示した理論の一つに,ブラウン&レビンソン(P.Brown & S.Levinson)のポライトネス理論がある。この理論ではフェイスを鍵概念とし,対人配慮をポライトネス・ストラテジーとして示している。また,人々は発話の前にフェイスを侵害する度合いを算出し,具体的なポライトネス・ストラテジーを選択するとしている。\n日本語の会話における配慮の一形態としては,敬語がある。現在では,二重敬語なども含め,多種多様な敬語使用が存在している。日本語教師は,配慮のあり方を含めた語用論的指導についても視野に入れておく必要がある。\n\n問1 文章中の下線部A「フェイス」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ポジティブ・フェイスは、立場をわきまえて行動したいという人間の基本的欲求である。","相手のフェイスを侵害するリスクが低い場合に選択するストラテジーは、行為回避である。","フェイスに配慮することが社会的に必要か否かは、文化によって異なる。","同じ行為であっても、文化が異なればフェイスを侵害する度合いは異なる。"], answer:3,
 explain:"フェイス侵害度は、相手との力関係や社会的距離、行為の負担度など複数の要素から算出され、文化によってその評価基準は異なります。したがって同じ行為でも文化が異なればフェイスを侵害する度合いは変わり得ます。ポジティブ・フェイスは「他者から好かれ、認められたい」という欲求で、行為回避はリスクが高い場合に選ばれるストラテジーです。"},

{id:"R3-16-67", tag:"R3 試験III 問題14 問2", cat:"語用論:フェイス侵害度の要素",
 text:"問2 文章中の下線部Bに関して、相手に意見を述べる場面で考慮される三つの要素に含まれないものを、次の1〜4の中から一つ選べ。",
 choices:["相手に意見を言うことで生じる自己像への影響","相手に意見を言うことで与える負担の度合い","相手と自分との社会的立場の違い","相手と自分との親しさ"], answer:0,
 explain:"ブラウン&レビンソンの理論では、フェイス侵害度を算出する要素として「相手との社会的距離(親しさ)」「相手との力関係(社会的立場の違い)」「行為の負担度」の三つが挙げられます。「自己像への影響」はこの三要素には含まれません。"},

{id:"R3-16-68", tag:"R3 試験III 問題14 問3", cat:"文法:謙譲語Ⅰ",
 text:"問3 文章中の下線部C「敬語」に関して、謙譲語Ⅰの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["明日、先生のところに伺います。","来週から出張で海外へ参ります。","当機はまもなく着陸いたします。","初めまして、山田と申します。"], answer:0,
 explain:"謙譲語Ⅰは、自分側の行為が向かう相手を立てる敬語です。「伺う」は「行く」の謙譲語Ⅰで、行為の相手である「先生」を立てる表現です。「参ります」「いたします」「申します」は主に自分側の行為を丁重に述べる謙譲語Ⅱ(丁重語)に当たります。"},

{id:"R3-16-69", tag:"R3 試験III 問題14 問4", cat:"文法:二重敬語",
 text:"問4 文章中の下線部D「二重敬語」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["先生、私がご案内申し上げます。","先生に伺ってくださいますか。","先生がおっしゃられました。","先生がお話しになっていらっしゃいました。"], answer:2,
 explain:"「おっしゃられました」は、尊敬語「おっしゃる」に、さらに尊敬の助動詞「られる」を重ねて付けた二重敬語です。一つの敬語表現に同じ種類の敬語を二重に使ってしまう典型的な誤用例とされます。"},

{id:"R3-16-70", tag:"R3 試験III 問題14 問5", cat:"日本語教育:語用論的指導",
 text:"問5 文章中の下線部E「語用論的指導」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["言語形式と機能と社会的・状況的文脈の関係について学習者自身に記述させ、気づきの機会を与える。","フィードバックの際に誤りに対する訂正を避けることで、学習者の発話意欲を向上させる。","会話において意図を伝達することと、対人関係を考えて相手に配慮することのバランスを意識させる。","語用論的規範や傾向、発話行為の談話構造や丁寧度の調整に関して明示的に教えるようにする。"], answer:1,
 explain:"語用論的能力を育てるには、誤用に気づかせるフィードバックが重要であり、誤りの訂正を一律に避けることは、むしろ学習者が不適切な言語使用を定着させてしまう可能性があるため、適切な語用論的指導とは言えません。"},

{id:"R3-16-71", tag:"R3 試験III 問題15 問1", cat:"日本語教育史:外国人への公的支援",
