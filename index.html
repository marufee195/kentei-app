 choices:["対話相手に失礼にならないよう、方言の使用場面や機能について正しく理解させる。","方言と共通語の使い分けには、話し手のパーソナリティーや相手への待遇の仕方が表れることを説明する。","方言の使用を望む学習者には、共通語の指導は行わず、方言指導を集中して行う。","方言を避けたがる学習者には、使用を強制せず、方言の役割・機能について正しい理解を促す。"], answer:2,
 explain:"方言指導を行う場合でも、共通語は社会生活を送るうえで基盤となる言語であるため、その指導を全く行わず方言のみに集中することは適切ではありません。学習者の希望に応じて方言教育を取り入れつつも、共通語の指導とバランスを取ることが求められます。"},

{id:"R3-16-66", tag:"R3 試験III 問題14 問1", cat:"語用論:フェイス",
 text:"問題14 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n会話における配慮のあり方を示した理論の一つに、ブラウン&レビンソン(P.Brown & S.Levinson)のポライトネス理論がある。この理論ではフェイスを鍵概念とし、対人配慮をポライトネス・ストラテジーとして示している。また、人々は発話の前にフェイスを侵害する度合いを算出し、具体的なポライトネス・ストラテジーを選択するとしている。\n日本語の会話における配慮の一形態としては、敬語がある。現在では、二重敬語なども含め、多種多様な敬語使用が存在している。日本語教師は、配慮のあり方を含めた語用論的指導についても視野に入れておく必要がある。\n\n問1 文章中の下線部A「フェイス」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ポジティブ・フェイスは、立場をわきまえて行動したいという人間の基本的欲求である。","相手のフェイスを侵害するリスクが低い場合に選択するストラテジーは、行為回避である。","フェイスに配慮することが社会的に必要か否かは、文化によって異なる。","同じ行為であっても、文化が異なればフェイスを侵害する度合いは異なる。"], answer:3,
 explain:"フェイス侵害度は、相手との力関係や社会的距離、行為の負担度など複数の要素から算出され、文化によってその評価基準は異なります。したがって同じ行為でも文化が異なればフェイスを侵害する度合いは変わり得ます。ポジティブ・フェイスは「他者から好かれ、認められたい」という欲求で、行為回避はリスクが高い場合に選ばれるストラテジーです。"},

{id:"R3-16-67", tag:"R3 試験III 問題14 問2", cat:"語用論:フェイス侵害度の要素",
 text:"問2 文章中の下線部Bに関して、相手に意見を述べる場面で考慮される三つの要素に含まれないものを、次の1〜4の中から一つ選べ。",
 choices:["相手に意見を言うことで生じる自己像への影響","相手に意見を言うことで与える負担の度合い","相手と自分との社会的立場の違い","相手と自分との親しさ"], answer:0,
 explain:"ブラウン&レビンソンの理論では、フェイス侵害度を算出する要素として「相手との社会的距離(親しさ)」「相手との力関係(社会的立場の違い)」「行為の負担度」の三つが挙げられます。「自己像への影響」はこの三要素には含まれません。"},

{id:"R3-16-68", tag:"R3 試験III 問題14 問3", cat:"文法:謙譲語Ⅰ",
 text:"問3 文章中の下線部C「敬語」に関して、謙譲語Ⅰの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["明日、先生のところに伺います。","来週から出張で海外へ参ります。","当機はまもなく着陸いたします。","初めまして、山田と申します。"], answer:0,
 explain:"謙譲語Ⅰは、自分側の行為が向かう相手を立てる敬語です。「伺う」は「行く」の謙譲語Ⅰで、行為の相手である「先生」を立てる表現です。「参ります」「いたします」「申します」は主に自分側の行為を丁重に述べる謙譲語Ⅱ(丁重語)に当たります。"},

{id:"R3-16-69", tag:"R3 試験III 問題14 問4", cat:"文法:二重敬語",
 text:"問4 文章中の下線部D「二重敬語」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["先生、私がご案内申し上げます。","先生に伺ってくださいますか。","先生がおっしゃられました。","先生がお話しになっていらっしゃいました。"], answer:2,
 explain:"「おっしゃられました」は、尊敬語「おっしゃる」に、さらに尊敬の助動詞「られる」を重ねて付けた二重敬語です。一つの敬語表現に同じ種類の敬語を二重に使ってしまう典型的な誤用例とされます。"},

{id:"R3-16-70", tag:"R3 試験III 問題14 問5", cat:"日本語教育:語用論的指導",
 text:"問5 文章中の下線部E「語用論的指導」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["言語形式と機能と社会的・状況的文脈の関係について学習者自身に記述させ、気づきの機会を与える。","フィードバックの際に誤りに対する訂正を避けることで、学習者の発話意欲を向上させる。","会話において意図を伝達することと、対人関係を考えて相手に配慮することのバランスを意識させる。","語用論的規範や傾向、発話行為の談話構造や丁寧度の調整に関して明示的に教えるようにする。"], answer:1,
 explain:"語用論的能力を育てるには、誤用に気づかせるフィードバックが重要であり、誤りの訂正を一律に避けることは、むしろ学習者が不適切な言語使用を定着させてしまう可能性があるため、適切な語用論的指導とは言えません。"},

{id:"R3-16-71", tag:"R3 試験III 問題15 問1", cat:"日本語教育史:外国人への公的支援",
 text:"問題15 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n戦後、日本には多くの外国人が移住してきており、その背景は多様である。日本国内ではこれまで彼らに対する公的な支援が行われてきた。現在では夜間中学もその役割を担っている。\n元来、夜間中学は、教育を受けられなかった人に対して義務教育や識字教育の機会等を提供してきた。識字教育の分野においては,1950年代後半のブラジルの教育学者フレイレ(P.Freire)が有名である。彼は従来の教育・学習方法を批判し、農民や先住民などの貧困層に対して教育を行った。フレイレによる識字教育は学習者の「意識化」を重視したものであった。彼の識字教育は日本にも影響を与え、地域の日本語教室で「課題提起型日本語教育」として試みられている。\n\n問1 文章中の下線部A「公的な支援」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["1960年代にインドシナ難民定住促進事業が開始された。","1970年代に外国人技能実習制度による受入れが開始された。","1980年代に中国帰国孤児定着促進センターの運営が開始された。","1990年代に日系南米人に対する「虹の架け橋教室」事業が開始された。"], answer:2,
 explain:"中国帰国孤児定着促進センターは1980年代(1984年)に開設され、中国残留孤児等の日本語学習・定着支援を行いました。インドシナ難民の受け入れは1970年代、技能実習制度は1990年代、「虹の架け橋教室」は2009年からの事業です。"},

{id:"R3-16-72", tag:"R3 試験III 問題15 問2", cat:"日本語教育政策:夜間中学の実態",
 text:"問2 文章中の下線部B「夜間中学」に関して、文部科学省が行った「令和元年度夜間中学等に関する実態調査」の結果として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["外国籍の生徒の割合は生徒全体の8割を占める。","外国籍の生徒の出身国・地域はブラジルが5割を占める。","外国籍の生徒の年齢は「40〜49歳」が最も多い。","外国籍の生徒の入学理由は「高等学校に入学するため」が最も多い。"], answer:0,
 explain:"令和元年度の実態調査では、夜間中学に在籍する生徒の約8割が外国籍であることが示されています。出身国・地域は中国が最も多く、年齢層も40〜49歳が最多とは限らず、入学理由も高校進学以外の理由(学び直し等)が多く挙げられています。"},

{id:"R3-16-73", tag:"R3 試験III 問題15 問3", cat:"日本語教育史:フレイレの教育論",
 text:"問3 文章中の下線部C「従来の教育・学習方法」に関して、フレイレが批判したものはどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["拡張的学習","暗示的学習","獲得型教育","銀行型教育"], answer:3,
 explain:"フレイレは、教師が一方的に知識を学習者に「預金」するかのように教え込む従来型の教育を「銀行型教育」と呼んで批判し、対話を通じて学習者が主体的に現実を認識する教育を提唱しました。"},

{id:"R3-16-74", tag:"R3 試験III 問題15 問4", cat:"日本語教育史:意識化",
 text:"問4 文章中の下線部Dに関して、「意識化」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者が自ら学習を計画し、それを基に実行、評価すること","学習者が他者や事物に対して、自分の感情を移入し同一視化すること","学習者が学習する際に、試験や就職など、社会的地位の向上を意識すること","学習者が現実の生活や社会状況を批判的に捉え、社会変革の実践力を身につけること"], answer:3,
 explain:"フレイレの言う「意識化」とは、学習者が自分の置かれている現実の社会状況を批判的に認識し、それを変革していく実践力(行動力)を身につけていくことを指します。"},

{id:"R3-16-75", tag:"R3 試験III 問題15 問5", cat:"日本語教育:課題提起型日本語教育",
 text:"問5 文章中の下線部E「課題提起型日本語教育」に関して、その教育活動に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["教師と学習者は対話において、言語を対等な関係構築のために使用する。","学習者の感情や価値観に干渉せず、日常の事実や現象を取り上げる。","対話のステップによって、学習者の意見を一定の方向に収束させる。","学習者の日常生活にある素材を用いて、文字の読み書き能力を高める。"], answer:0,
 explain:"課題提起型日本語教育は、フレイレの理念に基づき、教師と学習者が対等な立場で対話を行いながら、学習者自身の生活や社会的課題について共に考えていく教育活動です。学習者の意見を一方向に誘導したり、感情や価値観に踏み込まず事実のみを扱ったりするものではありません。"},

{id:"R3-16-76", tag:"R3 試験III 問題16 問1", cat:"日本語教育政策:留学生30万人計画",
 text:"問題16 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n近年、卒業後に日本国内で就職する留学生は増加傾向にある。2008年に発表された「留学生30万人計画」では、留学生の国内就職の推進が掲げられた。留学生が日本国内で就職する際に取得する主な在留資格は,「技術・人文知識・国際業務」である。また,2019年には、新たに在留資格「特定活動(46号)」が設けられ、留学生の就労の選択肢が増えた。\n日本語教育においても留学生の就職支援が積極的に行われるようになっている。ビジネス日本語の指導には、職場で起こり得る異文化間の摩擦や問題の解決を目指したケース学習が取り入れられている。また、インターンシップに参加する留学生の増加に伴い、状況的学習論の立場からインターンシップにおける日本語習得の研究も行われている。\n\n問1 文章中の下線部A「留学生30万人計画」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["フランスに倣い国費留学生と私費留学生の割合を1対9とすることを目指した。","英語のみによる学位取得を可能とし、大学のグローバル化の推進を目指した。","日本語教員養成を拡充するために「標準的な教育内容」を提示した。","日本留学試験の海外実施を開始し、渡日前の入学者選考を可能にした。"], answer:1,
 explain:"「留学生30万人計画」に関連する大学国際化の施策として、英語のみで学位が取得できるコースの整備が進められ、大学のグローバル化の推進が図られました。"},

{id:"R3-16-77", tag:"R3 試験III 問題16 問2", cat:"日本語教育政策:技術・人文知識・国際業務",
 text:"問2 文章中の下線部B「技術・人文知識・国際業務」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["在留期間は、最終学歴の成績によって「5年、3年、1年又は3月」となる。","在留期間中の転職は、職務内容が同じ場合でも在留資格を取得し直す必要がある。","日本人が従事する場合に受ける報酬と同等額以上の報酬を受ける必要がある。","「BJTビジネス日本語能力テスト」の結果がJ2以上であることが求められる。"], answer:2,
 explain:"「技術・人文知識・国際業務」の在留資格では、日本人が同様の業務に従事する場合と同等額以上の報酬を受けることが要件の一つとされています。在留期間は成績ではなく個別の審査により決定され、同じ職務内容での転職であれば在留資格を取り直す必要は必ずしもなく、特定の日本語試験のスコアは在留資格の要件とはされていません。"},

{id:"R3-16-78", tag:"R3 試験III 問題16 問3", cat:"日本語教育政策:特定活動(46号)",
 text:"問3 文章中の下線部C「特定活動(46号)」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本語能力試験のN2以上に合格していることが求められる。","日本国内の大学を卒業または大学院を修了している者が対象である。","採用した会社は、採用された者の支援を特定支援団体へ委託する必要がある。","厨房の皿洗い、客室の清掃などの単純作業に専従することができる。"], answer:1,
 explain:"特定活動(46号)は、日本の大学を卒業または大学院を修了し、高い日本語能力を持つ留学生が、専門性を活かしつつ幅広い業務に従事できるようにするための在留資格であり、対象は国内の大学等の卒業(修了)者です。"},

{id:"R3-16-79", tag:"R3 試験III 問題16 問4", cat:"教授法:ケース学習",
 text:"問4 文章中の下線部D「ケース学習」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["カードに書かれた職場場面でどのようなやり取りを行えばよいかを自分で考え、与えられた役割を演じることで、場面に相応しい会話能力を身につける学習","職場の通訳に携わる人材を育成するために、職場場面における日本語母語話者同士の会話を模倣し、何度も反復することで、定着を目指す学習","職場で生じそうな問題を論題とし、肯定側と否定側に分かれ討議し、その優劣を第三者が判定する活動を通じて、意思決定や問題解決の方法を学ぶ学習","実際に職場で生じたコンフリクトを題材に、他者との討論を通して問題の解決方法を見出し、その過程を内省する一連の学習"], answer:3,
 explain:"ケース学習(ケースメソッド)は、実際に起こった具体的な事例(ケース)を題材として、他者との討論を通じて問題の解決方法を検討し、その過程を振り返り内省することを通じて学ぶ学習方法です。"},

{id:"R3-16-80", tag:"R3 試験III 問題16 問5", cat:"第二言語習得論:状況的学習論",
 text:"問5 文章中の下線部E「状況的学習論」における学習の捉え方として最も適当なものを、次の1〜4の中から一つ選べ。",

{id:"R4-1-1", tag:"R4 試験I 問題1(1)", cat:"両唇音",
 text:"次の(1)〜(15)について、【 】内に示した観点から見て、他と性質の異なるものを、それぞれ1〜5の中から一つずつ選べ。\n\n(1) 【両唇音】",
 choices:["[ɱ]","[m]","[p]","[β]","[ɸ]"], answer:0,
 explain:"[m][p][β][ɸ]はすべて上唇と下唇で調音される両唇音です。それに対して[ɱ]は上の前歯と下唇で調音する唇歯鼻音であり、調音点が両唇ではありません。したがって性質が異なるのは[ɱ]です。"},

{id:"R4-1-2", tag:"R4 試験I 問題1(2)", cat:"鼻母音",
 text:"(2) 【鼻母音】",
 choices:["期限","金塊","三倍","親愛","進退"], answer:3,
 explain:"「ん」は後続音によって実現のしかたが変わります。期限(語末)・金塊(かの前)・三倍(ばの前)・進退(たの前)は、いずれも後続子音や語末という環境で、「ん」が調音位置を同化させた鼻子音として実現されます。一方「親愛(しんあい)」は「ん」の直後に母音「あ」が続くため、鼻子音ではなく鼻音化した母音(鼻母音)として実現されます。したがって性質が異なるのは「親愛」です。"},

{id:"R4-1-3", tag:"R4 試験I 問題1(3)", cat:"漢字の読み方",
 text:"(3) 【漢字の読み方】",
 choices:["職域","職員","職業","職種","職場"], answer:4,
 explain:"職域(しょくいき)・職員(しょくいん)・職業(しょくぎょう)・職種(しょくしゅ)は、いずれも「職(しょく)」+音読みの語からなる音+音の熟語です。一方「職場」は「しょくば」と読み、「場」を訓読み「ば」で読む音+訓の重箱読みで、しかも「は」が「ば」に連濁しています。したがって読み方の構成が異なるのは「職場」です。"},

{id:"R4-1-4", tag:"R4 試験I 問題1(4)", cat:"熟字訓",
 text:"(4) 【熟字訓】",
 choices:["昨日","紅葉","手本","白髪","二十歳"], answer:2,
 explain:"昨日(きのう)・紅葉(もみじ)・白髪(しらが)・二十歳(はたち)は、いずれも個々の漢字の読みには分解できない熟字訓です。一方「手本(てほん)」は「手(て・訓読み)」+「本(ほん・音読み)」という通常の訓+音の組み合わせ(湯桶読み)であり、各漢字の読みがそのまま生きています。したがって性質が異なるのは「手本」です。"},

{id:"R4-1-5", tag:"R4 試験I 問題1(5)", cat:"謙譲語の種類",
 text:"(5) 【謙譲語の種類】",
 choices:["先生のところに伺いました。","先生のご経歴を紹介いたしました。","先生にお目にかかりました。","先生にご挨拶申し上げました。","先生にご著書を拝借しました。"], answer:1,
 explain:"「伺う」「お目にかかる」「申し上げる」「拝借する」は、動作の向かう相手(先生)を立てる謙譲語Ⅰです。一方「紹介いたしました」の「いたす」は、動作の相手を立てるのではなく、聞き手に対して丁重に述べる謙譲語Ⅱ(丁重語)であり、性質が異なります。"},

{id:"R4-1-6", tag:"R4 試験I 問題1(6)", cat:"非過去形が表す時間的な意味",
 text:"(6) 【非過去形が表す時間的な意味】",
 choices:["時間がある。","勇気が要る。","スキーができる。","葉が落ちる。","中国語が分かる。"], answer:3,
 explain:"「ある」「要る」「できる」「分かる」は状態動詞で、非過去形はいずれも「現在の状態」を表します。一方「落ちる」は瞬間動詞(変化動詞)であり、非過去形「落ちる」は現在の状態ではなく「これから起こること(未来)」を表します。したがって性質が異なるのは「葉が落ちる」です。"},

{id:"R4-1-7", tag:"R4 試験I 問題1(7)", cat:"「の」の用法",
 text:"(7) 【「の」の用法】",
 choices:["商品の時計","科学の本","新製品の企画","授業のガイダンス","映画のパンフレット"], answer:0,
 explain:"「科学の本」「新製品の企画」「授業のガイダンス」「映画のパンフレット」は、いずれも「Nについての/に関するN」という内容・話題を表す「の」です。一方「商品の時計」は「商品である時計」という同格の関係を表しており、他とは「の」の意味が異なります。"},

{id:"R4-1-8", tag:"R4 試験I 問題1(8)", cat:"「ている」の用法",
 text:"(8) 【「ている」の用法】",
 choices:["着物を着ている人","髪を染めている人","腕を組んでいる人","椅子に座っている人","会社で働いている人"], answer:4,
 explain:"「着ている」「染めている」「組んでいる」「座っている」は、いずれも変化が完了した後の結果の状態を表します。一方「働いている」は結果の状態ではなく、動作が継続していることを表す用法であり、性質が異なります。"},

{id:"R4-1-9", tag:"R4 試験I 問題1(9)", cat:"接尾辞「型」の意味",
 text:"(9) 【接尾辞「型」の意味】",
 choices:["A型の血液型","冬型の気圧配置","ハート型のケーキ","携帯型のゲーム機","都市型の住宅"], answer:2,
 explain:"「A型」「冬型」「携帯型」「都市型」の「型」は、あるパターンやカテゴリーに属することを表す抽象的な分類の意味です。一方「ハート型」の「型」は具体的な形状(ハートの形)を表しており、他とは意味が異なります。"},

{id:"R4-1-10", tag:"R4 試験I 問題1(10)", cat:"「で」の意味",
 text:"(10) 【「で」の意味】",
 choices:["彼は色鉛筆で作画した。","彼女ははだしで完走した。","太郎は両手でぶら下がった。","花子は携帯電話で会話した。","その人は片手で荷物を持った。"], answer:1,
 explain:"「色鉛筆で」「両手で」「携帯電話で」「片手で」の「で」は、動作を行う際の手段・道具を表します。一方「はだしで」の「で」は手段ではなく、動作が行われるときの様態(身体の状態)を表しており、性質が異なります。"},

{id:"R4-1-11", tag:"R4 試験I 問題1(11)", cat:"「やすい」の意味",
 text:"(11) 【「やすい」の意味】",
 choices:["この問題は解きやすい。","私は疲れやすい。","精密機器は壊れやすい。","彼は約束を忘れやすい。","このタイヤは空気が抜けやすい。"], answer:0,
 explain:"「疲れやすい」「壊れやすい」「忘れやすい」「抜けやすい」の「やすい」は、そうなる傾向・性質が強いことを表します。一方「解きやすい」は、対象(問題)を解くという動作の難易度が低いことを表しており、他とは意味が異なります。"},

{id:"R4-1-12", tag:"R4 試験I 問題1(12)", cat:"助動詞の意味",
 text:"(12) 【助動詞の意味】",
 choices:["見て見ぬふりをする。","美しさに思わず息をのむ。","すぐにやらねばならない。","知られざる真実を解明する。","あらん限りの力を振り絞る。"], answer:4,
 explain:"「ぬ」「ず」「ね」「ざる」はいずれも古典の打消の助動詞「ず」の活用形です。一方「あらん限り」の「ん」は打消ではなく、推量の助動詞「む」が変化したもので、「あるだけの(力)」という意味を表します。したがって性質が異なるのは「あらん限りの力」です。"},

{id:"R4-1-13", tag:"R4 試験I 問題1(13)", cat:"使役文におけるヲ格名詞の意味",
 text:"(13) 【使役文におけるヲ格名詞の意味】",
 choices:["入学式で新入部員を勧誘させた。","歓迎会でギターを弾かせた。","教室で反省文を書かせた。","校庭で太郎を走らせた。","授業で自分の作文を評価させた。"], answer:3,
 explain:"「勧誘する」「弾く」「書く」「評価する」は他動詞であり、「新入部員を」「ギターを」「反省文を」「作文を」はその直接目的語です。一方「走る」は自動詞であるため、「太郎を」はその動作をさせられる被使役者(動作主)を表しており、ヲ格名詞の意味が異なります。"},

{id:"R4-1-14", tag:"R4 試験I 問題1(14)", cat:"接尾辞の活用",
 text:"(14) 【接尾辞の活用】",
 choices:["山田さんとは、家族ぐるみで付き合っている。","あまりの景色の美しさに涙ぐんでしまった。","カメラを向けられ、緊張で手が汗ばんできた。","麻酔の注射をされ、子どもは痛がって泣いていた。","少しずつ春めいて気温も上がり始めた。"], answer:0,
 explain:"「涙ぐむ」「汗ばむ」「痛がる」「春めく」はいずれも名詞などに付いて動詞化し、五段活用動詞として活用する接尾辞です。一方「ぐるみ」は動詞を作る接尾辞ではなく、「家族ぐるみで」のように名詞に付いて「〜を含めて全部」という意味を添えるだけで、動詞のように活用することはありません。したがって性質が異なるのは「家族ぐるみで」です。"},

{id:"R4-1-15", tag:"R4 試験I 問題1(15)", cat:"引用節の種類",
 text:"(15) 【引用節の種類】",
 choices:["彼女は、今すぐ帰ると口走った。","花子は、信じられないとつぶやいた。","太郎は、疲れているんだとこぼした。","その人は、いつか留学すると決心した。","彼は、一緒に食事をしないかと誘った。"], answer:3,
 explain:"「口走る」「つぶやく」「こぼす」「誘う」は発話動詞であり、「と」節は実際に発せられた発言内容の引用を表します。一方「決心する」は発話動詞ではなく思考・意志を表す動詞であるため、「と」節は発言の引用ではなく、心の中で決めた内容を表しています。したがって性質が異なるのは「いつか留学すると決心した」です。"},

/* ========= データ (令和4年度 試験I 問題2) ========= */
{id:"R4-2-1", tag:"R4 試験I 問題2(1)", cat:"発音の誤用",
 text:"次の(1)〜(5)における【 】内の下線部は学習者による誤用を示す。これと異なる種類の誤用を、それぞれ1〜4の中から一つずつ選べ。必要に応じて( )内に学習者の意図を示す。\n\n(1) 【「必ず来ます。」と言おうとして「かだらず来ます。」と発音する。】",
 choices:["「子どもがいます。」と言おうとして「ころもがいます。」と発音する。","「2,000円です。」と言おうとして「にせんねんです。」と発音する。","「きれいな花です。」と言おうとして「きねいな花です。」と発音する。","「辛いものが好きです。」と言おうとして「かだいものが好きです。」と発音する。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"例の誤用は「必ず(かならず)」の「な」を「だ」と発音したもので、鼻音[n]を同じ調音位置の破裂音[d]に置き換えた子音の入れ替えです。選択肢1「ころも」は「ど」を「ろ」に、3「きねい」は「れ」を「ね」に、4「かだい」は「ら」を「だ」に置き換えたもので、いずれも既存の子音同士を別の子音に置き換えた誤用です。一方2「にせんねん」は、本来母音で始まる「えん」の前に、直前の「ん」の鼻音性が先取りされて鼻子音が挿入された誤用であり、子音同士の置き換えではなく同化による子音の付加である点で性質が異なります。"},

{id:"R4-2-2", tag:"R4 試験I 問題2(2)", cat:"可能形の誤用",
 text:"(2) 【この機械はぶつけても壊れられません。】",
 choices:["逆さまにしても絶対に落ちられません。","きちんと置いているので倒れられません。","時間に遅れるとバスに乗られません。","荷物がいっぱいでかばんに収まれません。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「壊れる」「落ちる」「倒れる」「収まる」は動作主の意志が関与しない自発動詞で、これに可能形「られる」を付けるのは本来不要な誤用です。一方「乗る」は意志的な動作を表す五段動詞で、その可能形は本来「乗れる」であるべきところ、「乗られる」という誤った活用形になっており、可能形の作り方そのものを誤っている点で他とは性質が異なります。"},

{id:"R4-2-3", tag:"R4 試験I 問題2(3)", cat:"活用形の誤用",
 text:"(3) 【試験に合格したいなら、何度も教科書を読みことです。】",
 choices:["今日は、病院に行きので、まっすぐ帰ります。","家で、はやりの音楽を聞くながら、宿題をしました。","明日までに、借りた本を返しなければなりません。","楽をしようとして、人の課題を写さないべきです。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"例・1・2・3は、「こと」「ので」「ながら」「なければ」の前に必要な活用形(辞書形・連用形・未然形)を取り違えて別の活用形を用いた誤用です。一方4「写さないべきです」は活用形の取り違えではなく、「べきだ」を否定するには本来「写すべきではない」のように「べきだ」自体を否定すべきところを、動詞を否定形にしてから「べきです」を続けており、否定のかけ方(構文の組み立て方)を誤っている点で性質が異なります。"},

{id:"R4-2-4", tag:"R4 試験I 問題2(4)", cat:"「ば」の後件制限",
 text:"(4) 【帰宅すれば、必ずうがいをしなさい。】",
 choices:["部屋に入れば、会話をしてはいけません。","授業に欠席すれば、事前に連絡してください。","北海道へ行けば、早くスキーをしたい。","卒業論文を提出すれば、少し休もう。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「ば」は、後件に同一主体による命令・依頼・勧誘・意志などの表現が来ることを避けるという制限があります。例「しなさい」(命令)、1「してはいけません」(禁止・命令)、3「スキーをしたい」(希望)、4「休もう」(意志)は、いずれもこの制限に触れる誤用です。一方2「事前に連絡してください」は、欠席という不特定多数に起こりうる一般的な事態を条件とした依頼・指示であり、個別の一回的な行為を「ば」で条件づけて働きかけているわけではないため、他とは性質が異なります。"},

{id:"R4-2-5", tag:"R4 試験I 問題2(5)", cat:"感情形容詞の人称制限",
 text:"(5) 【妹は、父にお土産をもらってうれしいです。】",
 choices:["母は、タイ料理を大好きです。","弟は、新しいパソコンを買いたいです。","父は、背中がずきずき痛いです。","兄は、景気が良くなると思います。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"例「うれしい」、2「買いたい」、3「痛い」、4「思う」は、いずれも話し手自身の内的な感情・希望・思考を表す語であり、三人称主語にそのまま使うと不自然になる(人称制限を受ける)ため、「〜がっている」「〜そうだ」「〜ている」などの形にする必要があります。一方1「タイ料理を大好きです」の誤りは人称制限の問題ではなく、「好きだ」が本来ガ格を取る形容動詞であるにもかかわらず、ヲ格「を」を用いてしまった格助詞の誤用であり、性質が異なります。"},

/* ========= データ (令和4年度 試験I 問題3 A〜D) ========= */
{id:"R4-3-1", tag:"R4 試験I 問題3(1)", cat:"助詞の分類",
 text:"次のA〜Dの文章を読み、(1)〜(20)の問いに答えよ。\n\nA【助詞】\n日本語では、名詞や動詞などの内容語のあとに、助詞や助動詞などの機能語が付く形で文が構成される。助詞は、一般に、格助詞、接続助詞、終助詞、とりたて助詞、(ア)助詞などに分類され、多様な機能を持つ。格助詞は、名詞や名詞に準ずるものに付き、文中での格関係を表す。接続助詞は、主に活用する語に付き、継起、原因・理由、条件、逆接などの意味を表す。また、終助詞は文末に使われ、名詞や動詞など様々なものに接続して使用されるが、その接続にはそれぞれ一定の規則がある。その他、複数の語が結合して一つの助詞に準ずる機能を持つようになった複合助詞も多く存在する。\n\n(1) 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["対比","転換","並列","補足"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"助詞は一般に、格助詞・接続助詞・終助詞・とりたて助詞(副助詞)のほかに、複数の語を対等な関係で結び付ける並立助詞(並列助詞)に分類されます。「と」「や」「とか」などがこれにあたるため、(ア)には「並列」が入ります。"},

{id:"R4-3-2", tag:"R4 試験I 問題3(2)", cat:"格助詞",
 text:"(2) 文章中の下線部A(格助詞)の例として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["急いで迎えに行く。","昔と同じ製法で作っている。","夕方になり風も強くなってきた。","電子辞書より紙の辞書が好きだ。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"1「に」(方向・目的)、2「と」(比較・共同の対象)、4「より」(比較の基準)は、いずれも名詞に付いて格関係を表す格助詞です。一方3「風も」の「も」は、格関係を表すのではなく、他にも同類のものがあることを示すとりたて助詞であり、格助詞の例としては不適当です。"},

{id:"R4-3-3", tag:"R4 試験I 問題3(3)", cat:"接続助詞と逆接",
 text:"(3) 文章中の下線部B「逆接」を表すことができない接続助詞を、次の1〜4の中から一つ選べ。",
 choices:["〜から","〜が","〜ながら","〜ものの"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"「〜が」(例:行きたいが、時間がない)、「〜ながら」(例:貧しいながら幸せだ)、「〜ものの」(例:合格したものの、喜べない)は、いずれも逆接の意味を表すことができます。一方「〜から」は原因・理由を表す接続助詞であり、逆接の意味を持つことはありません。"},

{id:"R4-3-4", tag:"R4 試験I 問題3(4)", cat:"終助詞の接続規則",
 text:"(4) 文章中の下線部C「一定の規則」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「さ」は述語が意向形の文に接続できる。","「ぜ」は述語が命令形の文に接続できる。","「ぞ」は述語が否定形の文に接続できる。","「よね」は疑問詞疑問文に接続できる。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「ぞ」は「行かないぞ」のように、否定形の述語に自然に接続します。一方「さ」を意向形に、「ぜ」を命令形に、「よね」を疑問詞疑問文にそのまま接続させるのは不自然であり、いずれも実際の接続規則とは合いません。"},

{id:"R4-3-5", tag:"R4 試験I 問題3(5)", cat:"複合助詞",
 text:"(5) 文章中の下線部D「複合助詞」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「〜にとって」は、「その質問は私にとって難しい。」のように、動作や感情の向けられる対象を表すもので、評価を行う人や立場は表せない。","「〜にわたって」は、「10時間にわたって通行止めとなった。」のように、時間的に広範囲に及ぶことを表すもので、空間的な範囲は表せない。","「〜によって」は、「センサーによって糖度を測定する。」のように、物事の変化に合わせて、それにふさわしく対応するという関係を表す。","「〜につれて」は、「春になるにつれて暖かくなる。」のように、ある事態の進展とともに他の事態も進展するという関係を表す。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"「〜につれて」は、一方の事態の進展に伴って他方の事態も進展するという対応関係を表す複合助詞であり、例文の説明も適切です。1「〜にとって」はむしろ評価を行う人や立場を表す代表的な用法であるため記述が誤り、2「〜にわたって」は空間的範囲にも使えるため誤り、3の例文「センサーによって測定する」は手段を表す用法であり「対応する関係」の説明とは合いません。"},

/* ========= データ (令和4年度 試験I 問題3 B:テ形) ========= */
{id:"R4-3-6", tag:"R4 試験I 問題3(6)", cat:"テ形の作り方",
 text:"B【テ形の作り方と用法】\nテ形は、日本語の動詞の活用形の一つである。辞書形からテ形を作る場合、IIグループは、「る」を取って「て」を付ける。Iグループは、動詞の辞書形の最後が「(ア)」の場合は「〜って」、「(イ)」の場合は「〜んで」、「く」は「〜いて」、「ぐ」は「〜いで」、「す」は「〜して」となる。ただし「(ウ)」は例外である。\n\n(6) 文章中の(ア)と(イ)に入れるのに最も適当な組合せを、次の1〜4の中から一つ選べ。",
 choices:["(ア)う・つ・る (イ)ぬ・ぶ・む","(ア)う・つ・る (イ)ぬ・ふ・ぶ","(ア)つ・む・る (イ)う・ぬ・ぶ","(ア)つ・む・る (イ)ぬ・ふ・ぶ"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"語末が「う・つ・る」の五段動詞は促音便で「〜って」(買う→買って、待つ→待って、帰る→帰って)、語末が「ぬ・ぶ・む」の五段動詞は撥音便で「〜んで」(死ぬ→死んで、遊ぶ→遊んで、飲む→飲んで)となります。したがって(ア)は「う・つ・る」、(イ)は「ぬ・ぶ・む」です。"},

{id:"R4-3-7", tag:"R4 試験I 問題3(7)", cat:"テ形の例外",
 text:"(7) 文章中の(ウ)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["行く","行く・歩く","着る","着る・ある"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"「く」で終わる五段動詞は本来「〜いて」(イ音便)となりますが、「行く」だけは例外的に促音便化して「行って」となります。「歩く」は規則どおり「歩いて」となるため例外ではなく、「着る」はIIグループ動詞なのでこの規則自体の対象外です。したがって例外は「行く」のみです。"},

{id:"R4-3-8", tag:"R4 試験I 問題3(8)", cat:"テ形:主体の様子",
 text:"(8) 文章中の下線部A「従属節が主体の様子を表す用法」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["私は、下山して祖父の所有する旅館に泊まった。","私は、荷物を背負って祖母と山道を登った。","私は、約束の時間に遅れて父に叱られた。","私は、合格の知らせを聞いて安心した。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"2「荷物を背負って山道を登った」は、山道を登るという主節の動作が行われる際の主体の様子(付帯状況)を表しています。1は継起(下山した後に泊まった)、3・4は原因・理由(遅れたから叱られた、聞いたから安心した)を表しており、主体の様子を表す用法ではありません。"},

{id:"R4-3-9", tag:"R4 試験I 問題3(9)", cat:"テ形:原因理由の条件",
 text:"(9) 文章中の(エ)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["従属節と主節の行為の主体がどちらも人の場合","従属節の出来事が第三者の意志的行為の場合","従属節か主節のどちらか、または両方が無意志的な出来事の場合","従属節か主節のどちらか、または両方が過去の出来事の場合"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"(8)で見たように、原因・理由と解釈される例(「遅れて叱られた」「聞いて安心した」)は、主節が受身「叱られた」や自発的な心理変化「安心した」など、動作主の意志が関与しない(無意志的な)出来事です。したがって、従属節か主節のどちらか、または両方が無意志的な出来事である場合に原因・理由の解釈が生じると考えられます。"},

{id:"R4-3-10", tag:"R4 試験I 問題3(10)", cat:"否定のテ形",
 text:"(10) 文章中の下線部B「〜なくて」と「〜ないで」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["原因・理由を表す場合は、「〜ないで」が使われる。","主体の様子を表す場合は、「〜ないで」が使われる。","「〜ないで」は、イ形容詞とナ形容詞どちらにも接続できる。","「〜ないで」は、「名詞+だ」に接続できる。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"付帯状況(主体の様子)を表す場合は「傘を差さないで歩いた」のように「〜ないで」が使われます。原因・理由を表す場合はむしろ「お金がなくて困った」のように「〜なくて」が使われ、「〜ないで」は動詞に接続するもので、イ形容詞・ナ形容詞・「名詞+だ」には接続できません。"},

/* ========= データ (令和4年度 試験I 問題3 C:疑問文) ========= */
{id:"R4-3-11", tag:"R4 試験I 問題3(11)", cat:"否定疑問文",
 text:"C【疑問文】\n日本語の疑問文は、複数の観点から分類できる。まず、述語の肯定・否定により、肯定疑問文と否定疑問文に分けられる。また、文中の何が不明であるかという観点から、真偽疑問文と疑問詞疑問文に分けられる。真偽疑問文において、応答の際に「はい、そうです。」「いいえ、そうではありません。」を使えるのは基本的には(ア)と、「のか」の付いた疑問文である。一方の疑問詞疑問文は、不明な情報を疑問詞で尋ねる疑問文である。疑問詞には、限られたものの中から不特定のものを指示するものと、範囲を限定せず不特定のものを指示するものがある。そのほかにも、疑問文の作り方には様々な方法がある。\n典型的な疑問文には、①話し手に不明な情報があるために判断が成り立たない、②聞き手に問いかけることによって疑問の解消を目指すという二つの基本的な性質がある。①を持たず、②の特徴のみを持つ疑問文は「確認要求」と呼ばれる。\n\n(11) 文章中の下線部A「否定疑問文」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["荷物に危険物は入っていませんか?","そこに立たないでもらえますか?","その漫画、つまらない?","一人で行くのは、無理?"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"1「入っていませんか」は、否定の述語「〜ていません」を用いた正真正銘の否定疑問文です。2は依頼表現、3の「つまらない」は「ない」で終わりますが打消の助動詞ではなく一語の形容詞、4は名詞述語文であり、いずれも述語自体を否定した疑問文ではありません。"},

{id:"R4-3-12", tag:"R4 試験I 問題3(12)", cat:"真偽疑問文の応答",
 text:"(12) 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["イ形容詞述語文","ナ形容詞述語文","名詞述語文","動詞述語文"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「はい、そうです。」「いいえ、そうではありません。」という応答が自然に成り立つのは、「〜ですか」の形をとる名詞述語文(例:「山田さんですか」「はい、そうです。」)です。イ形容詞述語文や動詞述語文では、通常「はい、寒いです」「はい、行きます」のように述語を繰り返す応答になります。"},

{id:"R4-3-13", tag:"R4 試験I 問題3(13)", cat:"疑問詞の種類",
 text:"(13) 文章中の下線部Bの例(限られたものの中から不特定のものを指示する疑問詞)として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["いつ","どこ","なに","どれ"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"「どれ」は「この3つのうちどれが好きですか」のように、あらかじめ限定された範囲(集合)の中から一つを選ぶ疑問詞です。「いつ」「どこ」「なに」は、範囲を限定せず不特定のものを広く尋ねる疑問詞です。"},

{id:"R4-3-14", tag:"R4 試験I 問題3(14)", cat:"疑問文の作り方",
 text:"(14) 文章中の下線部C「疑問文の作り方」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["普通体のイ形容詞述語文は、文末イントネーションを上昇調にする。","普通体のナ形容詞述語文は、「だ」を取って文末イントネーションを上昇調にする。","普通体の動詞述語文では、文末の動詞のアクセントを変える。","文末の「です・ます」には、述語の品詞にかかわらず後ろに「か」を付ける。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"普通体の動詞述語文で疑問文を作る場合も、イ形容詞述語文などと同様に文末イントネーションを上昇調にするのであって、動詞のアクセント(高低)自体を変えるわけではありません。したがって3が不適当な記述です。"},

{id:"R4-3-15", tag:"R4 試験I 問題3(15)", cat:"確認要求",
 text:"(15) 文章中の下線部D「確認要求」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["あの、失礼ですが、田中さんでしょうか?","寒いでしょう? 暖房を入れようよ。","退職した鈴木さん、元気かしら?","今、忙しいかな? 暇だったら頼みがあるんだけど。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"2「寒いでしょう?」は、話し手が既に「寒い」と判断しており(不明な情報があるわけではない)、その判断について聞き手の同意・確認を求めているだけの確認要求です。1・3・4は、話し手自身にも本当のところが分からず、判断が成り立たない(不明な情報がある)真の疑問であり、確認要求ではありません。"},

/* ========= データ (令和4年度 試験I 問題3 D:スコープ) ========= */
{id:"R4-3-16", tag:"R4 試験I 問題3(16)", cat:"否定のスコープ",
 text:"D【スコープ】\nある要素が作用を及ぼす範囲を「スコープ(作用域)」と呼ぶ。否定のスコープは、しばしば数量表現との関係で問題にされ、意味的に否定を受ける部分は(ア)と呼ばれる。例えば、「講演会には50人も参加していない。」という文は、「講演会に50人参加していない」という解釈(欠席者50人)と「講演会に参加している人は50人に達していない」という解釈(参加者50人未満)があり得る。\nスコープは、否定述部と呼応する副詞の解釈にも用いられる。また、否定述部との呼応は、一部のとりたて助詞にも認められる。加えて、とりたて助詞は、肯定・否定に限らず述部との呼応関係に複雑な制約を持っている。\n\n(16) 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["フォーカス","ストレス","プロソディー","プロミネンス"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"否定文において意味的に否定を受ける部分は「フォーカス(焦点)」と呼ばれます。ストレス・プロソディー・プロミネンスは音声学・音韻論で用いられる強勢・韻律・卓立などに関する用語であり、否定のスコープの説明には用いられません。"},

{id:"R4-3-17", tag:"R4 試験I 問題3(17)", cat:"否定のスコープの解釈",
 text:"(17) 文章中の下線部A「「講演会に50人参加していない」という解釈(欠席者50人)」において意味的に否定されているのはどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「講演会に」","「50人」","「参加している」","「50人も参加している」"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「欠席者50人」の解釈は、「(特定の)50人については、講演会に参加している、ということはない」という意味であり、否定されているのは「50人」という数量そのものではなく、その50人が「参加している」という事態です。したがってフォーカス(否定される部分)は「参加している」です。"},

{id:"R4-3-18", tag:"R4 試験I 問題3(18)", cat:"否定と呼応する副詞",
 text:"(18) 文章中の下線部B「否定述部と呼応する副詞」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["息子はいまだに働かない。","あいつはろくに笑わない。","彼女は本当にしゃべらない。","私はまだ寝たくない。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「ろくに」は「ろくに〜ない」のように、常に否定述語と組になって用いられる副詞(呼応の副詞)です。「いまだに」「本当に」「まだ」は否定文にも肯定文にも使え、否定述部と必ず呼応するわけではありません。"},

{id:"R4-3-19", tag:"R4 試験I 問題3(19)", cat:"否定と呼応するとりたて助詞",
 text:"(19) 文章中の下線部C「一部のとりたて助詞」に関して、否定述部と呼応するとりたて助詞として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["しか","しか、さえ","すら","すら、さえ"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"「しか」は「〜しか…ない」のように、必ず否定述語と呼応して用いられるとりたて助詞です。「さえ」「すら」は「子供でさえ分かる」のように肯定文でも使えるため、否定述語と必ず呼応するとは言えません。"},

{id:"R4-3-20", tag:"R4 試験I 問題3(20)", cat:"とりたて助詞と述部の呼応制約",
 text:"(20) 文章中の下線部Dに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["限定を表す「ばかり」は、禁止を表す述部とは共起しにくい。","評価を表す「なんか」は、否定を表す述部とは共起しにくい。","極限を表す「まで」は、非過去を表す平叙文の述部とは共起しにくい。","例示を表す「でも」は、過去を表す平叙文の述部とは共起しにくい。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"「でも」(例示用法)は「お茶でも飲みましょう」のように、勧誘や意志など未実現の事柄を述べる文で使われるのが基本で、既に完了した事実を述べる過去の平叙文(「お茶でも飲んだ」など)とは共起しにくい性質があります。「ばかり」は禁止表現、「なんか」は否定表現と自然に共起し、「まで」も文脈によっては非過去の平叙文と共起できるため、1〜3の記述は適当ではありません。"},

/* ========= データ (令和4年度 試験I 問題4) ========= */
{id:"R4-4-1", tag:"R4 試験I 問題4 問1", cat:"コースデザイン:コース設計の流れ",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n教育活動を効果的に運営・実施するためには、コース全体の評価が欠かせない。コースの途中や終了時に、コース設計や教室活動・運営が適切であったかどうかを様々な観点から点検し、コース全体の改善を図る必要がある。\n通常、コースでは、到達度テスト等の結果を用いて学習者の評価を行う。その結果を平均値や標準偏差を用いるなどして詳細に分析することで、カリキュラムデザインやシラバスデザインが適切であったかどうかが確認できる。コース終了時に学習者アンケートやインタビュー、潜在的カリキュラム(隠れたカリキュラム)についての調査も行うと、より全体的な状況把握ができる。また、各授業の教案や授業日誌があると具体的に改善点を考えやすくなる。\n\n問1 文章中の下線部A「コース設計」の一連の流れとして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ニーズ・レディネス調査→目標言語調査→シラバスデザイン→到達目標の設定","ニーズ・レディネス調査→目標言語調査→到達目標の設定→シラバスデザイン","目標言語調査→到達目標の設定→シラバスデザイン→ニーズ・レディネス調査","目標言語調査→到達目標の設定→ニーズ・レディネス調査→シラバスデザイン"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"コースデザインは一般に、学習者のニーズ・レディネス調査→目標言語調査→到達目標の設定→シラバスデザイン→教材選定・作成という順序で進められます。したがって選択肢2が正しい順序です。"},

{id:"R4-4-2", tag:"R4 試験I 問題4 問2", cat:"コースデザイン:到達度テスト",
 text:"問2 文章中の下線部B「到達度テスト」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["授業内容にとらわれず、その時点の学習者の日本語力を測定する。","クラス分けを検討するために、技能別に日本語力を測定する。","第二言語学習に対して、どの程度適性を備えているかを測定する。","一定期間に学習した内容を、どの程度習得したかを測定する。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"到達度テストは、一定の期間に学習した特定の内容がどの程度習得できたかを測定するテストです。1は熟達度テスト、2はプレースメントテスト、3は適性テストの説明であり、到達度テストの説明ではありません。"},

{id:"R4-4-3", tag:"R4 試験I 問題4 問3", cat:"コースデザイン:標準偏差",
 text:"問3 文章中の下線部C「標準偏差」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者集団における平均点からの得点の散らばり具合が分かる。","学習者集団の得点を順番に並べたとき、中央にくる得点が分かる。","学習者集団における学習者の能力の違いをどの程度見分けられているかが分かる。","学習者集団にとって、どの程度の難易度だったかが分かる。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"標準偏差は、得点が平均値からどの程度散らばっているか(ばらつきの大きさ)を示す統計量です。2は中央値、3は識別力、4は難易度(正答率)に関する説明であり、標準偏差の説明ではありません。"},

{id:"R4-4-4", tag:"R4 試験I 問題4 問4", cat:"コースデザイン:潜在的カリキュラム",
 text:"問4 文章中の下線部D「潜在的カリキュラム(隠れたカリキュラム)」に含まれるものとして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["時間の制約で授業中にできなかった学習活動","到達目標を細分化した各授業の学習目標","教育機関が有する価値観や社会的風土","教師が使用する教授法やドリル"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"潜在的カリキュラム(隠れたカリキュラム)とは、公式のカリキュラムには明示されていないものの、学習環境や機関の雰囲気を通じて学習者に暗黙のうちに伝わる価値観や規範、社会的風土などを指します。1・2・4はいずれも顕在的(明示的)なカリキュラムに関するものです。"},

{id:"R4-4-5", tag:"R4 試験I 問題4 問5", cat:"コースデザイン:教案作成",
 text:"問5 文章中の下線部E「各授業の教案」を作成する際の留意点として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["すぐに該当ページが分かるよう、使用する教材のページ番号を書いておく。","授業が時間内に終わるよう、活動にかかる時間や時間経過を書いておく。","各教室活動をスムーズに行えるよう、活動形態と学習者の配置を記述しておく。","学習者の能力差に対応できるよう、目標は抽象的な表現で記述しておく。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"教案(授業案)の目標は、授業後に達成できたかどうかを具体的に評価できるよう、できるだけ具体的・明確な表現で記述すべきです。「抽象的な表現で記述しておく」ことは教案作成の留意点として不適当です。"},

/* ========= データ (令和4年度 試験I 問題5) ========= */
{id:"R4-5-1", tag:"R4 試験I 問題5 問1", cat:"アカデミック・ジャパニーズ:ディベート",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n大学や大学院に在籍する学習者は、アカデミック・ジャパニーズを学ぶ必要がある。四技能の連携を意識したアカデミック・ジャパニーズの授業では、例えば、あるテーマについて、まずディベートを通して考えを深め、そのあとでレポートや論文にまとめるという流れが考えられる。\n説得力のあるレポートや論文を書くためには、論理関係を示す表現を適切に使う能力や専門用語を分かりやすい表現で説明する能力が求められる。用いる表現のコロケーション(表現の組合せ)にも注意しなければならない。また、パラグラフを構成する中心文と(ア)にも留意する。\n評価の段階では、教師は学習目的に応じて適切な文章評価の方法を選択する必要がある。\n\n問1 文章中の下線部A「ディベート」の実施における留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["直感で決めた自分の立場を最後まで保持する。","中立で客観的な立場から意見を述べる。","テーマによっては勝敗の判定は不要である。","一つのテーマでは一つの争点を扱う。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"ディベートでは、議論が拡散しないよう、一つのテーマにつき一つの争点(論点)を明確に設定して行うのが基本です。ディベートは賛成・反対に分かれて一方の立場から主張する形式(中立ではない)で、勝敗の判定を伴うのが通常であるため、他の選択肢は適当ではありません。"},

{id:"R4-5-2", tag:"R4 試験I 問題5 問2", cat:"アカデミック・ジャパニーズ:メタ言語",
 text:"問2 文章中の下線部Bのように、言葉の意味を説明するために用いられる言語のことを何と言うか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["対象言語","照会言語","パラ言語","メタ言語"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"ある言語(対象言語)の意味や構造を説明するために用いられる言語は「メタ言語」と呼ばれます。専門用語をわかりやすい言葉で説明する行為はメタ言語を用いた行為です。「対象言語」は説明される側の言語、「パラ言語」は声の質や話す速さなど言語外的な情報を指し、いずれも該当しません。"},

{id:"R4-5-3", tag:"R4 試験I 問題5 問3", cat:"アカデミック・ジャパニーズ:コロケーションの誤用",
 text:"問3 文章中の下線部C「コロケーション」の誤用例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["近年、健康のために、登山に関心する人が増加している。","未来、宇宙工学の大きな発展に寄与するであろう実験結果が得られた。","勤務先から許可を聞くことなく、在宅業務を行うのは禁じられている。","遺跡から、過去に大きな戦いがあったことが了解できる。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「許可を聞く」は、正しくは「許可を得る」「許可をもらう」という組合せ(コロケーション)にすべきところであり、典型的なコロケーションの誤用例です。他の選択肢の表現の組合せは、いずれも不自然な誤用とまでは言えません。"},

{id:"R4-5-4", tag:"R4 試験I 問題5 問4", cat:"アカデミック・ジャパニーズ:パラグラフ構成",
 text:"問4 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["支持文","有題文","遂行文","現象文"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"パラグラフ・ライティングでは、パラグラフの主張を述べる「中心文(トピックセンテンス)」と、それを具体的に裏付ける「支持文(サポーティングセンテンス)」から構成されるのが基本とされます。「有題文」「遂行文」「現象文」は文法論で用いられる文の分類であり、パラグラフ構成の説明には用いられません。"},

{id:"R4-5-5", tag:"R4 試験I 問題5 問5", cat:"アカデミック・ジャパニーズ:文章評価の方法",
 text:"問5 文章中の下線部D「文章評価の方法」として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["文法、構成などの観点を設ける方法では、その観点ごとに別々に評価する。","誤りの数によって減点する方法では、誤りの種類により配点を変えて評価する。","達成度の評価では、学習者の産出を見てから評価基準を決めて評価する。","5段階、10段階などの単一尺度の評価では、複数の採点者で評価する。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"評価基準は、評価の公平性・客観性を保つため、学習者の産出物を見る前にあらかじめ設定しておくべきものです。「産出を見てから評価基準を決める」のでは基準が恣意的になりかねず、不適当な方法です。"},

/* ========= データ (令和4年度 試験I 問題6) ========= */
{id:"R4-6-1", tag:"R4 試験I 問題6 問1", cat:"JFスタンダード:相互理解のための日本語",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n「ヨーロッパ言語共通参照枠(CEFR)」の考え方を基礎に、国際交流基金が開発した「JF日本語教育スタンダード(JFスタンダード)」が注目されている。JFスタンダードは「相互理解のための日本語」を理念としている。この理念を達成するためには、「課題遂行能力」と「(ア)」の二つが必要であるとされている。そして、「課題遂行能力」の向上を目指した教育実践を行いやすくするために、コミュニケーション言語能力とコミュニケーション言語活動の関係を示している。\nJFスタンダードでは、独自に作成した能力記述文「JF Can-do」で日本語の熟達度が示されている。また、JFスタンダードに準拠したコースブックとして『まるごと 日本のことばと文化』や『いろどり 生活の日本語』が開発されている。\n\n問1 文章中の下線部A「相互理解のための日本語」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「相互理解のための日本語」には母語話者と非母語話者のコミュニケーションが含まれ、母語話者の日本語を理想的なモデルとしている。","「相互理解のための日本語」では、コミュニケーション上の課題を遂行する状況や場面で日本語を使用することが必須とされている。","「相互理解のための日本語」によるコミュニケーションとは、発信者と受信者がある領域や場で特定の課題を共同で遂行することだと捉えられている。","「相互理解のための日本語」を用いて人々が共に生きていくためには、日本語に関する知識の量と質が最も重要であると考えられている。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"JFスタンダードはCEFRの行動中心アプローチに基づき、コミュニケーションを、発信者と受信者がある領域・場面で特定の課題を共同で遂行する行為として捉えます。母語話者の日本語を理想のモデルとはしておらず(1は誤り)、知識の量・質を最重要視する立場でもありません(4は誤り)。"},

{id:"R4-6-2", tag:"R4 試験I 問題6 問2", cat:"JFスタンダード:課題遂行能力と異文化理解能力",

{id:"R4-6-3", tag:"R4 試験I 問題6 問3", cat:"CEFR:コミュニケーション言語活動",
 text:"問3 文章中の下線部B「コミュニケーション言語活動」に含まれないものを、次の1〜4の中から一つ選べ。",
 choices:["受容","産出","翻訳","やり取り"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"CEFRおよびJFスタンダードにおけるコミュニケーション言語活動は、「受容」「産出」「やり取り」「仲介」の4種類に分類されます。「翻訳」はこの4分類のいずれの名称にも当たらず、コミュニケーション言語活動として含まれません。"},

{id:"R4-6-4", tag:"R4 試験I 問題6 問4", cat:"JFスタンダード:JF Can-do",
 text:"問4 文章中の下線部C「JF Can-do」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["具体的な言語活動を例示しないことで普遍性が確保され、様々な活動に応用できる。","言語能力と言語活動を網羅的に示しており、学習成果の評価を行うことができる。","文型や文法、単語や漢字をどの程度知っているかという観点から熟達度が分かる。","現在の能力を把握し、今後の学習目標を立てるのに役立てることができる。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"JF Can-doは「〜ができる」という形で具体的な言語活動を例示する能力記述文であり、学習者が自分の現在の日本語能力を把握し、今後の学習目標を設定する際の目安として活用できます。文法・語彙・漢字の知識量を測るものではなく(3は誤り)、具体的な活動を例示しないわけでもありません(1は誤り)。"},

{id:"R4-6-5", tag:"R4 試験I 問題6 問5", cat:"JFスタンダード:いろどり生活の日本語",
 text:"問5 文章中の下線部D「いろどり 生活の日本語」の特徴として最も適当なものを、次の1〜4の中から一つ選べ。",

/* ========= データ (令和4年度 試験I 問題7) ========= */
{id:"R4-7-1", tag:"R4 試験I 問題7 問1", cat:"学習者オートノミー:定義",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語学習者の多様化が進んでいる。それに伴い、教育現場では学習者オートノミーが注目されるようになった。学習者オートノミーによる学習は、教師の指導を受けずにテキストなどで学習する(ア)とは異なるものである。具体的な実践としては、学習者が目標設定、計画、実行、評価というサイクルを繰り返す。このうち、評価の方法としては、学習者自身が学習日誌をつけることなどがある。今後は学習者オートノミーを育てるために、教師は様々な工夫を行うことが重要である。\n\n問1 文章中の下線部A「学習者オートノミー」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習ストラテジーの訓練で身につく能力","標準化された授業を通じて得られる能力","他者から自立して独力で行動できる能力","学習者が自分自身の学習を管理する能力"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"学習者オートノミーとは、学習者が自らの学習の目標設定・計画・実行・評価を自分自身で管理・統制する能力を指します(Holecの定義に基づく)。単に「他者から自立して独力で行動できる」という一般的な自立とは異なり、あくまで「自分の学習」を管理する能力である点がポイントです。"},

{id:"R4-7-2", tag:"R4 試験I 問題7 問2", cat:"学習者オートノミー:独習",
 text:"問2 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["演習","独習","探求学習","暗示的学習"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「教師の指導を受けずにテキストなどで学習する」ことは「独習」と呼ばれます。独習は必ずしも学習者自身が目標設定・計画・評価のサイクルを主体的に管理するわけではない点で、学習者オートノミーとは区別されます。"},

{id:"R4-7-3", tag:"R4 試験I 問題7 問3", cat:"学習者オートノミー:メタ認知能力",
 text:"問3 文章中の下線部B(目標設定、計画、実行、評価というサイクルを繰り返す)を行うために必要な能力として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["コミュニケーション能力","バリエーション能力","学習言語能力","メタ認知能力"], choiceLabels:["1","2","3","4"], answer:3,

{id:"R4-7-4", tag:"R4 試験I 問題7 問4", cat:"学習者オートノミー:学習日誌",
 text:"問4 文章中の下線部C「学習日誌」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["教師から毎日フィードバックを受けなければならない。","学習のことだけでなく日常生活のことも書かなければならない。","自分の学習の問題点を探り改善することを目的とするものである。","日本語で書く力を確認するために日本語で書くものである。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"学習日誌は、学習者が自分の学習過程を振り返り、問題点を見つけて今後の学習の改善に生かすことを目的とした自己評価・内省のためのツールです。教師による毎日のフィードバックや、使用言語、記述内容(日常生活)を必須の要件とするものではありません。"},

{id:"R4-7-5", tag:"R4 試験I 問題7 問5", cat:"学習者オートノミー:教師の支援",
 text:"問5 文章中の下線部D「学習者オートノミーを育てるため」の教師の工夫として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["習得順序に沿った学習項目の配列で、最初から順に教えられるような教材を作る。","学習者が必要なときに資料や教材にアクセスできるような教室環境を作る。","クラスの学習者同士で安心して話ができるような雰囲気を作る。","学習者と地域の人々とのネットワークが形成できるような機会を作る。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"学習者オートノミーを育てるには、学習者自身が資源にアクセスし、自ら選択・行動できる環境や関係性を整えることが重要です。「最初から順に教えられるような教材」を用意することは、教師主導の一方的な提示を前提としており、学習者の主体的な選択の余地を狭めるため、オートノミーを育てる工夫としては不適当です。"},

/* ========= データ (令和4年度 試験I 問題8) ========= */
{id:"R4-8-1", tag:"R4 試験I 問題8 問1", cat:"異文化接触:カルチャーショック",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n異文化との接触においては様々な心理的問題が生じる。例えば、留学などで異文化環境へ移動した際にはカルチャー・ショックを受けることがある。ベリー(J. W. Berry)は異文化に接した際の文化受容態度を「統合」「同化」「分離」「周辺化」の四つのタイプに類型化し、理論的な枠組みを示した。この文化受容態度は(ア)とも関わりが深い。\n異文化環境で円滑な人間関係を作るために、ホール(E. Hall)はコンテクストの概念が重要だと述べている。また、異文化環境において場面に応じた適切な行動をとるためには、自己効力感を高めることが有効である。\n\n問1 文章中の下線部A「カルチャー・ショック」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["異文化への拒絶反応で、内容や程度に当事者の立場による差はない。","異文化に対する期待が大きい人ほど、ショックを受けにくい。","自己への気づきと異文化への理解を深めることができる機会となる。","自文化中心的で異文化を受け入れようとしない人ほど、ショックを受けやすい。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"カルチャー・ショックは単なる否定的反応にとどまらず、それを通じて自己を見つめ直し、異文化理解を深める成長の機会にもなり得ると捉えられています。ショックの内容や程度は当事者の立場によって異なり(1は誤り)、期待が大きいほど現実とのギャップからショックを受けやすくなります(2は誤り)。"},

{id:"R4-8-2", tag:"R4 試験I 問題8 問2", cat:"ベリーの文化受容態度:分離",
 text:"問2 文章中の下線部B「分離」の態度の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["滞在国の人は大切だと思わないが、自分の国から来た人は大切だ。","滞在国の人と親しくなりたいが、自分の国から来た人とは距離を置きたい。","自分の国から来た人とも、滞在国の人とも、親しくすることは重要だ。","自分の国から来た人にも、滞在国の人にも、心を開くのは難しい。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"ベリーの文化受容態度における「分離」は、自文化を保持しつつ、滞在国の文化との接触を避ける態度です。1はまさにこれに該当します。2は「同化」、3は「統合」、4は「周辺化」の例です。"},

{id:"R4-8-3", tag:"R4 試験I 問題8 問3", cat:"文化受容態度とアイデンティティ",
 text:"問3 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["アイデンティティ","アフォーダンス","エンパシー","コーピング"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"ベリーの文化受容態度(統合・同化・分離・周辺化)は、自文化と滞在国文化のどちらに自己を同一化するかという「アイデンティティ」のあり方と密接に関わっています。アフォーダンス・エンパシー・コーピングは、それぞれ知覚心理学・共感・ストレス対処に関する用語であり、この文脈には合いません。"},

{id:"R4-8-4", tag:"R4 試験I 問題8 問4", cat:"ホールの高・低コンテクスト文化",
 text:"問4 文章中の下線部C「コンテクストの概念」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["低コンテクスト文化では、問題が生じた際に直接的な対立になりにくい。","低コンテクスト文化では、言われたことを文字どおりに解釈する傾向が強い。","高コンテクスト文化では、個人は他者から独立した存在だと捉えられやすい。","高コンテクスト文化では、自分の意思を明確に言語化して表現する傾向が強い。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"低コンテクスト文化は、意味の多くを明示的な言語メッセージに込めるため、言われたことを文字どおりに解釈する傾向が強くなります。低コンテクスト文化はむしろ直接的な対立を辞さない傾向があり(1は誤り)、高コンテクスト文化は個人を相互依存的な存在と捉え、意思表示も間接的・非言語的になりがちです(3・4は誤り)。"},

{id:"R4-8-5", tag:"R4 試験I 問題8 問5", cat:"自己効力感",
 text:"問5 文章中の下線部D「自己効力感」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["あるがままの自分を受け入れること","自らの行動を自らの意思で決定すること","思い描く自己像に現実の自分を近づけること","あることが自分には必ずできると考えること"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"自己効力感(セルフ・エフィカシー、バンデューラ)とは、ある課題や行動を「自分は実行できる」と信じる感覚のことです。1は自己受容、2は自己決定、3は理想自己への接近に関する説明であり、自己効力感の定義とは異なります。"},

/* ========= データ (令和4年度 試験I 問題9) ========= */
{id:"R4-9-1", tag:"R4 試験I 問題9 問1", cat:"読解過程:形式スキーマ",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n文章や談話を理解するために、脳内では複雑な処理が行われている。例えば、語彙処理や意味処理などが行われ、既有の知識が統合される。その過程においては、予測や推論が重要な役割を果たしている。また、これらの処理には認知資源が関わっている。認知資源の量は、リーディングスパンテストやリスニングスパンテストなどで測ることができる。\n音声理解の過程では、知覚の段階で音韻表象が形成される。一般的に、カクテルパーティー効果がよく知られ、私たちは日常的に体験している。\n\n問1 文章中の下線部A「既有の知識」のうち、「形式スキーマ」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["言語の背景にある社会文化的な知識","言語に対する感覚的で直観的な知識","身振りや絵で説明可能な物事についての知識","修辞や文章の構造についての知識"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"スキーマには、話題やテーマに関する背景知識である「内容スキーマ」と、文章の修辞構造やジャンルごとの型に関する知識である「形式スキーマ」があります。「修辞や文章の構造についての知識」はまさに形式スキーマの説明です。"},

{id:"R4-9-2", tag:"R4 試験I 問題9 問2", cat:"読解過程:橋渡し推論",
 text:"問2 文章中の下線部B「推論」の一種である「橋渡し推論」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「手の引っかき傷が痛む。猫は走って逃げていった。」という文から、猫に手を引っかかれたと推論する。","「その日の朝は駅まで歩いた。20分ほどで着いた。」という文から、天気のいい日だと推論する。","「バッターが打ち上げた。打球はこちらに飛んできた。」という文から、その後の展開を推論する。","「背後から女性に声をかけられた。知らない女性だった。」という文から、女性が何と言ったか推論する。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"橋渡し推論(結束推論)は、二つの文をつなげて意味的な一貫性を成立させるために必要な推論です。1は、「手の傷」と「猫が逃げた」という二文をつなげるために「猫に引っかかれた」という因果関係を補う、典型的な橋渡し推論です。2〜4は、文の理解に必須ではない情報を補う精緻化推論や、未出来事を予測する予測推論の例です。"},

{id:"R4-9-3", tag:"R4 試験I 問題9 問3", cat:"認知資源",
 text:"問3 文章中の下線部C「認知資源」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ある一時期に起こった個人の出来事に関する記憶のこと","情報を処理するために消費される心的なエネルギーのこと","ある語に関して個人の頭の中に想定されている知識の総体のこと","目や耳などから受けた情報の一部を一時的に保管できる容量のこと"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"認知資源とは、情報処理(理解・記憶・注意など)を行うために消費される心的エネルギー(処理容量)のことです。1はエピソード記憶、3は語彙知識(意味ネットワーク)、4は記憶容量(短期記憶容量)に関する説明であり、認知資源そのものの定義とは異なります。"},

{id:"R4-9-4", tag:"R4 試験I 問題9 問4", cat:"リスニングスパンテスト",
 text:"問4 文章中の下線部D「リスニングスパンテスト」の方法として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["句や文を聞いてから、聞き取った音声をそのまま書き取る。","短い文章を聞きながら単語をメモし、文章を復元する。","聞こえてくる文の内容を正誤判断しながら、文末の単語を覚える。","句や文を黙読しながら意味を理解し、記憶を頼りに声に出して言う。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"リスニングスパンテストは、リーディングスパンテストの聴覚版で、聞こえてくる文の内容(正誤)を判断する処理を行いながら、同時に各文末の単語を記憶し、後でまとめて再生させることで、聴解時の認知資源(ワーキングメモリ容量)を測定します。"},

{id:"R4-9-5", tag:"R4 試験I 問題9 問5", cat:"カクテルパーティー効果",
 text:"問5 文章中の下線部E「カクテルパーティー効果」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["視覚から受けた情報が音声の知覚を補っている。","聴覚からの刺激に対して選択的に注意が働いている。","聞き取れなかった一部の音を補って知覚している。","先に受けた音声刺激が後の音声理解に影響している。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"カクテルパーティー効果とは、周囲が騒がしい状況でも、自分の関心のある音声(自分の名前や会話相手の声など)だけを選択的に聞き取れる現象で、聴覚的な選択的注意の働きによるものです。"},

/* ========= データ (令和4年度 試験I 問題10) ========= */
{id:"R4-10-1", tag:"R4 試験I 問題10 問1", cat:"第二言語習得:モニターモデル",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n第二言語習得の分野では、習得を促進する要因についての研究が行われてきた。その要因の一つにインプットがあり、インプットを重視したナチュラル・アプローチは、(ア)を基盤としたものである。\nインプットの重要性は研究によって捉え方が異なるものの、言語の習得にはインプットがインテイクになる必要がある、という点は共通している。さらに、ティーチャー・トークなどによるインプットが学習者の理解を助けるとの報告もある。また、インプットのほかにアウトプットや他の要素も注目されている。例えば、アウトプット仮説やインターアクション仮説などである。\n\n問1 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["文化変容モデル","モニターモデル","処理可能性理論","アコモデーション理論"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"クラッシェンとテレルによる「ナチュラル・アプローチ」は、クラッシェンの「モニターモデル」(習得・学習仮説、モニター仮説、自然習得順序仮説、インプット仮説、情意フィルター仮説から成る)を理論的基盤としています。"},

{id:"R4-10-2", tag:"R4 試験I 問題10 問2", cat:"第二言語習得:インテイク",
 text:"問2 文章中の下線部A「インテイク」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["まとまって記憶された言語表現のかたまり","一度取り込まれたら安定的に持続する記憶","学習者が注意を向けて頭の中に取り込んだもの","学習者が誤りに気づいて修正した発話"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"インテイクとは、学習者に与えられたインプットのうち、学習者が実際に注意を向けて処理し、頭の中に取り込んだ部分のことを指します。インプットの全てがそのままインテイクになるわけではありません。"},

{id:"R4-10-3", tag:"R4 試験I 問題10 問3", cat:"ティーチャー・トークの特徴",
 text:"問3 文章中の下線部B「ティーチャー・トーク」の特徴として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["自身の発話を繰り返す傾向がある。","平叙文より質問文を使う傾向がある。","従属節を多用する傾向がある。","ポーズが少ない傾向がある。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"ティーチャー・トークは、学習者への理解を助けるために簡略化された教師の発話で、自身の発話を繰り返す、ゆっくり話す、ポーズを多く取る、従属節を減らして単純な構造にするといった特徴があります。「従属節を多用する」「ポーズが少ない」はむしろ逆の特徴です。"},

{id:"R4-10-4", tag:"R4 試験I 問題10 問4", cat:"アウトプットの必要性",
 text:"問4 文章中の下線部Cの理由として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["インプットだけでは、文法的な正確さが身につきにくいから","インプットだけでは、発話の流暢さが身につきにくいから","インプットだけでは、リスニング能力が身につきにくいから","インプットだけでは、コミュニケーション能力が身につきにくいから"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"スウェインは、カナダのフレンチ・イマージョン教育を受けた学習者が、大量のインプットを受けていたにもかかわらず、文法的な正確さの面で母語話者に及ばなかったことから、インプットだけでは文法的正確さが十分に身につかないと指摘し、アウトプットの必要性(アウトプット仮説)を提唱しました。"},

{id:"R4-10-5", tag:"R4 試験I 問題10 問5", cat:"アウトプット仮説",
 text:"問5 文章中の下線部D「アウトプット仮説」の考え方として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["発話の産出によって目標言語の特徴が意識的に分析でき、習得が促進される。","発話の産出を通じて言いたいことが言えないことに気づき、習得が促進される。","声に出して発話を産出する行為そのものによって、習得が促進される。","誤りの訂正を受けて発話を産出し直すことによって、習得が促進される。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"アウトプット仮説は、アウトプットが持つ「気づき機能」(2)、「仮説検証機能」(4)、「メタ言語的機能」(1)という認知的な働きを通じて習得が促進されると考えるものであり、単に「声に出す」という産出行為そのものが習得を促進するとは考えません。したがって3は不適当な記述です。"},

/* ========= データ (令和4年度 試験I 問題11) ========= */
{id:"R4-11-1", tag:"R4 試験I 問題11 問1", cat:"ガ行鼻濁音",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n言語は常に変化しており、日本語も例外ではない。例えば、近年ガ行鼻濁音が急速に失われてきた。日本語の変化を長期的に見ると、過去にはさらに大きな音韻変化が起こっており、その痕跡は現在の仮名表記と音韻とのずれにも認められる。言語変化は音韻だけでなく文法にも見られ、ら抜き言葉、さ入れ言葉などが浸透してきている。さらに、敬語にも変化が起こっている。また、方言周圏論では、言葉の地理的分布に言語変化の歴史が現れることが指摘されている。\n\n問1 文章中の下線部A「ガ行鼻濁音」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["現在も世代を問わず規範的な発音だと認識されている。","国内では既に使用される地域がなくなっている。","語末または単独で用いる[ɴ]で表される音である。","共通語で語頭以外のガ行音に現れることがある。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"ガ行鼻濁音[ŋ]は、共通語において語頭以外(語中)のガ行音に現れる音で、例えば「かがみ」の「が」などに見られます。若い世代を中心に急速に失われつつあり(1は誤り)、地域や話者によってはまだ使用されており(2は誤り)、[ɴ]は語末や単独で用いられる撥音(ん)を表す記号であってガ行鼻濁音を表すものではありません(3は誤り)。"},

{id:"R4-11-2", tag:"R4 試験I 問題11 問2", cat:"音韻変化の歴史",
 text:"問2 文章中の下線部B「音韻変化」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["タ行音は子音が全て/t/であったが、現在は「チ」と「ツ」は音が変化し異なる子音になった。","ハ行音は子音が全て/ç/であったが、現在は「ヒ」以外の「ハ・フ・ヘ・ホ」は音が変化し異なる子音になった。","「ヂ」と「ジ」は異なる音/dʑi/と/ʑi/であったが、現在は同一の音に統合され、区別がなくなった。","「ヲ」と「オ」は異なる音/wo/と/o/であったが、現在は同一の音に統合され、/wo/の音が使用されなくなった。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"ハ行音の子音は、歴史的には/p/(後に/ɸ/)であったとされ、現在の「ヒ」の子音である/ç/が全てのハ行音の元の子音であったわけではありません(いわゆる「ハ行転呼」)。したがって2の記述が不適当です。1(タ行の破擦音化)、3(四つ仮名の統合)、4(ワ行「ヲ」と「オ」の統合)は、いずれも実際に起こった音韻変化として妥当な記述です。"},

{id:"R4-11-3", tag:"R4 試験I 問題11 問3", cat:"ら抜き言葉",
 text:"問3 文章中の下線部C「ら抜き言葉」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["一段活用動詞とカ行変格活用動詞における可能動詞化と捉えられる。","五段活用動詞とサ行変格活用動詞における可能動詞化と捉えられる。","「られる」の四つの用法のうち、「自発」の用法に起きている。","「られる」の四つの用法のうち、「尊敬」の用法に起きている。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"ら抜き言葉は、一段活用動詞(食べられる→食べれる)やカ行変格活用動詞(来られる→来れる)において、五段活用動詞の可能動詞(書く→書ける)に倣って「られる」の「ら」を落とし、独自の可能形を作る現象で、主に「可能」の用法に起きています。"},

{id:"R4-11-4", tag:"R4 試験I 問題11 問4", cat:"敬語の変化",
 text:"問4 文章中の下線部D(敬語の変化)に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["現在は、言葉遣いから職業が分かるなど、職業による敬語使用の違いが顕著になっている。","現在は、本来は二重敬語である「お伺いする」「お見えになる」が、習慣として定着している。","現在は、許可求めの「〜させていただく」が広く使われるようになり、尊敬語として普及している。","現在は、敬語の使い分けの基準が、相手との心理的距離から相手の社会的立場に移行してきている。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「お伺いする」「お見えになる」は、本来は二重敬語(過剰な敬語)にあたりますが、現在では習慣として広く定着し、違和感なく使われています。「〜させていただく」は謙譲語であり尊敬語ではなく(3は誤り)、敬語の使い分けの基準はむしろ社会的立場(上下関係)から心理的距離(親疎関係)へ移行してきているとされ、4は逆の記述です。"},

{id:"R4-11-5", tag:"R4 試験I 問題11 問5", cat:"方言周圏論",
 text:"問5 文章中の下線部E「方言周圏論」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["方言の体系が東西で分かれ、それぞれの中心地から近い位置により新しい語形、遠い位置により古い語形が残っているという論","方言の体系が東西で分かれ、それぞれの中心地から円を描いて方言区画が形成され、東西で類似の文法体系が見られるという論","文化の中心地から波紋が広がるように、近い位置により新しい語形、遠い位置により古い語形が残っているという論","文化の中心地から波紋が広がるように、円を描いて方言区画が形成され、区画内で類似の文法体系が見られるという論"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"柳田國男の方言周圏論は、新しい語形が文化の中心地(都)で生まれ、池に石を投げたときの波紋のように同心円状に周辺へ伝播していくため、中心地に近い地域ほど新しい語形が、遠い地域ほど古い語形が残っているとする説です。東西の対立や方言区画の形成を主張する説ではありません。"},

/* ========= データ (令和4年度 試験I 問題12) ========= */
{id:"R4-12-1", tag:"R4 試験I 問題12 問1", cat:"言語使用論:マリノフスキー",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n言語使用の捉え方には様々な立場がある。例えば、人類学者のマリノフスキー(B. Malinowski)は、言葉を使うことは(ア)であり、意味は(イ)において解釈されると主張した。\nこの主張を受け、ハイムズ(D. Hymes)は、文化人類学の立場からコミュニケーションの仕組みを明らかにしようとした。その中でコミュニケーションにおけるスピーチ・イベントを分析し、その構成要素として、場面状況、媒体、調子などを提案した。スピーチ・イベントには、ナラティブも含まれる。\nこのような流れを受けて、カナル&スウェイン(M. Canale & M. Swain)はコミュニケーションに必要な社会言語能力を提示し、言語教育で重視されるようになった。\n\n問1 文章中の(ア)と(イ)に入れるのに最も適当な組合せを、次の1〜4の中から一つ選べ。",
 choices:["(ア)生成 (イ)文法","(ア)表層化 (イ)文法","(ア)行為 (イ)コンテクスト","(ア)反復 (イ)コンテクスト"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"マリノフスキーは、言葉を使うことを一種の「行為」と捉え、その意味は発話が行われる「状況のコンテクスト(コンテクスト・オブ・シチュエーション)」において解釈されると主張しました。"},

{id:"R4-12-2", tag:"R4 試験I 問題12 問2", cat:"ハイムズのコミュニケーション論",
 text:"問2 文章中の下線部A「コミュニケーションの仕組み」に関して、ハイムズの考え方として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["コミュニケーションは話者が持つ統語に関する言語知識によって行われる。","コミュニケーションは場に適した話し方をする伝達能力によって行われる。","コミュニケーションは個別状況に制限されない普遍的な規則に基づいて行われる。","コミュニケーションは習得の段階に応じて変化する言語体系に基づいて行われる。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"ハイムズは、チョムスキーが提唱した統語的な「言語能力」だけでなく、場面や状況に応じて適切に話す力である「伝達能力(コミュニカティブ・コンピテンス)」の重要性を主張しました。"},

{id:"R4-12-3", tag:"R4 試験I 問題12 問3", cat:"スピーチ・イベントの構成要素",
 text:"問3 文章中の下線部B「場面状況、媒体、調子」の三つが明示されている記述はどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["情報を伝えるために、丁寧体で正しい文法を用いる。","教師が教室を巡回し、学生に明るく話しかける。","二人で、しみじみと将来について語り合う。","電話で、順調に進んでいることを頻繁に伝える。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"2「教師が教室を巡回し(場面状況)、学生に明るく(調子)話しかける(媒体:話し言葉による直接的な発話)」は、場面状況・媒体・調子の三要素をいずれも読み取ることができます。他の選択肢は、いずれか一部の要素しか示されていません。"},

{id:"R4-12-4", tag:"R4 試験I 問題12 問4", cat:"ナラティブ",
 text:"問4 文章中の下線部C「ナラティブ」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["時系列に沿った出来事の語り","露骨さを和らげる言い回し","何が禁忌事項であるかの判断","人と人が取る空間的距離"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"ナラティブとは、時間の経過に沿って出来事を語る、物語的なスピーチ・イベントの一種です。2は婉曲表現、3はタブー、4はプロクセミックス(近接学)に関する説明であり、ナラティブの説明ではありません。"},

{id:"R4-12-5", tag:"R4 試験I 問題12 問5", cat:"社会言語能力",
 text:"問5 文章中の下線部D「社会言語能力」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["音韻や統語などの言語体系を習得し、それによって言語を運用する能力","談話全体の一貫性や結束性を理解し、適切に言語を使用する能力","会話に問題が生じたとき、会話相手に適切な援助を求める能力","会話相手との関係や発話の丁寧さの度合いを理解し、表現する能力"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"カナル&スウェインのコミュニケーション能力モデルにおける「社会言語能力」は、会話相手との人間関係や場面に応じた丁寧さの度合いなど、社会的に適切な言語使用を行う能力を指します。1は文法的能力、2は談話能力、3は方略的能力の説明です。"},

/* ========= データ (令和4年度 試験I 問題13) ========= */
{id:"R4-13-1", tag:"R4 試験I 問題13 問1", cat:"災害時のコミュニケーション支援:多文化共生センター",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n災害時には、外国人被災者に対するコミュニケーション支援が重要な課題となる。過去の災害においては、多言語支援が多文化共生センターの設立へとつながった例もある。\n災害時には情報の理解が不可欠であるが、外国人はストック情報が不足しているだけでなく、フロー情報の理解にも困難を伴うことがある。そのため、「やさしい日本語」による情報伝達が提案されている。例えば、弘前大学の研究室が2013年に『増補版「やさしい日本語」作成のためのガイドライン』をまとめている。また、記号を使用する際は、外国人にも理解が容易なものを選ぶと誤解を防げる。\nさらに、避難所では、生活習慣が異なる人と生活することが想定される。宗教や文化の違いをあらかじめ理解したうえで、実際の対応を考えるとよいだろう。\n\n問1 文章中の下線部Aに関して、全国で初めて多文化共生センターが開設される発端となった災害はどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["1995年の阪神・淡路大震災","2004年の新潟県中越地震","2011年の東日本大震災","2016年の熊本地震"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"1995年の阪神・淡路大震災の際、多くの外国人被災者への情報提供・支援の必要性から多言語支援活動が展開され、これが全国初の多文化共生センターの設立につながりました。"},

{id:"R4-13-2", tag:"R4 試験I 問題13 問2", cat:"ストック情報とフロー情報",
 text:"問2 文章中の下線部B「ストック情報」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["家族や知人が無事かどうかの情報","災害直後に示された出国に関する情報","地震の時どのように身を守るかという情報","地震の被害がどの程度かという情報"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"ストック情報とは、状況によって変化せず、あらかじめ蓄えておくことができる情報のことです。「地震の時どのように身を守るか」という一般的な防災知識はストック情報にあたります。他の選択肢は、状況に応じて変化する最新情報である「フロー情報」の例です。"},

{id:"R4-13-3", tag:"R4 試験I 問題13 問3", cat:"やさしい日本語ガイドライン",
 text:"問3 文章中の下線部C「増補版「やさしい日本語」作成のためのガイドライン」を反映した例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「この飲み物は無料です」ではなく、「この飲み物はフリーです」とする。","「捨てられる」ではなく、「捨てることができる」とする。","「くすりがあります」ではなく、「Kusuri ga arimasu」とする。","「2022年10月12日」ではなく、「2022/10/12」とする。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「やさしい日本語」のガイドラインでは、「られる」のような可能・受身の紛らわしい表現を避け、「〜することができる」という明確な形にすることが推奨されています。外来語(フリー)への言い換えやローマ字表記、スラッシュを使った日付表記は、むしろ分かりにくさや誤解を招く恐れがあり、ガイドラインの趣旨に沿いません。"},

{id:"R4-13-4", tag:"R4 試験I 問題13 問4", cat:"JIS規格の記号",
 text:"問4 文章中の下線部Dに関して、JIS規格となっている記号はどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["○(良い)/×(悪い)","↑(上方へ・前方へ)","〜(期間や時間帯)","〒(郵便番号)"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"方向を示す矢印「↑」は、JIS Z8210「案内用図記号(ピクトグラム)」において「上方へ・前方へ」を意味する記号として規格化されています。「○×」「〜」「〒」は日常的に広く使われる記号ですが、この案内用図記号としてのJIS規格には含まれていません。"},

{id:"R4-13-5", tag:"R4 試験I 問題13 問5", cat:"宗教文化の理解:イスラム教",
 text:"問5 文章中の下線部E「宗教」に関して、厳格なイスラム教徒の行動として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["豚肉が入っている料理は、豚肉を取り除いて食べる。","蜂蜜は昆虫に由来するものであるため、摂取しない。","人に物を渡すときは左手、もらうときは右手を使う。","お祈りは1日の回数を守り、時間と方角を確認して行う。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"厳格なイスラム教徒は、1日5回、定められた時刻にメッカの方角を向いて礼拝を行います。豚肉に触れた料理は取り除いても口にしないのが一般的で、蜂蜜は摂取が禁じられていません。また、物の受け渡しは不浄とされる左手ではなく右手で行うのが一般的なマナーです。"},

/* ========= データ (令和4年度 試験I 問題14) ========= */
{id:"R4-14-1", tag:"R4 試験I 問題14 問1", cat:"CEFR:欧州評議会",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n第二次世界大戦後、ヨーロッパは平和共存を求めた。1949年にはヨーロッパ地域での人権擁護、民主主義の確立などを目指し(ア)が設立された。同機関は、複言語・複文化主義を理念的背景とする「ヨーロッパ言語共通参照枠(CEFR)」を2001年に発表した。CEFRは学習者を含めた言語の使用者を、与えられた環境の中で日常の課題を遂行しようとする「(イ)」と捉えている。このようなCEFRの理念の実現に向けて、共通参照レベルと例示的な能力記述文が示された。また、教育ツールとして「ヨーロッパ言語ポートフォリオ」が開発された。\n\n問1 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["欧州評議会(Council of Europe)","欧州共同体(European Communities)","欧州連合(European Union)","欧州議会(European Parliament)"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"1949年に人権擁護や民主主義の確立などを目的として設立されたのは「欧州評議会(Council of Europe)」です。CEFR(ヨーロッパ言語共通参照枠)は欧州評議会によって2001年に発表されました。欧州共同体・欧州連合・欧州議会は、いずれも経済統合や政治統合を目的とした別の機関です。"},

{id:"R4-14-2", tag:"R4 試験I 問題14 問2", cat:"複言語・複文化主義",
 text:"問2 文章中の下線部A「複言語・複文化主義」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["異文化マイノリティの言語・文化の発展を認めることで、国民全体の共存・共生が作り上げられているという考え方","個人の持つ言語能力や文化的体験が相互に作用し合って、その人の言葉や文化が作り上げられているという考え方","異なる言語の話者間のコミュニケーションのために、国際共通語となる言葉が用いられているという考え方","三つ以上の言語あるいは言語変種が、一つの社会で異なる機能と評価のもとで用いられているという考え方"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"複言語・複文化主義は、社会レベルで複数の言語が併存する「多言語主義」(4の説明に近い)とは異なり、一人の個人の中で複数の言語能力や文化的経験が互いに影響し合いながら、その人固有の言語・文化的な能力を形作っているとする、個人レベルの考え方です。"},

{id:"R4-14-3", tag:"R4 試験I 問題14 問3", cat:"CEFR:社会的存在",
 text:"問3 文章中の(イ)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["多言語使用者(multilingual)","生涯学習者(lifelong learner)","内省的実践家(reflective practitioner)","社会的存在(social agents)"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"CEFRでは、言語の学習者・使用者を、与えられた環境の中で課題を遂行する「社会的存在(social agents)」として捉えています。"},

{id:"R4-14-4", tag:"R4 試験I 問題14 問4", cat:"CEFR:共通参照レベル",
 text:"問4 文章中の下線部B「共通参照レベル」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["コミュニケーション言語能力を「叙述的知識」「技能とノウ・ハウ」「実存論的能力」「学習能力」の四つの目安で示している。","コミュニケーション言語活動を「聞く」「読む」「話す」「書く」の技能に分類し、技能ごとの具体的な言語行動を四つのレベルで示している。","学ぶべき文法項目と語の数を学習段階別に示し、それぞれの段階に到達するための総学習時間数の目安を設定している。","言語能力を「基礎」「自立」「熟達」の3段階に設定し、各段階を二つずつに分けた計6レベルに設定している。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"CEFRの共通参照レベルは、言語能力を「基礎段階の言語使用者(A)」「自立した言語使用者(B)」「熟達した言語使用者(C)」の3段階に大別し、それぞれをさらに二つずつ(A1/A2、B1/B2、C1/C2)に分けた、計6レベルで構成されています。"},

{id:"R4-14-5", tag:"R4 試験I 問題14 問5", cat:"ヨーロッパ言語ポートフォリオ",
 text:"問5 文章中の下線部C「ヨーロッパ言語ポートフォリオ」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["進学・転校や就職活動の際、教育機関や雇用主に提示することができる。","ヨーロッパ全域で書式が統一されており、国を越えて使うことができる。","具体的な言語学習経験や外国語の熟達度・到達度を示すことができる。","言語学習者が習得した言語的・文化的技能を記録することができる。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"ヨーロッパ言語ポートフォリオは、共通の理念的枠組みに基づきつつも、各国・各機関ごとに検証・承認された様々なバージョンが存在しており、ヨーロッパ全域で書式が単一に統一されているわけではありません。したがって2が不適当な記述です。"},

/* ========= データ (令和4年度 試験I 問題15) ========= */
{id:"R4-15-1", tag:"R4 試験I 問題15 問1", cat:"明治時代の国語政策",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n言語教育政策には、母語教育政策と外国語教育政策がある。日本における母語教育政策は、明治時代の国語政策に始まり、常用漢字表の制定・改正、外来語の表記など、様々な議論が行われてきた。また現代では、国語政策の立案に必要な基礎データを得るために「国語に関する世論調査」が毎年行われている。令和2年度(2020年度)に実施された調査では、これまでと同様の項目に加え、現在の社会状況を踏まえた質問項目を設け、調査している。\n外国人に対する日本語教育政策には、様々な機関が関わっている。その中で、国際協力事業団(JICA)はJICA海外協力隊の派遣を実施し、日本語教育の分野でも開発途上国の発展や復興に寄与している。\n\n問1 文章中の下線部A「明治時代の国語政策」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["上田万年が、標準語を確立することの必要性を主張した。","志賀直哉が、英語を第二公用語にする必要性を主張した。","福沢諭吉が、書き言葉を話し言葉と一致させるべきだと主張した。","森有礼が、「漢字御廃止之議」で漢字使用をやめるべきだと主張した。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"上田万年は明治時代の国語学者で、標準語の確立の必要性を強く主張した人物です。志賀直哉が国語をフランス語にすべきと主張したのは戦後のことで英語・第二公用語論ではなく、言文一致は二葉亭四迷らが中心的に推進し、「漢字御廃止之議」は前島密による建白書です。"},

{id:"R4-15-2", tag:"R4 試験I 問題15 問2", cat:"国語に関する世論調査",
 text:"問2 文章中の下線部B「国語に関する世論調査」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["国立国語研究所が、「国語力」に対する国民の意識や日常の言語活動の様子を把握するために行っている。","国立国語研究所が、国内外における日本語の評価基準の指針を策定するために行っている。","文化庁が、日本語教育関係機関における日本語教育関連事業の実施状況を把握するために行っている。","文化庁が、現在の社会状況の変化に伴う日本人の国語に関する意識や理解度を調査するために行っている。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"「国語に関する世論調査」は、文化庁が国語施策の立案に役立てるため、社会状況の変化を踏まえた日本人の国語に関する意識や理解度を把握する目的で毎年実施しているものです。国立国語研究所が実施しているものではありません。"},

{id:"R4-15-3", tag:"R4 試験I 問題15 問3", cat:"国語世論調査:社会状況を踏まえた項目",
 text:"問3 文章中の下線部C「現在の社会状況を踏まえた質問項目」として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["パソコンや携帯電話の普及により言葉遣いが影響を受けるか。","マスクを着けると話し方や態度などが変わることがあると思うか。","はがきや手紙、年賀状の宛名や本文を手書きで書くか。","常用漢字表の見直しが行われていることを知っているか。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"令和2年度の調査は新型コロナウイルス感染症の流行下で実施されており、マスク着用が話し方や態度に与える影響についての質問項目が、その年ならではの社会状況を踏まえた新しい項目として追加されました。"},

/* ========= データ (令和4年度 試験III 問題1) ========= */
{id:"R4-III-1-1", tag:"R4 試験III 問題1 問1", cat:"音節",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n音のまとまりの単位には様々なものがある。多くの言語に共通する単位として、音節が挙げられる。音節は日本語におけるアクセントをはじめ、各言語において様々な音声現象に関与している。\n日本語教育において特に重要となるのが、いわゆる特殊拍である。音節を基本単位とする言語を母語とする学習者は、モーラではなく音節単位で音のまとまりを捉えるため、特殊拍の発音や知覚が難しい。そのため、学習者の母語を踏まえたモーラの指導が重要となる。音のまとまりの捉え方は、「日本語らしさ」を感じさせるリズムの形成にも関係している。\n\n問1 文章中の下線部A「音節」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本語には、子音を二つ以上含む音節がある。","日本語には、1音節からなる単語が多い。","日本語では、母音に子音が後接した音節が一般的である。","日本語では、仮名1文字が一つの音節に対応している。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"「きゃ」「しゅ」のような拗音は、子音+半母音+母音という構造を持ち、子音的な要素を二つ含む音節と分析されることがあります。日本語は開音節(母音で終わる音節)が基本で、母音の後に子音が接続する構造は一般的ではなく、仮名1文字が必ずしも1音節に対応するわけでもありません(拗音は仮名2文字で1音節、撥音や促音は仮名1文字でも1音節を構成しない特殊拍です)。"},

{id:"R4-III-1-2", tag:"R4 試験III 問題1 問2", cat:"日本語のアクセント",
 text:"問2 文章中の下線部B「日本語におけるアクセント」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["名詞は、語の音節数によってアクセントの型の数が決まる。","前部要素のアクセント型は、複合名詞全体のアクセント型に関与することがある。","尾高型の名詞は、後続する助詞によってはアクセント核が消失することがある。","東京方言は、音節ごとにアクセントが決まっており、声調と類似している。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"複合名詞のアクセントは、後部要素の拍数や性質だけでなく、前部要素のアクセント型も全体のアクセント型に影響を与えることがあります。名詞のアクセント型の数は音節数ではなくモーラ数に基づいて決まり、尾高型は助詞の有無にかかわらずアクセント核を保持し、東京方言のアクセントは声調言語の声調とは異なる高低アクセントです。"},

{id:"R4-III-1-3", tag:"R4 試験III 問題1 問3", cat:"特殊拍の発音",
 text:"問3 文章中の下線部C「特殊拍の発音」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["規範的な発音では、「発表」と「発揮」の促音部分の調音点は、同じであることが多い。","規範的な発音では、「一切」と「一体」の促音部分の調音法は、同じであることが多い。","規範的な発音では、「あの辺へ」と「あの辺に」の撥音部分の調音点は、同じであることが多い。","規範的な発音では、「簡易」と「嫌悪」の撥音部分の調音法は、同じであることが多い。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"撥音(ん)は後続する音によって調音位置が変わりますが、調音法(鼻音であること)自体は共通しています。「簡易(かんい)」「嫌悪(けんお)」はいずれも「ん」の後に母音が続くため、鼻音化した母音として実現される点で調音法が共通しています。促音や撥音の調音点は後続音の種類によって変わるため、1・3の記述は誤りです。"},

{id:"R4-III-1-4", tag:"R4 試験III 問題1 問4", cat:"特殊拍の指導",
 text:"問4 文章中の下線部Dに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者の母語に二重母音がある場合、長音を習得させることが容易である。","英語の\"What time\"のような音節構造は、英語母語話者への促音指導に活用できる。","特殊拍の指導にあたっては、学習者が漢字圏か非漢字圏かを考慮する必要がある。","長音を表す符号「ー」は多くの言語に存在しているため、学習上有効に活用できる。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"英語の\"What time\"のように、閉鎖音が連続する音節構造(t の閉鎖が一瞬保持される)は、日本語の促音(小さい「っ」)の指導において、既知の音韻構造を利用した説明に活用できます。二重母音の存在は長音習得の容易さと直接結びつくものではなく、特殊拍の指導は学習者の母語の音節構造(音節言語かモーラ言語かなど)によって難易度が異なり、漢字圏・非漢字圏という区別が直接の指導上の考慮点ではありません。「ー」も全ての言語にあるわけではありません。"},

{id:"R4-III-1-5", tag:"R4 試験III 問題1 問5", cat:"日本語のリズム",
 text:"問5 文章中の下線部E「「日本語らしさ」を感じさせるリズム」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本語では、通常1モーラごとに区切って発音される。","日本語では、各音節がおおむね等しい長さで発音される。","日本語では、2モーラが一つのまとまりを形成する。","日本語では、強勢が置かれる音節が等間隔で現れる。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"日本語のリズムは、2モーラを単位とした「フット」のまとまり(例えば「トー/キョー」のような2拍のまとまり)によって特徴づけられるとされ、これが「日本語らしさ」を感じさせるリズムの基盤となっています。日本語は各モーラがほぼ等しい長さで発音される「モーラ拍リズム」の言語であり、英語のような強勢が等間隔に現れる「強勢拍リズム」とは異なります。"},

/* ========= データ (令和4年度 試験III 問題2) ========= */
{id:"R4-III-2-1", tag:"R4 試験III 問題2 問1", cat:"「は」と格助詞の消去",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語には、主題を表す助詞「は」がある。「は」によって様々な成分を主題とすることができるが、一部の格助詞は「は」が付加されると義務的に消去される。\n「は」は、しばしば「が」との使い分けが問題にされる。述語との関係で見ると、「が」は主体や対象を表す。これに対し、「は」は基本的に主題を表し、主体や対象以外にも付加できるという点で異なる。また「は」は、複文において「が」と異なる特徴を持っており、主題を表す「は」は全ての従属節に現れるわけではない。\nこのように、「は」の文法的特徴は極めて複雑であり、学習者に向けた指導に際しては十分に留意する必要がある。\n\n問1 文章中の下線部Aの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["から","と","で","を"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"格助詞「を」は、「は」が付加されると「(魚は)食べる」のように義務的に消去されます。「から」「と」「で」は「は」が付加されても、格助詞自体は残ったまま「からは」「とは」「では」のように使われるのが一般的です。"},

{id:"R4-III-2-2", tag:"R4 試験III 問題2 問2", cat:"対象を表す「が」",
 text:"問2 文章中の下線部B「対象」として解釈できる「が」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ピザはナポリが本場だ。","私はパセリが嫌いだ。","彼はウエストが細いです。","この店はマグロが名物です。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「私はパセリが嫌いだ」の「パセリが」は、感情・好悪の対象を表す「が」の典型例です。他の選択肢の「が」は、それぞれ本場の所在、身体部位の主体、名物という属性の主体を表しており、感情や思考の「対象」を表す用法とは異なります。"},

{id:"R4-III-2-3", tag:"R4 試験III 問題2 問3", cat:"複文と「が」",
 text:"問3 文章中の下線部Cの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["このグラウンドはかなり広い。","彼は2時間後に出発する。","昨日は図書館に行きました。","犯人はもう捕まえました。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「昨日は図書館に行きました」の「昨日は」は、時を表す成分に「は」が付いたもので、対応する「が」文(「昨日が図書館に行った」)が成立しない、すなわち主体でも対象でもない成分に「は」が付加されている例です。他の選択肢は、いずれも主語(主体)に相当する成分に「は」が付いています。"},

{id:"R4-III-2-4", tag:"R4 試験III 問題2 問4", cat:"「は」が現れる従属節",
 text:"問4 文章中の下線部Dに関して、節の内部に主題を表す「は」が現れることが可能な従属節のタイプとして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「〜けれど」「〜し」などの等位節","「〜たら」「〜ば」などの条件節","「〜とき」「〜あと」などの時間節","「〜ように」「〜ほど」などの様態節"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"「〜けれど」「〜し」などで結ばれる等位節は、主節と対等な独立性の高い節であるため、内部に主題を表す「は」が現れることができます。一方、条件節・時間節・様態節などの従属度の高い節では、主題の「は」は現れにくく、多くは「が」で表されます。"},

{id:"R4-III-2-5", tag:"R4 試験III 問題2 問5", cat:"「は」の文法的特徴",
 text:"問5 文章中の下線部E「「は」の文法的特徴」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["分裂文における焦点を示す。","新しい話題を設定する場合に用いられる。","とりたて助詞としての用法を持たない。","疑問詞を主題とすることができない。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"「は」は、疑問詞(誰・何・どこなど)を主題として提示することができません(例:「*誰は来ますか」は不自然)。「は」は既知の話題(旧情報)を再提示する用法が典型的で、分裂文の焦点を示すのはむしろ「が」であり、「は」は対比などのとりたて用法も持っています。"},

/* ========= データ (令和4年度 試験III 問題3) ========= */
{id:"R4-III-3-1", tag:"R4 試験III 問題3 問1", cat:"自動詞・他動詞:認定基準",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語の動詞は、自動詞と他動詞に分けられる。他動詞を認定する基準は二つある。一つ目は、他の対象に対する働きかけがあることであり、具体的には、対象のヲ格をとる動詞が他動詞と認定される。ただし、ヲ格をとる場合でも、(ア)のヲ格をとる動詞は自動詞に分類される。二つ目は、直接受身文を形成することである。\n自動詞には意志的自動詞と非意志的自動詞があり、後者には、語幹の一部を共有し、「XガV自動詞」「YガXヲV他動詞」という関係のペアを持つものがある。自動詞と他動詞のペアがある動詞には、意味的な違いがある。一方、対応するペアがない場合は、文法的な形式で補われることがある。\n自動詞と他動詞の習得には困難が伴うため、初級から上級まで繰り返し指導する必要がある。\n\n問1 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["目的や起点","目的や手段","経路や起点","経路や手段"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「空を飛ぶ」「道を歩く」のように、移動の経路を表すヲ格や、「家を出る」のように移動の起点を表すヲ格をとる動詞は、対象への働きかけを表さないため、ヲ格をとっていても自動詞に分類されます。"},

{id:"R4-III-3-2", tag:"R4 試験III 問題3 問2", cat:"直接受身文",
 text:"問2 文章中の下線部A「直接受身文」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["友人に無理な仕事を頼まれて、しぶしぶ引き受けた。","同僚の鈴木さんに会社を辞められて、毎日忙しくなった。","5歳下の後輩に先に昇進されて、落胆した。","映画館で隣の観客に騒がれて、迷惑だった。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"直接受身文は、能動文の目的語(ヲ格)が主語になる受身文です。「友人が(私に)仕事を頼んだ」の目的語「仕事」ではなく、直接的な働きかけの対象である「私」が主語になった「(私は)友人に仕事を頼まれて」が直接受身の典型例です。他の選択肢はいずれも、対応する能動文に目的語として現れない要素を主語とする「持ち主の受身」や「迷惑の受身(間接受身)」の例です。"},

{id:"R4-III-3-3", tag:"R4 試験III 問題3 問3", cat:"自動詞・他動詞のペア",
 text:"問3 文章中の下線部Bの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["起きる ― 起こる","預ける ― 預かる","浴びる ― 浴びせる","下りる ― 下ろす"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"「下りる(自動詞)」と「下ろす(他動詞)」は、語幹「下」を共有し、「(荷物が)下りる」「(荷物を)下ろす」のように「XがV自」「YがXをV他」の関係を満たす典型的な自他動詞ペアです。他の組合せは、語幹の共有や自他の対応関係が同じパターンには当てはまりません。"},

{id:"R4-III-3-4", tag:"R4 試験III 問題3 問4", cat:"自他動詞ペアの意味的違い",
 text:"問4 文章中の下線部Cに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["自動詞は静的な動作を表し、他動詞は動的な状態を表す。","自動詞は継続的な動作を表し、他動詞は瞬間的な動作を表す。","自動詞は変化を表し、他動詞は変化の原因となる動作を表す。","自動詞は意志的な動作を表し、他動詞は非意志的な変化を表す。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"自他動詞ペアの意味的な違いは、自動詞が主体に起こる「変化」そのものを表すのに対し、他動詞はその変化を引き起こす「動作(原因)」を表すという点にあります(例:「ドアが開く」=変化、「ドアを開ける」=変化を引き起こす動作)。"},

{id:"R4-III-3-5", tag:"R4 試験III 問題3 問5", cat:"対応する自動詞がない場合",
 text:"問5 文章中の下線部Dに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["対応する自動詞がない場合は、他動詞の受身形が自動詞の役割を担う。","対応する自動詞がない場合は、他動詞の使役形が自動詞の役割を担う。","対応する他動詞がない場合は、自動詞の使役受身形が他動詞の役割を担う。","対応する他動詞がない場合は、自動詞の可能形が他動詞の役割を担う。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"対応する自動詞を持たない他動詞(例:「褒める」)は、受身形(「褒められる」)を用いることで、対象に起こる変化(自動詞的な意味)を表すことができます。"},

/* ========= データ (令和4年度 試験III 問題4) ========= */
{id:"R4-III-4-1", tag:"R4 試験III 問題4 問1", cat:"授受表現:与え手・受け手",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語には、いわゆる「やりもらい」の授受表現がある。学習者はまず、何が「あげる」「くれる」「もらう」などの授受動詞の主語になるかを理解しなければならない。(ア)は与え手が主語になる動詞、(イ)は受け手が主語になる動詞である。\n授受動詞は、「友達が助けてくれた」「友達に助けてもらった」のような補助動詞としての用法も持つ。補助動詞としての授受動詞を使うべき場面で使わないと、「友達が私を助けました。」のように不自然な文となることから、適切に習得することが重要である。\n本動詞と補助動詞では、格のとり方が異なる。与え手が主語になる動詞を本動詞として用いる場合、物の受け手は(ウ)。補助動詞として用いる場合、格は(エ)。さらに、授受動詞による敬語表現の運用についても理解しておく必要がある。\n授受表現のほかにも、同じ事柄を、動作主と受け手のどちらの視点で述べるかによって異なる形式を使い分けるものがある。\n\n問1 文章中の(ア)と(イ)に入れるのに最も適当な組合せを、次の1〜4の中から一つ選べ。",
 choices:["(ア)「くれる」と「もらう」 (イ)「あげる」","(ア)「あげる」と「くれる」 (イ)「もらう」","(ア)「あげる」 (イ)「くれる」と「もらう」","(ア)「もらう」 (イ)「あげる」と「くれる」"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「あげる」「くれる」は与え手が主語になる動詞、「もらう」は受け手が主語になる動詞です。したがって(ア)は「あげる」と「くれる」、(イ)は「もらう」です。"},

{id:"R4-III-4-2", tag:"R4 試験III 問題4 問2", cat:"補助動詞としての授受動詞",
 text:"問2 文章中の下線部Aの理由として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["話し手にとっての与益の意味が表されていないため","話し手にとっての受益の意味が表されていないため","与益者が「私」であるため","受益者が「友達」であるため"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「友達が私を助けました。」は、補助動詞「〜てくれる」を使わないことで、話し手(私)が友達の行為から恩恵を受けたという「受益」の意味が表されず、単なる客観的な事実描写になってしまうため不自然に感じられます。"},

{id:"R4-III-4-3", tag:"R4 試験III 問題4 問3", cat:"授受動詞の格のとり方",
 text:"問3 文章中の(ウ)と(エ)に入れるのに最も適当な組合せを、次の1〜4の中から一つ選べ。",
 choices:["(ウ)ニ格で表される (エ)受益者の人称によって異なる","(ウ)ニ格で表される (エ)授受動詞の前に来る動詞によって異なる","(ウ)与え手の人称によって格が異なる (エ)受益者の人称によって異なる","(ウ)与え手の人称によって格が異なる (エ)授受動詞の前に来る動詞によって異なる"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"本動詞としての「あげる」「くれる」は、物の受け手を「(先生)にあげる/くれる」のようにニ格で表します。補助動詞として用いる場合の格のとり方は、前に来る動詞(自動詞か他動詞かなど)によって「〜てあげる/くれる」の構文が変わるため、授受動詞の前に来る動詞によって異なります。"},

{id:"R4-III-4-4", tag:"R4 試験III 問題4 問4", cat:"授受動詞による敬語表現",
 text:"問4 文章中の下線部B「授受動詞による敬語表現の運用」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["目上の先生に「先生、パーティーに来ていただけますか?」のように言うのは、動作主が主語になるので、丁寧な印象を与える。","目上の先生に「先生、パーティーに来ていただけますか?」のように言うのは、先生が話し手から恩恵を受けることを表すので、丁寧な印象を与える。","目上の先生に「先生、お荷物を持ってさしあげます。」のように言うのは、動作主が主語になるので、失礼な印象を与える。","目上の先生に「先生、お荷物を持ってさしあげます。」のように言うのは、話し手が先生に恩恵を与えることを表すので、失礼な印象を与える。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"「〜てさしあげる」は、話し手が目上の相手に恩恵を与えるという含みを持つため、恩着せがましく失礼な印象を与えることがあり、目上の人に対しては避けるべき表現とされます。「〜ていただけますか」はこの問題がなく、丁寧な依頼表現として適切に使えます。"},

{id:"R4-III-4-5", tag:"R4 試験III 問題4 問5", cat:"視点による形式の使い分け",
 text:"問5 文章中の下線部C「同じ事柄を、動作主と受け手のどちらの視点で述べるかによって異なる形式を使い分けるもの」の例として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「師匠が教えた」と「師匠に教わった」","「弟を褒めた」と「弟が褒められた」","「思いを表した」と「思いが表された」","「家を貸した」と「家を借りた」"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「思いを表した」と「思いが表された」は能動文とその受身文の関係であり、動作主・受け手という「異なる人物の視点」を切り替えて同じ事柄を述べる語彙的な対(「教える/教わる」「貸す/借りる」、能動と受身の「褒めた/褒められた」)とは性質が異なります。したがってこれが不適当な例です。"},

/* ========= データ (令和4年度 試験III 問題5) ========= */
{id:"R4-III-5-1", tag:"R4 試験III 問題5 問1", cat:"ビジネス日本語:レディネス調査",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\nビジネスパーソンのレッスンを初めて担当するX先生が、先輩のY先生に相談をしている。\n\nX先生:来月から初めてビジネスパーソンのプライベートレッスンを担当することになったんですが、いろいろと分からないことが多くて。\nY先生:ああ、留学生対象のクラス授業とは違いますよね。もう、レディネス調査は終わったんですか?\nX先生:ええ、先日顔合わせがあって、レディネス調査とニーズ調査は済みました。今、シラバスとカリキュラムを検討しているところなんです。\nY先生:そうですか。ビジネスパーソンは学習目的が明確な場合が多いですから、タスクシラバスを検討してもいいかもしれませんね。\nX先生:なるほど、そうですね。\nY先生:それから、カリキュラムデザインにも工夫が必要になりますね。\nX先生:はい。そのほかにも何か気をつけたほうがいいことはありますか?\nY先生:ビジネスに従事する学習者は、アカデミックな日本語を勉強する留学生とは異なる点もあると言われているので、その特性を知っておいたほうがいいですね。\n\n問1 文章中の下線部A「レディネス調査」の結果を基に教師が行うこととして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者が希望する学習時間帯が早朝や夜間の場合、疲労や集中力の低下を考慮して学習進度を設定する。","学習者や会社側が希望する到達目標に無理がある場合、具体的で到達可能な目標を提案する。","学習者が信頼しているテキストであっても教師が適当でないと判断した場合、使用を断念させる。","学習者が仕事で使う日本語を身につけたいと思っている場合、ビジネスマナーや待遇表現の学習を取り入れる。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"レディネス調査は、学習者の学習条件(学習可能な時間帯、既習事項、学習スタイルなど)を把握するための調査です。希望する学習時間帯を踏まえて疲労や集中力を考慮した進度を設定することは、レディネス調査の結果を活用した対応の典型例です。到達目標の調整や学習内容の決定はニーズ調査の結果に基づくものです。"},

{id:"R4-III-5-2", tag:"R4 試験III 問題5 問2", cat:"ビジネス日本語:ニーズ調査",
 text:"問2 文章中の下線部B「ニーズ調査」で行う質問として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["現在、ビジネス場面において日本語で何ができるか。","職場で授業を受講する場合、どのような機器が使用できるか。","業務では四技能のうち、どの技能の習得を優先する必要があるか。","ビジネス日本語を習得するためには、どのような練習が必要だと思うか。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"ニーズ調査は、学習者が「何を」学ぶ必要があるか(到達目標や必要な技能)を把握するための調査です。業務上どの技能の習得を優先すべきかを問うことは、学習者の目標(ニーズ)を明らかにする典型的な質問です。現在の日本語力の把握はレディネス調査、機器の使用可否は学習環境(レディネス)に関する質問です。"},

{id:"R4-III-5-3", tag:"R4 試験III 問題5 問3", cat:"タスクシラバス",
 text:"問3 文章中の下線部C「タスクシラバス」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「企画を立てる」「商品を売り込む」など、遂行すべき業務を基に構成されている。","「説明する」「謝罪する」など、業務で必要な機能を中心に構成されている。","「金融政策」「情報技術」など、担当業務に関連した内容で構成されている。","「会議」「出張」など、日常業務で遭遇する状況を想定して構成されている。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"タスクシラバスは、学習者が実際に遂行すべき具体的な課題(タスク)、例えば「企画を立てる」「商品を売り込む」といった業務そのものを単位として構成されるシラバスです。機能を中心とするのは機能シラバス、内容を中心とするのは内容シラバス、場面を中心とするのは場面シラバスです。"},

{id:"R4-III-5-4", tag:"R4 試験III 問題5 問4", cat:"カリキュラムデザイン",
 text:"問4 文章中の下線部D「カリキュラムデザイン」の例として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者の業務の状況を確認したうえで、授業時間数と進度を決める。","日本事情やビジネスマナーの説明に、媒介語を使用するかどうかを決める。","「提案書」「見積書」など、どのようなビジネス文書を教材とするかを決める。","「商談で使う表現」「電話応対で使う表現」など、学習項目を決める。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"「商談で使う表現」「電話応対で使う表現」といった具体的な学習項目(シラバス項目)を決めることは、シラバスデザインの範囲であり、授業時間数・進度・教材・使用言語などコース運営全体の枠組みを決めるカリキュラムデザインとは区別されます。したがって4が不適当な例です。"},

{id:"R4-III-5-5", tag:"R4 試験III 問題5 問5", cat:"ビジネス日本語学習者の特性",
 text:"問5 文章中の下線部Eに関して、ビジネスに従事する学習者の特性として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["意図するところが相手に通じればよいという実用性よりも、言語使用の正確さを第一に考える。","費用対効果を重視する傾向があるため、効率の良い学習への期待が大きく、学習成果を性急に求める。","業務に直結した分野の学習だけでなく、社会人として、他の分野の語彙学習にも広く関心を持つ。","業務遂行能力と日本語運用能力の両者を等しく向上させることを目的として、学習する。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"ビジネスパーソンは、限られた時間の中で費用対効果を意識しながら学習することが多く、効率的な学習を求め、成果を早く実感したいと考える傾向があるとされます。正確さより実用性(コミュニケーションが成立すること)を重視し、学習範囲も業務に直結した内容に集中する傾向がある点で、他の選択肢とは特性が異なります。"},

/* ========= データ (令和4年度 試験III 問題6) ========= */
{id:"R4-III-6-1", tag:"R4 試験III 問題6 問1", cat:"「ている」の導入",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\nベテランのX先生と新任のY先生が、Y先生の授業について話している。授業は、初級前半レベルで、コミュニケーション能力の育成を重視しながら文型を学ぶことを目標としている。\n\nX先生:「〜ている」の授業はうまくいきましたか?\nY先生:はい。導入はうまくいったんですが、やっぱり「テ形」が難しいみたいで…。\nX先生:そうですか。練習は十分にしましたか?\nY先生:変換練習などで口慣らしをしました。あと、TPRも取り入れました。\nX先生:なるほど。いろんな練習をしたんですね。次は教具も工夫して練習してみるといいですよ。\nY先生:ありがとうございます。学習者が不安を感じないような授業をしたいです。\n\n問1 文章中の下線部A「導入」で行うこととして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["口頭ではなく文字で文型とルールを板書し、文型を正しい発音で読ませる。","文型を含んだ会話を聞かせたりビデオを見せたりして、文型の意味を類推させる。","導入文型と新出語彙の両方を含む例文を提示し、教師に続いてリピートさせる。","一つの文型について例文は一つに絞り、教師が読み上げた例文を書き取らせる。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"導入段階では、まず文型を含んだ自然な会話や映像を通して、学習者自身に文型の意味・用法を類推させることが効果的とされます。文字による規則の板書から入ったり、新出語彙を同時に含めたり、書き取りをさせたりすることは、導入段階の活動としては適当ではありません。"},

{id:"R4-III-6-2", tag:"R4 試験III 問題6 問2", cat:"オーディオ・リンガル・メソッド",
 text:"問2 文章中の下線部Bの背景にある言語教育の考え方に「オーディオ・リンガル・メソッド」がある。その特徴として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["母語話者と同様の流暢さを習得することを目標とする。","学習の初期段階では文法的な誤りを許容する。","学習者のニーズを踏まえて文型の提示順を決める。","口頭練習と文字教育を同時に行い産出の能力を伸ばす。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"オーディオ・リンガル・メソッドは、行動主義心理学に基づき、パターン・プラクティス(文型練習)の反復によって母語話者のような正確で流暢な言語習得を目指す教授法です。誤りは習慣形成を妨げるものとして極力避けるべきとされ、文字よりも音声(口頭)を優先し、学習者個々のニーズよりも構造の難易度順にシラバスを組むのが特徴です。"},

{id:"R4-III-6-3", tag:"R4 試験III 問題6 問3", cat:"TPRの留意点",
 text:"問3 文章中の下線部C「TPR」(Total Physical Response)を行う際の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「立たないでください」のような否定形の指示は混乱するので肯定形にする。","「夢」のような抽象語彙も動作で表現し、記憶に留めるために板書も行う。","動くことに消極的な学習者にも、指示を繰り返して参加させる。","単純な作業から複雑な作業へと活動を展開する。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"TPRでは、単純な指示・動作から徐々に複雑な指示・動作へと段階的に活動を展開していくことが基本原則です。抽象語彙は動作化が難しく板書に頼るのは本来の趣旨(全身反応による習得)と異なり、消極的な学習者に無理に参加を強いることも推奨されず、否定形の指示も工夫次第で活用可能です。"},

{id:"R4-III-6-4", tag:"R4 試験III 問題6 問4", cat:"教具使用の留意点",
 text:"問4 文章中の下線部D「教具」を使う際の留意点として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["同一の文字であることを認識させるために、異なるフォントのものを並べて見せるとよい。","活用表で動詞を導入する場合は、動詞の活用語尾を太字にするなどして視覚的に分かりやすくするとよい。","絵カードの意味が分かりにくい場合は、ジェスチャーなどのほかの方法と併用するとよい。","ホワイトボードに板書する場合は、どこに何を書くか計画せず臨機応変に対応できるようにするとよい。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"板書は、学習者が見返して整理しやすいよう、あらかじめどこに何を書くか計画しておくことが望ましいとされます。「計画せず臨機応変に対応する」ことは、板書が乱雑になり学習者の理解を妨げる恐れがあるため、教具活用の留意点としては不適当です。"},

{id:"R4-III-6-5", tag:"R4 試験III 問題6 問5", cat:"学習者の不安への対応",
 text:"問5 文章中の下線部E「不安」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習効果に対する不安を軽減するために、教師は全学習者に同一の学習課題を与え、学習者同士で能力の比較ができるようにする。","大人数の前で話すことに不安を感じる場合、教師はペアワークなど学習者が協同で行う課題は避ける。","間違うことに不安を感じる場合、教師は間違うことが学習にとって重要であることを学習者に定期的に伝えるようにする。","発話することに対する不安を軽減するために、教師は教室内で間違いを訂正することは避ける。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"間違いは学習過程において自然かつ重要なものであることを教師が繰り返し伝えることで、学習者の誤りへの不安(情意フィルター)を軽減できます。学習者同士を比較させたり、協同活動を一律に避けたり、訂正を一切しないことは、かえって不安を助長したり学習機会を失わせたりする恐れがあります。"},

/* ========= データ (令和4年度 試験III 問題7) ========= */
{id:"R4-III-7-1", tag:"R4 試験III 問題7 問1", cat:"クローズド・クエスチョン",
 text:"上級レベルの留学生を対象としたクラスにおいて、ディスカッションの授業を実施した。次の資料を読み、後の問い(問1〜5)に答えよ。<資料>は授業の概要である。\n\n<資料> 授業の概要\n学習者:上級レベルの留学生8名\n授業回数:3回(1回90分)\n授業の目標:①ディスカッションにおいて、他者と協調しながら自分の意見を述べられるようになる。②ディスカッションの方法やマナーを知り、実際にディスカッションが行えるようになる。③ディスカッションの観察を行って評価をすることで、改善点を見つけられるようになる。\n第1回(ディスカッションの準備1):意見を述べる表現やオープン・クエスチョン、クローズド・クエスチョンなど、質問の種類を知る。ある問題の是非を問うタイプのディスカッションの方法を理解する。ディスカッションのテーマを決める。\n第2回(ディスカッションの準備2):ディスカッションに参加する際の留意点について理解する。ディスカッションの時間の管理について知る。ディスカッションを観察して評価する際の手順について理解する。\n第3回(ディスカッションの実践と評価):4人ずつ、討論者グループと観察者グループに分かれる。討論者グループはアイスブレイクを行ってからディスカッションを行う。観察者グループは討論者グループのディスカッションを観察し、記録を取る。ディスカッション後に、記録を基に評価を行い、討論者グループに伝える。討論者と観察者を交代して、同様にディスカッションと評価を行う。\n\n問1 <資料>の下線部A「クローズド・クエスチョン」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["どのようにしたら解決できると思いますか?","あなたが言いたいことは何ですか?","それはいつ始まった政策ですか?","あなたも同じ意見ですか?"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"クローズド・クエスチョンは、「はい/いいえ」や特定の短い答えで答えられる質問です。「あなたも同じ意見ですか?」はまさに「はい/いいえ」で答えられる質問であり、他の選択肢は自由に説明を求めるオープン・クエスチョンです。"},

{id:"R4-III-7-2", tag:"R4 試験III 問題7 問2", cat:"ディスカッションのテーマ",
 text:"問2 <資料>の下線部B「テーマを決める」際の条件として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["参加者全員が興味を持って話し合えるテーマであること","現時点で、社会的に合意が得られた結論が出ているテーマであること","参加者同士で賛否が分かれるようなテーマであること","利害関係が対立するような、複数の立場の人々が関係するテーマであること"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"ディスカッションは、意見の対立や賛否の分かれる論点があってこそ成立する活動です。「社会的に合意が得られた結論が出ているテーマ」は、議論の余地がなく意見交換が生まれにくいため、テーマ選定の条件としては不適当です。"},

{id:"R4-III-7-3", tag:"R4 試験III 問題7 問3", cat:"ディスカッション参加の留意点",
 text:"問3 <資料>の下線部C「ディスカッションに参加する際の留意点」として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["主張する際は理由とその根拠を提示する。","できるだけ専門用語を使って説明する。","全員の意見が早く一致するように進める。","賛成意見を多く出すようにする。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"説得力のある議論のためには、自分の主張に理由と根拠を添えることが基本的な留意点です。専門用語の多用は分かりにくさを招き、意見の早期一致や賛成意見を増やすことを目指すのは、多様な視点を出し合うディスカッション本来の目的に反します。"},

{id:"R4-III-7-4", tag:"R4 試験III 問題7 問4", cat:"ディスカッションの時間管理",
 text:"問4 <資料>の下線部D「時間の管理」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["時間の経過をチェックするために、タイムキーパーを置く。","論点が明確になるように、本論や結論よりも序論の部分に時間をかける。","制限時間内に終わるように、事前におおよその時間配分を考えておく。","時間を有効に使うために、誰か一人が長く話しすぎることがないようにする。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"ディスカッションでは、導入(序論)よりも意見交換や結論の部分にこそ十分な時間を割くべきであり、序論に時間をかけすぎることは時間管理として不適当です。"},

{id:"R4-III-7-5", tag:"R4 試験III 問題7 問5", cat:"アイスブレイク",
 text:"問5 <資料>の下線部E「アイスブレイク」で行うことの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["自己紹介や雑談をして話しやすい雰囲気を作る。","マインドマップでテーマに関する考えを可視化する。","KJ法を使って論点を洗い出し、整理する。","テーマに関連する重要な語句をどう定義するか考える。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"アイスブレイクは、本題に入る前に参加者の緊張をほぐし、話しやすい雰囲気を作るための活動で、自己紹介や雑談がその典型例です。マインドマップやKJ法、語句の定義づけは、ディスカッションの内容そのものを整理・準備する活動です。"},

/* ========= データ (令和4年度 試験III 問題8) ========= */
{id:"R4-III-8-1", tag:"R4 試験III 問題8 問1", cat:"文化の氷山モデル:深層文化",
 text:"次の文章と資料を読み、後の問い(問1〜5)に答えよ。<資料>はX先生が参加したセミナーの資料の一部である。\n\nX先生が先輩のY先生に、文化を取り入れた新しい授業の方法について相談をしている。\n\nX先生:Y先生、私、昨日「文化を授業に取り入れよう!」というセミナーに行ってみたんです。「文化の氷山モデル」について初めて知りました。\nY先生:表層文化と深層文化ですね。\nX先生:はい。文化理解のための方法も体験しました。それで、次回の授業で、文化についても学習者に考えてもらえるといいなと思ったんです。「友人とレストランに行く」というトピックなんですけど。\nY先生:それはいいですね。どんな工夫をしようと思っているんですか?\nX先生:レアリアを使うのはどうかと思っているんです。\nY先生:なるほど、いろいろな効果が期待できそうですね。あるいは、ロールプレイを取り入れてもいいですね。\nX先生:はい。\nY先生:もし別に時間を取ることができれば、ビジターセッションという方法もありますよ。\nX先生:文化を取り入れた授業の評価って、難しそうですが…。\nY先生:ポートフォリオで確認することもできると思いますよ。\n\n問1 文章中の下線部A「深層文化」に該当するものとして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ジェスチャー","服装","建築物","思考法"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"文化の氷山モデルでは、目に見える行動・習慣・服装・建築物などは「表層文化」、その背後にある価値観・思考法・世界観など目に見えない部分は「深層文化」とされます。ジェスチャー・服装・建築物はいずれも目に見える表層文化の例です。"},

{id:"R4-III-8-2", tag:"R4 試験III 問題8 問2", cat:"レアリア",
 text:"問2 文章中の下線部B「レアリア」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["臨場感を持たせることができ、興味を持続させることができる。","同じ物でも国によってイメージが異なるため、その違いを見せることができる。","長さの違った様々な色の棒を使って、概念や行動を示すことができる。","導入だけでなく、練習でもコミュニカティブな活動で使用することができる。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"レアリアとは、メニューや切符、パンフレットなど実際に使われている本物の素材(実物教材)を指します。「長さの違った様々な色の棒」はキュイズネール・ロッド(カラーロッド)と呼ばれる別の教具であり、レアリアの説明としては不適当です。"},

{id:"R4-III-8-3", tag:"R4 試験III 問題8 問3", cat:"ロールプレイの授業例",
 text:"問3 文章中の下線部C「ロールプレイ」を取り入れた授業の例として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本のレストランの場面で与えられた役割を演じたあとで、学習者の国との違いを考えさせる。","動画でレストランでの店員と客のやり取りを見せたうえで、同じ場面設定での会話をペアで作り発表させる。","日本語で書かれたレストランのメニューを見て、どのような料理がいくらで食べられるかをペアで確認させる。","レストランでの友人同士の会話だけではなく、上司と部下といった異なる役割での会話も行い、言語行動の違いを話し合わせる。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「メニューを見て料理の値段を確認させる」活動は、役割を演じて言語行動を体験するロールプレイではなく、レアリア(メニュー)を用いた読解・情報検索的な活動です。したがってロールプレイの例としては不適当です。"},

{id:"R4-III-8-4", tag:"R4 試験III 問題8 問4", cat:"ビジターセッション",
 text:"問4 文章中の下線部D「ビジターセッション」の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者とビジターが対等な関係を構築できるよう、やり取りを重視した双方向型のセッションを行う。","学習者がビジターと自由に交流し、知りたい情報を得られるよう、教師は介入しないでセッションを見守る。","学習者が多くの知識を得ることができるよう、ビジターが事前に調べてきた情報を可能な限り提供してもらう。","一般的な日本人の考え方が引き出せるよう、ビジター個人の意見や気持ちを聞くことは避けるよう指導する。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"ビジターセッションは、地域の人など日本語母語話者(ビジター)を教室に招き、学習者と対等な立場でやり取りをする双方向的な交流活動です。教師が一切介入しない、一方的に情報提供させる、個人の意見を避けさせるといった運用は、双方向性という本来の趣旨に合いません。"},

{id:"R4-III-8-5", tag:"R4 試験III 問題8 問5", cat:"ポートフォリオ評価",
 text:"問5 文章中の下線部E「ポートフォリオ」を評価に用いる際の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学んだ知識や情報がどのくらいあったか、それを正しく覚えているかを数値化し測れるようにする。","授業を通して何をどのように考えるようになったかが分かるように、変化が分かるものを全て保存させるようにする。","自分が気づいたことや考えたことを毎回の授業後に記録させるが、日本語の授業の一環であるため母語の使用は禁止する。","学習の過程や結果を見るための項目や評価基準を設定するが、学習に対する姿勢は主観的な観点であるため除外する。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"ポートフォリオ評価は、学習の過程における気づきや変化を継続的に記録・蓄積し、学習者の成長のプロセスを可視化することが本来の目的です。知識量の数値化、母語使用の一律禁止、学習姿勢の除外は、いずれもポートフォリオ評価の趣旨にそぐいません。"},
