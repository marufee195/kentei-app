{id:"R7-11-1", tag:"R7 試験I 問題11 問1", cat:"語彙論:外来語の意味変容",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語には多くの外来語がある。外来語は外国語から借用された語である。外国語を借用する際、原語の意味や語形が変容することがある。意味の面では、外来語として取り入れられたときに原語と比べて意味が限定されることや拡大されることがある。語形の面では、原語から作られた外来語を縮めた略語も多い。また、外来語の発音は原語とは異なるものもあり、その特徴は「外来語の表記」(1991年内閣告示・訓令)に示されている。日本独自の造語である和製外来語もある。外来語と同一概念を表す和語や漢語が存在する場合には、それぞれの用いられ方に傾向がある。\n\n問1 文章中の下線部Aの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「ジュース」の意味は、原語では「果汁や野菜汁が入った甘い飲み物」だが、外来語では「清涼飲料水」である。","「ビジネスマン」の意味は、原語では「事業を営む人」だが、外来語では「会社員」である。","「プロポーズ」の意味は、原語では「提案すること」だが、外来語では「結婚の申込み」である。","「マンション」の意味は、原語では「比較的規模の大きい中高層の集合住宅」だが、外来語では「大邸宅」である。"], answer:2,
 explain:"英語の“propose”は「提案する」という広い意味を持ちますが、外来語「プロポーズ」は「結婚の申込み」という限定された意味で使われており、原語より意味が限定される例として最も適当です。"},

{id:"R7-11-2", tag:"R7 試験I 問題11 問2", cat:"語彙論:略語の作り方",
 text:"問2 文章中の下線部B「略語」に関して、語形の省略の仕方が異なるものを、次の1〜4の中から一つ選べ。",
 choices:["新しいエアコンを買うつもりです。","企画案のブレストを始めましょう。","退院後はリハビリに専念します。","来年はワーホリで稼ごうと思う。"], answer:2,
 explain:"「エアコン(air conditioner)」「ブレスト(brainstorming)」「ワーホリ(working holiday)」は、いずれも複合的な語(または句)の各構成要素の一部分ずつを組み合わせて作られた略語です。一方「リハビリ(rehabilitation)」は、単一の語の前部だけを切り取った略語であり、省略の仕方が異なります。"},

{id:"R7-11-3", tag:"R7 試験I 問題11 問3", cat:"表記法:外来語の表記の原則",
 text:"問3 文章中の下線部C「外来語の表記」に示されている表記の原則として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["5拍以上の語は、「コンピュータ」のように語末の長音記号を省いて表記する。","イ列・エ列の音の次の「ア」の音に当たるものは、「タイヤ」のように「ヤ」と表記する。","「サンドウィッチ」のように語源が有名な語は、原語の発音に近い表記を用いる。","「バイオリン」「ヴァイオリン」のような表記にゆれのある語は、両方の表記を認める。"], answer:3,
 explain:"「外来語の表記」の内閣告示では、慣用が定着している語について、複数の表記が並存することを一定程度許容しており、「バイオリン」「ヴァイオリン」のような表記のゆれは両方とも認められています。"},

{id:"R7-11-4", tag:"R7 試験I 問題11 問4", cat:"語彙論:和製外来語",
 text:"問4 文章中の下線部D「和製外来語」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["美化活動で町のイメージアップを図る。","私の職場はチームワークがいい。","昼ご飯はファストフードだった。","夏休みにホームステイをする。"], answer:0,
 explain:"「イメージアップ」は、英語の“image”と“up”を組み合わせた、英語には存在しない日本独自の造語(和製外来語)です。「チームワーク」「ファストフード」「ホームステイ」は、いずれも英語に実在する表現です。"},

{id:"R7-11-5", tag:"R7 試験I 問題11 問5", cat:"語彙論:外来語と和語・漢語の使い分け",
 text:"問5 文章中の下線部Eの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「アスリート」はプロの運動選手に、「競技者」はアマチュアの運動選手に用いられる傾向にある。","「キャンセル」は飛行機などの予約の取消しに、「解約」は保険などの改まった契約の取消しに用いられる傾向にある。","「バランス」は団体間での力関係の釣合いに、「均衡」は収支の釣合いに用いられる傾向にある。","「プレゼント」は個人的に贈られる進物に、「贈り物」は結婚式などの儀式で贈られる進物に用いられる傾向にある。"], answer:1,
 explain:"「キャンセル」は予約の取消しのような日常的でカジュアルな場面、「解約」は保険や契約のような改まった場面で使われる傾向があり、外来語と漢語の使い分けの典型例です。"},

/* ========= データ (令和7年度 試験I 問題12) ========= */
{id:"R7-12-1", tag:"R7 試験I 問題12 問1", cat:"敬語:5種類の敬語",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n待遇表現は、会話の相手や内容などに配慮して使い分ける表現であり、敬語も含む。敬語は、相手との上下関係やウチ・ソトといった関係性を考慮しながら使い分けられる。「敬語の指針」(2007年文化審議会)では、5種類の敬語が示されている。また、補助動詞を含む授受動詞も相手との関係に応じて様々な使い方がある。\n敬語を用いることで敬意を示すことができるが、二重敬語の適切性については議論がある。接客の場面でのマニュアル敬語は、違和感の原因となることもある。このほか、待遇表現は軽卑語や尊大語も含む。\n\n問1 文章中の下線部A「5種類の敬語」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「そのように申しております。」の「申す」は尊敬語である。","「15時に参ります。」の「参る」は謙譲語II(丁重語)である。","「昨晩は何時頃お休みでしたか。」の「お休み」は美化語である。","「お酒はいかがですか。」の「お」は丁寧語である。"], answer:1,
 explain:"「参る」は、特定の相手を高めるのではなく、聞き手に対して丁重に述べる謙譲語II(丁重語)です。「申す」は謙譲語I、「お休み」は相手の行為を高める尊敬語、「お酒」の「お」は美化語であるため、他の記述は不適当です。"},

{id:"R7-12-2", tag:"R7 試験I 問題12 問2", cat:"敬語:授受動詞の制約",
 text:"問2 文章中の下線部Bに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「〜てあげる」を目下の身内に対して直接使うことには待遇上の観点からの制約がある。","「〜てさしあげる」を目上の人に対して直接使うことには待遇上の観点からの制約がある。","「〜ていただく」は、目下の身内に対して話し手が恩恵的行為を行ったことを表す。","「〜てくださる」は、目上の身内に対して話し手が恩恵的行為を行ったことを表す。"], answer:0,
 explain:"「〜てあげる」は、恩着せがましく聞こえる可能性があるため、身内など親しい相手に対してであっても、本人に向かって直接使うことには一定の制約(気を遣うべき点)があるとされます。「〜てさしあげる」も同様の配慮が必要とされ、「〜ていただく」「〜てくださる」は話し手が恩恵を受ける側を表す表現であるため、他の記述は不適当です。"},

{id:"R7-12-3", tag:"R7 試験I 問題12 問3", cat:"敬語:二重敬語",
 text:"問3 文章中の下線部C「二重敬語」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["先生、昨日、いつお帰りになられたんですか。","先生、あの話題の映画、ご覧になりましたか。","先生、学食、ご利用していらっしゃいますか。","先生、そのおかばん、お持ちになりますか。"], answer:0,
 explain:"「お帰りになられた」は、尊敬語「お〜になる」と尊敬の助動詞「られる」を重ねて使っており、同じ人物の同じ動作に二重に尊敬語を使う「二重敬語」の例です。"},

{id:"R7-12-4", tag:"R7 試験I 問題12 問4", cat:"敬語:マニュアル敬語",
 text:"問4 文章中の下線部D「マニュアル敬語」とみなされる「から」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["申し訳ございませんが、明日の営業は11時からになります。","ご要望からしますと、こちらの商品はいかがでしょうか。","お飲み物からお伺いします。","1万円からお預かりします。"], answer:2,
 explain:"「お飲み物からお伺いします」の「から」は、いわゆる「ファミレス敬語」「バイト敬語」と呼ばれる、接客マニュアルに由来する不自然な用法の典型例です。"},

{id:"R7-12-5", tag:"R7 試験I 問題12 問5", cat:"待遇表現:尊大語",
 text:"問5 文章中の下線部E「尊大語」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["早くしやがれ。","これでも食らえ。","お前はすっこんでろ。","褒めてつかわすぞ。"], answer:3,
 explain:"「つかわす」は、目上の者が目下の者に対して恩着せがましく、尊大な態度で用いる古風な言い方で、尊大語の典型例です。他の選択肢は、相手を見下し罵るような軽卑語の例です。"},

/* ========= データ (令和7年度 試験I 問題13) ========= */
{id:"R7-13-1", tag:"R7 試験I 問題13 問1", cat:"文体論:かたい表現とやわらかい表現",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n文章と談話には、それぞれ異同がある。文章は、文字によって表される。このうち、特に論文やレポートでは、かたい表現がやわらかい表現と区別されて用いられる。また、レポートには決まった構成がある。文章を書く際、句読点の打ち方や記号の使い方にも傾向がある。一方、談話には音声によるもののほか、文字によるものもある。そのため、音声言語の談話と文字言語の談話には異なる特徴がある。\nまた、文章と談話のいずれも、語彙的な結束性と文法的な結束性によって語と語、文と文が意味的につながりのあるものになっているという点が共通している。\n\n問1 文章中の下線部Aに関して、かたい表現とやわらかい表現の例の組合せとして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["かたい表現:極めて / やわらかい表現:非常に","かたい表現:だから / やわらかい表現:したがって","かたい表現:全然〜ない / やわらかい表現:絶対〜ない","かたい表現:共に / やわらかい表現:一緒に"], answer:3,
 explain:"「共に」はかたい書き言葉的な表現、「一緒に」はやわらかい話し言葉的な表現であり、両者は同じ意味を表す硬軟の対応関係にあります。他の組合せは、硬軟の対応関係になっていません(「したがって」はむしろ「だから」よりかたい表現です)。"},

{id:"R7-13-2", tag:"R7 試験I 問題13 問2", cat:"アカデミック・ライティング:レポートの構成",
 text:"問2 文章中の下線部Bに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["序論では、テーマについてどのような議論をするのかを伝える。","本論では、個人の主観に基づいて議論を展開する。","結論では、テーマを選んだ理由を中心に述べる。","本文で引用した文献は、主要なものを参考文献に入れる。"], answer:0,
 explain:"レポートの序論では、これから何について、どのような議論を展開するのかを読み手に予告するのが一般的な構成です。本論は客観的根拠に基づいて論じ、結論はテーマ選定理由ではなく議論のまとめを述べ、引用した文献は原則として全て参考文献に挙げる必要があるため、他の記述は不適当です。"},

{id:"R7-13-3", tag:"R7 試験I 問題13 問3", cat:"表記法:公用文における記号の使い方",
 text:"問3 文章中の下線部C「記号の使い方」に関して、「公用文作成の考え方」(2022年文化審議会)に示された符号の使い方の原則として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["米印「※」は、文の流れを切り、間を置くときに用いる。","波線「〜」は、項目とその説明等を区切るときに用いる。","感嘆符「!」は、数字やローマ字による表記をつなぐときに用いる。","スラッシュ「/」は、同音異義語等を対比して示すときに用いる。"], answer:3,
 explain:"「公用文作成の考え方」では、スラッシュ「/」は同音異義語等を対比して示す際などに用いるとされています。米印は注釈を示す際、波線は範囲を示す際、感嘆符は強調表現に用いるものであり、他の記述は原則の内容と異なります。"},

{id:"R7-13-4", tag:"R7 試験I 問題13 問4", cat:"言語学:文字言語と音声言語の特徴",
 text:"問4 文章中の下線部Dに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["文字言語は、伝達内容の記録に用いられ、時間や場所を越えて内容を一方向的に伝達するのに適している。","文字言語は、瞬間的に生じるもので、情報の伝達を即時的に行うことに適している。","音声言語は、思考を区切りやまとまりごとに整理して、発話内容を構成するのに適している。","音声言語は、話者の記憶に含まれる内容同士の関係を明確にして、正確に表現するのに適している。"], answer:0,
 explain:"文字言語は記録性に優れ、時間や場所を隔てた相手に一方向的に情報を伝えるのに適しています。瞬間的・即時的な伝達や、内容の整理・正確な表現は、むしろ音声言語や文字言語のそれぞれ異なる側面の記述として不適当です。"},

{id:"R7-13-5", tag:"R7 試験I 問題13 問5", cat:"文法論:文法的結束性",
 text:"問5 文章中の下線部E「文法的な結束性」が、次の各選択肢の2文目に含まれている名詞句によって言語的に表示されているものはどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「昔、ある所に兄弟が住んでいました。兄は働き者で、弟は怠け者でした。」","「木に登っている女の子がいました。少女は、高い所が好きなようでした。」","「昨日セーターを買いに行きました。白くておしゃれなのを買いました。」","「駅前の本屋さんに行きました。本屋さんには話題の本が陳列されていました。」"], answer:2,
 explain:"「白くておしゃれなの」の「の」は、前文の「セーター」を受ける代用形であり、語句を繰り返さずに文法的な仕組みによって前後の文をつなぐ文法的結束性の例です。他の選択肢は、同義語の言い換えや語の反復による語彙的結束性の例です。"},

/* ========= データ (令和7年度 試験I 問題14) ========= */
{id:"R7-14-1", tag:"R7 試験I 問題14 問1", cat:"留学生政策:出身国別留学生数",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n外国人留学生受入れの取組が進められている。「2023(令和5)年度外国人留学生在籍状況調査結果」(日本学生支援機構)では、出身国(地域)別の留学生数が示されている。また、同調査では、短期留学生の数についても調査が行われている。\n外国人留学生の増加に伴い、課題も指摘されるようになっている。これに関して、文部科学省・出入国在留管理庁は「留学生の在籍管理の徹底に関する新たな対応方針(2019年)」の中で、在籍管理上の課題と対応方針を示した。一方、高等教育機関を卒業・修了する外国人留学生の日本国内での就職に向けた支援も行われている。その一つに、2017年より文部科学省が実施している「留学生就職促進プログラム」がある。\n\n問1 文章中の下線部Aに関して、出身国別の留学生数が多い順に並べたものとして最も適当な組合せを、次の1〜4の中から一つ選べ。",
 choices:["1位:中国 / 2位:韓国 / 3位:ベトナム","1位:中国 / 2位:ネパール / 3位:ベトナム","1位:ベトナム / 2位:中国 / 3位:ネパール","1位:ベトナム / 2位:中国 / 3位:韓国"], answer:1,
 explain:"「2023(令和5)年度外国人留学生在籍状況調査結果」では、中国が引き続き最多で、近年はネパールからの留学生数が増加してベトナムを上回り2位となっています。"},

{id:"R7-14-2", tag:"R7 試験I 問題14 問2", cat:"留学生政策:短期留学生の定義",
 text:"問2 文章中の下線部B「短期留学生」に関して、「2023(令和5)年度外国人留学生在籍状況調査結果」(日本学生支援機構)における短期留学生の定義として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["中等教育の課程の修了までに12年を要しない国からの学生で、日本での大学入学資格を得るための課程に在籍する留学生","大学としての教養教育や、それを基礎とした専門教育を2年または3年で提供する短期大学に在籍する留学生","日本の国費により、大学、高等専門学校、専修学校等に在学し、教育や研究指導を受ける留学生","必ずしも学位取得を目的とせず、大学等における学習、異文化体験等を目的として、教育や研究指導を受ける留学生"], answer:3,
 explain:"同調査における短期留学生は、学位取得を主目的とせず、大学間協定等に基づき、学習や異文化体験などを目的として一定期間在籍する留学生と定義されています。"},

{id:"R7-14-3", tag:"R7 試験I 問題14 問3", cat:"留学生政策:在籍管理の徹底方針",
 text:"問3 文章中の下線部C「留学生の在籍管理の徹底に関する新たな対応方針(2019年)」に当てはまらないものを、次の1〜4の中から一つ選べ。",
 choices:["専ら日本語教育を行う留学生別科について、教育の質の確保や留学生の適正な受入れのための仕組みがないため、法務省の告示基準に準じた基準を策定する。","留学生が安心して教育研究に専念できず、かつ、多様な交流を生み出すことができていないことも懸念されるため、留学生宿舎等の整備や確保を進める。","非正規生の制度等を使って日本語能力が十分でない留学生を受け入れている実態が懸念されるため、大学入学相当の日本語能力を入学時に求めているか確認する。","所在不明者や所在不明を理由とした除籍者が多く発生し、不法滞在、不法就労等につながっている実態が懸念されるため、在籍管理等の徹底を要請する。"], answer:1,
 explain:"留学生宿舎等の環境整備は、一般的な留学生受入れ環境の充実に関する施策であり、不正在留対策としての「在籍管理の徹底」という2019年対応方針が主眼とする内容には当てはまりません。"},

/* ========= データ (令和7年度 試験I 問題15) ========= */
{id:"R7-15-1", tag:"R7 試験I 問題15 問1", cat:"日本語教育史:中国人留学生への教育法",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本国内への留学生受入れは、明治期に朝鮮政府からの派遣により始まったと言われている。その後、中国人留学生の受入れも始まり、宏文学院や日華同人共立東亜高等予備学校で日本語教育が行われた。この時期、中国人留学生に対して用いられた特徴的な教育方法があった。\n海外では、日本語教育が国策として行われた。台湾では、1896年から日本語教育が開始され、山口喜一郎などがグアン式教授法に基づく教え方を導入した。このほか、朝鮮半島や中国大陸、南洋群島などにおいても日本語教育は実施された。海外での日本語教育普及は終戦とともに終わったが、その後再開された。\n一方、日本国内の日本語教育は、1950年代には本格的に再開された。また、1950年に(ア)が刊行され、これ以降の文型積み上げ型の初級日本語教科書の構成に大きな影響を与えた。\n\n問1 文章中の下線部A「中国人留学生に対して用いられた特徴的な教育方法」として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["読解や聴解の後にその内容を他の学習者に向けて語る「再話法」を取り入れた教育","学習者の個別性を踏まえ、いくつかの教授法を取り入れた「折衷法」の教育","教師が発問して学習者がそれに答える「問答法」を採用した教育","一定の専門分野を短期間に通訳付きで教える「速成教育」"], answer:3,
 explain:"明治期の中国人留学生に対しては、限られた期間で特定の専門分野の知識を習得させるため、通訳を介した「速成教育」が行われたことが知られています。"},

{id:"R7-15-2", tag:"R7 試験I 問題15 問2", cat:"日本語教育史:グアン式教授法",
 text:"問2 文章中の下線部B「グアン式教授法」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["媒介語で文法を説明し、学習者に文章を翻訳させながら理解を促す。","教師は可能な限り沈黙し、学習者の気づきを重視して目標言語の習得を促す。","教師が一連の動作を目標言語で言い表し、学習者にその動作と発話を繰り返させる。","学習者が言いたいことを母語などで発話させ、目標言語での表現の仕方を教える。"], answer:2,
 explain:"グアン式教授法(シリーズ・メソッド)は、一連の動作を目標言語で実演しながら言葉で表現し、学習者にその動作と発話を模倣・反復させることで、行動と言語を結び付けて習得させる教授法です。"},

{id:"R7-16-1", tag:"R7 試験III 問題1 問1", cat:"語彙論:オノマトペ",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語は、オノマトペが特徴的だと言われる。オノマトペには、擬音語と擬態語がある。オノマトペでは言語音とそれが示す意味との間にある程度の関係が認められる。例えば、(ア)が使われているオノマトペは、使われていないオノマトペと比べて強い力、大きい物、重い物、鈍い物、汚い物を意味する傾向がある。\n言語音とそれが示す意味との関係はオノマトペにとどまらず、アニメのキャラクターなど、架空の名称にも観察される。このように音から意味の連想が直起きる現象は「音象徴」と呼ばれている。例えば、二つのキャラクターに「トハシ」と「ロナミ」という架空の名前を付けると、「ロナミ」と比べ「トハシ」には角ばった形のイメージが生まれやすい。\nさらに、母音/i/は、物が小さいといったイメージと関係している。/i/の口の構えが、赤ちゃんに話し掛けるときに使う言葉のような、幼いイメージにつながることもある。そのため、学習者の発音の誤用の一部から、母語話者が意図せずにこのようなイメージを想起してしまう可能性があることも教師として認識する必要がある。一方、オノマトペを習得することで学習者が得られるメリットも多いことから、どのような形で授業に導入するか、意識する必要がある。\n\n問1 文章中の下線部A「擬音語」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["雨が非常に強く降るときの「ザアザア」","しつこく視線を向けるときの「ジロジロ」","続けざまの様子を示すときの「ツギツギ」","別れの挨拶をするときの「バイバイ」"], answer:0,
 explain:"「ザアザア」は、雨が降る実際の音を模した擬音語です。「ジロジロ」「ツギツギ」は状態や様子を表す擬態語、「バイバイ」は挨拶の言葉であり、音を模したものではないため、擬音語の例としては不適当です。"},

{id:"R7-16-2", tag:"R7 試験III 問題1 問2", cat:"語彙論:音象徴(濁音)",
 text:"問2 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",

 explain:"日本語のオノマトペでは、濁音(が行・ざ行・だ行・ば行の子音)が使われると、清音の場合に比べて、強い力・大きさ・重さ・鈍さ・汚さといった印象を伴う傾向があることが知られています(例:「からから」と「がらがら」)。"},

{id:"R7-16-3", tag:"R7 試験III 問題1 問3", cat:"音声学:音象徴と調音法",
 text:"問3 文章中の下線部Bの理由を、「トハシ」「ロナミ」に含まれる音の違いで説明する場合に最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「トハシ」には、「ロナミ」よりも狭母音が多く含まれているから","「トハシ」には、「ロナミ」よりも広母音が多く含まれているから","「トハシ」には、「ロナミ」にはない鼻音や弾き音が含まれているから","「トハシ」には、「ロナミ」にはない破裂音や摩擦音が含まれているから"], answer:3,
 explain:"「トハシ」の子音[t][h][s]は破裂音・摩擦音であり、鋭く角ばった印象を与えます。一方「ロナミ」の子音[r][n][m]は弾き音・鼻音という、口腔内の閉鎖を伴わない柔らかい印象の音であり、丸みのあるイメージにつながります。"},

{id:"R7-16-5", tag:"R7 試験III 問題1 問5", cat:"語彙教育:オノマトペ習得のメリット",

/* ========= データ (令和7年度 試験III 問題2) ========= */
{id:"R7-16-6", tag:"R7 試験III 問題2 問1", cat:"文法:指示語の品詞",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n「これ・それ・あれ」「この・その・あの」「こう・そう・ああ」など、コ・ソ・アから始まる体系的な語類を指示語と言う。指示語は品詞をまたがるものであり、語形によって代名詞や副詞として機能する。\n学習者にとってコ・ソ・アの使い分けは難しく、用法別に整理して理解させる必要がある。現場指示には、話し手と聞き手がそれぞれ異なる領域に属するときの対立型と、領域を共有しているときの融合型という異なる二つのタイプがある。文脈指示においては、指し示したい事柄を話し手がどう捉えているかによってコ・ソ・アが選択される。文脈指示における「この+名詞」「その+名詞」は、「この」「その」と名詞が合わさった全体が指示対象に対応する場合と、「この」「その」という指示語の部分だけが指示対象に対応する場合があり、後者ではコ系が使いにくいという制約がある。\nそのほか、指示語は真偽疑問文に対する応答表現などにも使われ、分かりやすい文章を構成したり、コミュニケーションを円滑に進めたりするうえでも重要な役割を果たす。\n\n問1 文章中の下線部A「代名詞や副詞」に関して、代名詞と副詞の例の最も適当な組合せを、次の1〜4の中から一つ選べ。",
 choices:["代名詞:あちら / 副詞:そんな","代名詞:あんな / 副詞:こう","代名詞:その / 副詞:こんな","代名詞:こちら / 副詞:そう"], answer:3,
 explain:"「こちら」は場所などを指す代名詞、「そう」は状態などを指す副詞として、それぞれ純粋にその品詞に属する指示語です。「そんな」「あんな」「こんな」は連体詞的・形容動詞的な性質を持ち、「その」は連体詞であるため、代名詞・副詞の組合せとしては他の選択肢は不適当です。"},

{id:"R7-16-7", tag:"R7 試験III 問題2 問2", cat:"語用論:現場指示の融合型",
 text:"問2 文章中の下線部B「融合型」に分類される指示語の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["(話し手の背中を触診している医者に対して)あっ、そこ、すごく痛いです。","(タクシーの車内で客が運転手に対して)えーと、その角を曲がってください。","(目の前で大笑いしている先輩に対して)なんでそんなに笑っているんですか?","(電話で話している友人に対して)そろそろそっちの生活にも慣れてきましたか?"], answer:1,
 explain:"タクシーの車内という同じ空間を話し手と聞き手が共有している状況で、前方に見えている角を指す「その角」は、話し手と聞き手が領域を共有する「融合型」の現場指示の例です。他の選択肢は、話し手と聞き手が異なる領域に属する対立型や、現場指示以外の用法の例です。"},

{id:"R7-16-8", tag:"R7 試験III 問題2 問3", cat:"語用論:文脈指示の選択",
 text:"問3 文章中の下線部Cに関して、次のYの発話に含まれる指示語の誤用を避けるために必要な知識として最も適当なものを、下の1〜4の中から一つ選べ。\n\nX:実は私の知り合いが今度自分のお店を開業するらしいんですよ。\nY:えっ、これはすごいですね。",
 choices:["話し手が記憶の中の事柄を思い出しながら指す場合はア系を用いる。","相手も話し手も共に知っている事柄を話し手が指す場合はア系を用いる。","相手が言った事柄で話し手がよく知らない事柄を指す場合はソ系を用いる。","話し手がこれから話題にしようとする事柄を指す場合はソ系を用いる。"], answer:2,
 explain:"相手(X)の発話で初めて知った、話し手(Y)がまだよく知らない事柄を指す場合には、ソ系の指示語(それ)を用いるのが適切です。Yの発話の「これ」は誤用であり、正しくは「それはすごいですね」となります。"},

{id:"R7-16-9", tag:"R7 試験III 問題2 問4", cat:"文法:「その+名詞」の指示部分のみの対応",
 text:"問4 文章中の下線部Dの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ある事件がありました。そのことが私の人生を大きく変えました。","まず鍋に全ての具材と水を入れます。そしてその鍋を火に掛けます。","冒頭に一人の男性が登場します。その男の男がこの物語の主人公です。","先日アンケートを実施しました。今日はその結果を報告します。"], answer:3,
 explain:"「その結果」の「その」は先行する「アンケート」を指していますが、「結果」自体はアンケートそのものとは別の新しい情報です。このように、指示語の部分だけが先行する指示対象に対応し、後続の名詞が新情報を表す場合、コ系を用いることが難しいという制約があります。"},

{id:"R7-16-10", tag:"R7 試験III 問題2 問5", cat:"語用論:真偽疑問文への応答表現",
 text:"問5 文章中の下線部E「真偽疑問文に対する応答表現」に関して、次のXの発話に対するYの「そうです」という誤用に対する指導の内容として最も適当なものを、下の1〜4の中から一つ選べ。\n\nX:Zさんは明日学校に来ますか?\nY:そうです。",
 choices:["肯定形の疑問文に対して「そうです」とは答えられない。","三人称主語の疑問文に対して「そうです」とは答えられない。","動詞のル形が述語の疑問文に対して「そうです」とは答えられない。","未実現の事態についての疑問文に対して「そうです」とは答えられない。"], answer:2,
 explain:"「そうです」は、名詞述語文などの真偽を問う疑問文に対する応答表現であり、「来ますか」のように動詞のル形が述語となる疑問文には使えません。この場合は「はい、来ます」のように動詞を用いて答える必要があります。"},

/* ========= データ (令和7年度 試験III 問題3) ========= */
{id:"R7-16-11", tag:"R7 試験III 問題3 問1", cat:"文法:仮定条件文と一般条件文",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n「と」「たら」「ば」「なら」などを用い、従属節の事態に依存して主節の事態が起こるという関係を表す文を条件文と言う。条件文には、「仮定条件」を述べるものと、「一般(恒常)条件」を述べるものがある。\n条件文やその隣接表現を指導する際は、形式間の違いに目を向けることが有効であろう。重要な相違点の一つに、従属節と主節の時間の前後関係に関して、必ず従属節の事態の後に主節の事態が生じる条件文を作る形式と、従属節の事態の前に主節の事態が生じる条件文を作る形式との違いがある。また、主節の文末に命令・依頼表現を使う際は従属節の述語の性質が影響する点も押さえておいたほうがよい。「と」「たら」は、未実現の事態を仮定して述べるタイプの典型的な条件文とは異なる、事実的条件文の用法も持つ。中級以上で扱われる表現として「〜かぎりは」「〜でもしたら」「〜ないことには」「〜ものなら」などもあり、条件を表す表現の広がりは大きい。\n\n問1 文章中の下線部Aに関して、仮定条件を表す文と一般(恒常)条件を表す文の組合せのうち最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["仮定条件:あの角を右に曲がると、コンビニがありますよ。 / 一般条件:彼が来るなら、今度のパーティーは盛り上がるでしょう。","仮定条件:春になれば、桜の花が満開になります。 / 一般条件:この本を読んだら、問題が解決するでしょう。","仮定条件:気に入ったデザインがあったら、買いたいです。 / 一般条件:気温が上がると、雪が溶けて川の水位が上がります。","仮定条件:来週、時間があるなら、映画に行きましょう。 / 一般条件:明日、雨が降れば、運動会は中止です。"], answer:2,
 explain:"「気に入ったデザインがあったら、買いたい」は一回限りの個人的な仮定を述べる仮定条件文です。一方「気温が上がると、雪が溶けて川の水位が上がる」は、いつでも成り立つ自然法則的な因果関係を述べる一般(恒常)条件文であり、「と」が持つ恒常条件を表す典型的な用法です。"},

{id:"R7-16-12", tag:"R7 試験III 問題3 問2", cat:"文法:主節が従属節に先行する条件文",
 text:"問2 文章中の下線部B「従属節の事態の前に主節の事態が生じる条件文」を作ることができる従属節の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["料理を作ると、","料理を作ったら、","料理を作れば、","料理を作るなら、"], answer:3,
 explain:"「なら」は、「料理を作るなら、材料を買っておくね」のように、従属節が表す事態が実現する前に主節の事態を行うという、時間的に主節が従属節に先行する条件文を作ることができる点で、他の条件表現とは異なります。"},

{id:"R7-16-13", tag:"R7 試験III 問題3 問3", cat:"文法:条件文と命令・依頼表現",
 text:"問3 文章中の下線部Cに関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「と」は、従属節の述語が状態を表す場合に、命令・依頼表現が使える。","「たら」は、従属節の述語の性質にかかわらず、命令・依頼表現が使える。","「ば」は、従属節の述語が状態を表す場合に、命令・依頼表現が使える。","「なら」は、従属節の述語の性質にかかわらず、命令・依頼表現が使える。"], answer:1,
 explain:"「たら」は比較的自由に命令・依頼表現と共起できますが、従属節の述語の性質と全く無関係というわけではなく、一定の制約が指摘されています。「にかかわらず」と言い切る記述は不適当です。"},

{id:"R7-16-14", tag:"R7 試験III 問題3 問4", cat:"文法:事実的条件文",
 text:"問4 文章中の下線部D「事実的条件文」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["あそこの窓を開けると、虫が入ってきちゃうよ。","処方された薬を飲んだら、すぐに熱が下がったよ。","仕事がもっと早く終わっていたら、ゆっくりできたね。","このまま忙しい日が続くと、趣味の時間が減るかもね。"], answer:1,
 explain:"「薬を飲んだら、すぐに熱が下がった」は、実際に起こった具体的な出来事の継起を事実として述べる事実的条件文の例です。他の選択肢は、未実現の事態の仮定(1、4)や反実仮想(3)を表しています。"},

{id:"R7-16-15", tag:"R7 試験III 問題3 問5", cat:"文法:中級以上の条件表現",
 text:"問5 文章中の下線部E「「〜かぎりは」「〜でもしたら」「〜ないことには」「〜ものなら」」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「〜かぎりは」は、否定形に後接でき、「主節が述べる事態の範囲において従属節の事態が必ず成立する」ということを述べる条件文を作る。","「〜でもしたら」は、終止形に後接でき、「望ましくない出来事が起こった場合」を仮定する条件文を作る。","「〜ないことには」は、未然形に後接でき、「あることを実現するためには主節の事態が必要」ということを述べる条件文を作る。","「〜ものなら」は、可能形に後接でき、「実現可能性の低い出来事が実現した場合」を仮定する条件文を作る。"], answer:3,
 explain:"「〜ものなら」は可能形に接続し、「行けるものなら行きたい」のように、実現の可能性が低い事態を仮定して述べる条件表現です。他の選択肢は、接続する活用形や表す意味の記述が実際の用法と異なります。"},

/* ========= データ (令和7年度 試験III 問題4) ========= */
{id:"R7-16-16", tag:"R7 試験III 問題4 問1", cat:"文法:接続表現(逆接)",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n接続表現は、どのような関係を示すかという機能によって分類される。分類には、順接や逆接の関係を示すものなどがある。順接には、「原因・理由」と「帰結」という関係を示すものと、「条件」と「帰結」という関係を示すものがある。前者の接続表現の一つに「それで」がある。使用する際は「それで」に後続する文の使い方に気を付けなければならない。また、話題や場面の転換を示すものには「さて」や「ところで」がある。\n接続表現は、類似した関係を表す表現が複数あるため、どのような場面でどのような表現を使うかについての指導が必要である。このほか、話し手の判断や表現意図による使い分けもある。例えば、「今日中にこの仕事を終わらせなければいけない。」という先行部に、別の人が「ほかの人にも応援を頼みましょう。」という後続部を続ける場合、二つをつなぐ接続表現には「だから」も「それなら」もあり得る。ただし、「だから」と「それなら」のどちらを使うかによって表現意図が異なるため、注意が必要である。\n\n問1 文章中の下線部A「逆接」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["経営戦略を改めて練り直そう。そうしたら、倒産しないだろう。","手順どおりにボタンを押した。それなのに、何も起こらなかった。","この店は飲み物のお代わりが自由にできる。つまり、飲み放題だ。","この植物が自生するのは極めて珍しい。というより、これまで見たことがない。"], answer:1,
 explain:"「それなのに」は、前件から予想される結果とは反対の事態が起こったことを示す逆接の接続表現です。「そうしたら」は順接の条件・帰結、「つまり」は言い換え、「というより」は言い直しを表す接続表現です。"},

{id:"R7-16-17", tag:"R7 試験III 問題4 問2", cat:"文法:「それで」に後続する文",
 text:"問2 文章中の下線部B「「それで」に後続する文」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["希望や要求を表す単文を使わなければならない。","推論を表す単文を使わなければならない。","命令を表す単文を使うことができない。","過去の出来事を表す単文を使うことができない。"], answer:2,
 explain:"原因・理由と帰結の関係を示す「それで」は、後続文に命令表現を使うことができないという制約があります(例:「熱があった。それで、休みなさい」は不自然)。"},

{id:"R7-16-18", tag:"R7 試験III 問題4 問3", cat:"文法:話題転換の接続詞",
 text:"問3 文章中の下線部C「「さて」や「ところで」」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「さて」は聞き手がいない場面で独り言として話す状況でも使うことができる。","「さて」は対話で相手の話題を転換する際、後ろに命令文を使う必要がある。","「ところで」は多数に向けて一方的に話す状況では使うことができない。","「ところで」は対話で相手の話題を転換する際、後ろに疑問文が使えない。"], answer:0,
 explain:"「さて」は、聞き手の有無にかかわらず、独り言や自分の中で話題を切り替える場面でも使うことができる話題転換の表現です。"},

{id:"R7-16-19", tag:"R7 試験III 問題4 問4", cat:"文法:接続表現の硬軟・文体差の指導",
 text:"問4 文章中の下線部Dの指導に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「だって」よりも「なぜなら」のほうが軟らかい表現であると指導する。","「でも」よりも「しかしながら」のほうが硬い表現であると指導する。","普通体で書くアカデミックなレポートで「だけど」は使用できるが、「ですけど」は使用しないのがよいと指導する。","普通体で話す雑談会話で「だが」は使用できるが、「だけど」は使用しないのがよいと指導する。"], answer:1,
 explain:"「でも」は口語的でくだけた表現であるのに対し、「しかしながら」は文章語的で改まった硬い表現です。「なぜなら」は「だって」よりも硬い表現であり、アカデミックなレポートでは「だけど」のようなくだけた表現自体がふさわしくなく、雑談では「だが」よりも「だけど」のほうが自然であるため、他の記述は不適当です。"},

{id:"R7-16-20", tag:"R7 試験III 問題4 問5", cat:"文法:「だから」と「それなら」の使い分け",
 text:"問5 文章中の下線部Eに関して、先行部と後続部の関係に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「原因・理由」と「帰結」という関係を表現したいときは、「だから」を用いる。","「条件」と「帰結」という関係を表現したいときは、「だから」を用いる。","「予想」と「反対の結果」という関係を表現したいときは、「それなら」を用いる。","「反事実的な出来事」と「願望」という関係を表現したいときは、「それなら」を用いる。"], answer:0,
 explain:"「だから」は、先行部の内容を原因・理由として、そこから当然導かれる帰結を後続部で述べる際に用いられます。「それなら」は、先行部の内容を一種の条件・前提として捉え、それを踏まえた提案や判断を述べる際に用いられ、それぞれ表現意図が異なります。"},

/* ========= データ (令和7年度 試験III 問題5) ========= */
{id:"R7-16-21", tag:"R7 試験III 問題5 問1", cat:"作文指導:課題設定の問題点",
 text:"海外の日本語教育機関で日本語教師をしているX先生は、今学期、中級の作文コースを担当した。次の二つの資料を読み、後の問い(問1〜5)に答えよ。<資料1>はコースの概要、<資料2>は<資料1>の⑦で学習者が清書した作文の一部である。\n\n<資料1> コースの概要\n目標レベル:CEFR B1レベル\nコースの目標(毎回の作文課題で扱う):・自分が経験したことや、関心のある身近な話題について、詳しく書くことができる。・結束性を持ったまとまりのある文章を書くことができる。・ジャンルや読み手に合わせた文章を書くことができる。\n授業時間:各90分×12回\n学習者:15名\n活動の流れ\n書く前(第1回):①課題の提示(課題:最近参加した活動や、体験した出来事について、400字程度で詳しく書く。)②モデル作文の提示 ③書くための準備(思考マップを作成させる。)\n宿題:④下書き\n書く(第2回):⑤推敲(ピア・レスポンスをさせる。各自で書き直しをさせる。)⑥教師によるフィードバック\n宿題:⑦清書\n書いた後(第3回):⑧教師による評価\n\n問1 <資料1>の下線部Aは、このコースの「目標レベル」「コースの目標」に照らし合わせると、どのような問題があるか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["目標とする言語活動と合致しておらず、目標達成に向けた学習ができない。","文章の種類が指定されておらず、読み手に意識が向きにくい。","字数が400字程度であるため、まとまりのある文章を作ることが難しい。","CEFRのB1レベルより難易度が低いため、目標レベルに合った学習ができない。"], answer:1,
 explain:"コースの目標には「ジャンルや読み手に合わせた文章を書く」ことが含まれていますが、課題の指示では文章の種類(ジャンル)が指定されておらず、学習者が読み手を意識して書く練習にはなりにくいという問題があります。"},

{id:"R7-16-22", tag:"R7 試験III 問題5 問2", cat:"作文指導:思考マップの作成方法",
 text:"問2 <資料1>の下線部B「思考マップ」の作成方法に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["作文に書きたい事柄に限定せず、頭に思い浮かんだ事柄を書き込む。","感想や心情は含めず、起こった出来事など客観的な事柄を書き込む。","ほかの人のアイデアは含めず、一人で作成に取り組む。","絵や図は描き入れず、短い文や語句によって作成する。"], answer:0,
 explain:"思考マップ(マインドマップ)は、作文に実際に使うかどうかにかかわらず、頭に思い浮かんだ事柄を自由に書き出すブレインストーミング的な手法で作成するのが一般的です。感想や心情も含めてよく、絵や図を用いることも一般的な作成方法の一つです。"},

{id:"R7-16-23", tag:"R7 試験III 問題5 問3", cat:"作文指導:ピア・レスポンスの留意点",
 text:"問3 <資料1>の下線部Cの際の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["まず作文の直したほうがよいところを指摘させ、話し合いの論点を明確にする。","主観的な感想ではなく、客観的かつ一般的な視点からコメントをさせる。","学習者のタイプや学習進度を考慮し、教師がグループ編成を行う。","作文についての話し合いは日本語でさせ、母語の使用を制限する。"], answer:2,
 explain:"ピア・レスポンスの効果を高めるためには、学習者同士の相性やレベル差などを考慮して、教師が意図的にグループ編成を行うことが有効な留意点です。批判的な指摘を先に求めたり、コメントを客観的な視点に限定したり、母語の使用を一律に制限したりすることは、必ずしも適切な留意点とは言えません。"},

{id:"R7-16-24", tag:"R7 試験III 問題5 問4", cat:"作文指導:教師フィードバックの留意点",
 text:"問4 <資料1>の下線部D「教師によるフィードバック」の際の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["誤りの説明は学習者のレベルに合った日本語で簡潔に書き、学習意欲を低下させないようにする。","内容面に関するフィードバックは抽象的なコメントにとどめ、学習者が自己修正しやすいようにする。","どの学習者に対しても添削の内容や方法を統一し、全員に公平なフィードバックを行う。","学習者の意図を本人に直接口頭で確認する必要はなく、教師の直感を重視して添削する。"], answer:0,
 explain:"フィードバックは、学習者が理解でき、かつ学習意欲を損なわないよう、レベルに合った平易な言葉で簡潔に伝えることが重要な留意点です。"},

{id:"R7-16-25", tag:"R7 試験III 問題5 問5", cat:"作文指導:学習者の課題に応じた練習",
 text:"問5 <資料2>の作文を、このコースの「目標レベル」「コースの目標」に照らし合わせると、この作文を書いた学習者にはさらにどのような練習をさせるのがよいか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["テンスに誤りのある文章を素材とし、間違っている部分を直す練習","視点が不統一な表現を含む文章を素材とし、書き手の視点から書き直す練習","呼応表現が適切に使われていない文章を素材とし、不適切な表現を直す練習","単文と接続詞で書かれた文章を素材とし、複文を適切に使って書き直す練習"], answer:3,
 explain:"<資料2>の作文は、「だから」「でも」といった接続詞でつながれた単文が多く並ぶ素朴な文体になっています。結束性のあるまとまった文章を書けるようにするため、単文を複文に組み替える練習が有効です。"},

/* ========= データ (令和7年度 試験III 問題6) ========= */
{id:"R7-16-26", tag:"R7 試験III 問題6 問1", cat:"聴解指導:授業目標の設定",
 text:"ある大学で、X先生が聴解の授業を初めて実施した。次の二つの資料を読み、後の問い(問1〜5)に答えよ。<資料1>は授業の概要、<資料2>はX先生が授業後に記した振り返りのメモである。\n\n<資料1> 授業の概要\n学習者:ビジネスを専攻する留学生10名\n授業目標:(ア)(CEFR B2レベル)\n授業時間:90分×1コマ\n教材:ビジネス・コミュニケーションについての講義映像の一部\n授業の流れ\n前作業:(1)講義のテーマについて知っていることを話し合わせる。(2)聴解問題を与え、聞き取りの目的を意識させる。\n本作業:(1)1回目の聞き取りを行う。(2)自分の理解をモニターさせる。(3)2回目の聞き取りを行う。(4)前作業で与えられた聴解問題の答えについてピア活動としてペアで話し合う機会を設ける。(5)3回目の聞き取りを行い、答えを確認する。\n後作業:聞いた内容についてディスカッションさせる。\n\n<資料2> X先生が授業後に記した振り返りのメモ\n映像の内容は学生たちの関心に合っていたようだ。それにしても、ほかの先生方はどうやって聞く力の評価をしているんだろう。今度聞いてみよう。今日は講義の映像だったけど、もうすぐ会話の聞き取りもするし、会話のための聴解の指導について学ぶべきことがまだまだあるな。\n\n問1 <資料1>の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["身近なテーマで構成が明確な講義の主要点が理解できる。","かなり長い高度な内容の講義を聞いて含意を含めて理解できる。","どのようなテーマの講義でも内容が容易に理解できる。","自分の専門分野に関する複雑な講義の要点が理解できる。"], answer:3,
 explain:"CEFRのB2レベルの聴解記述文には、自分の専門分野に関連する複雑な内容の講義や議論の要点を理解できる、という趣旨の記述があり、ビジネスを専攻する学習者向けの授業目標として最も適当です。"},

{id:"R7-16-27", tag:"R7 試験III 問題6 問2", cat:"聴解指導:前作業の目的",
 text:"問2 <資料1>の下線部Aの目的として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["本作業で聞く音声のイントネーションやアクセントの学習効果を上げる。","本作業で聞くテキストで使われる言語形式に学習者の注意を向けさせる。","本作業に向けて学習者の不安やストレスを取り除き、安定した学習環境を作り出す。","本作業に向けて学習者が持っている知識を引き出し、聞く内容を予測しやすくする。"], answer:3,
 explain:"講義のテーマについて知っていることを話し合わせる前作業は、学習者の背景知識(スキーマ)を活性化し、これから聞く内容を予測しやすくすることを目的としています。"},

{id:"R7-16-28", tag:"R7 試験III 問題6 問3", cat:"聴解指導:ピア活動の効果",
 text:"問3 <資料1>の下線部B「ピア活動としてペアで話し合う」ことがもたらす効果として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者は自分の意見を人に説明することで、思考を整理することができる。","理解の過程を共有し、学習者同士で聴解ストラテジーを学ぶことができる。","個々の学習者の学習状況が可視化され、教師から効果的な支援が得られる。","学習者の間で共通する経験や背景を活用し、教師からは得にくい知識が得られる。"], answer:2,
 explain:"「個々の学習者の学習状況が可視化され、教師から効果的な支援が得られる」というのは、教師の指導にとっての利点であり、ピア活動そのものが学習者にもたらす直接的な効果とは言えないため、不適当です。"},

{id:"R7-16-29", tag:"R7 試験III 問題6 問4", cat:"聴解指導:聞く力の評価方法",
 text:"問4 <資料2>の下線部C「聞く力の評価」に関して、評価の方法とその特徴の組合せのうち最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["評価の方法:再生 / 特徴:記憶が結果に影響せず、各学習者が文章の内容をどの程度理解できたかを評価できる。","評価の方法:自己評価表 / 特徴:結果を相対化せず、各学習者が聞き取りに関する目標をどの程度達成できたかを評価できる。","評価の方法:多肢選択式テスト / 特徴:偶然に左右されず、何を聞き取ったかを正確に評価できる。","評価の方法:ディクテーション / 特徴:文法能力や書く力に左右されず、何を聞き取ったかを細かく評価できる。"], answer:1,
 explain:"自己評価表は、他の学習者との比較(相対化)によらず、各学習者が自分自身の聞き取りの目標をどの程度達成できたかを内省的に評価できる方法です。再生は記憶力に、多肢選択式テストは偶然の正解に、ディクテーションは文法・表記の能力に、それぞれ結果が左右されやすいため、他の記述は不適当です。"},

{id:"R7-16-30", tag:"R7 試験III 問題6 問5", cat:"聴解指導:会話のための聴解",
 text:"問5 <資料2>の下線部D「会話のための聴解の指導」の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["会話中に話し手に働きかけながら理解する力を養うため、会話場面での聞き手としての行動も含めて指導する。","聞いた会話を即時に理解する力を伸ばすため、緊張度が高い状態で聴解練習ができる環境を整備する。","実生活での会話の聞き取りに有効な聴解力を養うため、トップダウン処理ではなくボトムアップ処理に絞って指導する。","音韻知覚能力を伸ばすため、様々な人の会話より特定の人同士の会話を繰り返し聞かせる。"], answer:0,
 explain:"会話のための聴解は、一方的に聞くだけの講義理解とは異なり、相づちや聞き返しなど、聞き手として会話に積極的に参加する行動も含めて指導することが重要な留意点です。"},

/* ========= データ (令和7年度 試験III 問題7) ========= */
{id:"R7-16-31", tag:"R7 試験III 問題7 問1", cat:"会話指導:初級スピーキング指導",
 text:"日本語学校で働くX先生が、同僚のY先生に、参加した勉強会について話している。\n\nX先生:この前、日本語教育の勉強会に行ってきたんだ。\nY先生:そうなの? どんな内容だったの?\nX先生:いろいろあったんだけど、特に初級のスピーキング指導が面白いなって思った。\nY先生:初級のスピーキング指導?\nX先生:うん、インタビュー活動の紹介があってね。初級ではインタビューシートを活用するといいっていう話があったよ。\nY先生:なるほど。\nX先生:ほかにはゲームの要素を取り入れた活動もあったよ。ゲームによっていろいろな種類の教室活動の形態があるって紹介されてた。それから、交渉会話と交流会話の両方を練習することがポイントなんだって。\nY先生:そうなんだ。\n\n問1 文章中の下線部A「初級のスピーキング指導」の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者が自由に話せるよう、コミュニケーションの目的を設定することは避ける。","学習者が話したい内容よりも、汎用性のある教科書のトピックを優先させる。","情報にギャップのあるタスクや、問題解決をさせるタスクを選ぶ。","授業では多様な活動を行うのではなく、文型を意識させる練習に絞る。"], answer:2,
 explain:"情報の差(インフォメーション・ギャップ)を埋めるタスクや、問題解決を目指すタスクは、学習者に実際のコミュニケーションの必要性を生み出し、初級のスピーキング指導において効果的です。"},

{id:"R7-16-32", tag:"R7 試験III 問題7 問2", cat:"会話指導:インタビューシート活用の効果",
 text:"問2 文章中の下線部B「インタビューシートを活用する」効果として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者が簡単な質問から複雑な質問へと流れを作ることができる。","学習者が自然な繰り返しや聞き直し、相づちを使用して質問できる。","学習者が返答の際のイントネーションやリズムを意識できる。","学習者がより自発的、創造的な会話をすることが期待できる。"], answer:0,
 explain:"インタビューシートを使うことで、初級学習者でも、あらかじめ用意された簡単な質問から徐々に複雑な質問へと段階的に会話を組み立てていくことができます。"},

{id:"R7-16-33", tag:"R7 試験III 問題7 問3", cat:"会話指導:ゲーム要素を取り入れる利点",
 text:"問3 文章中の下線部C「ゲームの要素を取り入れた活動」を行う利点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["活気ある雰囲気の中で、無意識のうちにたくさん言葉を使わせることができる。","活動の展開が予測しやすくなるため、学習者に必要な支援が事前に準備できる。","心理的な負担が少なく、一人一人が自分の言葉に責任を感じなくてよい。","身振りや表情で雰囲気が分かるため、単語や表現を事前に確認しなくてよい。"], answer:0,
 explain:"ゲームの要素を取り入れることで、学習者は楽しく活気ある雰囲気の中で、プレッシャーを感じることなく無意識のうちに多くの発話をする機会を得ることができます。"},

{id:"R7-16-34", tag:"R7 試験III 問題7 問4", cat:"会話指導:教室活動の形態",
 text:"問4 文章中の下線部D「いろいろな種類の教室活動の形態」に関して、教室活動の形態を示した図と、その特徴の組合せのうち最も適当なものを、次の1〜4の中から一つ選べ。なお、Tは教師、Lは学習者、矢印はやり取りの方向を示している。",
 choices:["図:よくできる学習者を中心に教師とやり取り / 特徴:よくできる学習者を中心としながら、教師とのやり取りを進めることができる。","図:全ての学習者同士が相互に矢印でつながる / 特徴:学習者が互いの主張や意見を言い合い、複雑なやり取りをすることができる。","図:学習者から教師へ矢印が集中する / 特徴:学習者間のやり取りを増やし、発話量の偏りを軽減することができる。","図:グループごとに独立した学習者同士のやり取り / 特徴:グループごとの学習者と教師の間のやり取りを増やすことができる。"], answer:1,
 explain:"全ての学習者同士が互いに矢印でつながる形態は、参加者全員が主張や意見を言い合う、複雑で対等なやり取りを可能にする教室活動の形態です。"},

{id:"R7-16-35", tag:"R7 試験III 問題7 問5", cat:"会話指導:交流会話の練習",
 text:"問5 文章中の下線部E「交流会話」の練習の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["大学の職員との会話を想定し、次の留学生交流会の日程を調整する練習","授業で仲良くなった人との会話を想定し、漫画を返す期限を決める練習","レストランの店員との会話を想定し、料理について質問する練習","会社の同僚との会話を想定し、会議の前に世間話をする練習"], answer:3,
 explain:"会議の前の世間話は、実務的な目的を持たない、人間関係の構築や維持を目的とする交流会話(雑談)の典型例です。他の選択肢は、日程調整や期限の決定、注文のための質問など、具体的な実務的目的を持つ交渉会話の例です。"},

/* ========= データ (令和7年度 試験III 問題8) ========= */
{id:"R7-16-36", tag:"R7 試験III 問題8 問1", cat:"評価法:コミュニケーション能力とストラテジー",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\nコミュニケーション能力には、様々な定義がある。例えばカナル&スウェイン(M. Canale & M. Swain)によれば、コミュニケーション能力とは、文法能力、談話能力、社会言語能力、ストラテジー(方略的)能力により構成される能力である。これらの能力を評価する方法には、教師と学習者によるロールプレイテストや会話形式のインタビューテストなどがある。これらのテストでは、信頼性や妥当性、真正性に留意する必要がある。また、最近では、このほか社会文化的アプローチの影響を受けた評価を用いることもある。\n教育機関で評価を実施する際は、評価の目的を考えなければならない。\n\n問1 文章中の下線部A「ストラテジー(方略的)能力」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["相手の発話内の未知語を繰り返して、意味の説明を促す。","複数の接続詞を用いて、まとまりのあるスピーチをする。","文化の違いに注意を払って、言外の意味を理解する。","母語との違いに気を付けて、正確な発音をする。"], answer:0,
 explain:"ストラテジー(方略的)能力とは、コミュニケーション上の問題(語彙不足など)を補うための方策を用いる能力です。未知語の説明を相手に促す聞き返しはこの典型例です。談話能力(2)、社会言語能力(3)、文法能力(4)とは区別されます。"},

{id:"R7-16-37", tag:"R7 試験III 問題8 問2", cat:"評価法:インタビューテストの質問設計",
 text:"問2 文章中の下線部B「会話形式のインタビューテスト」に関して、初級の学習者に対して行う質問とそのねらいの組合せのうち最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["質問:今100万円あったら、何がしたいですか? / ねらい:見聞きして入手した情報を、第三者に伝えることができるか。","質問:(写真を見せて)この人の仕事は何だと思いますか? / ねらい:ある状況を仮定して、どうするか述べることができるか。","質問:大学を卒業したあとで、どんな所で働きたいですか? / ねらい:生活場面の物事について、印象や感想を述べることができるか。","質問:昨日は、休みでしたね。どんなことをしましたか? / ねらい:時系列に沿って、話すことができるか。"], answer:3,
 explain:"過去の出来事を時系列に沿って話す練習は、初級学習者に適した基本的なタスクです。仮定の話(1、2)や、将来の希望を印象・感想として述べること(3)は、初級学習者にはやや高度な組合せになっています。"},

{id:"R7-16-38", tag:"R7 試験III 問題8 問3", cat:"評価法:テストの信頼性",
 text:"問3 文章中の下線部C「信頼性」を高めるための方法として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["インタビューテストの時間を短くして実施しやすくする。","ロールプレイの設定を学習者が実際に遭遇する場面から選ぶ。","プレゼンテーションを録音しておき、後から複数の教師で聞き直す。","独話の力を評価したい場合に、スピーチではなくロールプレイをさせる。"], answer:2,
 explain:"複数の採点者が録音・録画を確認して評価することで、採点者間の評価のばらつきを減らし、テストの信頼性(採点の一貫性)を高めることができます。"},

{id:"R7-16-39", tag:"R7 試験III 問題8 問4", cat:"評価法:社会文化的アプローチの学習観",
 text:"問4 文章中の下線部D「社会文化的アプローチ」においては学習をどのように捉えているか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["スムーズに段階を追って習得していく直線的な過程","課題達成における学習者個人の能力の変化","知識の受け皿である学習者が知識を受け取る過程","互いに影響し合う他者との間に築く関係性の変化"], answer:3,
 explain:"社会文化的アプローチ(ヴィゴツキーの理論に基づく考え方)では、学習を個人の内部で完結する過程としてではなく、他者との相互作用や関係性の中で構築されていく社会的な過程として捉えます。"},

{id:"R7-16-40", tag:"R7 試験III 問題8 問5", cat:"評価法:形成的評価",
 text:"問5 文章中の下線部E「評価の目的」に関して、「形成的評価」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["修了テストを実施し、進級できるかを決める。","小テストを実施し、クラスの指導方法の有効性を確認する。","出願時に日本語能力試験の結果を提出させ、志願者を絞り込む。","これまでのレポートなどの学習成果を提出させ、クラス配置を決める。"], answer:1,
 explain:"形成的評価は、指導の過程で継続的に行い、その結果を今後の指導の改善に生かすことを目的とする評価です。小テストの結果から指導方法の有効性を確認することはこの典型例です。他の選択肢は、進級判定・選抜・クラス分けなど、ある時点での到達度を総括的に判定する総括的評価の例です。"},

/* ========= データ (令和7年度 試験III 問題9) ========= */
{id:"R7-16-41", tag:"R7 試験III 問題9 問1", cat:"異文化適応:異文化ストレス",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\nグローバル化の進展とともに人々が様々な環境に移動する機会が日常的になっている。異なる環境に移動した人は、異文化ストレスに対応しながら、周囲の人と関係を築くための能力を身に付けることが重要であるとされている。ベネット(M. Bennett)は、異文化接触における自己成長のプロセスとして、異文化感受性発達モデルを提唱した。そこでは、異文化に対する気づきの成長を6段階に分けて捉えている。\n来日する学習者の異文化適応を促進させるためには、日本語教育関係者などによる来日前後のオリエンテーションが効果的である。また、様々なソーシャル・サポートを提供することも考えられる。学習者の相談に応じる際は、アサーティブ・コミュニケーションスキルを身に付けていることが重要である。\n\n問1 文章中の下線部A「異文化ストレス」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["自然環境や気象条件の違いはストレスの原因には含まれない。","異文化におけるストレスの感じ方やその反応に個人差はない。","思考行動様式や言語の違いなどがストレスの原因となりやすい。","身近に接する自文化コミュニティが小さいほど、ストレスが緩和されやすい。"], answer:2,
 explain:"思考様式や行動様式、言語の違いは、異文化ストレスの主要な原因の一つとされています。自然環境の違いもストレス要因となり得るほか、ストレスの感じ方には個人差があり、自文化コミュニティは一般に大きいほどストレスの緩和に役立つとされるため、他の記述は不適当です。"},

{id:"R7-16-42", tag:"R7 試験III 問題9 問2", cat:"異文化適応:異文化感受性発達モデル",
 text:"問2 文章中の下線部B「異文化感受性発達モデル」に関して、次の図の(ア)と(イ)に入れるのに最も適当な組合せを、下の1〜4の中から一つ選べ。\n\n[否定・防衛・最小化・受容・適応・統合]\n(ア)主義 → (イ)主義",
 choices:["(ア)同化 (イ)多文化","(ア)多文化 (イ)同化","(ア)文化相対 (イ)自文化中心","(ア)自文化中心 (イ)文化相対"], answer:3,
 explain:"ベネットの異文化感受性発達モデルでは、「否定・防衛・最小化」は自文化中心主義的な段階、「受容・適応・統合」は文化相対主義的な段階に分類されます。"},

{id:"R7-16-43", tag:"R7 試験III 問題9 問3", cat:"異文化適応:来日前後のオリエンテーション",
 text:"問3 文章中の下線部C「来日前後のオリエンテーション」の目的として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["先輩学生から困難の対処法について聞く機会を設けるなどして不安を軽減させる。","日本滞在中に役立つ表現を日本語で大量に示すことで、語学力の向上を図る。","生活や学習に関する知識や手続き方法を紹介し、当面必要な情報を提供する。","シミュレーション・ゲームを用いるなどして異文化適応のためのスキルを教える。"], answer:1,
 explain:"来日前後のオリエンテーションの主な目的は語学力の向上そのものではなく、異文化適応を円滑にするための心構えや知識、対処スキルを身に付けさせることにあるため、語学力向上を主目的とする記述は不適当です。"},

{id:"R7-16-44", tag:"R7 試験III 問題9 問4", cat:"異文化適応:ソーシャル・サポートの機能分類",
 text:"問4 文章中の下線部D「ソーシャル・サポート」の機能の分類に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["言動が適切かつ正当であると承認することは「評価的援助」に当たる。","問題解決に役立つ忠告や助言を与えることは「行動的援助」に当たる。","課外活動で仲間を作る機会を提供することは「物質的援助」に当たる。","問題の原因についての話を傾聴することは「情報的援助」に当たる。"], answer:0,
 explain:"相手の言動を適切・正当だと認め、承認することは「評価的サポート(援助)」に分類されます。忠告や助言は「情報的援助」、仲間作りの機会提供は「情緒的援助」、傾聴自体は「情緒的援助」に分類されるのが一般的であり、他の組合せは不適当です。"},

{id:"R7-16-45", tag:"R7 試験III 問題9 問5", cat:"コミュニケーション:アサーティブスキルの種類",
 text:"問5 文章中の下線部E「アサーティブ・コミュニケーションスキル」の種類とその例の組合せのうち最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["スキルの種類:アイ・ステイトメント / 例:相手とアイコンタクトを取りながら「あなたはこう言いたいのですね。」と確認する。","スキルの種類:アクティブ・リスニング / 例:相手の話を遮らず「私はこう理解したけど正しいですか?」と確認しながら話を聞く。","スキルの種類:オープンエンド型質問 / 例:相手に負担を掛けないように「はい」か「いいえ」で答えられる質問をする。","スキルの種類:共感アサーション / 例:「私とあなたの意見はここが違いますね。」と相手と相違点を確認し合う。"], answer:1,
 explain:"アクティブ・リスニングは、相手の話を遮らずに聞き、自分の理解が正しいかを確認しながら傾聴するスキルです。アイ・ステイトメントは「私は〜と思う」のように自分を主語にして伝える技法、オープンエンド型質問は自由な返答を促す質問(はい・いいえで終わらない質問)であるため、他の組合せは不適当です。"},

/* ========= データ (令和7年度 試験III 問題10) ========= */
{id:"R7-16-46", tag:"R7 試験III 問題10 問1", cat:"教授法史:制限作文アプローチ",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n外国語教授法には様々なものがある。1950年代には、オーディオ・リンガル・アプローチ(メソッド)や、技能別指導方法としての制限作文アプローチが提案された。これらのアプローチには母語と目標言語との関係を探る対照分析が影響を与えた。また、行動主義心理学による言語学習観も関与している。その後、1970年頃にはコンプリヘンション・アプローチが登場した。\n教授法の変遷には、学習者の言語発達の過程や中間言語を長期的に観察したり、誤りを詳細に分析したりする研究手法の発展が寄与している。その中で、言語習得は右肩上がりの一直線を描くような形では進まず、第二言語でも第一言語と同じくU字型のカーブで表されるプロセスを経ることが明らかになった。\n\n問1 文章中の下線部A「制限作文アプローチ」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["目標言語で書かれた作文の段落構成や文の構造を分析し、それをモデルに自分の作文を書かせる指導法","作文のプランを練り直しながら、常に新しい考えを取り入れて創造的に目標言語で作文を書かせる指導法","既に口頭練習で身に付けた目標言語の文型や語彙を使って、文法的に正しい文を書けるようにする指導法","学習者が目標言語で書いたものを媒介に、教師とやり取りしながら相互理解を深めていく指導法"], answer:2,
 explain:"制限作文アプローチは、オーディオリンガル・メソッドの流れを汲み、口頭練習で既に習得した文型・語彙の範囲内で、文法的に正しい文を書く練習をさせる、統制された作文指導法です。"},

{id:"R7-16-47", tag:"R7 試験III 問題10 問2", cat:"第二言語習得史:対照分析",
 text:"問2 文章中の下線部B「対照分析」の背景にある考え方として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["第二言語を習得する速度は母語と同様に情緒的要因に影響される。","母語と目標言語を比較することで第二言語習得における困難度が予想できる。","第二言語学習者には母語習得の子どもと同様の言語上の間違いは見られない。","目標言語の発音には第二言語学習者の母語の影響は表れにくい。"], answer:1,
 explain:"対照分析仮説は、母語と目標言語の構造を比較することで、両者の相違点が学習者にとっての習得の困難点(誤りの生じやすい箇所)を予測できるという考え方に基づいています。"},

{id:"R7-16-48", tag:"R7 試験III 問題10 問3", cat:"第二言語習得:行動主義の刺激と強化",
 text:"問3 文章中の下線部C「行動主義心理学による言語学習観」に関して、次の母語習得の状況において見られる、「行動主義心理学」における「刺激」と「強化」の組合せのうち最も適当なものを、下の1〜4の中から一つ選べ。\n\n母親が幼児と歩いていると、犬の散歩をしている人とすれ違った。幼児がその犬を見て指さしながら「ワンワンだ!」と言うのを聞いて、母親はうなずき幼児の頭をなでながら「そうね、ワンワンね。」と返した。その様子を見た犬を連れた人は、ほほえみながら、母親に「お子さん、おいくつですか?」と尋ねた。",
 choices:["「刺激」:犬 / 「強化」:母親の動作と発話","「刺激」:犬を連れた人 / 「強化」:幼児の動作と発話","「刺激」:幼児の動作と発話 / 「強化」:犬を連れた人の動作と発話","「刺激」:母親の動作と発話 / 「強化」:幼児の動作と発話"], answer:0,
 explain:"幼児は「犬」という刺激を見て「ワンワンだ」と発話し、それに対する母親のうなずきと発話が、その言語行動を強化しています。"},

{id:"R7-16-49", tag:"R7 試験III 問題10 問4", cat:"教授法:コンプリヘンション・アプローチ",
 text:"問4 文章中の下線部D「コンプリヘンション・アプローチ」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["母語習得過程の知見を取り入れ、第二言語を自然に吸収できるよう、学習者にとって理解可能な使用例をたくさん与える。","子どもの言語発達過程と同様に、聞くことを優先する沈黙期間があると仮定し、学習者が自ら発話するまで教師は待つ。","言語習得は理解を通じて促進されるという考えに基づき、話す・書く練習よりも聞く・読む練習を重点的に行わせる。","文型や語彙が自動的に口から出てくるようになるまで、目標言語の発話の聞き取り、模倣、反復を行わせる。"], answer:3,
 explain:"聞き取り・模倣・反復によって文型や語彙を自動化させるという考え方は、オーディオリンガル・メソッドに特徴的な指導法です。理解可能なインプットを重視し、発話を強制せず沈黙期間を認めるコンプリヘンション・アプローチの特徴とは相容れないため、不適当です。"},

{id:"R7-16-50", tag:"R7 試験III 問題10 問5", cat:"第二言語習得:U字型発達",
 text:"問5 文章中の下線部Eに関して、次の図におけるU字型の底から上昇に向かうXの時期に第一言語においても第二言語においても起こる「事象」として最も適当なものを、下の1〜4の中から一つ選べ。\n\n(図:縦軸「言語産出の正確さ」、横軸「時間軸」、U字型のカーブでXは底から上昇に向かう区間を示す)",
 choices:["誤用が産出されていても、頭の中では言語規則を理解するための認知的な活動は継続しており、やがて正確な使用が増える。","アウトプットよりインプットに多く接することで、より効率的に否定証拠を得ることができ、やがて正確な使用が増える。","言語学習・発達が停滞し誤用の定着化が見られるが、時間の経過とともに誤用は減っていき、やがて正確な使用が増える。","誤用に対する心理的負担を軽減する工夫をすることで、人間に備わっている言語獲得装置が作動し、やがて正確な使用が増える。"], answer:0,
 explain:"U字型発達では、一見正確だった初期の産出から一時的に誤用が増える(底の部分)ものの、その間も学習者の頭の中では規則を再構築するための認知的な処理が進んでおり、それが土台となってやがて正確さが回復していくと説明されます。"},

/* ========= データ (令和7年度 試験III 問題11) ========= */
{id:"R7-16-51", tag:"R7 試験III 問題11 問1", cat:"第二言語習得:学習環境の要因",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n第二言語習得研究において、習得に関わる様々な要因が指摘されている。その一つに、学習環境の違いがある。学習環境には、「自然習得環境」と「教室習得環境」という分け方がある。また、「外国語環境」か「第二言語環境」か、という観点もある。ほかにも習得に関わる要因として、学習者の母語と目標言語の言語間距離があることも明らかになっている。第二言語の指導において、教師はティーチャー・トークを用いることが多い。また、学習者の誤りに対してはリキャストなどの方法でフィードバックを行っている。このような教師の学習者への働きかけも、第二言語の習得に関わることが指摘されている。\n\n問1 文章中の下線部A「自然習得環境」に関して、教室習得環境と比べたときの特徴として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["教室習得環境と比べて、正確さよりも意味の伝達が優先されることが多い。","教室習得環境と比べて、調整された表現で話し掛けられることが多い。","教室習得環境と比べて、発話に含まれる誤りを頻繁に訂正される。","教室習得環境と比べて、目標言語に触れる時間は限定される。"], answer:0,
 explain:"自然習得環境では、実際のコミュニケーションの中で言語を習得するため、文法的な正確さよりも意味が伝わることが重視される傾向があります。調整された表現、頻繁な誤り訂正、限定的な接触時間は、むしろ教室習得環境の特徴に近いものです。"},

{id:"R7-16-52", tag:"R7 試験III 問題11 問2", cat:"第二言語習得:第二言語環境",
 text:"問2 文章中の下線部B「第二言語環境」に関して、外国語環境と比べたときの特徴として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["外国語環境と比べて、学習言語での会話相手の範囲は限定的である。","外国語環境と比べて、習得が早くなる学習項目がある。","外国語環境と比べて、教師が媒介言語を用いる頻度が多い。","外国語環境と比べて、真正性の高いインプットが少ない。"], answer:1,
 explain:"目標言語が日常的に使われている第二言語環境では、外国語環境に比べて特定の学習項目の習得が促進されることが指摘されています。会話相手の範囲、媒介言語の使用頻度、インプットの真正性については、いずれも第二言語環境のほうが有利になる傾向があるため、他の記述は不適当です。"},

{id:"R7-16-53", tag:"R7 試験III 問題11 問3", cat:"第二言語習得:言語間距離",
 text:"問3 文章中の下線部C「学習者の母語と目標言語の言語間距離」が近い場合に起こる現象として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["目標言語を学び始めた段階では母語の知識の影響を受けにくい。","目標言語の談話の構成や展開においては母語の影響が表れにくい。","母語への直訳に頼る方法では正の転移は起こりにくい。","母語と目標言語の細かなルールの違いによる誤りが直りにくい。"], answer:3,
 explain:"母語と目標言語が近い場合、学習者は両者を安易に同一視しやすく、細部の違いに気づきにくいため、そうした違いに起因する誤りが定着し、直りにくくなることがあります。"},

{id:"R7-16-54", tag:"R7 試験III 問題11 問4", cat:"教室談話:ティーチャー・トーク",
 text:"問4 文章中の下線部D「ティーチャー・トーク」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["習得に必要とされる自然な言語表現が多く含まれている。","練習の中で、教師が答えを知っている質問が多用される。","縮約形など話し言葉が多用され、自然な速さが保たれている。","意味交渉を引き起こすことが多く、習得に有効に作用する。"], answer:1,
 explain:"ティーチャー・トークでは、学習者の理解度を確認するために、教師が既に答えを知っている質問(display question)が多用される特徴があります。一方、自然な言語表現や話し言葉的な縮約形は控えめにされ、単純化・明確化された話し方になる傾向があります。"},

{id:"R7-16-55", tag:"R7 試験III 問題11 問5", cat:"第二言語習得:リキャスト",
 text:"問5 文章中の下線部E「リキャスト」の例として、次の(ア)に入れるのに最も適当なものを、下の1〜4の中から一つ選べ。\n\n学習者:昨日は寒いでした。\n教師:(ア)",
 choices:["寒いでした?","あ、そうですか。寒かったですか。","「寒かったです」ですね。","「寒いでした」じゃありませんね?"], answer:1,
 explain:"リキャストは、学習者の誤用を含む発話を、明示的に訂正することなく、正しい形に言い直して自然に会話の中で返す訂正方法です。「寒かったですか」と、正しい形を使いながら自然に会話を続ける応答はこの典型例です。"},

/* ========= データ (令和7年度 試験III 問題12) ========= */
{id:"R7-16-56", tag:"R7 試験III 問題12 問1", cat:"社会言語学:若者語",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n言葉には、状況や話し手の属性による様々な変種がある。例えば、特定の世代に使用されるものに若者語がある。専門用語は、状況に応じて使われる変種である。\nまた、コミュニケーションにおけるスタイルにも様々なものがある。会話スタイルには「共話」と「対話」という区別があり、日本語は「共話」的な要素が強いと言われている。さらに、同一言語内のスタイルの選択だけでなく、複数言語間でコード・スイッチングも行われる。これらの現象には複数の要因が関わっており、心理的な要因はアコモデーション理論の中で説明される。日本語の会話の授業においても、言葉の使い分けを指導する必要がある。\n\n問1 文章中の下線部A「若者語」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["現在の若者が数十年の間使い続け、次世代の若者にも広がり得る。","若者が自分より上の年齢層の人に若者文化を伝える過程で生じる。","若者以外の年齢層の人にも意味が通じやすい一般的な語が多い。","高年層の人が若者に対して話し掛ける際に使われるようになった。"], answer:0,
 explain:"若者語の中には、その世代が年齢を重ねても使い続け、結果として次の世代の若者にも取り入れられて広がっていくものがあります。若者語は本来、若者以外には意味が通じにくい、若者が自ら生み出す語であるため、他の記述は不適当です。"},

{id:"R7-16-57", tag:"R7 試験III 問題12 問2", cat:"社会言語学:専門用語と一般用語",
 text:"問2 文章中の下線部B「専門用語」に関して、専門用語と対応する一般用語の組合せのうち最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["専門用語:先生 / 一般用語:教諭","専門用語:血 / 一般用語:血液","専門用語:虫垂炎 / 一般用語:盲腸","専門用語:留年 / 一般用語:落第"], answer:2,
 explain:"「虫垂炎」は医学の専門用語、「盲腸」はそれに対応する一般に広く使われる俗称です。他の組合せは、専門用語と一般用語という関係になっていない(「教諭」はむしろ専門的な職名、「血液」は「血」より硬い一般語、「落第」も専門用語ではない)ため、不適当です。"},

{id:"R7-16-58", tag:"R7 試験III 問題12 問3", cat:"会話分析:共話的発話",
 text:"問3 文章中の下線部Cに関して、次の会話文中の下線部①〜④のうち、共話的な発話として不適当なものを、下の1〜4の中から一つ選べ。\n\nX:うちの子、最近カレーパンにはまってて、すごい食べるんだけど。\nY:①うんうん。\nX:この間も、パンをいろいろ買って帰ったらさ。\nY:②あ、カレーパンばっかり食べたの?\nX:そうなの。ほかのパンは全然食べないでさ、カレーパンだけ全部食べちゃったんだ。\nY:え、全部?③それ見てどう思ったの?\nX:そりゃもう。\nY:④心配になっちゃうわよね。",
 choices:["①","②","③","④"], answer:2,
 explain:"③「それ見てどう思ったの?」は、相手(X)自身の独立した意見・感想を尋ねる発話であり、話し手の発話を先取りして補ったり共感的に受け止めたりする「共話」的な発話というよりも、別々の視点を交換する「対話」的な発話に近いため、共話の例としては不適当です。"},

{id:"R7-16-59", tag:"R7 試験III 問題12 問4", cat:"社会言語学:会話的コード・スイッチング",
 text:"問4 文章中の下線部D「コード・スイッチング」のうち、「会話的コード・スイッチング」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["言いたいことを十分に表すために複数の言語が織り交ぜて使用される。","自集団の人と話すときに親密さを示すために集団固有の言語が使用される。","話している場面や聞き手の言語能力に合わせるために使用言語が選択される。","参加者が複数いる場で語り掛ける相手を特定するために使用言語が選択される。"], answer:2,
 explain:"会話的(状況的)コード・スイッチングは、話している場面や相手の言語能力といった状況的な要因に応じて使用言語を切り替える現象を指します。"},

{id:"R7-16-60", tag:"R7 試験III 問題12 問5", cat:"社会言語学:アコモデーション理論(コンバージェンス)",
 text:"問5 文章中の下線部E「アコモデーション理論」のうち、「コンバージェンス」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["外国人観光客が土産店の店員に対して、おまけを付けてもらえるように外国人アクセントを強調した日本語を話す。","博物館で学芸員がアルバイトスタッフに対して、威厳を示すために命令表現を使って指示を出す。","デパートの店員が迷子になっている幼児に対して、気持ちが落ち着くように育児語で話し掛ける。","東京に出張に来た関西出身者がホテルのスタッフに対して、要望を言い尽くすために関西の方言で説明する。"], answer:2,
 explain:"コンバージェンスは、相手に対する好意や配慮から、自分の話し方を相手の話し方に近づける現象です。幼児の気持ちに寄り添うために育児語を使う例はこれに当たります。他の選択肢は、あえて相手と話し方を異ならせるダイバージェンスや、単なる方言の使用の例です。"},

/* ========= データ (令和7年度 試験III 問題13) ========= */
{id:"R7-16-61", tag:"R7 試験III 問題13 問1", cat:"語用論:誤解の要因(音の聞き間違い)",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\nコミュニケーションにおける誤解は、様々な要因で生じる。まず、音の聞き間違いが原因で生じる誤解が挙げられる。統語レベルでの多義性が誤解の原因になることもある。例えば、主語と述語をどう対応付けるかによって複数の意味で解釈が可能な発話では、誤解が起こりやすい。\n誤解が起こらないようにするために、留意するとよいことがいくつかある。例えば、会話の公理(グライス(H. P. Grice))に違反した返答があった際には言外の意味に注意するとよい。また、発話の意図にも注意する必要がある。日本語教育においては、誤解の事例を用いたケース学習を行うことも効果的であろう。\n\n問1 文章中の下線部A「音の聞き間違いが原因で生じる誤解」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「もうすぐ着くよ。」と兄に言われたが、40分待たされた。","「7時に電話して。」と部下に言ったら、1時に電話してきた。","「無色ですか?」と眼鏡屋さんに言われて、無職ではないと言い返した。","「あの本、貸して?」と友人に頼んだら、期待と違う本を貸してくれた。"], answer:1,
 explain:"「7時(しちじ)」と「1時(いちじ)」は音が似ているため、聞き間違いが生じやすい例です。他の選択肢は、聞き間違いではなく、期待とのずれや同音異義語の解釈違いなど、別の要因による誤解の例です。"},

{id:"R7-16-62", tag:"R7 試験III 問題13 問2", cat:"文法論:主語述語の対応による多義性",
 text:"問2 文章中の下線部Bの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「母が祖母と父が出かけたあとで帰ってきたようです。」","「私は日本語をはやく読めるようになりたくて毎日たくさん勉強しています。」","「私と友達は大きな犬の鳴き声を聞いてびっくりしてしまいました。」","「佐藤さん、昨日鈴木さんは急いで昼ご飯を食べなかったそうですよ。」"], answer:0,
 explain:"「母が祖母と父が出かけたあとで帰ってきたようです」は、「母が(祖母と父が出かけたあとで)帰ってきた」のか、「(母が祖母と)父が出かけたあとで帰ってきた」のか、主語と述語の対応関係によって複数の解釈が可能な、統語的多義性を持つ文です。"},

{id:"R7-16-63", tag:"R7 試験III 問題13 問3", cat:"語用論:会話の公理違反",
 text:"問3 文章中の下線部Cに関して、会話の公理に違反した返答と、違反している公理の組合せのうち最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["返答:X「どちらへお出かけですか?」Y「ちょっとそこら辺まで。」 / 違反している公理:量の公理","返答:X「映画は何時からですか?」Y「夜ですよ。」 / 違反している公理:質の公理","返答:X「宿題が終わったから、ゲームをしてもいい?」Y「今から塾があるでしょう。」 / 違反している公理:関係の公理","返答:X「お子さん、立派に成人されてもう安心ですね。」Y「いや、子どもは子どもですよ。」 / 違反している公理:様態の公理"], answer:0,
 explain:"「どちらへお出かけですか?」に対して「ちょっとそこら辺まで」と曖昧に答えるのは、求められている情報の詳しさに対して情報が不十分であり、必要な情報量を提供すべきとする「量の公理」への違反の例です。"},

{id:"R7-16-64", tag:"R7 試験III 問題13 問4", cat:"語用論:発話意図の解釈手掛かり",
 text:"問4 文章中の下線部D「発話の意図」に関して、次の会話の下線部の発話は命題と発話意図が異なっている。その発話意図を解釈する際の手掛かりとして最も適当なものを、下の1〜4の中から一つ選べ。\n\n部下:課長、ちょっと…。\n上司:田中さん、どうしたの?\n部下:打合せの書類、締切りに間に合いそうになくて…。\n上司:え。締切日は、今日って分かっていたんだよね。\n部下:はい、分かっておりました。\n上司:昨日何してたの?\n部下:えっと、別件で対応しなければならないことがあって…。\n上司:参ったな。田中さんは本当にお忙しいんですね。",
 choices:["対称詞","副詞","敬語","終助詞"], answer:2,
 explain:"上司の最後の発話「田中さんは本当にお忙しいんですね」は、丁寧な敬語を用いながらも、文脈上は皮肉として部下を軽くとがめる意図を持っています。この場面にそぐわない改まった敬語の使用が、字義通りの意味とは異なる発話意図(皮肉)を解釈する手掛かりとなっています。"},

{id:"R7-16-65", tag:"R7 試験III 問題13 問5", cat:"教授法:誤解の事例を用いたケース学習",
 text:"問5 文章中の下線部E「誤解の事例を用いたケース学習」において、活動を進める際の教師の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["誤解の解決方法について、繰り返し話し合いの機会を設け、学習者に統一の見解を持たせる。","誤解の解決方法について、教師は最後に自分の意見を正解として述べ、学習者を安心させる。","誤解の原因について、学習者が自身の考えを深められるよう、終始個人作業を行わせる。","誤解の原因について、学習者が他者との討論を通じて自分の答えを考えることが重要だと理解させる。"], answer:3,
 explain:"ケース学習では、唯一の正解を教師が示すのではなく、学習者同士の討論を通じて多様な視点から考え、自分なりの答えを見いだしていくプロセスそのものを重視することが重要な留意点です。"},

/* ========= データ (令和7年度 試験III 問題14) ========= */
{id:"R7-16-66", tag:"R7 試験III 問題14 問1", cat:"年少者日本語教育:加算的バイリンガル",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n近年、日本では外国につながる子どもが増えている。このうち、バイリンガルの子どもは言語発達の状態が様々である。日本語を母語としない子どもには、ダブル・リミテッドの状態が見られることがある。このような言語的背景や生活環境などは、子どものアイデンティティの形成に影響する。学校生活においては、子どもの日本語能力を評価する方法として「外国人児童生徒のためのJSL対話型アセスメント(DLA)」(平成26年発行版)が長らく活用されてきた。\nほかにも、外国人保護者への支援も必要である。「日本語教育の参照枠」(文化庁)の一分野である「生活Can do」には、子育てや教育に関わる記述文も示されている。しかし、外国人保護者が単独で行うには難しい活動もあるため、日本語教師が外国人保護者と地域社会の仲介者となることも想定される。\n\n問1 文章中の下線部A「バイリンガル」に関して、「加算的バイリンガル」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本語を母語としない高校生が日本へ来て日本語を習得し、二言語話者になった。","母語の異なる両親を持つ子どもが、親からそれぞれの言語を聞いて育ち、二言語を習得した。","母語を習得してから来日した高校生が、母語の力は衰えたが日本語を習得した。","日本語を母語としない子どもが日本で生活し、親からの母語での問い掛けに対して常に日本語で応答するようになった。"], answer:0,
 explain:"加算的バイリンガリズムは、既に習得している母語の力を保持したまま、新たに第二言語を追加で習得していく状態を指します。母語の力が衰える(3)場合や、母語使用の機会が失われていく(4)場合は、むしろ減算的バイリンガリズムに近い状態です。"},

{id:"R7-16-67", tag:"R7 試験III 問題14 問2", cat:"年少者日本語教育:ダブル・リミテッド",
 text:"問2 文章中の下線部B「ダブル・リミテッド」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["母文化と日本文化のどちらにも否定的な態度を示している。","母文化と日本文化のどちらに帰属しているか自覚できない。","母語と日本語のどちらとも異なる中間的な言語を使っている。","母語と日本語の能力がどちらも年齢相応のレベルまで達していない。"], answer:3,
 explain:"ダブル・リミテッド(二重限定的言語能力)とは、母語と第二言語(日本語)のいずれについても、年齢相応の言語能力の水準に達していない状態を指します。"},

{id:"R7-16-68", tag:"R7 試験III 問題14 問3", cat:"年少者日本語教育:子どものアイデンティティ",
 text:"問3 文章中の下線部C「子どものアイデンティティ」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学童期の心理的葛藤を経て、思春期頃に確立される。","生活環境によって複数形成され、場面に応じて使い分けられる。","生得的なもので、親の使用言語から影響を受けることなく形成される。","言語に対する子どもの意識とは無関係に、家庭の教育方針に基づき決定される。"], answer:1,
 explain:"複数の文化的背景を持つ子どものアイデンティティは、単一で固定的なものではなく、生活する複数の環境に応じて多様に形成され、場面によって使い分けられる複合的なものであるとされています。"},

{id:"R7-16-69", tag:"R7 試験III 問題14 問4", cat:"評価法:JSL対話型アセスメント(DLA)",
 text:"問4 文章中の下線部D「外国人児童生徒のためのJSL対話型アセスメント」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["言語能力を対話によって観察し、学習支援に必要な情報を得る。","設定した言語レベルにどの程度到達したかを、対話によって測定する。","対話では母文化や年齢の影響が少ない質問をしながら、会話力を正確に測る。","対話で答えられない質問にはすぐに答えを与え、心理的負担を軽減する。"], answer:0,
 explain:"DLAは、子どもとの対話を通してその言語能力の実態を把握し、その後の学習支援に必要な情報を得ることを目的とした、診断的・支援的な性格の強いアセスメントです。基準に基づく到達度判定を主目的とするテストとは性格が異なります。"},

{id:"R7-16-70", tag:"R7 試験III 問題14 問5", cat:"日本語教育政策:生活Can do",
 text:"問5 文章中の下線部Eに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["各記述文が学習目標として提示され、達成するための学習方法も示されている。","理想的な子育てができるよう、日本人の規範的な言語行動をモデルにしている。","外国人保護者が実際に遭遇する場面や生活上の行為が、具体的に示されている。","子の出生から大学卒業時まで、保護者が必要とする生活上の行為が網羅されている。"], answer:2,
 explain:"「生活Can do」は、外国人が実際の生活の中で遭遇する具体的な場面や行為をもとに記述されたCan doステートメント(能力記述文)です。学習方法の提示や、日本人をモデルとした規範的行動の提示、全ライフステージの網羅を目的とするものではないため、他の記述は不適当です。"},

/* ========= データ (令和7年度 試験III 問題15) ========= */
{id:"R7-16-71", tag:"R7 試験III 問題15 問1", cat:"多文化共生:世界の人口事情",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本における在留外国人施策は、経済状況や労働人口の増減と無関係ではない。例えば、「技能実習」や「特定技能」の在留資格を持つ外国人の主要な送り出し国にインドネシアやベトナムがあるように、人の移動を考えるうえでは日本の人口問題だけでなく、世界の人口事情についても知っておく必要がある。\n日本国内では、1989年の「出入国管理及び難民認定法」の改正により、「定住者」の在留資格を持つ日系人の就労者が増え、日系人の集住地域に特徴的な状況が生まれた。近年、外国人労働者への依存度は高まっており、資格外活動として留学生がアルバイトに従事することもある。\n外国人労働者が増加するにつれ、日本語教育環境の整備の必要性が認識され、2019年に「日本語教育の推進に関する法律」が公布・施行された。日本語教育をめぐる動きが活発化する中、日本語教師のキャリアパスの一つとして海外派遣プログラムへの関心が高まっている。\n\n問1 文章中の下線部A「世界の人口事情」に関して、総務省統計局による人口推計(2023年(令和5年)10月1日現在)に記載されている日本と諸外国の人口の動向として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本はインドネシアより人口が多く、総人口に占める15〜64歳人口の割合も高い。","日本はインドネシアより人口が少なく、総人口に占める15〜64歳人口の割合も低い。","日本はベトナムより人口が多く、総人口に占める15〜64歳人口の割合も高い。","日本はベトナムより人口が少なく、総人口に占める15〜64歳人口の割合も低い。"], answer:1,
 explain:"日本の総人口はインドネシアより少なく、少子高齢化により生産年齢人口(15〜64歳)の割合もインドネシアより低い水準にあります。"},

{id:"R7-16-72", tag:"R7 試験III 問題15 問2", cat:"多文化共生:日系人の集住",
 text:"問2 文章中の下線部Bに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日系人の就労者には機械・電気関係や食品関係の工場、介護の現場からの求人があり、多くは正社員として雇用された。","日系人の就労者とともに来日した非日系の配偶者には就労可能な在留資格は付与されず、配偶者の不法就労が増加した。","日系人の就労者の集住地域を中心にブラジル人学校が急増し、日本の学習指導要領に基づいた教育課程が編成された。","日系人の就労者は特定の工業都市近辺に集住したため、その地域では日本語を使わなくても生活できるコミュニティが成立した。"], answer:3,
 explain:"日系人の就労者が特定の工業都市周辺に集住した結果、日本語を使わなくても生活できるコミュニティが形成された地域があることが知られています。実際には、多くが非正規雇用であり、配偶者にも一定の在留資格が認められ、ブラジル人学校は日本の学習指導要領によらない独自の教育課程を持つことが多いため、他の記述は不適当です。"},

{id:"R7-16-73", tag:"R7 試験III 問題15 問3", cat:"在留資格制度:留学生の資格外活動",
 text:"問3 文章中の下線部Cに関して、留学生がアルバイトを許可される例として最も適当なものを、次の1〜4の中から一つ選べ。",

{id:"R7-16-74", tag:"R7 試験III 問題15 問4", cat:"日本語教育政策:日本語教育推進法の目的",
 text:"問4 文章中の下線部D「日本語教育の推進に関する法律」に関して、同法の条文に示された「目的」として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本語教育の適正かつ確実な実施を推進し、外国人が日常生活及び社会生活を円滑に営むための環境整備に寄与する。","日本語教育の適正かつ確実な実施を推進し、人材育成を通じた技能や知識の移転による国際協力を実現する。","日本語教育に関する施策を推進し、我が国の国際化に必要不可欠な外国人住民との地域共生に関する都市間連携を確立する。","日本語教育に関する施策を推進し、多様な文化を尊重した共生社会を実現し、諸外国との交流を促進する。"], answer:0,
 explain:"「日本語教育の推進に関する法律」の目的規定には、日本語教育の推進に関する施策を総合的に推進し、外国人が日常生活及び社会生活を円滑に営むことができる環境整備に寄与することが掲げられています。"},

{id:"R7-16-75", tag:"R7 試験III 問題15 問5", cat:"日本語教育政策:海外派遣プログラム",
 text:"問5 文章中の下線部E「海外派遣プログラム」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["国際交流基金(JF)による「日本語パートナーズ」は、年齢制限はあるが日本語教育に関する専門的な知識はなくても応募できる。","国際交流基金(JF)による「日本語パートナーズ」は、マレーシアなどのASEAN諸国に多く派遣されている。","国際協力機構(JICA)では日本語教師の海外派遣を実施しており、北米などの先進国に多く派遣されている。","国際協力機構(JICA)では日本語教師の海外派遣を実施しており、経験により「一般案件」と「シニア案件」の二つの応募区分が設けられている。"], answer:2,
 explain:"JICAの日本語教育に関する海外派遣は、主にアジアやアフリカなどの開発途上国を中心に行われており、北米などの先進国に多く派遣されているという記述は事実と異なるため不適当です。"},

{id:"R7-16-76", tag:"R7 試験III 問題16 問1", cat:"海外の日本語教育:国際交流基金の事業",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語は日本国内だけでなく海外でも学ばれている。海外の日本語教育の現状については、国際交流基金(JF)が「海外日本語教育機関調査」を実施し明らかにしている。それによると、海外の教育機関で学ぶ学習者は、1998年度の調査時には200万人を超え、現在では390万人前後で推移している。その中で中国国内の学習者は、常に高い割合を占めている。一方、2021年度調査時の海外の教育機関における日本語教師数は、74,592人であった。\nまた、2021年度の調査では、初めてオンライン授業の実施状況も調査され、様々な取組が報告されている。日本国内でもオンラインコンテンツ等を用いた反転授業の手法が注目されている。\n\n問1 文章中の下線部A「国際交流基金」が行っている事業に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["来日予定の「生活者としての外国人」向けに日本語教育の「標準的なカリキュラム案」を作成し、公開している。","海外から日本の大学への入学を希望する外国人向けの試験である「日本留学試験(EJU)」を国内外で実施している。","海外の日本語教育機関で教えている外国人日本語教師を日本に招聘し、「海外日本語教師基礎研修」を行っている。","『日本語の基礎』や『新日本語の基礎』を基に、多言語版の『みんなの日本語』を開発・編纂している。"], answer:2,
 explain:"国際交流基金は、海外の日本語教育機関で教える現地教師を日本に招き、指導力向上を図る「海外日本語教師基礎研修」を実施しています。「生活者としての外国人」向けカリキュラム案は文化庁、EJUは日本学生支援機構(JASSO)が実施しているため、他の記述は不適当です。"},

 text:"問2 文章中の下線部B「海外の教育機関で学ぶ学習者」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["オーストラリアの学習者の占める割合は1998年度の調査時には低かったが、2021年度の調査時には全体の三分の一を占めるようになった。","韓国の学習者は1998年度の調査時には学習者数全体の約半数を占めていたが、2021年度の調査時にはその割合は減少している。","台湾の学習者の占める割合は1998年度の調査時には低かったが、2021年度の調査時には全体の三分の一を占めるようになった。","ベトナムの学習者は1998年度の調査時には学習者数全体の約半数を占めていたが、2021年度の調査時にはその割合は減少している。"], answer:1,
 explain:"韓国は1998年度の調査時点では学習者数が多い国の一つでしたが、その後中国やインドネシアなど他国の学習者数が大きく伸びたことにより、全体に占める割合は相対的に減少しています。"},

{id:"R7-16-80", tag:"R7 試験III 問題16 問5", cat:"教授法:反転授業",

/* ========= 状態管理 ========= */
const STORAGE_KEY = "kentei_app_progress_v1";
const SESSION_KEY = "kentei_app_session_v1";
let progress = loadProgress();
let sessionQueue = [];
let sessionIndex = 0;
let sessionAnswers = []; // {id, correct}
let currentMode = "order";
let currentRangeLabel = "全体(試験I・II・III)";
let currentModeLabel = "順番に解く";

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {}; // { qid: {seen:0, correct:0} }
}
function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
}
function getStat(qid){
  return progress[qid] || {seen:0, correct:0};
}
function recordAnswer(qid, isCorrect){
  const s = getStat(qid);
  s.seen += 1;
  if(isCorrect) s.correct += 1;
  progress[qid] = s;
  saveProgress();
}

/* ========= 中断・再開(セッションの一時保存) ========= */
function saveSessionState(){
  try{
    const state = {
      queueIds: sessionQueue.map(q=>q.id),
      index: sessionIndex,
      answers: sessionAnswers,
      rangeLabel: currentRangeLabel,
      modeLabel: currentModeLabel
    };
    localStorage.setItem(SESSION_KEY, JSON.stringify(state));
  }catch(e){}
}
function loadSessionState(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function clearSessionState(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}
function renderResumeCard(){
  const card = document.getElementById("resumeCard");
  const state = loadSessionState();
  if(!state || !state.queueIds || state.index >= state.queueIds.length){
    card.style.display = "none";
    return;
  }
  const correctSoFar = state.answers.filter(a=>a.correct).length;
  document.getElementById("resumeInfo").textContent =
    `${state.rangeLabel} / ${state.modeLabel} — ${state.index}問目まで回答済み(${state.index}/${state.queueIds.length}問中、正答${correctSoFar}問)`;
  card.style.display = "block";
}
function resumeSession(){
  const state = loadSessionState();
  if(!state) return;
  const byId = {};
  QUESTIONS.forEach(q=>{ byId[q.id] = q; });
  const restoredQueue = state.queueIds.map(id=>byId[id]).filter(Boolean);
  if(restoredQueue.length !== state.queueIds.length || state.index >= restoredQueue.length){
    // データが変わっている等で復元できない場合は諦めて破棄
    clearSessionState();
    renderResumeCard();
    alert("前回の続きを復元できませんでした。お手数ですが、最初から解き直してください。");
    return;
  }
  sessionQueue = restoredQueue;
  sessionIndex = state.index;
  sessionAnswers = state.answers;
  currentRangeLabel = state.rangeLabel;
  currentModeLabel = state.modeLabel;
  showScreen("screen-quiz");
  renderQuestion();
}

/* ========= 画面切り替え ========= */
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ========= ホーム画面の統計表示 ========= */
function renderHomeStats(){
  let total=0, correct=0, weak=0;
  QUESTIONS.forEach(q=>{
    const s = getStat(q.id);
    total += s.seen;
    correct += s.correct;
    if(s.seen>=2 && (s.correct/s.seen) < 0.6) weak++;
    if(s.seen===0) return;
  });
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statRate").textContent = total>0 ? Math.round(correct/total*100)+"%" : "-";
  document.getElementById("statWeak").textContent = weak;
}

/* ========= 範囲・モード選択 ========= */
const PART_LABELS = {"all":"全体", "I":"試験I", "II":"試験II(聴解)", "III":"試験III"};
const MODE_LABELS = {
  "order": "順番に解く",
  "random": "ランダム出題",
  "weak": "苦手優先(復習モード)"
};
// 頻出テーマ:全年度のcat/tagを分析し、3年度以上にまたがって出現する具体的テーマを抽出したもの
const FREQUENT_KEYWORDS = ["ストラテジー","アクセント","異文化","評価","語用論","敬語","受身","格助詞","引用",
  "待遇表現","ロールプレイ","シラバス","オノマトペ","使役","ポートフォリオ","多読","誤用分析","留学生","言語政策"];
function getYear(id){
  const m = id.match(/^([A-Za-z0-9]+?)-/);
  return m ? m[1] : "";
}
function getExamPart(id){
  if(id.includes("-II-")) return "II";
  if(/^[^-]+-16-/.test(id) || id.includes("-III-")) return "III";
  return "I";
}
function isFrequentQuestion(q){
  const text = (q.cat||"") + " " + (q.tag||"");
  return FREQUENT_KEYWORDS.some(kw=>text.includes(kw));
}
let currentYear = "all";
let currentPart = "all";
let frequentOnly = false;
function updateRangeLabel(){
  const parts = [];
  parts.push(currentYear === "all" ? "全年度" : currentYear);
  parts.push(PART_LABELS[currentPart] || currentPart);
  if(frequentOnly) parts.push("頻出のみ");
  currentRangeLabel = parts.join(" / ");
}
updateRangeLabel();

      return;
    }

document.getElementById("resetLink").addEventListener("click", ()=>{

    progress = {};

/* ========= セッション開始 ========= */
function startSession(){
  let list = QUESTIONS.slice();
  if(currentYear !== "all"){
    list = list.filter(q => getYear(q.id) === currentYear);
  }
  if(currentPart !== "all"){
    list = list.filter(q => getExamPart(q.id) === currentPart);
  }
  if(frequentOnly){
    list = list.filter(isFrequentQuestion);
  }
  if(list.length === 0){
    alert("この範囲には問題がありません。");
    return;
  }
  if(currentMode === "random"){
    list = shuffle(list);
  } else if(currentMode === "weak"){
    list = list.slice().sort((a,b)=>{
      const sa = getStat(a.id), sb = getStat(b.id);
      const ra = sa.seen>0 ? sa.correct/sa.seen : -1; // 未回答を最優先
      const rb = sb.seen>0 ? sb.correct/sb.seen : -1;
      return ra - rb;
    });
  }
  sessionQueue = list;
  sessionIndex = 0;
  sessionAnswers = [];
  saveSessionState();
  showScreen("screen-quiz");
  renderQuestion();
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ========= 問題文表示補助(親文章の自動補完・下線部の可視化) ========= */
function parsePassageGroupTag(tag){
  // 例:"R1 試験III 問題2 問3" → {key:"R1 試験III 問題2", num:3}
  let m = tag.match(/^(.*問題\d+)\s問(\d+)$/);
  if(m) return {key:m[1], num:parseInt(m[2],10)};
  // 例:"R1 試験I 問題3-B(8)" → {key:"R1 試験I 問題3-B", num:8}
  m = tag.match(/^(.*問題\d+-[A-Z])\((\d+)\)$/);
  if(m) return {key:m[1], num:parseInt(m[2],10)};
  return null;
}
function getPassageGroupKey(tag){
  const p = parsePassageGroupTag(tag);
  return p ? p.key : null;
}
function extractPassage(fullText){
  const re = /\n\n(?:\(\d+\)|問\d+)/g;
  let lastIdx = -1, m;
  while((m = re.exec(fullText)) !== null){ lastIdx = m.index; }
  if(lastIdx === -1) return "";
  return fullText.slice(0, lastIdx);
}
function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function annotateUnderlines(passage, members){
  // 各問いの文中にある「下線部A「〜」」等の記述を手掛かりに、
  // 本文中の該当箇所を実際の下線(<u>)+上付き文字で示す。
  let html = escapeHtml(passage);
  const seenLetters = new Set();
  const re = /下線部([A-E])「((?:[^「」]|「[^」]*」)*)」/g;
  members.forEach(m=>{
    let match;
    re.lastIndex = 0;
    while((match = re.exec(m.text)) !== null){
      const letter = match[1], phrase = match[2];
      if(seenLetters.has(letter)) continue;
      const escPhrase = escapeHtml(phrase);
      const idx = html.indexOf(escPhrase);
      if(idx === -1) continue;
      html = html.slice(0, idx) + '<u>' + escPhrase + '</u><sup class="ul-mark">' + letter + '</sup>' + html.slice(idx + escPhrase.length);
      seenLetters.add(letter);
    }
  });
  return html;
}
const PASSAGE_GROUPS = {}; // groupKey -> {leaderId, passage, annotatedHtml}
(function buildPassageGroups(){
  const buckets = {}; // key -> [{q, num}]
  QUESTIONS.forEach(q=>{
    const p = parsePassageGroupTag(q.tag);
    if(!p) return;
    if(!buckets[p.key]) buckets[p.key] = [];
    buckets[p.key].push({q, num:p.num});
  });
  Object.keys(buckets).forEach(key=>{
    const members = buckets[key];
    // リーダーは、その章群の中で最も小さい問番号(問1など)を持つエントリ
    let leader = members[0];
    members.forEach(m=>{ if(m.num < leader.num) leader = m; });
    const passage = extractPassage(leader.q.text);
    if(passage){
      const annotatedHtml = annotateUnderlines(passage, members.map(m=>m.q));
      PASSAGE_GROUPS[key] = {leaderId: leader.q.id, passage, annotatedHtml};
    }
  });
})();
function getDisplayText(q){
  const key = getPassageGroupKey(q.tag);
  if(!key) return q.text;
  const info = PASSAGE_GROUPS[key];
  if(!info || q.id === info.leaderId) return q.text;
  return info.passage + "\n\n" + q.text;
}
function getDisplayHTML(q){
  const key = getPassageGroupKey(q.tag);
  const info = key ? PASSAGE_GROUPS[key] : null;
  if(!info) return escapeHtml(q.text);
  let tail;
  if(q.id === info.leaderId){
    tail = q.text.slice(info.passage.length + 2); // "\n\n"の2文字分をスキップ
  } else {
    tail = q.text;
  }
  return info.annotatedHtml + "\n\n" + escapeHtml(tail);
}

/* ========= 問題表示 ========= */
function renderQuestion(){
  const q = sessionQueue[sessionIndex];
  document.getElementById("progressFill").style.width =
    Math.round((sessionIndex/sessionQueue.length)*100)+"%";
  document.getElementById("qTag").textContent = q.tag + `  (${sessionIndex+1}/${sessionQueue.length})`;
  document.getElementById("qCat").textContent = q.cat;
  document.getElementById("qText").innerHTML = getDisplayHTML(q);

  const audioBox = document.getElementById("audioBox");
  const qAudio = document.getElementById("qAudio");
  if(q.audio){
    audioBox.style.display = "block";
    qAudio.src = q.audio;
    qAudio.load();
  } else {
    audioBox.style.display = "none";
    qAudio.removeAttribute("src");
  }

  const imageBox = document.getElementById("imageBox");
  const qImage = document.getElementById("qImage");
  if(q.image){
    imageBox.style.display = "block";
    qImage.src = q.image;
  } else {
    imageBox.style.display = "none";
    qImage.src = "";
  }

  const list = document.getElementById("choiceList");
  list.innerHTML = "";
  const labels = q.choiceLabels || null; // e.g. ["a","b","c","d"] for letter-based choices
  q.choices.forEach((c, i)=>{
    const btn = document.createElement("button");
    btn.className = "choice";
    const label = labels ? labels[i] : (i+1);
    btn.innerHTML = `<span class="num">${label}</span>${c}`;
    btn.addEventListener("click", ()=>selectChoice(i));
    list.appendChild(btn);
  });

  document.getElementById("explainBox").style.display = "none";
  document.getElementById("nextBtn").style.display = "none";
}

function selectChoice(i){
  const q = sessionQueue[sessionIndex];
  const buttons = document.querySelectorAll("#choiceList .choice");
  buttons.forEach(b=>b.classList.add("disabled"));
  buttons[i].classList.add(i===q.answer ? "correct" : "wrong");
  if(i !== q.answer){
    buttons[q.answer].classList.add("correct");
  }
  const isCorrect = (i === q.answer);
  recordAnswer(q.id, isCorrect);
  sessionAnswers.push({id:q.id, tag:q.tag, correct:isCorrect});

  const box = document.getElementById("explainBox");
  box.style.display = "block";
  const v = document.getElementById("verdict");
  const labels = q.choiceLabels || null;
  const answerLabel = labels ? labels[q.answer] : (q.answer+1);
  v.textContent = isCorrect ? "○ 正解です" : "× 不正解 / 正解は " + answerLabel + " です";
  v.className = "verdict " + (isCorrect ? "ok" : "ng");
  document.getElementById("explainText").textContent = q.explain || "(この問題は聴解問題のため、AIによる解説はありません。音声の内容をご自身で振り返って確認してください。)";

  document.getElementById("nextBtn").style.display = "block";
}

document.getElementById("nextBtn").addEventListener("click", ()=>{
  sessionIndex++;
  if(sessionIndex >= sessionQueue.length){
    finishSession();
  } else {
    saveSessionState();
    renderQuestion();
  }
});

/* ========= 結果画面 ========= */
function finishSession(){
  clearSessionState();
  const correctCount = sessionAnswers.filter(a=>a.correct).length;
  document.getElementById("resultScore").textContent = `${correctCount}/${sessionAnswers.length}`;
  const list = document.getElementById("reviewList");
  list.innerHTML = "";
  sessionAnswers.forEach(a=>{
    const div = document.createElement("div");
    div.className = "review-item";
    div.innerHTML = `<span>${a.tag}</span><span class="mark ${a.correct?'ok':'ng'}">${a.correct?'○':'×'}</span>`;
    list.appendChild(div);
  });
  showScreen("screen-result");
}
document.getElementById("backHomeBtn").addEventListener("click", ()=>{
  renderHomeStats();
  renderResumeCard();
  showScreen("screen-home");
});
document.getElementById("quizPauseLink").addEventListener("click", ()=>{
  renderHomeStats();
  renderResumeCard();
  showScreen("screen-home");
});
document.getElementById("resumeBtn").addEventListener("click", resumeSession);
document.getElementById("discardResumeLink").addEventListener("click", ()=>{
  if(confirm("前回の続きを削除します。よろしいですか?")){
    clearSessionState();
    renderResumeCard();
  }
});

/* ========= 初期化 ========= */
renderHomeStats();
renderResumeCard();
</script>
</body>
