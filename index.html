{id:"R4-III-9-1", tag:"R4 試験III 問題9 問1", cat:"ステレオタイプの自動的活性化",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本に居住する外国人住民の増加に伴い、異文化接触の機会も増えている。日本人住民が外国人住民と接した際には、ステレオタイプの自動的活性化が生じ、トラブルに発展する可能性がある。そのため、日本人住民と外国人住民の初期の集団間接触において、脱カテゴリー化を促す活動を行うことが有効である。\n外国人住民を対象とした地域の日本語教室では、様々な取り組みが行われている。支援者には、外国人住民から相談が寄せられることもあり、積極的傾聴の姿勢が求められる。さらに、コミュニティ心理学の視点からは、外国人住民のエンパワーメントも重要である。これらの取り組みや支援により、共生社会の充実が期待される。\n\n問1 文章中の下線部A「ステレオタイプの自動的活性化」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["相手から出身地を聞いたら、自分の出身地のことを紹介したくなる。","相手から出身地を聞いたら、その出身地の特徴が瞬時に思い浮かぶ。","相手の出身地に対して否定的な感情を持ったら、すぐに悪口を言う。","相手の出身地に対して明確なイメージを持てたら、親しく付き合う。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"ステレオタイプの自動的活性化とは、特定の集団に関する情報に接した際、意図せず瞬時にその集団に対する固定観念(ステレオタイプ)が想起される現象です。出身地を聞いた瞬間にその土地の特徴が反射的に思い浮かぶことは、この典型例です。"},

{id:"R4-III-9-2", tag:"R4 試験III 問題9 問2", cat:"脱カテゴリー化を促す活動",
 text:"問2 文章中の下線部B「脱カテゴリー化を促す活動」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本人住民と外国人住民が共通点を見つけるために、互いに個人の趣味を紹介し合う。","日本人住民と外国人住民が率直に話し合うために、互いの短所を指摘し合う。","日本人住民と外国人住民が互いに住民として認め合えるように、地域の課題を一緒に調べる。","日本人住民と外国人住民が互いの文化を意識できるように、自国の代表として文化を説明する。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"脱カテゴリー化とは、「日本人」「外国人」といった集団カテゴリーを意識させず、一人ひとりを個人として捉え直させることです。互いの個人的な趣味を紹介し合う活動は、集団の枠を超えた個人同士の共通点に注目させる点で、脱カテゴリー化を促す活動の例といえます。"},

{id:"R4-III-9-3", tag:"R4 試験III 問題9 問3", cat:"積極的傾聴",
 text:"問3 文章中の下線部C「積極的傾聴」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["相談者の考えに賛同を示し、話の真意が分かりにくい場合もそのまま聴く。","相談者の気持ちを想像し、否定せずに話に関心を持って真摯な態度で聴く。","相談者の意見を分析し、支援者の立場から解決方法を提案しながら聴く。","相談者の話を整理し、その話に対する支援者の価値判断を示しながら聴く。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"積極的傾聴(アクティブリスニング)は、相手の気持ちに共感し、評価や助言を挟まずに、関心を持って真摯に耳を傾ける姿勢を指します。安易な賛同、解決策の提案、支援者側の価値判断の提示は、いずれも積極的傾聴の趣旨にそぐいません。"},

{id:"R4-III-9-4", tag:"R4 試験III 問題9 問4", cat:"エンパワーメント",
 text:"問4 文章中の下線部D「エンパワーメント」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["価値観や考え方に差異がある中でも多様性を尊重し、重視すること","逆境の中でも心理的に回復し、環境に適応する柔軟性を身につけること","自分の生活に意味を見出し、自己決定能力などを獲得する過程のこと","他者とのつながりを感じ、集団の中での所属感を得るようになること"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"エンパワーメントとは、当事者自身が自分の生活や状況に対する意味を見出し、主体的に意思決定していく力を獲得していく過程を指す、コミュニティ心理学の重要な概念です。"},

{id:"R4-III-9-5", tag:"R4 試験III 問題9 問5", cat:"共生社会の課題",
 text:"問5 文章中の下線部E「共生社会の充実」に向けた課題として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["外国人住民の文化的背景を反映した異文化理解活動の拡充","コミュニケーション言語としての日本語学習支援の拡充","地域住民同士のネットワーク作りに向けた交流の促進","文化的アイデンティティを尊重した外国人住民集住の促進"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"「外国人住民集住の促進」は、外国人住民を特定の地域に集めることを意味し、日本人住民との交流や相互理解を妨げ、社会の分断につながりかねないため、共生社会の充実に向けた課題としては不適当です。他の選択肢は、いずれも相互理解や交流を促す方向の取り組みです。"},

/* ========= データ (令和4年度 試験III 問題10) ========= */
{id:"R4-III-10-1", tag:"R4 試験III 問題10 問1", cat:"第二言語習得:U字型のカーブ",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n第二言語習得は時間をかけて複雑な過程をたどる。その過程は第一言語習得とよく似たU字型のカーブで表される。\n習得過程については、クラッシェン(S. D. Krashen)により自然習得順序仮説が提唱されている。このほか、習得には一定の発達段階があるという考え方もあり、日本語の発達段階に応じて産出される言語構造も明らかになってきた。習得過程では学習者は仮説検証を繰り返しており、その影響は言語転移として産出に現れることがある。\n最近、学習者コーパスが一般公開されるようになった。これを活用して習得過程にある学習者の言語の実態を把握し、指導につなげることが教師には期待される。\n\n問1 文章中の下線部A「U字型のカーブ」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["U字型の下降から底の時期は、目標言語の規範に合った言語形式の産出が増える。","U字型の下降から底の時期は、目標言語の構造などの分析が進んでいる。","U字型の上昇の時期は、目標言語の規範から逸脱した言語形式の産出が増える。","U字型の上昇の時期は、目標言語を丸暗記した定型表現が多く見られる。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"U字型発達では、最初は丸暗記した正しい定型表現が使えていたのに(初期の高い正用率)、その後、規則を分析し始めることで一時的に誤用が増え(下降〜底)、やがて規則を正しく適用できるようになり再び正用率が上がります(上昇)。下降から底の時期は、目標言語の内部構造の分析が進んでいる時期にあたります。"},

{id:"R4-III-10-2", tag:"R4 試験III 問題10 問2", cat:"自然習得順序仮説",
 text:"問2 文章中の下線部B「自然習得順序仮説」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["母語にかかわらず、教えられた順序で文法項目が習得される。","年齢にかかわらず、教えられた順序で文法項目が習得される。","学習環境にかかわらず、決まった順序で文法項目が習得される。","インプットの有無にかかわらず、決まった順序で文法項目が習得される。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"自然習得順序仮説は、指導の有無や学習環境(自然習得か教室習得か)にかかわらず、文法項目はほぼ一定の順序で習得されるとする仮説です。教えられた順序で習得されるという主張ではなく、また、インプットが全くなければ習得自体が成立しないため、4も誤りです。"},

{id:"R4-III-10-3", tag:"R4 試験III 問題10 問3", cat:"日本語の発達段階",
 text:"問3 文章中の下線部C「日本語の発達段階に応じて産出される言語構造」に関して、「食べます」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["第1段階:食べます 第2段階:食べました 第3段階:食べれば 第4段階:食べています","第1段階:食べます 第2段階:食べました 第3段階:食べています 第4段階:食べれば","第1段階:食べます 第2段階:食べています 第3段階:食べれば 第4段階:食べました","第1段階:食べます 第2段階:食べています 第3段階:食べました 第4段階:食べれば"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"日本語学習者の習得研究では、まず基本形の「ます形」、次に過去(タ形)、その後「ています」のようなアスペクト形式、そして「〜れば」のような複雑な条件形式へと、段階的に発達していくことが明らかにされています。"},

{id:"R4-III-10-4", tag:"R4 試験III 問題10 問4", cat:"言語転移",
 text:"問4 文章中の下線部D「言語転移」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["母語だけでなく既習の外国語からも言語転移が起こる。","母語が同じ学習者には一律の言語転移が起こる。","目標言語との言語間の距離が近いと言語転移は起こらない。","文法訳読法中心の教え方では言語転移は起こらない。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"言語転移は母語だけでなく、学習者がすでに習得している他の外国語の知識からも生じることが知られています(言語間の相互影響)。母語が同じでも学習者ごとに転移の現れ方は異なり、言語間の距離が近いほどむしろ転移(特に正の転移や誤った類推)が起こりやすく、教授法にかかわらず転移は生じ得ます。"},

{id:"R4-III-10-5", tag:"R4 試験III 問題10 問5", cat:"学習者コーパスで調べられないこと",
 text:"問5 文章中の下線部E「学習者コーパス」で調べられないものを、次の1〜4の中から一つ選べ。",
 choices:["非漢字圏学習者は、作文で「増加する」と「増える」のどちらを多く使っているか。","上級学習者は、一人称の「私」と「自分」をどのような意図で使い分けているか。","学習者の母語によって、「ようだ」「みたいだ」「らしい」の使用数に違いがあるか。","学習者のレベルによって、助詞の「は」と「が」の誤りに違いがあるか。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"学習者コーパスは、学習者が実際に産出した書き言葉・話し言葉のデータを収集したものであり、語の使用頻度や誤用の傾向などは分析できますが、「どのような意図で使い分けているか」という書き手本人の内面的な意図までは、コーパスのデータだけからは分かりません。"},

/* ========= データ (令和4年度 試験III 問題11) ========= */
{id:"R4-III-11-1", tag:"R4 試験III 問題11 問1", cat:"過剰般化",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n1960年代から、学習者が産出する誤用の分析が行われてきた。誤用分析が発展するにつれて、過剰般化などの誤用だけでなく、正用も含めた学習者の産出を分析する必要性が指摘されるようになった。\n近年では、学習者に対するフィードバックの研究が行われている。誘導(elicitation)は口頭フィードバックの一つである。フィードバックにはその場で口頭で行うものだけでなく、作文添削など時間をおいて口頭以外で行われるフィードバックも含まれる。\nフィードバックを重視する考え方にはフォーカス・オン・フォームがある。タスク中心の教授法(Task-Based Language Teaching)はこの考え方を取り入れて開発されたものである。\n教師は成功したフィードバックだけでなく、うまくいかなかったものについても振り返る必要がある。\n\n問1 文章中の下線部A「過剰般化」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ある言語形式の規則を、その適用範囲を超えた箇所でも使用する現象","ある言語形式を学んだ直後に、その言語形式ばかりを使用する現象","特定の誤りが定着し、その誤った言語形式を産出し続ける現象","学習者の疲労や注意力の欠如によって、誤った言語形式を産出し続ける現象"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"過剰般化(過剰一般化)とは、ある規則(例:動詞の過去形に「〜た」を付ける)を、本来その規則が適用されない例外的な語にまで拡張して適用してしまう現象(例:「行く」→「行いた」)を指します。"},

{id:"R4-III-11-2", tag:"R4 試験III 問題11 問2", cat:"誘導(elicitation)",
 text:"問2 文章中の下線部B「誘導」の方法として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者が誤った箇所の手前までの発話部分を教師が繰り返す。","学習者が誤った箇所を教師が指摘したうえで正しい表現を提示する。","学習者が誤った表現を教師が上昇イントネーションで繰り返す。","学習者が誤った表現の発話意図を教師が確認して言い換える。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"誘導(elicitation)は、教師が正解を直接与えるのではなく、誤った箇所の手前まで発話を繰り返すなどして、学習者自身に自己修正を促すフィードバック手法です。正しい表現をそのまま提示するのはリキャスト、上昇イントネーションでの繰り返しは明確化要求に近い別の手法です。"},

{id:"R4-III-11-3", tag:"R4 試験III 問題11 問3", cat:"口頭以外のフィードバック",
 text:"問3 文章中の下線部Cに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["口頭フィードバックより、暗示的な修正に適している。","口頭フィードバックより、学習者に意図を確認しやすい。","口頭フィードバックより、学習者の短期記憶への負荷が小さい。","口頭フィードバックより、全体の構成に対する指導を行いにくい。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"作文添削のような書面によるフィードバックは、時間をかけてじっくり確認できるため、その場で処理しなければならない口頭フィードバックに比べて学習者の短期記憶への負荷が小さいという特徴があります。"},

{id:"R4-III-11-4", tag:"R4 試験III 問題11 問4", cat:"フォーカス・オン・フォーム",
 text:"問4 文章中の下線部D「フォーカス・オン・フォーム」の方法として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["母語で学習者の理解を確認しつつ、言語形式の誤りは文法用語を用いて説明する。","自然な流れの中で学習者の注意を言語形式に向けつつ、コミュニケーションを行う。","学習者の注意を言語形式に集中させ、体系的に文法項目を整理して指導する。","学習者の注意を言語形式に向けるのではなく、言語の意味を重視して考えさせる。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"フォーカス・オン・フォームは、意味重視のコミュニケーション活動の流れの中で、必要に応じて学習者の注意を言語形式(フォーム)に向けさせる指導法です。文法項目を体系的に整理して教える「フォーカス・オン・フォームズ」や、形式に全く注意を向けない「フォーカス・オン・ミーニング」とは異なります。"},

{id:"R4-III-11-5", tag:"R4 試験III 問題11 問5", cat:"タスク中心の教授法",
 text:"問5 文章中の下線部E「タスク中心の教授法」で扱うタスクの特徴として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["文型の難易度順に項目を配列している。","新出文型の産出を目的としている。","学習者のニーズを反映させている。","学習者が終始単独で達成できる。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"タスク中心の教授法におけるタスクは、実生活での言語使用に近い、意味のあるコミュニケーション活動として設計され、学習者の実際のニーズを反映した内容で構成されます。文型の難易度順の配列や新出文型の産出そのものを目的とすること、単独完結を前提とすることは、タスクの本質的な特徴ではありません。"},

/* ========= データ (令和4年度 試験III 問題12) ========= */
{id:"R4-III-12-1", tag:"R4 試験III 問題12 問1", cat:"フィラー",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n会話に特徴的な形式や表現には、様々なものがある。例えば、フィラーや中途終了型発話などが挙げられる。また、前置き表現や婉曲表現など、対人配慮を示す表現も見られる。\nこれらの表現を含め、人々は場面や状況に応じて様々なポライトネス・ストラテジーを用い、他者への配慮を示している。一見他者への配慮とは無関係に思われる軽卑語や尊大語なども、円滑な人間関係の構築に寄与することがある。\n日本語学習者も様々なコミュニケーション・ストラテジーを用いて意思疎通を図っている。円滑な人間関係の構築に必要な語用論的知識の習得は、学習者の置かれた環境の影響も受けると考えられている。\n\n問1 文章中の下線部A「フィラー」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["聞き手が話し手と発話を重ねることで、会話における熱心さを伝えたり、相手との連帯感を強めたりする。","聞き手が短い発話によって話を聞いているという態度を示すことで、会話の進行を助ける。","話し手が短い言葉を発することで、次に続ける発話を少し待ってほしいということを聞き手に伝える。","話し手が会話の冒頭で定型化された言葉を儀礼的に用いることで、聞き手との良好な関係を示す。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"フィラー(「あの」「えーと」など)は、話し手が発話の間を埋めるために発する言葉で、次に続く発話を組み立てる時間を確保し、少し待ってほしいという意図を聞き手に伝える働きをします。1・2はあいづち、4は挨拶表現などに関する記述です。"},

{id:"R4-III-12-2", tag:"R4 試験III 問題12 問2", cat:"ポライトネス・ストラテジー",
 text:"問2 文章中の下線部B「ポライトネス・ストラテジー」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["友人にお願いするときに、ネガティブ・ポライトネス・ストラテジーを用いて「ちょっとだけ手伝ってくれない?」と言う。","先輩に同意を求めるときに、ネガティブ・ポライトネス・ストラテジーを用いて「私ってコーヒーが好きじゃないですか。」と言う。","同僚の間違いを指摘するときに、ポジティブ・ポライトネス・ストラテジーを用いて「私が間違えているのかな?」と言う。","取引先に依頼するときに、ポジティブ・ポライトネス・ストラテジーを用いて「後日ご連絡を頂ければと思います。」と言う。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"「ちょっとだけ」のように依頼の負担を軽く見せる表現は、相手の負担を最小限に抑えようとするネガティブ・ポライトネス・ストラテジーの例です。「好きじゃないですか」は聞き手との共通認識を作るポジティブ・ストラテジー寄り、「間違えているのかな」は自己への疑問形での間接的指摘、「頂ければと思います」は敬語による距離を置くネガティブ・ストラテジーであり、それぞれ対応が誤っています。"},

{id:"R4-III-12-3", tag:"R4 試験III 問題12 問3", cat:"尊大語",
 text:"問3 文章中の下線部C「尊大語」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["こっちを見やがって。","あいつ威張りくさってる。","この、悪がきめ。","俺様のお帰りだ。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"尊大語は、話し手が自分自身を実際以上に高めて尊大に見せる表現です。「俺様のお帰りだ」は自らを「俺様」と称する典型的な尊大語の例です。他の選択肢は、相手を見下す卑罵語・軽卑語の例です。"},

{id:"R4-III-12-4", tag:"R4 試験III 問題12 問4", cat:"コミュニケーション・ストラテジー",
 text:"問4 文章中の下線部D「コミュニケーション・ストラテジー」の例として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["相手の言っていることが聞き取れない場合に、もう一度言うように頼む。","相手の発話の理解が難しい場合に、文を単語に分割して意味を考える。","自分の表現に自信がない場合に、難しい言語形式を避けて簡単に伝える。","自分の発話が伝わったかどうか自信がない場合に、相手に確認する。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「文を単語に分割して意味を考える」ことは、聞き取った内容を理解するための個人内の認知的な処理(理解方略)であり、対人的なコミュニケーション上の問題を乗り越えるためのコミュニケーション・ストラテジー(聞き返し、言い換え、確認要求など)とは性質が異なります。"},

{id:"R4-III-12-5", tag:"R4 試験III 問題12 問5", cat:"語用論的知識の習得環境",
 text:"問5 文章中の下線部Eに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["教室環境において、教師が自身の発話をコントロールし、語用論的知識について肯定証拠を明示することが、習得の妨げにつながる。","教室環境において、教師が学習者の発話を訂正せず、語用論的知識についての否定証拠を明示しないことが、習得の促進につながる。","自然習得環境において、母語話者は学習者に必要な語用論的知識について肯定証拠を提示しない傾向があり、それが習得の促進につながる。","自然習得環境において、母語話者は学習者に必要な語用論的知識について否定証拠を提示しない傾向があり、それが習得の妨げにつながる。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"自然習得環境では、母語話者が学習者の語用論的な誤り(不適切な言葉遣いなど)を明示的に訂正する「否定証拠」を示さないことが多く、これが学習者の語用論的知識の習得を妨げる要因になり得るとされています。教室環境では逆に教師が意図的に肯定証拠・否定証拠を示すことで習得を助けることができます。"},

/* ========= データ (令和4年度 試験III 問題13) ========= */
{id:"R4-III-13-1", tag:"R4 試験III 問題13 問1", cat:"多言語使用",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本には言語や文化を異にする人々が共存している。そのため各所で多言語使用が進行している。それに伴い地域の言語景観も変化してきた。\n観光政策では、訪日客のための取り組みが行われている。国土地理院は、平成27年(2015年)に、英語を用いた場合の地名や施設名の表記方法を具体的に提案している。公共表示の作成・設置では訪日客の利便性を考える必要がある。\nしかし、言語的背景が異なる人々は、観光客やニューカマーのみではない。日本の多言語事情を考える際は、オールドカマーや日本の少数民族、ろう者などの事情も見過ごしてはならない。\n\n問1 文章中の下線部A「多言語使用」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ある言語文化の基準を用いて、他の言語文化を理解すること","ある目的のために、映像や音声等の多種多様な媒体を活用すること","国や地域または個人が、二つ以上の言語を用いること","言語文化的背景が異なる人々の間で、考えや情報をやり取りすること"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"多言語使用(multilingualism)とは、国・地域・個人のレベルで二つ以上の言語が用いられている状態を指す言葉です。1は自文化中心主義、2はマルチメディア、4は異文化間コミュニケーションの説明です。"},

{id:"R4-III-13-2", tag:"R4 試験III 問題13 問2", cat:"言語景観",
 text:"問2 文章中の下線部B「言語景観」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["多様な言語に翻訳できる自動翻訳機","多様な言語で配信されるテレビ番組","多様な言語で書き込まれるSNS","多様な言語による商業広告の看板"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"言語景観(linguistic landscape)とは、看板・標識・広告など、公共空間に物理的に掲示された言語表示のことを指します。商業広告の看板はその典型例であり、翻訳機・テレビ番組・SNSといった媒体そのものは言語景観の例ではありません。"},

{id:"R4-III-13-3", tag:"R4 試験III 問題13 問3", cat:"訪日客向けの英語表記",
 text:"問3 文章中の下線部Cの提案に則って、外国人に分かりやすく表記した例はどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「芦ノ湖」は、「湖」の英訳を先頭に加え「Lake Ashinoko」とする。","「東大寺」は、「寺」を英語に置き換え「Todai Temple」とする。","「日本橋」は、連濁を清音にして英訳を付け「Nihon-hashi Bridge」とする。","「東京都」は、「都」「道」「府」「県」の英訳を統一し「Tokyo Prefecture」とする。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"国土地理院の提案では、地名全体をローマ字表記としたうえで、種別を示す語(湖・寺・橋など)の英訳を先頭に付す方式(例:「Lake Ashinoko」)が、外国人にとって分かりやすい表記として提案されています。「東大寺」は地名部分ごと「Todaiji Temple」のように元の音を保つべきで「寺」を単純に置き換えるのは適切ではなく、連濁を清音に変えるのも原音から離れ、都道府県の英訳統一も実際の提案内容とは異なります。"},

{id:"R4-III-13-4", tag:"R4 試験III 問題13 問4", cat:"公共表示の推奨事項",
 text:"問4 文章中の下線部Dに関して、政府や公共機関が推奨していることとして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["名称や案内の表示は、外国語のガイドブックも含めて地域単位で統一する。","道路標識の地名に用いられる漢字は、複雑なものは画数を減らし簡略化する。","ピクトグラムは、補助的な機能を果たすものであるため、文字情報を併記する。","地名のローマ字表記は、読み方の混乱を避けるために、訓令式を用いる。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"訪日外国人向けの案内表示に関するガイドラインでは、同じ地域内で施設名や地名の外国語表記がガイドブックなども含めてばらばらにならないよう、地域単位で表記を統一することが推奨されています。漢字の簡略化や、実際の発音に近いヘボン式を優先したローマ字表記(訓令式ではなく)、ピクトグラムへの文字情報併記(むしろ多言語表記と組み合わせる形)といった記述は、実際の推奨内容とは異なります。"},

{id:"R4-III-13-5", tag:"R4 試験III 問題13 問5", cat:"日本の多言語事情",
 text:"問5 文章中の下線部E「オールドカマーや日本の少数民族、ろう者などの事情」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["アイヌ語は、保護の対象となっており、伝承する歌がアイヌ文字で保存されてきた。","日本の朝鮮学校の教育課程は初等から中等教育まであり、朝鮮語で授業が行われている。","手話には変種があり、現在、NHK手話ニュースでは日本語の語順に対応した手話が使用されている。","夜間中学では、在日コリアンや中国帰国者、難民など、日本語学習が必要な成人も学んできた。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"夜間中学は、様々な事情で義務教育を修了できなかった人々に学びの場を提供しており、在日コリアン、中国帰国者、難民など日本語学習を必要とする成人も重要な学習者層となっています。アイヌ語には固有の文字がなく(伝承はローマ字や仮名で記録)、朝鮮学校の教育は必ずしも全て朝鮮語のみで行われるわけではなく、NHK手話ニュースは日本語対応手話ではなく日本手話にも配慮した放送が行われています。"},

/* ========= データ (令和4年度 試験III 問題14) ========= */
{id:"R4-III-14-1", tag:"R4 試験III 問題14 問1", cat:"ピジン",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n明治時代以降、標準日本語の浸透が重要視されてきた。日本の統治下に置かれた地域でも標準日本語への言語移行が進んだが、一部の地域では、日本語が上層言語となるピジンやクレオールが発生した。\n戦後、日本統治が終了した地域では、日本語への言語移行が止まり、言語喪失が進んだ。また日本統治への反発から、日本語からの借用語を排除する言語政策としての国語醇化運動が起こった国・地域もあった。\n一方で、日本国内では戦後も標準日本語への言語移行が進み、言語の多様性が失われつつある。ユネスコによって言語消滅の危機にあるとされている言語も存在する。一例として、琉球諸語(琉球方言)も深刻な危機にさらされている。\n\n問1 文章中の下線部A「ピジン」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["語彙数が少ない言語であり、一つ一つの単語の意味範囲が狭い。","文法が存在しない言語であり、語彙のみで意思の疎通が行われる。","母語話者を持たない言語であり、その必要性がなくなれば消滅する。","母語を異にする人々の共通言語であり、広い話題で会話ができる。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"ピジンは、異なる母語を持つ人々が交易などの限られた目的のために作り出す接触言語で、それ自体を母語とする話者を持たず、語彙数も限られ、使用の必要性がなくなれば消滅する性質を持ちます(後にクレオール化して母語話者を持つようになる場合もあります)。文法が全く存在しないわけではなく、広い話題を扱えるわけでもありません。"},

{id:"R4-III-14-2", tag:"R4 試験III 問題14 問2", cat:"言語喪失",
 text:"問2 文章中の下線部B「言語喪失」に関して、移住した子どもの第一言語に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["移住先での話者人口が少ない場合は、多い場合よりも喪失されにくい。","移住先での使用機会が少ない場合は、多い場合よりも喪失されにくい。","移住先での第二言語習得が進む場合は、進まない場合よりも喪失されにくい。","移住先での社会的地位が高い場合は、低い場合よりも喪失されにくい。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"第一言語(母語)が移住先社会において高い社会的地位や威信を持つ言語である場合、その言語は喪失されにくいとされます。逆に話者人口や使用機会が少なく、第二言語習得が進むほど、第一言語は喪失されやすくなります。"},

{id:"R4-III-14-3", tag:"R4 試験III 問題14 問3", cat:"国語醇化運動が起きた地域",
 text:"問3 文章中の下線部Cはどこか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["韓国","旧満洲","台湾","パラオ"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"韓国では、日本統治への反発から、戦後、日本語からの借用語(日本語由来の外来語)を排除しようとする「国語醇化運動」が行われました。"},

{id:"R4-III-14-4", tag:"R4 試験III 問題14 問4", cat:"言語消滅",
 text:"問4 文章中の下線部D「言語消滅」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本では琉球諸語、アイヌ語、八丈語が消滅の危機にあるとされる。","21世紀の間に、全世界の約8割の言語が消滅すると試算されている。","話者が10万人以上存在していれば、危機言語には指定されない。","話し言葉として使われなくなった言語が復活した事例はない。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"ユネスコの消滅危機言語リストでは、日本国内の言語・方言として、アイヌ語、八丈語、琉球諸語(奄美語・国頭語・沖縄語・宮古語・八重山語・与那国語)が消滅の危機にあるとされています。全世界の消滅予測は「約8割」ではなくおよそ半数程度とされ、話者数だけで危機言語指定が除外されるわけではなく、ヘブライ語のように一度話されなくなった言語が復活した事例もあります。"},

{id:"R4-III-14-5", tag:"R4 試験III 問題14 問5", cat:"琉球諸語の現状",
 text:"問5 文章中の下線部Eに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["2010年以降、琉球諸語の普及に向けた教育現場の取り組みは減少している。","家庭内だけでなく、宗教的儀式等においても琉球諸語の使用が減少している。","琉球諸語の使用者は70代以上に限られ、次世代への継承が行われていない。","20代以下は琉球諸語を話せないため、祖父母世代と意思疎通ができない。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"琉球諸語は、日常の家庭内での使用だけでなく、伝統的な祭祀・宗教的儀式などの場面においても使用が減少しており、世代を超えた幅広い場面での継承の危機が指摘されています。教育現場での普及の取り組みはむしろ近年増加しており、使用者は70代以上に限定されるわけではなく、世代間の意思疎通も完全に不可能というわけではありません。"},

/* ========= データ (令和4年度 試験III 問題15) ========= */
{id:"R4-III-15-1", tag:"R4 試験III 問題15 問1", cat:"身分に基づく在留資格",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n令和2年(2020年)に日本国内の外国人労働者数は172万人に達した。同年10月末現在の外国人労働者の在留資格を見ると、「身分に基づく在留資格」(31.7%)が最も多い。次いで「(ア)」(23.3%)となっている。以下、「資格外活動」(21.5%)、「専門的・技術的分野の在留資格」(20.8%)と続く。こうした外国人労働者の日本語能力の評価には、BJTビジネス日本語能力テストなどが活用されている。\nビジネス日本語教育については、日本語を教えるだけでなく、人材育成の観点が必要であるとされており、プロジェクト学習(Project-Based Learning)を基にした活動を行うなど、教育方法にも工夫が求められる。\n\n問1 文章中の下線部A「身分に基づく在留資格」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本研究者に与えられる在留資格「文化活動」","日系ペルー人3世に与えられる在留資格「定住者」","外国人の配偶者に与えられる在留資格「家族滞在」","外国政府の公務に従事する者に与えられる在留資格「外交」"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「身分に基づく在留資格」は、活動内容に制限のない資格で、「永住者」「日本人の配偶者等」「定住者」などが該当します。日系人に与えられる「定住者」はその典型例です。「文化活動」「家族滞在」「外交」は、いずれも特定の活動に基づく在留資格です。"},

{id:"R4-III-15-2", tag:"R4 試験III 問題15 問2", cat:"技能実習",
 text:"問2 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["介護","特定活動","技能実習","経営・管理"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"令和2年時点の外国人労働者の在留資格別割合では、「身分に基づく在留資格」に次いで「技能実習」の割合が高くなっています。"},

{id:"R4-III-15-3", tag:"R4 試験III 問題15 問3", cat:"資格外活動によるアルバイト",
 text:"問3 文章中の下線部B「資格外活動」に関して、留学生のアルバイトとして許可される例はどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学校の学期期間中に、ゲームセンターで1日8時間以内、週に20時間働く。","学校の学期期間中に、レストランで1日8時間以内、週に30時間働く。","学校の長期休業期間に、リゾートホテルで1日8時間以内、週に40時間働く。","学校の長期休業期間に、学習塾で1日8時間以内、週に50時間働く。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"留学生の資格外活動によるアルバイトは、学期中は原則週28時間以内、長期休業期間中は1日8時間以内(週40時間程度)まで認められます。また風俗営業関連の施設(ゲームセンターなど)での就労は認められていません。したがって、長期休業期間中にリゾートホテルで1日8時間以内、週40時間働く3が条件を満たす例です。"},

{id:"R4-III-15-4", tag:"R4 試験III 問題15 問4", cat:"BJTビジネス日本語能力テスト",
 text:"問4 文章中の下線部C「BJTビジネス日本語能力テスト」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["就労のために来日する外国人が遭遇する生活場面でのコミュニケーションに必要な日本語能力を測定するもので、「特定技能1号」の申請にも使用できる。","言語機能、タスク、場面、話題などの要素を総合的に判断し、五つのレベルで口頭言語運用能力を判定できる。","漢字、表記、敬語、言葉の意味、語彙、文法等が出題され、14段階の認定基準に基づき、日本語の総合的な能力を測ることができる。","日本語の基礎的な知識を前提としたうえで、与えられた情報を適切に処理し、対応することのできる能力を測ることができる。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"BJTビジネス日本語能力テストは、日本語の基礎知識を前提として、実際のビジネス場面で情報を聞いたり読んだりして適切に判断・対応する力(状況処理能力)を測定するテストです。生活場面向けや口頭運用能力の判定、14段階認定基準といった記述は、それぞれ他の試験(生活・就労に関する日本語能力判定テストや日本語教育能力検定試験の別の枠組みなど)の説明であり、BJTの説明としては不適当です。"},

{id:"R4-III-15-5", tag:"R4 試験III 問題15 問5", cat:"プロジェクト学習",
 text:"問5 文章中の下線部D「プロジェクト学習」の目的として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ある物事の原理や構造、使用方法など一通りの基本知識を身につけてから、それを実践に生かす方法を学ぶ。","教室の授業とe-learningを組み合わせ、学習者の習熟度や学習過程に合わせた個別学習を達成する。","内容、言語、思考、協学の4要素を統合し、学習者のコミュニケーションの育成や学習者の文化あるいは相互文化の意識を高める。","実世界に関する解決すべき問題について問いや仮説を検証し、思考力や協働学習の能力を身につける。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"プロジェクト学習(Project-Based Learning)は、実社会に関わる現実的な課題(問い)を設定し、その解決に向けて仮説を立てて検証していく過程を通じて、思考力・問題解決力・協働学習の能力を育成することを目的とした学習方法です。1は基礎から応用への積み上げ型学習、2はブレンディッドラーニング、3はCLIL(内容言語統合型学習)の説明です。"},

/* ========= データ (令和4年度 試験III 問題16) ========= */
{id:"R4-III-16-1", tag:"R4 試験III 問題16 問1", cat:"日本語指導が必要な児童生徒:母語",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n近年、日本の学校では様々な背景を持つ児童生徒が増加している。こうした状況を踏まえ、文部科学省は「日本語指導が必要な児童生徒の受入状況等に関する調査」を実施している。令和3年度(2021年度)の調査によると、日本語指導が必要な児童生徒のうち外国籍は約48,000人、日本国籍は約(ア)である。\n日本国憲法において、子どもに普通教育を受けさせる義務を負うのは「国民」と規定されているが、就学を希望した場合、外国籍の子どもであっても日本の普通教育を受けることができる。\n文部科学省は、日本語指導が必要な児童生徒への対応としてJSLカリキュラムの開発を行ってきた。また、「特別の教育課程」による日本語指導の制度を整備するなど、多様な児童生徒に応じた支援を行っている。\n\n問1 文章中の下線部Aに関して、令和3年度の調査における日本語指導が必要な外国籍児童生徒の母語に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["英語が最も多い。","中国語が最も多い。","ベトナム語が最も多い。","ポルトガル語が最も多い。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"令和3年度の文部科学省調査では、日本語指導が必要な外国籍児童生徒の母語別人数は、ポルトガル語が最も多く、次いで中国語、フィリピノ語、スペイン語、ベトナム語などが続きます。"},

{id:"R4-III-16-2", tag:"R4 試験III 問題16 問2", cat:"日本語指導が必要な日本国籍児童生徒数",
 text:"問2 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["1,000人","5,000人","10,000人","30,000人"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"令和3年度の調査では、日本語指導が必要な日本国籍の児童生徒数は約10,000人(正確には約10,000人強)と、外国籍児童生徒(約48,000人)よりかなり少ない規模です。"},

{id:"R4-III-16-3", tag:"R4 試験III 問題16 問3", cat:"外国籍の子どもの就学",
 text:"問3 文章中の下線部Bに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["授業料の負担はあるが、日本人の子どもと同様に教育を受けることができる。","教科書代の負担はあるが、日本人の子どもと同様に教育を受けることができる。","授業料や教科書代等を負担すれば、日本人の子どもと同様に教育を受けることができる。","授業料や教科書代等の負担なく、日本人の子どもと同様に教育を受けることができる。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"外国籍の子どもが就学を希望する場合、日本人の子どもと同様に、授業料は無償、教科書も無償で給与されるなど、負担なく公立の義務教育を受けることができます。"},

{id:"R4-III-16-4", tag:"R4 試験III 問題16 問4", cat:"JSLカリキュラム",
 text:"問4 文章中の下線部C「JSLカリキュラム」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習指導要領に基づいた学習内容を配列し直し、指導の順序を提示している。","日本語指導と教科指導を統合し、学習活動に参加する力の育成を目指している。","それぞれの子どもの実態を把握するための形成的評価の必要性を示している。","具体物や子どもの直接的体験に基づいて、学習内容の理解を図るようにしている。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"JSLカリキュラムは、教科の系統性に沿って学習内容を配列し直した固定的な指導順序を示すものではなく、個々の子どもの日本語力や学習経験に応じて、体験や活動を通じて学習活動に参加する力を育てることを重視する、柔軟な考え方に基づくカリキュラムです。したがって1が不適当な記述です。"},

{id:"R4-III-16-5", tag:"R4 試験III 問題16 問5", cat:"「特別の教育課程」による日本語指導",
 text:"問5 文章中の下線部D「「特別の教育課程」による日本語指導」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["在籍する学年は、当該児童生徒の年齢に合わせるように指定されている。","授業時間数は、当該児童生徒の実態に応じて設定することが認められている。","日本語指導担当教員は、教員免許を取得していることが推奨されている。","日本語指導は、当該児童生徒の在籍学校で行うように定められている。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「特別の教育課程」による日本語指導では、年間の授業時数を児童生徒一人ひとりの日本語習得状況に応じて柔軟に設定することが認められています。在籍学年は年齢に機械的に合わせるとは限らず、指導は在籍校だけでなく拠点校方式など他校で行う場合もあり、担当教員に教員免許取得を一律に推奨する規定でもありません。"},

/* ========= データ (令和5年度 試験I 問題1) ========= */
{id:"R5-1-1", tag:"R5 試験I 問題1(1)", cat:"摩擦音",
 text:"次の(1)〜(15)について、【 】内に示した観点から見て、他と性質の異なるものを、それぞれ1〜5の中から一つずつ選べ。\n\n(1) 【摩擦音】",
 choices:["[r]","[s]","[ʑ]","[h]","[ð]"], answer:0,
 explain:"[s]・[ʑ]・[h]・[ð]は、調音器官が狭められることで乱気流を生じさせる摩擦音です。一方[r]は舌先を弾く、または接近させて出す弾き音・接近音であり、摩擦を伴わない点で調音法が異なります。"},

{id:"R5-1-2", tag:"R5 試験I 問題1(2)", cat:"促音の調音法",
 text:"(2) 【促音の調音法】",
 choices:["キック","ゴッホ","トップ","ホット","ラッパ"], answer:1,
 explain:"キック・トップ・ホット・ラッパの促音「っ」は、後続が閉鎖音([k][p][t])であるため、声道を完全に閉じて息を止める「無音の閉鎖」として実現されます。一方「ゴッホ」の促音は後続が摩擦音[h]であるため、閉鎖ではなく無声の摩擦を持続させる調音として実現され、他と調音法が異なります。"},

{id:"R5-1-3", tag:"R5 試験I 問題1(3)", cat:"複合名詞のアクセント",
 text:"(3) 【複合名詞のアクセント】",
 choices:["チーズかまぼこ","クラブ活動","幼児教育","宇宙開発","整理整頓"], answer:4,
 explain:"チーズかまぼこ・クラブ活動・幼児教育・宇宙開発は、後部要素の先頭付近にアクセント核が置かれる複合語アクセントの規則的なパターンに従います。一方「整理整頓」は四字熟語的な語であり、他と同じ規則的な下がり目の位置を持たない点で異なります。"},

{id:"R5-1-4", tag:"R5 試験I 問題1(4)", cat:"連声の有無",
 text:"(4) 【連声の有無】",
 choices:["隠密","経年","出納","反応","珍味"], answer:3,
 explain:"隠密(おんみつ)・経年(けいねん)・出納(すいとう)・珍味(ちんみ)は、各字の音読みをそのまま組み合わせた読み方で、音変化(連声)を伴いません。一方「反応」は、「反(はん)」+「応(おう)」という本来母音で始まる後部要素の前で、前部要素の撥音「ん」の影響により鼻音が挿入され「はんのう」となる連声を起こしている点で、他と性質が異なります。"},

{id:"R5-1-5", tag:"R5 試験I 問題1(5)", cat:"音読み・訓読み",
 text:"(5) 【音読み・訓読み】",
 choices:["二個(にこ)","三個(さんこ)","四個(よんこ)","五個(ごこ)","九個(きゅうこ)"], answer:2,
 explain:"二個(に)・三個(さん)・五個(ご)・九個(きゅう)は、いずれも数字を音読みで読んでいます。一方「四個」は「よんこ」と訓読み(よん)で読まれており、音読みの「し」ではない点で他と異なります。"},

{id:"R5-1-6", tag:"R5 試験I 問題1(6)", cat:"漢字の字訓",
 text:"(6) 【漢字の字訓】",
 choices:["山","木","日","月","土"], answer:4,
 explain:"山(やま)・木(き)・日(ひ)・月(つき)は、いずれも和語の単純語として古くからの固有の訓を持つ基礎的な語ですが、「土(つち)」はここでは他と字訓の成り立ちの系統が異なるものとして扱われています。"},

{id:"R5-1-7", tag:"R5 試験I 問題1(7)", cat:"短い形の使役受身形の有無",
 text:"(7) 【短い形の使役受身形の有無】",
 choices:["話させられる","笑わせられる","泣かせられる","働かせられる","待たせられる"], answer:0,
 explain:"笑う・泣く・働く・待つのようなワ行・カ行・タ行五段動詞は、使役受身の短縮形(笑わされる・泣かされる・働かされる・待たされる)を作ることができます。一方サ行五段動詞の「話す」は、短縮形にすると「話さされる」のような不自然な形になるため、短い形の使役受身形を持たない点で異なります。"},

{id:"R5-1-8", tag:"R5 試験I 問題1(8)", cat:"動詞の意志性",
 text:"(8) 【動詞の意志性】",
 choices:["移る","去る","茂る","残る","回る"], answer:2,
 explain:"移る・去る・残る・回るは、人が主語となって意図的な動作として使うことができる(意志性を持ちうる)動詞です。一方「茂る」は植物が自然に生い茂ることを表す非意志的な動詞であり、人が意図的に「茂る」ことはできない点で異なります。"},

{id:"R5-1-9", tag:"R5 試験I 問題1(9)", cat:"接続詞の用法",
 text:"(9) 【接続詞の用法】",
 choices:["けれども","しかし","だが","でも","むしろ"], answer:4,
 explain:"けれども・しかし・だが・でもは、いずれも前件と対立する内容を導く逆接の接続詞です。一方「むしろ」は二つの事柄を比較して、より適切な方を選び取ることを示す副詞的な働きをし、単純な逆接ではない点で用法が異なります。"},

{id:"R5-1-10", tag:"R5 試験I 問題1(10)", cat:"「を」の用法",
 text:"(10) 【「を」の用法】",
 choices:["駅前の大通りを横切る。","川を泳いで対岸に渡る。","通行証のある車を通す。","廊下を走ってはいけない。","川の土手を散歩する。"], answer:2,
 explain:"「大通りを横切る」「川を泳いで渡る」「廊下を走る」「土手を散歩する」の「を」は、移動動詞に伴い、移動が行われる場所・経路を表します。一方「車を通す」の「を」は、他動詞「通す」の直接の対象(目的語)を表しており、経路ではない点で用法が異なります。"},

{id:"R5-1-11", tag:"R5 試験I 問題1(11)", cat:"「まで」の用法",
 text:"(11) 【「まで」の用法】",
 choices:["料理好きの姉は、チーズまで自分で作る。","私の姉は、会社まで自転車で通っている。","熱波のため、気温が38度まで上がった。","この店は、3か月後まで予約で埋まっている。","夢中になって、朝までゲームをしてしまった。"], answer:0,
 explain:"「会社まで」「38度まで」「3か月後まで」「朝まで」の「まで」は、場所・程度・時間の到達点を表します。一方「チーズまで自分で作る」の「まで」は、通常なら買ってくるようなものまで手作りするという極端な例を示す用法(「〜さえ」に近い)であり、到達点を表す用法とは異なります。"},

{id:"R5-1-12", tag:"R5 試験I 問題1(12)", cat:"「ておく」の用法",
 text:"(12) 【「ておく」の用法】",
 choices:["食事の間も、ずっと音楽を流しておく。","暖房をつけているので、窓を閉めておく。","試験があるので、教科書を見直しておく。","停車中も、車のエンジンを掛けておく。","留守の間も、玄関の明かりをつけておく。"], answer:2,
 explain:"「音楽を流しておく」「窓を閉めておく」「エンジンを掛けておく」「明かりをつけておく」の「ておく」は、ある行為によって生じた状態をそのまま持続させる用法です。一方「教科書を見直しておく」は、将来のために前もって準備をするという本来の「ておく」(事前準備)の用法であり、状態の維持ではない点で異なります。"},

{id:"R5-1-13", tag:"R5 試験I 問題1(13)", cat:"「ながら」の用法",
 text:"(13) 【「ながら」の用法】",
 choices:["りんご酒は、タンクの中でぶくぶくと泡を出しながら、発酵し続けていた。","妹は、すし屋を開くという夢を胸に抱きながら、板前の修業に励んでいる。","関係機関や地域と連携しながら、新たな街づくりに取り組んでいきたい。","友好的な雰囲気を醸成しながら、信頼関係を構築することが重要である。","友人の家の前まで行きながら、謝る勇気がなくてそのまま帰ってきてしまった。"], answer:4,
 explain:"1〜4の「ながら」は、二つの動作・状態が同時に並行して起こることを表します。一方「行きながら」は、「行ったのに(謝らずに帰ってきた)」という逆接を表す用法であり、動作の並行ではない点で異なります。"},

{id:"R5-1-14", tag:"R5 試験I 問題1(14)", cat:"副詞的成分と述語の関係",
 text:"(14) 【副詞的成分と述語の関係】",
 choices:["花瓶が、粉々に砕け散った。","父は、牛肉を柔らかく煮込んだ。","私は、ハムと野菜をさっと炒めた。","パンが、ふっくら焼き上がった。","兄は、壁を波打つ模様に塗った。"], answer:2,
 explain:"「粉々に」「柔らかく」「ふっくら」「波打つ模様に」は、いずれも動作の結果として生じる状態(結果状態)を表す副詞的成分です。一方「さっと炒めた」の「さっと」は動作の速さ・様態を表しており、結果の状態ではなく動作そのものの様子を修飾する点で異なります。"},

{id:"R5-1-15", tag:"R5 試験I 問題1(15)", cat:"「については」の用法",
 text:"(15) 【「については」の用法】",
 choices:["この案件については、恐らく問題ありません。","講演会の会場については、まだ設営が終わっていません。","この皮の納品については、ご迷惑をお掛けいたしました。","その容疑者の身辺については、現在調べています。","こちらの商品については、皆様にご好評いただいております。"], answer:3,
 explain:"1・2・3・5の「については」に続く述語は、話題として提示された事柄についての話者の評価や状況を述べています。一方「現在調べています」は、その事柄を対象として進行中の動作(調査)を表しており、評価や状況の説明ではない点で異なります。"},

/* ========= データ (令和5年度 試験I 問題2) ========= */
{id:"R5-2-1", tag:"R5 試験I 問題2(1)", cat:"誤用の分析(発音:清濁)",
 text:"次の(1)〜(5)における【 】内の下線部は学習者による誤用を示す。これと異なる種類の誤用を、それぞれ1〜4の中から一つずつ選べ。必要に応じて( )内に学習者の意図を示す。\n\n(1) 【「外国」のつもりが「開国」と聞こえる。】",
 choices:["「代行」のつもりが「対抗」と聞こえる。","「原稿」のつもりが「健康」と聞こえる。","「伝統」のつもりが「店頭」と聞こえる。","「部長」のつもりが「不調」と聞こえる。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"外国(がいこく)→開国(かいこく)、代行(だいこう)→対抗(たいこう)、原稿(げんこう)→健康(けんこう)、伝統(でんとう)→店頭(てんとう)は、いずれも「が行→か行」「だ行→た行」のような、調音法が同じ有声阻害音から無声阻害音への清濁の誤り(声帯振動の有無のみの違い)です。一方「部長(ぶちょう)→不調(ふちょう)」の「ば行→は行」は、単純な清濁対立([b]→[p]ではなく[b]→[h])ではなく調音法自体も変わる誤りであり、他とは異なる種類です。"},

{id:"R5-2-2", tag:"R5 試験I 問題2(2)", cat:"誤用の分析(発音:直音の拗音化)",
 text:"(2) 【「失礼します。」と言おうとして「しちゅれいします。」と発音する。】",
 choices:["「左でございます。」と言おうとして「左でごじゃいます。」と発音する。","「ご注意ください。」と言おうとして「ごじゅういください。」と発音する。","「どうぞこちらへ。」と言おうとして「どうじょこちらへ。」と発音する。","「当然です。」と言おうとして「とうじぇんです。」と発音する。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"失礼(しつれい)→しちゅれい、左でございます→左でごじゃいます、どうぞ→どうじょ、当然(とうぜん)→とうじぇんは、いずれも直音(つ・ざ・ぞ・ぜ)が拗音(ちゅ・じゃ・じょ・じぇ)に置き換わる誤りです。一方「ご注意(ちゅうい)ください→ごじゅういください」は、拗音の子音部分が無声から有声に変わる(ち→じ)清濁の誤りであり、直音の拗音化とは異なる種類です。"},

{id:"R5-2-3", tag:"R5 試験I 問題2(3)", cat:"誤用の分析(語彙:形容詞の意味領域)",
 text:"(3) 【公園で、古い人が楽しそうに話しています。】",
 choices:["この学校の図書館には、多い本があります。","天気予報によると、明日は重い雨だそうです。","私の家は、忙しい通りに面しています。","寒い飲み物をたくさん飲むのは、体に悪いです。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"「重い雨」「忙しい通り」「寒い飲み物」は、いずれも本来別の形容詞(激しい・にぎやかな・冷たい)を使うべきところに、意味領域の異なる形容詞を当てはめてしまった語彙選択の誤りです。一方「多い本があります」は、「多い」という形容詞自体は適切でも、本来は「たくさんの本」のように連体修飾には使えない語を無理に名詞の前に置いてしまった、語の文法的な使い方(付加語用法の制限)に関する誤りであり、種類が異なります。"},

{id:"R5-2-4", tag:"R5 試験I 問題2(4)", cat:"誤用の分析(文法:「なくて」と「ないで」)",
 text:"(4) 【朝ご飯を食べなくて、会社に行きました。】",
 choices:["最後まで諦めなくて、頑張ろう。","挨拶をしなくて、帰りました。","バスが来なくて、歩いて帰ろう。","ガスを使わなくて、料理をしました。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「朝ご飯を食べなくて」「諦めなくて」「挨拶をしなくて」「ガスを使わなくて」は、本来「〜ないで」で表すべき付帯状況(〜しない状態で)の意味を、理由を表す「〜なくて」で誤って表現したものです。一方「バスが来なくて、歩いて帰ろう」の「なくて」は、「バスが来なかったので」という理由を正しく表しており、誤用ではない点で他と異なります。"},

{id:"R5-2-5", tag:"R5 試験I 問題2(5)", cat:"誤用の分析(語彙:定義の誤り)",
 text:"(5) 【「理解」とは、分かっている意味です。】",
 choices:["「遅刻」とは、時間に遅れる意味です。","「いななく」とは、馬が鳴く意味です。","「教授」とは、教え授ける意味です。","「お前」とは、呼んでいる意味です。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"「遅刻」「いななく」「教授」は、いずれもその語が表す行為や動作の内容を適切に言い換えて説明できています。一方「お前」は相手を指す代名詞であって「呼ぶ」という行為そのものを表す語ではなく、語の意味の種類(人を指す語か、行為を表す語か)を取り違えている点で他とは異なる誤りです。"},

/* ========= データ (令和5年度 試験I 問題3) ========= */
{id:"R5-3-1", tag:"R5 試験I 問題3-A(1)", cat:"音声学:調音法",
 text:"次のA〜Dの文章を読み、(1)〜(20)の問いに答えよ。\n\nA 【子音と母音】\n言語音は、子音と母音に分類される。子音の発音に関わる調音法には様々なものがある。また、子音は様々な調音点で生成される。一方、母音の音は、舌の最高点の位置、口の開き具合、唇のまるめの有無によって規定される。ただし、「半母音」と呼ばれる音は、(ア)として子音の一つに位置付けられる。「半母音」は、「国際音声記号(IPA)2020年改訂版」において(イ)、[w]あるいは[ɰ]で表される音である。\nまた、日本語では様々な要因により、母音や子音が元の音から変化する現象が見られる。\n\n(1) 文章中の下線部A「子音の発音に関わる調音法」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本語の規範的な「タ」と「ツ」の子音の調音法は異なる。","日本語の規範的な「ナ」と「ヌ」の子音の調音法は異なる。","日本語の規範的な「ハ」と「フ」の子音の調音法は異なる。","日本語の規範的な「ラ」と「ル」の子音の調音法は異なる。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"「タ」の子音[t]は破裂音、「ツ」の子音[ts]は破擦音であり、調音法が異なります。「ナ」「ヌ」はともに鼻音、「ハ」「フ」はともに摩擦音、「ラ」「ル」はともに弾き音で、それぞれ調音法は同じです。"},

{id:"R5-3-2", tag:"R5 試験I 問題3-A(2)", cat:"音声学:調音点",
 text:"(2) 文章中の下線部B「様々な調音点」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本語の規範的な「カ」の子音の調音点は、咽頭である。","日本語の規範的な「ナ」の子音の調音点は、硬口蓋である。","日本語の規範的な「マ」の子音の調音点は、両唇である。","日本語の規範的な「ラ」の子音の調音点は、軟口蓋である。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「マ」の子音[m]は両唇音です。「カ」は軟口蓋音、「ナ」は歯茎音、「ラ」は歯茎音であり、それぞれ選択肢に示された調音点とは異なります。"},

{id:"R5-3-3", tag:"R5 試験I 問題3-A(3)", cat:"音声学:母音の性質",
 text:"(3) 文章中の下線部C「舌の最高点の位置、口の開き具合」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本語の規範的な「イ」は、舌の前部が高く、口の開きが狭い母音である。","日本語の規範的な「ウ」は、舌の後部が高く、口の開きが広い母音である。","日本語の規範的な「エ」は、舌の後部が高く、口の開きが狭い母音である。","日本語の規範的な「オ」は、舌の前部が高く、口の開きが広い母音である。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"「イ」は前舌・狭母音で、記述の通りです。「ウ」は後寄り(中舌寄り)ですが口の開きは狭く「広い」ではありません。「エ」は前舌の中母音、「オ」は後舌の中母音であり、それぞれ記述と食い違います。"},

{id:"R5-3-4", tag:"R5 試験I 問題3-A(4)", cat:"音声学:半母音・接近音",
 text:"(4) 文章中の(ア)と(イ)に入れるのに最も適当な組合せを、次の1〜4の中から一つ選べ。",
 choices:["(ア)接近音 (イ)[y]","(ア)入破音 (イ)[y]","(ア)接近音 (イ)[j]","(ア)入破音 (イ)[j]"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"半母音は調音的には狭めが弱く摩擦を伴わない「接近音」に分類されます。また半母音のヤ行子音はIPAで[j]と表記され、[y]は円唇前舌狭母音を表す記号であるため誤りです。"},

{id:"R5-3-5", tag:"R5 試験I 問題3-A(5)", cat:"音声学:音韻変化の種類",
 text:"(5) 文章中の下線部D「母音や子音が元の音から変化する現象」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「格好」と「面倒」は、語の内部で促音化が起こっている。","「酒屋」と「白樺」は、語の内部で音韻交替が起こっている。","「春雨」と「風上」は、語の内部で音の添加が起こっている。","「期限」と「長靴」は、語の内部で連濁が起こっている。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「酒屋」は「酒(さけ)」の「け」が「か」に、「白樺」は「白(しろ)」の「ろ」が「ら」に変わっており、いずれも複合語内部での母音交替(音韻交替)の例です。他の組合せは、それぞれ促音化・音の添加・連濁の説明として語の組合せが適切ではありません。"},

{id:"R5-3-6", tag:"R5 試験I 問題3-B(6)", cat:"文法:格助詞「が」",
 text:"B 【格助詞の用法】\n日本語の格助詞には様々な用法がある。そのうち格助詞「が」の主要な用法は主格標示である。単文における主格標示「が」の主な用法は次の二つである。一つは、文全体を焦点とする「中立叙述」の用法、もう一つは、その文の焦点となるものを「が」で標示する「総記」の用法である。このほかにも、文や節・句における格助詞「が」の使い方には様々な特徴がある。\n学習者の誤用に目を向けると、「太郎が帰ってきたら夕食にしよう。」のように、「が」を用いるべきところに「は」を用いる誤用が見られる。また、話し言葉では「が」は省略されることが多い。同様に、(ア)や、着点・方向を表す(イ)も省略され得る。\n\n(6) 文章中の下線部A「格助詞「が」」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["色を変えたほうがきれいだろう。","名前を呼んだが全然返事がない。","私はとても面白いと思うが。","何があろうが私は諦めない。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"「色を変えたほうが」の「が」は「ほう」という名詞句の主格を示す格助詞です。他の選択肢の「が」は、逆接や譲歩を表す接続助詞的な用法であり、格助詞ではありません。"},

{id:"R5-3-7", tag:"R5 試験I 問題3-B(7)", cat:"文法:中立叙述と総記",
 text:"(7) 文章中の下線部B「中立叙述」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["X:腰が痛くて重い物は持てないんですよ。\nY:では、こちらのかばんがおすすめですよ。","X:段ボールをリサイクルに出したいんだけど…。\nY:ああ、それなら金曜日が回収日だよ。","X:お店に予約の電話を入れておいてくれる?\nY:うん。あれ、携帯電話がない。","X:来期の企画の責任者は決まりましたか?\nY:はい。確か、佐藤さんが責任者です。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「携帯電話がない」は、複数の候補から一つを選び出す総記ではなく、単にある事態(携帯電話が見当たらないという状況)をそのまま述べる中立叙述です。他の選択肢は、いずれも複数の候補の中から特定のものを取り立てて答える総記の用法です。"},

{id:"R5-3-8", tag:"R5 試験I 問題3-B(8)", cat:"文法:格助詞「が」の特殊な用法",
 text:"(8) 文章中の下線部Cに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["受身文において動作主を標示することがある。","使役文において被使役者を標示することがある。","ガ格名詞句の主題化において「は」に前接することがある。","名詞修飾節内において「の」に置き換えられることがある。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"名詞修飾節(連体修飾節)内では、主格の「が」が「の」に置き換えられる、いわゆる「ガノ交替」が見られます(例:「私が/の書いた本」)。受身文の動作主は通常「に」、使役文の被使役者は「に」や「を」で標示され、ガ格の主題化は「が」が「は」に置き換わるものであって「は」に前接するという記述は不適当です。"},

{id:"R5-3-9", tag:"R5 試験I 問題3-B(9)", cat:"文法:従属節内の「は」の誤用",
 text:"(9) 文章中の下線部Dに関して、この例と同じ原因による「は」の誤用として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["あっ、財布は落ちている。","どの料理はおいしかったですか。","高橋さんではなく佐藤さんは来ました。","道は混んでいたので遅れました。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"下線部Dの例は、条件節(「〜たら」節)という従属節内では主題化の「は」ではなく「が」を用いるべきところに、誤って「は」を使ったものです。「道は混んでいたので」も、理由を表す従属節(「ので」節)内で「が」を使うべきところに「は」を使っており、同じ原因の誤りです。他の選択肢は、疑問詞への「は」の付加や対比・総記の文脈での誤りなど、原因が異なります。"},

{id:"R5-3-10", tag:"R5 試験I 問題3-B(10)", cat:"文法:格助詞の省略",
 text:"(10) 文章中の(ア)と(イ)に入れるのに最も適当な組合せを、次の1〜4の中から一つ選べ。",
 choices:["(ア)「を」 (イ)「に」・「で」","(ア)「を」 (イ)「に」・「へ」","(ア)「を」・「と」 (イ)「に」・「で」","(ア)「を」・「と」 (イ)「に」・「へ」"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"話し言葉では、対象を表す「を」や、着点・方向を表す「に」「へ」も「が」と同様に省略されやすいとされます。「と」(引用・共同動作)や「で」(手段・場所)は、省略されると意味が取りにくくなるため、同列には扱われません。"},

{id:"R5-3-11", tag:"R5 試験I 問題3-C(11)", cat:"語彙論:派生語の接辞",
 text:"C 【語の体系】\n日本語において、語は様々な観点から分類できる。語構成の観点からは、一つの語基から成る単純語(例「山」)、二つ以上の語基から成る複合語(例「春雨」)、一つの語基に接辞が付いた派生語(例「自由化」)に分類できる。意味の観点からは単義語と多義語に分けられる。語の音形と意味の結び付きは、一般的に恣意的であるが、恣意的ではない場合もある。\n語は、他の語と関係を持ちながら体系を成している。例えば「犬」は、「柴犬」より意味が広く、「柴犬」を包摂する関係にある。このような関係において、「犬」を(ア)、「柴犬」を(イ)と呼ぶ。また、対義語には、程度性を持つ語と語の対立関係、一方の語が肯定されれば他方の語が否定される対立関係など、複数のタイプがある。\n\n(11) 文章中の下線部A「一つの語基に接辞が付いた派生語」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["接尾辞「さ」は、イ形容詞の辞書形に後接して名詞を作る。","接尾辞「み」は、イ形容詞とナ形容詞の語幹に後接して副詞を作る。","接尾辞「上」は、名詞に後接してイ形容詞を作る。","接尾辞「的」は、名詞に後接してナ形容詞を作る。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"接尾辞「的」は、「科学的」「文化的」のように名詞に付いてナ形容詞(形容動詞)を作ります。「さ」はイ形容詞の語幹(辞書形ではない)に付いて名詞を作り、「み」は名詞を作り、「上」は「教育上」のように名詞を作るため、それぞれ記述が誤りです。"},

{id:"R5-3-12", tag:"R5 試験I 問題3-C(12)", cat:"語彙論:単義語と多義語",
 text:"(12) 文章中の下線部B「単義語と多義語」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["多義語の複数の意味は、互いに関連を持っている。","活用形の違いにより、多義語の意味の違いが示される。","使用頻度の高い基本的な語には、単義語が多い。","科学的な専門用語には、多義語が多い。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"多義語は、複数の意味が互いに関連し合っている(共通の中心的意味からの派生・拡張が見られる)点で、無関係な意味が同じ形にたまたま結びつく同音異義語と区別されます。使用頻度の高い基本語ほど多義的になりやすく、専門用語は意味を一つに限定するため単義語が多い傾向があります。"},

{id:"R5-3-13", tag:"R5 試験I 問題3-C(13)", cat:"語彙論:オノマトペと有縁性",
 text:"(13) 文章中の下線部Cの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["機能語","擬音語","指示語","屈折語"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"擬音語(オノマトペ)は、音形とそれが表す意味との間に有縁性(自然な結びつき)が感じられる、恣意的ではない語の代表例です。"},

{id:"R5-3-14", tag:"R5 試験I 問題3-C(14)", cat:"語彙論:上位語・下位語",
 text:"(14) 文章中の(ア)と(イ)に入れるのに最も適当な組合せを、次の1〜4の中から一つ選べ。",
 choices:["(ア)同位語 (イ)位相語","(ア)位相語 (イ)同位語","(ア)上位語 (イ)下位語","(ア)下位語 (イ)上位語"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「犬」は「柴犬」より意味範囲が広く、「柴犬」を包摂する上位語であり、「柴犬」は「犬」に包摂される下位語です。"},

{id:"R5-3-15", tag:"R5 試験I 問題3-C(15)", cat:"語彙論:対義語の種類",
 text:"(15) 文章中の下線部D「一方の語が肯定されれば他方の語が否定される対立関係」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["明るい ― 暗い","上手だ ― 下手だ","出席 ― 欠席","売る ― 買う"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「出席」と「欠席」は、一方が成り立てば他方は必ず成り立たない相補的対義語(矛盾対義語)です。「明るい―暗い」「上手だ―下手だ」は程度差を持つ対義語、「売る―買う」は視点の違いによる相対的対義語であり、性質が異なります。"},

{id:"R5-3-16", tag:"R5 試験I 問題3-D(16)", cat:"文法論:文の分類",
 text:"D 【文の分類】\n日本語の文は、「あっ!」のように述語を持たない独立語文と、述語を持つ述語文に分けられる。日本語で述語になるのは、基本的に動詞・(ア)である。さらに、述語文は単文と複文に分けられる。\n文は、情報を伝達する文と、話し手と聞き手の行為に関わる文に分けることもできる。情報を伝達する文では、様々な言語形式を用いて話し手の認識を表現する。また、出来事に対する話し手の認識を予告する機能を持つモダリティの副詞が用いられることもある。\n一方、話し手と聞き手の行為に関わる文には、話し手の意志を述べる文のほか、聞き手に対し許可を求める文や依頼する文もある。\n\n(16) 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["イ形容詞・ナ形容詞・「名詞+だ」","イ形容詞・ナ形容詞・連体詞","「イ形容詞+だ」・ナ形容詞・感動詞","「イ形容詞+だ」・ナ形容詞・接続詞"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"日本語で述語になれるのは、動詞・イ形容詞・ナ形容詞・「名詞+だ」の四種類です。連体詞・感動詞・接続詞は述語になりません。"},

{id:"R5-3-17", tag:"R5 試験I 問題3-D(17)", cat:"文法論:単文と複文",
 text:"(17) 文章中の下線部A「単文」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["今年の夏は例年より台風が多かったように思う。","祖父の米寿のお祝いが3日後に迫ってきています。","毎朝公園で体操をするのが私の10年来の習慣です。","この意見に賛成の人もいれば反対の人もいる。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「祖父の米寿のお祝いが3日後に迫ってきています。」は述語(節)が一つだけの単文です。他の選択肢は、いずれも「〜ように思う」「〜のが習慣だ」「〜もいれば〜もいる」のように節を埋め込んだ複文です。"},

{id:"R5-3-18", tag:"R5 試験I 問題3-D(18)", cat:"文法論:モダリティ形式",
 text:"(18) 文章中の下線部B「様々な言語形式」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「〜するそうだ」は、証拠や観察に基づく判断であることを示す形式である。","「〜するだろう」は、推量に基づく判断であることを示す形式である。","「〜するはずだ」は、根拠のない推測に基づく判断であることを示す形式である。","「〜するようだ」は、想像に基づく判断であることを示す形式である。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「〜するだろう」は話し手の推量に基づく判断を表す形式です。「そうだ」は伝聞・様態(証拠に基づく観察ではなく多くは伝聞情報)、「はずだ」はむしろ根拠のある推測、「ようだ」は感覚的な観察に基づく判断を表すため、それぞれ記述が不適当です。"},

{id:"R5-3-19", tag:"R5 試験I 問題3-D(19)", cat:"文法論:呼応の副詞",
 text:"(19) 文章中の下線部C「出来事に対する話し手の認識を予告する機能を持つモダリティの副詞」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ちょっと","甚だ","きっと","かなり"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「きっと」は、後に「だろう」「に違いない」のような推量表現を予告的に伴う、呼応の副詞(モダリティ副詞)です。「ちょっと」「甚だ」「かなり」は程度を表す副詞であり、話し手の認識のあり方を予告する機能は持ちません。"},

{id:"R5-3-20", tag:"R5 試験I 問題3-D(20)", cat:"文法論:許可・依頼の文型",
 text:"(20) 文章中の下線部D「許可を求める文や依頼する文」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「お/ご+動詞の連用形+ください」は、話し手が聞き手に許可を求める文になる。","「動詞の受身形+てください」は、話し手が聞き手に許可を求める文になる。","「〜てくれる」の意向形は、聞き手にある行為を依頼する文になる。","「〜てもらう」の可能形の疑問文は、聞き手にある行為を依頼する文になる。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"「〜てもらえますか/てもらえませんか」のような「てもらう」の可能形の疑問文は、聞き手にある行為をしてもらうよう依頼する典型的な文型です。「お/ご+連用形+ください」は許可を求める文ではなく聞き手への依頼・指示の文であり、他の選択肢の形式も記述と合いません。"},

/* ========= データ (令和5年度 試験I 問題4) ========= */
{id:"R5-4-1", tag:"R5 試験I 問題4 問1", cat:"教材論:目標言語調査",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語コースの主教材は、学習者に合わせて教師が作成するのが望ましい。主教材は、ニーズ分析や目標言語調査に基づいて作成する。優れた教材を効果的・効率的に開発していくためには、「(ア)」と言うプロセスを組み込むことが有効である。\n市販の教科書を使用する場合は、コースで設定したシラバスやカリキュラムに合ったものを選定することが重要である。教科書にある練習を補うための補助教材としては、インフォメーション・ギャップを取り入れたタスクシートなどがよく使用される。また、実践的な日本語運用能力を養成するには、生教材の使用が効果的である。\n\n問1 文章中の下線部A「目標言語調査」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者が日本語を学ぶ際の目標や言語学習に対する適性を調べる調査","学習者が日本語を必要とする場面における実際の言語運用を調べる調査","学習者が既に持っている日本語に関する知識や学習経験を調べる調査","学習者が学んだ教科書で扱われていた言語項目とその配列を調べる調査"], answer:1,
 explain:"目標言語調査とは、学習者が目標言語(日本語)を実際にどのような場面でどう使う必要があるかという、目標言語使用の実態を調べる調査です。学習者の適性や既有知識、既習教科書の内容を調べるものではありません。"},

{id:"R5-4-2", tag:"R5 試験I 問題4 問2", cat:"教材論:教材開発のプロセス",
 text:"問2 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["Plan - Do - See","Practices - Products - Perspectives","プレゼンテーション ― コンサート ― 実践","前作業 ― 本作業 ― 後作業"], answer:0,
 explain:"教材を効果的・効率的に開発するには、計画(Plan)・実施(Do)・振り返り(See)という循環的なプロセスを組み込むことが有効とされます。"},

{id:"R5-4-3", tag:"R5 試験I 問題4 問3", cat:"教材論:シラバスの種類",
 text:"問3 文章中の下線部B「シラバス」のうち、機能シラバスによる教材の目次の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「私の家族」「好きなこと」「食べ物」","「駅で」「レストランで」「郵便局で」","「メニューを読む」「メールを読む」「広告を読む」","「依頼する」「誘う」「謝る」"], answer:3,
 explain:"機能シラバスは、依頼・勧誘・謝罪のような言語の働き(言語機能)を単位に構成されるシラバスです。「私の家族」などはトピックシラバス、「駅で」などは場面シラバス、「メニューを読む」などはタスク(技能)シラバスの例です。"},

{id:"R5-4-4", tag:"R5 試験I 問題4 問4", cat:"教材論:インフォメーション・ギャップ",
 text:"問4 文章中の下線部C「インフォメーション・ギャップを取り入れたタスクシート」を用いたペア活動の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["お互いの家族写真を一緒に見ながら、家族について紹介し合う。","間違い探しに用いる2枚の絵を一緒に見ながら、違う点を指摘し合う。","架空の町の地図を一緒に見ながら、駅への道順について確認し合う。","パーティーのイラストを一緒に見ながら、出席者が何をしているかを質問し合う。"], answer:0,
 explain:"自分の家族写真は相手が知らない情報であるため、それぞれが自分の写真について話すことで、互いに知らない情報を伝え合う本来のインフォメーション・ギャップが生まれます。他の選択肢は、同じ絵や地図を最初から一緒に見ている(情報がすでに共有されている)ため、情報の差(ギャップ)が生じにくい活動です。"},

{id:"R5-4-5", tag:"R5 試験I 問題4 問5", cat:"教材論:生教材使用の留意点",
 text:"問5 文章中の下線部D「生教材の使用」の際の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["初級レベルでテレビ番組を使用する場合、スキーマを活性化しやすい内容は避け、学習者が先入観を持たないようにする。","初級レベルで公共交通機関のアナウンスを使用する場合、前作業を十分に行い、場所や時間など必要な情報が聞き取れるようにする。","上級レベルで日本の映画を使用する場合、日本語の字幕の提示は避け、学習者に言語処理の負荷が掛からないようにする。","上級レベルでラジオ番組を使用する場合、ポーズや言い換えが多く含まれているものを選択し、聴解の難易度が上がるようにする。"], answer:1,
 explain:"初級学習者に生教材(公共交通機関のアナウンスなど)を使わせる際は、聞き取るべき情報を絞り込むなどの前作業(プレタスク)を十分に行い、必要な情報を無理なく聞き取れるように支援することが重要です。スキーマ活性化はむしろ理解を助けるため避けるべきではなく、上級者向けでも字幕を一律に排除したり、あえて難易度を上げたりすることは適切な留意点とは言えません。"},

/* ========= データ (令和5年度 試験I 問題5) ========= */
{id:"R5-5-1", tag:"R5 試験I 問題5 問1", cat:"評価法:熟達度テストと到達度テスト",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n学習者の日本語能力を測る方法の一つにテストがある。テストは、その目的によって熟達度テスト(proficiency test)と到達度テスト(achievement test)に分けられる。\n日本語プログラム内やクラス内で行うテストを設計する際は、測定する能力などをまとめたテストの細目表を作る。そして、細目表を参照しながら問題を作成する。その際には、妥当性や信頼性を損なう行為を避けるよう注意する。さらに、テストの実用性や波及効果といった要素も考慮する必要がある。テストを実施したらS-P表などの図表を用いて結果を可視化し、改良につなげることも重要である。\n\n問1 文章中の下線部A「熟達度テスト」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["成績を付けたり、指導が適切だったかを検証したりするのに生かせる。","設定された学習内容について、学習者がどの程度習得したかを判定する。","出題範囲があらかじめ指定されず、幅広い難易度や領域から出題される。","目標に準拠した絶対評価はできないが、受験者集団に準拠した相対評価はできる。"], answer:2,
 explain:"熟達度テストは、特定の授業やコースの学習内容にとらわれず、学習者の現時点での総合的な言語運用能力を測るため、出題範囲があらかじめ限定されず幅広い難易度・領域から出題されます。成績評価や指導の検証、特定学習内容の習得判定は到達度テストの役割であり、熟達度テストでも目標準拠(絶対評価)的な運用は可能なため、他の記述は不適当です。"},

{id:"R5-5-2", tag:"R5 試験I 問題5 問2", cat:"評価法:テスト細目表",
 text:"問2 文章中の下線部B「テストの細目表を作る」利点として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["他の教師と共有することで、複数の教師で分担してテストを作れる。","テストの全体像が把握しやすく、出題内容に偏りがないか確認できる。","学習者にあらかじめ渡しておくと、学習者はテスト準備のガイドラインにできる。","テストを実施したあと、各問題の識別力を算出するためのデータにできる。"], answer:3,
 explain:"各問題の識別力は、実際にテストを実施して得られた受験者の得点データを統計的に分析することで算出されるものであり、テスト実施前に作成する細目表そのものから得られる情報ではありません。細目表は、教師間の分担や全体像の把握、学習者への事前提示によるガイドラインとしての利点があります。"},

{id:"R5-5-3", tag:"R5 試験I 問題5 問3", cat:"評価法:信頼性",
 text:"問3 文章中の下線部C「信頼性を損なう行為」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者全員が共有する題材を問題に用いる。","個々の学習者に応じて採点方法を変える。","多肢選択問題を採用する場合は出題数を増やす。","採点者間で採点過程や結果を一致させる調整を行う。"], answer:1,
 explain:"採点方法を学習者ごとに変えてしまうと、同じ能力でも学習者によって評価結果が変わってしまい、測定の一貫性(信頼性)が損なわれます。共有題材の使用、出題数の増加、採点者間の調整(採点者間信頼性の確保)は、いずれもむしろ信頼性を高める方向に働く行為です。"},

{id:"R5-5-4", tag:"R5 試験I 問題5 問4", cat:"評価法:実用性と波及効果",
 text:"問4 文章中の下線部D「実用性や波及効果」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["実用性には、テストの受験が学習者の学習意欲に与える影響が含まれる。","実用性には、テストが測るべき能力を実際に測れているかどうかが含まれる。","波及効果には、テストの出題内容に合わせて教師が指導法を変えることが含まれる。","波及効果には、テストの出題範囲が授業目標に合致しているかどうかが含まれる。"], answer:2,
 explain:"波及効果(washback)とは、テストが実施されることで教育・学習に及ぼす影響のことで、テスト内容に合わせて教師が指導法を変えることはその典型例です。学習意欲への影響は波及効果に、測定したい能力を実際に測れているかは妥当性に、出題範囲と授業目標の合致は妥当性に関わる事柄であり、それぞれ記述が入れ替わっています。"},

{id:"R5-5-5", tag:"R5 試験I 問題5 問5", cat:"評価法:S-P表",
 text:"問5 文章中の下線部E「S-P表」は次のような表である。この表の数字に計算を加えることなく得られる情報は何か。最も適当なものを、下の1〜4の中から一つ選べ。",
 image:"images/R5_1-5_5_table.jpg",
 choices:["各学習者の各質問項目の得点とテスト全体の得点との相関関係が分かる。","各質問項目について成績上位群と下位群の正答率の差が分かる。","各質問項目が全体として同一の特性を測定しているかどうかが判断できる。","全体の傾向とは性質の異なる質問項目や学習者を見つけることができる。"], answer:3,
 explain:"S-P表は、学習者を得点順、問題を正答者数順に並べ替え、境界線(S曲線・P曲線)を引くことで、境界線から大きく外れる(全体の傾向と異なる反応を示す)学習者や質問項目を、計算をしなくても視覚的に見つけ出せる図表です。相関係数や識別力指数、項目の一次元性の判断には、別途統計的な計算が必要です。"},

/* ========= データ (令和5年度 試験I 問題6) ========= */
{id:"R5-6-1", tag:"R5 試験I 問題6 問1", cat:"教授法:内容重視の指導法(CBI)",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n外国語教育の教授法は時代によって変化する。オーディオ・リンガル・メソッド、コミュニカティブ・アプローチを経て、1980年代にはアメリカで内容重視の指導法(CBI)が体系化された。その流れを受け、カナダではイマージョン教育が生まれ、成果を上げた。\n内容を重視した方法には、ほかに1990年代にヨーロッパで生まれた内容言語統合型学習(CLIL)がある。その特徴は、Content(内容)、Communication(言語知識・言語使用)、Cognition(思考)、(ア)という四つの概念(4C)に沿って、計画的に内容・方法・教材を検討し、実施する点にある。また、CLILでは、スキャフォールディングなど六つの特徴の下に、指導法が具体的に示されている。そのほかに、コミュニケーション重視の流れを受けて提唱されたタスク中心の教授法(TBLT)もある。\n\n問1 文章中の下線部A「内容重視の指導法」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["文法規則を示したあとに繰り返し練習し、最後にゲームやタスクで言語産出をする。","学習者が母語や目標言語で自由に話し、教師は耳元で目標言語での表現を教える。","言語形式とそれが使われる文脈を切り離さずに捉えて、教育活動を進めていく。","教科書を使用せずに教師はできるだけ沈黙し、学習者の能力を最大限引き出す。"], answer:2,
 explain:"内容重視の指導法(CBI)は、教科内容などの意味あるコンテンツを扱う文脈の中で言語形式を切り離さずに学ばせる点が特徴です。1は文法訳読的な流れ、2はコミュニティ・ランゲージ・ラーニング、4はサイレント・ウェイの説明であり、CBIとは異なります。"},

{id:"R5-6-2", tag:"R5 試験I 問題6 問2", cat:"教授法:イマージョン教育",
 text:"問2 文章中の下線部B「イマージョン教育」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["支援者に横に付いてもらいながら、目標言語の母語話者と同じ授業を受ける形態","目標言語が話せない状態で、目標言語の母語話者のクラスに入って一緒に学ぶ形態","特定の授業で、在籍するクラスとは別の場所に通級して目標言語を学ぶ形態","全員が非母語話者のクラスで、理科や数学などの教科を目標言語で学ぶ形態"], answer:3,
 explain:"イマージョン教育は、非母語話者の学習者だけのクラスで、理科や数学などの教科内容を目標言語を媒体として学ぶことで、目標言語に「浸る(immerse)」教育形態です。母語話者と同じクラスに入る形態(1・2)や、取り出し授業の形態(3)とは異なります。"},

{id:"R5-6-3", tag:"R5 試験I 問題6 問3", cat:"教授法:CLILの4C",
 text:"問3 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["Citizenship/Culture(市民性・異文化理解)","Community/Culture(協学・異文化理解)","Comparison/Culture(比較・異文化理解)","Criticism/Culture(批判・異文化理解)"], answer:1,
 explain:"CLILの4Cの枠組みは、Content・Communication・Cognition・Community(またはCulture)から成るとされます。"},

{id:"R5-6-4", tag:"R5 試験I 問題6 問4", cat:"教授法:スキャフォールディング",
 text:"問4 文章中の下線部C「スキャフォールディング」に関する指導法の記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者の持っている知識、技能、経験を生かす。","メディアなどで使われている最新の素材を生かす。","学習者に、目標言語を使う人と交流する機会を作る。","学習者が学習成果の到達度を評価する機会を作る。"], answer:0,
 explain:"スキャフォールディング(足場かけ)は、学習者が既に持っている知識・技能・経験を土台として、そこに新しい学びを積み上げられるよう支援する指導方法です。"},

{id:"R5-6-5", tag:"R5 試験I 問題6 問5", cat:"教授法:タスク中心の教授法(TBLT)",
 text:"問5 文章中の下線部D「タスク中心の教授法」の特徴として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["指導の焦点はタスクのプロセスではなく、達成できたかどうかという結果にある。","言語形式に焦点を当てながら目標言語を理解、操作、発話したりするタスクを行う。","タスクの難易度を決める要因は、タスク達成のために使用する語彙と文型の難しさの二つである。","タスクは、学習者の生活上の必要性に基づくものでも、教師の指導の目的に基づくものでもよい。"], answer:3,
 explain:"タスク中心の教授法(TBLT)におけるタスクは、学習者が実生活で必要とする実世界のタスクだけでなく、教室指導上の目的から考案された教育的タスクも含めて設計してよいとされます(Nunanの実生活タスク/教育的タスクの区別)。"},

/* ========= データ (令和5年度 試験I 問題7) ========= */
{id:"R5-7-1", tag:"R5 試験I 問題7 問1", cat:"ICT活用:ブレンディッド・ラーニング",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n近年、インターネットを活用するe-learningが日本語教育に取り入れられている。以前からブレンディッド・ラーニングの有用性は認められており、2020年以降多くの教育機関で対面授業だけではなく、オンライン授業も実施するようになった。オンライン授業には、リアルタイムで行う同期型と録画などを利用する非同期型がある。また、ハイフレックス型授業も行われている。\n授業にICTを取り入れる際には、動画サイトや学習支援サイト、SNSなどの中から適切なメディアを選択する必要がある。また、教師には著作権に関する十分な知識も求められる。\n\n問1 文章中の下線部A「ブレンディッド・ラーニング」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["オンライン教材を活用し、複数の技能を統合的に身に付ける学習形態","国内外の二つの大学から学位を得るため、オンラインで授業を受ける学習形態","インターネットを介し、母語の異なる二人が互いの母語や文化を学び合う学習形態","オンライン学習と対面学習を組み合わせ、相互補完的に活用する学習形態"], answer:3,
 explain:"ブレンディッド・ラーニングは、オンライン学習と対面(対面式)学習を組み合わせ、それぞれの利点を相互補完的に活用する学習形態を指します。"},

{id:"R5-7-2", tag:"R5 試験I 問題7 問2", cat:"ICT活用:非同期型オンライン授業",
 text:"問2 文章中の下線部B「非同期型」オンライン授業のメリットとして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["教師は学習者の活動や思考のプロセスに関し、詳細な情報を収集することができる。","学習者は同期型に比べ、時間に縛られない学習環境を確保することができる。","個別の質問にすぐ対応できるため、授業に対する学習者の満足度が高まりやすい。","ドリルの問題が決められた順番に提示されるため、学習項目が定着しやすい。"], answer:1,
 explain:"非同期型のオンライン授業は、録画された教材などを学習者が都合の良い時間に視聴できるため、時間的な制約を受けにくいという点が最大のメリットです。リアルタイムでの詳細な観察や即時の個別対応は、むしろ同期型授業の方が行いやすい特徴です。"},

{id:"R5-7-3", tag:"R5 試験I 問題7 問3", cat:"ICT活用:ハイフレックス型授業",
 text:"問3 文章中の下線部C「ハイフレックス型授業」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["知識導入のための動画を事前に視聴させ、教室では学習者同士の協働活動を中心に行う授業形態","授業前に動画視聴と確認テストを行い、その評価を基に教室で個別対応をする授業形態","教室にウェブカメラなどを設置し、対面授業とオンライン授業とを同時に行う授業形態","学習者が日常的に使用しているデジタル端末を、教室に持ち込んで使用させる授業形態"], answer:2,
 explain:"ハイフレックス型授業(HyFlex)は、教室にウェブカメラなどの機材を設置し、対面授業とオンライン授業を同時に(ハイブリッドに)行い、学習者が出席形態を柔軟に選べるようにする授業形態です。1・2は反転授業(フリップド・ラーニング)の説明であり、異なります。"},

{id:"R5-7-4", tag:"R5 試験I 問題7 問4", cat:"ICT活用:メディア選択の留意点",
 text:"問4 文章中の下線部D「適切なメディアを選択する」際の留意点として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["そのメディアが学習者の学習環境に合っているかどうかを精査する。","そのメディアが教育の目的や学習活動に適しているかどうかを判断する。","メディアを使用する際の予算の有無など、経済的、組織的条件を考慮する。","学習者のメディアに対する好みに左右されず、教育の効果を優先する。"], answer:3,
 explain:"メディア選択では、教育目的への適合性や学習環境、経済的・組織的条件を考慮することに加え、学習者がそのメディアに親しみを持てるかという受容性も重要な要素であり、学習者の好みを一切考慮しないという極端な姿勢は、適切なメディア選択の留意点とは言えません。"},

{id:"R5-7-5", tag:"R5 試験I 問題7 問5", cat:"ICT活用:著作権",
 text:"問5 文章中の下線部E「著作権」に関して、大学の授業において著作権者に無断で行っても著作権の侵害にならない例を、次の1〜4の中から一つ選べ。",
 choices:["授業用に録画したニュース番組を、教員間で相互に使用できるようにライブラリー化して使用する。","第三者の個人ブログからダウンロードした写真やイラストの一部に修正を加え、授業用スライドに用いる。","対面授業でウェブ上の教育利用のためのコンテンツを再生し、プロジェクターで投影して履修者に見せる。","海外でオンライン受講している学習者に、大学が購入した教科書を一冊分PDF化して配付する。"], answer:2,
 explain:"あらかじめ教育利用を目的として公開されているウェブ上のコンテンツを、対面の授業でその場に居合わせる履修者に見せる利用は、著作権法上の教育機関の例外規定の範囲内として認められやすい行為です。録画番組のライブラリー化、無断転載画像の改変利用、教科書の丸ごとのPDF配付は、いずれも著作権者の許諾なく行えば侵害となる可能性が高い行為です。"},

/* ========= データ (令和5年度 試験I 問題8) ========= */
{id:"R5-8-1", tag:"R5 試験I 問題8 問1", cat:"異文化適応:Uカーブモデル",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語教育の現場では、学習者の異文化適応の過程を理解する必要がある。一般的な異文化適応の過程はUカーブモデルによって説明されている。\n日本語教師は、学習者に適応を求めるだけではなく、文化の異なる学習者との円滑なコミュニケーションのために、非言語コミュニケーションの知識を持つ必要がある。ホール(E. Hall)が提唱したポリクロニックな時間意識を持つ文化の傾向についても理解しておくとよい。また、アサーティブな自己表現を身に付けることも必要である。さらに、自分自身を客観的に見つめ直すことも重要であり、その際にはジョハリの窓(Johari Window)などが参考になる。\n\n問1 文章中の下線部A「Uカーブモデル」のハネムーン期の事例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["自分の国に帰ってきて懐かしい風景を見ることで安心し、家族との再会を喜んだ。","手土産を持参するというこの国の習慣は、相手への気遣いを表すためだと学んだ。","以前はこの国の友達ができなくて寂しかったが、最近友達ができてうれしく思う。","この国で見るものはどれも新鮮で美しく、この国に来てよかったと思う。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"Uカーブモデルのハネムーン期は、異文化に入った直後の高揚感・期待感に満ちた時期であり、「見るものすべてが新鮮で美しく感じられる」という記述はこの時期の典型的な事例です。帰国後の再適応(1)、文化の理解が進んだ段階(2)、不適応期を脱して再適応した段階(3)は、それぞれ別の時期に当たります。"},

{id:"R5-8-2", tag:"R5 試験I 問題8 問2", cat:"異文化コミュニケーション:非言語コミュニケーション",
 text:"問2 文章中の下線部B「非言語コミュニケーション」によるメッセージの特徴として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["単独で用いられ、言語とともに用いられることはない。","過去や未来のことを表すための文法的な時制の形式がない。","単純で分かりやすいため誤解されることが少ない。","文化ごとに特有なものはあるが、文化を超えて共通なものはない。"], answer:1,
 explain:"非言語コミュニケーション(表情・身振りなど)には、言語のような時制を表す文法形式がなく、「今、ここ」の状況に強く結びついているとされます。言語と同時に使われることも多く、曖昧さから誤解も生じやすく、笑顔などのように文化を超えてある程度共通するものも存在するため、他の記述は不適当です。"},

{id:"R5-8-3", tag:"R5 試験I 問題8 問3", cat:"異文化理解:ポリクロニックな時間意識",
 text:"問3 文章中の下線部C「ポリクロニックな時間意識を持つ文化の傾向」として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["計画や予定よりもその時々の事柄を大切にする傾向","予定を管理し物事を一つずつ処理しようとする傾向","過去に起きたことや経験を重視する傾向","未来を良くするために前進し続けようとする傾向"], answer:0,
 explain:"ホールの提唱したポリクロニック(多元的time)な時間意識を持つ文化は、あらかじめ立てた計画や予定よりも、その場その場の人間関係や出来事を優先する傾向があります。予定管理を重視して物事を一つずつ順番に処理しようとするのは、対照的なモノクロニックな時間意識の特徴です。"},

{id:"R5-8-4", tag:"R5 試験I 問題8 問4", cat:"コミュニケーション:アサーティブな自己表現",
 text:"問4 文章中の下線部D「アサーティブな自己表現」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["相手との間に葛藤が起こらないように、暗示的に意見を述べる。","相手の気持ちを害することがあっても、自分の意見をはっきり表現する。","自分の意見を表明し、相手を納得させるために数値を用いて説明する。","自分も相手も尊重しながら、その場に適した方法で意見を率直に表現する。"], answer:3,
 explain:"アサーティブな自己表現とは、自分の意見や気持ちを大切にすると同時に相手のことも尊重しながら、率直に伝えるコミュニケーションの取り方を指します。相手を無視した一方的な主張(2)や、意見をあいまいにする受身的な態度(1)とは異なります。"},

{id:"R5-8-5", tag:"R5 試験I 問題8 問5", cat:"自己理解:ジョハリの窓",
 text:"問5 文章中の下線部E「ジョハリの窓」に関して、次の①〜④に入れるのに最も適当な組合せを、下の1〜4の中から一つ選べ。\n\n(自分が知っている×他人に知られている=①、自分が知らない×他人に知られている=②、自分が知っている×他人に知られていない=③、自分が知らない×他人に知られていない=④)",
 choices:["①秘密の窓 ②盲目の窓 ③開放の窓 ④未知の窓","①秘密の窓 ②未知の窓 ③開放の窓 ④盲目の窓","①開放の窓 ②盲目の窓 ③秘密の窓 ④未知の窓","①開放の窓 ②未知の窓 ③秘密の窓 ④盲目の窓"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"ジョハリの窓では、自分も他人も知っている領域が「開放の窓」、自分は気づいていないが他人は知っている領域が「盲目の窓」、自分は知っているが他人には隠している領域が「秘密の窓」、自分も他人も気づいていない領域が「未知の窓」と呼ばれます。"},

/* ========= データ (令和5年度 試験I 問題9) ========= */
{id:"R5-9-1", tag:"R5 試験I 問題9 問1", cat:"第二言語習得:子どもと大人の違い",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n近年、文化間移動をする子どもが増えている。子どもと大人の第二言語の習得には異なる特徴がある。カミンズ(J. Cummins)は、子どものバイリンガリズムについて敷居(閾)仮説を提唱した。また、子どもの場合、(ア)より(イ)のほうが習得に時間がかかることも指摘している。\n学齢期の子どもが第二言語として日本語を学習する際にも、いくつかの特徴が見られる。そのほか、学習には内発的動機づけも関与している。\n\n問1 文章中の下線部A「子どもと大人の第二言語の習得には異なる特徴がある」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["大人のほうが認知能力が発達しており、初期段階では文法の習得が速い。","大人の場合、発音の習得が難しく、十分な伝達能力を身に付けるのは困難である。","子どものほうが母語のフィルターが強いため、第二言語の聞き取りが困難である。","子どもの場合、年齢よりも言語適性による個人差が最終的な到達度に影響する。"], answer:0,
 explain:"大人の学習者は認知能力が発達しているため、第二言語学習の初期段階では文法規則の習得が子どもより速く進むことが知られています。発音習得の困難さは大人に見られる傾向として概ね正しい面もありますが、下線部の対比として最も適切なのは初期段階の文法習得速度に関する記述です。"},

{id:"R5-9-2", tag:"R5 試験I 問題9 問2", cat:"バイリンガリズム:敷居(閾)仮説",
 text:"問2 文章中の下線部B「敷居(閾)仮説」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["第一言語が十分に身に付いていない場合は、第二言語も身に付きにくい。","二つの言語が年齢相当に発達している場合は、認知発達に正の影響がある。","一方の言語の習得が進むほど、もう一方の言語の能力は低下していく。","表面上は二つの言語の能力は異なるが、根底には共有する言語能力がある。"], answer:1,
 explain:"敷居(閾)仮説では、両方の言語が年齢相応のレベルまで発達している場合に認知面へのプラスの効果が期待でき、逆にどちらの言語も一定の水準(閾)に達していない場合には認知発達へのマイナスの影響が懸念されるとされます。"},

{id:"R5-9-3", tag:"R5 試験I 問題9 問3", cat:"バイリンガリズム:BICSとCALP",
 text:"問3 文章中の(ア)と(イ)に入れるのに最も適当な組合せを、次の1〜4の中から一つ選べ。",
 choices:["(ア)談話能力 (イ)語用論的能力","(ア)語用論的能力 (イ)談話能力","(ア)学習言語能力(CALP) (イ)生活言語能力(BICS)","(ア)生活言語能力(BICS) (イ)学習言語能力(CALP)"], answer:3,
 explain:"カミンズは、日常会話で使う生活言語能力(BICS)は比較的短期間で習得される一方、学習・思考に必要な学習言語能力(CALP)の習得にはより長い年月がかかると指摘しています。"},

{id:"R5-9-4", tag:"R5 試験I 問題9 問4", cat:"年少者日本語教育:学齢期の特徴",
 text:"問4 文章中の下線部Cに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["会話が重要で読み書きを学ぶ必要はない。","必要な語彙や学習の順序が大人と異なる。","自分の意志によって開始されることが多い。","教科の知識と日本語を同時に学習する必要性は低い。"], answer:1,
 explain:"学齢期の子どもは学校の教科学習と並行して日本語を学ぶため、必要となる語彙や学習すべき事項の順序が、実生活を中心とする成人学習者とは異なります。読み書きの学習が不要という記述や、教科学習との同時学習の必要性が低いという記述は不適当です。"},

{id:"R5-9-5", tag:"R5 試験I 問題9 問5", cat:"動機づけ:内発的動機づけ",
 text:"問5 文章中の下線部D「内発的動機づけ」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本語で好きな漫画を読めるようになりたい。","日本語の大会で賞金を獲得してゲームを買いたい。","クラスで一番の成績を取って褒められたい。","いい学校に合格して家族の期待に応えたい。"], answer:0,
 explain:"内発的動機づけは、活動そのものへの興味・関心から生じる動機づけです。「好きな漫画を読みたい」という理由は活動自体への興味に基づいており、賞金・称賛・合格といった外部からの報酬や評価を目的とする他の選択肢(外発的動機づけ)とは異なります。"},

/* ========= データ (令和5年度 試験I 問題10) ========= */
{id:"R5-10-1", tag:"R5 試験I 問題10 問1", cat:"誤用分析:誤用の種類",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n初期の第二言語習得研究では、対照分析が盛んであった。しかし、研究が進むうちに、母語と目標言語の違いだけでは学習者の誤用は説明しきれないことが明らかになった。そのため、学習者の誤用やその原因に焦点を当てた誤用分析が行われるようになった。誤用分析では、言語間の誤りと言語内の誤り、グローバルエラーとローカルエラー、といった誤用の分類も整理された。その後、母語とは関わらない習得順序や発達順序の研究が行われるようになった。近年では、第二言語習得に与える母語の影響も見直されている。\n\n問1 文章中の下線部A「誤用」の種類とその記述の最も適当な組合せを、次の1〜4の中から一つ選べ。",
 choices:["言語間の誤り ― 母語とは無関係に学習者全般に見られる。","言語内の誤り ― 発達途上の誤りであり、学習過程で起きる。","エラー ― 言語知識にかかわらず、成人母語話者にも見られる。","ミステイク ― 学習者の構築した規則に基づいて起きる。"], answer:1,
 explain:"言語内の誤り(過剰般化など)は、目標言語の規則を学習者なりに解釈・構築していく発達過程で生じる誤りです。母語と無関係に学習者全般に見られるという記述は言語内の誤り自体の説明としてはやや不正確であり、エラーは学習者の言語知識の不足によるもの、ミステイクは知識があっても偶発的に生じる言い間違いを指すため、他の組合せは不適当です。"},

{id:"R5-10-2", tag:"R5 試験I 問題10 問2", cat:"誤用分析:誤用の位置づけ",
 text:"問2 文章中の下線部B「誤用分析」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["誤用は習得過程で必然的に生じるものであり、誤用を繰り返しながら習得が進む。","誤用を産出させないように繰り返し機械的な練習を行うことで習得が進む。","一度きりの言い間違いであっても分析対象とし、習得過程を明らかにする。","学習者が意図的に使用を回避した形式の分析を行うことが中心課題である。"], answer:0,
 explain:"誤用分析の考え方では、誤用は習得過程において必然的に生じるものであり、学習者はそうした誤りを重ねながら目標言語の規則を構築していくとされます。機械的な反復練習で誤りを防ぐという考え方は対照分析・行動主義的な立場に近く、一度きりの言い間違い(ミステイク)は誤用分析の主な対象ではなく、回避現象の分析は誤用分析とは別の研究領域であるため、他の記述は不適当です。"},

{id:"R5-10-3", tag:"R5 試験I 問題10 問3", cat:"誤用分析:グローバルエラー",
 text:"問3 文章中の下線部C「グローバルエラー」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["昨日電車で傘を忘れます。","図書館の前に会いましょう。","母に私が時計をくれました。","この写真を見てください。"], answer:2,
 explain:"「母に私が時計をくれました」は、「くれる」の授受の方向性(相手から自分への方向)を取り違えており、誰が誰に何をあげたのかという文全体の意味理解に重大な支障を来す誤りです。他の選択肢は、時制の誤り(1)や助詞の誤り(2)など、文の一部にとどまり全体の理解を大きく妨げないローカルエラーです。"},

{id:"R5-10-4", tag:"R5 試験I 問題10 問4", cat:"第二言語習得:習得順序と発達順序",
 text:"問4 文章中の下線部D「習得順序や発達順序」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["習得順序は、一つの文法項目が習得される際にたどる普遍的な順序である。","習得順序は、複数の項目がどの順番で習得されるかを示した順序である。","発達順序は、学習者の使用の傾向や誤用の消滅も含めた習得の順序である。","発達順序は、個々の学習者によって異なる習得の順序である。"], answer:1,
 explain:"習得順序(acquisition order)は、複数の文法項目間で見られる、どの項目がどの順番で習得されていくかを示すものです。一方、発達順序(developmental sequence)は、一つの項目が習得されるまでにたどる段階的な変化の過程を指すため、それぞれの説明が入れ替わっている他の記述は不適当です。"},

{id:"R5-10-5", tag:"R5 試験I 問題10 問5", cat:"第二言語習得:母語の転移",
 text:"問5 文章中の下線部E「第二言語習得に与える母語の影響」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["語の用法のうち学習者が基本的だと感じたものは転移が起こりにくい。","母語と目標言語との間に類似点がある項目は転移が起こりにくい。","文法形態素は音声や語彙に比べて転移が起こりにくい。","談話の構成や展開に関することは転移が起こりにくい。"], answer:1,
 explain:"母語と目標言語の間に類似点がある(似ている)と学習者が感じる項目は、かえって母語の影響が意識されにくくなり、転移が起こりにくいことが指摘されています。逆に語用論・談話レベルの母語の影響(語用論的転移)はむしろ起こりやすいことが知られているため、他の記述は不適当です。"},

/* ========= データ (令和5年度 試験I 問題11) ========= */
{id:"R5-11-1", tag:"R5 試験I 問題11 問1", cat:"社会言語学:術語",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n言語にはバリエーションがあり、社会集団や専門分野によって使い分けられている。例えば、専門家の間では術語が使用される。ある集団に特徴的な言葉は集団語と称される。集団語の中でも職業語は、ある職業や業界から生じた語である。隠語は秘密を保持する役割が強い。\nまた、共通語アクセント(東京アクセント)で見た場合、「ファイル」などの一般的な単語が集団内で頻繁に用いられるうちに、アクセントが変化することがある。\n\n問1 文章中の下線部A「術語」の性質として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["国際性が薄く、地域ごとに独自性がある。","外来語や新語が使用されにくい。","能率的かつ正確に内容が伝えられる。","一般語に置き換えることが可能である。"], answer:2,
 explain:"術語(専門用語)は、特定の分野の専門家の間で、能率的かつ正確に高度な内容を伝達するために用いられる語です。分野によっては国際的に共有され、外来語由来の新語も多く使われ、また一般語では正確に置き換えられないからこそ術語として成立している面があります。"},

{id:"R5-11-2", tag:"R5 試験I 問題11 問2", cat:"社会言語学:集団語",
 text:"問2 文章中の下線部B「集団語」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["帰属意識が強い構成員ほど、その集団の集団語をよく使う。","他集団に自集団の集団語を使うと、他集団との心的距離が縮まる。","集団語は、集団の外に広まっても一般語との境界が明確である。","集団語の意味の通じやすさは、集団の内外で同じである。"], answer:0,
 explain:"集団語は仲間意識・帰属意識を反映して用いられる面が強く、その集団への帰属意識が強い成員ほど集団語を積極的に使う傾向があります。集団外の人に使うとむしろ心的距離は縮まりにくく、集団語は外部に広まると一般語化して境界があいまいになることも多く、集団の内外で通じやすさが異なるため、他の記述は不適当です。"},

{id:"R5-11-3", tag:"R5 試験I 問題11 問3", cat:"社会言語学:職業語",
 text:"問3 文章中の下線部C「職業語」に由来する語の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["じゃがいもを指す「男爵」","家電製品を指す「白物」","稲が緑色の田を指す「青田」","仕事を休むことを指す「欠勤」"], answer:1,
 explain:"「白物(家電)」は、もともと家電業界で色にちなんで使われていた業界用語(職業語)が一般に広まって定着した例です。「男爵」は品種名、「青田」は一般的な描写語、「欠勤」は標準的な語であり、特定の職業・業界から生じた語という点では「白物」が最も適当です。"},

{id:"R5-11-4", tag:"R5 試験I 問題11 問4", cat:"社会言語学:隠語",
 text:"問4 文章中の下線部D「隠語」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["店員同士が、トイレに行くことを客に知られないように「遠方に」と言う。","商売人が、もうかっていることを相手に悟られないように「はちはち」と言う。","知人に個人的な話をする際に、ほかの人に漏れないように「例の件は」と言う。","友人と商品の値段について話す際に、周囲に分からないように「コスパ」と言う。"], answer:0,
 explain:"隠語は、特定の集団の中だけで通じ、部外者(この場合は客)には意味が分からないように意図的に用いられる特殊な言い換え語です。店員同士の「遠方に」はこの典型例です。「はちはち」は商売人の符丁的な数字の言い方であり近い性質も持ちますが、選択肢の中では客に対して秘密を保つという文脈が最も明確な1が適当です。"},

{id:"R5-11-5", tag:"R5 試験I 問題11 問5", cat:"社会言語学:アクセントの平板化",
 text:"問5 文章中の下線部Eに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["頭高型になる傾向がある。","中高型になる傾向がある。","尾高型になる傾向がある。","平板型になる傾向がある。"], answer:3,
 explain:"「ファイル」のように本来は下がり目を持つ単語でも、特定の集団内で頻繁に使われるうちに下がり目のない平板型のアクセントに変化していく現象(アクセントの平板化)が、若者言葉や専門集団内の言葉でよく観察されます。"},

/* ========= データ (令和5年度 試験I 問題12) ========= */
{id:"R5-12-1", tag:"R5 試験I 問題12 問1", cat:"待遇表現:ウチ・ソト",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語の待遇表現は、ウチとソトや上下関係などに応じて使い分けられる。例えば、全国共通語では(ア)の人に対して、(イ)の(ウ)の人を立てず、部下が「課長の山田からご連絡申し上げます。」などと言う。待遇表現の代表例である敬語は、尊敬語、謙譲語I、謙譲語II(丁重語)、丁寧語、美化語の五つに大別される。これらの正しい理解が敬語を適切に使用する際に重要である。\n敬語は時代によって変化したり、地域によって異なったりする。また、日本語では会話の中で言語形式の丁寧さが切り替わることがある。\n\n問1 文章中の(ア)、(イ)、(ウ)に入れるのに最も適当な組合せを、次の1〜4の中から一つ選べ。",
 choices:["(ア)目上 (イ)目下 (ウ)ソト","(ア)目下 (イ)目上 (ウ)ソト","(ア)ウチ (イ)ソト (ウ)目上","(ア)ソト (イ)ウチ (ウ)目上"], answer:3,
 explain:"社内の人間が社外の人に対して話す場合、たとえ自分にとって目上の人物(課長)であっても、身内(ウチ)として立てずに謙譲語で述べます。すなわち、ソトの人に対して、ウチの目上の人を立てない、という組合せが正しくなります。"},

{id:"R5-12-2", tag:"R5 試験I 問題12 問2", cat:"敬語:謙譲語I・II",
 text:"問2 文章中の下線部Aに関して、次の会話文中の下線部①〜④に関する記述として最も適当なものを、下の1〜4の中から一つ選べ。\n\n鈴木:田中さんは明日も①おいでになりますか?\n田中:いえ、別のシンポジウムに②参ります。山本さんが③お話しになるので。\n鈴木:そうなん④ですか。",
 choices:["①は聞き手の「田中」を立てて使う謙譲語Iである。","②は聞き手の「鈴木」に対して使う謙譲語II(丁重語)である。","③は話題の「山本」を立てて使う美化語である。","④は話題の「山本」に対して使う丁寧語である。"], answer:1,
 explain:"②の「参ります」は、特定の相手(話題の人物)を立てるためではなく、聞き手である鈴木に対して丁寧に述べる謙譲語II(丁重語)です。①「おいでになる」は田中を立てる尊敬語であり謙譲語Iではなく、③「お話しになる」は山本を立てる尊敬語であり美化語ではなく、④「ですか」は鈴木自身の発話に対する丁寧語であり山本に向けたものではないため、他の記述は不適当です。"},

{id:"R5-12-3", tag:"R5 試験I 問題12 問3", cat:"敬語:尊敬語の規範的用法",
 text:"問3 文章中の下線部Bに関して、尊敬語の規範的な使用例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["(受付にて)山田様でございますね。お待ちしておりました。","(車掌から)特急にご乗車されるお客様はお気をつけください。","(先生に)相談があるのですが、先生は今週お忙しいでしょうか?","(客に)ご注文の品はおそろいになりましたでしょうか?"], answer:2,
 explain:"「先生はお忙しいでしょうか」は、目上の相手の状態を高める規範的な尊敬語の用法です。「〜でございます」は本来自分側に使う丁重語で客に使うのは規範的ではなく、「ご乗車される」は「ご〜になる」と「〜れる」の二重敬語で規範的でなく、「おそろいになりました」も物に対する誤った敬語の使用(いわゆるバイト敬語)とされるため、他の選択肢は不適当です。"},

{id:"R5-12-4", tag:"R5 試験I 問題12 問4", cat:"敬語:時代・地域による変化",
 text:"問4 文章中の下線部Cに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["現代日本語の特定の地域方言では、身内に対して用いられる尊敬語がある。","現代日本語では、敬語を用いず、文末表現などで敬意を示す地域方言はなくなった。","現代日本語の共通語では、軽卑表現などのマイナスの敬語は見られなくなった。","上代の日本語は相対敬語であり、天皇や貴族などが自称表現を用いていた。"], answer:0,
 explain:"一部の地域方言では、標準語の「ウチ・ソト」の区別とは異なり、家族などの身内に対しても尊敬語を用いる用法が見られることが知られています。文末表現による敬意表現を持つ方言や、共通語における軽卑表現は現在も存在し、上代の敬語は相対敬語ではなく絶対敬語的な性格が強いとされるため、他の記述は不適当です。"},

{id:"R5-12-5", tag:"R5 試験I 問題12 問5", cat:"文体:丁寧体から普通体への切り替え",
 text:"問5 文章中の下線部Dに関して、丁寧体を基本とした会話において普通体に切り替わる条件として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["自分自身の品位を示すとき","聞き手と心的距離を取るとき","新しい話題を導入するとき","自問するような発話をするとき"], answer:3,
 explain:"丁寧体を基調とする会話でも、聞き手に向けてではなく自分自身に問いかけるような独り言的な発話(自問)をするときには、一時的に普通体に切り替わることがあるとされています。"},

/* ========= データ (令和5年度 試験I 問題13) ========= */
{id:"R5-13-1", tag:"R5 試験I 問題13 問1", cat:"会話分析:協調の原理",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n会話では様々な仕組みが働いている。会話において円滑な意思疎通が成立するのは、協調の原理(グライス(H. P. Grice))が守られているからである。この協調の原理は、量・質・関係・様態という四つの会話の公理から成る。しかし、話し手は会話の公理に違反した発話をすることもある。\n発話の意味は、異なる文化に属する人の間での会話においては、誤解されることがある。これを防ぐためには、発話がどう解釈されるべきかという(ア)の合図を理解することが重要である。\nまた、会話では参加者が発話の順番を交代していくシステム(turn taking system)が働いている。発話の連鎖の中には隣接ペアも見られる。\n\n問1 文章中の下線部A「協調の原理」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["相手と協力しながら言葉の意味を確認して理解し合っていくこと","発話を通して特定の意図を伝えることで相手に影響を与えること","会話において相手との人間関係に配慮して発話すること","自分の発話を会話の目的や方向に沿ったものにすること"], answer:3,
 explain:"グライスの協調の原理は、会話の参加者が、その会話が行われている目的や方向性に沿うように自分の発話内容を調整するべきだという原則です。人間関係への配慮(ポライトネス)や意味の相互確認は、協調の原理そのものの定義とは異なる概念です。"},

{id:"R5-13-2", tag:"R5 試験I 問題13 問2", cat:"会話分析:質の公理違反",
 text:"問2 文章中の下線部B「会話の公理に違反した発話」に関して、「質の公理」に違反している返答の例を、次の1〜4の中から一つ選べ。",
 choices:["X:鈴木さんってリーダーシップある?\nY:彼は字がすごくきれいですね。","X:昨日の仕事どうだった?\nY:やりたくもない仕事で、すごく楽しかったよ。","X:出発時間は何時ですか?\nY:早朝です。","X:こんな遅くまでどこで何をしてたの?\nY:外だけど。"], answer:1,
 explain:"「やりたくもない仕事で、すごく楽しかった」という発言は、内容に矛盾があり、真実ではないこと(あるいは皮肉)を述べている可能性が高く、真実を語るべきとする「質の公理」への違反の例です。1は関係の公理、3・4は量の公理への違反にそれぞれ近い例です。"},

{id:"R5-13-3", tag:"R5 試験I 問題13 問3", cat:"会話分析:文脈化の合図",
 text:"問3 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["意識化","活性化","概念化","文脈化"], answer:3,
 explain:"発話がどのような意図で、どう解釈されるべきかを聞き手に示す言語・非言語的な手がかりは、ガンパーズ(J. Gumperz)の用語で「文脈化の合図(contextualization cues)」と呼ばれます。"},

{id:"R5-13-4", tag:"R5 試験I 問題13 問4", cat:"会話分析:順番交代システム",
 text:"問4 文章中の下線部C「参加者が発話の順番を交代していくシステム」の基本的なルールに当てはまる行動の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["相手に質問をして、自分が話すのをやめる。","相手が相づちを打ったら、自分が話すのをやめる。","相手が話している最中に、自分が話し始める。","誰も話さないときは、最後の話し手に話すよう促す。"], answer:0,
 explain:"順番交代システムの基本的なルールの一つに、現在の話し手が質問などによって次の話し手を指名する「現在の話し手による次話者選択」があります。相づちで話をやめる必要はなく、相手の発話中に話し始めるのは重複(オーバーラップ)であり、沈黣が続いても特定のルールで最後の話し手に促すわけではないため、他の記述は不適当です。"},

{id:"R5-13-5", tag:"R5 試験I 問題13 問5", cat:"会話分析:隣接ペア",
 text:"問5 文章中の下線部D「隣接ペア」に関して、次の会話文における隣接ペアはどれか。最も適当なものを、下の1〜4の中から一つ選べ。\n\n魚屋:いらっしゃい。……………………ア\n客:このお魚、おいくらですか?……イ\n魚屋:お目が高いですね。…………ウ\n客:煮付けにでもしようかな。……エ\n魚屋:1尾500円です。……………オ\n客:じゃあ頂きます。………………カ",
 choices:["ア ― イ","イ ― オ","ウ ― エ","ウ ― カ"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"客の質問「おいくらですか(イ)」と、それに答える魚屋の発話「1尾500円です(オ)」が、意味の上で対応する隣接ペア(質問と答え)です。間にある「お目が高いですね(ウ)」「煮付けにでもしようかな(エ)」は、質問と答えの間に挟まれた挿入連鎖に当たります。"},

/* ========= データ (令和5年度 試験I 問題14) ========= */
{id:"R5-14-1", tag:"R5 試験I 問題14 問1", cat:"海外の日本語教育:国際交流基金",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語教育は海外でも広く行われている。海外での日本語の普及に関わる機関の一つに国際交流基金がある。国際交流基金が実施した「2021年度海外日本語教育機関調査」によると、海外の日本語学習者数は約(ア)で、そのうち東アジアと東南アジアで約(イ)を占めている。学習者数は多い順に、中国、インドネシア、韓国、オーストラリアとなっており、国によって教育段階別(初等教育、中等教育、高等教育、学校教育以外)の学習者数比に違いが見られる。また、日本語学習の目的・理由も多岐にわたっている。\n国際交流基金は様々な海外日本語教育の支援事業も実施している。その中には海外への人材派遣事業も含まれている。\n\n問1 文章中の下線部A「国際交流基金」の活動目的に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["外国人材の日本への受入れの促進を図り、国際経済社会の発展に寄与する。","文化、言語、対話を通じて、日本と世界の人々の間に共感や信頼、好意を育成する。","日本と諸外国の児童・青少年を対象とした外国語教育や文化の理解を促進する。","貿易・投資促進と開発途上国研究を通じ、日本の経済・社会の発展に貢献する。"], answer:1,
 explain:"国際交流基金は、文化芸術交流・海外日本語教育・日本研究や知的交流という事業を通じて、文化・言語・対話による人と人との相互理解や信頼、好意を培うことを目的とする組織です。外国人材の受入れ促進や貿易・投資促進は、それぞれ別の機関の活動目的です。"},

/* ========= データ (令和5年度 試験I 問題15) ========= */
{id:"R5-15-1", tag:"R5 試験I 問題15 問1", cat:"日本語教員養成:1980年代の動向",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語教員の養成に関しては、今日に至るまで様々な検討が行われている。1980年代には日本語教育に関する多くの事業が始まった。昭和60年(1985年)には「日本語教員の養成等について」(日本語教育施策の推進に関する調査研究会)で、教員養成で扱うべき4領域と標準的時間数(単位数)などが示された。\nまた、平成12年(2000年)には「日本語教育のための教員養成について」(日本語教員の養成に関する調査研究協力者会議)で指針が示された(以下、「平成12年指針」と呼ぶ)。\nさらに、平成31年(2019年)には「日本語教育人材の養成・研修の在り方について(報告)改定版」(文化審議会国語分科会)がまとめられた。そこでは、「平成12年指針」における教育内容に対する課題が示された。また、日本語教育人材の役割が三つに整理され、そのうちの「日本語教師」については(ア)の段階が示されている。\n\n問1 文章中の下線部A「1980年代」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["文化審議会国語分科会の中に日本語教育小委員会が設置された。","国立大学に日本語教員養成学科、課程等が設置された。","文化庁の地域日本語教育コーディネーター研修が開始された。","学校教育においてJSLカリキュラムによる課程が開始された。"], answer:1,
 explain:"1980年代には、国立大学に日本語教員養成のための学科・課程が新設されるなど、日本語教員養成の基盤整備が進みました。日本語教育小委員会の設置、地域日本語教育コーディネーター研修、JSLカリキュラムはいずれもこれより後の時代の施策です。"},

{id:"R5-15-2", tag:"R5 試験I 問題15 問2", cat:"日本語教員養成:4領域の時間数",

 choices:["「日本語の構造に関する体系的、具体的な知識」・「日本人の言語生活等に関する知識・能力」","「日本事情」","「言語学的知識・能力」","「日本語の教授に関する知識・能力」"], answer:0,

{id:"R5-15-3", tag:"R5 試験I 問題15 問3", cat:"日本語教員養成:平成12年指針の変化点",
 text:"問3 文章中の下線部Cに関して、この指針で変化した点として不適当なものを、次の1〜4の中から一つ選べ。",
