 text:"問5 文章中の下線部E「人称詞の指導」の際の留意点として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「あなた」を使わずに相手の名前に「さん」を付けて呼ぶよう指導する。","男性の「私」の多用は不自然な場合があるため、使わないよう指導する。","「自分」と自称詞「私」との意味・用法の違いに注意するよう指導する。","待遇上の観点から、目上の人を「彼」「彼女」で言及しないよう指導する。"], answer:1,
 explain:"「私」は男女を問わず使用できる標準的な一人称です。男性が使うと不自然になる場合があるとしても、「使わないよう指導する」というのは行き過ぎた指導であり、不適当です。"},

{id:"R1-16-64", tag:"R1 試験III 問題13 問1", cat:"談話:共同発話",
 text:"問題13 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日常会話は,会話の参加者によって共同で作り上げられている。発話レベルでは,複数の発話者によって作られる共同発話が見られる。繰り返しなど,一見,冗長に見える発話も参加者によって会話を作り上げることにつながっている。しかし,発話の中には,形式上は問題はなくても聞き手に違和感を与えるものも見られる。また,相手との関係や場面などにより話し方を調整する現象も認められ,これらはアコモデーション理論によって説明されることもある。日本語教育ではこれらのことを考慮し,会話の指導を行うことが大切である。\n\n問1 文章中の下線部A「共同発話」の例として次の(ア)に入れるのに最も適当なものを、下の1〜4の中から一つ選べ。\n\nX:毎日寒くて寒くて…。\nY:(ア)",
 choices:["そうですよ。","嫌ですよね。","寒いですか。","本当ですね。"], answer:1,
 explain:"共同発話は、複数の話者が協力して一つの発話や文を完成させる現象です。Xの「毎日寒くて寒くて…」という言いさしに対して、Yが続く気持ち(「嫌ですよね」)を推測して補い、文を完成させているのが共同発話の例です。"},

{id:"R1-16-65", tag:"R1 試験III 問題13 問2", cat:"談話:繰り返し",
 text:"問2 文章中の下線部B「繰り返し」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["発話間の結束性は示すが、発話内容の強調にはならない。","相づちの代わりにはなるが、会話の内容の確認にはならない。","少ない労力で発話量は増えるが、会話の継続には貢献しない。","相手に対する共感や一体感は示すが、新情報は提示しない。"], answer:3,
 explain:"会話における相手の発話の繰り返しは、相手への共感や一体感を示す働きを持ちますが、新しい情報を付け加えるものではありません。"},

{id:"R1-16-66", tag:"R1 試験III 問題13 問3", cat:"語用論:違和感を与える発話",
 text:"問3 文章中の下線部C「形式上は問題はなくても聞き手に違和感を与える」例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["大学の先輩に「あの人、OBの田中さんじゃないですか」と確認する。","会社の後輩に「それって、まずいんじゃない」と指摘する。","初対面の人に「私って、暑がりじゃないですか」と同意を求める。","友達に「飲み物なら、あそこで売ってるんじゃない」と伝える。"], answer:2,
 explain:"「〜じゃないですか」は、聞き手がすでに知っている(共有している)情報について確認や同意を求める際に使われるのが自然な用法です。初対面の相手は話し手の体質(暑がりかどうか)を知る由がないため、形式的には正しい文でも、聞き手には違和感を与えてしまいます。"},

{id:"R1-16-67", tag:"R1 試験III 問題13 問4", cat:"談話:アコモデーション理論",
 text:"問4 文章中の下線部D「アコモデーション理論」のうち、ダイバージェンスの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["両親が幼い子どもに対して、その子どもに合わせて育児語で話しかける。","地方出身者が故郷への愛着を示すため、上京しても東京出身者に方言で話す。","上司が若い部下との雑談の時に、受け入れてもらおうとして若者言葉で話す。","米国からの帰国生が、英語の授業で目立たないように日本式の発音で英語を話す。"], answer:1,
 explain:"アコモデーション理論におけるダイバージェンスは、相手に合わせるのではなく、あえて自分自身の話し方を保持・強調することで、相手との違いを示す現象です。方言を保持し続ける例がこれに該当します。他の選択肢は、相手に話し方を合わせるコンバージェンスの例です。"},

{id:"R1-16-68", tag:"R1 試験III 問題13 問5", cat:"教授法:会話の指導",
 text:"問5 文章中の下線部E「会話の指導」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者は日本語母語話者よりも相づちを多くしがちなので、相づちをしすぎないよう注意させる。","学習者同士で独自に創作した会話は扱わず、教科書の会話例を忠実に再現できるよう指導する。","学習者の発音や文法を正確なものにするとともに、話す内容も日本人らしくするよう指導する。","学習者に、会話練習の後で自身の会話の成功や失敗を分析させ、必要な談話技能を意識させる。"], answer:3,
 explain:"会話練習の後に、学習者自身に自分の会話でうまくいった点・いかなかった点を振り返らせ(内省させ)、次に必要な談話技能を自覚させることは、効果的な会話指導のあり方として適切です。"},

{id:"R1-16-69", tag:"R1 試験III 問題15 問1", cat:"評価:日本語能力試験",
 text:"問題15 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n不特定多数の学習者を対象にしたテストは大規模テストと呼ばれる。日本語能力を測る大規模テストの中で最も受験者数が多いのが「日本語能力試験」である。その他、日本語によるビジネス・コミュニケーション能力の測定を目的とした「BJTビジネス日本語能力テスト」や、2002年に「私費外国人留学生統一試験」に替わって創設された「日本留学試験」がよく知られる。「日本留学試験」の日本語科目は、大学等で求められる日本語力の測定を目的とする。これらの試験では、主観テストに分類される口頭能力の測定は行われていない。\nこのように様々なテストが実施されているため、教師には各テストの目的を理解し、学習者に情報提供できる力が求められる。\n\n問1 文章中の下線部A「日本語能力試験」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本国内の受験者数は、各レベルにほぼ均等に分布している。","海外の受験者数のほうが、日本国内の受験者数よりも多い。","レベルは「ヨーロッパ言語共通参照枠(CEFR)」に対応している。","受験者の上位20〜25%が合格する相対評価が採用されている。"], answer:1,
 explain:"日本語能力試験(JLPT)は世界各国で実施されており、海外での受験者数が日本国内の受験者数を大きく上回っています。"},

{id:"R1-16-70", tag:"R1 試験III 問題15 問2", cat:"評価:BJT",
 text:"問2 文章中の下線部B「BJTビジネス日本語能力テスト」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["CBT(Computer Based Testing)方式で自宅で受験できる。","試験の結果がスコアとレベル判定で示される。","多肢選択式の他、記述式問題も含まれる。","出題基準が公式ウェブサイトに公開されている。"], answer:1,
 explain:"BJTビジネス日本語能力テストは、合否判定ではなくスコアとレベル判定によって結果が示されるテストです。"},

{id:"R1-16-71", tag:"R1 試験III 問題15 問3", cat:"評価:日本留学試験",
 text:"問3 文章中の下線部C「『日本留学試験』の日本語科目」で問われる能力としてシラバスに挙げられていないものを、次の1〜4の中から一つ選べ。",
 choices:["問題解決能力:問題の解決に必要な情報を収集・分析・整理し、解決できるか","直接的理解能力:言語として明確に表現されていることを、そのまま理解できるか","情報活用能力:理解した情報を活用して論理的に妥当な解釈を導けるか","関係理解能力:文章や談話で表現されている情報の関係を理解できるか"], answer:0,
 explain:"日本留学試験(EJU)の日本語科目シラバスには「直接的理解能力」「関係理解能力」「情報活用能力」などが挙げられていますが、「問題解決能力」という名称の能力はシラバスに挙げられていません。"},

{id:"R1-16-72", tag:"R1 試験III 問題15 問4", cat:"評価:主観テスト",
 text:"問4 文章中の下線部D「主観テスト」の特徴として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["解答から問題の良否を統計的に判断できる。","広い範囲から多数の問題を出題できる。","結果の信頼性を確保することが困難である。","採点基準を一定に保つことが容易である。"], answer:2,
 explain:"記述式や面接など採点者の主観的判断が入りやすい主観テストは、客観テスト(多肢選択式など)と比べて採点者間で評価がぶれやすく、結果の信頼性を確保することが難しいという特徴があります。"},

{id:"R1-16-73", tag:"R1 試験III 問題15 問5", cat:"評価:テストの使い分け",
 text:"問5 文章中の下線部Eに関して、学習者のニーズとそれに対応するテストの組み合わせとして最も適当なものを、次の1〜4の中から一つ選べ。\n\n1 作文能力のレベルを知りたい。/ OPI\n2 高度人材としてのポイントを加算したい。/ BJTビジネス日本語能力テスト\n3 会話能力を就職先に証明したい。/ JSL対話型アセスメント(DLA)\n4 ウェブ上で試験を受けたい。/ 日本留学試験",
 choices:["選択肢1(作文能力/OPI)","選択肢2(高度人材ポイント/BJT)","選択肢3(会話能力を証明/DLA)","選択肢4(ウェブ受験/日本留学試験)"], answer:2,
 explain:"公式解答では選択肢3が正しい組み合わせとされています。なお、OPIは口頭能力を測る試験であり作文能力の測定には使われない点、日本留学試験は会場での筆記形式でありウェブ受験ではない点で、選択肢1・4は誤りと判断できます。DLAやBJTの具体的な対象・用途については、細部を専門資料でも確認することをおすすめします。"},

{id:"R1-16-74", tag:"R1 試験III 問題16 問1", cat:"日本語教育史:国語教育と日本語教育",
 text:"問題16 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本における「国語教育」と「日本語教育」は共に「日本語」を対象としているため,混同して扱われることがある。しかし,「国語教育」と「日本語教育」は異なるものとして捉える必要がある。また,「国語」と「日本語」も異なるものとして捉えられる。歴史的に見れば,「国語」は近代になって成立したものである。「標準語」や言文一致体の成立も同時期のことである。\n一方,「日本語」については,戦後,「国語」と「日本語」という用語の使い分けが定着したと言われている。以来,官民において様々な機関が設立され,「日本語教育」に関する事業が行われている。\n\n問1 文章中の下線部Aに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「国語教育」の歴史は16世紀まで遡ることができるのに対して、「日本語教育」の歴史は20世紀以降である。","「国語教育」は日本人の子どもに対する教育であるのに対して、「日本語教育」は外国人の成人に対する教育である。","「国語教育」は学校の教科としての言葉の教育であるのに対して、「日本語教育」は広義の外国語としての言葉の教育である。","「国語教育」では国定教科書が用いられるのに対して、「日本語教育」では検定教科書が用いられる。"], answer:2,
 explain:"「国語教育」は日本の学校教育における教科としての国語の教育を指すのに対し、「日本語教育」は日本語を母語としない人々への、広い意味での外国語(第二言語)としての日本語の教育を指すという点で区別されます。"},

{id:"R1-16-75", tag:"R1 試験III 問題16 問2", cat:"日本語教育史:国語の成立",
 text:"問2 文章中の下線部Bに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["国民統合の象徴としての役割を担った。","お国言葉を再評価する運動へ拡大した。","古典に基づく日本固有の思想の研究を発展させた。","学習を容易にするために語彙や文法が簡略化された。"], answer:0,
 explain:"近代になって成立した「国語」は、近代国家形成の過程で国民を一つにまとめる、国民統合の象徴としての役割を担ったとされています。"},

{id:"R1-16-76", tag:"R1 試験III 問題16 問3", cat:"日本語教育史:標準語",
 text:"問3 文章中の下線部C「標準語」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["標準語の普及に向けてラジオの放送用語が整備された。","標準語の普及には国による国語教科書の刊行が影響した。","標準語という用語は20世紀初頭に一般に普及した。","標準語は共通語と対立する概念として普及した。"], answer:3,
 explain:"標準語と共通語は、歴史的には連続性・関連性を持つ概念として扱われており、「対立する概念」として普及したという記述は不適当です。他の3つ(ラジオ放送用語の整備、国語教科書の影響、20世紀初頭の普及)は標準語普及の経緯として妥当な記述です。"},

{id:"R1-16-77", tag:"R1 試験III 問題16 問4", cat:"日本語教育史:言文一致",
 text:"問4 文章中の下線部D「言文一致体の成立」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["南部義籌は建白を行い、口語をできる限り文語に近づけるようにした。","二葉亭四迷や山田美妙は小説を書く中で、口語文を使うことを試みた。","近代に生じた口語と文語の隔たりを、学制の公布により解消しようとした。","大日本帝国憲法の公布以降は、公用文も口語文で記されるようになった。"], answer:1,
 explain:"言文一致運動の代表的な作家として、二葉亭四迷(『浮雲』)や山田美妙が、小説の中で話し言葉に近い口語文を使うことを試みたことがよく知られています。"},

{id:"R1-16-78", tag:"R1 試験III 問題16 問5", cat:"日本語教育史:支援機関",
 text:"問5 文章中の下線部Eに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["国際研修協力機構では、開発途上国へ青年海外協力隊を派遣し、日本語教育支援を行っている。","定住促進センターでは、中国帰国者に対する日本語の学習支援や生活支援を行っている。","国立国語研究所では、日本語教育専門家を派遣するなど海外との学術交流を行っている。","国際交流基金では、教材の開発や教師の研修など、日本語の学習環境向上の支援を行っている。"], answer:3,
 explain:"国際交流基金(ジャパンファウンデーション)は、日本語教材の開発や海外の日本語教師向けの研修など、世界各地の日本語学習環境の向上を支援する事業を実際に行っています。"},

{id:"R2-1-1", tag:"R2 試験I 問題1(1)", cat:"音声学:調音点",
 text:"次の(1)〜(15)について、【 】内に示した観点から見て、他と性質の異なるものを、それぞれ1〜5の中から一つずつ選べ。\n\n(1) 【調音点】",
 choices:["[θ]","[m]","[b]","[ɸ]","[p]"], answer:0,
 explain:"[m][b][ɸ][p]はいずれも両唇(または唇歯に近い両唇性)で調音される音ですが、[θ]は上下の歯の間に舌を挟んで調音する歯音(dental)であり、調音点が異なります。"},

{id:"R2-1-2", tag:"R2 試験I 問題1(2)", cat:"音声学:ガ行音",
 text:"(2) 【ガ行音】",
 choices:["介護士","技術者","大学生","手芸展","家具屋"], answer:1,
 explain:"ガ行鼻濁音は、語(または要素)の先頭ではなく語中に現れるガ行音で起こりやすいとされます。「介護士(かいごし)」「大学生(だいがくせい)」「手芸展(しゅげいてん)」「家具屋(かぐや)」はいずれもガ行音が語中にありますが、「技術者(ぎじゅつしゃ)」は「ぎ」が語頭にあり、鼻濁音化の環境が他と異なります。"},

{id:"R2-1-3", tag:"R2 試験I 問題1(3)", cat:"音声学:アクセント型",
 text:"(3) 【アクセント型による弁別】",
 choices:["かき","はし","あき","いし","かぜ"], answer:4,
 explain:"かき(柿/牡蠣)、はし(箸/橋)、あき(秋/空き)、いし(石/意志)は、アクセントの型の違いによって意味が弁別される同音異義語のペアを持ちます。一方「かぜ(風/風邪)」は、両方とも同じアクセント型で発音され、アクセントによる弁別が働かない点で他と異なります。"},

{id:"R2-1-4", tag:"R2 試験I 問題1(4)", cat:"音声学:音便",
 text:"(4) 【音便】",
 choices:["書く","蹴る","話す","住む","洗う"], answer:2,
 explain:"書く→書いて(イ音便)、蹴る→蹴って(促音便)、住む→住んで(撥音便)、洗う→洗って(促音便)のように、他の動詞はテ形・タ形で音便が生じます。一方「話す」はサ行五段動詞であり、「話して」のように音便が起こらず、そのままの形で活用します。"},

{id:"R2-1-5", tag:"R2 試験I 問題1(5)", cat:"語彙:音読みの種類",
 text:"(5) 【音読みの種類(漢音・唐音)】",
 choices:["体力","扇子","学期","文章","下降"], answer:1,
 explain:"「力(りょく)」「期(き)」「章(しょう)」「降(こう)」はいずれも漢音の読みです。一方「扇子」の「子(す)」は唐音の読みであり、他と音読みの系統が異なります。"},

{id:"R2-1-6", tag:"R2 試験I 問題1(6)", cat:"語彙:異字同訓",
 text:"(6) 【異字同訓】",
 choices:["切","興","採","収","届"], answer:4,
 explain:"切・興・採・収は、文脈によって共通する訓読みを持つ異字同訓の関係にある漢字とされていますが、「届」はこのグループの訓読みには当てはまらない点で異なります。(この設問は判断がやや専門的なため、詳しくは辞典等でも確認することをおすすめします。)"},

{id:"R2-1-7", tag:"R2 試験I 問題1(7)", cat:"文法:心理動詞の格",
 text:"(7) 【心理動詞の格】",
 choices:["あきれる","あきらめる","したう","うたがう","うやまう"], answer:0,
 explain:"あきらめる・したう・うたがう・うやまうは、いずれも対象をヲ格(「〜を」)で表す心理動詞です。一方「あきれる」は対象をニ格(「〜にあきれる」)で表す点で、格の取り方が他と異なります。"},

{id:"R2-1-8", tag:"R2 試験I 問題1(8)", cat:"文法:ニ格名詞句の意味",
 text:"(8) 【ニ格名詞句の意味】",
 choices:["小林さんに書道を習う。","山田さんに辞書を借りる。","鈴木さんに英語を教わる。","田中さんに財布を預ける。","小川さんに手紙をもらう。"], answer:3,
 explain:"習う・借りる・教わる・もらうの「に」は、動作や物事の出どころ(起点、〜から)を表します。一方「預ける」の「に」は、物を託す先(帰着点、〜へ)を表しており、意味の方向性が他と反対である点で異なります。"},

{id:"R2-1-9", tag:"R2 試験I 問題1(9)", cat:"語彙:とてもの意味",
 text:"(9) 【「とても」の意味】",
 choices:["歩いて家に帰るのはとても無理だ。","あの人の話はとてもつまらない。","そんな話はとても信じられない。","北海道の寒さはとても耐えがたい。","この雨はとてもやみそうにない。"], answer:1,
 explain:"「とても」には、単純な程度の強調(「非常に」)を表す用法と、不可能・困難を強調する用法(「とても〜ない/〜できない」)があります。無理だ・信じられない・耐えがたい・やみそうにないはいずれも不可能・困難を表す表現と共起する後者の用法です。一方「とてもつまらない」は、肯定的な形容詞と共起する単純な程度強調の用法であり、性質が異なります。"},

{id:"R2-1-10", tag:"R2 試験I 問題1(10)", cat:"語彙:肯定否定の対立",
 text:"(10) 【肯定否定の対立】",
 choices:["挨拶します","訪問します","連絡します","失礼します","面会します"], answer:3,
 explain:"挨拶します・訪問します・連絡します・面会しますは、「〜しません」という否定形が、行為を行うか行わないかを実質的に対立させる形で自然に使えます。一方「失礼します」は退出や発言の際の挨拶として定型化した表現であり、「失礼しません」という否定形は同じ意味の対立を作りにくい点で異なります。"},

{id:"R2-1-11", tag:"R2 試験I 問題1(11)", cat:"文法:てくるの用法",
 text:"(11) 【「てくる」の用法】",
 choices:["トラックが荷物を運んでくる。","お客さんがたくさんやってくる。","学校に弁当を持ってくる。","実家から米を送ってくる。","だんだん暖かくなってくる。"], answer:4,
 explain:"運んでくる・やってくる・持ってくる・送ってくるは、いずれも物や人が話し手のもとへ物理的に移動してくることを表す「てくる」の用法です。一方「暖かくなってくる」は、状態が時間とともに変化し続けることを表すアスペクト的な用法であり、物理的な移動を表す他の例とは性質が異なります。"},

{id:"R2-1-12", tag:"R2 試験I 問題1(12)", cat:"文法:条件節の意味",
 text:"(12) 【条件節の意味】",
 choices:["明日になれば雨もやむでしょう。","1,000円も出せば大丈夫でしょう。","タクシーに乗れば早く着くでしょう。","この本を読めば分かるでしょう。","こちらの道を行けば迷わないでしょう。"], answer:0,
 explain:"1,000円も出せば・タクシーに乗れば・この本を読めば・こちらの道を行けばは、いずれも主語が意図的に選択できる行為を条件としています。一方「明日になれば」は、時間が経過すれば自然に成立する条件であり、主体が選択して行う行為ではない点で他と異なります。"},

{id:"R2-1-13", tag:"R2 試験I 問題1(13)", cat:"語彙:身体部位を含んだ表現",
 text:"(13) 【身体部位を含んだ表現の意味】",
 choices:["彼は腹を割って、思いの丈を話してくれた。","他人の家の問題に軽々しく口を挟むべきではない。","農作業の後は、いつも足を洗ってから家に入る。","厄介な仕事に手を出してしまったものだ。","彼女は私の話にはまるで耳を貸そうとしない。"], answer:2,
 explain:"腹を割って(本音で)・口を挟む(割り込んで発言する)・手を出す(関わりを持つ)・耳を貸す(人の話を聞く)は、いずれも身体部位を用いた慣用的(比喩的)な表現です。一方「足を洗ってから家に入る」は、農作業の後に実際に足を洗うという文字通りの意味で使われており、慣用句としての比喩的意味を持たない点で異なります。"},

{id:"R2-1-14", tag:"R2 試験I 問題1(14)", cat:"文法:ト格の意味",
 text:"(14) 【ト格の意味】",
 choices:["ジョンとポールがテレビを見た。","ジョンとポールが楽器を弾いた。","ジョンとポールが歌を歌った。","ジョンとポールが酒を飲んだ。","ジョンとポールがけんかをした。"], answer:4,
 explain:"見た・弾いた・歌った・飲んだは、ジョンとポールがそれぞれ個別に(あるいは一緒に)行うことができる動作であり、「と」は単純な並列(「〜と〜が」)を表します。一方「けんかをした」は、二者が互いに働きかけ合う相互動作であり、「と」が動作の相手(共同動作の相手)を表す点で意味が異なります。"},

{id:"R2-1-15", tag:"R2 試験I 問題1(15)", cat:"語用論:直示表現",
 text:"(15) 【直示表現(ダイクシス)】",
 choices:["こちらは皆、毎日を元気に過ごしています。","後ほど折り返しお電話させていただきます。","駅まで歩いて、そこから電車に乗ります。","今週、会議が三つもあるんですよ。","私は川の向こう側に住んでいるんですよ。"], answer:2,
 explain:"こちら・後ほど・今週・向こう側は、いずれも発話の場(話し手の立場や発話時点)を基準に指し示す直示(ダイクシス)表現です。一方「そこ」は、直前に述べられた「駅」という文脈上の語を指す照応的な用法であり、発話の場に基づく直示とは性質が異なります。"},

{id:"R2-2-1", tag:"R2 試験I 問題2(1)", cat:"誤用分析:聞き取り",
 text:"次の(1)〜(5)における【 】内の下線部は学習者による誤用を示す。これと異なる種類の誤用を、それぞれ1〜4の中から一つずつ選べ。\n\n(1) 【「その辺」と言おうとして「その円」と発音する。】",
 choices:["「後半」と言おうとして「公安」と発音する。","「改変」と言おうとして「開演」と発音する。","「五本」と言おうとして「御恩」と発音する。","「千円」と言おうとして「千年」と発音する。"], answer:3,
 explain:"target・選択肢1・2・3は、いずれも「へ/は/ほ」等のハ行子音[h]が脱落して母音のみになる誤り(子音の脱落)です(その辺→その円、後半→公安、改変→開演、五本→御恩)。一方「千円→千年」は、[en]の後に新たに子音[n]が加わっており、子音の脱落ではなく付加が起きている点で、誤りの種類が異なります。"},

{id:"R2-2-2", tag:"R2 試験I 問題2(2)", cat:"誤用分析:格助詞",
 text:"(2) 【会食を参加したいです。】",
 choices:["新しい規則を従ってください。","何冊かの文献を参考しました。","学校の友達を会いました。","地震や火事を備えましょう。"], answer:1,
 explain:"target・選択肢1・3・4は、本来ニ格を取る動詞(参加する・従う・会う・備える)に誤ってヲ格を用いてしまった、格助詞の混同(ニ→ヲ)の誤りです。一方「文献を参考しました」は、「参考にする」という定型表現の中の「に」が脱落した誤りであり、格助詞の混同とは性質が異なります。"},

{id:"R2-2-3", tag:"R2 試験I 問題2(3)", cat:"誤用分析:一番の用法",
 text:"(3) 【吉田先生も一番やさしい先生だと思います。】",
 choices:["バスよりも地下鉄で行ったほうが一番早いです。","最近、朝や夕方は一番寒くなってきましたね。","簡単な計算を間違えてしまい一番恥ずかしいです。","一番素晴らしいスピーチが多かったです。"], answer:0,
 explain:"targetおよび選択肢2・3・4は、本来一つの対象にしか使えない「一番」(最上級)を、複数の対象や場面に当てはめてしまう誤り(「も」「や」「多かった」などにより複数性が示唆される点で矛盾が生じる誤り)です。一方選択肢1は、二者の比較(バスより地下鉄)に「一番」を用いており、比較対象が2つしかない場面での「一番」の使い方という、別の種類の不自然さです。"},

{id:"R2-2-4", tag:"R2 試験I 問題2(4)", cat:"誤用分析:形容詞の活用",
 text:"(4) 【あの先生の話はいつも本当に面白いだ。】",
 choices:["豊かの教養を身につけたいと思っています。","このパソコンは丈夫し、画質もいいし、軽いです。","昨日、近いスーパーで安売りをしていました。","私の国と違いのはバスや地下鉄の乗り方です。"], answer:2,
 explain:"target(面白いだ)は、イ形容詞にナ形容詞のような「だ」を付けてしまった誤りです。選択肢1(豊かの)・2(丈夫し)・4(違いのは)は、いずれもイ形容詞とナ形容詞(または動詞)の活用パターンを混同した誤りである点でtargetと共通します。一方選択肢3「近いスーパー」はイ形容詞の連体形として文法的には成立しており、活用の混同という誤用の種類には当てはまりません。(この設問はやや判断が難しいため、参考書等でも確認することをおすすめします。)"},

{id:"R2-2-5", tag:"R2 試験I 問題2(5)", cat:"誤用分析:条件形の制約",
 text:"(5) 【東京駅に着けば、乗り換えてください。】",
 choices:["日本に帰れば、お土産を買ってきましょう。","先生にお会いすれば、ぜひご挨拶したい。","彼から荷物が届けば、すぐ知らせてね。","お金をたくさん持てれば、買います。"], answer:3,
 explain:"target・選択肢1・2・3は、いずれも「ば」節の後ろに意志(ましょう)・願望(したい)・依頼(〜てね、命令に近い)など、「ば」条件節が本来続けにくいとされる表現を用いてしまった誤りです。一方選択肢4「お金をたくさん持てれば、買います」は、後件が単純な平叙文(買います)であり、この種の制約に反していない点で、誤用の種類が異なります。"},

{id:"R2-3-1", tag:"R2 試験I 問題3-A(1)", cat:"音声学:声帯振動",
 text:"問題3 次のA〜Dの文章を読み、(1)〜(20)の問いに答えよ。\n\nA 【声帯振動】\n言語音である母音や子音は,主に肺から排出される気流,すなわち呼気によって作られるものが多い。呼気を用いて言語音を生成する際,声帯の振動を伴う場合は有声音となり,振動を伴わない場合は無声音となる。\n日本語の母音に関してよく取り上げられる音声現象の一つとして,母音の無声化がある。母音の無声化とは,音韻論的には,母音があるはずのところで当該母音が声帯の振動を伴わず,発音される現象である。母音の無声化は,狭母音が[p][k]や(ア)などの無声子音に挟まれたときや,(イ)に来たときに起こりやすい。その他,例外的に広母音・中母音においても環境によっては無声化が起こることがある。また,逆に無声化が起こると予想される場合に,無声化しないこともある。\n無声子音が有声音である母音に挟まれた際,有声化する現象として,連濁がある。連濁は二つの語が結合して複合語を作る際,後部要素の最初の拍が有声化する現象である。\n\n(1) 文章中の下線部A「声帯の振動」に関して、声帯振動の有無を感じる方法として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["口の前に薄い紙を垂らして発音してみる。","鼻から息を抜くように発音してみる。","耳を手でふさいで発音してみる。","鼻をつまんで発音してみる。"], answer:2,
 explain:"耳を手でふさいだ状態で発音すると、有声音の場合は声帯の振動が骨伝導によって強く響いて感じられます。これにより声帯振動の有無を体感的に確認できます。"},

{id:"R2-3-2", tag:"R2 試験I 問題3-A(2)", cat:"音声学:母音の無声化",
 text:"(2) 文章中の下線部B「母音の無声化」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["方言差が大きく、例えば東京方言では無声化が起こりやすい。","母音が無声化しても、アクセント核の位置には影響を与えない。","一つの語の中に無声化し得る環境が連続する場合、いずれも無声化する。","母音が無声化するかしないかは、発話の意味理解に影響を与える。"], answer:0,
 explain:"母音の無声化には方言差があり、東京方言(共通語)は無声化が顕著に起こることで知られています。一方、関西方言などでは無声化が起こりにくいとされます。"},

{id:"R2-3-3", tag:"R2 試験I 問題3-A(3)", cat:"音声学:母音の無声化",
 text:"(3) 文章中の(ア)と(イ)に入れるのに最も適当な組み合わせを、次の1〜4の中から一つ選べ。",
 choices:["(ア)[r][n] / (イ)文頭","(ア)[r][n] / (イ)文末","(ア)[ɸ][ç] / (イ)文頭","(ア)[ɸ][ç] / (イ)文末"], answer:3,
 explain:"母音の無声化は、狭母音が[p][k]のほか、[ɸ](ハ行「フ」の子音)や[ç](ハ行「ヒ」の子音)などの無声子音に挟まれたときや、文末に来たときに起こりやすいとされています。"},

{id:"R2-3-4", tag:"R2 試験I 問題3-A(4)", cat:"音声学:広母音・中母音の無声化",
 text:"(4) 文章中の下線部Cに関して、広母音や中母音が無声化する例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「口実」の「こ」","「明快」の「か」","「観戦」の「せ」","「北西」の「ほ」"], answer:3,
 explain:"「北西(ほくせい)」の「ほ」は広母音[o]ですが、後続の無声子音[k]の影響などにより例外的に無声化が起こりやすい例として挙げられます。他の選択肢は、後続する音が母音や鼻音(有声)であり、無声化しにくい環境です。"},

{id:"R2-3-5", tag:"R2 試験I 問題3-A(5)", cat:"音声学:連濁",
 text:"(5) 文章中の下線部D「連濁」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["同じ語であっても、時代によって連濁の有無が変わることがある。","前後の要素が修飾関係でなく並列的な関係の場合、連濁が起こりやすい。","後部要素に濁音が含まれる場合、連濁が回避されやすい。","漢語と外来語に比べて、和語のほうが連濁が起こりやすい。"], answer:1,
 explain:"連濁は、前後の要素が修飾関係にある場合に起こりやすく、対等な並列関係(例:「山」と「川」のような対等な組み合わせ)にある場合はむしろ連濁が起こりにくいとされています(ライマンの法則に関連する傾向)。したがって「並列的な関係の場合、連濁が起こりやすい」という記述は不適当です。"},

{id:"R2-3-6", tag:"R2 試験I 問題3-B(6)", cat:"文法:比較表現",
 text:"B 【比較を表す文型】\n事物を比較する文型には様々なものがある。二つの事物を単純に比較する文型は,「太郎は花子より〜(XはYよりZ)」がその代表例である。一方,「太郎は花子におとらず〜(XはYにおとらずZ)」のような文型は,単純な二つの事物の比較だけでなく,(ア)ことも意味する。これらの文型において,述語の位置にはイ形容詞やナ形容詞,副詞による修飾を受けた動詞以外に(イ)が入ることもある。また,比較の差は程度副詞や数量詞を使って表す。\n三つ以上の事物が関わる比較の代表的な文型としては,「太郎はP(の中)で最も〜(XはPの中で最もZ)」と「P(の中)で太郎ほど〜はいない(Pの中でXほどZはない)」が挙げられる。これらが表す意味は,文中に二つの事物を挙げて比較する文型で言い換えられることもある。また,程度が甚だしいことを表す文型は,この三つ以上の事物が関わる比較の文型と連続的と言える。\n\n(6) 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["太郎も花子も〜ではない","太郎も花子も〜である","花子だけが〜ではない","花子だけが〜である"], answer:1,
 explain:"「太郎は花子におとらず〜」は、単に太郎と花子を比較するだけでなく、「太郎も花子と同様に〜である」という同等性の意味も表します。"},

{id:"R2-3-7", tag:"R2 試験I 問題3-B(7)", cat:"文法:比較表現",
 text:"(7) 文章中の(イ)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["場所を表す指示的名詞","形容詞から転成した派生名詞","具体的な数量を表す名詞","程度副詞によって修飾可能な名詞"], answer:3,
 explain:"比較文の述語位置には、イ形容詞・ナ形容詞・副詞修飾を受けた動詞のほか、「とても紳士だ」のように程度副詞によって修飾できる性質を持つ名詞が入ることもあります。"},

{id:"R2-3-8", tag:"R2 試験I 問題3-B(8)", cat:"文法:程度副詞",
 text:"(8) 文章中の下線部Aに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「もっと」は不特定多数の比較に使い、二つの比較には使わない。","「かなり」は否定文よりも肯定文において多く用いられる。","「少し」が形容詞を修飾すると、絶対的な程度が小さいことを表す。","「3人」などの数量詞は連用用法では使わず、連体用法で使う。"], answer:1,
 explain:"程度副詞「かなり」は、対象への肯定的な評価と結びつきやすく、否定文よりも肯定文で多く用いられる傾向があります。"},

{id:"R2-3-9", tag:"R2 試験I 問題3-B(9)", cat:"文法:比較表現",
 text:"(9) 文章中の下線部Bの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["健康こそが誰しもにとって大切なものだ。","健康以外に私が気をつけているものなどない。","本当に大切なものはただ健康だけだ。","他のどんなものにもまして健康は大切だ。"], answer:3,
 explain:"「他のどんなものにもまして健康は大切だ」は、「健康」と「他のどんなもの」という二つの事物を挙げて比較することで、「健康が最も大切だ(三者以上の中で最上位)」という意味を表しており、下線部Bで説明されている言い換えの例にあたります。"},

{id:"R2-3-10", tag:"R2 試験I 問題3-B(10)", cat:"文法:程度が甚だしい表現",
 text:"(10) 文章中の下線部C「程度が甚だしいことを表す文型」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「至りだ」は、話し手の極限状態は表さない。","「極まりない」は、望ましい状態は表さない。","「この上ない」は、形容詞の連体形の後ろに直接接続しない。","「極みだ」は、「サ変動詞語幹+の」以外の形式には後接しない。"], answer:2,
 explain:"「この上ない」は「幸せこの上ない」のように名詞に接続する形が一般的で、形容詞の連体形に直接続く形では使われません。"},

{id:"R2-3-11", tag:"R2 試験I 問題3-C(11)", cat:"文法:引用節",
 text:"C 【引用】\n複数の節を持つ文のあり方は多様である。その一つである引用節は,対人的モダリティも内部に含むことができるため,独立文とほぼ同等である。また,引用において使われる表現の代表的なものには「と」や「ように」がある。名詞型引用表現では,名詞修飾節と被修飾名詞の間に用いられる助詞がいくつかある。\n「と」を用いた引用節は,主節に使われる動詞の種類によって構造が異なる。また,引用の「ように」にも多様な用法があり注意が必要である。\n\n(11) 文章中の下線部Aの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["父は私にもっと真面目にやれと叱ってきた。","田中君の病気はすぐによくなると見ています。","彼女ならもう来るんじゃないかと思いますよ。","山田先生は生き字引と呼ばれています。"], answer:0,
 explain:"「もっと真面目にやれ」という命令形は、話し手の聞き手に対する働きかけ(対人的モダリティ)を含む独立文的な内容です。他の選択肢の引用節は、推量や名称の叙述であり、対人的モダリティを含みません。"},

{id:"R2-3-12", tag:"R2 試験I 問題3-C(12)", cat:"文法:引用",
 text:"(12) 文章中の下線部B「引用」の例に当てはまらないものを、次の1〜4の中から一つ選べ。",
 choices:["今日は息子に店番をしてとお願いしている。","私はその話を怪しいと疑っている。","彼女はもう行かないとこぼしている。","子ども料金は大人料金の半額となっている。"], answer:3,
 explain:"「子ども料金は大人料金の半額となっている」は、単なる状態の叙述であり、引用節の構造(発話・思考内容を「と」で受ける構造)を持ちません。他の選択肢はいずれも「〜と」で引用された内容を動詞(お願いする・疑う・こぼす)が受ける引用構造です。"},

{id:"R2-3-13", tag:"R2 試験I 問題3-C(13)", cat:"文法:引用の名詞修飾",
 text:"(13) 文章中の下線部C「名詞修飾節と被修飾名詞の間に用いられる助詞」として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["との","って","として","という"], answer:1,
 explain:"「との連絡」「〜としての立場」「〜という話」のように、「との」「として」「という」は名詞修飾節と被修飾名詞をつなぐ助詞として使われます。一方「って」は主に文末や従属節の接続に用いられる口語的な引用形式で、この位置(名詞修飾節と被修飾名詞の間)には使われません。"},

{id:"R2-3-14", tag:"R2 試験I 問題3-C(14)", cat:"文法:引用節と動詞の種類",
 text:"(14) 文章中の下線部Dに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「伝える」などの伝達を表す動詞の場合、引用節内にガ格をとらない。","「頼む」などの依頼を表す動詞の場合、引用節内に「〜しろ」以外も使える。","「言う」などの発話を表す動詞の場合、引用節内に終助詞は使えない。","「思う」などの思考を表す動詞の場合、引用節内にデス・マス体が使える。"], answer:1,
 explain:"依頼を表す動詞「頼む」の引用節内では、命令形「〜しろ」だけでなく、「〜てくれ」「〜てほしい」など他の依頼表現も使うことができます。"},

{id:"R2-3-15", tag:"R2 試験I 問題3-C(15)", cat:"文法:引用のように",
 text:"(15) 文章中の下線部E「引用の『ように』」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["発話を表す「ように」の引用節内では過去形が使えない。","依頼を表す「ように」の引用節内では丁寧体が使えない。","命令を表す「ように」は主節を省略できない。","思考を表す「ように」の「に」は省略できない。"], answer:3,
 explain:"「〜ように思う」のように、思考を表す動詞と共に使われる「ように」の「に」は省略することができません(「〜よう思う」とは言えません)。"},

{id:"R2-3-16", tag:"R2 試験I 問題3-D(16)", cat:"文法史:学校文法",
 text:"D 【学校文法と日本語教育文法】\n学校教育の国語科で教えられる文法は,日本語教育の文法とは別に学校文法と呼ばれる。これは,(ア)の文法論をベースに,形態を重視したものになっている。そのため,学校文法における語の形態や品詞の扱い方や言語形式の単位の捉え方は,日本語教育のそれとは相違する。活用の扱いについても違いが見られる。例えば,日本語教育の文法における辞書形は,学校文法では二種類に呼び分けられる。また,学校文法の活用形は語として文中で単独で使える形にはなっていない。このような違いもあり,日本語教育の文法における活用の体系と学校文法の活用の体系とでは大きく異なっている。\n\n(16) 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["山田孝雄","橋本進吉","三上章","時枝誠記"], answer:1,
 explain:"学校教育で教えられる学校文法は、橋本進吉の文法論(橋本文法)をベースにしています。"},

{id:"R2-3-17", tag:"R2 試験I 問題3-D(17)", cat:"文法史:学校文法",
 text:"(17) 文章中の下線部A「学校文法における語の形態や品詞の扱い方」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["活用を持つ語を「自立語」と呼ぶ。","品詞の一つとして「指示詞」がある。","品詞は文節で区切った単位に等しい。","動詞を語幹と活用語尾に分ける。"], answer:3,
 explain:"学校文法では、動詞を「書く」→語幹「書」+活用語尾「く」のように、語幹と活用語尾に分けて分析します。"},

{id:"R2-3-18", tag:"R2 試験I 問題3-D(18)", cat:"文法史:辞書形と活用形",
 text:"(18) 文章中の下線部Bの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["連体形と終止形","連用形と連体形","終止形と普通形","普通形と連用形"], answer:0,
 explain:"日本語教育文法の「辞書形」(例:「書く」)は、学校文法では終止形と連体形という異なる2つの活用形として呼び分けられます(形態は同じでも文法上の位置づけが異なります)。"},

{id:"R2-3-19", tag:"R2 試験I 問題3-D(19)", cat:"文法史:活用形",
 text:"(19) 文章中の下線部Cの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["動詞の命令形","動詞の未然形","形容動詞の終止形","形容動詞の仮定形"], answer:1,
 explain:"動詞の未然形(例:「書か」)は、単独では文中で使うことができず、必ず「ない」「う(よう)」などが後接した形でのみ使用されます。命令形や終止形は、それ自体で文を終えることができます。"},

{id:"R2-3-20", tag:"R2 試験I 問題3-D(20)", cat:"文法史:活用体系の比較",
 text:"(20) 文章中の下線部Dに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学校文法では、単独で文節を作れる語のうち活用するものを二つの品詞に分けている。","学校文法では、丁寧体に基づいて活用の体系が整理されている。","日本語教育の文法では、活用形の種類が学校文法より相対的に多い。","日本語教育の文法では、「見ない」と「高くない」の「ない」は異なる品詞である。"], answer:2,
 explain:"日本語教育文法では、辞書形・ない形・ます形・て形・た形・ば形・意向形・可能形・受身形・使役形など、学校文法の6活用形(未然・連用・終止・連体・仮定・命令)よりも多くの活用形が設定されているのが一般的です。"},

{id:"R2-4-1", tag:"R2 試験I 問題4 問1", cat:"教授法史",
 text:"問題4 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n外国語教授法は,時代の社会的な要請,言語理論や言語学習理論の展開などを背景に,変遷を重ねてきた。19世紀のヨーロッパでは文法訳読法が主流であったが,19世紀後半にはそれに代わる教授法が台頭してきた。その一つが直接法で,文法は帰納的に教えられた。1950年代にはアメリカで第二言語教育へのニーズが高まり,オーディオ・リンガル・メソッドが開発された。しかし,その後批判されるようになり,1970年代以降,様々な教授法が提唱された。その代表格がコミュニカティブ・アプローチである。その他,ナチュラル・アプローチなども提唱されている。1990年代には,タスク中心の教授法(Task-Based Language Teaching)が注目されるようになった。こうした教授法の歴史を知ることは,教師自身の言語観や言語学習観を考えるうえで役に立つ。\n\n問1 文章中の下線部A「文法訳読法」の前提となっている考え方として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["文型は易しいものから難しいものへと段階的に学ばせることで習得が進む。","練習問題を解くより、楽しく多く読むほうが早く言葉が身につく。","母語に置き換えられるようになることが外国語学習の成功を意味する。","単語や文法規則の暗記により、口頭コミュニケーション能力が向上する。"], answer:2,
 explain:"文法訳読法は、目標言語の文章を正確に母語に翻訳できる能力を養うことを重視する教授法であり、母語への置き換え能力が外国語学習の到達点とされていました。"},

{id:"R2-4-2", tag:"R2 試験I 問題4 問2", cat:"教授法史:直接法",
 text:"問2 文章中の下線部Bに関して、文法の教え方として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["多くの目標言語の実例に接してから、そこに現れた文法規則を発見させる。","媒介語で文法規則を説明してから、その文法を使ってロールプレイをさせる。","目標言語で文法規則を提示し、そこから文型の使い方を確認させる。","媒介語で書かれた解説書で文法規則を予習させ、クラスでは反復練習を行う。"], answer:0,
 explain:"直接法では文法は帰納的に教えられました。これは、多くの実例に触れさせたうえで、学習者自身にそこに潜む文法規則を発見させるという教え方です。"},

{id:"R2-4-3", tag:"R2 試験I 問題4 問3", cat:"教授法史:コミュニカティブアプローチ",
 text:"問3 文章中の下線部C「コミュニカティブ・アプローチ」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["言語形式や構造より文脈における言語の機能や意味を重視する。","やり取りの流暢さより母語話者並みの正確な発音を重視する。","母語の使用を禁止し、目標言語のみで練習するほうが効果的と考える。","自己訂正させるより、教師が間違いを訂正するほうが効果的と考える。"], answer:0,
 explain:"コミュニカティブ・アプローチは、文法形式の正確さよりも、実際の文脈でのコミュニケーション上の機能や意味の伝達を重視する教授法です。"},

{id:"R2-4-4", tag:"R2 試験I 問題4 問4", cat:"教授法史:ナチュラルアプローチ",
 text:"問4 文章中の下線部D「ナチュラル・アプローチ」に基づいた授業に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["言語形式の学習によってモニターが働くよう構造シラバスを採用する。","教材には教科書だけではなく実生活で使う身近な素材も取り入れる。","話すことに早く慣れるよう初期段階から学習者に積極的な発話を促す。","初級よりも中級以上のレベルの授業デザインに用いると効果的である。"], answer:1,
 explain:"ナチュラル・アプローチは、実際の生活で使われる身近で自然な素材をインプットとして取り入れ、自然な言語習得のプロセスを重視する教授法です。"},

{id:"R2-4-5", tag:"R2 試験I 問題4 問5", cat:"教授法史:タスク中心の教授法",
 text:"問5 文章中の下線部E「タスク中心の教授法」の活動例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["グループで無人島生活の必需品のリストを作成し、優先順位をつけさせる。","「窓を開けてください」などの指示を出し、実際にその動作を行わせる。","教師が用意したドラマの役を割り当て、台本の読み合わせをさせる。","「ことができますか」という言語形式の練習を行った後、インタビューをさせる。"], answer:0,
 explain:"タスク中心の教授法は、言語形式の練習自体を目的とするのではなく、意味のある課題(タスク)を達成する過程で言語を使わせることを重視します。グループで無人島生活の必需品を話し合い、優先順位を決めるという活動は、特定の言語形式に限定されない実践的なタスクの例です。"},

{id:"R2-5-1", tag:"R2 試験I 問題5 問1", cat:"語彙指導:新出語導入",
 text:"問題5 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n語彙学習には,語を覚えること自体を目的とした意図的学習がある。例えば,学習者自身が問題集や単語カードを活用して学習する方法が挙げられる。\n意図的学習は授業においても行われるが,教師は初級学習者に対して新出語を導入する際,様々な工夫が求められる。また,初級学習者に語彙のタスクを与える場合,方法によっては目的を達成することができないので留意が必要である。中級段階では,読み物の中に出てきた語について階層的関係を示したり,類義語や対義語を示したりして語彙の定着を図ることもある。その際,対義語には(ア)ものがあるため,指導においては注意が必要である。このような意図的学習は,付随的学習と補完し合うことで記憶が補強されることもある。\n\n問1 文章中の下線部A「初級学習者に対して新出語を導入する際」の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習の負担が軽減できるよう、汎用性がある高頻度の語を選んで導入する。","速く覚えられるよう、定型表現や決まり文句などは一語ずつ分解して導入する。","長期記憶に残せるよう、文脈や使用される場面から切り離して導入する。","効率的に覚えられるよう、形や意味に類似性のあるものをセットにして導入する。"], answer:0,
 explain:"初級学習者への新出語導入では、学習負担を減らすために、様々な場面で使える汎用性の高い高頻度語を優先して導入することが望ましいとされます。定型表現をわざわざ分解したり、文脈から切り離したり、形や意味が紛らわしい語をセットで導入したりすることは、むしろ学習を難しくします。"},

{id:"R2-5-2", tag:"R2 試験I 問題5 問2", cat:"語彙指導:タスク",
 text:"問2 文章中の下線部Bに関して、目的と方法が一致していないタスクを、次の1〜4の中から一つ選べ。",
 choices:["記憶に残りやすくするために、学習する語を示して自分の体験談を書かせる。","学習した語を理解しているかどうか確認するために、短文のリピートをさせる。","どのような文脈で使われるか学ばせるために、学習する語を含む文の一部を与え、文全体を完成させる。","学習する語と母語の対応語との意味や用法の違いに気づかせるために、学習者の母語の文を日本語に翻訳させる。"], answer:1,
 explain:"短文をそのまま繰り返す(リピートする)だけでは、発音や音の模倣はできても、語の意味を理解しているかどうかを確認することにはなりません。目的(理解の確認)と方法(単純な復唱)が一致していない例です。"},

{id:"R2-5-3", tag:"R2 試験I 問題5 問3", cat:"語彙指導:階層関係",
 text:"問3 文章中の下線部C「階層的関係」にある語の組み合わせとして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「販売する」と「購入する」","「賛成」と「同意」","「動物」と「鳥」","「杉」と「松」"], answer:2,
 explain:"「動物」は上位語、「鳥」はその下位語(動物というカテゴリーに含まれる一種)であり、上位-下位の階層的関係にあります。「販売する/購入する」は対義関係、「賛成/同意」は類義関係、「杉/松」は同じ階層の並列的な関係(共通の上位語「木」を持つ語同士)です。"},

{id:"R2-5-4", tag:"R2 試験I 問題5 問4", cat:"語彙指導:対義語",
 text:"問4 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「ぼけ」と「つっこみ」のように、対になる語の品詞が同一ではない","「高い」に対する「安い」「低い」のように、一対一の対立ではない","「桜」と「梅」などのように、一組で用いられる対語となっている","「不急」と「火急」のように、対になる語の語種が異なっている"], answer:1,
 explain:"「高い」に対して「安い」(値段の対義語)と「低い」(高さの対義語)のように、一つの語に複数の対義語が対応する場合があり、対義語は必ずしも一対一の対応にならない点に、指導上の注意が必要です。"},

{id:"R2-5-5", tag:"R2 試験I 問題5 問5", cat:"語彙指導:意図的学習と付随的学習",
 text:"問5 文章中の下線部Dに関して、意図的学習が付随的学習によって補完された例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["漫画を読んで知った語を何度も声に出して練習した。","新聞を読んでいるときに見つけた未知語を書き留めて調べた。","アニメのせりふの意味が分かったので、単語帳に記入した。","漢字クラスで習った語を車内広告で目にし、理解できた。"], answer:3,
 explain:"漢字クラスでの意図的学習によって覚えた語を、その後、車内広告という日常生活の中(付随的学習の場面)で偶然目にして再確認・理解できたという例は、意図的学習が付随的学習によって補完・強化された典型例です。"},

{id:"R2-6-1", tag:"R2 試験I 問題6 問1", cat:"コミュニケーション能力:談話能力",
 text:"問題6 次の文章を読み、下の問い(問1〜5)に答えよ。\n\nコミュニケーション能力を高めることを重視した授業では様々な指導が行われている。中級以上の会話の授業では,社会言語能力や談話能力を高める指導が必要である。また,コミュニケーション・ストラテジーの効果的な使用も意識させたほうがよい。さらに,書く活動においてもコミュニケーション能力の養成を意識した活動が求められる。近年はプロフィシェンシーの育成を目指した教育実践もある。\n指導にあたっては,学習者の発話や作文において語用論的転移による誤りが起こる可能性があることを理解しておく必要がある。\n\n問1 文章中の下線部A「談話能力を高める指導」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["表情や体の動きなどの非言語行動を意識させる。","会話の相手や会話の場面に合った表現を考えさせる。","学習者自身に自分の発音の不自然な点を見つけさせる。","いろいろな相づちやそのタイミングに気づかせる。"], answer:3,
 explain:"談話能力は、複数の発話をつなげてまとまりのある会話・談話を構成・維持する能力です。相づちの種類やタイミングへの気づきは、会話を円滑に進める談話管理の技術であり、談話能力を高める指導の例といえます。"},

{id:"R2-6-2", tag:"R2 試験I 問題6 問2", cat:"コミュニケーション能力:方略",
 text:"問2 文章中の下線部B「コミュニケーション・ストラテジー」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["会話の中で新たに学んだ表現を忘れないようにメモする。","言いたいことが目標言語で言えないときに、母語を直訳して言う。","母語話者に自分の発話を訂正されたら、その表現を繰り返す。","新しく習った表現を実際の会話の場面で積極的に使う。"], answer:1,
 explain:"コミュニケーション・ストラテジーは、言語知識が不足している状況でも何とかコミュニケーションを成立させるために用いる方策です。言いたいことが目標言語でうまく表現できないとき、母語を直訳してでも伝えようとするのは、この方略の例です。"},

{id:"R2-6-3", tag:"R2 試験I 問題6 問3", cat:"コミュニケーション能力:書く活動",
 text:"問3 文章中の下線部Cの例として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["旅先で見聞きしたことを友人に手紙で知らせる。","取引先からの連絡内容を上司にメールで伝える。","学食のアンケートでメニューについて意見を書く。","ある物語を別の登場人物の視点で再構築して書く。"], answer:3,
 explain:"旅先の報告・取引先からの連絡の伝達・アンケートへの意見はいずれも、特定の相手や目的を持つ実際のコミュニケーション場面を想定した書く活動です。一方「物語を別の視点で再構築して書く」ことは、創作的な文章表現の練習であり、実際のコミュニケーション場面を意識した活動とは性質が異なります。"},

{id:"R2-6-4", tag:"R2 試験I 問題6 問4", cat:"コミュニケーション能力:プロフィシェンシー",
 text:"問4 文章中の下線部D「プロフィシェンシー」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["自分で問題を発見し、主体的に解決する能力","ある対象を把握する際に別の対象を手がかりにする能力","場面や状況に合わせ適切に言語を使う能力","目標言語の文法体系を直観的に把握する能力"], answer:2,
 explain:"プロフィシェンシーは、単なる知識としての言語能力ではなく、実際の場面や状況に応じて適切に言語を運用できる総合的な能力を指します。"},

{id:"R2-6-5", tag:"R2 試験I 問題6 問5", cat:"語用論:語用論的転移",
 text:"問5 文章中の下線部E「語用論的転移」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["先生に予定を伝えるメールの中で「今年就職ができないとすると、国へ帰るつもりです」と書く。","思いがけない贈り物をくれた人へのお礼状の中で「プレゼントをもらって驚愕しました」と書く。","目上の人に誘われたときに「その日は約束があるから行きません」と言う。","友達に気持ちを伝えるときに「はっきりと、honestlyに言うとね」と言う。"], answer:2,
 explain:"目上の人からの誘いを、理由だけを述べて直接的に断るというスタイルは、母語の語用論的な配慮の仕方がそのまま持ち込まれた例と考えられ、目上への配慮という日本語の語用論的規範とずれが生じています。他の選択肢は、文法的な誤り、語彙選択の不自然さ、コードスイッチング(母語混入)であり、語用論的転移とは性質が異なります。"},

{id:"R2-7-1", tag:"R2 試験I 問題7 問1", cat:"第二言語習得:逆行",
 text:"問題7 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n学習者は様々な誤用を産出しながら外国語を習得していく。習得の過程では「逆行」と呼ばれる現象などが起こるため,教師は学習者の誤用を的確に分析し,効果的な指導につなげることが求められる。\n誤用の一つに,文法的な正確さに関わる誤用がある。また,誤用の現れ方としては,当該項目を他の項目と取り違える「混同」や形態上の誤りである「誤形成」などがある。\n指導につなげるには母語の影響など,誤用が産出された背景を考えることが重要である。そのほか,学習者の言語処理ストラテジーの影響,教師による指導の影響など様々なものがある。一つの誤用に複数の原因が想定される場合も多いため,注意深く観察する必要がある。\n\n問1 文章中の下線部A「逆行」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「会社の前」と言うべきところで、「前の会社」と語順が反対になる。","「2020年10月25日」と言うべきところで、「25日、10月、2020年」のように言う。","子どもに対して、「ワンワン、好き?」のように幼児語や短い文で言う。","「おいしかったです」と言えていたが、「おいしいでした」と言うようになる。"], answer:3,
 explain:"逆行(バックスライディング)は、一度は正しく習得していた形式が、学習が進む過程で一時的に誤った形に戻ってしまう現象です。「おいしかったです」と正しく言えていたのに、後で「おいしいでした」という誤った形を使うようになる例がこれにあたります。"},

{id:"R2-7-2", tag:"R2 試験I 問題7 問2", cat:"誤用分析:文法的正確さ",
 text:"問2 文章中の下線部B「文法的な正確さに関わる誤用」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["(具合はどうか聞かれた際に)「新しい薬が風邪を治しました。もう大丈夫です」","(道に迷って通行人に尋ねる際に)「すみません、私はどこにいますか」","(昨日の出来事を話す際に)「テストを受けているうちに、携帯電話が鳴りました」","(警察に盗難の届け出をする際に)「誰かが私のパソコンを盗みました」"], answer:2,
 explain:"「〜ているうちに」は、ある状態・行為が続く間に別の変化が生じることを表す表現で、通常は変化を伴う継続状況とともに使われます。単に「テストを受けている間に電話が鳴った」という単純な同時進行を表すには不自然であり、文法的な正確さに関わる誤用の例といえます。"},

{id:"R2-7-3", tag:"R2 試験I 問題7 問3", cat:"誤用分析:誤形成",
 text:"問3 文章中の下線部C「誤形成」の例として最も適当なものを、次の1〜4の中から一つ選べ。\n\n(表出した発話(誤用) → 発話意図(正用))\n1 目上の人に対して尊敬すべきだ。 → 目上の人を尊敬すべきだ。\n2 必要なら高かっても買います。 → 必要なら高くても買います。\n3 昨日から熱38度がある。 → 昨日から熱が38度ある。\n4 会議の途中で席から出た。 → 会議の途中で席を立った。",
 choices:["選択肢1(に/を格助詞の誤り)","選択肢2(高かっても/高くても)","選択肢3(語順・助詞位置の誤り)","選択肢4(席から出た/席を立った)"], answer:1,
 explain:"「高かっても」は、イ形容詞「高い」の正しい活用形「高くても」を、過去形「高かった」に条件表現「ても」を接続させるような誤った形で作ってしまったものです。このように、既存の形態素を組み合わせる際に誤った形を作り出してしまう誤りが「誤形成」にあたります。"},

{id:"R2-7-4", tag:"R2 試験I 問題7 問4", cat:"誤用分析:母語の影響",
 text:"問4 文章中の下線部D「母語の影響」が考えられる発音の誤用例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["英語母語話者が「電線」と言ったつもりが「テンセン」に聞こえる。","韓国語母語話者が「苦労」と言ったつもりが「クノウ」に聞こえる。","タイ語母語話者が「花」と言ったつもりが「アナ」に聞こえる。","スペイン語母語話者が「山」と言ったつもりが「ジャマ」に聞こえる。"], answer:0,
 explain:"英語には語頭以外の位置で有声・無声の対立が中和しやすい音韻的特徴があり、「電線(でんせん)」の濁音「で」が無声化した「て」のように聞こえる(テンセン)ことがあります。これは母語である英語の音韻規則の影響を受けた発音の誤用例です。"},

{id:"R2-7-5", tag:"R2 試験I 問題7 問5", cat:"第二言語習得:言語処理ストラテジー",
 text:"問5 文章中の下線部E「学習者の言語処理ストラテジー」のうち、「付加のストラテジー」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「うちにはテレビがない」と言うべきところを「うちにはテレビがあるじゃない」と言う。","「友達と遊ぶ。その人は日本人だ」と言うべきところを「友達と遊ぶ。あの人は日本人だ」と言う。","「家の前で話をしました」と言うべきところを「家の前に話をしました」と言う。","「何も考えられません」と言うべきところを「何も考えれません」と言う。"], answer:0,
 explain:"付加のストラテジーは、既知の言語形式を不必要に付け加えてしまう誤りです。「テレビがない」と言うべきところに、余分な要素(「〜じゃない」)を付加して「テレビがあるじゃない」としてしまう例がこれにあたります。"},

{id:"R2-8-1", tag:"R2 試験I 問題8 問1", cat:"異文化適応:カルチャーショック",
 text:"問題8 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n異文化環境に移行すると,心理的にも様々な変化があり,違和感やストレスを感じたり,混乱が生じたりする。カルチャー・ショックは,異文化適応過程の一部であると言われている。異文化適応の過程を説明するモデルは複数あり,よく知られているものとしては「Uカーブモデル」やベネット(M.Bennett)が提唱した「異文化感受性発達モデル」がある。「異文化感受性発達モデル」では,自文化中心主義(ethnocentrism)から文化相対主義(cultural relativism)への移行が基本的な道筋とされる。このような過程において,文化的アイデンティティに変化がもたらされる。異文化への接触や体験によってもたらされる文化変容を説明する理論的枠組みとしては,ベリー(J.W.Berry)が提唱した分類法がよく知られている。\n\n問1 文章中の下線部A「カルチャー・ショック」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["新しい環境や人間関係の中で増幅され続ける。","自文化との差異を理解でき、視野が広がる段階である。","慣れ親しんだ行動規範を喪失することに起因する。","他者に対する優越感や劣等感によってもたらされる。"], answer:2,
 explain:"カルチャー・ショックは、それまで無意識に頼っていた自文化の行動規範やサイン(当たり前の習慣・ルール)が、異文化環境では通用しなくなる(喪失する)ことによって生じる心理的な混乱とされています。"},

{id:"R2-8-2", tag:"R2 試験I 問題8 問2", cat:"異文化適応:Uカーブモデル",
 text:"問2 文章中の下線部B「Uカーブモデル」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["異文化適応を出国から帰国直前までの精神的満足度の変化で説明している。","異文化適応を他者への配慮と自分への配慮の二つの軸で説明している。","異文化適応と自文化への再適応の二つの過程を合わせて説明している。","異文化適応をストレス、適応、成長のダイナミクスであると説明している。"], answer:0,
 explain:"Uカーブモデルは、異文化に渡ってから帰国直前までの期間における、滞在者の精神的満足度(適応度)の時間的推移をU字型の曲線で説明するモデルです。"},

{id:"R2-8-3", tag:"R2 試験I 問題8 問3", cat:"異文化適応:自文化中心主義",
 text:"問3 文章中の下線部C「自文化中心主義」に関して、日本人が異文化に対して自文化中心主義的な見方をしている例はどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["手で食事をするのを見て、食事のマナーに反していると思う。","手で食事をするのを見て、そうしたい人はそうすればいいと思う。","手で食事をするのを見て、自分の国とは異なる文化だと思う。","手で食事をするのを見て、自分も同じようにまねすべきだと思う。"], answer:0,
 explain:"自文化中心主義は、自文化の価値基準を絶対的なものとして他文化を評価・判断する見方です。「マナーに反している」と、自文化(日本)の食事マナーを基準に相手の文化を否定的に評価することが、この典型例です。"},

{id:"R2-8-4", tag:"R2 試験I 問題8 問4", cat:"異文化適応:文化的アイデンティティ",
 text:"問4 文章中の下線部D「文化的アイデンティティ」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["個人の違いを超えた国家、民族などのパーソナリティーの特徴のこと","ある文化について人々に共有され、社会全体に普及した考えのこと","自分自身がある文化に所属しているという感覚あるいは意識のこと","信頼感などの心理的要因により自然に形成された集団内の関係性のこと"], answer:2,
 explain:"文化的アイデンティティとは、個人が自分自身をある特定の文化集団に属する一員として認識する感覚・意識のことです。"},

{id:"R2-8-5", tag:"R2 試験I 問題8 問5", cat:"異文化適応:ベリーの分類法",
 text:"問5 文章中の下線部E「ベリー(J.W.Berry)が提唱した分類法」に関して、「統合」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["異文化を否定的に捉え、自文化を守り陶酔する状態","異文化を意識的に排除し、自文化も意識化しない状態","自文化を顧みず、異文化の全てを取り入れようとする状態","自文化を保ちながら、異文化も取り入れようとする状態"], answer:3,
 explain:"ベリーの文化変容モデルにおける「統合(integration)」は、自文化のアイデンティティを保持しながら、同時に異文化とも積極的に関わり、その要素を取り入れていく状態を指します。"},

{id:"R2-9-1", tag:"R2 試験I 問題9 問1", cat:"バイリンガル教育:臨界期仮説",
 text:"問題9 次の文章を読み、下の問い(問1〜5)に答えよ。\n\nある年齢を過ぎると第二言語の習得が難しくなると言われている。「臨界期仮説」は,このような考え方を説明するもので,バイリンガル教育においても注目されている。\n二言語併用下にある外国人児童生徒等は,バイリテラルに育つ可能性がある。その一方で,教科の成績が上がらないといった問題を抱えているケースが見られる。そのため,学習言語の解明とその養成のための指導が検討されてきた。学習言語は,言語的側面,認知的側面などから成るとする説がある。その説を説明する概念として,カミンズ(J.Cummins)の学習言語能力(CALP)がある。またカミンズは,第一言語と第二言語の関係について二言語基底共有説(氷山説)も提唱しており,国内外のバイリンガル教育において広く参照されている。\n\n問1 文章中の下線部A「臨界期仮説」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["大人は抽象的分析能力が発達しているため、第二言語の自然習得が容易である。","第二言語の習得を開始する年齢が高ければ高いほど、最終的な到達度が高い。","大人より子どものほうが、第二言語習得の初期段階では習得速度が速い。","第二言語習得に適した開始時期(年齢)は、音韻や統語などでそれぞれ異なる。"], answer:3,
 explain:"臨界期仮説に関する研究では、発音(音韻)と文法(統語)など言語の領域によって、習得に適した年齢的な限界(臨界期)が異なる可能性が指摘されています。"},

{id:"R2-9-2", tag:"R2 試験I 問題9 問2", cat:"バイリンガル教育:バイリテラル",
 text:"問2 文章中の下線部B「バイリテラル」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「聞く」「話す」「書く」は一言語で「読む」は二言語で十分に発達していること","「聞く」「読む」も「話す」「書く」も二言語ともに十分に発達していること","「聞く」「話す」が二言語ででき、認知・行動・心情面で文化を習得していること","「聞く」が二言語ででき、認知・行動・心情面で文化を習得していること"], answer:1,
 explain:"バイリテラルとは、二つの言語の両方において、聞く・読む・話す・書くという四技能がいずれも十分に発達している状態を指します。"},

{id:"R2-9-3", tag:"R2 試験I 問題9 問3", cat:"バイリンガル教育:CALP",
 text:"問3 文章中の下線部C「認知的側面」の構成要素ではないものを、次の1〜4の中から一つ選べ。",
 choices:["スピーチなどの場面に即したフォーマルな言語使用","教科書などの文章理解に効果的に働く背景知識","ノートをとったり文章を要約したりするためのメタ言語認識","著者の見方を理解して意図を探るなどの高次の思考"], answer:0,
 explain:"「スピーチなどの場面に即したフォーマルな言語使用」は、場面や文脈に応じた言語使用という社会言語的な側面に関わるものであり、学習言語能力(CALP)の認知的側面(背景知識・メタ言語認識・高次の思考など)の構成要素ではありません。"},

{id:"R2-9-4", tag:"R2 試験I 問題9 問4", cat:"バイリンガル教育:CALP",
 text:"問4 文章中の下線部D「学習言語能力」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「認知力必要度」が低く、「場面依存度」が高い言語活動ができる。","「認知力必要度」が低く、「場面依存度」も低い言語活動ができる。","「認知力必要度」が高く、「場面依存度」も高い言語活動ができる。","「認知力必要度」が高く、「場面依存度」が低い言語活動ができる。"], answer:3,
 explain:"学習言語能力(CALP)は、認知的な要求度が高く、文脈(場面)への依存度が低い、脱文脈化された言語活動(教科学習など)を遂行する能力を指します。"},

{id:"R2-9-5", tag:"R2 試験I 問題9 問5", cat:"バイリンガル教育:二言語基底共有説",
 text:"問5 文章中の下線部E「二言語基底共有説」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["数学等の概念的知識や学習ストラテジーは、二言語間で転移する。","第二言語による基本的な対話能力は、2年程度で習得できる。","二言語を同等に使うためには、母語による認知能力の発達が必須である。","二言語は独立して機能し、頭の中の限られたスペースで二つが共存している。"], answer:0,
 explain:"二言語基底共有説(氷山説)は、二つの言語の表面的な運用は別々に見えても、その根底にある認知的・学問的な能力(概念的知識や学習ストラテジーなど)は共有されており、一方の言語で身につけた力がもう一方の言語にも転移すると考える説です。"},

{id:"R2-10-1", tag:"R2 試験I 問題10 問1", cat:"読解:スキーマ",
 text:"問題10 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n文章を読むとき,私たちは文の言語情報を解析しつつ,同時に過去に得た知識や概念を活性化させ,整合性のある理解を築こうとする。次の例文を読んでみよう。\n\n<例文>\nそのボクシング選手は代表選考から外れ,悔しがった。\n彼女は何年も厳しい練習に耐えてきたのだ。\n\nこの二文目の「彼女」を「彼」に置き換えると,同じ文でも読み時間は短くなる。「彼女」だと読み時間が長くなるのは,「ボクシング選手」に対する(ア)が活性化され,認知的な葛藤が起きたことによる。また,読み手は推論を行いながら文章を読む。このような読みの過程で,文と文との間の(イ)関係が築かれる。その際,照応の理解が重要な要素となる。\n文章を正確に読むためには,メトニミーなどの理解も必要である。さらに,理解補償方略,内容理解方略,理解深化方略といった文章理解方略を使って読み進めていくことも効果的である。\n\n問1 文章中の(ア)と(イ)に入れるのに最も適当な組み合わせを、次の1〜4の中から一つ選べ。",
 choices:["(ア)レキシーム / (イ)結束","(ア)レキシーム / (イ)包摂","(ア)スキーマ / (イ)結束","(ア)スキーマ / (イ)包摂"], answer:2,
 explain:"「ボクシング選手」という語から、読み手は典型的に男性を想定するスキーマ(既有知識の枠組み)を活性化させます。「彼女」という表現はこのスキーマと葛藤を起こすため、読み時間が長くなります。また、文と文との間には結束(cohesion)関係が築かれます。"},

{id:"R2-10-2", tag:"R2 試験I 問題10 問2", cat:"読解:精緻化推論",
 text:"問2 文章中の下線部A「推論」の一種である「精緻化推論」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["二つの文を原因と結果で関係づける。","未知語の意味の推測に関わる。","文章の大意を把握するのに不可欠である。","文章のこの後の展開を予測する。"], answer:3,
 explain:"精緻化推論は、文章に明示的に書かれていない情報を、読み手が持つ知識をもとに補いながら読み進める推論です。文章のこの後の展開を予測することは、その代表的な働きの一つです。"},

{id:"R2-10-3", tag:"R2 試験I 問題10 問3", cat:"読解:照応",
 text:"問3 文章中の下線部B「照応」に関して、文章中の例文に対する「照応」の記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["自身が体験したことのある「悔しがる」状況を想起する。","「彼女」と「そのボクシング選手」が同一人物かどうか考える。","「何年も」から「代表選考」は数年に一度だと解釈する。","「厳しい練習」とはどのような練習だったのかと想像する。"], answer:1,
 explain:"照応は、文中の代名詞などの指示表現が、それより前に出てきたどの語(先行詞)を指しているかを結びつけて理解する処理です。「彼女」が「そのボクシング選手」と同一人物かどうかを考えることが、この例にあたります。"},

{id:"R2-10-4", tag:"R2 試験I 問題10 問4", cat:"読解:メトニミー",
 text:"問4 文章中の下線部C「メトニミー」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ジョッキを飲み干す。","週末は花見に行こう。","友達が約束を破った。","パンの耳を食べる。"], answer:0,
 explain:"メトニミー(換喩)は、あるものを、それと隣接・関連する別のもので表す比喩です。「ジョッキを飲み干す」は、容器である「ジョッキ」で、その中身(飲み物)を指しており、典型的なメトニミーの例です。"},

{id:"R2-10-5", tag:"R2 試験I 問題10 問5", cat:"読解:理解補償方略",
 text:"問5 文章中の下線部D「理解補償方略」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["文章中の出来事を図や表で整理する。","段落ごとに、中心文と支持文を抜き出す。","分からなかった所に戻って読み直す。","文章に出てきた専門用語の訳語を調べる。"], answer:2,
 explain:"理解補償方略は、理解がうまくいかなかった箇所を補うための方略です。分からなかった箇所に戻って読み直すことは、理解の不足を補うための典型的な方略です。"},

{id:"R2-11-1", tag:"R2 試験I 問題11 問1", cat:"言語接触:外来語の歴史",
 text:"問題11 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n言語は絶えず他言語と接触を繰り返しており,相互に影響を与えている。日本語は,古くから中国語の影響を大きく受け,漢語を取り入れてきた。また,16世紀半ばから17世紀初めには(ア),18世紀から19世紀半ばには(イ)などの西欧語を外来語として取り入れた。日本国内の言語間でも言語接触が見られ,例えばアイヌ語の音がそのまま残っていることが推測できる地名もある。\n一方,明治期以降には,植民地主義政策のもとで行われた日本語教育により,新たな日本語の変種が生まれた。パラオでは,現地語と日本語のダイグロシアが形成された。また台湾では,日本語がリンガフランカとして機能していた。そのような状況から台湾では日本語をベースとしたピジンが生まれ,「宜蘭クレオール」と呼ばれるクレオールになった。\n\n問1 文章中の(ア)と(イ)に入れるのに最も適当な組み合わせを、次の1〜4の中から一つ選べ。",
 choices:["(ア)ドイツ語 / (イ)スペイン語","(ア)スペイン語 / (イ)ドイツ語","(ア)ポルトガル語 / (イ)オランダ語","(ア)オランダ語 / (イ)ポルトガル語"], answer:2,
 explain:"16世紀半ばから17世紀初め(南蛮貿易の時代)にはポルトガル語から、18世紀から19世紀半ば(蘭学の時代)にはオランダ語から、それぞれ多くの語彙が外来語として日本語に取り入れられました。"},

{id:"R2-11-2", tag:"R2 試験I 問題11 問2", cat:"言語接触:アイヌ語由来の地名",
 text:"問2 文章中の下線部A「アイヌ語の音がそのまま残っていることが推測できる地名」はどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["旭川","札幌","青森","弘前"], answer:1,
 explain:"「札幌」は、アイヌ語の「サッ・ポロ・ペッ(乾いた大きな川)」に由来するとされ、アイヌ語の音がそのまま残っていると考えられる代表的な地名です。"},

{id:"R2-11-3", tag:"R2 試験I 問題11 問3", cat:"社会言語学:ダイグロシア",
 text:"問3 文章中の下線部B「ダイグロシア」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["二つの言語が母語として使用される社会で第三の言語が使用される状況","二つの言語が互いに機能を分担して一つの社会で使用される状況","一方の言語が他方の言語に取り替えられて、存続できなくなる状況","一方の言語が他方の言語の干渉を受けて、言語変容が起こる状況"], answer:1,
 explain:"ダイグロシアは、一つの社会の中で二つの言語(または変種)が、それぞれ異なる場面・機能(例えば公的場面と日常場面)に使い分けられて共存している状況を指します。"},

{id:"R2-11-4", tag:"R2 試験I 問題11 問4", cat:"社会言語学:リンガフランカ",
 text:"問4 文章中の下線部C「リンガフランカ」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["異なる言語を話す話者間の共通語として用いられる言葉である。","一国内の共通語として定められる国の象徴的な言語である。","国民国家におけるナショナリズム醸成に利用される言葉である。","異なる国の間の共通語として国際機関が定めた媒介言語である。"], answer:0,
 explain:"リンガフランカは、母語を異にする話者同士が意思疎通を図るために共通語として用いる言語を指します。特定の機関によって公式に定められた言語である必要はありません。"},

{id:"R2-11-5", tag:"R2 試験I 問題11 問5", cat:"社会言語学:クレオールとピジン",
 text:"問5 文章中の下線部D「クレオール」に関して、「ピジン」と比較した記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ピジンと異なり、母語話者が存在する。","ピジンと異なり、公用語になったものがある。","ピジンと同様に、文法的な構造が未発達である。","ピジンと同様に、複数の言語からの語彙が見られる。"], answer:2,
 explain:"クレオールは、ピジンが母語として次世代に受け継がれる過程で、文法構造がより発達・複雑化したものです。したがって「ピジンと同様に文法的な構造が未発達である」という記述は不適当で、実際にはクレオールの文法構造はピジンよりも発達しています。"},

{id:"R2-12-1", tag:"R2 試験I 問題12 問1", cat:"言語学:サピア・ウォーフの仮説",
 text:"問題12 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n言語間で語彙の特徴を調べると,同じ事象でも捉え方が異なることに気がつく。こういった現象を論じた理論に,サピア・ウォーフの仮説がある。この仮説によると,例えば,色彩や気候に関する語彙は言語によって事象の切り取り方が異なる。また,ある社会においては,特定の語が一般化した意味で使用される例やその逆の現象も見られる。さらに,忌み言葉など,特定の場面の縁起の良し悪しを反映した語彙もある。\n日本語の語彙は,出自によって和語,漢語,外来語,混種語に分けられており,表記も複雑であるという特徴がある。\n\n問1 文章中の下線部A「サピア・ウォーフの仮説」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["参加者・場所・話題の3要素が言語使用に複合的に影響するという考え方","内容を表す語が次第に抽象的な働きを果たすようになるという考え方","社会構造が言語の文法体系に影響を与えているという考え方","母語話者の思考や経験様式が言語に依存しているという考え方"], answer:3,
 explain:"サピア・ウォーフの仮説(言語相対論)は、話者の思考様式や世界の捉え方(経験様式)が、話者の母語の構造によって影響を受ける、あるいは規定されるとする考え方です。"},

{id:"R2-12-2", tag:"R2 試験I 問題12 問2", cat:"言語学:言語による切り取り方の違い",
 text:"問2 文章中の下線部Bと同様の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本語には「常識」「哲学」のように西欧語を翻訳した語彙がある。","日本語には「厚い」「暑い」のように同音異義の語彙がある。","日本語には「兄」「弟」のように生まれた順番に応じた語彙がある。","日本語には「旦那」「刹那」のように仏教を通じて入ってきた語彙がある。"], answer:2,
 explain:"英語のbrotherのように年齢を区別しない言語がある一方、日本語は「兄」「弟」のように生まれた順番(年上か年下か)によって語彙を使い分けます。これは、色彩や気候の語彙と同様に、言語によって同じ事象(きょうだい関係)の切り取り方が異なる例です。"},

{id:"R2-12-3", tag:"R2 試験I 問題12 問3", cat:"語彙:意味の一般化",
 text:"問3 文章中の下線部C「特定の語が一般化した意味で使用される例」として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["瀬戸物","卵雑炊","花吹雪","親子丼"], answer:0,
 explain:"「瀬戸物」は本来、愛知県瀬戸市周辺で作られた陶磁器を指す語でしたが、現在では産地を問わず陶磁器一般を指す語として一般化して使われています。"},

{id:"R2-12-4", tag:"R2 試験I 問題12 問4", cat:"語彙:忌み言葉",
 text:"問4 文章中の下線部D「忌み言葉」を言い換えた表現の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["葬式で「お慰めの言葉もございません」と言う。","葬式で「ご愁傷さまです」と言う。","結婚式で「結びになりますが」と言う。","結婚式で「僭越ではございますが」と言う。"], answer:2,
 explain:"結婚式では「切れる」「終わる」「別れる」といった、別離や終わりを連想させる忌み言葉を避ける習慣があります。スピーチの終わりを「終わります」ではなく「結びになりますが」と言い換えるのは、この忌み言葉を回避する典型的な表現です。"},

{id:"R2-12-5", tag:"R2 試験I 問題12 問5", cat:"語彙:混種語",
 text:"問5 文章中の下線部E「混種語」に関して、他と語種の組み合わせが異なるものを、次の1〜4の中から一つ選べ。",
 choices:["中華ソバ","窓ガラス","長ズボン","生ビール"], answer:0,
 explain:"「窓ガラス」「長ズボン」「生ビール」は、いずれも「和語+外来語」の組み合わせです。一方「中華ソバ」は「漢語(中華)+外来語(ソバ、オランダ語由来ともされる)」の組み合わせであり、他の3語と語種の組み合わせが異なります。"},

{id:"R2-13-1", tag:"R2 試験I 問題13 問1", cat:"語用論:コミュニケーションの行き違い",
 text:"問題13 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日常の場面では,様々なコミュニケーション上の行き違いが生じる。その行き違いには,音韻レベル,統語レベル,意味レベルなど様々なものがある。文化的な相違に起因する行き違いは,高コンテクスト文化と低コンテクスト文化という概念で説明されることがある。\nまた,期待されるコミュニケーション・スタイルも文化によって異なる。例えば,日本語の「褒めの応答」にも一定の傾向が見られ,状況や人間関係に応じて肯定応答,否定応答,回避等が選択されている。\nこのような文化差が原因で,非母語話者が母語話者の持つ言語規範や期待から逸脱(違反)することがある。その場合に,円滑なコミュニケーションを目指して逸脱に対する評価や調整が行われることもある。その調整の一例として意味交渉が挙げられる。\n\n問1 文章中の下線部A「統語レベル」に関して、会話において統語レベルの誤解が起こっている例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「あれを取って」の「あれ」の指示対象を誤って解釈する。","「小さな猫の声」の修飾関係を誤って解釈する。","「沢田さん」を「真田さん」と聞き誤って解釈する。","断り表現の「結構です」を承諾と誤って解釈する。"], answer:1,
 explain:"「小さな猫の声」は、「小さな」が「猫」にかかるのか「声」にかかるのかという構造上の曖昧さ(統語的な修飾関係の解釈の違い)を持つ例です。これは統語(構文)レベルの誤解にあたります。他の選択肢は、指示対象の誤解(語用論レベル)、聞き誤り(音韻レベル)、意味の誤解(意味・語用論レベル)です。"},

{id:"R2-13-2", tag:"R2 試験I 問題13 問2", cat:"異文化コミュニケーション:高コンテクスト文化",
 text:"問2 文章中の下線部B「高コンテクスト文化」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["個人間で共有された情報・経験を前提に伝達が行われる。","個人主義的で、互いに意見がはっきりと述べられる。","問題解決の際、回避せず直接的な話し合いが好まれる。","相手の発話がそのまま文字どおりの意味で解釈される。"], answer:0,
 explain:"高コンテクスト文化は、話し手と聞き手の間で共有された背景知識や状況(コンテクスト)を前提に、言葉に表れない部分も読み取り合いながらコミュニケーションが行われる文化を指します。"},

{id:"R2-13-3", tag:"R2 試験I 問題13 問3", cat:"語用論:否定応答",
 text:"問3 文章中の下線部C「否定応答」の例として、次の会話の(ア)に入れるのに最も適当なものを、下の1〜4の中から一つ選べ。\n\nX:あ、Tシャツ、いいね。かわいいよ。\nY:(ア)",
 choices:["私、ちょっとTシャツにはうるさいんです。","私、このブランドに目がないんです。","そうですか?肌触りも悪くないんですよ。","そうですか?セールで買った安物なんですよ。"], answer:3,
 explain:"褒められたことに対して、「セールで買った安物なんですよ」と、その物の価値をあえて低く言って謙遜するのは、日本語の褒めの応答に典型的な「否定応答」のパターンです。"},

{id:"R2-13-4", tag:"R2 試験I 問題13 問4", cat:"語用論:逸脱への評価",
 text:"問4 文章中の下線部Dに関して、母語話者による「逸脱に対する評価や調整」の記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["非母語話者との談話を維持するのが困難な場合は、自身の発話を簡略化したり、発話を聞き返したりする傾向にある。","非母語話者に言語的な逸脱が起こる場合は、相づちや先取り発話などによって、非母語話者の会話を支援する傾向にある。","非母語話者に社会言語的な逸脱が起こる場合は、非母語話者に対して否定的な評価をしない傾向にある。","非母語話者との会話に大きな障害が生じない場合は、非母語話者の談話生成上の逸脱を深刻なものと捉えない傾向にある。"], answer:2,
 explain:"実際には、文法的な誤り(言語的逸脱)は学習途上のものとして寛容に受け止められやすい一方、社会言語的な逸脱(場にそぐわない言葉遣いや失礼な表現など)は、相手の人格や意図の問題として否定的に評価されやすい傾向があるとされています。したがって「否定的な評価をしない傾向にある」という記述は不適当です。"},

{id:"R2-13-5", tag:"R2 試験I 問題13 問5", cat:"語用論:意味交渉",
 text:"問5 文章中の下線部E「意味交渉」の例として最も適当なものを、次の1〜4の中から一つ選べ。\n\n1 X:買い物行きたいんだけど・・・。/ Y:雨だから、車で行こうか?\n2 X:私、東京を出たことないんだよ。/ Y:ふーん、ずっと東京に住んでいたということ?\n3 X:このあたりでレストラン探しているんだけど。/ Y:角を曲がったところにあるけど、おいしくないよ。\n4 X:借りてた本、忘れたんだけど、今度返しても大丈夫? / Y:うん、もう読んだからいつでもいいよ。",
 choices:["選択肢1(買い物/車で行こうか)","選択肢2(東京を出たことない/ずっと住んでいたということ?)","選択肢3(レストラン探してる/角を曲がったところ)","選択肢4(本を忘れた/いつでもいいよ)"], answer:1,
 explain:"意味交渉は、相手の発言の意味を確認・言い換えながら、双方の理解を一致させていくやり取りです。選択肢2の「ずっと東京に住んでいたということ?」は、Xの発言の意味をYが確認・言い換えている典型的な意味交渉の例です。"},

{id:"R2-14-1", tag:"R2 試験I 問題14 問1", cat:"日本語教育政策:海外の学習者数",
 text:"問題14 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n国際交流基金は3年に1度,海外の日本語教育機関の状況を把握するための調査を実施している。2019年には「2018年度海外日本語教育機関調査」の速報結果が公開された。調査によると,海外の日本語学習者数は約385万人に上る。\n教育機関別に見ると,海外の学習者の半数近くが(ア)で日本語を学んでいる。前回調査と比較して,最も増加したのは(イ)で学ぶ学習者で,その数は80万人を超えている。学習目的も多岐にわたっており,日本語学習の多様化がうかがえる。\nこのような状況を踏まえ,海外の日本語教育を支援するための様々な取り組みが行われている。また,日本語学習者のためのウェブサイトも多数公開されている。\n\n問1 文章中の下線部Aに関して、日本語学習者数が多い国・地域順に並べたものとして最も適当な組み合わせを、次の1〜4の中から一つ選べ。",
 choices:["1位:中国 / 2位:インドネシア / 3位:韓国","1位:中国 / 2位:韓国 / 3位:オーストラリア","1位:韓国 / 2位:中国 / 3位:インドネシア","1位:韓国 / 2位:オーストラリア / 3位:中国"], answer:3,
 explain:"2018年度海外日本語教育機関調査によると、学習者数の多い国・地域は1位韓国、2位オーストラリア、3位中国という順でした。"},

{id:"R2-14-2", tag:"R2 試験I 問題14 問2", cat:"日本語教育政策:学習機関",
 text:"問2 文章中の(ア)と(イ)に入れるのに最も適当な組み合わせを、次の1〜4の中から一つ選べ。",
 choices:["(ア)中等教育機関 / (イ)初等教育機関","(ア)中等教育機関 / (イ)学校教育以外の機関","(ア)高等教育機関 / (イ)初等教育機関","(ア)高等教育機関 / (イ)学校教育以外の機関"], answer:3,
 explain:"2018年度調査では、海外の学習者の半数近くが高等教育機関で日本語を学んでおり、前回調査と比較して最も増加したのは学校教育以外の機関で学ぶ学習者でした。"},

{id:"R2-14-3", tag:"R2 試験I 問題14 問3", cat:"日本語教育政策:学習目的",
 text:"問3 文章中の下線部B「学習目的」の1位、2位の最も適当な組み合わせを、次の1〜4の中から一つ選べ。",
 choices:["1位:マンガ・アニメ・J-POP・ファッション等への興味 / 2位:日本語を使っての受験や資格取得","1位:マンガ・アニメ・J-POP・ファッション等への興味 / 2位:日本語そのものへの興味","1位:将来の仕事・就職 / 2位:日本語を使っての受験や資格取得","1位:将来の仕事・就職 / 2位:日本語そのものへの興味"], answer:2,
 explain:"2018年度調査では、学習目的の1位は「将来の仕事・就職」、2位は「日本語を使っての受験や資格取得」でした。"},

{id:"R2-14-4", tag:"R2 試験I 問題14 問4", cat:"日本語教育政策:日本語パートナーズ",
 text:"問4 文章中の下線部Cに関して、日本政府が行っている「日本語パートナーズ事業」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["2年以上の日本語教育経験のある教師を、現地の日本語教師への助言、教材作成の支援を行う人材として派遣する事業","日本政府のODA予算に基づき、開発途上国からの要請に見合った人材を募集し、訓練を経て派遣する事業","主にASEAN諸国の中学・高校などで、現地の日本語教師のアシスタントとして授業をサポートする人材を派遣する事業","全国の公立学校の若手教員を対象として、海外の日本語教育を行う初等中等教育施設に2年間派遣する事業"], answer:2,
 explain:"日本語パートナーズ事業(国際交流基金)は、主に東南アジア(ASEAN諸国)の中学校・高校などに日本語パートナーズを派遣し、現地の日本語教師のアシスタントとして授業のサポートを行う事業です。"},

{id:"R2-14-5", tag:"R2 試験I 問題14 問5", cat:"日本語教育政策:学習支援サイト",
 text:"問5 文章中の下線部D「日本語学習者のためのウェブサイト」の名称と内容の最も適当な組み合わせを、次の1〜4の中から一つ選べ。",
 choices:["くりっくにっぽん:主に海外の若い学習者を対象とし、映像のスキットを中心とした学習サイト。「Can-do」を中心に言語学習ができる。","かすたねっと:動画を見ながら日本や日本語について学ぶことができる学習サイト。趣味で日本語を学ぶ人を主な対象として、トピックごとに動画を視聴できる。","みんなの教材サイト:日本語学習に役立つ情報を技能別やレベル別に検索できるポータルサイト。日本語学習のサイトやツールを探すことができる。","みなと:オンラインコースを履修できる無料の登録制学習サイト。レベル別にコースを選択することができ、学習者同士の交流もできる。"], answer:0,
 explain:"「くりっくにっぽん」は、主に海外の若い学習者を対象に、映像のスキット(寸劇)を通じて「Can-do」を軸に日本語を学べる国際交流基金のウェブサイトです。"},

{id:"R2-15-1", tag:"R2 試験I 問題15 問1", cat:"観光政策:訪日外客数",
 text:"問題15 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n訪日外国人旅行客(訪日外客)数は2012年以降,増加傾向となった。日本政府観光局によると,2018年の訪日外客数は(ア)人を超えた。また,国・地域別の内訳では東アジアからの訪日外客数が7割を超えている。これに対して日本政府は,受け入れ環境の整備および向上のための支援に取り組んでいる。\n受け入れ環境の整備の一つとして,国土交通省は2014年に観光地や公共交通機関等における情報提供の方法に関して「多言語対応の改善・強化のためのガイドライン」を策定した。また,経済産業省はピクトグラムの活用を進め,国際規格等を参考にし,2017年に国内規格を改正した。改正されたピクトグラムの中には,国際規格に置き換えられたものもあれば,国際規格と従来の国内規格の選択制になったものもある。\n\n問1 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["1,000万","2,000万","3,000万","4,000万"], answer:2,
 explain:"2018年の訪日外国人旅行者数は約3,119万人となり、初めて3,000万人を超えました。"},

{id:"R2-15-2", tag:"R2 試験I 問題15 問2", cat:"観光政策:東アジアからの訪日客",
 text:"問2 文章中の下線部A「東アジアからの訪日外客数」に関して、2018年から2019年の変化として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["中国からは増加し、韓国からは減少している。","香港からは増加し、中国からは減少している。","台湾からは増加し、香港からは減少している。","韓国からは増加し、台湾からは減少している。"], answer:0,
 explain:"2019年は日韓関係の悪化などを背景に韓国からの訪日客数が大きく減少した一方、中国からの訪日客数は引き続き増加しました。"},

{id:"R2-15-3", tag:"R2 試験I 問題15 問3", cat:"観光政策:受け入れ環境整備",
 text:"問3 文章中の下線部B「受け入れ環境の整備および向上のための支援」に当てはまらないものを、次の1〜4の中から一つ選べ。",
 choices:["主要な国際空港等の公共空間に無料の公衆無線LANを整備した。","ムスリム旅行者のために食事や礼拝などの受け入れ環境を整えた。","日本の文化・風習の理解を促すためのマナー啓発動画を公開した。","自由に住宅を宿泊施設として提供できるよう規制緩和を行った。"], answer:3,
 explain:"住宅を宿泊施設として提供できるようにする規制緩和(住宅宿泊事業法、いわゆる民泊の解禁)は、宿泊供給量を増やすための制度変更であり、無線LAN整備やムスリム旅行者対応、マナー啓発のような「受け入れ環境の整備・向上のための支援」とは異なる性質の施策です。"},

{id:"R2-15-4", tag:"R2 試験I 問題15 問4", cat:"観光政策:多言語対応ガイドライン",
 text:"問4 文章中の下線部C「多言語対応の改善・強化のためのガイドライン」に示された「対応言語の考え方」として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["禁止・注意を促す情報は、日本語と英語の2言語併記を基本とする。","案内・誘導を示す表示は、日本語と英・中・韓の4言語併記を基本とする。","専ら地域住民が使用する施設では、漢字・仮名とローマ字の併記を基本とする。","展示物の解説は、美観に配慮し視認性の高いフォントの使用を基本とする。"], answer:0,
 explain:"多言語対応の改善・強化のためのガイドラインでは、禁止事項や注意を促す情報については、確実に伝わるよう日本語と英語の2言語併記を基本とする考え方が示されています。"},

{id:"R2-15-5", tag:"R2 試験I 問題15 問5", cat:"観光政策:ピクトグラム",
 text:"問5 文章中の下線部D「国際規格と従来の国内規格の選択制になったもの」はどれか。最も適当なものを、次の1〜4の中から一つ選べ。",

{id:"R2-16-1", tag:"R2 試験III 問題1 問1", cat:"文法:テンス・アスペクト",
 text:"問題1 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語のテンスとアスペクトの形式を自然に使いこなすのは上級学習者にとっても難しい。ここでは,動詞,形容詞,名詞の非過去形の総称をル形と呼ぶ。したがって,テンス・アスペクトの形式は,ル形,タ形,テイル形,テイタ形に分類されるものとする。\n述語がル形である場合,その語が動作性か状態性かによって意味が異なり,動作動詞(非状態動詞)のル形は基本的に未来を表す。タ形の場合は,過去の出来事を表すものと,単なる過去ではない,完了を表すものがある。さらに,通常の過去・完了の用法とは異なる,いわゆる「ムードの『タ』」と呼ばれる用法もあり,主に状態述語に特徴的に表れる。また,テンスには絶対テンスと相対テンスという種類がある。例えば,「パーティーに来た人に写真を送る」という文における従属節のテンスは,相対テンスとして働く場合がある。\nまた,テンス・アスペクトの諸形式は,運用の観点からも留意すべき点が少なくない。例えば,学習者が試着しようと思った服が既に破れていたときに,店員に「すみません,破れました」と言ってしまうような誤用は重大なコミュニケーション上のトラブルを引き起こす可能性がある。教師はこうしたテンス・アスペクトの複雑な用法をよく理解し,指導に当たる必要がある。\n\n問1 文章中の下線部A「動作動詞(非状態動詞)」のル形の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["来週、札幌にいるよ。","夏になれば泳げるよ。","鉄は水に濡れるとさびるよ。","午後、電話するよ。"], answer:3,
 explain:"動作動詞(非状態動詞)のル形は、基本的に未来の出来事を表します。「電話する」は動作動詞であり、「午後、電話するよ」は未来の動作を表す典型例です。「いる」は状態動詞、「泳げる」は可能動詞(状態的)、「さびる」はここでは恒常的な性質・習慣を表す用法であり、それぞれ異なります。"},

{id:"R2-16-2", tag:"R2 試験III 問題1 問2", cat:"文法:完了のタ形",
 text:"問2 文章中の下線部B「完了を表すもの」のタ形の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["(子どもが母親に)「クラスの旅行は面白かったよ」","(先輩が後輩に)「先週山田さんに会えた?」","(教授が学生に)「この論文は読みましたか?」","(兄が弟に)「公園でお祭りがあったね」"], answer:2,
 explain:"「この論文は読みましたか」は、単に過去の出来事を述べているのではなく、「読む」という行為が完了しているかどうかを尋ねる、完了を表すタ形の例です。他の選択肢は、単純に過去の出来事を叙述する用法です。"},

{id:"R2-16-3", tag:"R2 試験III 問題1 問3", cat:"文法:ムードのタ",
 text:"問3 文章中の下線部C「ムードの『タ』」の例として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["もっと早く行けば買えたのに。","彼も子どもの頃は可愛かったな。","探していた本がこんな所にあったよ。","明日は午後から会議だったな。"], answer:0,
 explain:"「もっと早く行けば買えたのに」は、実際には起こらなかった過去の事態を仮定する反実仮想の用法であり、単純な過去の出来事の否定的な仮定です。一方、他の選択肢はいずれも、ある事実に気づいた・思い出したという「発見・想起」を表すムードの「タ」の用法です。"},

{id:"R2-16-4", tag:"R2 試験III 問題1 問4", cat:"文法:相対テンス",
 text:"問4 文章中の下線部Dに関して、例文の相対テンスに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「パーティーに来た」という出来事を、発話時よりも未来に起こることとして表すことが可能である。","「パーティーに来た」という出来事を、発話時よりも過去に起こったこととして表すことが不可能である。","「写真を送る」という出来事は、「パーティーに来た」時点よりも過去に起こっている。","「写真を送る」という出来事は、発話時と「パーティーに来た」という出来事との間で起こっている。"], answer:1,
 explain:"「パーティーに来た人に写真を送る」の従属節「パーティーに来た」のタ形が相対テンスとして働く場合、主節の事態(写真を送る)を基準にした前後関係を表すのであり、必ずしも発話時を基準にした「過去」を表しません。つまり、発話時より過去の出来事として捉えることが不可能な(発話時が未来であっても成立しうる)用法となります。"},

{id:"R2-16-5", tag:"R2 試験III 問題1 問5", cat:"文法:テンスアスペクトの運用",
 text:"問5 文章中の下線部Eに関して、こうした誤用を避けるために必要なテンス・アスペクトの知識として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「破れました」と言うと、目的を持ってある動作を完了したことを表す。","「破れました」と言うと、直接その場面を確認したということを表す。","「破れました」と言うと、出来事に対する話し手の残念な気持ちを表す。","「破れました」と言うと、一回的な出来事ではない属性や性質を表す。"], answer:1,
 explain:"日本語のタ形には、話し手がその事態を直接体験・確認したことを含意する用法があります。実際には破れているところを自分で見ていないのに「破れました」と言うと、まるで自分が直接確認したかのような不自然な表現になり、誤解やトラブルを招く可能性があります。"},

{id:"R2-16-6", tag:"R2 試験III 問題2 問1", cat:"音声学:ポーズ",
 text:"問題2 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n発話中に話者が音声を発しない区間のことをポーズという。ポーズは,一つ一つの単音を見ているだけでは捉えられない音声の(ア)特徴の一つである。したがって,単音の規範的な調音法で生じる無音区間とは異なる。学習者が「さき(先)」を「さっき」のように発音してしまう誤用は,閉鎖区間が日本語の母語話者の規範よりも長く,促音のように聞こえてしまうもので,ポーズの使い方に関する誤用ではない。\nポーズは息継ぎのためという生理的に不可欠なものと,話者が意図的に入れるものとに大別できる。意図的なポーズには,曖昧文の統語構造を分かりやすくする機能などがある。この機能は,プロソディーによっても実現できる。スピーチの音声指導の際には,適切なポーズの入れ方やプロソディーについても指導できると良い。\n\n問1 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["超分節的","示差的","音調的","線条的"], answer:0,
 explain:"ポーズは、個々の分節音(単音)を超えて発話全体にかかる特徴であるため、「超分節的」特徴(プロソディー的特徴)の一つとされます。"},

{id:"R2-16-7", tag:"R2 試験III 問題2 問2", cat:"音声学:無音区間",
 text:"問2 文章中の下線部A「単音の規範的な調音法で生じる無音区間」を含む例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["うみ","あか","にわ","ぬま"], answer:1,
 explain:"「あか」の子音[k]は無声破裂音であり、調音の際に閉鎖を作って一瞬呼気を止めるため、その閉鎖区間に無音区間が生じます。これは単音自体の調音法によって必然的に生じる無音区間の例です。他の選択肢の子音(摩擦音・鼻音)にはこのような無音区間は生じません。"},

{id:"R2-16-8", tag:"R2 試験III 問題2 問3", cat:"音声学:ポーズと統語構造",
 text:"問3 文章中の下線部B「曖昧文の統語構造を分かりやすくする機能」をポーズが担っている例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「東京の友達のお姉さんが遊びにきた」という文で、「友達の」の後にポーズを置くことによって、東京にいるのが友達ではないことを示す。","「警官は必死に逃げる犯人を追いかけた」という文で、「警官は」の後にポーズを置くことによって、必死だったのが犯人であることを示す。","「昨年あの家を建てた建築士は引退した」という文で、「建てた」の後にポーズを置くことによって、建築士がしたことは家を建てたことであることを示す。","「この前叔母からもらった桃を食べた」という文で、「桃を」の後にポーズを置くことによって、食べたのが「この前」が指す時点であることを示す。"], answer:1,
 explain:"「警官は必死に逃げる犯人を追いかけた」は、「必死に」が「警官」と「犯人」のどちらの動作を修飾するか曖昧な文です。「警官は」の直後にポーズを置くことで、「必死に逃げる」が「犯人」にかかる(犯人が必死だった)という解釈を示すことができ、ポーズが統語構造の曖昧さの解消に役立つ例です。"},

{id:"R2-16-9", tag:"R2 試験III 問題2 問4", cat:"音声学:プロソディー",
 text:"問4 文章中の下線部C「プロソディー」に関して、日本語の共通語のプロソディーの特徴として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「大学の友達と行く」などの文で、呼気の減少に応じてピッチパターンが「へ」の字型になる。","「火」と「日」などの語では、語の意味の区別にアクセントが影響する。","「弟は」などの句では、アクセント核のあるモーラでピッチが大きく上昇する。","「食べますか」などの疑問文で、発話末を上昇させることで疑問を表す。"], answer:2,
 explain:"日本語のアクセント核は、その直後のモーラでピッチが急激に下降する位置として定義されます。「アクセント核のあるモーラでピッチが大きく上昇する」という記述は事実と逆であり、不適当です。"},

{id:"R2-16-10", tag:"R2 試験III 問題2 問5", cat:"教授法:ポーズの指導",
 text:"問5 文章中の下線部D「ポーズの入れ方」を指導する際の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ポーズは、一定時間ごとに入れるように指導する。","ポーズを置いたあとでは、ピッチが上がらないように指導する。","分かりやすい発話にするために、ポーズは助詞の前に入れるように指導する。","文と文の間か、段落と段落の間かでポーズの長さを変えるように指導する。"], answer:3,
 explain:"実際の発話では、文と文の間の小さな区切りと、段落(話題)の変わり目のような大きな区切りとでは、置くポーズの長さを変えることで、話の構造がより伝わりやすくなります。"},

{id:"R2-16-11", tag:"R2 試験III 問題3 問1", cat:"語用論:発話行為",
 text:"問題3 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語教育では,対人的な言語の運用についても指導する必要がある。発話の意味は,発話を構成するそれぞれの語の(ア)意味だけではなく,それが発話された場面や発話参加者が持っている背景的知識によって決まる。つまり,発話はある特定の状況においては命題的意味とは別の発話の力を発揮することもある。このように,コミュニケーションにおいて発話を何らかの機能を持つ一つのユニットとして捉えるとき,これを発話行為と呼ぶ。\n発話行為には,遂行動詞を使った直接的な発話行為と,間接的な発話行為がある。挨拶は慣用化した間接的な発話行為の一つであり,言語文化と深い関わりがある。\n日本語教育には,異文化コミュニケーションや比較文化の知識も求められる。学習者の母語や文化との異なりを踏まえ,学習者がコミュニケーションにおいて不利益を被らないように指導をすることが必要である。\n\n問1 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["表出的な","辞書的な","伝達的な","類推的な"], answer:1,
 explain:"発話の意味は、構成する語のそれぞれの「辞書的な」(語彙的な、辞書に載っているような)意味だけでなく、発話の場面や背景的知識も含めて決まります。"},

{id:"R2-16-12", tag:"R2 試験III 問題3 問2", cat:"語用論:発話の力",
 text:"問2 文章中の下線部Aの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「水は100度で沸騰する」と事実を述べる。","「この星をメラリスと呼ぼう」と命名する。","「心からお詫びします」と相手に謝罪する。","「喉が渇いたなあ」と相手に伝える。"], answer:3,
 explain:"「喉が渇いたなあ」は、文字通りには単なる自分の状態の叙述(命題的意味)ですが、特定の状況(例えば相手に飲み物を勧めてほしいとき)では、「何か飲み物をください」という依頼の力(間接的な発話の力)を持つことがあります。他の選択肢は、文字通りの意味がそのまま発話の力として働く直接的な例です。"},

{id:"R2-16-13", tag:"R2 試験III 問題3 問3", cat:"語用論:遂行動詞の分類",
 text:"問3 文章中の下線部B「遂行動詞」に関して、その分類と動詞の組み合わせとして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["宣告命名型(declaratives):断言する","行為拘束型(commissives):命ずる","行為指導型(directives):約束する","心理表出型(expressives):感謝する"], answer:3,
 explain:"「感謝する」は話し手の心理状態(感謝の気持ち)を表出する遂行動詞であり、心理表出型(expressives)に分類されます。「断言する」は行為指導型または表明型、「命ずる」は行為指導型(directives)、「約束する」は行為拘束型(commissives)に分類されるのが一般的です。"},

{id:"R2-16-14", tag:"R2 試験III 問題3 問4", cat:"異文化理解:比較文化",
 text:"問4 文章中の下線部C「比較文化の知識」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["中国や日本は漢字文化圏であるが、韓国やベトナムは非漢字文化圏である。","日本語は「なる」型言語、英語は「する」型言語であると言われる。","日本は「罪の文化」、西洋は「恥の文化」として類型化されている。","タテ社会は個人の「資格」の認識、ヨコ社会は集団の「場」の認識が強い。"], answer:1,
 explain:"日本語は事態の自然な成り行き(「なる」)に視点を置いた表現を好み、英語は動作主の意図的な働きかけ(「する」)に視点を置いた表現を好む、という対比が言語類型論的な比較文化の知識としてよく紹介されます。"},

{id:"R2-16-15", tag:"R2 試験III 問題3 問5", cat:"教授法:対人配慮の指導",
 text:"問5 文章中の下線部Dに関して、指導上の留意点として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["相手が熟知している情報を伝えるときは終助詞「よ」を使う。","相手と共有している情報を伝えるときは終助詞「ね」を使う。","目上の相手の労をねぎらうときは「ご苦労さま」を避ける。","目上の相手に願望を聞くときは「〜たいですか」を避ける。"], answer:0,
 explain:"終助詞「よ」は、相手がまだ知らない(熟知していない)情報を伝える際に使われるのが基本です。相手がすでに熟知している情報を伝える場合にふさわしいのは「ね」であり、この記述は逆になっているため不適当です。"},

{id:"R2-16-16", tag:"R2 試験III 問題4 問1", cat:"語彙:類義表現",
 text:"問題4 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n二つの似ている言語表現が常に相互に言い換え可能なわけではない。類義の表現の間にも意味の違いがある。弁別的な意味の違いがなくても,文体,位相,地域の違いがある場合もある。文のレベルの類義関係に目を向けると,「〜くせに…」と「〜のに…」のように,意味は重なるが,用法が異なる文型もある。また,「〜反面…」と「〜一方で…」も類義の文型であるが,「〜反面…」にはなく「〜一方で…」だけが表す意味もあり,言い換えができない場合もある。\n類義の表現による言い換えは,日本語教育の現場でも留意が必要である。教師は,教室内で初級や中級の学習者と話す際に,多くの学習者にとってより理解しやすい類義の表現に言い換える等,類義関係に敏感であることが求められる。\n\n問1 文章中の下線部A「類義の表現の間にも意味の違いがある」例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「幼稚」は評価の対象が人であり、「未熟」は評価の対象が行為である。","「初めて」は2者間の比較に用い、「最初に」は3者以上の比較に用いる。","「のぼる」は焦点が経路にあり、「あがる」は焦点が到達点にある。","「予定だ」は自分の計画であることを示し、「つもりだ」は他者の計画を示す。"], answer:2,
 explain:"「のぼる」は坂や階段などを上っていく経路・過程に焦点があるのに対し、「あがる」は上がりきった到達点(結果状態)に焦点があるという意味の違いがあります。"},

{id:"R2-16-17", tag:"R2 試験III 問題4 問2", cat:"語彙:類義語の位相差",
 text:"問2 文章中の下線部Bに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「あやうい」と「あぶない」は方言か共通語かが異なる。","「おでこ」と「ひたい」は俗語か一般語かが異なる。","「あした」と「あす」は女性語か男性語かが異なる。","「あったかい」と「あたたかい」は幼児語か一般語かが異なる。"], answer:1,
 explain:"「おでこ」はくだけた俗語的な言い方であるのに対し、「ひたい」はより一般的・標準的な語という位相差があります。"},

{id:"R2-16-18", tag:"R2 試験III 問題4 問3", cat:"文法:くせにとのに",
 text:"問3 文章中の下線部C「『〜くせに…』と『〜のに…』」の文法上の共通点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["従属節と主節には異なる主語が入る。","従属節に状況判断の「はずだ」を用いることができる。","ナ形容詞や名詞の後に接続する際には「な」を伴う。","問いかけの文では主節に「の(だ)」が必要になる。"], answer:3,
 explain:"「〜くせに」「〜のに」を使った文を疑問文(問いかけ)にする場合、主節に「の(だ)」を伴う形(「〜くせに、なぜ〜のか」等)になりやすいという共通した文法的特徴があります。"},

{id:"R2-16-19", tag:"R2 試験III 問題4 問4", cat:"文法:反面と一方で",
 text:"問4 文章中の下線部D「『〜反面…』にはなく『〜一方で…』だけが表す意味」として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["従属節の事態と並行し、それとは対照的な側面の主節事態も成立する「対比」","従属節の事態と並行し、それと同様の内容を表す主節事態も成立する「累加」","従属節の事態が先行し、それとは無関係に主節の事態が成立する「継起」","従属節の事態が原因となり、そのために予想外の主節事態が成立する「因果関係」"], answer:1,
 explain:"「〜一方で」には、対照的な内容を並べる「対比」の用法に加えて、対照的でなく同種の内容を積み重ねて述べる「累加」の用法もあります。この累加の意味は「〜反面」にはなく、「〜一方で」だけが持つ意味です。"},

{id:"R2-16-20", tag:"R2 試験III 問題4 問5", cat:"教授法:類義表現への言い換え",
 text:"問5 文章中の下線部Eの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「これは間違えてもおかしくない問題です」を「これは多くの人が間違える問題です」と言い換える。","「髪型を変えて印象がよくなった」を「ヘアスタイルを変えてイメージアップした」と言い換える。","「彼らはいつもいがみ合っています」を「彼らは犬と猿のような関係です」と言い換える。","「京都は非常に美しいところです」を「京都はそれはもうきれいなところです」と言い換える。"], answer:0,
 explain:"「間違えてもおかしくない」というやや回りくどい表現を、「多くの人が間違える」というより平易でわかりやすい表現に言い換えており、学習者にとって理解しやすい表現への言い換えの例です。他の選択肢は、外来語や慣用句・口語表現など、むしろ理解の負担が増す可能性のある言い換えです。"},

{id:"R2-16-21", tag:"R2 試験III 問題5 問1", cat:"教材論:生活者としての外国人カリキュラム",
 text:"問題5 ある地域の日本語教室に関する次の資料を読み、後の問い(問1〜5)に答えよ。<資料>は授業の概要である。\n\n<資料>授業の概要:方針は文化庁の「『生活者としての外国人』に対する日本語教育の標準的なカリキュラム案」(「カリキュラム案」)を参考に授業を行う。レベルは初中級。授業時間60分×2コマ。学習者は10〜20名(日本滞在歴、母語、年代、職業などは様々)。教材は「カリキュラム案」を参考に作成したモジュール型教材。目標は地震が起きた際に適切な行動がとれるようになること。授業の流れ:STEP1(地震に関連する写真を見て話し合い、とるべき行動をグループで考える)、STEP2(状況に応じて防災用品の使用法確認・実物に触れる、支援者の指示に従い行動する、必要な防災用品のリストを作る)、STEP3(大規模地震発生後のニュースを聞く)、STEP4(全体で振り返りを行う)。\n\n問1 <資料>の下線部Aに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["在住外国人の居住地域により日本語教育の格差が生じないよう、教えるべき内容を標準化したカリキュラムである。","在住外国人が日本で生活するうえで必要な文法事項を網羅的に整理したカリキュラムである。","在住外国人が地域社会で共生するために必要な課題遂行能力を6段階で示したカリキュラムである。","在住外国人が生活基盤を形成するために必要不可欠な生活上の行為の事例をまとめたカリキュラムである。"], answer:3,
 explain:"文化庁の「『生活者としての外国人』に対する日本語教育の標準的なカリキュラム案」は、在住外国人が生活基盤を形成する上で必要不可欠な、具体的な生活上の行為の事例を整理してまとめたカリキュラムです。"},

{id:"R2-16-22", tag:"R2 試験III 問題5 問2", cat:"教材論:モジュール型教材",
 text:"問2 <資料>の下線部B「モジュール型教材」を取り入れる利点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["各課が単独で完結している教材であり、継続して教室へ通うことが難しい学習者に対応できる。","発音練習、映像教材、参考資料などがデジタル化された教材であり、提示する内容を容易に検索できる。","現実社会で実際に使われているものを集めた教材であり、教室内でも真正性の高いインプットを与えることができる。","文法説明や練習問題などがある文型中心の教材であり、学習者が自宅で自律的に学習することができる。"], answer:0,
 explain:"モジュール型教材は、各課(モジュール)が単独で完結する構成になっているため、毎回同じ学習者が継続して出席するとは限らない地域の日本語教室のような場でも、途中からでも参加しやすいという利点があります。"},

{id:"R2-16-23", tag:"R2 試験III 問題5 問3", cat:"教授法:防災教育",
 text:"問3 <資料>の下線部C「目標」を達成するために「STEP2」で行う活動と同じ趣旨の活動として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["地震について知っていることや自分の経験を教室内で話し合う。","周辺の避難場所を調べ、自宅からの避難経路を地図に書き込む。","起震車で地震の揺れを実際に体験し、感想文を書く。","災害伝言板で使われる漢字の読み方を調べ、教え合う。"], answer:1,
 explain:"STEP2は、防災用品の使用法確認や、指示に従って実際に適切な行動を取るなど、地震発生時に実際に役立つ具体的な行動の習得を目指す活動です。避難場所を調べ、避難経路を地図に書き込むことも、同様に実際の防災行動に直結する実践的な活動です。"},

{id:"R2-16-24", tag:"R2 試験III 問題5 問4", cat:"読解:スキャニング",
 text:"問4 <資料>の下線部D「STEP3」の活動に関して、ここではスキャニングを行うことにした。その活動として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本語力の不足を補い合ってニュース全体を理解するため、各自が聞きながら取ったメモを持ち寄り、再度聞いて他の学習者とニュースを再構築する活動","メディアによる災害の伝え方の違いを知るため、各自が別々のニュースを聞いて内容の大意を伝え合い、報道内容と目的を比較する活動","母国にSNSを使って母語で地震の状況を発信するため、日本のニュースの概要を聞き取る活動","避難する手段を判断するため、ニュースから道路情報や交通機関の運行情報などを聞き取る活動"], answer:3,
 explain:"スキャニングは、必要な特定の情報だけを探し出して読み(聞き)取るストラテジーです。「避難する手段を判断するために道路情報や交通機関の運行情報を聞き取る」ことは、ニュース全体ではなく必要な特定の情報のみを探し出す活動であり、スキャニングの例にあたります。"},

{id:"R2-16-25", tag:"R2 試験III 問題5 問5", cat:"教授法:対話中心の活動",
 text:"問5 近年、地域の日本語教室では「対話中心の活動」が行われている。「対話中心の活動」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者が自宅で必要な文型や単語を予習していることを前提として、教室では学習者と会話を行うことに時間を割き、実践力を高める活動","教室にゲストとして外部から母語話者を招き、学習者のインタビュー活動に協力してもらい、学習者に習得した言語知識を活用する機会を与える活動","学習者と支援者が対等な関係で日本語のコミュニケーションをすることで、相互理解を深めながら日本語を身につける活動","学習者にまずロールプレイを行わせ、うまく言えなかった語や表現をフィードバックすることで定着を図る活動"], answer:2,
 explain:"対話中心の活動は、教師(支援者)が一方的に教える・評価するという関係ではなく、学習者と支援者が対等な立場でコミュニケーションを行い、その相互のやり取りを通して互いに理解を深めながら日本語を身につけていくことを重視するアプローチです。"},

{id:"R2-16-26", tag:"R2 試験III 問題6 問1", cat:"評価:OPIとロールプレイ",
 text:"問題6 次の文章と資料を読み、後の問い(問1〜5)に答えよ。\n\n口頭運用能力のレベル判定のために,OPI(Oral Proficiency Interview)による会話テストでインタビューとロールプレイを行った。ロールプレイには,次のロールカードを用いた。\n\n<ロールカード>\nあなたは大学生でコンビニでアルバイトをしています。急用があって,明日はアルバイトに行くことが難しいです。店長に理由を伝えて休む許可を得てください。\n\n次の<資料>は,ロールプレイの際の教師と韓国語を母語とする学習者との会話を書き起こしたものである。\n\n<資料> ロールプレイの際の教師と韓国語を母語とする学習者との会話\n学習者:んー、ん、店長。\n教師:はい、どうしましたキムさん。\n学習者:私は、んー、明日、ここに、んー、明日、区役所に、行かなけ、行かなければなりません、それで、ここに、来るー、来ないこ、来ることはできません。\n教師:明日ですか、区役所なら、午前中に行ったらどうですか。\n学習者:じゅぎょ、授業がありますから、ちょっと難しいだと思います。\n教師:あーそうですか。じゃ、明日は休みね。\n学習者:すみません。\n教師:あさって、商品整理をしてほしいんだけど、来られますか。\n学習者:あー、んー、どよ、土曜日はいいだと思います。\n教師:じゃあ、土曜日、ちょっと早めに来られますか、ここに。\n学習者:はやめー。\n教師:少し早く。\n学習者:あー、少し早く。大丈夫だと思います。\n教師:大丈夫ですか、じゃあ、あさって、11時に来てください。\n学習者:はい、分かりました。ありがとうございます。\n\n問1 文章中の下線部A「ロールプレイ」に関して、OPIでロールプレイを行う目的として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["やり取りの中で口頭でできることの上限や下限を確認するため","無理なく話せる言語レベルでやり取りすることで、達成感を与えるため","インタビュー時よりも緊張感を和らげ、質の高いパフォーマンスを引き出すため","学習者の興味や経験を知り、レベル判定に役立つ情報を得るため"], answer:0,
 explain:"OPIにおけるロールプレイは、通常のインタビューだけでは把握しきれない、その学習者が口頭でどこまでできるか(できることの上限)、逆にどこでつまずくか(下限)を確認するために用いられます。"},

{id:"R2-16-27", tag:"R2 試験III 問題6 問2", cat:"誤用分析:活用の混同",
 text:"問2 <資料>の下線部B「難しいだと思います」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["動詞と名詞の混同による誤り","ナ形容詞と名詞の混同による誤り","イ形容詞とナ形容詞の混同による誤り","イ形容詞と動詞の混同による誤り"], answer:2,
 explain:"「難しい」はイ形容詞であるにもかかわらず、ナ形容詞の活用のように「だ」を付けて「難しいだ」としてしまっており、イ形容詞とナ形容詞の活用の混同による誤りです。"},

{id:"R2-16-28", tag:"R2 試験III 問題6 問3", cat:"文法:けどの用法",
 text:"問3 <資料>の下線部C「けど」と同様の使い方をしているものはどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["寿司は食べてみたいんですけど、納豆は食べたくありません。","日本では靴を脱ぐんですけど、私の国では脱ぎません。","毎日勉強したんですけど、テストの成績は悪かったんです。","ピザを作りたいんですけど、作り方を教えてもらえませんか。"], answer:3,
 explain:"資料中の「商品整理をしてほしいんだけど、来られますか」の「けど」は、本題(依頼)に入る前の前置きとして使われています。選択肢4「ピザを作りたいんですけど、作り方を教えてもらえませんか」も同様に、依頼の前置きとして「けど」が使われている例です。他の選択肢は、前後で対比・逆接の内容を表す「けど」の用法です。"},

{id:"R2-16-29", tag:"R2 試験III 問題6 問4", cat:"談話:繰り返しの機能",
 text:"問4 <資料>の下線部D「はやめー」という発話は、会話の中でどのような機能を果たしたか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["聞いているサインを送り、話を続けるように促す。","同じ言葉を発して、相手との連帯感を強める。","相手が話した語の意味を説明するように頼む。","発話権をとるために、直前の発話を繰り返す。"], answer:0,
 explain:"学習者が教師の発話の一部(「早めに」)をそのまま繰り返す「はやめー」は、教師の発話を聞いていることを示すサイン(相づち的な機能)であり、話を続けるよう促す働きを持っています。"},

{id:"R2-16-30", tag:"R2 試験III 問題6 問5", cat:"評価:OPI中級の判定",
 text:"問5 <資料>のやり取りから、この学習者はOPIの中級に達していると判定した。その理由として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["会話を自分で始め、やり取りを続け、終わらせることができる。","言語的な正確さを維持し、叙述したり描写したりすることができる。","広範囲の話題をうまく構成された長い段落で話すことができる。","予期していなかった複雑な状況にうまく対応することができる。"], answer:0,
 explain:"OPIの中級レベルの目安の一つに、簡単な社会的なやり取りを自分から開始し、それを維持し、適切に終了させることができる、という基準があります。資料の学習者は、店長への相談から予定の調整まで、一連のやり取りを自分から進めて成立させています。"},

{id:"R2-16-31", tag:"R2 試験III 問題7 問1", cat:"漢字教育:指導法",
 text:"問題7 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語学習者にとって文字学習は課題の一つである。中でも漢字学習でつまずく学習者が多いため,漢字の授業では様々な工夫が行われている。\n漢字学習上の問題点は,漢字系学習者と非漢字系学習者でそれぞれ異なる。特に非漢字系学習者は漢字に慣れていないことから,字形の意識化を促す目的で字形が同一かどうか識別する練習を行うことがある。\n漢字学習の評価は,従来は字形を正確に再生できるかを測るものが主流であったが,近年は漢字の品詞についての知識を測る問題が取り入れられるようになった。評価においては,形成的評価の観点も必要である。\n\n問1 文章中の下線部A「漢字の授業」における指導上の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["漢字の筆順は、資料の配付を避けて、実際に教師が板書で示す。","漢字の導入順は、学習者のニーズよりも字形の単純さを優先する。","漢字の字形は板書やカードで示し、読みは音声で聞かせる。","送り仮名のある漢字は、送り仮名と一緒に書かせる。"], answer:3,
 explain:"送り仮名のある漢字を指導する際は、漢字だけを単独で覚えさせるのではなく、送り仮名と合わせた形で書かせることで、正しい読み方や使い方の定着を図ることが望ましいとされます。"},

{id:"R2-16-32", tag:"R2 試験III 問題7 問2", cat:"漢字教育:漢字系学習者",
 text:"問2 文章中の下線部B「漢字系学習者」の学習上の問題に当てはまらないものを、次の1〜4の中から一つ選べ。",
 choices:["漢字から文章の意味が推測できるので、文法の学習がおろそかになりやすい。","母語の漢字知識に頼るため、間違った意味に解釈してしまう。","個々の漢字を記号のように記憶し、熟語の理解につなげるのが難しい。","母語と日本語に些細な字形上の違いがあるため、書く際に正確さに欠ける。"], answer:2,
 explain:"「個々の漢字を記号のように記憶し、熟語の理解につなげるのが難しい」というのは、漢字に馴染みのない非漢字系学習者に特有の問題です。漢字系学習者は、むしろ母語の漢字知識(意味・字形)があるために生じる問題(文法軽視、誤った類推、字形の微妙な違いなど)を抱えやすいとされます。"},

{id:"R2-16-33", tag:"R2 試験III 問題7 問3", cat:"漢字教育:字形識別練習",
 text:"問3 文章中の下線部C「字形が同一かどうか識別する練習」として最も適当なものを、次の1〜4の中から一つ選べ。\n\n1 例のように、絵が表している漢字を選びなさい。(例:太陽の絵→a目 (b)日 c年 d月)\n2 例のように、組み合わせて漢字になるものを選びなさい。(例:木+(a)イ=休)\n3 例のように、漢字を書きなさい。(例:イ+ロ+木=保)\n4 例のように、異なる漢字を選びなさい。(例:名 名 名 (各) 名 名)",
 choices:["選択肢1(絵が表す漢字を選ぶ)","選択肢2(組み合わせて漢字を作る)","選択肢3(部品から漢字を書く)","選択肢4(異なる字形の漢字を選び出す)"], answer:3,
 explain:"選択肢4は、似た形の漢字が並ぶ中から、他と異なる字形のものを見つけ出す練習であり、字形そのものが同一かどうかを識別する練習の典型例です。他の選択肢は、絵と漢字の対応、部品の組み合わせ、字形の構成に関する練習であり、字形の異同の識別とは異なります。"},

{id:"R2-16-34", tag:"R2 試験III 問題7 問4", cat:"漢字教育:品詞知識の評価",
 text:"問4 文章中の下線部D「漢字の品詞についての知識を測る問題」として最も適当なものを、次の1〜4の中から一つ選べ。\n\n1 例のように、同じグループに入らないものを消しなさい。(例:開始 初期 最初 原始 → 問:強行 強運 強者 強度)\n2 例のように、同じグループに入らないものを消しなさい。(例:広 庁 店 療 → 問:写 家 冗 冥)\n3 例と同じ関係にあるものを選びなさい。(例:日常⇔非日常 → 問:人気⇔?)\n4 例と同じ関係にあるものを選びなさい。(例:安:暗 → 問:強:?)",
 choices:["選択肢1(強行・強運・強者・強度から仲間はずれ)","選択肢2(広・庁・店・療から仲間はずれ)","選択肢3(日常⇔非日常の関係)","選択肢4(安:暗の関係)"], answer:0,
 explain:"選択肢1は、「強行」(動詞的な意味を持つ語)と「強運・強者・強度」(名詞)という、熟語の品詞パターンの違いを識別させる問題であり、漢字の品詞についての知識を測る問題にあたります。他の選択肢は部首(字形要素)の識別や、対義語・類義語といった意味関係を問う問題です。"},

{id:"R2-16-35", tag:"R2 試験III 問題7 問5", cat:"評価論:形成的評価",
 text:"問5 文章中の下線部E「形成的評価」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["コース開始時のテスト結果を基に、学習者を適当なレベルのクラスに分ける。","コース期間中のテスト結果を基に、指導の有効性を検討し、指導方法を改善する。","コース終了時のテスト結果を基に、学習者を得点順に並べ、成績を付ける。","コース終了後のテスト結果を基に、コースのシラバスや使用した教材を評価する。"], answer:1,
 explain:"形成的評価は、コースの進行途中で行われ、その時点での指導や学習の状況を把握し、その後の指導方法の改善に活かすことを目的とした評価です。"},

{id:"R2-16-36", tag:"R2 試験III 問題8 問1", cat:"作文指導:Can-do",
 text:"問題8 国内のある大学で実施された留学生対象の作文の授業に関する次の資料を読み、後の問い(問1〜5)に答えよ。<資料>は作文活動の流れに関するメモである。\n\n<資料>作文活動の流れに関するメモ:レベルはCEFR A2レベル。学習者は多国籍10名。Can-do:(ア)を書くことができる。\n書く前:①導入(自分のふるさとの有名な場所についてトップ3を考えさせる)、②課題の提示(ふるさとを紹介する作文を300字ぐらいで書く)、③書くための準備(マインドマップを作成させる)。\n書く:④下書き、⑤推敲(学習者同士でピア・レスポンスをさせる、各自で書き直しをさせる)。\n書いた後:⑥教師によるフィードバック(フィードバックを受けて清書させる)、⑦クラス全体でのシェア(作文集を配付し読ませる)、⑧ポートフォリオの整理。\n\n問1 <資料>の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ふるさとの案内したい場所について詳しく明瞭な文章","ふるさとの複数の観光地の紹介を一つの流れにまとめた文章","ふるさとが紹介された記事と自分の経験とを関連づけた文章","ふるさとのおすすめの場所について短い簡単な文を使った文章"], answer:3,
 explain:"CEFR A2レベルは基礎段階の学習者を想定しており、複雑な構成や詳細な描写よりも、短く簡単な文で身近な話題(おすすめの場所など)を書けることが到達目標として適切です。"},

{id:"R2-16-37", tag:"R2 試験III 問題8 問2", cat:"作文指導:マインドマップ",
 text:"問2 <資料>の下線部A「マインドマップ」の作成方法として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「ふるさと」について、分析の視点を立方体に例えて6側面から分析したり、論証したりしながら内容を充実させていく。","紙の中央に「ふるさと」と書き、その周りに頭に浮かんだことを書き出し、線でつないでアイディアを整理する。","「今住んでいる町」と「ふるさと」の共通点と相違点の両方をリストアップして、整理しながら書いていく。","「ふるさと」についての教師の質問に答えたカードを並べ、まとまった文章を組み立てていく。"], answer:1,
 explain:"マインドマップは、中心にテーマ(この場合「ふるさと」)を書き、そこから連想される事柄を放射状に書き出し、線でつなぎながらアイディアを広げ整理していく手法です。"},

{id:"R2-16-38", tag:"R2 試験III 問題8 問3", cat:"作文指導:ピアレスポンス",
 text:"問3 <資料>の下線部B「ピア・レスポンス」を行う目的として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["言語能力が高い者に低い者の作文を添削させることで、学びの意欲を持たせる。","読み手からの質問に答える過程で、自分の書きたいことを整理させる。","他の作文に意見することで、自分の作文を批判的に分析する力を身につけさせる。","読み手の視点を意識させることで、自分で推敲する力を身につけさせる。"], answer:0,
 explain:"ピア・レスポンスは、学習者同士が対等な立場で互いの作文にコメントし合う協働的な活動です。「言語能力が高い者が低い者の作文を添削する」という上下関係を前提とした活動は、ピア・レスポンス本来の目的にそぐいません。"},

{id:"R2-16-39", tag:"R2 試験III 問題8 問4", cat:"作文指導:教師のフィードバック",
 text:"問4 <資料>の下線部C「教師によるフィードバック」の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者の意図を反映できるよう、原文を活かしつつ不自然な部分を添削する。","学習者間で不公平が生じないよう、添削の仕方やヒントの与え方を統一する。","学習者の意欲を削がないよう、意図が不明な文は指摘せずそのままにする。","学習者の印象に残るよう、優れた点よりも間違いを強調して示すようにする。"], answer:0,
 explain:"教師によるフィードバックでは、学習者が伝えたかった意図をできるだけ尊重しながら、原文の良さを活かしつつ不自然な表現を添削することが望ましいとされます。"},

{id:"R2-16-40", tag:"R2 試験III 問題8 問5", cat:"教材論:ポートフォリオ",
 text:"問5 <資料>の下線部D「ポートフォリオ」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者は学習過程の活動記録ではなく、最終的な作品を残す。","学習者が学習過程で用いた資料や成果物を保存し、学習を振り返る。","教師の指示に従って、学習者は学習過程で配付された教材を保存する。","教師が各学習者の学習過程を記録、管理して成績評価に用いる。"], answer:1,
 explain:"ポートフォリオは、学習者自身が学習過程で作成した下書きや資料、成果物などを蓄積・保存し、それを振り返ることで自身の成長を実感したり、次の学習に活かしたりするためのものです。"},

{id:"R2-16-41", tag:"R2 試験III 問題9 問1", cat:"異文化理解:異文化間葛藤",
 text:"問題9 次の文章を読み、下の問い(問1〜5)に答えよ。\n\nグローバル化の進行により日本国内において,在留外国人数が増加している。多様な文化的背景を持つ人々とともに生活していくうえでは異文化間葛藤が生じることがある。その際,様々ある葛藤解決方略の中からどれを用いて葛藤解決を図るかが,その後の関係構築にも関わる。また,他者との対話を通して自分自身を客観的に見つめ直すことも必要である。他者に対してどのような偏見があるのかを知ることで自己理解が促進される。\n日本語教育場面においても集団間の再カテゴリー化を促す活動などが偏見の低減に有効だろう。\n\n問1 文章中の下線部A「異文化間葛藤」が生じている状態はどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ある思想や価値観に自分を同一化してみるなど、試行錯誤している状態","ある感情を表出している他者を見て自分にも同一の感情が生じている状態","人間関係に対する価値観などが自文化とは相反すると感じている状態","自我の統合がうまくいかず、自分自身を見失いそうになっている状態"], answer:2,
 explain:"異文化間葛藤は、自分が育った文化の価値観(人間関係のあり方など)と、接している異文化の価値観とが相反する・食い違うと感じることによって生じる葛藤を指します。"},

{id:"R2-16-42", tag:"R2 試験III 問題9 問2", cat:"異文化理解:葛藤解決方略",
 text:"問2 文章中の下線部B「葛藤解決方略」のうち、「直接・双方向方略」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["隣人が深夜まで騒いでいたら、「静かにしてください」と本人に言いに行く。","隣人が深夜まで騒いでいても我慢し、その状況が続く場合は引っ越しをする。","深夜まで騒いでいる隣人に、自分は早朝出勤で毎晩10時には寝ることを伝える。","深夜まで騒いでいる隣人を説得し、夜10時以降は騒がないというルールを作る。"], answer:3,
 explain:"「直接・双方向方略」は、当事者同士が直接向き合い、双方の合意のもとで解決策(ルールなど)を作り上げる方略です。隣人を説得し、互いに合意できるルールを作ることは、直接的かつ双方向的な解決の例です。"},

{id:"R2-16-43", tag:"R2 試験III 問題9 問3", cat:"心理学:ジョハリの窓",
 text:"問3 文章中の下線部C「自分自身を客観的に見つめ直す」ために提案された「ジョハリの窓(Johari Window)」の四つの窓に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「未知の窓」が大きい人は、他者の意見を聞こうとせず、頑固になる傾向がある。","「盲目の窓」が大きい人は、他者の自分に対する反応への感受性が低い傾向がある。","「開放の窓」は、周囲は知っているが、本人が全く気づいていない部分である。","「秘密の窓」は、自分も周りの人も気づいていない、可能性を秘めた部分である。"], answer:1,
 explain:"「盲目の窓」は、自分は気づいていないが他者は知っている自分の側面を指します。この窓が大きいということは、他者からの反応や評価に対する自分自身の感受性・気づきが低いことを意味します。"},

{id:"R2-16-44", tag:"R2 試験III 問題9 問4", cat:"心理学:偏見",
 text:"問4 文章中の下線部D「偏見」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["他者に対して無意識に抱いてしまう否定的感情","自集団の立場を優位に立たせようとする意識","特定の集団に対するイメージに基づく排除行動","自己を守るために他者を否定的に捉える姿勢"], answer:2,
 explain:"偏見は、他者に対する否定的な態度・感情・認知(思い込みやイメージ)を指す心理的な概念です。「排除行動」のような実際の行動そのものは、偏見に基づいて生じる「差別」にあたり、偏見そのものの定義とは区別されるため、この記述は不適当です。"},

{id:"R2-16-45", tag:"R2 試験III 問題9 問5", cat:"異文化理解:再カテゴリー化",
 text:"問5 文章中の下線部E「集団間の再カテゴリー化を促す活動」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「留学生」と「日本人学生」が「X大学の学生代表」として模擬店を出店する。","「日本人学生」と「留学生」の違いを強調し、互いの長所や短所を指摘し合う。","来日間もない「留学生」に対して、「日本人学生」が学習や生活のサポートを行う。","自分の国の民族衣装を着て、「各国の代表」として地域の文化を互いに紹介する。"], answer:0,
 explain:"再カテゴリー化は、「留学生」と「日本人学生」という対立しうる下位集団の区分を超え、「X大学の学生」というより大きな一つの共通集団として再定義することで、集団間の垣根や偏見を低減させる手法です。"},

{id:"R2-16-46", tag:"R2 試験III 問題10 問1", cat:"第二言語習得:インターアクション",
 text:"問題10 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n第二言語習得に関わる要因の一つに環境があり,教室習得環境と自然習得環境とに大きく二分して捉えられる。教室習得環境には,自然習得環境におけるインターアクションには見られない特徴がある。例えば,教師はプロンプトを用いて,学習者の誤りに対するフィードバックを行う。また,フォーカス・オン・フォームによる指導等によってインターアクションが促されている。\n習得の環境に関わらず,その過程においては,過剰般化等の現象がある。また,学習者の誤りが定着化する場合もある。教師はこれらのことを理解しておく必要がある。\n\n問1 文章中の下線部Aに関して、教室習得環境のインターアクションと比べた際の特徴として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["母語話者は言語形式の正確さを重視し、頻繁に誤りを訂正する。","母語話者は学習者のレベルよりやや上の文法項目を段階的に取り入れて話す。","母語話者との談話のタイプが多様でインプットの量も多い。","母語話者が質問し、学習者が答え、母語話者が評価するというやり取りが多い。"], answer:2,
 explain:"自然習得環境では、教室のような限定的なやり取り(IRF型など)とは異なり、日常生活のさまざまな場面で多様なタイプの談話に触れ、インプットの量も多くなるという特徴があります。"},

{id:"R2-16-47", tag:"R2 試験III 問題10 問2", cat:"第二言語習得:プロンプト",
 text:"問2 文章中の下線部B「プロンプト」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者の誤りに対して教師が正しい言い方を示すと効果的である。","学習者が誤った文を正しく言い直さなくても効果的である。","学習者の現在の言語能力を超えた誤りに対して効果的である。","学習者にとって既習であっても正しく使えない項目に効果的である。"], answer:3,
 explain:"プロンプトは、正しい形を直接教えるのではなく、学習者自身に誤りに気づかせ、自ら訂正するよう促すフィードバックの方法です。すでに学習済みだが正確に使いこなせていない(既習だが定着していない)項目に対して特に効果的とされます。"},

{id:"R2-16-48", tag:"R2 試験III 問題10 問3", cat:"第二言語習得:フォーカスオンフォーム",
 text:"問3 文章中の下線部C「フォーカス・オン・フォーム」の背景となる考え方の一つとして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["言語形式と意味・機能を結びつける過程で習得が起こる。","教師と学習者が文法について話し合うことで習得が起こる。","言語の意味に焦点を当てて学習することで習得が進む。","文法項目を体系的に整理し学習する過程で習得が進む。"], answer:0,
 explain:"フォーカス・オン・フォームは、意味中心のコミュニケーション活動の中で、必要に応じて言語形式にも注意を向けさせることで、言語形式とその意味・機能とを結びつけながら習得が進むという考え方を背景としています。"},

{id:"R2-16-49", tag:"R2 試験III 問題10 問4", cat:"第二言語習得:過剰般化",
 text:"問4 文章中の下線部D「過剰般化」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「恋人」という漢字を書こうとして字形の似ている「変人」と書く。","「料理する」という単語が思い出せないとき母語で\"cooking\"と言う。","「1km泳いで疲れた」と伝えたくて、「およんで」と撥音化の規則を用いる。","「回転ずし」という語を知らず、「回るすしレストラン」という言葉を造る。"], answer:2,
 explain:"「泳ぐ」のテ形は本来「泳いで」ですが、他の多くの五段動詞に見られる撥音便化の規則(死ぬ→死んで、読む→読んでなど)を過剰に一般化(適用範囲を広げすぎ)して、誤って「およんで」としてしまう例は、過剰般化の典型です。"},

{id:"R2-16-50", tag:"R2 試験III 問題10 問5", cat:"第二言語習得:誤りの定着化",
 text:"問5 文章中の下線部Eに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["誤りの定着化は目標言語に関して受けた指導とは無関係である。","学習者の母語や既習語の知識が誤りの定着化に関わる。","誤りの定着化は音声面には起こるが、文法面には起こらない。","上級レベルで学習した文法項目の誤りは定着化しない。"], answer:1,
 explain:"誤りの定着化(化石化)には、学習者の母語からの影響や、すでに習得した言語知識(既習語)の影響など、様々な要因が関わるとされています。"},

{id:"R2-16-51", tag:"R2 試験III 問題11 問1", cat:"第二言語習得:動機づけ",
 text:"問題11 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n教師は第二言語学習における個人差を多面的に捉える必要がある。例えば,動機づけは言語学習を継続する原動力となる。また,動機づけは学習段階によって変化すると言われ,教師はそれに応じた働きかけを行うことが推奨される。さらに,学習者のビリーフも学習に影響を及ぼしている。その他に,キャロル(J.B.Carroll)の示したように言語適性にも個人差がある。教師はそうした個人差や学習の段階に配慮しながら,学習者オートノミーを育成するよう努めることが望ましい。\n\n問1 文章中の下線部A「動機づけ」のうち、内発的動機づけの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本語は必修科目なので、単位を取って大学を卒業したい。","日本語や日本文化を学んで、知識を増やし教養を高めたい。","日本の大学院で学位を取り、今より待遇のよい仕事に就きたい。","日本語科目でよい成績を取り、奨学金に応募したい。"], answer:1,
 explain:"内発的動機づけは、学習そのものへの興味や関心、知的満足感など、学習者自身の内側から生じる動機です。「知識を増やし教養を高めたい」という学び自体への関心はこれにあたります。他の選択肢は、単位・待遇・奨学金といった外的な報酬を目的とする外発的動機づけの例です。"},

{id:"R2-16-52", tag:"R2 試験III 問題11 問2", cat:"教授法:動機づけの維持",
 text:"問2 文章中の下線部Bに関して、学習を続ける中で学習者の動機づけを維持するために有効な指導実践として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者の言語的誤りを一つ一つ指摘し、細かく説明して直す。","学習時のタスクや活動を挑戦的にし、学習者の意欲を高める。","肯定的な自己イメージを持たせ、明確な学習目標を設定する。","学習者が自信を失わないよう、褒めたり励ましたりする。"], answer:0,
 explain:"学習者の誤りを一つ一つ細かく指摘し続けることは、学習者の自信や意欲を削ぎ、動機づけの維持にはむしろ逆効果になりやすいとされます。"},

{id:"R2-16-53", tag:"R2 試験III 問題11 問3", cat:"第二言語習得:学習者のビリーフ",
 text:"問3 文章中の下線部C「学習者のビリーフ」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者のビリーフの変容と学習スキルの習熟度は、密接な関係がある。","母国の教育方針や教育システムが学習方法に対する好みに影響する。","学習者のビリーフは、授業活動の影響を受けず独立して形成される。","目標言語学習に対する考え方と学習行動が合致しないことがある。"], answer:2,
 explain:"学習者のビリーフ(言語学習に関する信念)は、母国の教育背景だけでなく、実際に受けている授業活動や学習経験からも影響を受けて変化していくものであり、「授業活動の影響を受けず独立して形成される」という記述は不適当です。"},

{id:"R2-16-54", tag:"R2 試験III 問題11 問4", cat:"第二言語習得:言語適性",
 text:"問4 文章中の下線部D「言語適性」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["外向的な特性を持つ学習者は内向的な学習者よりも、最終的に言語能力が高くなる。","音を語のまとまりとして認識し再生する能力は、習得の初期段階で有利に働く。","相手や状況に合わせて言葉選びができる能力は、社会文化の影響を受ける。","指導方法が学習者の特性に合う合わないにかかわらず、その効果は同じである。"], answer:1,
 explain:"キャロルの言語適性の構成要素の一つに、音声を語のまとまりとして知覚し記憶・再生する能力(音韻符号化能力)があり、これは特に習得の初期段階において有利に働くとされています。"},

{id:"R2-16-55", tag:"R2 試験III 問題11 問5", cat:"教授法:学習者オートノミー",
 text:"問5 文章中の下線部E「学習者オートノミーを育成する」ための教師の行動として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["教師は学習者に目標を聞き、それを達成するための学習行動を自分で考えさせる。","教師は自身の教育経験に基づき、学習者にとって最適だと思う方法で学習させる。","教師は学習者が自分で学習を進められるよう独習用テキストを決め、見守る。","教師は学習者の望む学習内容・方法を確認し、その希望に沿った形で授業を行う。"], answer:0,
 explain:"学習者オートノミー(自律性)を育成するには、教師が一方的に方法を決めるのではなく、学習者自身に目標を考えさせ、それを達成するための学習方法や行動を自分で選択・計画させることが重要です。"},

{id:"R2-16-56", tag:"R2 試験III 問題12 問1", cat:"談話:情報共有と言語形式",
 text:"問題12 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n会話は参加者の様々な要因に左右されて進んでいく。例えば,話し手と聞き手の話題に関する情報共有の有無は,言語形式に反映される。また,会話は基本的には話し手と聞き手のやり取りであると考えられているが,話し手は,本来の聞き手以外の参加者の存在によって話し方を変えることがある。\n会話の個々の発話に着目すると,体言止めや終助詞などの多様な形式の文末表現が使用されている。やり取りが隣接応答ペアの場合,優先応答(preferred response)か非優先応答(dispreferred response)かどうかも発話に影響する。\n通常,これらの現象やその要因に関して人々は無意識であることが多い。会話の授業では,ロールプレイなど口頭のパフォーマンス・テストの後にフィードバックを行い,学習者の気づきを促すとよい。\n\n問1 文章中の下線部Aに関して、情報が共有されている場合の言語形式として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「あの会議、品川だったよね?」のア系指示詞","「私、来週また出張なんだ」の一人称代名詞","「ああ、すっかり秋だな」の詠嘆の終助詞","「お花見、誰と行ったの?」の疑問の終助詞"], answer:0,
 explain:"ア系指示詞(「あの」など)は、話し手と聞き手の双方がすでに知っている(共有されている)情報を指し示す際に使われます。"},

{id:"R2-16-57", tag:"R2 試験III 問題12 問2", cat:"社会言語学:聞き手以外への配慮",
 text:"問2 文章中の下線部Bの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["地方の役場の住民説明会で、職員が住民との関係作りを意識して方言でリラックスして雑談をする。","地方選挙のインタビューで、候補者が地元の聴衆を意識して共通語による質問に地域方言で答える。","小学校の運動会の開会式で、校長先生が保護者と地域住民に向かって改まった口調で挨拶をする。","就職の集団面接で、就職活動中の学生が好印象を与えることを目的に面接官に向かって敬語で受け答えする。"], answer:1,
 explain:"選挙インタビューにおいて、候補者は直接の話し相手であるインタビュアー(共通語で質問)以外に、周囲で聞いている地元の有権者(オーバーヒアラー)の存在も意識し、あえて地域方言で答えることで親近感を示しています。これは、本来の聞き手以外の参加者の存在によって話し方を変える例です。"},

{id:"R2-16-58", tag:"R2 試験III 問題12 問3", cat:"文法:伝聞のって",
 text:"問3 文章中の下線部C「文末表現」の「って」に関して、他と用法の異なるものを、次の1〜4の中から一つ選べ。\n\n1 X:天気予報、何て言ってる? / Y:予報が変わって、晴れるって。\n2 X:あれ、田中さんがいないね? / Y:お腹が痛いから、先に帰るって。\n3 X:えー、あなた何も文句ないの? / Y:ないよ、ないって。\n4 X:彼女、来月来るんだっけ? / Y:来月じゃなくて、再来月に来るんだって。",
 choices:["選択肢1(晴れるって)","選択肢2(帰るって)","選択肢3(ないって)","選択肢4(来るんだって)"], answer:2,
 explain:"選択肢1・2・4の「って」は、他者から聞いた情報を伝える伝聞・引用の用法です。一方、選択肢3の「ないって」は、伝聞ではなく、自分の発言を強調・念押しする用法であり、他とは性質が異なります。"},

{id:"R2-16-59", tag:"R2 試験III 問題12 問4", cat:"談話:非優先応答",
 text:"問4 文章中の下線部D「非優先応答」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["問い ― 返答","申し出 ― 受諾","苦情 ― 弁明","要請 ― 許可"], answer:2,
 explain:"隣接応答ペアには、社会的に望ましい・スムーズな応答である優先応答(問いに対する返答、申し出に対する受諾、要請に対する許可など)と、望ましくない・気まずさを伴う非優先応答があります。「苦情」に対して「弁明(言い訳)」で応じることは、本来期待される応答(謝罪など)からずれた非優先応答の例です。"},

{id:"R2-16-60", tag:"R2 試験III 問題12 問5", cat:"評価:口頭パフォーマンステスト",
 text:"問5 文章中の下線部E「口頭のパフォーマンス・テスト」を実施する際の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["実際の場面で即興的に話せるように、タスクの場面の説明は行わない。","学習者の緊張感や不安感を高めないように、評価方法については伝えない。","学習者のロールプレイがモデル会話通りに進行していることを評価する。","実際に起こり得る場面で求められる言語運用能力を測るタスクを設定する。"], answer:3,
 explain:"口頭のパフォーマンス・テストでは、実際のコミュニケーション場面で必要とされる言語運用能力を適切に測定できるような、現実的で妥当性の高いタスクを設定することが重要です。"},

{id:"R2-16-61", tag:"R2 試験III 問題13 問1", cat:"社会言語学:アイデンティティ",
 text:"問題13 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n教育現場では,学習者のアイデンティティを多様な側面から捉えることが重視されてきた。海外の日本語教育においては,日本人の子どもたちを対象とする日本語の継承語教育が注目されており,そのアイデンティティはコード・スイッチングとも関わりがある。コード・スイッチングには,隠喩的コード・スイッチング,状況的コード・スイッチング,会話的コード・スイッチングがあり,これらの現象に関する研究も数多くなされている。日本国内では,近年,学校教育現場に日本語指導が必要な外国籍の児童生徒が増加しており,二言語を使用する子どものアイデンティティ形成に関する議論が見られる。このような議論は,子どもに限ったことではない。成人の日本語学習者に対する指導の際にもアイデンティティへの配慮が求められている。\n\n問1 文章中の下線部A「アイデンティティ」のうち、「社会的アイデンティティ」の形成に関わっているものとして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["消極的・積極的などの心理的特性","身長や体重などの身体的特徴","性や国籍などの属性","学習や言語などの能力感"], answer:2,
 explain:"社会的アイデンティティは、性別・国籍・所属集団など、社会的なカテゴリーへの帰属に基づいて形成されるアイデンティティです。"},

{id:"R2-16-62", tag:"R2 試験III 問題13 問2", cat:"日本語教育:継承語教育",
 text:"問2 文章中の下線部B「日本語の継承語教育」に関して、日本国外における日本語の継承語教育の変遷に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["従来は日本語教育の専門家がプログラムを運営していたが、近年は保護者や地域団体がその担い手になっている。","従来は帰国後の日本社会への適応が補習授業校の目的であったが、近年は帰国予定のない子どもへの継承語としての日本語指導等、ニーズが多様化している。","従来は日本人教育として日本語および文化の教育を行っていたが、近年は家庭で日本語を使用する機会がない学習者への動機づけの場にもなっている。","従来は第一言語が日本語である者を対象としていたが、近年は日系三世以降の世代など第一言語が日本語ではない者も対象となっている。"], answer:0,
 explain:"実際の変遷としては、従来は保護者や地域のコミュニティが担い手となって継承語教育の場を運営してきましたが、近年はより専門的な知見を持つ日本語教育の専門家が関わるようになってきているとされ、この記述は実際の変遷とは逆になっています。"},

{id:"R2-16-63", tag:"R2 試験III 問題13 問3", cat:"社会言語学:会話的コードスイッチング",
 text:"問3 文章中の下線部C「会話的コード・スイッチング」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["米国在住の日本人家族が、会話中に友達の言葉を英語に切り替えて引用する。","日常生活で日本語を用いる者が、宗教上の儀式を行う際には英語を用いる。","日英バイリンガルが、日本語が分からない相手には英語を用いて会話する。","英国在住の日本人の兄弟が、親に分からないように英語の若者言葉に切り替える。"], answer:0,
 explain:"会話的コード・スイッチングは、一つの会話の中で、引用や強調などの談話上の目的のために瞬間的に言語を切り替える現象です。会話の中で友達の発言を引用する際に英語に切り替える例が、これにあたります。"},

{id:"R2-16-64", tag:"R2 試験III 問題13 問4", cat:"日本語教育政策:外国籍児童生徒の母語",
 text:"問4 文章中の下線部Dに関して、文部科学省が行った「日本語指導が必要な児童生徒の受入状況等に関する調査(平成30年度)」において、日本語指導が必要な外国籍の児童生徒の母語で最も多い言語を、次の1〜4の中から一つ選べ。",
 choices:["スペイン語","フィリピノ語","ベトナム語","ポルトガル語"], answer:3,
 explain:"平成30年度の調査では、日本語指導が必要な外国籍児童生徒の母語として、ポルトガル語(日系ブラジル人など)が最も多い言語でした。"},

{id:"R2-16-65", tag:"R2 試験III 問題13 問5", cat:"日本語教育:成人学習者とアイデンティティ",
 text:"問5 文章中の下線部Eに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者のアイデンティティは変容しにくいものではあるが、日本語・日本文化の学習がアイデンティティに影響を与えないように配慮する。","学習者に日本文化の価値観に積極的に合わせていくように促し、日本語話者としての新たなアイデンティティを構築できるようにする。","学習者は母語社会のアイデンティティを持っているので、日本語学習の初期段階で日本語に埋め込まれた価値観に違和感を持っていないか配慮する。","学習者が持っているそれぞれの母語社会のアイデンティティに配慮し、日本の文化や価値観を切り離して日本語を指導する。"], answer:2,
 explain:"成人学習者はすでに母語社会で形成されたアイデンティティを持っているため、日本語という言語に埋め込まれた文化的な価値観と接する初期段階で、違和感や葛藤を覚えていないか教師が配慮する必要があります。"},

{id:"R2-16-66", tag:"R2 試験III 問題14 問1", cat:"待遇表現:ウチソト",
 text:"問題14 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n待遇表現は,円滑なコミュニケーションを遂行するにあたり重要である。人間関係を捉える概念としては,ウチ・ソトや親・疎などが挙げられる。このような人間関係や状況等に応じて用いられる方略には,ポライトネス・ストラテジーがある。\n日本語の待遇表現の代表例といえる敬語に関しては,2007年に文化審議会国語分科会によって「敬語の指針」が示された。指針では,尊敬語・謙譲語などについて実際の言語使用に関連づけて説明がなされている。\n日本語教育においては,学習者にこれらの待遇表現の指導を効果的に行っていくことが求められる。\n\n問1 文章中の下線部A「ウチ・ソト」の概念に関して、次のビジネス会話における(ア)に入れる発話として最も適当なものを、下の1〜4の中から一つ選べ。\n\n<X社社員がY社課長を訪ねた際のY社受付係との会話>\nX社社員:渡辺課長はいらっしゃいますか。\nY社受付係:(ア)",
