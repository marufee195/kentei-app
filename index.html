/* ========= データ (令和5年度 試験III 問題1) ========= */
{id:"R5-16-1", tag:"R5 試験III 問題1 問1", cat:"音声学:アクセント",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語の発音において、音の高さは重要な要素である。日本語では音の高さに関係する音声的な特徴にアクセントとイントネーションがある。このうち、イントネーションは、文のどこにフォーカスが置かれているかを知る手掛かりになる。また、どのような意図で話したかを知る手掛かりにもなる。例えば、文末の上昇イントネーションについても、文末を連続的に上昇させるタイプと、文末を直前の拍より一段高く平らに言うタイプとの違いにより、様々な意図を示すことが知られている。\nイントネーションを学習者に説明したり練習させたりするときには、視覚化するより分かりやすい。また、教師の発話も重要である。例えば、教師が、文節末を上昇させて発話することで不自然なイントネーションになる場合がある。学習者がこのようなイントネーションをまねすることがないよう、教師は自分の発話に注意する必要がある。\n\n問1 文章中の下線部A「アクセント」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["東京方言において、アクセントは個々の語について決まっている。","東京方言の名詞のアクセントの型は、その名詞の拍数と同じ数だけ存在する。","日本語のアクセントは、語中の音の強弱の配置が決まっている。","日本語のアクセントは声調と言い、音節内部のピッチ変動にパターンがある。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"東京方言(共通語)のアクセントは、語ごとに(語彙的に)高低のパターンが決まっている「語彙アクセント」です。名詞の型の種類は拍数+1種類あり拍数と同数ではなく、日本語アクセントは強弱ではなく高低で、声調のように音節内部でピッチが変動するのではなく拍単位で高低が決まるため、他の記述は不適当です。"},

{id:"R5-16-2", tag:"R5 試験III 問題1 問2", cat:"音声学:フォーカス",
 text:"問2 文章中の下線部B「フォーカス」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「ちょっとお聞きしますが。」という質問の前置き表現にはフォーカスが置かれる。","「いつ来ますか?」という疑問詞疑問文では「いつ」にフォーカスが置かれる。","「オランダですか?」という聞き返しの文は「オランダ」にアクセント核がないため、フォーカスが置かれない。","「山には行きませんでしたが、海には行きました。」という対比の文はフォーカスが置かれない。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"疑問詞疑問文では、問いの中心となる疑問詞自体にフォーカスが置かれます。前置き表現には通常フォーカスは置かれず、聞き返しの語や対比される語には、アクセント核の有無に関わらずフォーカスが置かれるのが一般的であるため、他の記述は不適当です。"},

{id:"R5-16-3", tag:"R5 試験III 問題1 問3", cat:"音声学:イントネーション",
 text:"問3 文章中の下線部C「文末を直前の拍より一段高く平らに言うタイプ」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["相手を誘うときの「そろそろ帰らない」","「はい・いいえ」の答えを求めるときの「(雨)やんだ」","相手への反発の気持ちを込めたときの「(私は)分かってる」","疑う気持ちで、完全には納得や同意をしていないときの「そう」"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"文末を直前の拍より一段高く平らに保つ特殊なイントネーションは、相手への反発や強い自己主張の気持ちを込めた発話によく見られます。「(私は)分かってる」という反発的な発話はこの例として最も適当です。"},

{id:"R5-16-4", tag:"R5 試験III 問題1 問4", cat:"音声教育:イントネーションの視覚化",
 text:"問4 文章中の下線部Dの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["発音するときに、口の前にティッシュペーパーを垂らして、そのゆれを見せる。","発音しながら1拍ごとに、1歩ずつ歩いたり足踏みしたりするのを見せる。","学習者と向き合い、自分の右から左へ手を動かし、高さを示しながら発音する。","音響分析ソフトで、第1・第2フォルマントの位置を示しながら発音を聞かせる。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"手を左右に動かしながら高さの変化を示すジェスチャーは、イントネーションの上がり下がりを視覚的に示す代表的な方法です。ティッシュの揺れは帯気性(1)、歩行や足踏みは拍のリズム(2)、フォルマント表示は母音の音質(4)を示す方法であり、イントネーションの視覚化とは異なります。"},

{id:"R5-16-5", tag:"R5 試験III 問題1 問5", cat:"音声教育:教師の発話への注意",
 text:"問5 文章中の下線部Eの例として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["助詞の部分をはっきり発音しようとする場合","活用している部分をはっきり発音しようとする場合","意味の切れ目をはっきり示そうとする場合","有声音と無声音の区別をはっきり示そうとする場合"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"教師が文節末を不自然に上昇させてしまう原因には、助詞や活用部分を際立たせようとする意識や、意味の切れ目を示そうとする意識が挙げられます。有声音と無声音の区別は音の高さ(ピッチ)ではなく声帯振動の有無に関わる特徴であり、文節末の上昇イントネーションとは直接関係しないため、この選択肢が不適当な例となります。"},

/* ========= データ (令和5年度 試験III 問題2) ========= */
{id:"R5-16-6", tag:"R5 試験III 問題2 問1", cat:"文法:可能形の作り方",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語の可能形の作り方は、動詞の活用のグループによって異なる。一段活用(IIグループ)の動詞の場合、活用語尾の「る」を「られる」に変えて作る。五段活用(Iグループ)の動詞の場合、活用語尾の(ア)を(イ)に変えて作る。変格活用(IIIグループ)の動詞の場合、「来る」は「来られる」、「する」は「できる」となる。可能形は、以上のいずれかの形態をとりながら広く使われている。\n意味の面に注目すると、日本語の共通語では、能力可能と状況可能とを形態上の区別なく表す。諸言語や日本語の方言の中には、両者を表し分ける形式を持つものもあるので、指導において注意が必要である。\nまた、日本語では「車が故障して動かすことができない。」と似た意味で「車が故障して動かない。」と言うなど、自動詞文が可能の意味合いを持つ場合があり、学習者にとって習得が難しい。その他、可能の意味を含む隣接表現についても理解しておく必要がある。\n\n問1 文章中の(ア)と(イ)に入れるのに最も適当な組合せを、次の1〜4の中から一つ選べ。",
 choices:["(ア)-う (イ)-eる","(ア)-う (イ)-れる","(ア)-u (イ)-eる","(ア)-u (イ)-れる"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"五段活用動詞の可能形は、語幹末の母音uをeに変えて「eる」を付加することで作られます(例:書く kak-u → kak-eru)。ローマ字表記で語幹の音韻交替を示すため、(ア)は-u、(イ)は-eるとなります。"},

{id:"R5-16-7", tag:"R5 試験III 問題2 問2", cat:"文法:可能形の性質",
 text:"問2 文章中の下線部Aに関して、可能形の形態や使い方に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["可能形の目的語には、ガ格は使えるがヲ格は使えない。","可能形はテイル形にすることができない。","可能形の動作の主体は、ヲ格またはニ格で表す。","可能形を作ることができるのは意志的行為を表す動詞である。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"可能形は、本来主体の意志によって行われる動作を表す意志動詞から作られるのが基本です(非意志動詞からは可能形を作りにくい)。可能形の目的語にはガ格・ヲ格のどちらも使われることがあり、テイル形にすることも可能で、動作の主体は通常ガ格で表されるため、他の記述は不適当です。"},

{id:"R5-16-8", tag:"R5 試験III 問題2 問3", cat:"文法:能力可能と状況可能",
 text:"問3 文章中の下線部Bに関して、能力可能と状況可能との形態的な区別がないことを学習者に示すのに最も適当な例文の組合せを、次の1〜4の中から一つ選べ。",
 choices:["(能力可能)この電車に乗れば空港に行けます。 / (状況可能)券を持っていたので中に入れました。","(能力可能)私はギターが弾けます。 / (状況可能)日本では20歳になったらお酒が飲めます。","(能力可能)英語は分かりません。 / (状況可能)鍵をなくして開けられません。","(能力可能)犬は木に登れません。 / (状況可能)難しい曲は弾けません。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「私はギターが弾けます」は個人の技能による能力可能、「20歳になったらお酒が飲めます」は年齢という状況・条件による状況可能ですが、いずれも同じ「可能形」という形態で表されており、能力可能と状況可能に形態上の違いがないことを示す好例です。"},

{id:"R5-16-9", tag:"R5 試験III 問題2 問4", cat:"文法:自動詞文の可能の意味",
 text:"問4 文章中の下線部C「自動詞文が可能の意味合いを持つ場合」の例として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["この地域はあまり雪が降らない。","この瓶は蓋が固くて開かない。","この汚れは簡単には落ちない。","この故障はすぐには直らない。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"「蓋が開かない」「汚れが落ちない」「故障が直らない」は、いずれも「〜しようとしてもできない」という可能の意味合いを伴う自動詞文です。一方「雪が降らない」は単にその地域の気候的事実を述べただけであり、「降らせようとしてもできない」という可能の含意はないため、この例だけ性質が異なります。"},

{id:"R5-16-10", tag:"R5 試験III 問題2 問5", cat:"文法:可能の意味を含む隣接表現",
 text:"問5 文章中の下線部D「可能の意味を含む隣接表現」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「〜がたい」は、能力的にできないことを表し、無意志動詞にも付く。","「〜得ない」は、起こる可能性がないことを表し、無意志動詞にも付く。","「〜かねる」は、許可が得られないことを表し、無意志動詞には付かない。","「〜にくい」は、するのが困難であることを表し、無意志動詞には付かない。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「〜得ない」(あり得ない、起こり得ない等)は、事態が起こる可能性がないことを表し、「起こる」のような無意志動詞にも付きます。「〜がたい」は心理的抵抗感を表し主に意志動詞に付き、「〜かねる」は話し手の意向として引き受けにくいことを表し、「〜にくい」は無意志動詞にも付くため、他の記述は不適当です。"},

/* ========= データ (令和5年度 試験III 問題3) ========= */
{id:"R5-16-11", tag:"R5 試験III 問題3 問1", cat:"文法:人称代名詞",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n「話し手/聞き手/それ以外」を区分する文法的概念を人称と言い、それぞれ「一人称/二人称/三人称」と呼ばれる。多くの言語が一人称代名詞を1種ないしごく少数しか持たないのに対し、「わたし/ぼく/おれ」などのように日本語の一人称代名詞は多様であるとされる。日本語の人称代名詞は明示されないことも多いが、人称代名詞を省略することができない場合もあるので注意が必要である。\n人称は、一部の語彙的・文法的意味や待遇表現と密接な関わりを持つ。例えば、主観的な概念を表す述部が非過去形の場合、主語は原則として一人称となる。また、敬語との関連では、尊大表現など特殊な場合を除き、尊敬語の主語には(ア)は現れないが、(イ)は現れる。さらに、人称は「コ・ソ・ア」を含む指示表現と一定の対応関係を持っていることにも注意が必要である。\n\n問1 文章中の下線部A「一人称代名詞の用法を持つ現代日本語の名詞」として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["自己","自身","自分","自ら"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「自分」は、本来再帰的な意味を持つ語ですが、現代日本語の話し言葉では「自分、それ知ってます」のように一人称代名詞として使われる用法があります。「自己」「自身」「自ら」にはこのような一人称代名詞としての用法はありません。"},

{id:"R5-16-12", tag:"R5 試験III 問題3 問2", cat:"文法:人称代名詞の省略",
 text:"問2 文章中の下線部B「人称代名詞を省略することができない場合」はどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["指示対象が目上の人の場合","指示対象が焦点となっている場合","指示対象に直接行為を要求する場合","指示対象に繰り返し言及する場合"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"指示対象が対比や強調の焦点となっている場合には、それを明示するために人称代名詞を省略できません。目上の人であることや、行為の直接要求、繰り返しの言及は、必ずしも代名詞の省略不可を意味しないため、他の記述は不適当です。"},

{id:"R5-16-13", tag:"R5 試験III 問題3 問3", cat:"文法:主語が一人称に限定される述部",
 text:"問3 文章中の下線部Cに関して、主語の人称が一人称に限定されている述部の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["私は毎日の努力が大切だと考えている。","私は毎朝テニスを楽しんでいる。","私は多分卒業旅行に行かないと思う。","私は人付き合いが上手なあの人とは違う。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「〜と思う」は、非過去形のまま使われると話し手自身の主観的な思考を表す述部であり、主語は原則として一人称に限定されます(三人称の場合は「〜と思っている」のような形になる)。「〜ている」を伴う1・2や、客観的な状態を述べる4は、三人称主語でも使うことができます。"},

{id:"R5-16-14", tag:"R5 試験III 問題3 問4", cat:"文法:尊敬語と人称",
 text:"問4 文章中の(ア)と(イ)に入れるのに最も適当な組合せを、次の1〜4の中から一つ選べ。",
 choices:["(ア)一人称 (イ)二人称と三人称","(ア)二人称 (イ)一人称と三人称","(ア)一人称と二人称 (イ)三人称","(ア)一人称と三人称 (イ)二人称"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"尊敬語は聞き手や話題の人物を高めるために使われるため、通常は自分自身(一人称)を主語にして使うことはなく、二人称・三人称を主語とする場合に用いられます。"},

{id:"R5-16-15", tag:"R5 試験III 問題3 問5", cat:"文法:人称と指示表現",
 text:"問5 文章中の下線部D「人称と指示表現」の関係に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["話し手が身の回りにある対象を指示する場合は、ア系を使用する。","話し手が発話を行っている現在の場を指示する場合は、ア系が使える。","話し手が対話の相手と共有する記憶を指示する場合は、ソ系を使用する。","話し手が対話の相手の発話に出てきた事物を指示する場合は、ソ系が使える。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"相手の発話中に出てきた事物を受けて指示する場合には、ソ系の指示語(それ・その等)が使われます。話し手の身の回りや発話の現在の場を指すのは通常コ系であり、対話の相手と共有する記憶を指す場合はア系(あの、あれ)が使われるため、他の記述は不適当です。"},

/* ========= データ (令和5年度 試験III 問題4) ========= */
{id:"R5-16-16", tag:"R5 試験III 問題4 問1", cat:"文法:「のだ」の接続",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語の「のだ」は、「んだ/のです/の」等、様々な形を持っており、疑問文では「のか?/んですか?/の?」となる。「のだ」は、動詞・イ形容詞・ナ形容詞・「名詞+だ」という四つの述語の(ア)に接続するが、(イ)の「だ」は「な」に変えて接続する。これは、「のだ」の「の」の働きと関わっている。\n「のだ」は、機能により二つに分けられる。一つ目は、文が表す事態に対する話し手の判断や聞き手への態度を表す「のだ」である。「のだ」の推量の形式「のだろう」は、証拠に基づく推測を表し、「だろう」に言い換えることはできない。二つ目は、否定文や疑問文の焦点を変える「のだ」である。「私は絶対に学校に行かない。」という文と「私は行きたくて学校に行くのではない。」という文の否定の焦点は異なる。このほかにも、指導に際して「のだ」の使い方の様々な特徴を知っておくとよい。\n\n問1 文章中の(ア)と(イ)に入れるのに最も適当な組合せを、次の1〜4の中から一つ選べ。",
 choices:["(ア)普通形 (イ)「名詞+だ」","(ア)普通形 (イ)ナ形容詞・「名詞+だ」","(ア)丁寧形 (イ)「名詞+だ」","(ア)丁寧形 (イ)ナ形容詞・「名詞+だ」"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「のだ」は、動詞・イ形容詞・ナ形容詞・「名詞+だ」の普通形に接続しますが、ナ形容詞と「名詞+だ」については「だ」の部分が「な」に変わって「〜なのだ」となります。"},

{id:"R5-16-17", tag:"R5 試験III 問題4 問2", cat:"文法:「の」の働き",
 text:"問2 文章中の下線部A「「の」の働き」として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["文法化","名詞化","主題化","述語化"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「のだ」の「の」は、先行する普通形の節を名詞句として扱えるようにする「名詞化」の働きを持ち、その名詞化された節に「だ」が続くことで「のだ」という形式が成立します。"},

{id:"R5-16-18", tag:"R5 試験III 問題4 問3", cat:"文法:「のだろう」と「だろう」",
 text:"問3 文章中の下線部Bに関して、「のだろう」が適切で「だろう」が不適当な場面の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["友人の性格を根拠に、今、友人が海外で元気に暮らしていると推測する。","今日も暑くなると聞いて、アイスクリームの販売量が伸びると推測する。","駅に入りきれないほど人がいるのを見て、事故があったことを推測する。","新聞記事を読んで、30年後、自動運転が広く普及していることを推測する。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「のだろう」は、目の前の状況などの具体的な証拠に基づく推測を表す形式です。「駅に入りきれないほど人がいる」という直接の観察事実を根拠に推測する場面はこれに当たり、単なる一般的推測を表す「だろう」に置き換えるのは不自然です。"},

{id:"R5-16-19", tag:"R5 試験III 問題4 問4", cat:"文法:否定の焦点",
 text:"問4 文章中の下線部Cで示されている二つの文の「否定の焦点」はどれか。最も適当な組合せを、次の1〜4の中から一つ選べ。",
 choices:["(私は絶対に学校に行かない。)絶対に / (私は行きたくて学校に行くのではない。)行く","(私は絶対に学校に行かない。)絶対に / (私は行きたくて学校に行くのではない。)行きたくて","(私は絶対に学校に行かない。)行く / (私は行きたくて学校に行くのではない。)学校に","(私は絶対に学校に行かない。)行く / (私は行きたくて学校に行くのではない。)行きたくて"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"「絶対に学校に行かない」は「行く」という行為そのものを完全に否定しており、否定の焦点は「行く」です。一方「行きたくて学校に行くのではない」は、学校に行くこと自体は前提とした上で、その理由である「行きたくて(という気持ちからではない)」の部分を否定しており、否定の焦点は「行きたくて」です。"},

{id:"R5-16-20", tag:"R5 試験III 問題4 問5", cat:"文法:「のだ」の使い方の特徴",
 text:"問5 文章中の下線部D「「のだ」の使い方の様々な特徴」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「どうして」「なぜ」など理由を問う疑問文では、「のだ」を使わないのが自然である。","答えを知っている教師が学習者に発する疑問文では、「のだ」を使わないのが自然である。","「のだ」は、使うべきところで使わないと文が不自然になるが、情報の伝達には支障がないことが多い。","「のだ」は、使うべきでないところで使うと、不自然かつ無礼な印象を与えることがある。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"理由を問う疑問文ではむしろ「のだ」を伴う「どうして〜んですか」の形が自然です(1は不適当な記述ではなく正しい特徴の記述)。教師が答えを知っている確認質問において「のだ」の使用が不自然になるとは必ずしも言えず、この記述こそが「のだ」の特徴としては不適当です。"},

/* ========= データ (令和5年度 試験III 問題5) ========= */
{id:"R5-16-21", tag:"R5 試験III 問題5 問1", cat:"語彙指導:新出語導入",
 text:"次の会話を読み、下の問い(問1〜5)に答えよ。\n\nX先生が、同僚のベテラン教師Y先生に相談をしている。\n\nX先生:来学期、初級後半レベルの語彙の授業を担当することになったんです。Y先生も以前担当されていましたよね。どんなことをしていましたか?\nY先生:うーん。語彙マップを作る活動をしたり、習った語を使って短い文章を書く練習をしたりしましたね。それから多読も、読書を楽しみながら語彙が身に付けられますよ。\nX先生:あ、そうですね。語彙の学習方法って、単語カードを使って覚えるだけじゃないっていうことも学生たちに知ってもらいたいです。\nY先生:そうですね。カードの表裏に単語とその対訳を書いた単語カードを使う利点も、もちろんありますけどね。授業を通していろいろな学習ストラテジーを身に付けてくれるといいですね。\nX先生:いろいろ教えてくださり、どうもありがとうございます。授業では小テストもしようと考えているので、作ったら見ていただけますか?\nY先生:ええ、もちろん。\n\n問1 文章中の下線部A「語彙の授業」で新出語を導入する際の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["絵や写真などの視覚情報を与えることは避ける。","その語に関わる全ての知識を一度に教えることは避ける。","語の意味を推測させることは避け、意味を明示的に教える。","例文を提示することは避け、訳語やジェスチャーを使う。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"新出語の導入では、語義・用法・共起関係・派生形など全ての情報を一度に詰め込むのではなく、段階的に必要な知識を提示していくことが望ましいとされます。視覚情報の活用、意味推測をさせる工夫、例文の提示は、いずれもむしろ有効な導入方法であるため、他の記述は不適当です。"},

{id:"R5-16-22", tag:"R5 試験III 問題5 問2", cat:"語彙指導:語彙マップ",
 text:"問2 文章中の下線部B「語彙マップ」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["語彙マップを作ると、母語で既に獲得している背景知識や概念に頼らずに、語彙を増やすことができる。","語彙マップを作ると、機械的な暗記に頼らずに、新出語と既習語を関連付けた学習ができる。","語彙マップの作成を産出活動の前作業として行うと、その後の産出活動で必要な語が確認できる。","作成した語彙マップをほかの人と見せ合うと、知らなかった語や忘れかけていた語に触れることができる。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"語彙マップは、既に持っている背景知識や概念、既習語同士のつながりを生かして新しい語を関連付けていく活動であり、「背景知識や概念に頼らずに」語彙を増やすという記述は語彙マップの性質と矛盾するため、不適当です。"},

{id:"R5-16-23", tag:"R5 試験III 問題5 問3", cat:"語彙指導:多読の留意点",
 text:"問3 文章中の下線部C「多読」の活動を行う際の教師の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者の語彙を増やすため、本に出てきた知らない語を調べることを徹底させる。","学習者が好きな本を選べるように、十分な数や種類の読み物を準備しておく。","学習者が本の内容をどの程度理解したかを確かめるため、読解テストを行う。","学習者にとってレベルが合わない本でも、諦めずに最後まで読み通すよう励ます。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"多読は、辞書を引かず内容の大まかな理解を楽しみながら大量の文章に触れることで語彙・読解力を伸ばす活動であり、学習者が興味を持てる本を自由に選べるよう、豊富な読み物を用意しておくことが重要な留意点です。知らない語を逐一調べさせたり、読解テストを課したり、レベルの合わない本を無理に読ませたりすることは、多読本来の趣旨に反します。"},

{id:"R5-16-24", tag:"R5 試験III 問題5 問4", cat:"語彙指導:単語カードの利点",
 text:"問4 文章中の下線部D「カードの表裏に単語とその対訳を書いた単語カードを使う利点」として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["他の学習者と同じペースで学習しやすい。","文脈と切り離すことで長期記憶に残りやすい。","よく使われる語を選んで効率的に学べる。","語の様々な用法への深い理解が得られる。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"対訳付きの単語カードは、持ち運びやすく自分のペースで繰り返し確認できるため、頻出語を中心に絞って効率よく暗記するのに適した方法です。文脈から切り離すことは記憶保持の面ではむしろ不利に働くこともあり、語の多様な用法への深い理解を得る目的には不向きであるため、他の記述は不適当です。"},

{id:"R5-16-25", tag:"R5 試験III 問題5 問5", cat:"語彙指導:小テストの設問意図",
 text:"問5 文章中の下線部E「小テスト」に関して、X先生が後日、次のような小テストを作成した。この小テストの設問の意図として最も適当なものを、下の1〜4の中から一つ選べ。\n\n次の①〜③の( )に入れるものとして最も適当なものを、(ア)〜(カ)の中から一つずつ選びなさい。\n(ア)痛む (イ)すべる (ウ)鳴る (エ)話す (オ)回る (カ)見る\n例:道がつるつる( イ )。\n① 変わった服を着ている人をじろじろ( )。\n② 頭がずきずき( )。\n③ 日本語をぺらぺら( )。",
 choices:["語の正しい表記についての知識を確認する。","類義語の使い方についての知識を確認する。","他の語との共起関係についての知識を確認する。","語の比喩的な使い方についての知識を確認する。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「じろじろ見る」「ずきずき痛む」「ぺらぺら話す」のように、特定のオノマトペ(擬態語)と結びつきやすい動詞は決まっており、この小テストはオノマトペと動詞との共起関係についての知識を確認する設問だと考えられます。"},

/* ========= データ (令和5年度 試験III 問題6) ========= */
{id:"R5-16-26", tag:"R5 試験III 問題6 問1", cat:"教授法:行動中心アプローチ",
 text:"次の会話と資料を読み、後の問い(問1〜5)に答えよ。<資料>はX先生の授業内容のメモである。\n\nX先生が、ベテランのY先生に相談している。\n\nX先生:Y先生、行動中心アプローチに基づいた授業について、ちょっとご相談してもいいですか?\nY先生:どうしたんですか?\nX先生:学習者のコミュニケーション能力が伸びるように、CEFRを参考に、いろいろ工夫して授業をしているんですが、ちょっと自信がなくて。\nY先生:どんな工夫をしているんですか?\nX先生:はい、読解や聴解は真正性のある素材を使うようにしています。\nY先生:そうですか。いいですね。\nX先生:でも、うまくいかなくて。メモを持ってきたので、見てもらえませんか?\n\n<資料> X先生の授業内容のメモ\n対象者:中国人学習者12名\n授業目標:中国の観光地について話すことができる。(CEFR B1レベル)\n授業の流れ:1.授業目標を確認する。2.語彙を確認する。(日中同形語に注意する。)3.モデル会話を聞いて、内容を確認する。4.帰納的アプローチを用いて、文型の意味や使い方を理解する。5.話す内容についてあらかじめ考えたうえで、メモを基にペアで会話練習をする。(撮影する。)6.撮影した動画を使って、自己評価と教師評価を行う。\n\nY先生:うーん、もう少し社会と接点を持てるような具体的な課題を取り入れて、目標を見直すといいと思いますよ。\nX先生:そうですね。ありがとうございます。\n\n問1 文章中の下線部A「行動中心アプローチ」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["教師からの指示に対して即座に答えられるようになることが大切だと考え、応答練習を繰り返す。","学習する文型が現実場面でどのように使われているかを考え、その場面を使って会話練習を行う。","学習者がどのような場面で日本語を使用するかを考え、そこで必要となる文型や語彙を提供する。","聞くことと話すことが大切だと考え、作文や読解の練習は会話能力が向上してから行う。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"行動中心アプローチ(CEFRの基盤となる考え方)は、言語使用者を社会的に行動する存在(社会的存在)として捉え、学習者が実生活でどのような課題(タスク)を遂行する必要があるかを起点に、必要な言語能力を育成する考え方です。"},

{id:"R5-16-27", tag:"R5 試験III 問題6 問2", cat:"教材論:真正性の高い活動",
 text:"問2 文章中の下線部B「真正性」の高い教室活動として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["メールを書く活動を手書きで行って、漢字を書く力を付ける。","ドラマの会話を書き起こして、話し言葉の表現を学習する。","モデル会話を覚えて、職場で休暇の許可を得るロールプレイをする。","テレビのニュース番組を見て、映像を手掛かりに内容を理解する。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"真正性(オーセンティシティ)の高い活動とは、実際の言語使用場面にできるだけ近い、加工されていない生の素材や状況を用いる活動です。実際のニュース映像をそのまま用いて理解する活動は、この真正性を体現する例として最も適当です。"},

{id:"R5-16-28", tag:"R5 試験III 問題6 問3", cat:"誤用分析:日中同形語",
 text:"問3 <資料>の下線部C「日中同形語」が原因で生じる誤りの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「退学」の発音を「だいがく」と聞き取ってしまう。","「質問がある」と言うところを「問題がある」と言ってしまう。","「一人」の読み方を「いちにん」と読んでしまう。","「効」という字を「効」と書いてしまう。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"中国語の「问题」は「質問」の意味でも使われるため、中国語話者が日本語の「問題」を「質問」の意味で誤用してしまうことがあります。これは、日中で同じ漢字を使うが意味がずれている「日中同形語」に由来する典型的な誤りです。"},

{id:"R5-16-29", tag:"R5 試験III 問題6 問4", cat:"教授法:帰納的アプローチの長所",
 text:"問4 <資料>の下線部D「帰納的アプローチ」を用いた授業の長所として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者自身が文法規則を発見するプロセスを経験するため、文法が定着しやすい。","学習者自身が分析的に文法を理解できるので、モチベーションが高められる。","教師が授業で文法説明にかける時間が短く済むため、運用練習に時間を使える。","教師が授業前に用意するのは文法の説明方法だけなので、授業準備の負担が少ない。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"帰納的アプローチは、豊富な用例に触れながら学習者自身がその背後にある規則を発見していく方法であり、自ら発見したという経験を経ることで規則が記憶に定着しやすくなる点が長所とされます。"},

{id:"R5-16-30", tag:"R5 試験III 問題6 問5", cat:"授業設計:社会と接点を持つ目標設定",
 text:"問5 文章中の下線部E「社会と接点を持てるような具体的な課題」を取り入れた目標設定として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["中国のお勧めの観光地について、国際交流団体の冊子に紹介文を書くことができる。","中国の有名な観光地について、新聞記事を探して要約文を書くことができる。","中国の観光地における問題について、大学の旅行サークルのSNSで発信することができる。","中国の観光地の注意点について、初めて中国旅行を予定している友人に話すことができる。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「新聞記事を探して要約文を書く」という課題は、実際の読み手を想定した社会的なやり取りではなく、記事内容をまとめるだけの学習者内で完結する読解・要約練習にとどまるため、他の選択肢のような実社会との接点を持つ具体的な課題としては不適当です。"},

/* ========= データ (令和5年度 試験III 問題7) ========= */
{id:"R5-16-31", tag:"R5 試験III 問題7 問1", cat:"授業活動:母語話者インタビューの利点",
 text:"国内の大学の中上級レベルのクラスにおいて、インタビュー活動を取り入れた授業を実施した。次の資料を読み、後の問い(問1〜5)に答えよ。<資料>は授業の概要である。\n\n<資料> 授業の概要\n学習者:中上級レベルの留学生12名\n授業時間:90分×4コマ\n目的:日本人学生へのインタビューを通し、日本における就職活動の概要と、それに対する学生の意識を知る。\n授業の構成\n第1回:①日本の就職活動について、知っていることを学習者同士で話す。②4グループに分かれ、就職情報サイトを見て情報を得る。③インタビュー活動の目的と実施方法についての説明を聞く。④グループで日本人学生に質問したい内容を考える。\n第2回:①インタビューの際の留意点を学ぶ。②アポイントメントの取り方(口頭・メール)を学ぶ。③インタビューの練習をする。【宿題】各自、日本人学生にインタビューを実施する。\n第3回:①それぞれが行ったインタビューの結果を持ち寄り、グループで結果をまとめる。②発表の構成を考え、発表原稿と配付資料を作成する。\n第4回:①インタビューの結果をグループごとに発表し、質疑応答を行う。②自分たちの活動や発表について内省し、振り返りシートに記入する。\n\n問1 <資料>の下線部A「日本人学生へのインタビュー」のように、教師以外の母語話者と接触する活動の利点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["母語話者が学習者のレベルに合わせて日本語を調整し、やり取りをしてくれるため、日本語が身に付きやすい。","母語話者が話したいことと学習者が聞きたいことが一致しやすいため、学習者にとって意義のある情報が得られる。","学習者が持っている日本語に関する疑問を母語話者に質問し、文法構造や使用上のルールなどの解説を受けることができる。","学習者が母語話者の多様な背景や日本語使用に触れることで、社会文化能力を強化することができる。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"教師以外の一般の母語話者と接触することで、教科書的ではない多様な背景を持つ人々の生きた日本語使用や価値観に触れることができ、これは社会文化的な能力を高めることにつながる大きな利点です。"},

{id:"R5-16-32", tag:"R5 試験III 問題7 問2", cat:"授業活動:インタビューの留意点",
 text:"問2 <資料>の下線部B「インタビューの際の留意点」として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["最初にオープン・クエスチョンで考えを聞き、その答えを基にクローズド・クエスチョンで詳しく聞く。","インタビュー相手が同年代の友人でもくだけた話し方はせず、緊張感を保つ。","インタビューがスムーズな流れになるよう、質問の配列をよく検討しておく。","相手の回答が質問から外れた場合も、テーマに引き戻さず自由に話させる。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"インタビューを円滑に進めるためには、話の流れが自然になるよう、あらかじめ質問の順序や配列を検討しておくことが重要な留意点です。相手との関係性に応じた話し方の調整や、話がそれた際に適宜テーマに戻すことも実際には必要になるため、他の記述はそのまま留意点として適当とは言えません。"},

{id:"R5-16-33", tag:"R5 試験III 問題7 問3", cat:"語用論:依頼メールの誤用",
 text:"問3 <資料>の下線部C「アポイントメント」を取るメールで、相手への配慮の観点から問題となる語用論的な誤りの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["インタビューを答えてくださったら、とてもありがたいです。","就職活動に対するインタビューをお願いいたします。","ぜひ、インタビューをやらせていただけませんか。","ご都合の良い日を〇〇さんが決めてもいいです。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"「〇〇さんが決めてもいいです」という表現は、本来お願いする立場である自分が相手に許可を与えるような言い方になってしまっており、依頼の相手に対して失礼な印象を与える語用論的な誤りです。"},

{id:"R5-16-34", tag:"R5 試験III 問題7 問4", cat:"資料作成:配付資料の留意点",
 text:"問4 <資料>の下線部D「配付資料を作成する」際の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["パソコンで作成する際は、章ごとにフォントを変えるなど、フォントの種類を多くして分かりやすくする。","数値データは読み手の認知的な負担が大きいため、グラフを使用して視覚的に分かりやすくする。","使用する用語にバリエーションがある場合、配付資料と発表で用語を別々にして複数の用語を使う。","聞き手が理解しやすいように、発表では結論を最後に説明するが、配付資料では冒頭に記載する。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"数値データはそのまま羅列すると読み手の負担が大きいため、グラフ化して視覚的に分かりやすく示すことが望ましい留意点です。フォントの多用や用語の不統一はかえって分かりにくくなり、結論の提示位置を発表と資料でわざと変える必要性も特にないため、他の記述は不適当です。"},

{id:"R5-16-35", tag:"R5 試験III 問題7 問5", cat:"評価法:振り返りシートの利点",
 text:"問5 文章中の下線部E「振り返りシート」を用いた学習者参加型評価の利点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者のインタビュー活動の数値的評価が容易にでき、教師は評価の目的である学習者の序列化がしやすくなる。","学習者は自分自身の活動を振り返るので、自己評価の経験がなくてもすぐに対応できるようになる。","学習者が自らインタビュー活動の自己評価をするため、教師は学習者の人数が多くても短時間で評価できる。","学習者はどのようにインタビュー活動に関わったのかを振り返ることで、自身の変化に気づき学びを促進できる。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"振り返りシートを用いた自己評価の主な利点は、学習者自身が自分の活動プロセスや変化に気づき、そこから新たな学びを得られる(メタ認知を促す)ことにあります。序列化や教師の評価負担軽減、自己評価の即時習熟を目的とするものではないため、他の記述は不適当です。"},

/* ========= データ (令和5年度 試験III 問題8) ========= */
{id:"R5-16-36", tag:"R5 試験III 問題8 問1", cat:"アカデミック・ライティング:先行研究の扱い",
 text:"国内の大学の学部留学生を対象に行った、レポート作成の授業に関する次の資料を読み、後の問い(問1〜5)に答えよ。<資料>は授業の概要である。\n\n<資料> 授業の概要\n対象(レベル):学部留学生1〜3年生(上級)\n時間数:100分×14回\n内容:関心のあるテーマについて調査活動を行い、その結果をレポートにまとめる。\n目的:大学生活に必要なアカデミック・ライティングのスキルを身に付ける。\n\n(活動の流れ)\n第1回 事前指導:レポートの構成や書くプロセスを理解する。/書く目的と読み手について考える。\n第2回〜第5回 調査の準備:テーマ案の設定/テーマに関する資料や文献の収集/テーマの決定/リサーチ・クエスチョンと主張の設定/研究計画の作成/インタビュー調査・アンケート調査の質問紙の作成/被調査者への依頼文の作成\n第6回〜第9回 調査活動・個別指導・結果分析:データの収集/結果の集計と分析\n第10回〜第13回 書く活動:アウトラインの検討をピア・レスポンスで行う。/パラグラフ・ライティングの練習/レポート本文の作成、ピアで推敲/表現と形式の点検/レポートのタイトルの確認\n第14回 事後活動:レポート内容の発表準備/レポート内容の発表/自己評価シートへの記入\n\n問1 <資料>の下線部A「テーマに関する資料や文献」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["先行研究を複数見ることは、過去の研究と自分の研究の違いを明確にし、レポート作成の際の理論的裏付けに役立つ。","少人数を対象としたアンケート結果でも量的データは一般化して解釈できるため、実証的根拠となる。","インターネット上の情報は即時性に優れているが、アクセスした日によって情報が変わるため使用しない。","資料の種類や内容に一貫性を保つため、検索は一つの検索ツールを用い、複数の検索方法は使用しない。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"先行研究を複数調べることで、既存の研究との違い(自分の研究の独自性)を明確にし、自らの主張の理論的な裏付けを得ることができます。少人数調査の量的データの安易な一般化、ウェブ情報の一律排除、検索方法を一つに限定することは、いずれも適切な文献収集の姿勢とは言えません。"},

{id:"R5-16-37", tag:"R5 試験III 問題8 問2", cat:"アカデミック・ライティング:リサーチ・クエスチョン",
 text:"問2 <資料>の下線部B「リサーチ・クエスチョン」に関して、ある学習者が「なぜ若者は政治参加に消極的なのか」という問いを立てた。この問いについて教師が与えるアドバイスとして不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「若者は政治参加に消極的である」が前提となった問いであるため、前提を含まない問いにするとよい。","「なぜ」で問う質問は答えが導き出せないため、二者択一など答えが導き出せる問いを立てるとよい。","「政治参加」がどのような事柄を指しているか曖昧であるため、選挙への参加率等、事柄を明確にするとよい。","「若者」が示す対象範囲が広いため、「日本の大学生」等、与えられた時間内に調査できる対象に絞るとよい。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「なぜ」で問う問い自体は、原因や理由を探る立派なリサーチ・クエスチョンになり得るものであり、答えが導き出せないというのは誤った前提です。むしろ前提の妥当性の検証、用語の明確化、対象範囲の絞り込みこそが有効なアドバイスであるため、「なぜ」を避けて二者択一にすべきだという助言が不適当です。"},

{id:"R5-16-38", tag:"R5 試験III 問題8 問3", cat:"ピア・レスポンス:アウトライン検討の留意点",
 text:"問3 <資料>の下線部Cの際の指導上の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["書き手側に、文章の内容について詳しく説明することは避けるよう指導する。","書き手側に、今抱えている問題点や意見が欲しい部分を示すよう指導する。","読み手側に、文章構造に関する具体的な改善案の提案は避けるよう指導する。","読み手側に、自分の感想や意見ではなく一般的な見解を述べるよう指導する。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"アウトラインの段階でのピア・レスポンスでは、まだ細部が固まっていないため、読み手には個人的な感想よりも、全体の構成や論理展開が一般的に見て分かりやすいかどうかという視点からの意見を述べるよう促すことが有効な指導上の留意点です。"},

{id:"R5-16-39", tag:"R5 試験III 問題8 問4", cat:"アカデミック・ライティング:引用の留意点",
 text:"問4 <資料>の下線部D「レポート本文の作成」に関して、文献を引用する際の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["誤字や脱字がある文を直接引用する場合は、誤字や脱字は直さず「(ママ)」と書いてそのまま引用するのがよい。","文献内で引用されている文章は信頼できるので、元の資料を調べることなく直接引用するのがよい。","同じようなことを繰り返して述べている文は重要なので、間接引用する場合も繰り返しを省略しないほうがよい。","間接引用する場合は、引用の後にその情報から何が言いたいか等、自分の解釈は示さないほうがよい。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"原文に誤字・脱字がある場合、直接引用ではそれを勝手に修正せず、誤りをそのまま残して「(ママ)」と注記するのが学術的な引用の基本ルールです。孫引きの容認、間接引用での繰り返しの温存、自分の解釈を示さないことは、いずれも適切な引用の留意点とは言えません。"},

{id:"R5-16-40", tag:"R5 試験III 問題8 問5", cat:"アカデミック・ライティング:レポートのタイトル",
 text:"問5 <資料>の下線部E「レポートのタイトル」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["タイトルが長くなる場合は、主題と副題に分ける。","本文の内容が容易に想像できるよう、分かりやすい表現を選ぶ。","同じようなテーマのレポートと差別化するために、独自性を強調する。","多様な読み手の関心を引くために、専門用語を積極的に取り入れる。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"専門用語を多用したタイトルは、その分野に詳しくない多様な読み手にとってはむしろ理解の妨げとなり、関心を引く効果も期待しにくいため、不適当な記述です。長いタイトルの主題・副題分割、分かりやすさ、独自性の強調は、いずれも適切なタイトル作成上の配慮です。"},

/* ========= データ (令和5年度 試験III 問題9) ========= */
{id:"R5-16-41", tag:"R5 試験III 問題9 問1", cat:"多文化共生:在留外国人統計",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n近年、グローバル化により人や情報が国境を越えて移動している。法務省の在留外国人統計からは、日本国内でも外国人住民の出身国・地域の多様化が進んでいることが分かる。そのため、日本語教師は多様な学習者に対する心理的援助の方法を把握しておく必要がある。学習者を支援するうえでストレス理論は重要な概念であり、ストレスの低減には、ソーシャルサポートにおける道具的サポートと情緒的サポートに関する知識が有用である。また、学習者との関係調整のために、現象学の概念であるエポケーを用いることも有効である。\n学習者の支援には、これらの知識を身に付けたうえで、異文化間対人関係を構築する経験を十分に持つことが重要である。\n\n問1 文章中の下線部A「在留外国人」に関して、2022年末現在における日本国内の在留外国人の状況として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["在留外国人数は国・地域別に見ると、中国が最も多く、韓国、ブラジルと続く。","在留外国人数は過去最高で、上位3か国・地域は過去3年間変化していない。","上位10か国・地域の在留外国人数は、2021年末時点と比べ減少している。","上位10か国・地域のうち、前年からの増加率が最も高いのは台湾である。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"2022年末時点の在留外国人数は過去最高を更新しており、中国・ベトナム・韓国が上位3か国・地域として近年変化なく続いています。"},

{id:"R5-16-42", tag:"R5 試験III 問題9 問2", cat:"学習者支援:心理的援助の限界",
 text:"問2 文章中の下線部B「心理的援助」を日本語教師が行ううえで考慮すべきこととして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本語力が不十分な学習者の考えを理解するために、学習者が言おうとしていることを先回りして解釈する。","授業での教育に専念するために、学習者の相談を聞くことは精神科医やカウンセラーなどの専門家に委ねる。","授業の運営や改善に役立てるために、学習者から個人的に相談された内容や情報を教員間で広く共有する。","悩みを抱える学習者を必要に応じて専門家につなぐために、学習者の問題に関われる限界を把握する。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"日本語教師は専門のカウンセラーではないため、自身がどこまで学習者の問題に関われるかという限界をわきまえ、必要な場合には適切に専門家へつなぐことが重要な心構えです。学習者の発言の先回り解釈、相談内容の安易な共有、相談を一律に専門家任せにすることは、いずれも適切な対応とは言えません。"},

{id:"R5-16-43", tag:"R5 試験III 問題9 問3", cat:"ソーシャルサポート:情緒的サポート",
 text:"問3 文章中の下線部C「情緒的サポート」に関して、ストレスに苦しむ学習者へのサポートとして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者の言動に対し、励ますようなフィードバックや評価を行う。","学習者の問題解決に適した信頼できる人材を紹介する。","学習者に物的リソースに関する詳細な情報を与える。","学習者に経済的な援助を行うなど、直接、問題に介入する。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"情緒的サポートとは、共感や励まし、受容的な態度によって相手の気持ちに寄り添う支援を指します。人材の紹介や情報提供、経済的援助といった具体的な資源の提供は、道具的サポートに分類されます。"},

{id:"R5-16-44", tag:"R5 試験III 問題9 問4", cat:"現象学:エポケーの実践",
 text:"問4 文章中の下線部D「エポケー」の例として、次の(ア)に入れるのに最も適当なものを、下の1〜4の中から一つ選べ。\n\nソン:楽しみにしていたプリンを食べようと思ったら、冷蔵庫になかったんです。それで、ルームメートのリーさんに聞いたら「食べた。」って言うんです。本当に悲しかったです。\n教師:(ア)",
 choices:["それはひどいですね。確かに勝手に食べられたりしたら気分が良くないですよね。","リーさんには悲しかったと直接言ったほうがいいと思いますけど、どうですか。","そうそう、そういう非常識な人っていますよね。本当に困ってしまいますね。","楽しみにしていたプリンをリーさんに食べられて悲しかったということでしょうか。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"エポケー(判断中止)とは、自分の価値判断や先入観を一旦保留し、相手の語ったことをそのまま受け止めて理解しようとする態度です。「〜ということでしょうか」と学習者の発言を評価せずに確認・反射する応答は、この態度を実践する例として最も適当です。他の選択肢は、教師が「ひどい」「非常識」などと評価を下したり、助言をしたりしており、判断を保留していません。"},

{id:"R5-16-45", tag:"R5 試験III 問題9 問5", cat:"異文化間対人関係:構築の留意点",
 text:"問5 文章中の下線部E「異文化間対人関係を構築する」際の留意点として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["自文化の人との関係では経験できないプラスの面があることを理解する。","人は成長していく過程で自文化を取り入れていることを自覚する。","自文化よりも相手の文化の視点を重視し、相手の文化を取り入れる。","自文化と相手の文化との違いを自覚し、理解し合おうと努力する。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"異文化間の対人関係構築では、自文化・相手文化のどちらか一方に偏るのではなく、互いの違いを自覚した上で対等に理解し合おうとする姿勢が重要です。「自文化よりも相手の文化を重視する」という一方的な姿勢は、対等な相互理解とは異なるため不適当です。"},

/* ========= データ (令和5年度 試験III 問題10) ========= */
{id:"R5-16-46", tag:"R5 試験III 問題10 問1", cat:"学習ストラテジー:類型と例",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n教師は第二言語学習における学習者の特性を考慮する必要がある。第二言語学習に影響を与える要因に、学習ストラテジーがある。また、学習スタイルも学習に影響を与える。物事の認知に関わる学習スタイルとして、1970年代から30年ほど盛んに研究されていたものに「場独立型」「場依存型」の区分があり、ほかに「総合型」「分析型」という分類もあり、知覚に関しては「視覚型」「聴覚型」「運動型」「触覚型」という分類がある。\n教師は学習者に対して、学習スタイルを広げていくよう働きかける機会を設けるとよい。同時に、学習ストラテジーを意識させることも重要である。\n\n問1 文章中の下線部A「学習ストラテジー」の類型とその例の最も適当な組合せを、次の1〜4の中から一つ選べ。",
 choices:["認知ストラテジー ― 複数の例文から文法の活用形の規則を類推する。","メタ認知ストラテジー ― イメージや音を結び付けて語呂合わせを考える。","社会的ストラテジー ― 分からない単語を近い意味の言葉で代用する。","情意ストラテジー ― ネイティブの会話パートナーを探して勉強する。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"認知ストラテジーは、情報を分析・変換・類推するなど、学習内容そのものを直接処理するストラテジーです。複数の例文から規則を類推する行動はこれに当たります。語呂合わせは記憶ストラテジー、単語の言い換えは補償ストラテジー、会話パートナーを探すことは社会的ストラテジーに分類されるため、他の組合せは不適当です。"},

{id:"R5-16-47", tag:"R5 試験III 問題10 問2", cat:"学習スタイル:場独立型",
 text:"問2 文章中の下線部B「場独立型」の学習者が得意とされることとして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["自分から積極的に話しかけること","文章や会話の概要を把握すること","口頭能力のパフォーマンステスト","活用規則などの文法の筆記テスト"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"場独立型の学習者は、全体の文脈から個々の要素を分析的に切り離して捉えることを得意とするため、文法規則を分析する筆記テストのような分析的な課題を得意とします。全体的な概要把握や対人的なコミュニケーションは、対照的な場依存型の学習者が得意とする傾向があります。"},

{id:"R5-16-48", tag:"R5 試験III 問題10 問3", cat:"学習スタイル:総合型",
 text:"問3 文章中の下線部C「総合型」の学習者が好む学習活動の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習言語で書かれた文章の母語への翻訳","学習言語で書かれた詩や俳句の暗唱","短文の空欄を補充するプリント学習","複数の絵から物語を創作するタスク"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"総合型(グローバル型)の学習者は、全体的・直感的に物事を捉えることを好み、創造性を発揮できる活動を好む傾向があります。複数の絵から自由に物語を創作するタスクはこれに当たります。翻訳や空欄補充、暗唱は、部分に着目する分析型の学習者が好む傾向のある活動です。"},

{id:"R5-16-49", tag:"R5 試験III 問題10 問4", cat:"学習スタイル:スタイルを広げる働きかけ",
 text:"問4 文章中の下線部Dの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["視覚型の学習者に、劇に参加してせりふのある役を演じるよう働きかける。","聴覚型の学習者に、交流会で初対面の人たちと会話するよう働きかける。","運動型の学習者に、グループで街頭インタビューをするよう働きかける。","触覚型の学習者に、料理を作りながら道具の名前を覚えるよう働きかける。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"学習スタイルを広げる働きかけとは、学習者が普段得意としない知覚型のタスクにあえて挑戦させることを指します。視覚優位の学習者に、せりふを覚え声に出して演じる(聴覚・運動的要素の強い)劇活動を促すことはこの例として最も適当です。他の選択肢は、いずれもその学習者が元々得意とする知覚型に合った活動になっています。"},

{id:"R5-16-50", tag:"R5 試験III 問題10 問5", cat:"学習ストラテジー:意識化の重要性",
 text:"問5 文章中の下線部E「学習ストラテジーを意識させること」が重要である理由として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["注意や記憶などの認知資源の容量を拡張させる手段を獲得する必要があるため","自律的に学習に取り組み、多様な学習方法を選択できるようになる必要があるため","教師の働きかけによって他者と協働的に外国語を学ばせることは困難であるため","学んだ外国語の数が増えるにつれて、学習をモニターすることが困難になるため"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"学習ストラテジーを意識化させる主な目的は、学習者が自分に合った学習方法を自覚的に選択し、教師に頼らず自律的に学習を進められるようになることにあります。"},

/* ========= データ (令和5年度 試験III 問題11) ========= */
{id:"R5-16-51", tag:"R5 試験III 問題11 問1", cat:"心理言語学:インプット",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n言語処理は一定のプロセスをたどる。まず言語理解の際に、インプットによって単語を認識する。その後、メンタル・レキシコン(心的辞書)から文脈に合う単語の意味を同定し、文法的な解析を経てメッセージを解読する。\nメンタル・レキシコンの項目は、ネットワーク構造となっていると考えられている。このネットワーク構造の存在を説明する際の根拠としてプライミング効果がある。\n第二言語を学んでいる場合は、第一言語と第二言語の二つのメンタル・レキシコンがあるとされている。単語を第二言語のメンタル・レキシコンから呼び出し、構文を組み立てていくというプロセスがスムーズに進められるような練習も必要である。\n\n問1 文章中の下線部A「インプット」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者がインターアクションを通じて気づいたことを示す反応","学習者が言語形式に目を向けて記憶に取り込んだデータ","学習者に対して向けられた音声や記述を含めた言語情報","学習者によって新たな情報が既知情報に統合されるプロセス"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"インプットとは、学習者に向けて与えられる音声や文字による言語情報そのものを指します。学習者が実際に気づいたり取り込んだりした結果(インテイク)や、統合のプロセス自体とは区別される概念であるため、他の記述は不適当です。"},

{id:"R5-16-52", tag:"R5 試験III 問題11 問2", cat:"心理言語学:メンタル・レキシコン",
 text:"問2 文章中の下線部B「メンタル・レキシコン」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["内容は固定的ではなく、既にある情報の変更や新しい情報の蓄積がなされる。","意味に関する情報と言語形式に関する情報とが、区別されずに蓄積されている。","形態、意味、統語の情報が蓄積されており、音韻に関する情報は含まれない。","蓄積されている情報は概略的であり、一般的な辞書のように細かいものではない。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"メンタル・レキシコンは固定された静的なものではなく、新しい語彙の獲得や既存情報の更新によって常に変化し続ける動的なシステムであるとされます。意味情報と形式情報は区別して蓄積され、音韻情報も含まれ、内容も一般の辞書に劣らず詳細であるとされるため、他の記述は不適当です。"},

{id:"R5-16-53", tag:"R5 試験III 問題11 問3", cat:"心理言語学:語彙のネットワーク構造",
 text:"問3 文章中の下線部C「ネットワーク構造」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「ピンポン」と「卓球」のように、同じ意味を持つ単語同士が結び付いている。","「ペン」と「鉛筆」のように、お互いに関連する単語同士が結び付いている。","「朝」と「足」のように、五十音の順に基づいて単語同士が結び付いている。","「好き」と「嫌い」のように、反対の意味を持つ単語同士が結び付いている。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"メンタル・レキシコンのネットワーク構造は、意味的な類似性・連想関係・対義関係などの意味的なつながりに基づいて形成されるとされ、五十音順のような表記上・形式上の並びに基づく結び付きではありません。"},

{id:"R5-16-54", tag:"R5 試験III 問題11 問4", cat:"心理言語学:プライミング効果",
 text:"問4 文章中の下線部D「プライミング効果」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["関連のある語が先に与えられることで、その後の言語理解における処理が早くなる。","先に提示された文章に含まれる個々の言語形式を分析することで、習得が進む。","先に習得している母語の知識によって、新しく身に付ける言語の習得が進む。","読んだ部分の先の内容を予測することによって、文章の内容が把握しやすくなる。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"プライミング効果とは、先行して提示された関連語(プライム)が、後続の関連する語の処理速度を速める効果のことです。母語の知識の転移や、先の内容の予測とは異なる現象であるため、他の記述は不適当です。"},

{id:"R5-16-55", tag:"R5 試験III 問題11 問5", cat:"バイリンガリズム:二つのメンタル・レキシコン",
 text:"問5 文章中の下線部E「第一言語と第二言語の二つのメンタル・レキシコン」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["どちらの言語の場合においても、概念よりも語彙のほうが多いと言われている。","書字等の形式に関する知識は、二つの言語の間で共有されていると言われている。","第二言語の場合、言語処理と言語学習は同時に起こらないと言われている。","第二言語の場合、語彙と概念の結び付きの強さは習熟度によると言われている。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"第二言語学習における語彙と概念(意味)の結び付きの強さは、学習者の習熟度が上がるにつれて第一言語に近い強さへと発達していくと考えられています(改訂階層モデル等)。"},

/* ========= データ (令和5年度 試験III 問題12) ========= */
{id:"R5-16-56", tag:"R5 試験III 問題12 問1", cat:"文字・表記:漢字の字訓",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語の文字種は多様で、その由来や時代による使われ方に違いが見られる。文字種の中でも、漢字は様々な語に用いられ、読み方も複雑である。仮名については「現代仮名遣い」や「送り仮名の付け方」の基準が公表されている。\n文章には、書き言葉としての特徴があり、文化的背景が反映される。例えば、手紙には会話と異なる表現が見られる。また、意味範囲が限定的で比喩的な使われ方をする定型表現もある。作文を指導する際は、指示詞の用法にも留意する必要がある。\n\n問1 文章中の下線部Aに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["漢字の字音は、和語と漢語に用いられ、外来語には用いられない。","漢字の字音は、中国由来の漢語に用いられるが、和製漢語には用いられない。","漢字の字訓は、一つの漢字に複数の読みが当てられるものがある。","漢字の字訓は、漢字の意味を表し、一つの和語に一つの漢字が当てられる。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"漢字の字訓(訓読み)には、「生」を「いきる・うまれる・はえる」など、一つの漢字に複数の訓が当てられるものが多くあります。字音は和製漢語にも用いられ、一つの和語に複数の漢字(字訓)が当てられることもあるため、他の記述は不適当です。"},

{id:"R5-16-57", tag:"R5 試験III 問題12 問2", cat:"表記法:現代仮名遣いと送り仮名",
 text:"問2 文章中の下線部B「「現代仮名遣い」や「送り仮名の付け方」」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「現代仮名遣い」では、表記の特例の中に歴史的仮名遣いの痕跡が残されている。","「現代仮名遣い」は、科学技術分野の語彙の表記を整えるために定められた。","「送り仮名の付け方」は、語の表記にゆれが生じないように統一されている。","「送り仮名の付け方」は、公用文が横書きになった際の正書法として公表された。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"「現代仮名遣い」は原則として発音に基づく表記ですが、助詞の「は」「へ」「を」のように、歴史的仮名遣いの名残が特例として残されています。科学技術用語の整備や公用文横書き化への対応が制定目的ではなく、送り仮名の付け方にも一定のゆれが許容されているため、他の記述は不適当です。"},

{id:"R5-16-58", tag:"R5 試験III 問題12 問3", cat:"文体論:手紙の書き言葉的特徴",
 text:"問3 文章中の下線部Cの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["接頭辞によって改まった表現にする。","係り結びによって表現の調子を整える。","卓立によって気持ちを伝える。","頭語によって丁寧さを示す。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"手紙文には「拝啓」のような頭語を用いて丁寧さや改まった調子を示す、会話にはない書き言葉特有の慣習があります。係り結びは古典文法の現象、卓立(プロミネンス)は音声的な強調であり、いずれも手紙特有の書き言葉の特徴の例としては適当ではありません。"},

{id:"R5-16-59", tag:"R5 試験III 問題12 問4", cat:"語彙:比喩的な定型表現",
 text:"問4 文章中の下線部D「意味範囲が限定的で比喩的な使われ方をする定型表現」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["合格電報の「サクラサク」","暑中見舞いの「ご自愛ください」","ビジネス文書の「何卒お願い申し上げます」","年賀状の「あけましておめでとうございます」"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"合格電報の「サクラサク」は、本来の花が咲くという意味から離れ、「合格した」という限定的な意味を比喩的に表す特殊な定型表現です。他の選択肢は、いずれも文字通りの意味に近い一般的な丁寧・慣用表現です。"},

{id:"R5-16-60", tag:"R5 試験III 問題12 問5", cat:"文法:指示詞の誤用(前方照応)",
 text:"問5 文章中の下線部E「指示詞の用法」に関して、「前方照応」の用法における誤用例はどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["私は昨年、子どもが生まれた。そこ1年でいろいろな経験をした。","祖父は私にそのように言った。勉強すれば、将来豊かな生活ができる。","私は日本文化にこれほど詳しくない。しかし、友人は何でも知っている。","先月、若手のオペラ歌手が公演した。あの歌手は私の国でも人気がある。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"直前の文で初めて話題に出た事物を指す場合には、通常「その」のようなソ系の前方照応形式を用いますが、「あの歌手」のようにア系を使ってしまうのは誤用です。ア系は本来、話し手と聞き手が既に共有している記憶を指す際に用いられます。"},

/* ========= データ (令和5年度 試験III 問題13) ========= */
{id:"R5-16-61", tag:"R5 試験III 問題13 問1", cat:"会話教育:交渉会話",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n会話教育を行うためには、会話の特徴を知っておくのがよい。会話の種類は、大きく分けて交渉会話と交流会話がある。交流会話である雑談においては、心的距離を近づけるための質問の方法がある。\nまた、話し手と聞き手による共同発話のように、会話に特有の現象も多くある。このほか、話題の終了を示唆する行動もある。\n学習者の口頭表現能力を評価する方法には、OPI(Oral Proficiency Interview)があり、OPIの原理や手法を用いた会話教育も行われている。\n\n問1 文章中の下線部A「交渉会話」の特徴を持つ発話の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["エレベーターで会った隣人に「いい天気ですね。」と天気の話をする。","サークルのメンバーに「明日の交流会は、ラウンジになったよ。」と伝える。","道で会った知り合いに「どちらまで?」と声を掛けて挨拶をする。","パーティーで初めて会った人に「にぎやかなパーティーですね。」と言う。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"交渉会話は、具体的な情報のやり取りや実務的な目的の達成を志向する会話です。「交流会の場所が変更になった」という実務的な情報を伝える発話はこれに当たります。他の選択肢は、いずれも人間関係の維持を目的とする儀礼的な雑談(交流会話)の例です。"},

{id:"R5-16-62", tag:"R5 試験III 問題13 問2", cat:"会話教育:雑談の質問方法",
 text:"問2 文章中の下線部Bの質問の方法として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["自分が知りたいことを一度にまとめて質問する。","以前に盛り上がった話題を避けて新たに別の質問をする。","相手の体験談や意見を引き出すような質問をする。","相手よりも自分のほうが詳しい事柄について質問する。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"雑談で心的距離を縮めるためには、相手自身の経験や考えを話してもらえるような質問を投げかけ、相手に気持ちよく話してもらうことが効果的です。"},

{id:"R5-16-63", tag:"R5 試験III 問題13 問3", cat:"会話分析:共同発話",
 text:"問3 文章中の下線部C「共同発話」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["友人X:日本の夏ってほんと…。\n友人Y:湿気がすごいよね。\n友人X:そうだよね。","社員X:明日の会議、一緒に出ても…。\n社員Y:ああ、どうぞ。\n社員X:では、そうします。","友人X:混んでるから、注文する前に席をちょっと…。\n友人Y:あそこ空いてるよ。\n友人X:じゃあ、取っといて。","教師X:昨日配ったプリントですけど…。\n学生Y:あ、文法のですね。\n教師X:はい、忘れずにやっておいてください。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"共同発話は、一人の話し手が言い終えていない発話を、もう一人の参加者が推測して完成させる現象です。友人Xの「日本の夏ってほんと…」という言いさしを、Yが「湿気がすごいよね」と補って完成させているのはこの典型例です。他の選択肢は、依頼や許可のやり取りであり、発話の共同完成には当たりません。"},

{id:"R5-16-64", tag:"R5 試験III 問題13 問4", cat:"会話分析:話題終了の示唆",
 text:"問4 文章中の下線部D「話題の終了を示唆する行動」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["徐々に声を大きくしていく。","終助詞「よ」を繰り返し用いる。","うなずきながら話すスピードを速くする。","相づちの繰り返しや評価的な発話を増やす。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"「そうですね」「なるほど」といった相づちや評価的な発話が繰り返し増えることは、聞き手がその話題についてまとめに入ろうとしている、あるいは終了させたがっているサインとして働くことが会話分析の研究で指摘されています。"},

{id:"R5-16-65", tag:"R5 試験III 問題13 問5", cat:"評価法:OPIの手法を用いた会話教育",
 text:"問5 文章中の下線部E「OPIの原理や手法を用いた会話教育」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者に達成感を与えるために、ロールプレイを行う。","文型を定着させるためのパターン・プラクティスを行う。","発話能力の上限を把握するためのタスクを行う。","活動目的を理解させるために、ウォームアップを行う。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"OPIでは、学習者にとって次第に難易度の高いタスクを課し、どこまで対応できるか(発話能力の上限、いわゆる「ブレイクダウン」の起きる地点)を探ることで、その学習者の総合的な口頭能力レベルを判定します。この原理を応用した会話教育もこの考え方に基づきます。"},

/* ========= データ (令和5年度 試験III 問題14) ========= */
{id:"R5-16-66", tag:"R5 試験III 問題14 問1", cat:"ジェンダーと言語:性差別的言語",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n言葉には、その社会の価値観やイデオロギーが反映されている。米国におけるフェミニズム運動の高まりの中で生まれた言語とジェンダーの研究は、男性中心主義的な価値観に基づく性差別的な言語(sexist language)を批判し、是正を求めた。こうした言葉の変革はポリティカル・コレクトネス(political correctness)の考え方に依拠している。\n日本語では、現実の言語使用とは必ずしも一致しないが、特定のジェンダーをイメージさせる表現がある。また、特定の人物像をイメージさせる人称詞や文末表現も多い。\n日本語教育でも、教師と学習者のコミュニケーションは、イデオロギーや権力関係から影響を受ける可能性があることに留意すべきである。\n\n問1 文章中の下線部A「性差別的な言語」に関して、性差別的な日本語の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["看護をする男性が一般的でないことを示唆する「看護師」","男性が女性に依存していることを示唆する「保母」","女性が男性よりも優れていることを示唆する「女優」","女性が男性に従属していることを示唆する「主人」"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"「主人」という語は、妻が夫を指す語として、夫を家庭内で優位な立場に置き、妻がそれに従属するという伝統的な価値観を反映した性差別的な表現とされます。「看護師」「女優」は性別を限定しない、あるいは女性形が優劣を示すものではなく、「保母」は女性の職業イメージを示す語であるため、他の記述は不適当です。"},

{id:"R5-16-67", tag:"R5 試験III 問題14 問2", cat:"ポリティカル・コレクトネス:言い換えの例",
 text:"問2 文章中の下線部B「ポリティカル・コレクトネス」に基づいて言い換えた日本語の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「肌色」を「うすだいだい」と言い換える。","「情報格差」を「デジタル・ディバイド」と言い換える。","原子炉の「老朽化」を「高経年化」と言い換える。","短所である「利己的」を「合理的」と言い換える。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"クレヨン等の色名「肌色」は、特定の肌の色を「標準」とみなす偏った価値観につながるとして、より中立的な「うすだいだい」という色の名称に言い換えられました。これはポリティカル・コレクトネスに基づく言い換えの代表例です。他の選択肢は、専門用語への言い換えや婉曲表現であり、差別是正を目的としたものではありません。"},

{id:"R5-16-68", tag:"R5 試験III 問題14 問3", cat:"ジェンダーと言語:ジェンダーをイメージさせる表現",
 text:"問3 文章中の下線部C「特定のジェンダーをイメージさせる表現」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["名詞に直接「か」を付けて発する質問文は、女性をイメージさせる。","イ形容詞の末尾の母音[ai]が[ee]に変化した形は、女性をイメージさせる。","動詞の命令形に「よ」が後接した形式は、男性をイメージさせる。","ナ形容詞の語幹に「ね」が後接した形式は、男性をイメージさせる。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"動詞の命令形にそのまま「よ」を付けた「行けよ」のような形式は、伝統的に男性的な話し方の特徴としてイメージされる表現です。名詞+「か」の疑問文や[ai]→[ee]の変化(例:「すごい」→「すげー」)はむしろ男性的、ナ形容詞語幹+「ね」は特定の性別を強くイメージさせるものではないため、他の記述は不適当です。"},

{id:"R5-16-69", tag:"R5 試験III 問題14 問4", cat:"ジェンダーと言語:役割語",
 text:"問4 文章中の下線部D「特定の人物像をイメージさせる人称詞や文末表現」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["現代では、「書生」が用いる言葉というイメージがあるものに、「〜ますの」や「〜だわ」がある。","現代では、「お嬢様」が用いる言葉というイメージがあるものに、「〜だこと」や「〜ですもの」がある。","現代では、「執事」が用いる言葉というイメージがあるものに、「わし」や「〜じゃ」がある。","現代では、「宮中の女房」が用いる言葉というイメージがあるものに、「あちき」や「〜ありんす」がある。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「〜だこと」「〜ですもの」のような言い回しは、上流階級の女性、いわゆる「お嬢様言葉」として現代のフィクション等で広く用いられる役割語です。「〜ますの」「〜だわ」は一般的な女性語、「わし」「〜じゃ」は老人語、「あちき」「〜ありんす」は遊女語のイメージに結び付くため、他の組合せは不適当です。"},

{id:"R5-16-70", tag:"R5 試験III 問題14 問5", cat:"ジェンダーと言語:教室内の権力関係",
 text:"問5 文章中の下線部E「教師と学習者のコミュニケーション」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["教師が学習者の性別に応じて「君」や「さん」のように異なる敬称を使い分けることは、ジェンダーに関する隠れたカリキュラムを反映している。","グループ学習や協働学習などの学習者中心の授業形態は、教師と学習者の関係性に関する伝統的な価値観を反映している。","教師の質問と学習者の回答を含むIRE/IRFは、両者に発言の機会が平等に与えられているため、対等な力関係を反映している。","男性学習者から同意を求められた女性教師が「うーん…。」と否定的な反応をすることは、ジェンダー間の不平等を反映している。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"教師が学習者の性別によって敬称を無意識に使い分けることは、明示的なカリキュラムには表れない、ジェンダーに関する価値観が教育の場に反映される「隠れたカリキュラム」の一例とされます。学習者中心の授業形態はむしろ伝統的な教師主導の権力関係を見直すもので、IRE/IRFは教師主導で発言機会が対等とは言えず、婉曲な反応を直ちに不平等の表れと断定することもできないため、他の記述は不適当です。"},

/* ========= データ (令和5年度 試験III 問題15) ========= */
{id:"R5-16-71", tag:"R5 試験III 問題15 問1", cat:"日本語教育史:教科書の系譜",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語教育の対象は世情とともに変化してきた。1950年代には東南アジア諸国の技術者を研修生として国内に受け入れる政策が始まり、彼らに対する日本語の教科書『日本語の基礎』が開発された。\nその後、1972年の日中国交正常化を機に中国帰国者に対する公的支援が始まった。また、ベトナム戦争が終結すると1979年にインドシナ難民の受入れが開始され、各地で難民に対する日本語教育が始まった。さらに、1990年に実施された「出入国管理及び難民認定法」の改正を受けて外国人住民が増加すると、地域の日本語教室での外国人住民に対する日本語教育が課題となった。\n2018年に日本政府は「外国人材の受入れ・共生のための総合的対応策」を策定した。さらに2021年には「日本語教育の参照枠」が示され、それを踏まえた教育内容や教育モデルの開発が目指されている。\n\n問1 文章中の下線部A「日本語の教科書『日本語の基礎』」の理念や方針を受け継いで開発された教科書として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["『まるごと 日本のことばと文化』","『標準日本語讀本』","『日本語初歩』","『みんなの日本語』"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"1950年代の海外技術研修員向け教科書『日本語の基礎』の実践的な文型積み上げ方式の理念は、後の『みんなの日本語』などの教科書に受け継がれているとされます。"},

{id:"R5-16-72", tag:"R5 試験III 問題15 問2", cat:"日本語教育政策:難民への日本語教育事業",
 text:"問2 文章中の下線部B「難民」に関して、2020年度時点で文化庁が行っている日本語教育事業に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["難民の定住を支援するために、定住支援施設において日本語教育を実施している。","難民の主な使用言語に翻訳された日本語学習教材を提供している。","難民が永住許可を得るための市民統合日本語テストを実施している。","難民に対して日本語教育相談員による指導・助言を行っている。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"日本には、一部の欧州諸国のような永住許可要件としての「市民統合テスト」制度は存在しないため、この記述は事実と異なり不適当です。定住支援施設での日本語教育、翻訳教材の提供、相談員による支援はいずれも実際に行われている事業です。"},

{id:"R5-16-73", tag:"R5 試験III 問題15 問3", cat:"入管政策史:1990年入管法改正",
 text:"問3 文章中の下線部C「1990年に実施された「出入国管理及び難民認定法」の改正」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["就労に制限のない在留資格として「定住者」が創設された。","高度人材を優遇する在留資格として「高度専門職」が創設された。","就学生の負担を軽減するため、在留資格「留学」と「就学」が統合された。","受入れ企業の需要に対応するため、在留資格「技術」と「人文知識・国際業務」が統合された。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"1990年の入管法改正では、日系人などを対象に就労に制限のない在留資格「定住者」が創設され、これにより日系ブラジル人などの来日・就労が大きく増加しました。「高度専門職」は2015年、「留学」と「就学」の統合は2010年、「技術」と「人文知識・国際業務」の統合は2015年の制度変更であるため、他の記述は不適当です。"},

{id:"R5-16-74", tag:"R5 試験III 問題15 問4", cat:"日本語教育政策:外国人材受入れ・共生対応策",
 text:"問4 文章中の下線部D「外国人材の受入れ・共生のための総合的対応策」の主たる目的として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["新しい都市間連携を構築し、今後の諸都市における国際化に必要不可欠な外国人住民との地域共生の確立を目指す。","外国人材を適正に受け入れ、共生社会の実現を図ることにより、日本人と外国人が安心して安全に暮らせる社会の実現を目指す。","産業競争力の向上や各国のきずなの強化を基盤として、グローバルな舞台で活躍できる人材の育成を目指す。","日本語教育の推進に関する施策を総合的に推進し、多様な文化を尊重した活力ある共生社会の実現を目指す。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「外国人材の受入れ・共生のための総合的対応策」は、外国人材を適正に受け入れるとともに、日本人と外国人が安心・安全に共生できる社会の実現を目指すことを主たる目的として2018年に策定されました。"},

{id:"R5-16-75", tag:"R5 試験III 問題15 問5", cat:"日本語教育政策:日本語教育の参照枠",
 text:"問5 文章中の下線部E「日本語教育の参照枠」を参照することによって期待される効果として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["周囲の人々が学習者の日本語能力を把握しやすくなり、学習者を支える環境が醸成される。","言語能力記述文の整備により、教育機関ごとに異なっている教育内容や教育方法が統一される。","教育機関同士の連携がしやすくなり、学習者が機関を移動しても学習を継続しやすくなる。","日本語能力の共通の指標が整備されることで、複数ある日本語試験間で判定結果が比較しやすくなる。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"「日本語教育の参照枠」は、共通の到達度の指標を示すことで多様な教育機関の連携や学習の可視化を促すものであり、各機関の教育内容や教育方法そのものを画一的に「統一」することを目的とはしていないため、この記述は不適当です。"},

/* ========= データ (令和5年度 試験III 問題16) ========= */
{id:"R5-16-76", tag:"R5 試験III 問題16 問1", cat:"外国人材受入れ:EPA介護福祉士候補者",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n外国人材の受入れは、近年急速に拡大している。介護分野では、2008年に経済連携協定(EPA)による受入れが開始された。その後、在留資格「介護」の創設や、技能実習制度における介護職種の追加が決まった。さらに、2018年には「特定技能」の在留資格が創設された。在留資格「特定技能」の取得には、国際交流基金日本語基礎テスト(JFT-Basic)等で日本語能力水準を証明することに加えて、特定産業分野ごとの技能試験に合格することなどが義務付けられている。\nまた、円滑な外国人材受入れのためには適正な労働環境を整えていくことが重要であり、2017年には「外国人の技能実習の適正な実施及び技能実習生の保護に関する法律」が施行されるなど法律の整備も進んでいる。\n\n問1 文章中の下線部A「経済連携協定」の枠組みで来日する介護福祉士候補者に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["受入れ施設で就労しながら国家試験の合格を目指した研修に従事する。","出身国の介護福祉士免許を持っていれば、国家試験で科目の一部が免除される。","看護師候補者とは異なり、年間受入れ人数の上限は設定されていない。","国家試験では日本語面での受験上の配慮は行われていない。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"EPAに基づく介護福祉士候補者は、受入れ施設で就労・研修をしながら数年以内の国家試験合格を目指す仕組みで来日します。出身国資格による科目免除は行われておらず、受入れ人数には上限があり、国家試験では漢字にルビを振るなど一定の日本語配慮も行われているため、他の記述は不適当です。"},

{id:"R5-16-77", tag:"R5 試験III 問題16 問2", cat:"外国人材受入れ:技能実習制度",
 text:"問2 文章中の下線部B「技能実習制度」に関して、2022年現在の記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["この制度での受入れ対象は、インドネシア、フィリピン、ベトナムの3か国である。","この制度で働く当該年度の実習生数は、外国人労働者数全体の5割以上を占める。","この制度では、「技能実習1号」修了後に在留資格「特定技能」へ切替えができる。","この制度での外国人受入れの方式には、企業単独型と団体監理型がある。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"技能実習制度における外国人の受入れ方式には、企業が直接受け入れる企業単独型と、監理団体を通じて受け入れる団体監理型の二つがあります。受入れ対象国は3か国に限定されておらず、実習生は外国人労働者全体の一部にとどまり、「特定技能」への移行は原則として技能実習2号を良好に修了した場合に可能となるため、他の記述は不適当です。"},

{id:"R5-16-78", tag:"R5 試験III 問題16 問3", cat:"外国人材受入れ:特定技能制度の目的",
 text:"問3 文章中の下線部C「特定技能」制度の目的として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["高度外国人材を受け入れ、専門的・技術的な労働市場の発展を促進するため","一定の専門性や技能を有する外国人を受け入れ、人手不足の問題に対応するため","日本の技術・知識の移転を図り、相手国の経済発展を担う人づくりに寄与するため","日本と相手国との貿易や人の移動などを自由化し、国際連携を強化するため"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"在留資格「特定技能」は、深刻な人手不足に対応するため、一定の専門性・技能を持つ外国人材を各特定産業分野で受け入れることを目的として2019年に創設された制度です。国際貢献を目的とする技能実習制度や、高度人材向けの在留資格とは目的が異なります。"},

{id:"R5-16-79", tag:"R5 試験III 問題16 問4", cat:"日本語能力試験:JFT-Basic",
 text:"問4 文章中の下線部D「国際交流基金日本語基礎テスト(JFT-Basic)」に関して、テストの構成と判定・評価される日本語力の最も適当な組合せを、次の1〜4の中から一つ選べ。",
 choices:["「聴解」「聴読解」「読解」の3セクションで構成される。 / スコアに応じて6段階で日本語力を評価する。","「聴解」「聴読解」「読解」の3セクションで構成される。 / A2レベル程度の日本語力を持っているかを判定する。","「文字と語彙」「会話と表現」「聴解」「読解」の4セクションで構成される。 / A2レベル程度の日本語力を持っているかを判定する。","「文字と語彙」「会話と表現」「聴解」「読解」の4セクションで構成される。 / スコアに応じて6段階で日本語力を評価する。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"JFT-Basicは「文字と語彙」「会話と表現」「聴解」「読解」の4セクションで構成されるCBT(コンピューター利用)試験で、生活・就労に必要な基礎的な日本語力(CEFRのA2レベル程度)を持っているかどうかを判定する仕組みになっています。"},

{id:"R5-16-80", tag:"R5 試験III 問題16 問5", cat:"労働法制:技能実習法",
 text:"問5 文章中の下線部E「外国人の技能実習の適正な実施及び技能実習生の保護に関する法律」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["技能実習生に対する人権侵害行為等について禁止規定を設け、違反に対する罰則を規定した。","優良な実習実施者等に対して、3年の実習期間を5年に延長することを可能とした。","技能実習生は、入国1年目から労働基準関係法令の適用の対象となることが定められた。","外国人技能実習機構を認可法人として新設し、技能実習計画の認定を行うことが明記された。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"技能実習生は、入国後の講習期間を除き技能実習の実施当初から労働関係法令の適用対象となっており、「1年目から」という特定の年次を条件とする規定として法律に明記されているわけではないため、この記述は不適当です。人権侵害の禁止・罰則、優良実習実施者への期間延長、外国人技能実習機構の新設は、いずれも同法の実際の内容です。"},

/* ========= データ (令和7年度 試験I 問題1) ========= */
{id:"R7-1-1", tag:"R7 試験I 問題1(1)", cat:"音声学:調音点",
 text:"次の(1)〜(15)について、【 】内に示した観点から見て、他と性質の異なるものを、それぞれ1〜5の中から一つずつ選べ。\n\n(1) 【調音点】",
 choices:["[n]","[ŋ]","[s]","[t]","[ɾ]"], answer:1,
 explain:"[n]・[s]・[t]・[ɾ]は、いずれも歯茎(歯茎付近)で調音される歯茎音です。一方[ŋ]は軟口蓋鼻音であり、調音点が軟口蓋である点で他と異なります。"},

{id:"R7-1-2", tag:"R7 試験I 問題1(2)", cat:"音声学:アクセント型",
 choices:["足(あし)","腕(うで)","髪(かみ)","口(くち)","耳(みみ)"], answer:3,
 text:"(2) 【アクセント型】",
 explain:"「足」「腕」「髪」「耳」は、東京方言において同じアクセント型に属しますが、「口」だけは異なるアクセント型(平板型)を持つ点で他と性質が異なります。"},

{id:"R7-1-3", tag:"R7 試験I 問題1(3)", cat:"音声学:母音の無声化",
 text:"(3) 【母音の無声化】",
 choices:["きり(霧)","くさ(草)","しも(霜)","すな(砂)","にわ(庭)"], answer:1,
 explain:"母音の無声化は、狭母音(い・う)が無声子音に挟まれる(または無声子音の後で発話末に来る)ときに起こりやすくなります。「くさ」は[k]と[s]という無声子音に挟まれた[u]が無声化しやすい環境にありますが、他の語は無声化が起こりにくい(前後に有声音がある)環境であるため、性質が異なります。"},

{id:"R7-1-4", tag:"R7 試験I 問題1(4)", cat:"語彙論:造語法",
 text:"(4) 【造語法】",
 choices:["政財界","送受信","乳幼児","文章題","冷暖房"], answer:3,
 explain:"「政財界」は「政界」+「財界」、「送受信」は「送信」+「受信」、「乳幼児」は「乳児」+「幼児」、「冷暖房」は「冷房」+「暖房」のように、共通の要素を持つ二つの語を組み合わせて作られた語(いわゆる相ぶくろ型の語)です。一方「文章題」は、このような二語の組合せによる語ではなく、単純に「文章」+「題」から成る語であるため、造語法の性質が異なります。"},

{id:"R7-1-5", tag:"R7 試験I 問題1(5)", cat:"語彙論:「名詞+をしている」の意味",
 text:"(5) 【「名詞+をしている」の意味】",
 choices:["教師をしている人","医者をしている人","警官をしている人","歌手をしている人","介護をしている人"], answer:4,
 explain:"「教師/医者/警官/歌手をしている人」は、いずれもその職業に就いている人という「身分・職業」を表します。一方「介護をしている人」の「介護」は職業名ではなく行為そのものを指しており、必ずしも職業として介護に従事しているとは限らない点で、他と意味が異なります。"},

{id:"R7-1-6", tag:"R7 試験I 問題1(6)", cat:"語彙論:シネクドキ(提喩)",
 text:"(6) 【シネクドキ(提喩)】",
 choices:["「明日は公園に花見に行く。」の「花」が「桜」を意味する。","「そろそろご飯にする。」の「ご飯」が「食事」を意味する。","「朝から熱がある。」の「熱」が「平熱より高い熱」を意味する。","「おかずに卵焼きを作る。」の「卵」が「鶏卵」を意味する。","「今日は一日中天気だ。」の「天気」が「好天」を意味する。"], answer:1,
 explain:"「花→桜」「熱→平熱より高い熱」「卵→鶏卵」「天気→好天」は、いずれも上位概念の語で下位概念(またはその逆)を表す、類と種の関係に基づくシネクドキ(提喩)の例です。一方「ご飯→食事」は、具体的な食べ物(米飯)がそれを食べる行為・場面全体を指すようになった用法で、類と種の関係というより隣接性に基づく用法(メトニミー的な性質)であり、他と異なります。"},

{id:"R7-1-7", tag:"R7 試験I 問題1(7)", cat:"語彙論:感情・感覚形容詞",
 text:"(7) 【感情・感覚形容詞】",
 choices:["甘い","痛い","悲しい","眠い","欲しい"], answer:0,
 explain:"「痛い」「悲しい」「眠い」「欲しい」は、話し手自身の内的な感覚・感情・欲求を直接表す感情・感覚形容詞で、第三者に使う場合には通常「〜がる」などの形を必要とします。一方「甘い」は対象(食べ物など)の性質を客観的に表す属性形容詞としての用法が中心であり、話者自身の内的状態を直接表す語ではない点で他と異なります。"},

{id:"R7-1-8", tag:"R7 試験I 問題1(8)", cat:"文法:動詞の項の数",
 text:"(8) 【動詞の項の数】",
 choices:["教わる","泊まる","貼る","戻す","渡す"], answer:1,
 explain:"「教わる」(Xが Yに/から Zを教わる)、「貼る」(Xが Yに Zを貼る)、「戻す」(Xが Yを Zに戻す)、「渡す」(Xが Yに Zを渡す)は、いずれも三つの項を取る動詞です。一方「泊まる」は「Xが Yに泊まる」のように二つの項しか取らない動詞であり、項の数が他と異なります。"},

{id:"R7-1-9", tag:"R7 試験I 問題1(9)", cat:"文法:「と」の用法",
 text:"(9) 【「と」の用法】",
 choices:["彼の見解は私と違っているようだ。","このホテルは犬と泊まれるそうだ。","今日の昼食は上司と食べるつもりだ。","父親は弟と散歩に出掛けているはずだ。","旅行は気の合う友人と行きたいものだ。"], answer:0,
 explain:"「犬と泊まれる」「上司と食べる」「弟と散歩に出掛ける」「友人と行きたい」の「と」は、動作を共に行う相手(共同動作の相手)を表します。一方「私と違っている」の「と」は、比較の対象を表しており、共同動作の相手を表す用法とは異なります。"},

{id:"R7-1-10", tag:"R7 試験I 問題1(10)", cat:"文法:「こそ」の用法",
 text:"(10) 【「こそ」の用法】",
 choices:["去年は駄目だったが、今年の夏こそ富士山に登りたい。","彼こそ代表にふさわしいと思ったが、選ばれなかった。","医者は、お金も大切だが健康こそ大切だと言っていた。","あなたではなく、私のほうこそ悪かったと思う。","彼女はメダルこそ逃したが、素晴らしい活躍だった。"], answer:4,
 explain:"1〜4の「こそ」は、取り立てた事柄を強く肯定的に強調する用法です。一方「メダルこそ逃したが」の「こそ」は、後に「が」を伴って「〜こそ〜が、…」という逆接的な譲歩を導く用法であり、他とは構文的な性質が異なります。"},

{id:"R7-1-11", tag:"R7 試験I 問題1(11)", cat:"文法:「から」の用法",
 text:"(11) 【「から」の用法】",
 choices:["海外の協定校から留学生が来た。","台所から魚を焼くにおいがした。","不注意から大事なペンをなくした。","雲間から僅かに光が差してきた。","田舎の母から大きな荷物が届いた。"], answer:2,
 explain:"1・2・4・5の「から」は、人や物、感覚などが移動してくる空間的・具体的な起点を表します。一方「不注意から」の「から」は、出来事の原因・理由を表しており、空間的な起点を表す用法とは異なります。"},

{id:"R7-1-12", tag:"R7 試験I 問題1(12)", cat:"文法:「ている」の意味",
 text:"(12) 【「ている」の意味】",
 choices:["この靴はしゃれている。","この二人は結婚している。","この役は既に決まっている。","この人は眼鏡を掛けている。","この部屋は電気がついている。"], answer:0,
 explain:"「結婚している」「決まっている」「眼鏡を掛けている」「電気がついている」は、いずれもある動作(結婚する・決まる・掛ける・つく)が完了した結果の状態を表す「結果の状態」の用法です。一方「しゃれている」は、対応する動作の完了・結果として捉えにくく、性質・状態そのものを表す用法である点で他と異なります。"},

{id:"R7-1-13", tag:"R7 試験I 問題1(13)", cat:"文法:指定文と措定文",
 text:"(13) 【指定文と措定文】",
 choices:["彼の好物はこの店のカレーだ。","イタリアの首都はローマだ。","彼の父親は会社経営者だ。","今日の発表者は山田さんだ。","アメリカ最大の湖はこの湖だ。"], answer:2,
 explain:"1・2・4・5は、主語と述語を入れ替えても意味が通る(可逆的な)指定文です。一方「彼の父親は会社経営者だ」は、父親の属性・職業を説明する措定文であり、「会社経営者は彼の父親だ」と入れ替えると不自然になる点で、他とは文の性質が異なります。"},

{id:"R7-1-14", tag:"R7 試験I 問題1(14)", cat:"文法:従属節と主節の主語",
 text:"(14) 【従属節と主節の主語】",
 choices:["荷物を持ってあげて、感謝された。","授業中に眠くなって、困った。","教えてくれて、助かった。","初めて雪を見て、びっくりした。","君から連絡をもらって、ほっとした。"], answer:2,
 explain:"1・2・4・5では、前件(従属節)と後件(主節)の主語が同一人物(話し手)です。一方「教えてくれて、助かった」は、前件「教えてくれて」の動作主が相手(くれるの主語)であるのに対し、後件「助かった」の主語は話し手であり、前件と後件の主語が一致しない点で他と異なります。"},

{id:"R7-1-15", tag:"R7 試験I 問題1(15)", cat:"語彙論:親族への呼びかけ語",
 text:"(15) 【自身の親族に対する呼びかけ語】",
 choices:["おじさん","お父さん","お姉ちゃん","おばあちゃん","お孫さん"], answer:4,
 explain:"「おじさん」「お父さん」「お姉ちゃん」「おばあちゃん」は、いずれも自分の親族本人に対して直接呼びかける際にも使うことができる語です。一方「お孫さん」は、他人の孫を指して述べる際に使う語であり、自分の孫本人に対して直接呼びかける語としては通常使われないため、他と異なります。"},

/* ========= データ (令和7年度 試験I 問題2) ========= */
{id:"R7-2-1", tag:"R7 試験I 問題2(1)", cat:"誤用の分析(発音)",
 text:"次の(1)〜(5)における【 】内の下線部は学習者による誤用を示す。これと異なる種類の誤用を、それぞれ1〜4の中から一つずつ選べ。必要に応じて( )内に学習者の意図を示す。\n\n(1) 【「偉大」のつもりが「依頼」と聞こえる。】",
 choices:["「快諾」のつもりが「快楽」と聞こえる。","「小児」のつもりが「勝利」と聞こえる。","「黙読」のつもりが「目録」と聞こえる。","「派手」のつもりが「晴れ」と聞こえる。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"偉大(いだい)→依頼(いらい)、快諾(かいだく)→快楽(かいらく)、黙読(もくどく)→目録(もくろく)は、いずれも語中の「だ行の子音」が「ら行の子音」に置き換わる誤りです。一方「小児(しょうに)→勝利(しょうり)」は「な行の子音」が「ら行の子音」に置き換わる誤りであり、置き換えの元になる子音の種類が異なります。(選択肢の中では、4の「派手(はで)→晴れ(はれ)」も「だ行→ら行」の誤りに見えますが、正答は、置き換えの生じる音節の構造・位置などの観点から2が他と異なるものとして扱われています。)"},

{id:"R7-2-2", tag:"R7 試験I 問題2(2)", cat:"誤用の分析(文法:格助詞)",
 text:"(2) 【私はレポートの間違いを気づいた。】",
 choices:["私は小学生を日本の歴史や地理を教えた。","私は格上の対戦相手を2対1で勝った。","私はミーティングを途中から参加した。","私は会社の新しい方針を強く反対した。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"「気づく」「勝つ」「参加する」「反対する」は、いずれも対象を「に」で示す動詞であり、2〜4は「を」を誤って使ってしまった、同じ種類の格助詞の誤りです。一方「教える」は本来「(相手)に(内容)を教える」という二つの格を取るべき動詞であり、「小学生を」という誤りは、単純な「に→を」の置き換えとは性質が異なります。"},

{id:"R7-2-3", tag:"R7 試験I 問題2(3)", cat:"誤用の分析(語彙:「自分で」の意味)",
 text:"(3) 【日本は安全ですから、夜も自分で外を歩くことができます。】",
 choices:["私は留学生ですから、家族と一緒じゃなくて、自分で住んでいます。","今まで怖くてできませんでしたが、初めて自分で旅行しました。","自分で映画を見たり海に行ったりするのは、少し寂しいです。","人にしてあげた親切はいつか自分で返ってくるものです。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"1〜3の「自分で」は、いずれも「一人で」(誰とも一緒でない)という意味で誤用されています。一方4の「自分で返ってくる」は「一人で」という意味の誤用ではなく、別の意味・用法上の問題であり、誤りの種類が異なります。"},

{id:"R7-2-4", tag:"R7 試験I 問題2(4)", cat:"誤用の分析(文法:連体修飾節の「は」)",
 text:"(4) 【昨日私は見たドラマはとても面白かったです。】",
 choices:["一人一人はできることをすれば環境問題は減っていくでしょう。","友達のお母さんは作ってくれた料理はとてもおいしかったです。","私はいつもどの方法は正しいだろうかと考えます。","私は毎日先生は話す日本語を注意して聞きました。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"元の文、2、4は、いずれも名詞を修飾する節(連体修飾節)の内部で、本来「が」を使うべきところに「は」を誤って使っています。一方3は、間接疑問節(「どの方法が正しいか」)の中で「は」を使った誤りであり、連体修飾節内の誤りとは節の種類が異なります。"},

{id:"R7-2-5", tag:"R7 試験I 問題2(5)", cat:"誤用の分析(文法:「だけ」の用法)",
 text:"(5) 【今500円だけありますから買えません。】",
 choices:["冷蔵庫に卵だけありますから買い物に行かないといけません。","この施設は電子マネーだけ支払えますから忘れてはいけません。","今日はバイトが3人だけいますから掃除までできません。","私は平仮名だけ読めますから新聞は理解できません。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"元の文、1、3、4は、いずれも「少ない数量・限られた能力しかない」ことを理由に、何かが「できない」という帰結を導いています。一方2は、「電子マネーしか使えない」という限定を理由に「忘れてはいけない」という注意・義務を導いており、帰結のタイプ(不可能ではなく、義務・忠告)が他と異なります。"},

/* ========= データ (令和7年度 試験I 問題3) ========= */
{id:"R7-3-1", tag:"R7 試験I 問題3-A(1)", cat:"音声学:モーラの等時性",
 text:"次のA〜Dの文章を読み、(1)〜(20)の問いに答えよ。\n\nA 【リズム】\n日本語ではリズムを担う単位を「モーラ」または「拍」と言う。一つ一つのモーラは大体同じ(ア)であることが特徴となっている。一方、モーラとは異なる音のまとまりの単位に「音節」がある。英語ではリズムを担う単位となっている。日本語でも音節を認めることができるが、英語とは音節のまとまり方が共通している部分もあれば、異なる部分もある。日本語の音節の大半は、1モーラで成り立つ音節と2モーラで成り立つ音節で構成されている。このような英語と日本語の音節の特徴の違いは、例えば、英語の「coat」から、日本語の外来語の「コート」が作られるときの発音の違いとして現れる。\nこのように、言語学としては音のまとまりの単位にはモーラと音節があり、日本語の特徴は、モーラの単位で説明できることが多い。例えば、日本語母語話者は2モーラの単位でリズムを安定させる傾向があり、話し言葉の中にも多く観察される。2モーラは日本語において重要なリズムの単位であり、学習者に早い段階で意識させる必要がある。\n\n(1) 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["口の開きの大きさ","時間の長さ","ストレスの強さ","ピッチの高さ"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"モーラ(拍)は、日本語のリズムを支える等時的な単位であり、一つ一つのモーラがほぼ同じ長さの時間的長さを持つとされます(モーラ等時性)。"},

{id:"R7-3-2", tag:"R7 試験I 問題3-A(2)", cat:"音声学:音節の日英比較",
 text:"(2) 文章中の下線部A「日本語でも音節を認めることができるが、英語とは音節のまとまり方が共通している部分もあれば、異なる部分もある」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["母音の後ろに子音が一つある音節は、日本語にも英語にもある。","1音節で成り立つ単語は、日本語にも英語にも存在しない。","英語には母音の前に子音が三つ並ぶ音節はないが、日本語にはある。","日本語には母音がない音節があるが、英語にはない。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"「パン」のように母音の後ろに撥音などの子音的要素が一つ続く音節は、日本語にも英語(例:cat)にも共通して見られます。1音節語は英語には多く存在し(cat等)、母音の前に子音が三つ並ぶ音節(英語のstr-等)は英語にはあるが日本語にはなく、母音を持たない音節は例外的な場合を除き基本的に存在しないため、他の記述は不適当です。"},

{id:"R7-3-3", tag:"R7 試験I 問題3-A(3)", cat:"音声学:2モーラ音節",
 text:"(3) 文章中の下線部B「2モーラで成り立つ音節」とはどのような音節か。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["自立拍が二つ続く音節","自立拍の後に特殊拍が続く音節","特殊拍が二つ続く音節","特殊拍の後に自立拍が続く音節"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"2モーラで成り立つ音節は、単独で音節を形成できる自立拍(子音+母音など)の後に、単独では音節になれない特殊拍(撥音・促音・長音)が続く構造を持ちます(例:「パン」「がっこう」の下線部)。"},

{id:"R7-3-4", tag:"R7 試験I 問題3-A(4)", cat:"音声学:外来語の音節構造変化",
 text:"(4) 文章中の下線部Cに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["音節末の子音tの後に母音が挿入され、1音節の英語の単語が、開音節2音節から成る外来語になる。","音節末の子音tの前に母音が挿入され、1音節の英語の単語が、開音節2音節から成る外来語になる。","音節末の子音tが削除され、1音節の英語の単語が、開音節と閉音節1音節ずつから成る外来語になる。","音節末の子音tが二つ重なり、1音節の英語の単語が、開音節と閉音節1音節ずつから成る外来語になる。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"英語の「coat」/koʊt/は1音節ですが、日本語では音節末の子音[t]の後に母音が挿入されて「コート」(コ・ート)という、母音で終わる開音節二つから成る語になります。"},

{id:"R7-3-5", tag:"R7 試験I 問題3-A(5)", cat:"音声学:2モーラ発音の傾向",
 text:"(5) 文章中の下線部Dの例として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ホテルの部屋番号を「六〇二四」と言うとき、「二」のところは2モーラで発音する傾向がある。","銀行の口座番号を「一五七三七一九」と言うとき、「五」のところは2モーラで発音する傾向がある。","年齢を「十六、十七、十八」と急いで言うとき、「十七」のところは2モーラで発音する傾向がある。","日付を「二十八、二十九、三十」と急いで言うとき、「二十」のところは2モーラで発音する傾向がある。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"1、2、4の例は、本来1モーラの数字(に・ご・にじゅうの「に」など)を、明瞭に伝えるために2モーラ分の長さに伸ばして発音する現象です。一方「十七」はもともと複数モーラ(じゅう・しち)から成る語であり、同じ現象の例としては性質が異なります。"},

{id:"R7-3-6", tag:"R7 試験I 問題3-B(6)", cat:"文法:動詞のグループ分け",
 text:"B 【活用】\n動詞や形容詞などが、その文法的機能に応じて語形を変えることを活用と言う。\n日本語教育では、動詞を「歩く/思う」などのIグループ、「見る/寝る」などのIIグループ、「する/来る」のIIIグループという三つの活用の型(活用の種類)に分けて扱うことがあり、これらの判別は日本語学習において重要である。IIグループの動詞は「-iる」または「-eる」の語形を持つが、Iグループの動詞の一部も同様の語形を持つなど、辞書形から、全ての動詞の活用の型が完全に判別できるわけではない。IグループとIIグループの動詞であっても全ての動詞が規則的に変化するわけではなく、例外的な活用形を持つ動詞も存在する。例えば、動詞をマス形に変えた場合に例外的な活用形を持つ動詞が見られる。また、英語における動詞「go」の過去形「went」のように、活用形の欠落したところを語源的に異なる語が埋める等のことが日本語にも見られる。\n形容詞は動詞ほど複雑な活用体系を持たない一方、ナ形容詞の語幹は名詞と類似しているため、形態的な区別を把握しておく必要がある。さらに、形容詞の活用は動詞と異なる。これらを初級で導入する際は、丁寧形の肯定文における過去形の位置が述語によって異なるため、注意しなければならない。\n\n(6) 文章中の下線部Aに関して、IグループとIIグループの動詞の組合せのうち最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["Iグループ:要る / IIグループ:散る","Iグループ:寝る / IIグループ:出る","Iグループ:切る / IIグループ:似る","Iグループ:蹴る / IIグループ:減る"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「切る」は「-iる」の語形を持ちながらIグループ(五段活用)の動詞であり、「似る」は同じ「-iる」の語形を持つIIグループ(一段活用)の動詞です。この組合せは、辞書形だけでは活用型を判別できない例として最も適当です。他の選択肢は、いずれかがIグループ・IIグループの組合せとして不適切です(「寝る」「出る」はいずれもIIグループ等)。"},

{id:"R7-3-7", tag:"R7 試験I 問題3-B(7)", cat:"文法:マス形の例外的活用",
 text:"(7) 文章中の下線部B「動詞をマス形に変えた場合に例外的な活用形を持つ動詞」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["おっしゃる","おめにかかる","さしあげる","めしあがる"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"「おっしゃる」は五段活用動詞ですが、マス形は規則通りの「おっしゃります」ではなく「おっしゃいます」という例外的な形になります。他の動詞は規則的にマス形を作ることができます。"},

{id:"R7-3-8", tag:"R7 試験I 問題3-B(8)", cat:"文法:補充形(サプレション)",
 text:"(8) 文章中の下線部Cに関して、日本語における例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「する」の可能形として「できる」を用いる。","「なる」の可能形として「なり得る」を用いる。","「来る」の可能形として「来れる」を用いる。","「食べる」の可能形として「食べられる」を用いる。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"英語のgo/wentのように、規則的な活用形が欠けている部分を、語源的に全く別の語が補う現象を補充形(サプレティブ形)と言います。「する」の可能形に規則的な「せられる」ではなく、別語源の「できる」が使われるのはこの典型例です。「来れる」はいわゆるら抜き言葉、「食べられる」は規則的な可能形であり、補充形の例ではありません。"},

{id:"R7-3-9", tag:"R7 試験I 問題3-B(9)", cat:"文法:ナ形容詞と名詞の相違点",
 text:"(9) 文章中の下線部D「形態的な区別」に関して、ナ形容詞と名詞の相違点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["否定を表す際の語形","名詞を修飾する際の語形","「〜である」という語形を作れるか","テ形を作れるか"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"ナ形容詞は名詞を修飾する際に「きれいな人」のように「な」を伴いますが、名詞は「学生の私」のように「の」を伴う点で、形態的に明確に区別されます。"},

{id:"R7-3-10", tag:"R7 試験I 問題3-B(10)", cat:"文法:丁寧形における過去形の位置",
 text:"(10) 文章中の下線部Eに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["動詞は「丁寧+過去」の順序で現れるが、イ形容詞とナ形容詞は逆になる。","動詞とイ形容詞は「丁寧+過去」の順序で現れるが、ナ形容詞は逆になる。","動詞とナ形容詞は「丁寧+過去」の順序で現れるが、イ形容詞は逆になる。","イ形容詞とナ形容詞は「丁寧+過去」の順序で現れるが、動詞は逆になる。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"動詞「食べました」、ナ形容詞「きれいでした」は、いずれも丁寧形(ます/でし)の後に過去(た)が続く「丁寧+過去」の順序です。一方イ形容詞「高かったです」は、過去形(かった)の後に丁寧形(です)が続く「過去+丁寧」の順序であり、他と語順が逆になります。"},

{id:"R7-3-11", tag:"R7 試験I 問題3-C(11)", cat:"文法:連体詞による名詞修飾",
 text:"C 【名詞修飾】\n名詞修飾には、「面白い人」のような語による修飾と、「私が昨日会った人」のような節による修飾がある。名詞を修飾する語のうち、連体詞や形容詞などは、被修飾名詞の直前に置かれる。また、形容詞の中にはその一語だけで名詞修飾をすることが難しいものがある。「隣の人」のように「の」が介在する名詞修飾成分は、「所有者」「場所」「原因」「内容」など、被修飾名詞に対して様々な意味を表す。\n節による名詞修飾は、名詞修飾成分と被修飾名詞の構造的関係に応じて内の関係と外の関係に分類される。ほかにも、名詞修飾成分が被修飾名詞の範囲を限定する制限的修飾と、被修飾名詞の範囲を限定せず情報を付加するだけの非制限的修飾の区別がある。制限的修飾と非制限的修飾のどちらの解釈になるかは文脈によるところが大きいが、「兵庫県にある姫路城」のように解釈が一方にほぼ定まる場合もある。\n\n(11) 文章中の下線部A「連体詞」が名詞を修飾している例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["大らかな性格","細やかな配慮","単なる間違い","連なる山並み"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「単なる」は活用しない連体詞であり、名詞の前でのみ用いられます。「大らかな」「細やかな」はナ形容詞、「連なる」は動詞の連体形であり、それぞれ活用する語であるため、連体詞の例としては不適当です。"},

{id:"R7-3-12", tag:"R7 試験I 問題3-C(12)", cat:"語彙論:単独での連体修飾が難しい形容詞",
 text:"(12) 文章中の下線部Bの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["多い","高い","長い","広い"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"「多い」は「多い人」のように名詞を直接修飾する形は不自然で、「多くの人」のような形を使うのが一般的です。「高い」「長い」「広い」は、いずれもそのまま名詞を修飾できます。"},

{id:"R7-3-13", tag:"R7 試験I 問題3-C(13)", cat:"語彙論:名詞修飾成分が表す「内容」",
 text:"(13) 文章中の下線部Cに関して、名詞修飾成分が被修飾名詞の「内容」を表す例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["住民の意見","事故の影響","大阪の親戚","仕事の相談"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"「仕事の相談」は、相談する内容が「仕事」であることを表しており、名詞修飾成分が被修飾名詞の内容を示す例です。「住民の意見」は所有者・主体、「事故の影響」は原因、「大阪の親戚」は場所の関係を表しています。"},

{id:"R7-3-14", tag:"R7 試験I 問題3-C(14)", cat:"文法論:内の関係と外の関係",
 text:"(14) 文章中の下線部D「内の関係と外の関係」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["内の関係では被修飾名詞と名詞修飾成分内の述語との格関係を想定できるが、外の関係ではそれができない。","外の関係では被修飾名詞と名詞修飾成分内の述語との格関係を想定できるが、内の関係ではそれができない。","内の関係では被修飾名詞と名詞修飾成分内の主語との主述関係を想定できるが、外の関係ではそれができない。","外の関係では被修飾名詞と名詞修飾成分内の主語との主述関係を想定できるが、内の関係ではそれができない。"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"内の関係とは、被修飾名詞が名詞修飾節内の述語の格成分(ガ格やヲ格など)として位置付けられる関係(例:「私が読んだ本」)を指し、外の関係はそのような格関係を想定できない関係(例:「本を読んだ経験」)を指します。"},

{id:"R7-3-15", tag:"R7 試験I 問題3-C(15)", cat:"語用論:制限的修飾と非制限的修飾",
 text:"(15) 文章中の下線部E「兵庫県にある姫路城」の名詞修飾成分の解釈に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["名詞修飾成分内に固有名詞が使われているため、基本的に制限的修飾になる。","名詞修飾成分内に固有名詞が使われているため、基本的に非制限的修飾になる。","被修飾名詞に固有名詞が使われているため、基本的に制限的修飾になる。","被修飾名詞に固有名詞が使われているため、基本的に非制限的修飾になる。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"「姫路城」はそれ自体で一意に対象を特定できる固有名詞であるため、「兵庫県にある」という修飾は、複数の候補から一つを絞り込む制限的修飾ではなく、対象に関する情報を付け加えるだけの非制限的修飾になります。"},

{id:"R7-3-16", tag:"R7 試験I 問題3-D(16)", cat:"文法論:ヴォイスの対立関係",
 text:"D 【受身】\nある事実をどの立場から捉えるかによって生じる動詞や格の変化がある。これをヴォイスと言う。受身はヴォイスの一つである。\n受身文では対応する能動文との関係を捉えることが重要である。例えば、受身文である「学生が先生から新入生を紹介された。」は、元の能動文から格関係に変化が生じている。また受身文は、一般的に能動文の主語を背景化し、受身文の主語の立場から述べることに特徴がある。能動文の主語に情報的な価値があまりない場合には、能動文の主語が受身文に現れていないことも多い。\n日本語の受身文には、「直接受身文」「間接受身文」「持ち主の受身文」の3種類があると言われている。どの受身文も対応する能動文との関係で捉える必要があるが、間接受身文は能動文との関係が直接受身文と異なっている。\n\n(16) 文章中の下線部A「ヴォイス」の対立関係がある組合せとして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["考える ― 考えさせる","好きだ ― 好きなんだ","作る ― 作っておく","止まる ― 止まるかもしれない"], choiceLabels:["1","2","3","4"], answer:0,
 explain:"「考える(能動)―考えさせる(使役)」は、動作主に対する事態の捉え方が変わるヴォイス(態)の対立関係です。他の選択肢は、モダリティやアスペクトなど、ヴォイスとは異なる文法カテゴリーの違いです。"},

{id:"R7-3-17", tag:"R7 試験I 問題3-D(17)", cat:"文法論:受身文の格関係",
 text:"(17) 文章中の下線部Bに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["能動文における主語が受身文のヲ格名詞になっている。","能動文における主語が受身文のガ格名詞になっている。","能動文におけるヲ格名詞が受身文の主語になっている。","能動文におけるニ格名詞が受身文の主語になっている。"], choiceLabels:["1","2","3","4"], answer:3,
 explain:"対応する能動文「先生が学生に新入生を紹介した」において、「学生」はニ格名詞ですが、受身文「学生が先生から新入生を紹介された」では、その「学生」が主語(ガ格)になっています。"},

{id:"R7-3-18", tag:"R7 試験I 問題3-D(18)", cat:"文法論:能動文主語の背景化",
 text:"(18) 文章中の下線部Cの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["賞状が理事長から優秀者に渡された。","職場のパソコンがウイルスに侵された。","競技場が急ピッチで建設されている。","山の頂が真っ白な雪で覆われている。"], choiceLabels:["1","2","3","4"], answer:2,
 explain:"「競技場が急ピッチで建設されている。」には、建設した主体(建設会社など)が全く示されておらず、情報的な価値が乏しいためその主語が受身文に現れていない例として最も適当です。他の選択肢は、動作主に相当する要素(理事長、ウイルス、雪)が文中に明示されています。"},

{id:"R7-3-19", tag:"R7 試験I 問題3-D(19)", cat:"文法論:持ち主の受身文",
 text:"(19) 文章中の下線部D「持ち主の受身文」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["小学校の隣に図書館が建てられた。","急に友達に肩をたたかれた。","社長は社員から慕われていた。","昨日弟が先生に褒められていた。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"持ち主の受身文は、身体の一部や所有物が動作の対象となり、その持ち主が受身文の主語として現れる文です。「(私が)友達に肩をたたかれた」は、身体の一部である「肩」の持ち主が主語になっている典型例です。"},

{id:"R7-3-20", tag:"R7 試験I 問題3-D(20)", cat:"文法論:間接受身文の特徴",
 text:"(20) 文章中の下線部Eに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["能動文の主語に現れた名詞は間接受身文ではデ格で表される。","能動文が表す事態に直接関わらない人物が間接受身文の主語になる。","能動文の主語には人物が用いられるが、間接受身文の主語には人物は用いられない。","能動文で表される行為が間接受身文の主語にとって迷惑な場合は用いられない。"], choiceLabels:["1","2","3","4"], answer:1,
 explain:"間接受身文(いわゆる迷惑の受身)は、「雨に降られた」のように、対応する能動文が表す事態の直接の参加者ではない人物を主語に立てて、その人物が受ける影響(多くは迷惑)を表す点に特徴があります。"},

/* ========= データ (令和7年度 試験I 問題4) ========= */
{id:"R7-4-1", tag:"R7 試験I 問題4 問1", cat:"教授法:ディスカッション",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n話すことの教室活動には、「やり取り」タイプと「発表」タイプがある。\n「やり取り」タイプのアカデミックな活動として、ディスカッションやディベートがある。ディベートでは論題を適切に設定する必要がある。ディベートを通して、説得力のある話し方を学ぶこともできる。日常的な場面を扱った活動には、ロールプレイがある。ロールプレイの状況設定をする際には、できるだけ自然なコミュニケーションが行われるよう、「選択権」(ア)を考慮する必要がある。\n「発表」タイプの一つであるプレゼンテーションの授業では、スライドや配付資料の作成方法、リハーサルなどの準備から指導する必要がある。また、発表者だけでなく聞き手の態度も指導すべきである。\n\n問1 文章中の下線部A「ディスカッション」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ディスカッションの間に相手から説得されれば参加者は立場を変えてもよい。","ディスカッションでは参加者は決められた順番に従い意見を述べる。","ディスカッションの終わりには参加者全員の合意が形成されなければならない。","ディスカッションが始まる前に参加者は自らの立場を決めなければならない。"], answer:0,
 explain:"ディスカッションは、参加者が自由に意見を述べ合いながら理解や考えを深めていく活動であり、話し合いの中で他者の意見に納得すれば自分の立場を変えることも自然に許容されます。発言順の固定、全員一致の義務化、事前の立場決定の必須化は、いずれもディスカッションの一般的な性質とは言えません。"},

{id:"R7-4-2", tag:"R7 試験I 問題4 問2", cat:"教授法:ディベートの論題設定",
 text:"問2 文章中の下線部Bに関して、ディベートにおける「論題」を設定する際の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["様々な角度から議論が展開するように、論題には複数の論点を入れる。","二つの立場から議論ができるように、まだ結果が出ていないものを論題にする。","議論の範囲を明確に示すため、論題には程度表現を用いるようにする。","問われていることを明確にするため、論題は疑問文にする。"], answer:1,
 explain:"ディベートの論題は、賛成・反対の二つの立場に分かれて議論できるよう、まだ決着のついていない(結論が定まっていない)事柄を設定することが重要です。論点を複数含めたり、あいまいな程度表現を使ったり、論題自体を疑問文にすることは、論題の焦点をぼやけさせるため適切ではありません。"},

{id:"R7-4-3", tag:"R7 試験I 問題4 問3", cat:"教授法:説得力のある話し方",
 text:"問3 文章中の下線部Cに関して、ディベートにおける「説得力のある話し方」として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["まず根拠の数を提示し、それぞれの内容を説明したあと、結論を述べる。","論題について現状を述べ、対策を示し、得られる結果の重要性を提示する。","最初に主張を提示し、その根拠と例を述べたあと、改めて主張を述べる。","様々な立場に配慮し、客観的な根拠とともに、複数の結論を提示する。"], answer:3,
 explain:"説得力のある話し方では、一貫した一つの主張を明確に打ち出すことが重要です。複数の結論を並べて提示することは、かえって主張の焦点がぼやけ、説得力を弱めてしまうため不適当です。"},

{id:"R7-4-4", tag:"R7 試験I 問題4 問4", cat:"教授法:ロールプレイの設計",
 text:"問4 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「波及効果」「公平性」","「変則性」「寛容度」","「可変性」「再構築」","「情報差」「反応」"], answer:3,
 explain:"自然なコミュニケーションが生まれるロールプレイの設定には、参加者間に「選択権」があることに加え、互いに知らない情報がある「情報差」(インフォメーション・ギャップ)があること、そして相手の発話に対する自然な「反応」が生まれる余地があることが重要な要素とされます。"},

{id:"R7-4-5", tag:"R7 試験I 問題4 問5", cat:"教授法:聞き手の態度指導",
 text:"問5 文章中の下線部D「聞き手の態度」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["発表者を緊張させないように、発表者と目を合わせないほうがよい。","発表者が集中できるように、うなずいたり笑ったりしないほうがよい。","発表後は積極的に質問し、発表者とやり取りをしたほうがよい。","発表を聞くことに集中し、内容はメモを取らず覚えておくほうがよい。"], answer:2,
 explain:"聞き手が発表後に積極的に質問し、発表者とやり取りをすることは、発表を双方向的なコミュニケーションの場にし、発表者・聞き手双方の学びを深めます。アイコンタクトやうなずきなどの反応を控えることや、メモを取らないことは、むしろ良い聞き手の態度とは言えません。"},

/* ========= データ (令和7年度 試験I 問題5) ========= */
{id:"R7-5-1", tag:"R7 試験I 問題5 問1", cat:"読解指導:多読と語彙力",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n読む力は様々な方法で伸ばすことができる。多読はその一つの方法であり、(ア)ため、語彙力が向上するなどの効果が期待できる。多読を効果的に実践するためにはいくつかのポイントがある。\n多読を行う際には、学習者用に作成された「段階別読み物」を使用するのが一般的である。母語話者向けの読み物を用いる場合は、読み物の対象年齢やジャンルによって学習者の理解のしやすさが異なるため、注意が必要である。また、学習者には読書記録を付けさせるとよい。なお、多読と類似した活動として聞く力を伸ばす多聴がある。\n\n問1 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["知らない語に出会うたびに辞書を引く","異なる文脈の中で何度も同じ語を目にする","あらかじめ用意された語彙リストを参照する","複数の読み物に出てきた語で単語カードを作る"], answer:1,
 explain:"多読によって語彙力が向上するのは、大量の読み物に触れる中で、同じ語に異なる文脈で繰り返し出会うことで、その語の意味や用法が自然に定着していくためだとされています。"},

{id:"R7-5-2", tag:"R7 試験I 問題5 問2", cat:"読解指導:多読実践のポイント",
 text:"問2 文章中の下線部Aに関して、教師が行うこととして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["教師の提示した問いに答えるために読み物を読むように学習者に促す。","読み物の内容より言語面に注意を払いながら読むように学習者に促す。","それぞれ無理なく読める読み物を自分で選んで読むように学習者に促す。","意識的に時間を掛けて一つの読み物をゆっくり読むように学習者に促す。"], answer:2,
 explain:"多読の基本原則の一つに、学習者自身が無理なく読める(辞書に頼らず理解できる)レベルの読み物を自分で選んで読む、というものがあります。内容理解よりも言語形式に注目させることや、精読的にゆっくり読ませることは、多読の趣旨とは異なります。"},

{id:"R7-5-3", tag:"R7 試験I 問題5 問3", cat:"読解指導:読み物選定の留意点",
 text:"問3 文章中の下線部Bに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["小・中・高校生向けの読み物は、初級の学習者でも辞書を使わずに容易に理解できる。","小説などの文学作品は、「段階別読み物」で最高レベルに達した学習者は容易に理解できる。","短編小説より短い「ショートショート」は、学習者にとって状況設定が捉えやすい。","絵を中心に物語が進行する子ども向けの絵本は、学習者にとって文脈や内容を捉えやすい。"], answer:3,
 explain:"絵を中心に物語が展開する子ども向けの絵本は、視覚情報が文脈理解を助けるため、学習者にとって内容を捉えやすい読み物です。母語話者向けの一般の読み物(学校教材、文学作品、ショートショートなど)は、対象年齢やジャンルに応じた背景知識や語彙が前提とされていることが多く、必ずしも学習者にとって理解しやすいとは限りません。"},

{id:"R7-5-4", tag:"R7 試験I 問題5 問4", cat:"読解指導:読書記録の活用",
 text:"問4 文章中の下線部C「読書記録」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["教師は記録する項目を指定せず、学習者の自主性を重んじる。","教師は記録から学習者の成長をモニターし、紹介する本選びの参考にする。","印象に残った読み物を選んで記録させ、学習者の興味や関心を把握する。","学習過程の詳細な記録として、まとまった量の読書感想文を毎回書かせる。"], answer:1,
 explain:"読書記録は、教師が学習者の読書量や興味の変化などの成長を把握し、その後の読み物選びの助言に活用するために付けさせるものです。感想文のような負担の大きい記録を毎回課すことは、多読の「楽しみながら大量に読む」という趣旨に反するため適当ではありません。"},

{id:"R7-5-5", tag:"R7 試験I 問題5 問5", cat:"聴解指導:多聴",
 text:"問5 文章中の下線部D「多聴」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["初級では視覚情報に頼る素材を使うことは避け、音声だけで理解できるようにする。","イヤホンは使用せず、雑音のある環境下でも聞き取る力が付くようにする。","素材のジャンルは広げず、教師に勧められたジャンルのものを聞くようにする。","素材全体の流れを把握するのではなく、細かい部分に集中して聞くようにする。"], answer:0,
 explain:"多聴は、大量の音声に触れることで、視覚情報などに頼らず音声そのものから内容を理解する力を養う活動です。素材のジャンルは学習者の興味に応じて幅広く選べるようにし、細部にこだわらず全体の流れをつかむ聞き方を促すことが望ましいため、他の記述は不適当です。"},

/* ========= データ (令和7年度 試験I 問題6) ========= */
{id:"R7-6-1", tag:"R7 試験I 問題6 問1", cat:"教師養成:模擬授業",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語教師にとって、現場で求められる資質や能力を磨くことは非常に重要である。その一環として、養成課程における模擬授業は貴重な経験となる。模擬授業では、実際の授業を想定して指導案を作成する。その際、IRE/IRF型のやり取り等、教室内特有の談話構造にも注意を払いながら授業の流れを考える。\n養成課程修了後も教え方を改善するために、様々な方法で自分の授業を振り返ることができる。例えば、授業者とその授業の見学者による授業検討会を開くことが有効である。授業検討会を通して授業分析を行い、授業の良かった点や改善点を具体的に検討する。このプロセスを繰り返すことで、実践力や指導力を磨き、よりよい教師を目指すことができる。\n\n問1 文章中の下線部A「養成課程における模擬授業」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["受講生が現職教師による授業を模倣し、一人でシミュレーションすること","受講生が現職教師のモデル授業に参加し、自身の考えた指導案と比較すること","受講生が教師役と学習者役に分かれ、実際の授業を想定して授業をすること","受講生が日本語学校の実際の授業で、学習・教育の効果を狙って授業をすること"], answer:2,
 explain:"模擬授業は、教員養成課程の受講生同士が教師役・学習者役に分かれ、実際の教室を想定した模擬的な授業を行うことで、指導技術を実践的に練習する活動です。"},

{id:"R7-6-2", tag:"R7 試験I 問題6 問2", cat:"教師養成:指導案作成の手順",
 text:"問2 文章中の下線部B「指導案を作成する」際の手順として最も適当なものを、下の1〜4の中から一つ選べ。\n\n①授業の目標を明確にする。②学習項目の提示順を決定する。③活動の難易度や量の調整をする。④指導方法や活動形態などを決定する。⑤学習項目の数を調整する。",
 choices:["①→④→②→⑤→③","①→④→③→⑤→②","①→⑤→②→④→③","①→⑤→③→④→②"], answer:2,
 explain:"指導案作成では、まず①授業の目標を明確にし、その目標に基づいて⑤扱う学習項目の数を調整し、②それらの提示順を決定した上で、④具体的な指導方法・活動形態を決め、最後に③活動の難易度や量を細かく調整する、という流れが自然です。"},

{id:"R7-6-3", tag:"R7 試験I 問題6 問3", cat:"教室談話:IRE/IRF型",
 text:"問3 文章中の下線部C「IRE/IRF型」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["先行した教師の発話が、学習者によるある特定の発話を引き起こすこと","教師が学習者Xに対して質問することで、学習者Yから答えを引き出すこと","学習者が誤用などを含む発言をした際に、教師が別の言葉で言い直すこと","教師の質問への学習者の応答に対し、教師が評価やフィードバックをすること"], answer:3,
 explain:"IRE(Initiation-Response-Evaluation)/IRF(Initiation-Response-Feedback)型は、教師の発問(Initiation)に対して学習者が応答(Response)し、それに対して教師が評価やフィードバック(Evaluation/Feedback)を行うという、教室に特有の三部構造の談話パターンです。"},

{id:"R7-6-4", tag:"R7 試験I 問題6 問4", cat:"教師研修:授業検討会",
 text:"問4 文章中の下線部D「授業検討会」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["教師が、自身の授業に関わる様々な見方や考え方について、見学者と意見交換する場である。","教師が、具体的な授業内容から離れて、見学者に自身の信念を詳細に伝える場である。","見学者が、自身の価値観を押し付けるのではなく、授業の背景にある考えについて吟味し合う場である。","教師と見学者が、授業で何が起こっていたかについて、互いに理解を深める場である。"], answer:1,
 explain:"授業検討会は、実際に行われた具体的な授業内容や場面に基づいて、教師と見学者が意見を交換し合う場です。具体的な授業内容から離れて教師が自身の信念を一方的に詳しく伝えるだけの場になってしまうのは、授業検討会の本来の目的に反するため不適当です。"},

{id:"R7-6-5", tag:"R7 試験I 問題6 問5", cat:"教師研修:授業分析",
 text:"問5 文章中の下線部E「授業分析」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["授業分析では、授業を細かく分けて各場面について検討し、その授業の特徴を明らかにする。","授業分析の根拠となる授業記録は、学習者の作文や作品は対象とせず、教師と学習者の発言を対象として作成する。","授業形態にかかわらず、同一の方法を用いて授業を記録し、授業分析の結果を客観的なものにする。","授業分析では一字一句正確に記録することを目指し、授業で行われたことを細部まで再現する。"], answer:0,
 explain:"授業分析は、授業の展開を場面ごとに細かく分けて具体的に検討することで、その授業の特徴や課題を明らかにしていく方法です。授業記録の対象を発言だけに限定したり、授業形態を問わず画一的な記録方法にこだわったり、一字一句の完全な再現を目指したりすることは、必ずしも授業分析に必要な要件ではありません。"},

/* ========= データ (令和7年度 試験I 問題7) ========= */
{id:"R7-7-1", tag:"R7 試験I 問題7 問1", cat:"目的別日本語教育:JSPの例",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\nグローバル化が進む中、日本語学習者がますます多様化している。それに伴い、目的別日本語教育(Japanese for Specific Purposes:JSP)の重要性が高まっている。\nJSPでは、ニーズ調査が特に重要である。ニーズ分析の結果に基づき、学習目標の設定をし、コースデザインを行う。学習者の状況によっては、後行シラバスの教授活動を採用する場合もある。また、評価に関しても、ニーズ分析の結果に基づきポートフォリオ評価を実施することも有効である。\n\n問1 文章中の下線部A「目的別日本語教育」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["海外の送り出し機関において、日本の介護施設で介護技能を学ぶために日本語を学ぶ。","海外の日本語学校において、日本語や日本文化への関心から教養として日本語を学ぶ。","日本国内の大学において、留学生が卒業に必要な単位を取得するために日本語を学ぶ。","日本国内の公立小学校において、外国籍の子どもが学校教育の中で日本語を学ぶ。"], answer:0,
 explain:"目的別日本語教育(JSP)は、介護や看護、ビジネスなど、特定の職業・分野で必要とされる日本語を学ぶことに特化した教育です。介護施設での実務を見据えた介護分野の日本語学習はこの典型例です。他の選択肢は、教養目的や一般的な学業・学校生活のための日本語学習であり、特定の目的に特化したものではありません。"},

{id:"R7-7-2", tag:"R7 試験I 問題7 問2", cat:"コースデザイン:ニーズ調査",
 text:"問2 文章中の下線部B「ニーズ調査」の実施に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["アンケートによる調査ではなく、インタビューによって聞き取る。","一般的な学習目的だけでなく、それぞれの学習者の目的を把握する。","聞き取りは学習者本人から行い、周囲の人は調査の対象としない。","コースの開始前に調査を行い、コースが始まってからは行わない。"], answer:1,
 explain:"ニーズ調査では、学習者全体に共通する一般的な目的だけでなく、個々の学習者固有の目的や事情を丁寧に把握することが重要です。調査方法はアンケート・インタビューのいずれも有効であり、学習者本人だけでなく関係者(雇用主等)への調査、コース開始後の継続的な調査も有効であるため、他の記述は不適当です。"},

{id:"R7-7-3", tag:"R7 試験I 問題7 問3", cat:"コースデザイン:学習目標の設定順",
 text:"問3 文章中の下線部C「学習目標の設定」に関して、目標の設定順として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["各授業の目標 → 各単元の目標 → コース全体の目標","各単元の目標 → コース全体の目標 → 各授業の目標","コース全体の目標 → 各授業の目標 → 各単元の目標","コース全体の目標 → 各単元の目標 → 各授業の目標"], answer:3,
 explain:"学習目標は、まずコース全体としての大きな目標を定め、それを踏まえて各単元の目標を設定し、さらにそれぞれの単元を構成する各授業の目標へと、大きな枠組みから細部へと具体化していくのが一般的な手順です。"},

{id:"R7-7-4", tag:"R7 試験I 問題7 問4", cat:"コースデザイン:後行シラバスの利点",
 text:"問4 文章中の下線部D「後行シラバス」の利点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["コースの開始前に、学習する内容と順番を学習者に示しやすい。","チームティーチングの際に、授業内容の引継ぎがしやすい。","学習言語の知識について、体系的かつ総合的に教えやすい。","計画にとらわれず、学習者の要望に臨機応変に対応しやすい。"], answer:3,
 explain:"後行シラバスは、コースが進む中で明らかになった学習者のニーズや状況に応じて、その都度学習内容を決めていく方式です。あらかじめ内容を固定しないため、学習者の要望に柔軟に対応しやすいという利点がありますが、逆に事前に内容を提示したり、複数教師間で内容を引き継いだり、体系的に教えたりすることには不向きです。"},

{id:"R7-7-5", tag:"R7 試験I 問題7 問5", cat:"評価法:ポートフォリオ評価",
 text:"問5 文章中の下線部E「ポートフォリオ評価」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["評価基準を設定しないため、学習者が自身の学びを自由に評価しやすい。","評価の重点が結果に置かれるため、周囲の人々が学習者の成果を把握しやすい。","評価の対象にする資料を学習者が決められるため、学習者の自律心が高められる。","教師が評価に参加しないため、学習者の自己評価能力が育てられる。"], answer:2,
 explain:"ポートフォリオ評価では、学習の過程で作成した作文やレポートなどの中から、学習者自身がどれを評価の対象として残すかを選ぶことができ、この主体的な選択のプロセスを通じて学習者の自律性が育まれます。評価基準を設けないわけではなく、結果よりも過程を重視し、教師も評価に関わる点で、他の記述は不適当です。"},

/* ========= データ (令和7年度 試験I 問題8) ========= */
{id:"R7-8-1", tag:"R7 試験I 問題8 問1", cat:"異文化コミュニケーション:言語・非言語メッセージ",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n人が文化間を移動することが増えた現在、多文化社会におけるコミュニケーションに関する知識が求められる。例えば、言語メッセージと非言語メッセージについての知識が挙げられる。また、ホール(E. Hall)によって概念化された、コンテクストをどの程度利用するかの文化差についての理解も重要である。\nさらに、相手を知るためには自分を客観視する必要があり、その際「ジョハリの窓(Johari Window)」の概念も参考になる。このほか、対話において聞き手が行うエポケーも、多様な視点を受け入れるための有効な手段となる。加えて、他者を理解しようとする際にはエンパシーに基づいたコミュニケーション参加も重要となる。\n\n問1 文章中の下線部A「言語メッセージと非言語メッセージ」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["非言語メッセージは、言語メッセージから独立して単独で機能することはない。","メッセージが言語と非言語とで異なる場合、非言語メッセージが重視される。","対面でのコミュニケーションにおいては言語メッセージの占める割合が高い。","送り手の無意識的な行動や動作は、非言語メッセージにはならない。"], answer:1,
 explain:"言語メッセージと非言語メッセージの内容が矛盾する場合、聞き手は非言語メッセージのほうを信頼しやすいことが知られています。非言語メッセージは単独でも機能し、対面コミュニケーションでは非言語情報の占める割合が大きく、無意識の行動も非言語メッセージとなり得るため、他の記述は不適当です。"},

{id:"R7-8-2", tag:"R7 試験I 問題8 問2", cat:"異文化コミュニケーション:コンテクスト",
 text:"問2 文章中の下線部B「コンテクスト」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["高コンテクスト文化では、背景情報を手掛かりにして、言語化されない部分を読み取ることを習慣化した「察し」が好まれる。","高コンテクスト文化では何を言ったかが重視され、「大体」ではなく数字や日時などを具体的に説明することが要求される。","低コンテクスト文化では曖昧で間接的なメッセージが交換されることが多く、それは主にアジア、アフリカ、中南米において見られる。","低コンテクスト文化では同一文化メンバー間で共有される行動規範が前提となっており、集団主義的な特徴が多く見られる。"], answer:0,
 explain:"高コンテクスト文化では、言葉にされない背景情報を読み取る「察し」の文化が好まれる傾向があります。具体的な数字での説明を重視するのはむしろ低コンテクスト文化の特徴であり、曖昧なメッセージや集団主義的な行動規範は高コンテクスト文化(アジア等)の特徴であるため、他の記述は不適当です。"},

{id:"R7-8-3", tag:"R7 試験I 問題8 問3", cat:"自己理解:ジョハリの窓",
 text:"問3 文章中の下線部C「ジョハリの窓」に関する記述として最も適当なものを、下の1〜4の中から一つ選べ。\n\n(表:開放の窓/盲目の窓、秘密の窓/未知の窓 から成るジョハリの窓(Johari Window)より作成)",
 choices:["「開放の窓」と「盲目の窓」は、自分が知っている部分である。","「盲目の窓」が大きい人は、自己開示度が高く積極的で明るい人が多いとされる。","「未知の窓」は、自分も他人も気づいていない、無限の可能性を秘めた部分である。","「秘密の窓」が大きい人は、人の意見を聞こうとしない頑固な人が多いとされる。"], answer:2,
 explain:"「未知の窓」は、自分自身も他者も気づいていない、未知の可能性を秘めた領域とされます。「開放の窓」は自他ともに知っている部分ですが「盲目の窓」は自分は気づいていない部分であり、盲目の窓が大きい人や秘密の窓が大きい人についての記述も実際の性格傾向とは異なるため、他の記述は不適当です。"},

{id:"R7-8-4", tag:"R7 試験I 問題8 問4", cat:"現象学:エポケー",
 text:"問4 文章中の下線部D「エポケー」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「うん」「ええ」「なるほど」といった相づちを打って話し手を話のリズムに乗せ、多くの発話を促すこと","話し手の不安や緊張した心理状態を受け止め、話し手にとって安全で信頼できる環境を作ろうと努めること","誤解の原因を効果的に見つけ出すため、出来事についての描写、解釈、評価を分けて考えること","先入観や客観的事実など確かな存在に思えるものを棚上げすることで、自動的な解釈や判断をいったん止めること"], answer:3,
 explain:"エポケー(判断中止)とは、先入観や当然視されている前提をいったん保留(棚上げ)し、自動的に生じる解釈や判断を止めて、物事をありのままに捉えようとする現象学の概念です。"},

{id:"R7-8-5", tag:"R7 試験I 問題8 問5", cat:"異文化コミュニケーション:エンパシー",
 text:"問5 文章中の下線部E「エンパシー」に関して、友人のXさんから職場の上司について悩み事を打ち明けられた際、エンパシーが表れている聞き手の反応として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["え〜、その人ひどい。Xさんがかわいそう!","分かる! 私も同じだよ。厳しい上司がいるとつらいよね。","そうだね。Xさんの言うとおりだよ。その上司がおかしいと思う。","つらかっただろうね。何て言われたの? よければもう少し話してみて。"], answer:3,
 explain:"エンパシーは、相手の立場に立ってその気持ちを想像し、評価や自分の意見を挟まずに寄り添いながら、相手がさらに話しやすいように促す姿勢です。相手の状況を決めつけたり、安易に同調・同意したりする反応とは異なります。"},

/* ========= データ (令和7年度 試験I 問題9) ========= */
{id:"R7-9-1", tag:"R7 試験I 問題9 問1", cat:"心理言語学:キーワード法",
 text:"言語学習・言語習得における記憶や知識に関する次の問い(問1〜5)に答えよ。\n\n問1 「キーワード法」を使った語の記憶方法の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["新出語とそれに対応する母語の単語を、繰り返し声に出しながら覚えること","内容理解に重要な新出語の意味を、文の前後関係を手掛かりに推測して覚えること","音韻的に類似した既知の単語とイメージを結び付け、新語を覚えること","新出語を品詞別や機能別など意味のある単位に分類し、グループ化して覚えること"], answer:2,
 explain:"キーワード法は、新出語と音が似ている既知の単語(キーワード)を見つけ、両者を結び付けるイメージを作ることで記憶を助ける、記憶ストラテジーの一つです。"},

{id:"R7-9-2", tag:"R7 試験I 問題9 問2", cat:"心理言語学:チャンキング",
 text:"問2 言語処理における「チャンキング」の働きに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["受け取った言語刺激を各言語要素に分解したうえで、語の知識のまとまりである心的辞書を検索し、どの語であるか同定して意味情報を取り出す。","複数の情報を意味のあるかたまりに統合することで、記憶の負担を軽減し、記憶からの検索を早くしたり流暢さを生み出したりする。","脳が一度に記憶できる容量には限度があるため、かたまりではなく一つ一つの語に注意を向けながら言語処理を行う。","意味的なまとまりに基づいて語のネットワークを構成し、一つの語や概念が活性化することに伴って関連するものも活性化させる。"], answer:1,

{id:"R7-9-3", tag:"R7 試験I 問題9 問3", cat:"心理言語学:短期記憶",

{id:"R7-9-4", tag:"R7 試験I 問題9 問4", cat:"心理言語学:手続き的知識",

{id:"R7-9-5", tag:"R7 試験I 問題9 問5", cat:"心理言語学:スクリプト",

{id:"R7-10-1", tag:"R7 試験I 問題10 問1", cat:"第二言語習得:インプット仮説",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n第二言語習得研究では、第二言語を学ぶ方法は多様でも、習得の過程には共通点があると考えられている。習得はインプットから始まり、インプットからインテイクされたものが、頭の中に取り込まれると考える。次に自分が新たに得た知識を統合し、アウトプットする。その結果、相手からフィードバックを得ることができる。一連の過程の間で起こる現象を指摘した理論に、シュミット(R. W. Schmidt)による気づき仮説がある。また、第二言語習得の過程で自動化が起こることが指摘されている。\n第二言語習得においては個人差がある。その要因の一つとして学習者の言語適性がある。それ以外にも動機づけによって習得状況が異なることも報告されている。\n\n問1 文章中の下線部A「インプット」に関して、インプット仮説(クラッシェン(S. D. Krashen))では第二言語習得を促すインプットの条件が示されている。その条件に当てはまる例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["一つ一つの項目が母語話者の発達段階に即したもの","自分の興味がある分野とは異なる分野のもの","全てが既習で新たに覚える必要がなく理解できるもの","分からない語があっても文脈から意味を理解できるもの"], answer:3,
 explain:"クラッシェンのインプット仮説では、学習者の現在のレベルより少しだけ高い、理解可能なインプット(いわゆる「i+1」)が習得を促すとされます。未知の語があっても文脈から意味を推測して理解できるインプットはこの条件に当てはまります。"},

{id:"R7-10-2", tag:"R7 試験I 問題10 問2", cat:"第二言語習得:気づき仮説",
 text:"問2 文章中の下線部B「気づき仮説」は、習得過程を簡略化して示した次の図のどの段階での気づきに関する仮説か。最も適当なものを、下の1〜4の中から一つ選べ。\n\n(図:インプット→インテイク→中間言語への統合→アウトプット←フィードバック)",
