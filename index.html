<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日本語教育能力検定 過去問アプリ</title>
<style>
  :root{
    --bg:#f5f3ef;
    --card:#ffffff;
    --ink:#2b2b2b;
    --sub:#6b6b6b;
    --accent:#8a5a44;
    --accent2:#b98a68;
    --ok:#3f7d4f;
    --ng:#b8493f;
    --line:#e4ded4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"BIZ UDPGothic","BIZ UDGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic","Meiryo",sans-serif;
    font-weight:600;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header{padding:16px 18px 10px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line);}
  header h1{font-size:19px;margin:0 0 4px;font-weight:700;color:var(--accent);}
  header .meta{font-size:13.5px;color:var(--sub);}
  main{flex:1;padding:16px 18px 100px;}
  .screen{display:none;}
  .screen.active{display:block;}

  /* ホーム画面 */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0 18px;}
  .stat-box{background:var(--card);border-radius:12px;padding:10px 6px;text-align:center;border:1px solid var(--line);}
  .stat-box .num{font-size:23px;font-weight:700;color:var(--accent);}
  .stat-box .label{font-size:12.5px;color:var(--sub);margin-top:2px;}
  .mode-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;}
  .mode-card h2{font-size:16px;margin:0 0 8px;}
  .mode-btns{display:flex;flex-direction:column;gap:8px;}
  .mode-btn{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#faf8f5;
    text-align:left;font-size:16.5px;color:var(--ink);}
  .mode-btn small{display:block;color:var(--sub);font-size:13px;margin-top:3px;}
  .mode-btn:active{background:#f0e9e0;}
  .range-btn{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#faf8f5;
    text-align:left;font-size:16px;color:var(--ink);}
  .range-btn:active{background:#f0e9e0;}
  .start-btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--accent);
    color:#fff;font-size:17.5px;font-weight:700;margin-top:6px;}
  .start-btn:active{background:var(--accent2);}
  .reset-link{display:block;text-align:center;color:var(--sub);font-size:13.5px;margin-top:18px;text-decoration:underline;}

  /* クイズ画面 */
  .progress-bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px;}
  .progress-fill{height:100%;background:var(--accent);width:0%;transition:width .25s;}
  .q-tag{font-size:12.5px;color:var(--sub);margin-bottom:4px;}
  .q-cat{display:inline-block;background:#efe6dc;color:var(--accent);font-size:12.5px;padding:3px 9px;
    border-radius:20px;margin-bottom:8px;}
  .q-text{font-size:18.5px;line-height:1.85;white-space:pre-wrap;margin-bottom:16px;font-weight:600;}
  .choice{display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:9px;
    border-radius:11px;border:1px solid var(--line);background:var(--card);font-size:17px;line-height:1.65;padding:15px 16px;}
  .choice .num{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;
    border-radius:50%;background:#efe6dc;color:var(--accent);font-size:14px;margin-right:9px;font-weight:700;}
  .choice.correct{border-color:var(--ok);background:#eaf5ec;}
  .choice.wrong{border-color:var(--ng);background:#fbebe9;}
  .choice.disabled{opacity:.55;}

  .explain-box{margin-top:14px;padding:14px;border-radius:12px;background:#faf7f2;border:1px solid var(--line);}
  .explain-box .verdict{font-weight:700;font-size:17px;margin-bottom:8px;}
  .verdict.ok{color:var(--ok);}
  .verdict.ng{color:var(--ng);}
  .explain-box p{font-size:16.5px;line-height:1.8;margin:0;color:#2b2b2b;font-weight:500;}
  .explain-note{font-size:12.5px;color:var(--sub);margin-top:9px;}

  .next-btn{width:100%;padding:13px;border:none;border-radius:11px;background:var(--accent);
    color:#fff;font-size:17px;font-weight:700;margin-top:16px;}
  .next-btn:active{background:var(--accent2);}

  /* 結果画面 */
  .result-score{text-align:center;padding:28px 0 10px;}
  .result-score .big{font-size:46px;font-weight:800;color:var(--accent);}
  .result-score .sub{font-size:14.5px;color:var(--sub);margin-top:4px;}
  .review-item{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;margin-bottom:8px;font-size:15px;display:flex;justify-content:space-between;align-items:center;}
  .review-item .mark{font-weight:700;}
  .mark.ok{color:var(--ok);} .mark.ng{color:var(--ng);}
  .backhome{width:100%;padding:13px;border:none;border-radius:11px;background:#efe6dc;
    color:var(--accent);font-size:17px;font-weight:700;margin-top:18px;}

  footer{padding:10px 18px 18px;font-size:12.5px;color:var(--sub);text-align:center;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>日本語教育能力検定 過去問アプリ</h1>
    <div class="meta" id="headerMeta">R1・R2・R3(全体) 計660問</div>
  </header>
  <main>

    <!-- ホーム -->
    <section class="screen active" id="screen-home">
      <div class="stat-grid">
        <div class="stat-box"><div class="num" id="statTotal">0</div><div class="label">総回答数</div></div>
        <div class="stat-box"><div class="num" id="statRate">-</div><div class="label">正答率</div></div>
        <div class="stat-box"><div class="num" id="statWeak">0</div><div class="label">苦手問題</div></div>
      </div>

      <div class="mode-card">
        <h2>出題範囲</h2>
        <div class="mode-btns">
          <button class="range-btn" data-range="all">全体(試験I・II・III)</button>
          <button class="range-btn" data-range="R1-test1">試験I</button>
          <button class="range-btn" data-range="R1-II">試験II(聴解)</button>
          <button class="range-btn" data-range="R1-16-">試験III</button>
        </div>
      </div>

      <div class="mode-card">
        <h2>出題モード</h2>
        <div class="mode-btns">
          <button class="mode-btn" data-mode="order">順番に解く
            <small>選んだ範囲の最初から順番に出題します</small></button>
          <button class="mode-btn" data-mode="random">ランダム出題
            <small>選んだ範囲からシャッフルして出題</small></button>
          <button class="mode-btn" data-mode="weak">苦手優先(復習モード)
            <small>正答率が低い問題を優先的に出題</small></button>
        </div>
      </div>
      <button class="start-btn" id="startBtn">この設定で開始する</button>
      <a class="reset-link" id="resetLink">成績データをリセットする</a>
    </section>

    <!-- クイズ -->
    <section class="screen" id="screen-quiz">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="q-tag" id="qTag"></div>
      <div class="q-cat" id="qCat"></div>
      <div id="audioBox" style="display:none;margin-bottom:14px;">
        <audio id="qAudio" controls style="width:100%;"></audio>
      </div>
      <div id="imageBox" style="display:none;margin-bottom:14px;">
        <img id="qImage" src="" style="width:100%;border-radius:10px;border:1px solid var(--line);">
      </div>
      <div class="q-text" id="qText"></div>
      <div id="choiceList"></div>
      <div class="explain-box" id="explainBox" style="display:none;">
        <div class="verdict" id="verdict"></div>
        <p id="explainText"></p>
        <div class="explain-note">解説はAIが作成した学習補助です。正確性については必ず公式テキスト等でも確認してください。</div>
      </div>
      <button class="next-btn" id="nextBtn" style="display:none;">次の問題へ</button>
    </section>

    <!-- 結果 -->
    <section class="screen" id="screen-result">
      <div class="result-score">
        <div class="big" id="resultScore">0/0</div>
        <div class="sub">今回の正答率</div>
      </div>
      <div id="reviewList"></div>
      <button class="backhome" id="backHomeBtn">ホームに戻る</button>
    </section>

  </main>
  <footer>データはこの端末のブラウザ内にのみ保存されます</footer>
</div>

<script>
/* ========= データ (令和元年度 試験I 問題1) ========= */
const QUESTIONS = [
{id:"R1-1-1", tag:"R1 試験I 問題1(1)", cat:"円唇性",
 text:"次の(1)〜(15)について、【 】内に示した観点から見て、他と性質の異なるものを、それぞれ1〜5の中から一つずつ選べ。\n\n(1) 【円唇性】",
 choices:["[a]","[i]","[ɯ]","[e]","[o]"], answer:4,
 explain:"日本語の母音a・i・ɯ・eは唇を丸めない非円唇母音ですが、oだけは唇をわずかに丸めて発音する円唇母音です。したがって性質が異なるのは[o]です。"},

{id:"R1-1-2", tag:"R1 試験I 問題1(2)", cat:"撥音の音声",
 text:"(2) 【撥音の音声】",
 choices:["干拓(かんたく)","貫通(かんつう)","完治(かんじ)","関東(かんとう)","官邸(かんてい)"], answer:2,
 explain:"撥音「ん」は後続音の調音位置に同化します。た・つ・て(歯茎音)の前では歯茎鼻音[n]になりますが、「完治」は「かんじ」と読み、後続の「じ」は歯茎硬口蓋音であるため、「ん」もそれに引かれてやや異なる調音位置(硬口蓋寄り)で実現されます。他の4語は「ん」の後ろが歯茎破裂音・破擦音(た・つ・て)であるため同じ[n]になります。"},

{id:"R1-1-3", tag:"R1 試験I 問題1(3)", cat:"拍数の変化",
 text:"(3) 【拍数の変化】",
 choices:["「月火水」を読み上げるときの「火」","「月水金」を読み上げるときの「月」","「火水木」を読み上げるときの「水」","「火木土」を読み上げるときの「木」","「金土日」を読み上げるときの「金」"], answer:0,
 explain:"曜日を表す漢字の読みのうち、火(か)・土(ど)は本来1拍ですが、月(げつ)・水(すい)・木(もく)・金(きん)・日(にち)はもともと2拍です。列挙して読み上げる際、1拍の「火」はリズムを揃えるため「かー」のように2拍に伸びて発音されます。他の選択肢の対象(月・水・木・金)はもともと2拍なので拍数の変化が起こりません。"},

{id:"R1-1-4", tag:"R1 試験I 問題1(4)", cat:"読み方のバリエーション",
 text:"(4) 【読み方のバリエーション】",
 choices:["9歳","9人","9個","9本","9回"], answer:1,
 explain:"数字の「9」は基本的に「きゅう」と読みますが、「9人」は「くにん」のように「く」の読みが使われる場合があります。他の9歳・9個・9本・9回はいずれも「きゅう」で読むため、「9人」だけ読み方の系統が異なります。"},

{id:"R1-1-5", tag:"R1 試験I 問題1(5)", cat:"語構成",
 text:"(5) 【語構成】",
 choices:["耳当て","下敷き","台拭き","膝掛け","前書き"], answer:2,
 explain:"これらは「名詞+動詞連用形」の複合名詞ですが、名詞と動詞の意味関係が異なります。耳当て(耳に当てる)・下敷き(下に敷く)・膝掛け(膝に掛ける)・前書き(前に書く)は「名詞+に+動詞」という場所・位置関係です。一方「台拭き」は「台を拭く」であり、名詞が動詞の直接目的語(を格)になっています。この目的語関係を持つのは台拭きだけです。"},

{id:"R1-1-6", tag:"R1 試験I 問題1(6)", cat:"転成名詞の意味",
 text:"(6) 【転成名詞の意味】",
 choices:["かばん持ち","所帯持ち","金持ち","心持ち","力持ち"], answer:3,
 explain:"かばん持ち・所帯持ち・金持ち・力持ちは、いずれも「〜を持っている人」を表す人物を指す名詞(動作主名詞)です。一方「心持ち」は「気持ち」や「わずかに・心なしか」という意味の副詞的表現であり、人を指す語ではありません。この点で心持ちだけ意味のタイプが異なります。"},

{id:"R1-1-7", tag:"R1 試験I 問題1(7)", cat:"デ格の意味",
 text:"(7) 【デ格の意味】",
 choices:["はしかで休む。","メールで送る。","日本語で話す。","遠近法で描く。","新幹線で行く。"], answer:0,
 explain:"メールで送る・日本語で話す・遠近法で描く・新幹線で行くの「で」は、いずれも動作の手段・方法を表します。一方「はしかで休む」の「で」は原因・理由を表しており、格の意味のタイプが異なります。"},

{id:"R1-1-8", tag:"R1 試験I 問題1(8)", cat:"補助動詞",
 text:"(8) 【補助動詞】",
 choices:["試しにソファーに座ってみる。","ゴミを家に持ってかえる。","花がきれいに飾ってある。","嫌なことはすぐ忘れてしまう。","解決の糸口が見えてくる。"], answer:1,
 explain:"「〜てみる」「〜てある」「〜てしまう」「〜てくる」は本来の動詞の意味が薄れ、試行・結果状態・完了(残念な気持ち)・変化の方向といった文法的な意味を添える補助動詞として使われています。一方「持ってかえる」の「かえる(帰る)」は「持って、そして帰る」という本来の語彙的な意味をそのまま保っており、補助動詞ではなく2つの動詞が組み合わさった複合動詞です。"},

{id:"R1-1-9", tag:"R1 試験I 問題1(9)", cat:"指定文と措定文",
 text:"(9) 【指定文と措定文】",
 choices:["私の先生は男の人だ。","山田さんは医師だ。","あの人は冷淡だ。","議長は有能だ。","院長はあの人だ。"], answer:4,
 explain:"措定文はある対象の性質・属性を述べる文で、主語と述語を入れ替えることができません(例:「男の人は私の先生だ」とは言えない)。私の先生は男の人だ・山田さんは医師だ・あの人は冷淡だ・議長は有能だはいずれも措定文です。一方「院長はあの人だ」は「あの人が院長だ」と入れ替え可能な指定文(同定文)であり、X=Yの同一性を示す点で他と異なります。"},

{id:"R1-1-10", tag:"R1 試験I 問題1(10)", cat:"直接受身文における動作主の表示形式",
 text:"(10) 【直接受身文における動作主の表示形式】",
 choices:["生み出された","建てられた","作られた","見られた","描かれた"], answer:3,
 explain:"生み出す・建てる・作る・描くのような制作・創造を表す動詞の受身文では、動作主を「によって」で示すのが一般的です(例:「この橋は〜によって建てられた」)。一方「見られた」は知覚動詞の受身であり、動作主は通常「に」で示され、「によって」は不自然です。この点で見られただけ動作主の表示形式が異なります。"},

{id:"R1-1-11", tag:"R1 試験I 問題1(11)", cat:"述語が表す出来事とニ格の関係",
 text:"(11) 【述語が表す出来事とニ格の関係】",
 choices:["週末に映画館へ行った。","週末にドライブをした。","週末に一人で残業した。","週末にケーキを買ってきた。","週末にレストランを予約した。"], answer:4,
 explain:"多くの文では「週末に」は述語が表す出来事(行った・ドライブをした・残業した・買ってきた)が実際に生じた時点を表します。一方「週末にレストランを予約した」の「週末に」は、予約という行為が行われた時点ではなく、予約の対象となる(利用する)時点を表すと解釈することもでき、述語の出来事とニ格の時間的関係が他とは異なります。"},

{id:"R1-1-12", tag:"R1 試験I 問題1(12)", cat:"「の」の用法",
 text:"(12) 【「の」の用法】",
 choices:["あなたの決心を確認する","本の好きな子ども","バッグの値段が高い","彼の高慢な性格","親しい友人の娘"], answer:1,
 explain:"あなたの決心・バッグの値段・彼の性格・友人の娘の「の」は、2つの名詞をつなぐ通常の所有・所属の格助詞(連体修飾)です。一方「本の好きな子ども」の「の」は、名詞修飾節内で主格の「が」を代用したもの(「本が好きな子ども」の「が」→「の」)であり、他の所有の「の」とは機能が異なります。"},

{id:"R1-1-13", tag:"R1 試験I 問題1(13)", cat:"「のだ(んだ)」の用法",
 text:"(13) 【「のだ(んだ)」の用法】",
 choices:["あれ、雨が降っているんだ。","なんだ、このレバーを引けばいいんだ。","よし、僕は今日から生まれ変わるんだ。","へえ、こんな本があるんだ。","そうか、山田さんはあのチームなんだ。"], answer:2,
 explain:"雨が降っているんだ・レバーを引けばいいんだ・こんな本があるんだ・あのチームなんだは、いずれも新たな事実に気づいた・納得したという「発見・理解」を表すんだの用法です。一方「今日から生まれ変わるんだ」は話者自身の決意・意志を表しており、発見・納得とは異なる用法です。"},

{id:"R1-1-14", tag:"R1 試験I 問題1(14)", cat:"「ところ」の用法",
 text:"(14) 【「ところ」の用法】",
 choices:["いまさら彼が来たところで状況は変わらない。","質問したいと思っているところに先生が来た。","仕事が一段落するところで休憩を取ろう。","食事が終わったところで財布がないことに気づいた。","リラックスしていたところに突然電話がかかってきた。"], answer:0,
 explain:"質問したいと思っているところに・一段落するところで・食事が終わったところで・リラックスしていたところにの「ところ」は、いずれもある動作・状態が進行する時間的な局面(ちょうどその時、その段階)を表します。一方「来たところで状況は変わらない」の「ところで」は、「たとえ〜しても」という逆接の仮定条件を表す接続表現であり、時間的な局面を表す用法とは異なります。"},

{id:"R1-1-15", tag:"R1 試験I 問題1(15)", cat:"「れる・られる」の用法",
 text:"(15) 【「れる・られる」の用法】",
 choices:["昔の友人がしのばれる。","新薬の開発が望まれる。","経済の悪化が案じられる。","学生の意欲が高められる。","彼の将来が思いやられる。"], answer:3,
 explain:"しのばれる・望まれる・案じられる・思いやられるは、動作主の意図によらず自然にそのような感情・気持ちが湧き起こることを表す「自発」の用法です。一方「学生の意欲が高められる」の「高められる」は、他者が意図的に意欲を高めるという通常の受身(または可能)の用法として解釈され、自発の意味では使われにくい点で他と異なります。"},

{id:"R1-2-1", tag:"R1 試験I 問題2(1)", cat:"誤用の分析(聞き取り)",
 text:"次の(1)〜(5)における【 】内の下線部は学習者による誤用を示す。これと異なる種類の誤用を、それぞれ1〜4の中から一つずつ選べ。\n\n(1) 【「ショート」のつもりが「しようと」と聞こえる。】",
 choices:["「10時間」のつもりが「自由時間」と聞こえる。","「天井」のつもりが「展示用」と聞こえる。","「居室」のつもりが「教室」と聞こえる。","「客」のつもりが「規約」と聞こえる。"], answer:2,
 explain:"target「ショート(sho-o-to)」→「しようと(shi-yo-u-to)」、選択肢1「じゅうじかん」→「じゆうじかん」、2「てんじょう」→「てんじよう」、4「きゃく」→「きやく」は、いずれも拗音(しょ・じゅ・じょ・きゃ)が2拍の直音(しよ・じゆ・じよ・きや)に分解されたことで拍数が増えた誤りです。一方「居室(きょしつ)」→「教室(きょうしつ)」は拗音「きょ」自体は分解されておらず、新たに長音が付加されたことで拍数が増えており、拍数増加の仕組みが他と異なります。"},

{id:"R1-2-2", tag:"R1 試験I 問題2(2)", cat:"誤用の分析(聞き取り)",
 text:"(2) 【「何頭ですか?」のつもりが「南東ですか?」と聞こえる。】",
 choices:["「今日行くの?」のつもりが「教育の?」と聞こえる。","「咲かなかった?」のつもりが「魚買った?」と聞こえる。","「殻だからね。」のつもりが「体からね。」と聞こえる。","「旅行です。」のつもりが「涼子です。」と聞こえる。"], answer:3,
 explain:"target「何頭ですか(なんとうですか)」と「南東ですか(なんとうですか)」、選択肢1・2・3も、区切り方やアクセントが異なるだけで分節音(モーラ)の並びは同一の文字列です。一方「旅行です(りょこうです)」と「涼子です(りょうこです)」は、りょ・こ・う/りょ・う・こ のようにモーラの並び順そのものが入れ替わっており、単なるアクセント・区切りの違いではなく分節音レベルの違いがある点で他と異なります。"},

{id:"R1-2-3", tag:"R1 試験I 問題2(3)", cat:"誤用の分析(文法)",
 text:"(3) 【私はその映画に深く感動された。】",
 choices:["その都市は長年の開発で次第に発展された。","バブル崩壊で株価が一気に下落された。","私はたくさん誤りが彼女に指摘された。","彼女の言葉に私は随分安心された。"], answer:2,
 explain:"感動する・発展する・下落する・安心するは、動作主を必要としない自動詞(自己の状態変化・心理を表す動詞)であり、本来受身にはなりません。target・選択肢1・2・4は、こうした自動詞に誤って「られる」を付けてしまった誤用です。一方「指摘する」は他動詞で本来受身を作れる動詞であり、選択肢3の問題点は受身化の可否ではなく、文の格関係(所有者の受身などの構造)にあるため、誤用の種類が他と異なります。"},

{id:"R1-2-4", tag:"R1 試験I 問題2(4)", cat:"誤用の分析(語彙)",
 text:"(4) 【その商品は高かったです。そこで、私には買えません。】",
 choices:["あそこに大きなマンションが見えます。そこで、私は住んでいます。","もう何日も眠れない夜が続いています。そこで、体調が優れません。","仲のいい友達とけんかしてしまいました。そこで、本当に悲しいです。","化学の先生の話はとても面白いです。そこで、化学が好きになりました。"], answer:0,
 explain:"target・選択肢2・3・4の「そこで」は、いずれも「だから・それで」という順接の意味で誤用されています。一方選択肢1の「そこで、私は住んでいます」は、接続詞の「そこで」を指示語「そこ(あの場所)」+格助詞「で」と混同した誤用であり、接続詞の意味を取り違えた他の例とは誤用のレベル・種類が異なります。"},

{id:"R1-2-5", tag:"R1 試験I 問題2(5)", cat:"誤用の分析(語彙・文法)",
 text:"(5) 【そのお皿は後で片づけますから、まだテーブルに置いてください。】",
 choices:["危険ですから、その部屋の窓は決して開けずに、閉めてください。","彼にはお世話になったんだから、その恩はずっと覚えなきゃいけないな。","すぐ帰ってくるつもりだったから、外出時も部屋の電気は消さずに点けた。","1本しかない傘をなくしたから、梅雨に入るまで新しいのを買おう。"], answer:3,
 explain:"targetの「まだ〜置いてください」は、本来「そのままにしておいてください」と言うべきところを「まだ」を使ってしまった誤用と考えられ、選択肢1・2・3も同様に、状態の継続を表すべき場面で表現の選び方を誤っている例です。一方選択肢4は「梅雨に入るまで」の「まで」と、期限を表す「までに」との混同という、別の種類の文法的な誤用です。(この設問は解釈に幅があるため、他の教材でも確認することをおすすめします)"},

{id:"R1-3-1", tag:"R1 試験I 問題3-A(1)", cat:"音声学:気流",
 text:"次のA〜Dの文章を読み、(1)〜(20)の問いに答えよ。\n\nA 【気流】\n音声を発するためには気流,発声,調音が必要である。世界の言語には肺からの気流を用いない音声もあるが,日本語の音声では,空気を肺から流出する気流,つまり呼気を利用する。肺から出た気流は声門を通過し,その後調音されて音声となる。日本語に限らず,子音と母音とでは気流に関して大きな違いが見られる。音声が発せられる際,気流の放出と声帯の振動のタイミングによって帯気性(有気か無気か)が決まる。\n\n(1) 文章中の下線部A「日本語の音声」として弁別されないものを、次の1〜4の中から一つ選べ。",
 choices:["摩擦音","弾き音","接近音","吸着音"], answer:3,
 explain:"日本語には摩擦音(サ行・ハ行など)、弾き音(ラ行)、接近音(ヤ行・ワ行など)がありますが、吸着音(クリック音)は日本語の音声には存在しません。"},

{id:"R1-3-2", tag:"R1 試験I 問題3-A(2)", cat:"音声学:声門",
 text:"(2) 文章中の下線部B「声門」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["有声音は,ほぼ閉じた声門を呼気が通過し声帯が振動している。","ささやき声は,声門が呼吸時と同様に開き声帯が振動している。","息を吸うときは,声門が閉まっていて声帯は振動していない。","息もれ音は,声門が大きく開いていて声帯は振動していない。"], answer:0,
 explain:"有声音は、声門がほぼ閉じた状態を呼気が通過することで声帯が振動して生じます。ささやき声は声帯が振動せず声門は呼吸時ほど大きく開いていません。息を吸うときは声門は開いています。息もれ音は声門が広めに開いていますが声帯はわずかに振動しています。"},

{id:"R1-3-3", tag:"R1 試験I 問題3-A(3)", cat:"音声学:調音",
 text:"(3) 文章中の下線部C「調音」に関して、日本語の共通語にないものを、次の1〜4の中から一つ選べ。",
 choices:["両唇破裂音","歯茎ふるえ音","硬口蓋接近音","声門摩擦音"], answer:1,
 explain:"日本語共通語のラ行子音は弾き音であり、巻き舌のような歯茎ふるえ音(トリル)は用いられません。両唇破裂音(パ・バ行)、硬口蓋接近音(ヤ行)、声門摩擦音(ハ行)はいずれも日本語に存在します。"},

{id:"R1-3-4", tag:"R1 試験I 問題3-A(4)", cat:"音声学:気流",
 text:"(4) 文章中の下線部D「違い」とはどのような違いか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["気流の流れをいつ妨げるかの違い","気流の流れをどこで妨げるかの違い","気流の流れをどう妨げるかの違い","気流の流れを妨げるか妨げないかの違い"], answer:3,
 explain:"子音は調音器官によって気流の流れを妨げる(阻害する)のに対し、母音は気流を妨げずに通過させる点が本質的な違いです。"},

{id:"R1-3-5", tag:"R1 試験I 問題3-A(5)", cat:"音声学:帯気性",
 text:"(5) 文章中の下線部E「帯気性」が弁別機能を持つ言語の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["韓国語とスペイン語","韓国語と日本語","中国語とベトナム語","中国語と英語"], answer:2,
 explain:"有気音と無気音の対立が意味の区別に関わる(弁別機能を持つ)言語には中国語・韓国語・タイ語・ベトナム語などがあります。選択肢の中で両方の言語がこの対立を持つ組み合わせは中国語とベトナム語です。日本語・スペイン語・英語では帯気性は弁別的ではありません。"},

{id:"R1-3-6", tag:"R1 試験I 問題3-B(6)", cat:"語彙:オノマトペ",
 text:"B 【オノマトペ(擬音語・擬態語)】\nオノマトペは特殊な語彙である。普通,言語記号は音形と意味との間に必然的な関係がないとされる。しかし,オノマトペは,音形とそれが与えるイメージにある程度の有縁性が感じられる。例えば,日本語では(ア)は「軽さ」や「弱さ」と,(イ)は「重さ」や「強さ」と結びつく。\n日本語研究において,オノマトペは擬音語と擬態語に分類されている。実際に用いるときは,形態素を重ねた「ぴかぴか」のようにゼロ形態で,あるいは「と」や「に」が後接した形で副詞的に使われることが多い。また,2拍の形態素に接尾辞が後接して動詞として使用されるものもある。\n\n(6) 文章中の下線部A(「言語記号は音形と意味との間に必然的な関係がない」)の内容を表す術語として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["言語記号の蓋然性","言語記号の恣意性","言語記号の経済性","言語記号の構成性"], answer:1,
 explain:"音形と意味の間に必然的な結びつきがないという性質は、ソシュール以来「言語記号の恣意性」と呼ばれます。"},

{id:"R1-3-7", tag:"R1 試験I 問題3-B(7)", cat:"語彙:オノマトペ",
 text:"(7) 文章中の(ア)と(イ)に入れるのに最も適当な組み合わせを、次の1〜4の中から一つ選べ。",
 choices:["(ア)清音 / (イ)濁音","(ア)母音 / (イ)子音","(ア)ア列の音 / (イ)イ列の音","(ア)ウ列の音 / (イ)オ列の音"], answer:0,
 explain:"日本語のオノマトペには、清音は「軽さ・弱さ」、濁音は「重さ・強さ」と結びつく音象徴が見られます(例:コロコロ〈軽い〉/ゴロゴロ〈重い〉)。"},

{id:"R1-3-8", tag:"R1 試験I 問題3-B(8)", cat:"語彙:オノマトペ",
 text:"(8) 文章中の下線部B「擬態語」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ひそひそ耳打ちをした。","彼の提案をしぶしぶ承諾した。","ふらふら歩き出した。","雷がごろごろ鳴っていた。"], answer:2,
 explain:"「ごろごろ」は雷の実際の音を写した擬音語です。「ひそひそ」は声の調子(音的要素)を伴い、「しぶしぶ」は心理的な様子(擬情語的)を表すのに対し、「ふらふら」は体の動き・様子を音を伴わずに表す典型的な擬態語です。"},

{id:"R1-3-9", tag:"R1 試験I 問題3-B(9)", cat:"語彙:オノマトペ",
 text:"(9) 文章中の下線部Cに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「がさがさと/がさがさに」のように,「と」が擬態語,「に」が擬音語の用法に対応する。","「びりびり/びりびりと」のように,ゼロ形態が擬音語,「と」が擬態語の用法に対応する。","「ぎゃあぎゃあと」のように,結果を修飾する擬態語の用法では「と」が使用される。","「かちんかちんに」のように,結果を修飾する擬態語の用法では「に」が使用される。"], answer:3,
 explain:"「かちんかちんに凍る」のように、動作・変化の結果として生じた状態を修飾する擬態語の用法では、助詞「に」が使われます。「と」は主に様態(動作の進行中の様子)を表す用法で使われます。"},

{id:"R1-3-10", tag:"R1 試験I 問題3-B(10)", cat:"語彙:オノマトペ",
 text:"(10) 文章中の下線部Dの接尾辞の例として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["つく","めく","なる","ばる"], answer:2,
 explain:"「ぐらつく」「ひらめく」「角ばる」のように、「つく」「めく」「ばる」は2拍の擬態語的形態素に付いて動詞を作る接尾辞です。「なる」はそれ自体が独立した動詞であり、このような接尾辞の例としては不適当です。"},

{id:"R1-3-11", tag:"R1 試験I 問題3-C(11)", cat:"文法:取り立て助詞",
 text:"C 【取り立て助詞「も」】\n日本語は膠着語である。そのため,助詞が重要な役割を果たす。その中でも,文中の要素を取り立てる働きがある助詞を取り立て助詞という。取り立て助詞の用法にはいろいろあり,例えば,「も」は(ア)が基本的な用法である。取り立て助詞が取り立てるのは,取り立て助詞の直前の名詞句であるのが普通である。しかし,直前の要素だけでなく,命題を取り立てる場合もある。さらに「も」には「意外さ」の用法もあり,この用法は他の取り立て助詞にも見られる。\n\n(11) 文章中の下線部A「助詞」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["のだ","もう","より","こと"], answer:2,
 explain:"「より」は比較を表す格助詞です。「のだ」は文末表現(モダリティ形式)、「もう」は副詞、「こと」は形式名詞であり、助詞そのものの例としては「より」が適当です。"},

{id:"R1-3-12", tag:"R1 試験I 問題3-C(12)", cat:"文法:取り立て助詞",
 text:"(12) 文章中の下線部B「取り立て助詞」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["名詞句と名詞句を結びつけ、その間の並列的な関係を表す。","述部の後ろに付き、聞き手や出来事に対する話し手の態度を表す。","文中の名詞句と述部を結びつけ、その意味的・統語的関係を表す。","文中のある要素に焦点を当て、暗示された要素との関係を表す。"], answer:3,
 explain:"取り立て助詞は、文中のある要素を取り出して焦点を当て、他の(明示されない)要素との対比・関係を暗示する働きを持ちます。これが取り立て助詞の基本的な性質です。"},

{id:"R1-3-13", tag:"R1 試験I 問題3-C(13)", cat:"文法:取り立て助詞",
 text:"(13) 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["並立","共起","類似","対比"], answer:0,
 explain:"「も」の最も基本的な用法は、同類の事柄を並べて述べる「並立」の用法です(例:りんごも食べる、みかんも食べる)。"},

{id:"R1-3-14", tag:"R1 試験I 問題3-C(14)", cat:"文法:取り立て助詞",
 text:"(14) 文章中の下線部Cの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["この小説は,早くも続編が出版され来年にも映画化されるようだ。","この車は日本でも評判がよいが,海外でもよいようだ。","彼が来ても来なくても,彼女は気にも留めてないようだった。","頭も冷やしたし,薬も飲んだがなかなか熱が引かない。"], answer:3,
 explain:"「頭も冷やしたし、薬も飲んだが」は、個々の名詞句だけでなく「頭を冷やした」「薬を飲んだ」という命題(出来事)全体を取り立てて並べている例であり、命題を取り立てる用法にあたります。他の選択肢は名詞句を取り立てる例です。"},

{id:"R1-3-15", tag:"R1 試験I 問題3-C(15)", cat:"文法:取り立て助詞",
 text:"(15) 文章中の下線部D「意外さ」の用法に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「子どもでもできる」の「でも」は,意外性を表す場合に「たとえ」と共起できない。","「子どもが5人も生まれた」の「数量詞+も」は,話し手の期待や予測より大きな数量を表す。","「子どもさえ知っている」の「さえ」は,意外性を表す場合に特別な文脈を必要とする。","「子どもまで駆り出される」の「まで」は,取り立てる要素と暗示される対象との間に連続性があると使えない。"], answer:1,
 explain:"「数量詞+も」が意外さ(予想より多い・大きい)を表す用法は「も」の典型的な特徴です。「子どもが5人も生まれた」は、話し手の予測を上回る数量であったことを示しています。"},

{id:"R1-3-16", tag:"R1 試験I 問題3-D(16)", cat:"文法:モダリティ",
 text:"D 【モダリティ】\nモダリティの捉え方には様々なものがあるが,一般言語学の研究においては,これを大きく二つに分けるという見方がある。\n一つは,認識的(エピステミック)モダリティと呼ばれ,事態の真偽に対する判断に関わるものを表す。〈確信〉を表す「にちがいない」と「はずだ」はどちらも認識的(エピステミック)モダリティであるが,両者には意味の違いがある。前者は(ア)的な意味も表せるのに対し,後者はより(イ)的だと言われる。また,述部の認識的(エピステミック)モダリティに対して働く副詞として,「たぶん」「もしかして」などがある。\nもう一つは,拘束的(デオンティック)モダリティと呼ばれ,主語に課せられた拘束(〈必要〉)または拘束からの免除(〈許可〉)を表す。その前者の例として「(ウ)」,後者の例として「(エ)」がある。\n\n(16) 文章中の下線部A「認識的(エピステミック)モダリティ」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["そうするべきだ。","それでいいのだ。","そんなことやめなさい。","そんなことはあるまい。"], answer:3,
 explain:"「まい」は打消推量を表し、事態の真偽に対する話し手の判断(認識的モダリティ)にあたります。「べきだ」は当為(拘束的モダリティ寄り)、「のだ」は説明のモダリティ、「なさい」は命令であり、認識的モダリティの例としては「あるまい」が適当です。"},

{id:"R1-3-17", tag:"R1 試験I 問題3-D(17)", cat:"文法:モダリティ",
 text:"(17) 文章中の(ア)と(イ)に入れるのに最も適当な組み合わせを、次の1〜4の中から一つ選べ。",
 choices:["(ア)間接 / (イ)直接","(ア)直感 / (イ)論理","(ア)婉曲 / (イ)断定","(ア)客観 / (イ)主観"], answer:1,
 explain:"「にちがいない」は話し手の直感的な確信を、「はずだ」はより論理的な根拠に基づく判断を表すとされ、この対比が言語学的な説明としてよく用いられます。"},

{id:"R1-3-18", tag:"R1 試験I 問題3-D(18)", cat:"文法:モダリティ",
 text:"(18) 文章中の下線部B「述部の認識的(エピステミック)モダリティに対して働く副詞」の例として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["こんなチャンスはめったにないだろう。","この企画は,どうやら中止になるらしい。","まさか,会社は辞めていないよね。","きっと1年後にはその成果が分かるよ。"], answer:0,
 explain:"「どうやら」「まさか」「きっと」は、文末の認識的モダリティ表現(らしい・よね・よ等)と呼応して話し手の真偽判断を表す陳述副詞です。一方「めったに」は頻度の低さを表す副詞であり、認識的モダリティに呼応する働きは持たないため、この用法の例としては不適当です。"},

{id:"R1-3-19", tag:"R1 試験I 問題3-D(19)", cat:"文法:モダリティ",
 text:"(19) 文章中の下線部C「拘束的(デオンティック)モダリティ」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["聞き手への要求を表すため,基本的に話し手自身の行為の意向は表せない。","基本的にモダリティ形式の前にル形とタ形のテンス対立を持たない。","述語構造において,認識的(エピステミック)モダリティに後続する。","動作の主体を表す主語が二人称でなければならないという制限を持つ。"], answer:1,
 explain:"拘束的(デオンティック)モダリティ(必要・許可)は、基本的に非過去(ル形)への接続が中心で、ル形とタ形のテンス対立を持たないという特徴があります。"},

{id:"R1-3-20", tag:"R1 試験I 問題3-D(20)", cat:"文法:モダリティ",
 text:"(20) 文章中の(ウ)と(エ)に入れるのに最も適当な組み合わせを、次の1〜4の中から一つ選べ。",
 choices:["(ウ)なくていい / (エ)ほうがいい","(ウ)なくていい / (エ)てもいい","(ウ)なくてはいけない / (エ)ほうがいい","(ウ)なくてはいけない / (エ)てもいい"], answer:3,
 explain:"(ウ)には〈必要〉(拘束)の例として「なくてはいけない」、(エ)には〈許可〉(拘束からの免除)の例として「てもいい」が入ります。"},

{id:"R1-4-1", tag:"R1 試験I 問題4 問1", cat:"教授法:教育環境とリソース",
 text:"次の文章を読み、下の問い(問1〜5)に答えよ。\n\n教育環境は学習者の言語活動に影響を与える大きな要素である。そのため,授業を計画する際には,教室内外の人的リソース,物的リソース,社会的リソースの状況を考慮するとよい。\n初級の授業の具体的な教室活動について考えると,学習者とコミュニケーションを図りやすくするために簡略化した話し方で指導が行われることがある。教師の質問の仕方は学習意欲に影響を与えるため,授業の目的に合わせた使い分けが必要である。また,学習者に余計なストレスを与えないよう,板書にも工夫が求められる。理解を促進するために,絵教材を使うことも有効である。\n\n問1 文章中の下線部A「社会的リソース」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["同じクラスの学習者仲間","地域のボランティア活動","デパートの展覧会","テレビのニュース番組"], answer:1,
 explain:"社会的リソースとは、学習者が言語を使う場となる地域社会の人間関係や活動などを指します。「地域のボランティア活動」は学習者が社会に参加して言語を使う機会となる社会的リソースの例です。同じクラスの学習者仲間は人的リソース、デパートの展覧会やテレビ番組は物的(メディア的)リソースにあたります。"},

{id:"R1-4-2", tag:"R1 試験I 問題4 問2", cat:"教授法:ティーチャートーク",
 text:"問2 文章中の下線部B「学習者とコミュニケーションを図りやすくするために簡略化した話し方」として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ティーチャー・トーク","ラポート・トーク","ケアテイカー・スピーチ","インナー・スピーチ"], answer:0,
 explain:"教師が第二言語学習者に対して行う、語彙や文法を簡略化した話し方は「ティーチャー・トーク」と呼ばれます。ケアテイカー・スピーチは養育者が幼児に対して用いる話し方、ラポート・トークは人間関係構築のための会話スタイル、インナー・スピーチは内言(心の中の思考言語)を指し、いずれも文脈が異なります。"},

{id:"R1-4-3", tag:"R1 試験I 問題4 問3", cat:"教授法:発問",
 text:"問3 文章中の下線部C「質問の仕方」に関して、「指示質問」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["正しく文が作れるかどうかを確認する質問","教師が知らない情報を尋ねる質問","場面を提示し、推論を促して答えさせる質問","読解文の内容に関する事実関係を尋ねる質問"], answer:1,
 explain:"指示質問(レファレンシャル・クエスチョン)は、教師自身がまだ答えを知らない、実際の情報を求める質問です。これに対し、教師が既に答えを知っている質問(文法確認や読解内容の事実確認など)はディスプレイ・クエスチョンと呼ばれ、選択肢1・4はこちらに該当します。"},

{id:"R1-4-4", tag:"R1 試験I 問題4 問4", cat:"教授法:板書",
 text:"問4 文章中の下線部D「板書」の際の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["授業の内容がよく分かるように、例文や説明をたくさん書く。","書き写す負担を軽減するため、出てきた単語を記すに留める。","書く内容はあらかじめ想定せず、学習者の反応によって決める。","教案を作成する段階で、いつ何を書くかを計画しておく。"], answer:3,
 explain:"効果的な板書のためには、授業前の教案作成の段階で、いつ・何を・どのように書くかをあらかじめ計画しておくことが望ましいとされます。情報を詰め込みすぎたり、その場任せにしたりすることは、学習者の負担や混乱につながります。"},

{id:"R1-4-5", tag:"R1 試験I 問題4 問5", cat:"教授法:絵教材",
 text:"問5 文章中の下線部E「絵教材」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["どの絵教材を使うか決めて提示順に並べておき、テンポよく見せる。","絵で文型を導入するときは、全ての絵教材を授業開始前に黒板に張っておく。","分かりづらくても教師が自分で描いた絵を使い、学習者の興味を引くようにする。","絵で単語を導入するときは、その事物と周囲の物が細かく描かれたものを使う。"], answer:0,
 explain:"絵教材は使用する順番をあらかじめ決めて準備しておき、テンポよく提示することが授業の流れを妨げず効果的です。全て事前に張り出す、分かりにくい絵をあえて使う、周囲の情報を詰め込みすぎるといったやり方は、かえって学習者の理解を妨げます。"},

{id:"R1-5-1", tag:"R1 試験I 問題5 問1", cat:"教材論:シラバス",
 text:"問題5 教材に関する次の問い(問1〜5)に答えよ。\n\n問1 技能シラバスによる教材の目次として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「申込書に記入する」「メモを取る」「メールを作成する」","「空港の案内所で」「駅の窓口で」「市役所の受付で」","「謝る」「断る」「依頼する」","「家族」「趣味」「スポーツ」"], answer:0,
 explain:"技能シラバスは、読む・書く・聞く・話すといった具体的な言語技能やタスク(できること)を基準に構成されます。「申込書に記入する」「メモを取る」「メールを作成する」はいずれも具体的な技能・タスクです。他は場面シラバス(2)、機能シラバス(3:謝る・断るなどの言語機能)、話題シラバス(4:トピック別)の例にあたります。"},

{id:"R1-5-2", tag:"R1 試験I 問題5 問2", cat:"教材論:教材の要素",
 text:"問2 教材には時間の経過とともに時世に合わなくなる要素がある。教材を構成する要素のうち、最も時世の影響を受けにくいものを、次の1〜4の中から一つ選べ。",
 choices:["読み物のトピック","会話の場面","文法","語彙"], answer:2,
 explain:"文法体系は比較的普遍的で、時代による変化が少ない要素です。一方、読み物のトピックや会話の場面、語彙(特に流行語や新語)は時代とともに古びやすく、教材の改訂が必要になりやすい部分です。"},

{id:"R1-5-3", tag:"R1 試験I 問題5 問3", cat:"教材論:モデル会話",
 text:"問3 初級のモデル会話を作成する際の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本語母語話者がその場面で用いる表現をレベルは意識せず使用する。","学習者が自分の言いたい表現に置き換えて応用できるような会話にする。","素材として日本語母語話者の会話を用いる場合、やり取りを簡素化しない。","話の内容や展開が不自然になっても、既習文型の範囲で作成する。"], answer:1,
 explain:"初級のモデル会話は、学習者が自分の状況や言いたいことに置き換えて応用できるよう作成することが重要です。母語話者の表現をレベルを無視してそのまま使う、やり取りを簡素化しない、不自然な内容になっても既習文型に固執する、といったやり方は初級教材として適切ではありません。"},

{id:"R1-5-4", tag:"R1 試験I 問題5 問4", cat:"教材論:聴解教材",
 text:"問4 中級の聴解教材を作成する際の留意点として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["語彙の偏りを防ぎ背景知識が増やせるように、幅広い分野からトピックを選ぶ。","聞き取りのスキルやストラテジーが身につくように、タスクを作成する。","談話の論理的な組み立てに気づけるように、一貫性のあるテクストを選ぶ。","内容を正確に聞き取れるように、モダリティなど心的態度を表す表現は避ける。"], answer:3,
 explain:"実際の談話にはモダリティなど話者の心的態度を表す表現が自然に含まれており、これを理解することも聴解力の重要な一部です。意図的に避けることは、かえって自然な聴解教材としては不適当な方針です。他の3つはいずれも中級聴解教材作成の適切な留意点です。"},

{id:"R1-5-5", tag:"R1 試験I 問題5 問5", cat:"教材論:生教材",
 text:"問5 授業での生教材の扱い方として真正性が保たれている例はどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["スーパーのちらしを用いて、文字種の使い分けに気づかせる。","菓子類の食品表示を用いて、賞味期限やアレルギー食材を確認させる。","駅のアナウンスを用いて、乗客に対する敬語表現に気づかせる。","折り紙の本を用いて、手順を説明する表現や文型を確認させる。"], answer:1,
 explain:"生教材(本物の実物教材)の真正性(オーセンティシティ)は、その教材が本来使われる目的通りに使用されることで保たれます。食品表示を用いて実際に賞味期限やアレルギー食材を確認するのは、本来の使用目的に沿った使い方です。他の選択肢は、ちらしを読んで買い物する・アナウンスを聞いて行動する・折り紙を折るという本来の目的から離れ、言語形式(文字種・敬語・文型)の学習だけに用いており、真正性という点では劣ります。"},

{id:"R1-6-1", tag:"R1 試験I 問題6 問1", cat:"作文指導:制限作文アプローチ",
 text:"問題6 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n現在の日本語教育における書くことの指導には,様々な指導法が取り入れられている。例えば,初級で行われる制限作文アプローチによる作文教育は,口頭練習で形成された習慣を強化する目的で1950年代に用いられていたものである。また,1970年代に拡大したレトリック・アプローチの考え方を基にした指導は,現在も中級で行われている。このレトリック・アプローチとは,文章を読ませ,各段落の構造を分析したうえで,その談話のパターンを基に作文を書かせるというものである。さらに,1980年代に生まれたプロセス・アプローチは,一定の長さの産出が求められる中・上級の作文指導に取り入れられている。そして,1990年代後半には,ピア活動を取り入れた作文教育が登場した。\n\n問1 文章中の下線部A「制限作文アプローチ」の背景にある言語教育の考え方として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["グアン・メソッド","オーディオ・リンガル・メソッド","コミュニカティブ・アプローチ","ナチュラル・アプローチ"], answer:1,
 explain:"制限作文アプローチは、口頭練習で形成された言語習慣を書く活動でも強化することを目的としており、これはオーディオ・リンガル・メソッド(構造言語学と行動主義心理学に基づき、パターン・プラクティスによる習慣形成を重視する教授法)の考え方と一致します。"},

{id:"R1-6-2", tag:"R1 試験I 問題6 問2", cat:"作文指導:レトリックアプローチ",
 text:"問2 文章中の下線部B(レトリック・アプローチ)の練習として次のパターンを用いた。どのような機能の指導を目的としたものか。最も適当なものを、下の1〜4の中から一つ選べ。\n\n「AとBは両者とも〜〜〜〜〜だが,〜〜〜〜〜という点から見ると,Aは〜〜〜〜〜である。一方,Bは〜〜〜〜〜である。」",
 choices:["原因・結果","比較・対照","前方照応","手順説明"], answer:1,
 explain:"「AとBは両者とも〜だが、〜という点から見ると…」という型は、2つの対象の共通点を示したうえで相違点を対比的に述べる、典型的な「比較・対照」の談話パターンです。"},

{id:"R1-6-3", tag:"R1 試験I 問題6 問3", cat:"作文指導:プロセスアプローチ",
 text:"問3 文章中の下線部C「プロセス・アプローチ」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["提示されたテーマについて制限時間内に思いついた順に書くこと","語彙や文型を段階的に増やし、正確さに注意しながら書くこと","推敲を繰り返し、思考を創造的に深めながら意見などを書くこと","専門領域に特有の表現や文章構造のパターンを利用して書くこと"], answer:2,
 explain:"プロセス・アプローチは、完成した作文(プロダクト)だけでなく、下書き・推敲(見直し・書き直し)を繰り返しながら思考を深めていく「書くプロセス」自体を重視する指導法です。"},

{id:"R1-6-4", tag:"R1 試験I 問題6 問4", cat:"作文指導:引用",
 text:"問4 文章中の下線部D「中・上級の作文指導」に関して、「引用」の指導が必要な文はどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学校教育における重要な点は、子どもたちに学習を押しつけない。","川崎市は、重工業が発展した地域にとって知られているということである。","日本人は自分の意見をうまく表す、ああいう機会が少なかったのだと思われる。","山口によれば、専門家になるためには大学時代が重要だと指摘している。"], answer:3,
 explain:"「山口によれば〜と指摘している」は、他者(山口)の見解を出典として示しながら述べる引用の形式です。中・上級の作文指導では、このように他の情報源を適切に示す「引用」の技術指導が必要になります。他の選択肢は文法的な誤りや不自然さの問題であり、引用とは直接関係しません。"},

{id:"R1-6-5", tag:"R1 試験I 問題6 問5", cat:"作文指導:ピアレスポンス",
 text:"問5 文章中の下線部E「ピア活動を取り入れた作文教育」に関して、ピア・レスポンスの説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["作文を交換し、学習者同士でフィードバックを行う協働的な活動","学習者が学習支援者とペアになってサポートを得ながら行う活動","聞いたテクストを学習者同士で確認しながらテクストを復元する活動","調査した結果を持ち寄り、学習者で分担してレポートを作成する活動"], answer:0,
 explain:"ピア・レスポンスとは、学習者同士が互いの作文を読み合い、感想や意見などのフィードバックを与え合う協働的な活動を指します。教師ではなく学習者同士(ピア)が評価し合う点が特徴です。"},

{id:"R1-7-1", tag:"R1 試験I 問題7 問1", cat:"ICT活用:e-learning",
 text:"問題7 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本語教育において,e-learningの活用が進んでいる。e-learningにはインターネットにより動画や教材を配信する非同期型と,教師が行う授業をリアルタイムで遠隔地に配信する同期型がある。e-learningの広がりとともに反転授業など新たな教育方法も注目を集めている。e-learningを用いることで様々な教育活動が生まれつつあるが,その効果や効率を上げるためにインストラクショナル・デザイン(ID)の理論を活用することも有用である。ICT機器の操作性向上により,専門的な知識を持たない日本語教師でもデジタル教材の作成が可能となったが,教師が教室活動の一環でウェブサイト(ウェブ)上のリソースを活用する際には,著作権を十分に考慮する必要がある。\nまた,ウェブ上で受験可能な,項目応答理論(IRT)を用いたテスト等も見られるようになった。こうして,ICTの発達は,日本語教育の環境と方法に大きな変化をもたらしている。\n\n問1 文章中の下線部A「非同期型」のe-learningの問題点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["自律的に学ぶ力が必要なため、学習者によっては学習の継続が難しい。","従来の紙媒体の教材と比較して、学習者は知識の獲得が難しい。","解答の正誤判定がすぐに得られず、学習者が学習を振り返りにくい。","学習の時間と場所が自由なため、教師が学習状況を把握しにくい。"], answer:0,
 explain:"非同期型のe-learningは自分のペースで学べる反面、学習者自身に自律的な学習管理能力が求められ、継続が難しくなる学習者もいるという問題点があります。"},

{id:"R1-7-2", tag:"R1 試験I 問題7 問2", cat:"ICT活用:反転授業",
 text:"問2 文章中の下線部B「反転授業」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["教室外で基礎知識を個別に学習しておき、教室ではその確認と応用を行う。","学習者が予習した内容を教師役になって教え、最後に教師が補足する。","母語の異なる二人がペアになり、互いの得意な言語を交替して教え合う。","教科書を用いず、音声や動画などのマルチメディア教材を用いて授業を行う。"], answer:0,
 explain:"反転授業(フリップド・クラスルーム)は、講義など基礎的な知識の習得を教室外(動画視聴など)で個別に済ませておき、教室ではその確認や、より発展的な応用・演習活動に時間を使う授業形態です。"},

{id:"R1-7-3", tag:"R1 試験I 問題7 問3", cat:"ICT活用:ADDIEモデル",
 text:"問3 文章中の下線部C「インストラクショナル・デザイン(ID)の理論」の一つにADDIEモデルがある。その説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["情報処理モデルに基づき、学びの支援に関して九つの教授事象を示したもの","教育の目標とする領域を認知、情意、精神運動領域の三つに分類して示したもの","分析、設計、開発、実施、評価という教育・教材の設計プロセスを示したもの","学習者の意欲向上のためのポイントを学習目標と関連させて示したもの"], answer:2,
 explain:"ADDIEモデルは、Analysis(分析)・Design(設計)・Development(開発)・Implementation(実施)・Evaluation(評価)の頭文字を取ったもので、教育・教材設計の基本的なプロセスを示すインストラクショナル・デザインの代表的モデルです。"},

{id:"R1-7-4", tag:"R1 試験I 問題7 問4", cat:"ICT活用:著作権",
 text:"問4 文章中の下線部Dに関して、著作権者に無断で行っても著作権の侵害にならない例を、次の1〜4の中から一つ選べ。",
 choices:["ウェブ上の文章を使用した模擬テストをe-learningのシステムにアップする。","ウェブ上の動画を教室外でも視聴できるように動画のURLをSNSにアップする。","ウェブ上の著作権登録がされていないデジタル教材を選んで使用する。","ウェブ上の写真やイラストの一部を切り取ってデジタル教材を作成する。"], answer:1,
 explain:"動画のURL(リンク)をSNSに掲載する行為は、著作物自体を複製・改変・公開しているわけではなく、単に所在を示しているだけなので、原則として著作権侵害にはあたりません。他の選択肢はいずれも著作物の複製・改変にあたり、著作権登録の有無にかかわらず著作権は自動的に発生しているため、無断使用は侵害となり得ます。"},

{id:"R1-7-5", tag:"R1 試験I 問題7 問5", cat:"ICT活用:項目応答理論",
 text:"問5 文章中の下線部E「項目応答理論(IRT)」を用いることで可能になることとして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["正答数・解答時間などを分析して信頼性の高い評価結果が得られる。","種類の異なる複数のテストの難易度を均一に調整することができる。","初めて使用する小テストでも信頼性の高い評価結果が得られる。","実施回の異なる大規模テストの結果を共通の基準で比較できる。"], answer:3,
 explain:"項目応答理論(IRT)は、各テスト項目の困難度や識別力をパラメータとして推定し、共通の尺度上で受験者の能力を評価できる統計モデルです。これにより、実施回や問題セットが異なるテスト同士でも、結果を共通の基準で比較することが可能になります。"},

{id:"R1-8-1", tag:"R1 試験I 問題8 問1", cat:"異文化コミュニケーション",
 text:"問題8 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n留学生が増加し,国籍や文化的な背景も多様化している昨今,日本語教育関係者や各機関の留学生担当者は,日本や留学生の出身国の文化におけるコミュニケーション・スタイルの特徴や傾向を理解しておく必要がある。規範とされるコミュニケーション・スタイルは文化によって異なり,バーバル・コミュニケーションだけでなく,ノンバーバル・コミュニケーションにも文化的な差異があるためである。\nそれゆえ,異文化コミュニケーションにおいては,互いの文化を認め合うことが重要であり,エポケーなどのスキルが必要となる。さらに,アサーティブ・コミュニケーションなども求められる。このようなスキルを身につけるためには,カルチャー・アシミレーターなどのトレーニングの実践が有効である。\n\n問1 文章中の下線部A「コミュニケーション・スタイルの特徴や傾向」に関して、日本的な特徴として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["意見を簡潔に述べたあとに理由を論理的に説明する直線的なスタイル","余計な情報は省き、必要な情報について言葉を尽くす石畳的なスタイル","相手が察してくれることを期待して婉曲的に話す螺旋的なスタイル","年齢差や社会的立場の違いを感じさせないインフォーマルなスタイル"], answer:2,
 explain:"日本語のコミュニケーションは高コンテクスト文化の特徴を持つとされ、はっきりと言い切らず、聞き手の推察・察しに委ねる婉曲的・螺旋的なスタイルが特徴として挙げられます。"},

{id:"R1-8-2", tag:"R1 試験I 問題8 問2", cat:"異文化コミュニケーション",
 text:"問2 文章中の下線部B「バーバル・コミュニケーション」に分類されるものはどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["書き言葉","パラ言語","ジェスチャー","相手との距離"], answer:0,
 explain:"バーバル・コミュニケーションは言語(言葉)そのものによるコミュニケーションを指し、「書き言葉」がこれに該当します。パラ言語(声の高さ・調子など)、ジェスチャー、相手との距離(対人距離)は、いずれも言語以外の要素であるノンバーバル・コミュニケーションに分類されます。"},

{id:"R1-8-3", tag:"R1 試験I 問題8 問3", cat:"異文化コミュニケーション",
 text:"問3 文章中の下線部C「エポケー」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["自分の過去の体験や価値観と照らし合わせて相手の体験を想像すること","相手の話に対して、自分の判断や評価をいったん保留して物事を認識すること","相手の置かれた境遇や状況を相手の立場や物の見方で捉えること","自分の好き嫌いや考えなどについて、相手に心を開いて積極的に伝えること"], answer:1,
 explain:"エポケー(判断保留・判断中止)は現象学に由来する概念で、自分の価値観や先入観による判断を一旦保留し、物事をありのまま認識しようとする態度を指します。"},

{id:"R1-8-4", tag:"R1 試験I 問題8 問4", cat:"異文化コミュニケーション",
 text:"問4 文章中の下線部D「アサーティブ・コミュニケーション」を行ううえで重要なこととして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["相手に共感を示したうえで自分の意見を言う。","問題解決を図るために相手の意見に合わせる。","相手との意見の相違を明確にするのを避ける。","強い主張はせず相手が察してくれるのを待つ。"], answer:0,
 explain:"アサーティブ・コミュニケーションは、相手を尊重し共感を示しながらも、自分の意見や気持ちを率直に伝えるコミュニケーションのあり方です。相手に合わせすぎたり、対立を避けたり、主張せず察してもらうのを待つことはアサーティブとは言えません。"},

{id:"R1-8-5", tag:"R1 試験I 問題8 問5", cat:"異文化コミュニケーション",
 text:"問5 文章中の下線部E「カルチャー・アシミレーター」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ある使命が与えられ、限られた言葉と身振り手振りのみでその使命を果たす。","二つの仮想文化圏に分かれ、それぞれの文化を学習したあと、相互に交流する。","文化背景が異なる人同士でペアになり、自分たちでテーマを決め自由に話し合う。","問題事例を読み、選択肢の中から自分の考えに合うものを選び、理由を考える。"], answer:3,
 explain:"カルチャー・アシミレーター(文化同化装置)は、異文化間の誤解を含む事例(クリティカル・インシデント)を読み、複数の解釈の選択肢の中から適切と思うものを選んでその理由を考える、という形式の異文化理解トレーニング手法です。"},

{id:"R1-9-1", tag:"R1 試験I 問題9 問1", cat:"語彙:メンタルレキシコン",
 text:"問題9 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n文や発話は語の組み合わせによって成り立つ。語には複数の意味を持つものが多く,その意味にはプロトタイプ的なものとそうでないものがあり,相互に関連性を持っている。しかし,その関連性が学習者には推測しづらい場合もある。\n語の情報は脳の中にあるメンタル・レキシコン(心的辞書)に収められており,文や発話を理解する際に,そこにアクセスして文脈に合う語の意味を特定する。語の知識が十分でないと,文や発話を正しく理解できないだけでなく,発話の際に「このハンガーに服を付けてください」のような誤りが生じる。\n学習者の語彙知識を増やす方法の一つとしてキーワード法が効果的だと言われている。また,読解における語彙指導の際には学習者の認知的な負荷への考慮も必要である。\n\n問1 文章中の下線部Aに関して、「落とす」がプロトタイプ的な意味で用いられている例はどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["洗剤で服のしみを落とした。","不祥事で信用を落とした。","スコップで屋根の雪を落とした。","模擬試験で順位を落とした。"], answer:2,
 explain:"「落とす」の最も基本的(プロトタイプ的)な意味は、物理的な力によって対象を高い所から低い所へ落下させることです。「屋根の雪を落とす」はこの最も具体的・literal(文字通り)な意味での使用例にあたります。「しみを落とす」は「取り除く」という意味へのやや拡張された用法、「信用を落とす」「順位を落とす」は抽象的な対象への比喩的拡張であり、いずれもプロトタイプ的な用法からは離れます。"},

{id:"R1-9-2", tag:"R1 試験I 問題9 問2", cat:"語彙:メンタルレキシコン",
 text:"問2 文章中の下線部B「メンタル・レキシコン(心的辞書)」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["第一言語も第二言語も語の形式や意味情報のネットワークが構築される。","日本語は50音順、英語はアルファベット順で情報が整理されている。","一般に成人日本語母語話者の語彙数は5,000語前後とされている。","古い情報から新しい情報への改訂はその都度行われず、時間を要する。"], answer:0,
 explain:"メンタル・レキシコンは、語の形式(音韻・表記)や意味に関する情報が網目状(ネットワーク状)に結びついて脳内に蓄積されているという考え方であり、第一言語・第二言語のいずれにおいてもこのようなネットワークが構築されます。50音順やアルファベット順のような単純な配列ではなく、また新しい情報は随時更新されると考えられています。"},

{id:"R1-9-3", tag:"R1 試験I 問題9 問3", cat:"語彙:コロケーション",
 text:"問3 文章中の下線部C「『このハンガーに服を付けてください』のような誤り」は何に関する知識が欠如していることによるものか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ダイクシス","コロケーション","語構成","転成"], answer:1,
 explain:"「服をハンガーに掛ける」という慣用的な語と語の組み合わせ(コロケーション)の知識が不足しているために、「付ける」という不自然な動詞を選んでしまったと考えられます。"},

{id:"R1-9-4", tag:"R1 試験I 問題9 問4", cat:"語彙:キーワード法",
 text:"問4 文章中の下線部D「キーワード法」の方法として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["覚えたい語と音声的に類似した母語の言葉のイメージを関連づけて覚える。","覚えたい語から連想される言葉を複数考えて、それらと結びつけて覚える。","覚えたい語の母語訳を見て、目標言語で産出できるか自分でテストする。","覚えたい語をトピックや品詞ごとに整理して、語彙専用ノートに記録する。"], answer:0,
 explain:"キーワード法は、覚えたい目標言語の単語と音が似ている母語の単語(キーワード)を思い浮かべ、そのキーワードのイメージと意味を視覚的に結びつけて記憶する語彙学習法です。"},

{id:"R1-9-5", tag:"R1 試験I 問題9 問5", cat:"語彙:読解指導",
 text:"問5 文章中の下線部Eに関して、読解の授業における新出語の扱い方として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["内容理解に重要で意味の推測が難しい語は事前に指導する。","内容理解に重要で意味を推測しやすい語は学習者に推測させる。","内容理解に重要でなく、覚える必要のない語の説明は省く。","内容理解に重要でなくとも、覚えるべき語は事前に指導する。"], answer:3,
 explain:"読解授業での新出語指導は、基本的に「内容理解にとってその語が重要かどうか」を基準に方針を決めるべきです。内容理解に重要でない語について、覚えるべきだからという理由で事前指導することは、読解の流れを妨げ学習者の認知的負荷を不必要に増やすため、不適当な扱い方です。"},

{id:"R1-10-1", tag:"R1 試験I 問題10 問1", cat:"第二言語習得:エラー分析",
 text:"問題10 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n第二言語学習者は,同じ表現であっても正しく発話できたりできなかったりすることがある。こうした正用と誤用を繰り返しながら学習者の言語が変化していく現象は,(ア)に可変性があることを示している。第二言語の発達のためには,周囲からのインプットを得て長期記憶に貯蔵する必要がある。そのためには,維持リハーサルよりも精緻化リハーサルのほうが効果的である。さらに,言語学習には,ビリーフなども関わってくると言われている。情意フィルター仮説で指摘されているように,学習者の情意面が言語の学習や習得に影響することも知っておくとよい。\n\n問1 文章中の下線部Aに関して、エラーとミステイクの説明の組み合わせとして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["エラー:その場限りの誤り / ミステイク:複数回にわたって生じる誤り","エラー:複数回にわたって生じる誤り / ミステイク:その場限りの誤り","エラー:発話の意味の理解が可能な誤り / ミステイク:発話の意味の理解が不可能な誤り","エラー:発話の意味の理解が不可能な誤り / ミステイク:発話の意味の理解が可能な誤り"], answer:1,
 explain:"エラーは学習者の中間言語の規則性に基づく体系的な誤りで、繰り返し生じ、学習者自身では訂正できないことが多いものです。一方ミステイクは、言い間違いなどその場限りの偶発的な誤りで、学習者自身で気づいて訂正できることが多いという違いがあります。"},

{id:"R1-10-2", tag:"R1 試験I 問題10 問2", cat:"第二言語習得:中間言語",
 text:"問2 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["定着化","習得順序","中間言語","素朴概念"], answer:2,
 explain:"学習者の言語が正用と誤用を繰り返しながら変化していく現象は、学習者独自の体系である「中間言語(インターランゲージ)」が固定的でなく可変性を持つことを示しています。"},

{id:"R1-10-3", tag:"R1 試験I 問題10 問3", cat:"第二言語習得:リハーサル",
 text:"問3 文章中の下線部B「精緻化リハーサル」の例として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["記憶しようとする語を何度も声に出して繰り返す。","記憶しようとする語を母語に対応する語と関連づける。","記憶しようとする語を使って文を作成する。","記憶しようとする語と類義語を結びつける。"], answer:0,
 explain:"精緻化リハーサルは、意味的な処理を伴う「深い」符号化方法で、母語訳との関連づけや文作成、類義語との関連づけなどが該当します。単に声に出して繰り返すだけの方法は、意味処理を伴わない「維持リハーサル」にあたり、精緻化リハーサルの例としては不適当です。"},

{id:"R1-10-4", tag:"R1 試験I 問題10 問4", cat:"第二言語習得:ビリーフ",
 text:"問4 文章中の下線部C「ビリーフ」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["言語とその使用者および文化に対して形成され、固定化されたイメージ","言葉のやり取りを介して、対話者同士の間に築かれていく相互の信頼関係","教師や学習者の経験に基づく、言語学習はこうあるべきという個人的な見解","教室指導や言語学習をする際、教師や学習者が習慣的に使う情報処理の方法"], answer:2,
 explain:"ビリーフとは、教師や学習者がそれぞれの経験を通じて形成する、「言語学習・教育はこうあるべきだ」という個人的な信念・思い込みを指します。"},

{id:"R1-10-5", tag:"R1 試験I 問題10 問5", cat:"第二言語習得:情意フィルター仮説",
 text:"問5 文章中の下線部D「情意フィルター仮説」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["自尊心や強い自信を持つことによって、他者との関係構築が阻害される。","発話者に対する感情や評価によって、発話意図の理解や解釈がゆがめられる。","失敗を恐れない行動力や意欲が言語使用を増やす一方、正確さへの注意がそがれる。","不安や恐れのない状態は言語習得を促進する一方、不安のある状態は習得を妨げる。"], answer:3,
 explain:"クラッシェンの情意フィルター仮説は、不安や緊張などの情意的要因(情意フィルター)が高いとインプットの習得が妨げられ、逆に不安が低く心理的に安定した状態では習得が促進される、とする仮説です。"},

{id:"R1-11-1", tag:"R1 試験I 問題11 問1", cat:"社会言語学:方言",
 text:"問題11 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n方言には地域方言と社会方言がある。地域方言は,地域差による言葉のバリエーションを指す。一方,社会方言は,類似した社会的背景を持つ集団による言葉のバリエーションを指す。例えば,専門性を共有する集団においては,職業による集団語がある。また,話者の年齢を反映した言葉として若者言葉がある。\n方言は時代とともに変化している。明治時代以降,伝統的な地域方言は衰退したが,近年はネオ方言が見られるようになった。2000年代初めの調査では,言葉の男女差が年齢層によって違うことが報告されている。また,アニメや漫画などで使われている方言の中には役割語として注目されているものもある。\n\n問1 文章中の下線部A「職業による集団語」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「挑む」を意味する「チャレンジする」","「言い間違える」を意味する「噛む」","「ハンガー」を意味する「衣紋掛け」","「便所」を意味する「ご不浄」"], answer:1,
 explain:"「噛む」を「言い間違える」の意味で使うのは、アナウンサーや芸能関係者など特定の職業集団に特有の業界用語(職業集団語)の例です。他の選択肢は若者言葉・古い言い方・婉曲表現など、職業集団語とは異なる種類の言葉です。"},

{id:"R1-11-2", tag:"R1 試験I 問題11 問2", cat:"社会言語学:若者言葉",
 text:"問2 文章中の下線部B「若者言葉」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["若者言葉には、学生が用いるキャンパス言葉や、若い社会人の言葉が含まれる。","SNS上で使用される言葉は、若者の口頭表現に取り入れられることがある。","「アルバイト」のように、戦前の学生の言葉が一般語になったものがある。","若者は、「T」を「ティー」よりも「テー」と発音する傾向がある。"], answer:3,
 explain:"「テー」のような発音は若者言葉に特徴的な傾向とは言えず、むしろ他の世代や方言的特徴に見られるものであり、若者言葉の記述としては不適当です。他の3つは若者言葉の実態として妥当な記述です。"},

{id:"R1-11-3", tag:"R1 試験I 問題11 問3", cat:"社会言語学:ネオ方言",
 text:"問3 文章中の下線部C「ネオ方言」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["共通語と形式は同じだが、その地域では異なる意味で使われる言葉","地域方言ではあるが、その地域では共通語だと思われている言葉","共通語と地域方言が接触し、二つの形式が混ざり合って生まれた言葉","地域方言と意識されずに、全国共通語の中に取り入れられている言葉"], answer:2,
 explain:"ネオ方言は、共通語化が進む中で共通語と伝統的な地域方言が接触・混交することによって新たに生まれた、両者の性質を併せ持つ方言形式を指します。"},

{id:"R1-11-4", tag:"R1 試験I 問題11 問4", cat:"社会言語学:言葉の男女差",
 text:"問4 文章中の下線部Dに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「降るわよ」のような言い方を、20代女性は50代女性ほど使用しない。","「降るわよ」のような言い方を、50代男性は20代男性よりも使用する。","「雨だぜ」のような言い方を、20代女性は50代女性ほど使用しない。","「雨だぜ」のような言い方を、50代男性は20代男性よりも使用する。"], answer:0,
 explain:"「〜わよ」のような伝統的な女性語は、若い世代ほど使用が少なくなる傾向が調査で報告されており、20代女性は50代女性ほどこうした言い方を使用しないとされています。"},

{id:"R1-11-5", tag:"R1 試験I 問題11 問5", cat:"社会言語学:役割語",
 text:"問5 文章中の下線部E「役割語」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["登場人物のうち、主人公のせりふに用いられる傾向がある。","人々が抱く文化的ステレオタイプを弱める働きがある。","現実の位相や位相差を忠実に再現しているわけではない。","現実に存在しない架空の人物のせりふには用いられない。"], answer:2,
 explain:"役割語(「〜ですわ」のお嬢様言葉、「〜じゃ」の博士言葉など)は、特定のキャラクター像と結びついたステレオタイプ的な言葉遣いであり、現実の言語使用(位相・位相差)をそのまま忠実に再現したものではありません。"},

{id:"R1-12-1", tag:"R1 試験I 問題12 問1", cat:"社会言語学:言語政策",
 text:"問題12 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n世界各地で多文化化・多言語化が進みつつある。多言語社会では,公用語や国語などの言語政策が議論されている。多言語社会の中には,政治的,経済的,文化的優位性を持つ多数派言語(majority language)と,その反対の少数派言語(minority language)が併存している。少数派言語の話者はスティグマを持つ者と見なされることがある。現在,少数派とされる言語の話者の「言語権」を守るための取り組みなどが各地で行われている。\n日本でも様々な言語政策がとられてきた。例えば,表記にまつわるものとしては1991年に内閣告示された「外来語の表記」がある。また,現代の日本でも多文化化・多言語化が進んでおり,地方公共団体などにおいては,日本語非母語話者に対する「やさしい日本語」の使用が広がりつつある。\n\n問1 文章中の下線部A「公用語」に関して、公用語が複数定められている国はどこか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["カナダ","タイ","ドイツ","ブラジル"], answer:0,
 explain:"カナダは英語とフランス語の2つを公用語としています。タイ・ドイツ・ブラジルはそれぞれタイ語・ドイツ語・ポルトガル語という単一の公用語を持つ国です。"},

{id:"R1-12-2", tag:"R1 試験I 問題12 問2", cat:"社会言語学:スティグマ",
 text:"問2 文章中の下線部B「スティグマ」の説明として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["他者と同じグループに属しているという人間関係に関わる認識","ある対象を感染性のある危険なものだと見なし、接触を避ける態度","偏見により社会的に否定的な評価を与えられたアイデンティティ","特定の個人や集団、状況などを認知するときに用いる先入固定観念"], answer:2,
 explain:"スティグマは社会学の用語で、偏見や差別意識に基づいて特定の個人・集団に否定的なレッテル(烙印)が貼られ、そのアイデンティティが社会的に低く評価されることを指します。"},

{id:"R1-12-3", tag:"R1 試験I 問題12 問3", cat:"社会言語学:言語権",
 text:"問3 文章中の下線部Cの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["多数派言語の方言形を使用することを制限する。","義務教育で使用する標準語と標準表記を確定する。","少数派言語の話者に母語学習の機会を保障する。","司法の場では平等を重視して一つの言語に統一する。"], answer:2,
 explain:"「言語権を守る取り組み」とは、少数派言語の話者が自らの言語を学び、使用する権利を保障することを指します。「少数派言語の話者に母語学習の機会を保障する」がこれに該当します。他の選択肢はむしろ言語の多様性を制限する方向の政策です。"},

{id:"R1-12-4", tag:"R1 試験I 問題12 問4", cat:"表記:外来語の表記",
 text:"問4 文章中の下線部D「1991年に内閣告示された『外来語の表記』」に示されている表記の原則として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「ケース・バイ・ケース」のような複合語のつなぎの符号は、慣用に従って「・」とする。","「ヴァイオリン」の「ヴァ」のように日本語にない音の場合は、原音に近い表記を用いる。","「ハンカチ」と「ハンケチ」のようにゆれのあるものは、使用頻度の高い表記に統一する。","「ギリシャ」と「ギリシア」のようにゆれがある外国の地名は、両方の表記を認める。"], answer:3,
 explain:"「外来語の表記」の内閣告示では、表記にゆれがある地名などについて、一方に無理に統一するのではなく、両方の表記を認めるという方針が取られています。"},

{id:"R1-12-5", tag:"R1 試験I 問題12 問5", cat:"やさしい日本語",
 text:"問5 文章中の下線部E「やさしい日本語」に関して、減災のための「やさしい日本語」の言い換えルールに当てはまらないものを、次の1〜4の中から一つ選べ。",
 choices:["一文を短くしたり、文節にポーズを入れたりする。","出来事についての詳細な情報をできるだけ多く入れる。","「危険」のような語を「危ない」のように言い換える。","「やや規模の大きい地震」の「やや」のような表現は避ける。"], answer:1,
 explain:"減災のための「やさしい日本語」は、一文を短くし、簡単な語彙を使い、あいまいな表現を避けるなど、情報をできるだけシンプルにわかりやすく伝えることを原則とします。「詳細な情報をできるだけ多く入れる」ことは、この簡潔化の原則に反するため、言い換えルールには当てはまりません。"},

{id:"R1-13-1", tag:"R1 試験I 問題13 問1", cat:"談話:コミュニケーション理論",
 text:"問題13 次の文章を読み、下の問い(問1〜5)に答えよ。\n\nこれまで,コミュニケーションは様々な観点から捉えられてきた。ハイムズ(D.Hymes)は,社会・文化的コンテクストの中でコミュニケーションを捉えようとし,言語能力のみならず,(ア)も重要であると主張している。ヤコブソン(R.Jakobson)は,コミュニケーションの機能に注目し,情動的(emotive)機能や詩的(poetic)機能など,六つの機能があると述べている。また,ブラウン&ユール(G.Brown & G.Yule)は,人が言葉を交わす目的に着目し,会話には交渉会話と交流会話があることを指摘している。\n実際のコミュニケーションには動的な側面があり,その場の状況や話し手の感情などに応じてスピーチレベルシフトが行われている。会話においてはフィラーなど,円滑なコミュニケーションのための方策も用いられている。\n\n問1 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["認知能力","伝達能力","背景知識","言語適性"], answer:1,
 explain:"ハイムズは「コミュニカティブ・コンピテンス(伝達能力)」という概念を提唱し、言語知識(言語能力)だけでなく、社会文化的な文脈の中で適切に言葉を使う能力(伝達能力)の重要性を主張しました。"},

{id:"R1-13-2", tag:"R1 試験I 問題13 問2", cat:"談話:言語の機能",
 text:"問2 文章中の下線部A「詩的(poetic)機能」の例として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["しり取り","しゃれ","独り言","早口言葉"], answer:2,
 explain:"詩的機能はヤコブソンの言語機能論の一つで、メッセージそのものの形式(音の響きやリズム、言葉遊びなど)に焦点を当てる機能です。しり取り・しゃれ・早口言葉はいずれも音や形式に着目した言葉遊びの例ですが、独り言は単に自分に向けられた発話であり、形式面への着目という詩的機能の特徴を必ずしも持たないため、例としては不適当です。"},

{id:"R1-13-3", tag:"R1 試験I 問題13 問3", cat:"談話:交渉会話と交流会話",
 text:"問3 文章中の下線部B「交渉会話」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["X:あの映画見た? / Y:どの映画?","X:一緒にご飯食べに行かない? / Y:いいよ。","X:彼女、結婚するんだって? / Y:え、そうなの?","X:髪切ったの? / Y:よく分かったね。"], answer:1,
 explain:"交渉会話(トランザクショナル・トーク)は、情報のやり取りや物事の実行(依頼・誘いとその承諾など)を主な目的とする実務的な会話です。「一緒にご飯に行かない?」「いいよ」は誘いとその承諾という実務的なやり取りにあたります。他の選択肢は、話題を共有し関係を築くことを目的とした交流会話(インターアクショナル・トーク)に近い例です。"},

{id:"R1-13-4", tag:"R1 試験I 問題13 問4", cat:"談話:スピーチレベルシフト",
 text:"問4 文章中の下線部C「スピーチレベルシフト」に関して、基本的に普通体が用いられている会話の中で丁寧体にシフトしたときの効果の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["聞き手へのよそよそしさや怒りを表す。","聞き手に強く共感していることを示す。","会話の堅苦しさを一時的に和らげる。","話し手自身に向けた発話であることを示す。"], answer:0,
 explain:"普通体を基調とする会話の中で、あえて丁寧体に切り替える(スピーチレベルシフトする)ことは、心理的な距離を置く効果を持ち、聞き手へのよそよそしさや皮肉、怒りなどを表す効果があるとされます。"},

{id:"R1-13-5", tag:"R1 試験I 問題13 問5", cat:"談話:フィラー",
 text:"問5 文章中の下線部D「フィラー」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["発話の意味を婉曲的に表現したり、聞き手に発話の機会を与えたりする。","発話の一部を際立たせて発音したり、ささやきにして強調したりする。","次の発話までの時間を確保したり、聞き手の注意を喚起したりする。","聞き手の話を聞いていることを示したり、理解していることを示したりする。"], answer:2,
 explain:"フィラー(「ええと」「あの」など)は、次の発話を考える時間を稼いだり、聞き手の注意を引きつけたりするなど、発話をつなぎ円滑に進めるための方策として機能します。"},

{id:"R1-14-1", tag:"R1 試験I 問題14 問1", cat:"政策:EPA候補者",
 text:"問題14 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n2018年末現在,日本は18の国・地域と経済連携協定(EPA)を締結している。その枠組みの中で,3か国から外国人の看護師候補者と介護福祉士候補者を受け入れている。外国人の候補者に与えられる在留資格は(ア)である。候補者は原則として日本語研修を受講した後,受入れ施設(病院・介護施設)で就労し,研修を受ける。看護師候補者は3年,介護福祉士候補者は4年の在留が認められ,その在留期間に日本の国家試験を受験する。受入れ当初は合格率が低く,候補者に配慮した試験の見直しが行われた。\n\n問1 文章中の下線部A「3か国」はどこか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["インドネシア、タイ、ベトナム","インドネシア、タイ、フィリピン","インドネシア、フィリピン、ベトナム","タイ、フィリピン、ベトナム"], answer:2,
 explain:"EPAに基づく外国人看護師・介護福祉士候補者の受け入れは、インドネシア(2008年〜)、フィリピン(2009年〜)、ベトナム(2014年〜)の3か国から行われています。"},

{id:"R1-14-2", tag:"R1 試験I 問題14 問2", cat:"政策:EPA候補者",
 text:"問2 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["医療","特定活動","技能実習","高度専門職"], answer:1,
 explain:"EPAに基づく看護師・介護福祉士候補者に与えられる在留資格は「特定活動」です。「技能実習」や「医療」「高度専門職」とは別の枠組みです。"},

{id:"R1-14-3", tag:"R1 試験I 問題14 問3", cat:"政策:EPA候補者",
 text:"問3 文章中の下線部B「日本語研修」が行われるのはいつか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本入国前","日本入国後","日本入国前または入国後","日本入国前と入国後"], answer:3,
 explain:"EPA候補者は、来日前に現地で日本語研修を受けたうえで来日し、来日後も改めて日本語研修(入国後研修)を受けるという、入国前・入国後の両方で研修が行われる仕組みになっています。"},

{id:"R1-14-4", tag:"R1 試験I 問題14 問4", cat:"政策:EPA候補者",
 text:"問4 文章中の下線部Cに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["看護師候補者は毎年受験でき、介護福祉士候補者は在留期間の最終年に受験できる。","看護師候補者は在留期間の最終年のみ受験でき、介護福祉士候補者は毎年受験できる。","看護師候補者も介護福祉士候補者も、共に毎年受験できる。","看護師候補者も介護福祉士候補者も、共に在留期間の最終年のみ受験できる。"], answer:0,
 explain:"在留期間が3年の看護師候補者はその期間中毎年国家試験を受験できるのに対し、在留期間が4年の介護福祉士候補者は在留期間の最終年(4年目)に国家試験を受験する仕組みになっています。"},

{id:"R1-14-5", tag:"R1 試験I 問題14 問5", cat:"政策:EPA候補者",
 text:"問5 文章中の下線部D「候補者に配慮した試験の見直し」の内容として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["全ての漢字にふりがなを付記する。","一般の受験者より試験時間を延長する。","問題文に日本語と英語を併記する。","難解な用語を平易な用語に置き換える。"], answer:2,
 explain:"実際に行われた見直しは、漢字へのふりがな付記、試験時間の延長、専門用語の平易化などです。候補者の母語はインドネシア語・フィリピノ語・ベトナム語などさまざまであるため、「英語の併記」という対応は行われていません。"},

{id:"R1-15-1", tag:"R1 試験I 問題15 問1", cat:"政策:日本語教育機関",
 text:"問題15 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n現在,日本には様々な在留資格を持った外国人が生活している。外国人が「留学」の在留資格を持って各種学校等で専ら日本語の教育を受けようとする場合,その学校等は法務省告示で定める日本語教育機関である必要がある。このような教育機関は,法務省告示日本語教育機関,いわゆる「日本語学校」と呼ばれる。法務省は,「日本語教育機関の告示基準」として施設や学校運営,教員等の基準を示している。\n「日本語学校」は,1983年の「留学生10万人計画」を契機に急増した。そこで,日本語教育施設の質的向上を図るため,文部省により「日本語教育施設の運営に関する基準」が策定され,それを運用する団体として(ア)が設立された。この時定められた基準が,現在の法務省告示基準の基となっている。\n日本学生支援機構によると,2018年5月現在の全留学生数は約30万人であり,うち法務省告示日本語教育機関の留学生数は約9万人である。留学生の中には,アルバイトをしながら学んでいる者もいる。\n\n問1 文章中の下線部A「法務省告示日本語教育機関」の2018年8月現在の数として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["約300","約500","約700","約900"], answer:2,
 explain:"2018年8月現在、法務省告示日本語教育機関(いわゆる日本語学校)の数はおよそ700校とされていました。"},

{id:"R1-15-2", tag:"R1 試験I 問題15 問2", cat:"政策:日本語教育機関",
 text:"問2 文章中の下線部B「教員等の基準」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["主任教員は、法務省告示日本語教育機関で常勤として3年以上の経験があること","主任教員は、大学で日本語教育を専攻し、学士の学位を有すること","校長は、法務省告示日本語教育機関で主任教員として3年以上の経験があること","校長は、大学院で日本語教育を専攻し、修士の学位を有すること"], answer:0,
 explain:"日本語教育機関の告示基準では、主任教員の要件の一つとして、法務省告示日本語教育機関における3年以上の常勤経験が定められています。"},

{id:"R1-15-3", tag:"R1 試験I 問題15 問3", cat:"政策:日本語教育機関",
 text:"問3 文章中の(ア)に入れるのに最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本国際協力センター","日本語教育学会","国際協力機構","日本語教育振興協会"], answer:3,
 explain:"文部省が策定した「日本語教育施設の運営に関する基準」を運用する団体として設立されたのは「日本語教育振興協会」(日振協)です。"},

{id:"R1-15-4", tag:"R1 試験I 問題15 問4", cat:"政策:留学生統計",
 text:"問4 文章中の下線部C「法務省告示日本語教育機関の留学生数」の多い出身国・地域の組み合わせとして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["1位:ベトナム / 2位:ネパール / 3位:インドネシア","1位:ベトナム / 2位:中国 / 3位:ネパール","1位:中国 / 2位:ベトナム / 3位:インドネシア","1位:中国 / 2位:インドネシア / 3位:ネパール"], answer:1,
 explain:"2018年当時の統計では、法務省告示日本語教育機関の留学生の出身国・地域は、1位ベトナム、2位中国、3位ネパールの順でした。"},

{id:"R1-15-5", tag:"R1 試験I 問題15 問5", cat:"政策:資格外活動",
 text:"問5 文章中の下線部D「アルバイト」に関して、資格外活動としてアルバイトに従事できる時間はどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["原則週7時間以内","原則週14時間以内","原則週21時間以内","原則週28時間以内"], answer:3,
 explain:"「留学」の在留資格を持つ留学生が資格外活動許可を得てアルバイトを行う場合、原則として週28時間以内と定められています。"},

{id:"R1-16-1", tag:"R1 試験III 問題1 問1", cat:"文法:ヴォイス",
 text:"【試験III】次の文章を読み、下の問い(問1〜5)に答えよ。\n\nある事態(出来事)をどのように描くかということに関して,世界の諸言語には様々な違いがある。例えば英語では,一般に,動作主・原因を主語にして述べることを好む。このため,日常会話の中では他動詞文が多用される傾向がある。これに対し,日本語では話し手が事態に関与する場合には,話し手を主語にして述べる傾向があり,様々な受身文が発達している。例えば,いわゆる迷惑受身(間接受身)は他の言語にはあまり見られない。さらに,「お茶が入った」「風呂が沸いた」のように,自動詞表現を好むとも言われる。\n事態の参与者の何を主語にして述べるかに関わる文法カテゴリーは,ヴォイスと呼ばれる。話し手が何を主語にするかは談話の中での視点の統一にも関わっている。日本語教育においては,この点においても指導が必要である。\n\n問1 文章中の下線部A「他動詞文」の典型的な特徴として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["動作主が対象の変化を引き起こす。","動作主と対象が相互に働きかけ合う。","補語にヲ格ではなくニ格名詞をとる。","主語の状態や補語との関係を表す。"], answer:0,
 explain:"他動詞文の典型的な構造は、動作主(主語)が対象(目的語)に働きかけ、その変化を引き起こすというものです。"},

{id:"R1-16-2", tag:"R1 試験III 問題1 問2", cat:"文法:間接受身",
 text:"問2 文章中の下線部B「迷惑受身(間接受身)」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["先生に掃除を頼まれて、面倒だった。","夫が知人に批判されて、悲しかった。","花子に先に就職されて、悔しかった。","若者から席を譲られて、嫌だった。"], answer:2,
 explain:"間接受身(迷惑受身)は、本来受身の形を取らない自動詞文(「花子が就職した」)に受身形式を付加することで、その事態が話者に間接的な影響(多くは迷惑)を与えたことを表す、日本語に特徴的な構文です。他の選択肢は他動詞の直接受身であり、間接受身ではありません。"},

{id:"R1-16-3", tag:"R1 試験III 問題1 問3", cat:"文法:自動詞",
 text:"問3 文章中の下線部C「自動詞」に関する記述として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["動詞の受身形は、実質的に自動詞として機能する場合がある。","自動詞は、意志的な意味のものと非意志的な意味のものに大別される。","対応する他動詞を持つ自動詞は、主体の変化を表すことが多い。","対応する他動詞を持つ自動詞は、語末の形態が「-asu」のものが多い。"], answer:3,
 explain:"対応する他動詞を持つ自動詞の語末形態としては「-aru」などが典型例として挙げられ、「-asu」はむしろ対応する他動詞側に多く見られる語尾です(例:燃える/燃やす)。したがってこの記述は不適当です。"},

{id:"R1-16-4", tag:"R1 試験III 問題1 問4", cat:"文法:文法カテゴリー",
 text:"問4 文章中の下線部D「文法カテゴリー」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「本を読めば」等の条件を表すレバ節には、文法カテゴリーのうちヴォイス形式のみ出現できる。","「本を読みながら」等の付帯状況のナガラ節には、文法カテゴリーのうちヴォイス形式のみ出現できる。","「読ませていただろう」のように、述語構造においては、モダリティ形式がヴォイス形式に先行する。","「読ませていただろう」のように、述語構造においては、テンス形式がヴォイス形式に先行する。"], answer:1,
 explain:"付帯状況を表すナガラ節は、テンスやモダリティ形式を伴うことができないという制約があり、文法カテゴリーのうちヴォイス形式のみが出現できるという特徴があります。"},

{id:"R1-16-5", tag:"R1 試験III 問題1 問5", cat:"文法:視点",
 text:"問5 文章中の下線部Eに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["新情報として談話に導入されるということが、主語となる条件である。","無生物の名詞が事態を引き起こす原因である場合、これが主語になる。","事態が話し手にとって迷惑である場合、聞き手の視点から述べられる。","事態の参与者のうち、話し手にとってより身近な人に視点が置かれる。"], answer:3,
 explain:"日本語の視点表現(視点の統一)では、事態に関わる複数の参与者のうち、話し手にとってより身近な人物(家族・身内など)に視点が置かれ、その人物を主語として述べる傾向があるとされています。"},

{id:"R1-16-6", tag:"R1 試験III 問題2 問1", cat:"音声学:東京方言",
 text:"問題2 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n言語の発音は規範意識と大きく関わる。例えば,いわゆるガ行鼻濁音は日本語の「標準語」において「美しい」発音とされてきた。それは,「標準語」が東京方言の音韻規則を受け継いだためである。しかし,近年ではガ行鼻濁音は衰退しつつあり,現在も進行中である長期的な歴史的変化の一つだといえる。\nまた,言語の発音には,調音時の各部位の動きを自覚しやすいものと自覚しにくいものがある。音声教育においては,負の転移をそのまま指摘するだけでは十分ではない。\n教師はこうした知識を持ちつつ,学習者が自ら発音の違いに気づけるように発音の区別の手がかりを示す必要がある。\n\n問1 文章中の下線部A「東京方言」に見られる音韻現象として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「箱」などが複合語の後部要素になったとき連濁を起こす。","「白い」などの活用語尾が連用形でウ音便を起こす。","「北」などで無声音に挟まれた狭母音が無声化する。","「若い」などで連母音/ai/が融合し[e(:)]となる。"], answer:1,
 explain:"イ形容詞の連用形が「白うて」のようにウ音便化するのは西日本方言(関西方言など)に見られる現象で、東京方言(共通語)には見られません。連濁・母音の無声化・連母音の融合([ai]→[eː]のようないわゆる「べらんめえ調」)はいずれも東京方言に実際に見られる音韻現象です。"},

{id:"R1-16-7", tag:"R1 試験III 問題2 問2", cat:"音声学:言語変化",
 text:"問2 文章中の下線部B「現在も進行中である長期的な歴史的変化」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["動詞の活用の型数の増加","拗音に見られる唇音の退化","動詞における受身形と可能形の分化","イ列における二種の仮名の使い分け"], answer:2,
 explain:"いわゆる「ら抜き言葉」(見れる、食べれるなど)に見られる、可能形が受身形から独立して分化していく現象は、現在も進行中の代表的な歴史的変化としてよく知られています。"},

{id:"R1-16-8", tag:"R1 試験III 問題2 問3", cat:"音声学:調音動作",
 text:"問3 文章中の下線部C「調音時の各部位の動き」に関して、子音の調音動作の説明として最も適当なものを、次の1〜4の中から一つ選べ。\n\n(表)調音:ひ/調音動作:硬口蓋と舌で狭窄を作って、呼気を通過させる。 / 調音:や/調音動作:軟口蓋と舌を近づけるが、気流は阻害せず通過させる。 / 調音:く/調音動作:舌を硬口蓋に瞬間的に軽く打ちつけてから戻す。 / 調音:ち/調音動作:上歯と舌端で閉鎖を作って、閉鎖の開放後も狭窄は残る。",
 choices:["ひ:硬口蓋と舌で狭窄を作って、呼気を通過させる。","や:軟口蓋と舌を近づけるが、気流は阻害せず通過させる。","く:舌を硬口蓋に瞬間的に軽く打ちつけてから戻す。","ち:上歯と舌端で閉鎖を作って、閉鎖の開放後も狭窄は残る。"], answer:0,
 explain:"「ひ」の子音[ç](無声硬口蓋摩擦音)は、硬口蓋と舌背の間に狭めを作り、そこを呼気が摩擦を伴って通過することで生じる音であり、この説明が正しい調音動作です。他の選択肢は、それぞれの子音(や・く・ち)の実際の調音点や調音法の説明として不正確です。"},

{id:"R1-16-9", tag:"R1 試験III 問題2 問4", cat:"音声学:負の転移",
 text:"問4 文章中の下線部D「負の転移」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["英語母語話者が「月」を[sukʲi]と発音するのは、英語では歯茎破裂音が語頭に現れないためである。","韓国語母語話者が「七」を[ɕiɕi]と発音するのは、韓国語では摩擦音と破擦音が弁別されないためである。","スペイン語母語話者が「券」を[kin]と発音するのは、スペイン語には母音が三つしかないためである。","中国語母語話者が「千」を[ʃen]と発音するのは、中国語では歯茎音と後部歯茎音が弁別されないためである。"], answer:0,
 explain:"負の転移は、母語の音韻規則が目標言語の発音に影響を及ぼすことで生じる誤りです。この選択肢は、母語(英語)の音韻的な制約が、日本語の音(「月」の語頭子音)の発音に影響を与えている例として、選択肢の中で最も適当とされています。他の選択肢は、挙げられている母語の音韻的事実(スペイン語の母音の数、中国語の音韻対立など)の記述が不正確です。"},

{id:"R1-16-10", tag:"R1 試験III 問題2 問5", cat:"音声教育:発音指導",
 text:"問5 文章中の下線部Eの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["/seQsi/(摂氏)と/seQti/(設置)を発音し分ける手がかりとして、手で拍子を取らせる。","/hyoR/(表)と/hiyoR/(費用)を発音し分ける手がかりとして、喉に手を当てて声帯の振動開始のタイミングを感じさせる。","「船」の発音として[ɸɯne]と[xɯne]の違いを知るために、鏡で学習者の唇の形を観察させる。","「砂」の発音として[suna]と[sɯna]の違いを知るために、鼻をつまんだときと離したときの発音のしやすさを比べさせる。"], answer:2,
 explain:"[ɸ](両唇摩擦音、日本語のハ行「フ」の子音)と[x](軟口蓋摩擦音)の違いは唇を丸めて狭めを作るかどうかという唇の形の違いに表れるため、鏡で唇の形を観察させることは、学習者が自らその違いに気づくための有効な手がかりとなります。"},

{id:"R1-16-11", tag:"R1 試験III 問題3 問1", cat:"文法:副詞",
 text:"問題3 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n副詞は,意味的,形態論的に多様な性質を持つ語を含む品詞である。その中で様態副詞は,手を叩く「ぱちぱち」のように事態の開始とともに発生し,終了とともに消えるさまを表す。程度副詞は,感情・感覚を表す動詞とも漸次的な変化を表す動詞とも結びつくのが特徴である。程度副詞が様態副詞と共起することもある。\n形態論的には,他の品詞から転成した副詞も多く,成り立ちは複雑である。また,副詞は類義関係にあるものも多く,その意味的な特徴を正確に把握していないと「雨が急遽降りだした」のような誤用を生むことがある。そのため,副詞を指導する際はこれらの性質を理解しておくことが必要である。\n\n問1 文章中の下線部Aの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["服がびしょびしょに濡れた。","喉がからからに渇いた。","豚がまるまると太った。","雪がちらちらと舞った。"], answer:3,
 explain:"様態副詞は、事態(動作)の開始とともに発生し、終了とともに消える「進行中の様子」を表します。「雪がちらちらと舞った」は、雪が舞っている間ずっと継続する動きの様子を表す典型的な様態副詞の例です。他の選択肢(びしょびしょに、からからに、まるまると)は、動作の結果として生じた状態を表す用法に近く、性質が異なります。"},

{id:"R1-16-12", tag:"R1 試験III 問題3 問2", cat:"文法:副詞",
 text:"問2 文章中の下線部B「漸次的な変化を表す動詞」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["喜ぶ","眠る","生まれる","痩せる"], answer:3,
 explain:"「痩せる」は、時間の経過とともに徐々に(漸次的に)進行する変化を表す動詞であり、程度副詞(「だんだん」「少しずつ」など)と結びつきやすい典型例です。「喜ぶ」「眠る」「生まれる」は瞬間的・非漸次的な変化や心理動詞であり、性質が異なります。"},

{id:"R1-16-13", tag:"R1 試験III 問題3 問3", cat:"文法:副詞",
 text:"問3 文章中の下線部C「程度副詞が様態副詞と共起する」例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["どうかゆっくり進んでください。","かなりきっぱりと断ったんです。","けっこうすぐに勝敗が決まるでしょう。","だんだんぽかぽかしてきましたね。"], answer:1,
 explain:"「かなり」は程度副詞、「きっぱりと」は動作の様子を表す様態副詞であり、この2つが組み合わさって共起している例です。他の選択肢は、程度副詞と様態副詞の組み合わせという条件に当てはまらない、または異なる種類の副詞の組み合わせです。"},

{id:"R1-16-13b", tag:"R1 試験III 問題3 問4", cat:"文法:副詞",
 text:"問4 文章中の下線部D「他の品詞から転成した副詞」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「図る」の打ち消しに「も」が後接した「図らずも」","「さん然」に並列の「と」が後接した「さん然と」","「ある」の連用形に「とも」が前接した「ともあれ」","「やすい」の連体形に「た」が前接した「たやすく」"], answer:0,
 explain:"「図らずも」は、動詞「図る」の未然形に打消しの「ず」、さらに「も」が付いてできた、動詞から転成した副詞の例です。他の選択肢は、語構成の説明が不正確であったり、そもそも他品詞からの転成という条件に合わなかったりします。"},

{id:"R1-16-13c", tag:"R1 試験III 問題3 問5", cat:"語彙:副詞の誤用",
 text:"問5 文章中の下線部E「雨が急遽降りだした」の「急遽」の誤用の要因として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["プラスマイナスのイメージはないという特徴を理解していないため","硬い書き言葉として用いられるという特徴を理解していないため","突然の事態に対応する様子を表すという特徴を理解していないため","事態が漸次的に変化する様子を表すという特徴を理解していないため"], answer:2,
 explain:"「急遽」は、単に「急に」という意味ではなく、予定外の事態に対して急いで何らかの対応・行動を取る、という意味を含む副詞です。「雨が降りだす」は人が意図的に対応する行為ではないため、「急遽」を使うと不自然になります。この、対応の様子を表すという特徴を理解していないことが誤用の要因です。"},

{id:"R1-16-14", tag:"R1 試験III 問題4 問1", cat:"文法:否定表現",
 text:"問題4 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n否定の言語表現の意味や用法を正しく理解し適切に運用できるように指導することは,どのレベルの学習者に対しても重要である。初級では,述語の否定形の作り方に注意が必要である。応答表現「いいえ」の用法も学習者の母語とは異なる場合がある。中級以上になると,「車では行かなかった」や「悲しくて泣いているんじゃない」などの文のように,否定の焦点の理解が必要な文型が出てくる。また,「楽しくなくはない」や「面白くないわけじゃない」など,二重否定の構文が持つ意味やニュアンスも適切な運用には不可欠な知識と言える。\n以上のように,否定表現の意味と用法には留意すべき点が多い。そのため,初級の応答練習では,導入した文型の否定文で単純に応答させると,返答が語用論的に適切でなくなることがある。教師は運用上適切な応答形式を優先して示す必要がある。\n\n問1 文章中の下線部A「述語の否定形の作り方」に関して、同じように活用する語の組み合わせとして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「知る」「作る」「ある」","「明るい」「悪い」「いい」","「楽しい」「難しい」「きれい」","「見る」「出掛ける」「できる」"], answer:3,
 explain:"「見る」「出掛ける」「できる」はいずれも一段動詞(否定形は「〜ない」を直接付ける「見ない」「出掛けない」「できない」)であり、同じ活用パターンを持ちます。「ある」は特殊な否定形「ない」を取り、「いい」はイ形容詞で活用が異なるなど、他の選択肢は活用のタイプが揃っていません。"},

{id:"R1-16-15", tag:"R1 試験III 問題4 問2", cat:"文法:否定表現",
 text:"問2 文章中の下線部B「応答表現『いいえ』の用法」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["真偽疑問文の応答にも疑問詞疑問文の応答にも使用できる。","後続の応答が肯定文であっても否定文であっても使用できる。","相手の質問に対する否定的応答にも話題転換にも使用できる。","相手の質問に対する応答にも相づちにも使用できる。"], answer:1,
 explain:"「いいえ」は、後に続く応答の内容が肯定文であっても否定文であっても使用できます(例:「学生ですか」「いいえ、学生です」のような訂正の場面など、文脈により後続文の極性は肯定にも否定にもなり得ます)。"},

{id:"R1-16-16", tag:"R1 試験III 問題4 問3", cat:"文法:否定の焦点",
 text:"問3 文章中の下線部C「否定の焦点」に関して、下線部が否定の焦点になっていないものを、次の1〜4の中から一つ選べ。",
 choices:["人は一人で生きているんじゃありません。","電車で大学まで通っているんじゃありません。","わざと間違えたわけじゃありません。","お金が欲しくて働いているわけじゃありません。"], answer:0,
 explain:"「人は一人で生きているんじゃありません」の下線部「人は」は文の主題(トピック)を示しており、実際に否定されている焦点は「一人で」の部分です。一方、他の選択肢では下線部(電車で・わざと・お金が欲しくて)がそのまま否定の焦点になっており(手段ではなく他の方法で、故意にではなく、お金のためではなく、という意味)、性質が異なります。"},

{id:"R1-16-17", tag:"R1 試験III 問題4 問4", cat:"文法:二重否定",
 text:"問4 文章中の下線部D「二重否定の構文が持つ意味やニュアンス」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["否定文よりも否定のニュアンスが強い。","肯定文よりも肯定のニュアンスが強い。","否定文よりも肯定文の意味に近い。","肯定文よりも否定文の意味に近い。"], answer:2,
 explain:"二重否定(「〜なくはない」「〜ないわけじゃない」など)は、否定を二重に重ねることで最終的には肯定に近い意味を表しますが、直接的な肯定文よりも婉曲的で控えめなニュアンスを持つとされています。"},

{id:"R1-16-18", tag:"R1 試験III 問題4 問5", cat:"語用論:応答の適切さ",
 text:"問5 文章中の下線部Eに当てはまる質問文の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["許可を問う「このペンを使ってもいいですか」","真偽を問う「ジョンソンさんは大学生ですか」","経験を問う「歌舞伎を見たことがありますか」","能力を問う「車を運転することができますか」"], answer:0,
 explain:"許可を求める質問(「〜てもいいですか」)に対して、初級で導入した否定形をそのまま使って単純に「いいえ」とだけ答えると、無愛想で語用論的に不適切な断り方になってしまいます。真偽・経験・能力を問う質問への「いいえ」という単純な否定応答は、通常はそのまま使っても特に不自然ではありません。"},

{id:"R1-16-19", tag:"R1 試験III 問題5 問1", cat:"教授法:直接法授業",
 text:"問題5 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n初級レベルの学習者に対する直接法の授業には様々な方法があるが,学習した文型を使って運用能力を養う授業としては,次のようなものがある。\nまず,文型に応じて学習目標を決め,授業の計画を立てる。授業の基本的な手順としては,最初にウォームアップを行い,文型導入に移る。続いて,反復練習や拡張練習などの基本練習を行う。最後に応用練習を行い,運用能力を高める活動を行う。\n文型には,それぞれに注意すべきところがある。例えば,授受表現の文型は中級の学習者でも誤用が見られ,教える際は注意が必要である。\n\n問1 文章中の下線部A「ウォームアップ」の方法とその目的として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["新出の語彙を多く使って話しかけ、学習の動機づけを行う。","目標の学習文型を使った文を復唱させ、口慣らしを行う。","誤用を引き出して明示的に訂正を行い、注意を向けさせる。","復習を兼ねた会話の練習を行い、心理的な緊張を和らげる。"], answer:3,
 explain:"ウォームアップは授業の導入部分で行われ、既習事項を使った軽い会話などを通じて、学習者の心理的な緊張をほぐし、授業へ入りやすくすることを主な目的とします。"},

{id:"R1-16-20", tag:"R1 試験III 問題5 問2", cat:"教授法:文型導入",
 text:"問2 文章中の下線部B「文型導入」を行う際の留意点として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["既習事項を用いて学習者とやり取りをし、一方的な説明にならないようにする。","最初に文型の意味や機能を説明し、文型の意味を推測させないようにする。","使用する語彙の難易度に気をつけ、新しい文型に集中できるようにする。","学習者が教室外で遭遇する状況を設定し、文型の意味を理解しやすくする。"], answer:1,
 explain:"直接法での文型導入では、教師がいきなり文型の意味を一方的に説明するのではなく、場面や文脈を通じて学習者自身に意味を推測させながら理解を促すことが望ましいとされます。「推測させないようにする」はこの原則に反するため、留意点としては不適当です。"},

{id:"R1-16-21", tag:"R1 試験III 問題5 問3", cat:"教授法:拡張練習",
 text:"問3 文章中の下線部C「拡張練習」の例として最も適当なものを、次の1〜4の中から一つ選べ。\n\n1 教師:リンさん、公園、連れて行きます。/ 学習者:リンさんに公園へ連れて行ってもらいました。/ 教師:太郎さん、日本語、教えます。/ 学習者:太郎さんに日本語を教えてもらいました。\n2 教師:田中さんは誰にパソコンを貸してもらいましたか。山田さん。/ 学習者:田中さんは山田さんにパソコンを貸してもらいました。/ 教師:李さんはトムさんに何を買ってきてもらいましたか。コーヒー。/ 学習者:李さんはトムさんにコーヒーを買ってきてもらいました。\n3 教師:買ってくれました。/ 学習者:買ってくれました。/ 教師:時計を。/ 学習者:時計を買ってくれました。/ 教師:母が。/ 学習者:母が時計を買ってくれました。\n4 教師:買います。/ 学習者:買ってくれます。/ 教師:書きます。/ 学習者:書いてくれます。/ 教師:調べます。/ 学習者:調べてくれます。",
 choices:["選択肢1(リンさん・太郎さんの例)","選択肢2(田中さん・李さんの質問応答の例)","選択肢3(買ってくれました、の積み上げの例)","選択肢4(買います→買ってくれます、の変換の例)"], answer:0,
 explain:"拡張練習は、与えられたキュー(語句)を使って文を作り、次々と新しいキューに応じて文を組み立てていく練習方法です。選択肢1は「人物・行き先/内容」というキューから毎回新しい文を組み立てさせており、典型的な拡張練習にあたります。選択肢3は文を少しずつ積み上げていくビルドアップ練習、選択肢4は文型変換練習であり、それぞれ性質が異なります。"},

{id:"R1-16-22", tag:"R1 試験III 問題5 問4", cat:"教授法:応用練習",
 text:"問4 文章中の下線部D「応用練習」を行う際の指導上の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["導入した文型だけでなく、既習文型も組み合わせて使える活動にする。","学習者にモデル会話を繰り返し復唱させ、流暢に言えるようにする。","役割や場面を設定して行う活動は、本物のやり取りではないため避ける。","学習者間で口頭運用能力に差がある場合、情報差を埋めるタスクを避ける。"], answer:0,
 explain:"応用練習は運用能力を養う段階であるため、その課で新しく導入した文型だけに限定せず、既習の文型も組み合わせて自由に使わせる活動にすることが望ましいとされます。"},

{id:"R1-16-23", tag:"R1 試験III 問題5 問5", cat:"文法:授受表現の誤用",
 text:"問5 文章中の下線部Eに関して、誤用の記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「東京にもやっと春が来てもらった」は、ガ格に用いられる語が人間ではないことによる誤りである。","「先生にお土産をおあげしました」は、一般的な謙譲語の作り方のルールを適用したことによる誤りである。","「先生、明日休ませていただきませんか」は、許可を求める際に使役形を用いたことによる誤りである。","「タクシーを呼んだらすぐに来てもらった」は、前件と後件の主語が異なることによる誤りである。"], answer:1,
 explain:"「あげる」の謙譲語は本来「差し上げる」という特別な語を用いるべきですが、「お+動詞連用形+する」という一般的な謙譲語の作り方のルールを機械的に当てはめてしまい、「おあげする」という誤った形を作ってしまったと考えられます。"},

{id:"R1-16-24", tag:"R1 試験III 問題6 問1", cat:"文法:てい く",
 text:"問題6 次の文章と資料を読み、後の問い(問1〜5)に答えよ。<資料>は、X先生の授業の流れに関するメモである。\n\n日本語教師のX先生が課題遂行型で実施した授業について先輩のY先生と話している。\n\nX先生:課題遂行型の授業をしてみたんですが、あまりうまくいかなくて。授業の流れを書いたメモがあるんですが、見ていただけませんか。\nY先生:いいですよ、見てみましょう。\n\n<資料> X先生の授業の流れに関するメモ(3月25日『わいわい日本語』12課)\n目標:花見に行くときにどんな食べ物や飲み物を誰が用意するかなど、短い簡単な表現で計画を立てるための話し合いができる。(CEFR A2レベル)\nSTEP1:①その日のテーマと授業の目標を確認する。②語彙を確認する。\nSTEP2:③花見を計画する場面のモデル会話を聞いて、クラスで内容を確認する。④モデル会話に出てくる表現「私は、くだものを持っていきます」の意味と機能を理解する。⑤ペアでモデル会話の練習を行う。\nSTEP3:⑥花見に持っていく食べ物や飲み物を考え、「私は、●●を持っていきます」という文を作って一人ずつ発表する。⑦授業の目標を再確認し、目標が達成できたかどうかチェックリストで自己評価をする。\n\nX先生:詳しい教案じゃなくてすみません。\nY先生:いいえ、大丈夫ですよ。(メモを見たあと)うーん、こうした活動では目標の達成が難しいですね。今度、授業を録画して、それを複数の教師で見ながら一緒に改善方法について考えてみましょう。\nX先生:あ、そうですね。次は録画します。ありがとうございます。\n\n問1 <資料>の下線部A「持っていきます」に関して、この「〜ていく」と同じ用法の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["桜は花びらが散っていく様子がとても美しいです。","新聞によると、花見客は今後も増えていくそうです。","林さんは花見に子どもを連れていくと言っていました。","花見まで時間があるので、家で少し食べていくつもりです。"], answer:2,
 explain:"「持っていく」の「〜ていく」は、物を携帯して(あるいは人を同伴して)移動することを表す用法です。「子どもを連れていく」も同様に人を同伴して移動する意味であり、同じ用法です。「散っていく」「増えていく」は変化の進行を表すアスペクト的な用法であり、異なります。"},

{id:"R1-16-25", tag:"R1 試験III 問題6 問2", cat:"教授法:自己評価",
 text:"問2 <資料>の下線部B「自己評価」によって期待される効果として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者が自身の学習達成度を把握し、他者との達成度の違いを認識できる。","学習者自身がまだ十分できない点を認識し、今後の学習目標の構築ができる。","学習者が自身の学習成果を把握し、学習動機を高めることができる。","学習者自身が授業の目標を意識することで、学習に責任を持つ習慣ができる。"], answer:0,
 explain:"自己評価は、学習者自身が自分自身の到達度を振り返るためのものであり、「他者との違いを認識する」という他者比較を主目的とするものではありません。他の3つは自己評価の一般的な効果として妥当です。"},

{id:"R1-16-26", tag:"R1 試験III 問題6 問3", cat:"教授法:教案作成",
 text:"問3 文章中の下線部C「教案」作成上の留意点として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習が効果的に展開するように、各活動の時間を分単位で把握するようにする。","授業目標が達成できるように、目標と活動のつながりを意識する。","自由な発話を引き出すため、学習者の発話は事前に想定しないようにする。","学習者の既習知識を生かすため、既習事項と授業活動の関連性に配慮する。"], answer:2,
 explain:"教案作成では、学習者がどのような発話をしそうかをあらかじめある程度想定しておくことが、円滑な授業展開や不測の事態への対応のために重要です。「事前に想定しないようにする」は教案作成の留意点として不適当です。"},

{id:"R1-16-27", tag:"R1 試験III 問題6 問4", cat:"教授法:課題遂行型授業",
 text:"問4 文章中の下線部D「こうした活動では目標の達成が難しい」の理由として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["③の活動が花見を計画する会話の聴解になっているため、スキーマが活性化しない。","④の活動で「〜てきます」を併せて教えていないため、文法の理解が深まらない。","⑤の活動でモデル会話を覚えさせていないため、言語処理の自動化が促されない。","⑥の活動が発表で終わっているため、授業中にインターアクションの機会がない。"], answer:3,
 explain:"授業の目標は「計画を立てるための話し合いができる」ことでしたが、STEP3の⑥の活動は学習者が一人ずつ発表するだけで終わっており、学習者同士のやり取り(インターアクション)の機会がありません。そのため、「話し合いができる」という目標の達成が難しくなっています。"},

{id:"R1-16-28", tag:"R1 試験III 問題6 問5", cat:"教授法:授業改善",
 text:"問5 文章中の下線部E「改善方法」を考える際の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["複数の考え方に惑わされないように、問題解決のための観点を一つに絞る。","自分に限界を定めず、取り組むべき課題をできるだけ多く設定するようにする。","社会や言語教育観の変化に影響されないように、普遍的な方法で解決を試みる。","解決方法を見つけるため、具体的にどこに問題があるのかを考えるようにする。"], answer:3,
 explain:"授業改善に取り組む際は、まず授業のどこに具体的な問題があるのかを丁寧に分析することが、効果的な改善方法を見つけるための出発点となります。"},

{id:"R1-16-29", tag:"R1 試験III 問題7 問1", cat:"教授法:プレゼンテーション",
 text:"問題7 上級レベルの留学生を対象としたクラスにおいて、プレゼンテーションの授業を実施した。次の資料を読み、後の問い(問1〜5)に答えよ。<資料>は授業の概要である。\n\n<資料>授業の概要:学習者は大学1年生・上級レベル8名(多国籍)。授業時間90分×4コマ。目的は社会問題をテーマとして、アカデミック・プレゼンテーションの方法を身につけること。第1回でモデル映像視聴とプレゼンテーションを行う際の留意点についての話し合い、ルーブリックによる評価、テーマ決定とアウトライン作成。第2回でアウトラインへのコメントと再考、情報の示し方の指導、談話標識などプレゼンで使う表現の指導。第3回でスライドへのアドバイスとプレゼンテーションの練習。第4回で全員の前での発表と質疑応答、ルーブリックによる相互評価を行う。\n\n問1 <資料>の下線部A「プレゼンテーションを行う際の留意点」として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["制限時間を超過しそうな場合は、話すスピードを上げ、用意した全てを伝える。","導入の段階で前もって概要や構成を伝え、聞き手に全体の道筋を把握させる。","聞き取りやすくするため、同じトーンやテンポで話すように意識する。","知的学習を促進するため、聞き手の専門を問わず、専門用語や略語を使用する。"], answer:1,
 explain:"アカデミック・プレゼンテーションでは、導入部分であらかじめ全体の概要や構成(アウトライン)を伝え、聞き手が話の道筋を把握しやすくすることが重要な留意点とされています。時間超過時に早口で全て話し切ろうとしたり、専門用語を聞き手の背景を無視して多用したりすることは、かえって伝わりにくくなります。"},

{id:"R1-16-30", tag:"R1 試験III 問題7 問2", cat:"評価:ルーブリック",
 text:"問2 <資料>の下線部B「ルーブリック」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["複数の項目で評価ができ、パフォーマンスの質の評価に向いている。","項目ごとに到達度を評価でき、大規模な客観テストに向いている。","各項目にコメントを書く欄があり、評価内容を具体的に伝えられる。","自由記述欄があり、記載の評価項目以外についても評価が行える。"], answer:0,
 explain:"ルーブリックは、複数の評価観点(項目)についてそれぞれ達成度を段階的な尺度で示す評価基準表であり、プレゼンテーションのようなパフォーマンス(実技・実演)の質を多面的に評価するのに適しています。"},

{id:"R1-16-31", tag:"R1 試験III 問題7 問3", cat:"プレゼン:情報の示し方",
 text:"問3 <資料>の下線部C「情報の示し方」として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["一つの文に複数の情報を入れず、情報ごとに文を分ける。","聴衆を引き付けるためにアニメーションを多用し、効果音を入れる。","図や表を引用する際は、スライドの中に出典の情報を示す。","文が長い場合、体言止めを用いてスライド内の文字数を減らす。"], answer:1,
 explain:"アカデミック・プレゼンテーションでは、過度なアニメーションや効果音は聞き手の注意をスライドの装飾に向けてしまい、内容の理解を妨げるため、情報の示し方としては不適当です。他の3つは分かりやすいスライド作成の一般的な留意点です。"},

{id:"R1-16-32", tag:"R1 試験III 問題7 問4", cat:"文法:さ入れ言葉",
 text:"問4 <資料>の下線部D「プレゼンテーションの練習」の際に、学生が用いた表現とその言語現象の組み合わせとして最も適当なものを、次の1〜4の中から一つ選べ。\n\n1 調査しないと分かんないと思います。/ ら抜き言葉の使用\n2 このままでは暮らしていかれません。/ ら抜き言葉の使用\n3 負の連鎖を終わらせようとしています。/ さ入れ言葉の使用\n4 資料を分析させていただきました。/ さ入れ言葉の使用",
 choices:["選択肢1(分かんない/ら抜き言葉)","選択肢2(暮らしていかれません/ら抜き言葉)","選択肢3(終わらせようとしています/さ入れ言葉)","選択肢4(分析させていただきました/さ入れ言葉)"], answer:2,
 explain:"公式解答では選択肢3が正しい組み合わせとされています。ただしこの設問は「さ入れ言葉」の判定がやや専門的で細かい判断を要するため、正確な理屈については専門書等でも確認することをおすすめします。"},

{id:"R1-16-33", tag:"R1 試験III 問題7 問5", cat:"プレゼン:質疑応答",
 text:"問5 <資料>の下線部E「質疑応答」に関して、発表者に対する指導として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["プレゼンテーションが終わったら質疑応答に集中できるように、スライドの画面を消す。","十分に考察できていない点に関する質問に対しては、答えられないことを率直に伝える。","聞き手が持つであろう疑問を予想し、プレゼンテーション前に回答や資料を準備しておく。","説明の不十分さからくる質問もあることを想定し、質問者の意図を読み取って対応する。"], answer:0,
 explain:"質疑応答の際にスライドの画面を消してしまうと、聞き手が質問する際に参照できる視覚情報が失われ、かえって質疑応答がしにくくなります。スライドは質疑応答中も表示しておく方が適切です。"},

{id:"R1-16-34", tag:"R1 試験III 問題8 問1", cat:"教授法:CLIL",
 text:"問題8 タイの高校における日本語クラスで行った授業に関する次の資料を読み、後の問い(問1〜5)に答えよ。<資料>は授業の概要である。\n\n<資料>授業の概要:授業デザインは内容言語統合型学習(CLIL)を取り入れ、特定の内容を日本語で学ぶ授業を設計。学習者はタイの高校生、中級レベル30名。授業時間200分。学習目標は日本とタイにおける「ごみとリサイクル」について情報を整理・分析し、環境問題について理解すること、またグループで意見を出し合い自分たちができる解決方法を提案すること。活動の流れ:①目標と流れの説明、②テーマ(ごみとリサイクル)を伝える、③資料1・2を配付しグループで話し合わせる、④読解用の資料を複数用意しスキミングのスキルを使って読むよう促す、⑤日本とタイの状況を比較させ、タイの問題を設定させる、⑥グループで問題の要因を細分化して整理させる、⑦解決方法を話し合いポスターにまとめて発表させる、⑧問題や解決方法に関する自分の意見を書かせ、学習について内省させる。\n\n問1 <資料>の下線部A「内容言語統合型学習(CLIL)」の指導に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者に母語や媒介語を使用させず、日本語を使う機会を増やす。","言語構造よりも意味と理解を重視し、聴解の練習を優先的に行う。","学習者が活動に必要な言葉を日本語で言えないときは、教師が即座に支援する。","学習者が日本語の表現を間違えたときは、教師がその時点で一つ一つ訂正する。"], answer:2,
 explain:"CLIL(内容言語統合型学習)では、内容学習を進める中で学習者が表現に詰まった際に、教師がその場で必要な言語的支援(スキャフォールディング)を行うことが特徴の一つです。母語を全面禁止したり、誤りをその都度逐一訂正したりすることは、CLILの一般的な指導方針とは異なります。"},

{id:"R1-16-35", tag:"R1 試験III 問題8 問2", cat:"教材論:資料選定",
 text:"問2 <資料>の下線部Bで用いる資料を選ぶ際の留意点として不適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学習者が学習済みの語や文法で資料が構成されていること","学習者が知的好奇心を刺激される内容の資料であること","学習者が、自分と資料の内容とに関わりを感じられること","学習者が、資料が実際に使われている状況を理解できること"], answer:0,
 explain:"CLILでは内容の学習を重視するため、資料が必ずしも既習の語彙・文法だけで構成されている必要はありません。むしろ新しい語彙や表現に触れる機会も重要であり、「学習済みの語や文法のみで構成されていること」を条件にするのは不適当です。"},

{id:"R1-16-36", tag:"R1 試験III 問題8 問3", cat:"読解:スキミング",
 text:"問3 <資料>の下線部C「スキミングのスキルを使って読む」例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["テーマに関する文章を読み、使われている文法や文構造を理解する。","テーマに関する文章を読み、文章全体の大まかな意味を理解する。","テーマに関する意見文を読み、一文ずつ事実と意見とに分類する。","テーマに関する図表を見て、必要な情報をできるだけ速く探す。"], answer:1,
 explain:"スキミングは文章全体をざっと読んで大まかな意味・要旨をつかむ読み方です。「文章全体の大まかな意味を理解する」がこれに該当します。文法・文構造の精読や、必要な情報を探し出すスキャニングとは異なります。"},

{id:"R1-16-37", tag:"R1 試験III 問題8 問4", cat:"思考ツール",
 text:"問4 <資料>の下線部D「問題の要因を細分化して整理」するために使う思考ツールとして最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ボーン図(フィッシュボーン図)","同心円チャート","ベン図","ピラミッドチャート"], answer:0,
 explain:"ボーン図(フィッシュボーン図/特性要因図)は、一つの問題(結果)に対する要因を、骨のような形に枝分かれさせて細かく分類・整理するための思考ツールであり、要因の細分化に適しています。"},

{id:"R1-16-38", tag:"R1 試験III 問題8 問5", cat:"教授法:内省活動",
 text:"問5 <資料>の下線部Eの活動における指導の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["意見に説得力を持たせるため、多様な視点から考えるよう意識させる。","一人で書けない学習者には、これまで出た様々な意見を整理させる。","新しく学んだ言語形式をできるだけ多く取り入れて書くよう指導する。","グループの意見と齟齬が無いように自分の意見をまとめさせる。"], answer:0,
 explain:"自分の意見を書いて内省する活動では、一つの視点に偏らず多様な視点から考えることで、意見に深みと説得力を持たせることが望ましい指導の留意点です。グループの意見に無理に合わせさせることは、個人の内省・意見形成の目的にそぐいません。"},

{id:"R1-16-39", tag:"R1 試験III 問題9 問1", cat:"心理:異文化適応",
 text:"問題9 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n日本において外国人の受入れが加速化している。日本での移住後の生活をより良いものにするためには,全ての人が希望を持って行動できる社会にしていく必要があるだろう。その行動を起こすための原動力となるのが欲求である。そして,この人間の欲求については,マズロー(A.H.Maslow)により階層性を持つものとして理論化され,下位の欲求が順に満たされると最も高次の欲求につながるとされている。\nしかし,現実世界と欲求の間には「葛藤」が生じやすい。それに対して心の安定を保とうとする働きが「防衛機制」であるが,異文化への適応という点からは必ずしも合理的に機能するとは限らない。\n来日する外国人留学生数も増えているが,留学生は適応に関して様々な問題を抱えている。そのため,日本語教師は,留学生の心理的な混乱や不適応に対応することが必要である。それに備えて異文化間カウンセリングについて理解しておくとよい。\n\n問1 文章中の下線部A「移住後の生活」のメンタル・ヘルスに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["一般的に思春期の人と高齢者は移住による影響が少なく、現地に適応しやすい。","移住後3か月から18か月、特に12か月前後の人が精神面で危機に陥りやすい。","自分と同じ文化のコミュニティに接触できる環境にある人は、より適応しにくい。","入念に準備する人より、移住後に対応すればよいと考える人のほうが挫折しにくい。"], answer:1,
 explain:"異文化適応に関する研究では、移住後おおむね3か月から18か月、特に12か月前後の時期に精神的な危機(いわゆるカルチャーショックの深刻化)を迎えやすいことが知られています。"},

{id:"R1-16-40", tag:"R1 試験III 問題9 問2", cat:"心理:マズローの欲求階層",
 text:"問2 文章中の下線部B「最も高次の欲求」はどれか。最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["尊敬・承認欲求","所属・愛情欲求","生理的欲求","自己実現の欲求"], answer:3,
 explain:"マズローの欲求階層説では、生理的欲求を最下層とし、安全の欲求、所属・愛情欲求、尊敬・承認欲求と続き、最上位(最も高次)に自己実現の欲求が位置づけられています。"},

{id:"R1-16-41", tag:"R1 試験III 問題9 問3", cat:"心理:防衛機制",
 text:"問3 文章中の下線部C「防衛機制」の一つである「合理化」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["漢字の読めない学生が、会話には漢字は不要だから問題ないと自分で納得する。","好きなアニメキャラクターと同じような格好をしてふるまい、現実逃避する。","教師に対する不満を、その教師ではなく母親にぶつけて解消しようとする。","日本語の苦手な学生が、代わりに英語で良い成績を取って見返そうとする。"], answer:0,
 explain:"「合理化」は、満たされない欲求や都合の悪い状況に対して、もっともらしい理由をつけて自分を納得させる防衛機制です(いわゆる「すっぱい葡萄」型)。「漢字は不要だから問題ない」と自分に言い聞かせる例がこれに該当します。選択肢2は「逃避」、選択肢3は「置き換え」、選択肢4は「補償」に近い防衛機制です。"},

{id:"R1-16-42", tag:"R1 試験III 問題9 問4", cat:"学生対応:心理的不適応",
 text:"問4 文章中の下線部Dの例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「よく眠れない」と言う学生がいたら、「精神科で睡眠薬をもらったら」と勧める。","はたから見て病的な行動をとる学生がいたら、その行動は異常だと自覚させる。","休みがちな学生がいたら、まずは基本的な生活リズムに関する質問をする。","表情や行動から精神疾患が疑われる学生がいたら、まずは国の両親に連絡する。"], answer:2,
 explain:"教師がまず取るべき対応としては、休みがちな学生に対して基本的な生活状況(生活リズムなど)を穏やかに尋ねることが適切な初期対応です。安易な薬の助言、本人を追い詰めるような自覚の強制、いきなりの家族への連絡は、教師の対応としては行き過ぎ、または不適切です。"},

{id:"R1-16-43", tag:"R1 試験III 問題9 問5", cat:"異文化間カウンセリング",
 text:"問5 文章中の下線部E「異文化間カウンセリング」に関して、留学生から相談を受ける際の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["相談者の体験の異文化的な背景を特別なものとして見ないようにする。","相談者の発言や行動を共感的に受け入れないように注意する。","非言語的な印象に惑わされず、言語化された事柄の理解に重点を置く。","自身の持つ価値観を認識し、その価値観にこだわらない態度で臨む。"], answer:3,
 explain:"異文化間カウンセリングでは、カウンセラー自身が自らの文化的な価値観を自覚したうえで、その価値観に囚われすぎず、相談者の文化的背景を尊重しながら理解しようとする姿勢が重要な留意点とされています。"},

{id:"R1-16-44", tag:"R1 試験III 問題10 問1", cat:"コミュニケーション能力:談話能力",
 text:"問題10 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n第二言語教育では,語や文だけでなく,コミュニケーション能力全体の習得を目指している。コミュニケーション能力に関しては,例えば,カナル&スウェイン(M.Canale & M.Swain)は,文法能力,談話能力,社会言語能力,ストラテジー(方略的)能力から成り立つとしている。このようにコミュニケーション能力は様々な要素から成り,その総合的な育成が重要となる。\n会話の授業を行う際には,日本語の典型的な談話標識などを身につけると会話の流れがよくなることを指導するとよい。また,スキーマやスクリプトを考慮したモデル会話などを活用することも有効である。モデル会話を使った会話活動は,授業の目的に合わせて設計することが望ましい。なお,教師は学習者の発話に語用論的転移が現れる場合があることを理解しておく必要がある。\n\n問1 文章中の下線部A「談話能力」が欠如している例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["学生が「先生の論文、見ました。本当に先生はすごいですね」と言う。","学生が「先生、私がまとめたレポートの発表、聞きたいですか」と言う。","学生が「先生が貸してくださったこの論文、面白いでした」と言う。","学生が「先生、いい天気ですね。論文を貸していただけませんか」と言う。"], answer:3,
 explain:"談話能力は、文と文をつなげて一貫性・まとまりのある談話を構成する能力です。「いい天気ですね」という話題から、脈絡なく「論文を貸していただけませんか」という全く別の依頼に唐突に移るのは、話題展開の自然なつながりを欠いており、談話能力が不十分な例といえます。"},

{id:"R1-16-45", tag:"R1 試験III 問題10 問2", cat:"コミュニケーション能力:談話標識",
 text:"問2 文章中の下線部B「談話標識」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["失敗を責められて謝るときに「本当にすみません」と言う。","依頼のやり取りを終えるときに「では、そういうことで」と言う。","職場を出るときに目上の人に対して「失礼いたします」と言う。","食事の誘いを断るときに誘ってくれた人に対して「残念です」と言う。"], answer:1,
 explain:"談話標識は、話の展開や構造(話題の転換、区切り、終結など)を示す言語表現です。「では、そういうことで」は、やり取りを締めくくり終了させる典型的な談話標識の例です。他の選択肢は謝罪・暇乞い・断りといった、特定の場面に結びついた慣用的な機能表現です。"},

{id:"R1-16-46", tag:"R1 試験III 問題10 問3", cat:"認知:スクリプト",
 text:"問3 文章中の下線部C「スクリプトを考慮したモデル会話」として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["円滑な人間関係を築き、促進していくための対人的配慮を考慮したもの","学習者が置かれている日本語環境で必要とされる言語表現を考慮したもの","自分の所属する集団のウチとソトで変わる表現の使い分けを考慮したもの","日常場面において起こる出来事の典型的な順序や流れを考慮したもの"], answer:3,
 explain:"スクリプトとは、特定の場面(レストランでの食事など)で一般的に生じる出来事の典型的な順序や手順に関する知識・枠組みを指す認知心理学の概念です。「日常場面において起こる出来事の典型的な順序や流れを考慮したもの」がこれに該当します。"},

{id:"R1-16-47", tag:"R1 試験III 問題10 問4", cat:"教授法:トップダウン処理",
 text:"問4 文章中の下線部D「モデル会話を使った会話活動」に関して、トップダウン的な会話活動の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["最初に、モデル会話に出てくる語や定型表現を教える。","最初に、モデル会話の中の重要な文型を導入し、練習する。","最初に、モデル会話の映像を提示して状況を把握させる。","最初に、モデル会話に出てくる語や表現の発音練習をする。"], answer:2,
 explain:"トップダウン処理は、全体の状況や文脈から捉えていく処理の仕方です。最初に映像などで場面・状況全体を把握させることは、トップダウン的なアプローチの典型例です。語彙・文型・発音といった部分的要素から積み上げていくのはボトムアップ的なアプローチです。"},

{id:"R1-16-48", tag:"R1 試験III 問題10 問5", cat:"語用論:語用論的転移",
 text:"問5 文章中の下線部E「語用論的転移」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["ナ形容詞の過去を表す規則をイ形容詞の活用にも適用する。","可能形が苦手なため「動詞+ことができる」を使用する。","人に物を勧める際に、母語を直訳して「欲しいですか」と聞く。","尊敬語を習った直後に、相手に関係なく尊敬語を多用する。"], answer:2,
 explain:"語用論的転移は、母語の語用論的な習慣(言い回しや配慮のパターン)がそのまま目標言語の運用に持ち込まれることを指します。母語(例えば英語の\"Do you want ~?\")を直訳して「欲しいですか」と尋ねる例は、母語の語用論的な表現パターンがそのまま転移した典型例です。他の選択肢は文法規則の過剰般化や、学習した表現の過剰使用であり、語用論的転移とは性質が異なります。"},

{id:"R1-16-49", tag:"R1 試験III 問題11 問1", cat:"バイリンガル教育:BICS/CALP",
 text:"問題11 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n現在,日本では日本語を母語としない児童生徒が増えており,現場の実情に応じて,彼らに対する支援が行われている。児童生徒の言語に関わる能力は一人一人異なるため,一様の対応は難しい。児童生徒の支援に当たる者は,フィードバックの方法を含めて一人一人に合わせた対応が必要である。また,児童生徒の不安を軽減するような適切な対応や指導が求められる。\n年少者の場合には,第二言語の習得が進むにつれ,母語が失われていくことがある。精神的な安定やアイデンティティの確保のためには母語保持に関しても同時に考えることが重要である。\n\n問1 文章中の下線部A「言語に関わる能力」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["生活言語能力(BICS)も学習言語能力(CALP)も母語で培った認知能力が発達を妨げる。","生活言語能力(BICS)も学習言語能力(CALP)もコミュニケーションを介して発達する。","学習言語能力(CALP)は生活言語能力(BICS)より場面依存的である。","生活言語能力(BICS)は学習言語能力(CALP)より習得に時間がかかる。"], answer:1,
 explain:"生活言語能力(BICS)・学習言語能力(CALP)は、いずれも他者とのコミュニケーション(やり取り)を通じて発達していきます。CALPはBICSよりも場面に依存しにくい(脱文脈的)能力であり、習得にはBICSよりも時間がかかるとされているため、他の選択肢は事実と逆になっています。"},

{id:"R1-16-50", tag:"R1 試験III 問題11 問2", cat:"フィードバック:リキャスト",
 text:"問2 文章中の下線部B「フィードバック」の一つである「リキャスト」の例として最も適当なものを、次の1〜4の中から一つ選べ。\n\n1 教師:この料理の作り方を知りたいんですが、どうしたらいいですか。生徒:インターネットで見る、できます。教師:インターネットで見る、できます?\n2 教師:(同上)生徒:(同上)教師:もう一度お願いします。\n3 教師:(同上)生徒:(同上)教師:インターネットで見…?\n4 教師:(同上)生徒:(同上)教師:インターネットで見られますか。",
 choices:["選択肢1(生徒の誤りをそのまま繰り返す)","選択肢2(もう一度お願いしますと聞き返す)","選択肢3(途中まで言って促す)","選択肢4(正しい形に言い直す)"], answer:3,
 explain:"リキャストは、学習者の誤りを指摘せずに、教師がさりげなく正しい形に言い直して返す暗示的フィードバックです。生徒の誤り「インターネットで見る、できます」に対し、教師が自然な正しい表現「インターネットで見られますか」に言い直している選択肢4がリキャストの例です。"},

{id:"R1-16-51", tag:"R1 試験III 問題11 問3", cat:"支援:不安軽減",
 text:"問3 文章中の下線部C「児童生徒の不安を軽減するような適切な対応や指導」の際の留意点として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["日本語の文法などの正確さよりも意思を伝えられるようになることを優先する。","日本語で日常会話ができるようになるまで教科学習の支援は行わないようにする。","日本語の運用能力が向上するように、支援者は児童生徒の母語を使わないようにする。","日本の学校文化や規範に従い、日本人児童生徒と同じように日本語を使うよう指導する。"], answer:0,
 explain:"不安を軽減するためには、文法的な正確さを厳しく求めるよりも、まず自分の意思や考えを伝えられるようになることを優先し、児童生徒が安心してコミュニケーションを取れるようにすることが重要です。"},

{id:"R1-16-52", tag:"R1 試験III 問題11 問4", cat:"バイリンガル教育:言語喪失",
 text:"問4 文章中の下線部Dに関して、喪失されやすい順序として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["文法 → 語彙 → 音声","音声 → 語彙 → 文法","文法 → 音声 → 語彙","語彙 → 文法 → 音声"], answer:3,
 explain:"第二言語の習得が進むにつれて母語が失われていく際、一般に語彙が最も早く失われやすく、次いで文法、そして音声(発音)は比較的最後まで保持されやすいとされています。"},

{id:"R1-16-53", tag:"R1 試験III 問題11 問5", cat:"バイリンガル教育:母語保持",
 text:"問5 文章中の下線部E「母語保持」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["母語を保持するためには、イマージョン教育を推し進めていく必要がある。","母語の保持を促すために、正規の教科授業からの取り出し授業を行う。","同時期に来日した児童でも、年長者より年少者のほうが母語の保持が難しい。","母語保持は技能によって差があり、読み書きに比べて口頭能力は保持が難しい。"], answer:2,
 explain:"年少者は第二言語への切り替え・習得が早く進む一方、母語に触れる時間や定着度が年長者より少ないため、同時期に来日した場合でも年少者のほうが母語を失いやすい(保持が難しい)とされています。"},

{id:"R1-16-54", tag:"R1 試験III 問題12 問1", cat:"語用論:協調の原理",
 text:"問題12 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n話し手は,聞き手にメッセージを理解してもらうために適切に伝えようとする。グライス(H.P.Grice)は協調の原理を提唱し,このような会話の基本的な原則を説明している。また,伝え方の中には,間接発話行為と呼ばれるものがある。\nメッセージのやり取りの際には,聞き手への配慮が重要である。ブラウン&レビンソン(P.Brown & S.Levinson)は,諸言語の分析に基づきポライトネス理論を提唱し,やり取りの場面の参加者は,望ましい人間関係を維持するため,フェイスを脅かす行為(FTA: face-threatening act)を避けたり軽減したりするとしている。そして,その際使用されるストラテジーを体系化している。\n日本語では,場面や人間関係に配慮した待遇表現の運用が重視される傾向にあり,その適切な指導をする力が日本語教師には求められる。\n\n問1 文章中の下線部A「協調の原理」に関して、「関係の公理」に違反している例を、次の1〜4の中から一つ選べ。",
 choices:["先生が好きかと聞かれて「好きなような嫌いなような」と答える。","初対面の人に住んでいる場所を聞かれて「地球」と答える。","今の時間を聞かれて「1時半の2時間半前です」と答える。","車の運転ができるか聞かれて「山登りが好きです」と答える。"], answer:3,
 explain:"グライスの協調の原理における「関係の公理」は、発話が質問や文脈と関連した内容であることを求めます。「運転できるか」という質問に対し「山登りが好きです」と答えるのは、質問と無関係な内容であり、関係の公理に違反する典型例です。他の選択肢は、量の公理(情報の過不足)や様態の公理(分かりやすさ)への違反に関わるものです。"},

{id:"R1-16-55", tag:"R1 試験III 問題12 問2", cat:"語用論:間接発話行為",
 text:"問2 文章中の下線部B「間接発話行為」の例として最も適当なものを、次の1〜4の中から一つ選べ。\n\n1 X:6時に来られますか。/ Y:ええと、大丈夫です。\n2 X:時計、持ってますか。/ Y:ええと、今10時ですよ。\n3 X:この席、空いていますか。/ Y:はい、空いています。\n4 X:この件は、考えていただけますか。/ Y:はい、分かりました。",
 choices:["選択肢1(来られますか/大丈夫です)","選択肢2(時計持ってますか/今10時ですよ)","選択肢3(席空いていますか/空いています)","選択肢4(考えていただけますか/分かりました)"], answer:1,
 explain:"「時計、持ってますか」は文字通りには時計の所持を尋ねる質問ですが、実際には「今何時か教えてほしい」という依頼の意図で使われています。Yが時刻を答えていることからも、字義通りの意味とは異なる行為(時間を尋ねる依頼)として機能していることが分かり、間接発話行為の典型例です。"},

{id:"R1-16-56", tag:"R1 試験III 問題12 問3", cat:"語用論:フェイス",
 text:"問3 文章中の下線部C「フェイスを脅かす行為(FTA: face-threatening act)」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["FTAの度合いは、特定の行為の負荷の度合いと相手との社会的距離の二つの総和によって決まる。","伝達の効率性が最優先され、FTAの度合いが大きいと判断される場合、直接的な表現が選ばれる。","会話の参加者は、自分だけでなく相手のフェイスも保持しようとし、互いにFTAを避けようとする。","ある行為が相手にFTAとして認識されるかどうかは、言語圏や文化に関係なく共通している。"], answer:2,
 explain:"ポライトネス理論では、会話の参加者は自分自身のフェイス(体面・自尊心)だけでなく、相手のフェイスも尊重しようとし、互いに相手を脅かす行為(FTA)を避けたり軽減したりしながらやり取りを行うと考えられています。"},

{id:"R1-16-57", tag:"R1 試験III 問題12 問4", cat:"語用論:ポライトネスストラテジー",
 text:"問4 文章中の下線部D「ストラテジー」に関して、「ポジティブ・ポライトネス・ストラテジー」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["いつも気を遣っていただいて、本当に申し訳ありません。","デザートをお持ちしてよろしければ、声をおかけください。","チョコ好きでしょ、これ、おいしいから食べてみて。","手が空いてたら来てほしいんだけど、無理っぽいかな。"], answer:2,
 explain:"ポジティブ・ポライトネスは、相手との親密さや共感、仲間意識を強調することで良好な関係を保とうとするストラテジーです。「チョコ好きでしょ」と相手の好みを分かっていることを示しながら勧める表現は、この典型例です。"},

{id:"R1-16-58", tag:"R1 試験III 問題12 問5", cat:"待遇表現",
 text:"問5 文章中の下線部E「待遇表現」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["他者を高く位置づける表現だけでなく、他者を低く位置づけるぞんざいな表現も含まれる。","古典語では天皇が自分に対して敬語を用いる自敬表現は使われなかったが、現代語では使われる。","敬語は、聞き手に丁寧な気持ちや態度を表す素材敬語と、話題の人物への敬意を表す対者敬語に大別できる。","かつてはウチ・ソトの関係が優先されたが、現代は上下関係を重視して敬語が運用されている。"], answer:0,
 explain:"待遇表現は、相手を高く位置づける敬語表現だけでなく、相手との関係性に応じて低く位置づけるぞんざいな表現(タメ口など)も含む、幅広い言葉遣いの体系を指します。"},

{id:"R1-16-59", tag:"R1 試験III 問題14 問1", cat:"人称詞:指示詞からの転用",
 text:"問題14 次の文章を読み、下の問い(問1〜5)に答えよ。\n\n現代日本語では,人を指し示すための人称詞として自称詞(一人称),対称詞(二人称),他称詞(三人称)があり,人称代名詞や親族名称など,様々な形式が用いられる。人称詞の中には,指示詞からの転用によってできたものがある。転用の理由の一つとして,敬意が低減(逓減)した人称詞に代わって,敬意のある新しい人称詞が必要になったという説がある。また,人称詞には述語の文法的性質や文の種類によって主語の人称が制限されるといった文法的な特徴がある。加えて,親族間の人称詞には,人間関係を反映した一般的な用法がある。以上を踏まえて,人称詞の指導を行うことが必要となってくる。\n\n問1 文章中の下線部A「指示詞からの転用によってできたもの」の例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["あなた","貴様","やつ","僕"], answer:0,
 explain:"「あなた」は、元々遠方を指す指示詞「彼方(あなた)」に由来し、そこから二人称代名詞に転用されたとされています。他の選択肢は指示詞由来ではありません。"},

{id:"R1-16-60", tag:"R1 試験III 問題14 問2", cat:"人称詞:敬意逓減",
 text:"問2 文章中の下線部B「敬意が低減(逓減)した人称詞」に関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["「お前」は、かつては尊称の対称詞だったが、現在では相手を罵るときの対称詞としても用いられるようになった。","「てまえ」は、かつては宮中の女房達の自称詞だったが、現在では対等または目下の相手への対称詞として用いられるようになった。","「わたくし」は、かつては自分を尊大に表現する自称詞だったが、現在ではへりくだって話す自称詞としても用いられるようになった。","「俺様」は、かつては目上の相手への対称詞だったが、現在ではへりくだって話す自称詞として用いられるようになった。"], answer:0,
 explain:"「お前(御前)」は元来「貴人の御前」を意味する敬意の高い表現でしたが、時代とともに敬意が下がり(敬意逓減)、現在では相手を罵ったり見下したりする際にも使われるようになりました。これが敬意逓減の典型例です。"},

{id:"R1-16-61", tag:"R1 試験III 問題14 問3", cat:"人称詞:主語制限",
 text:"問3 文章中の下線部Cに関して、主語が一人称のみに制限される例として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["怒りのあまり、彼を殴っただろう。","寝不足で、きっと頭が痛いはずだ。","昨日食べたすき焼き、また食べたい。","来年、東京の大学を受験するらしい。"], answer:2,
 explain:"願望を表す「〜たい」は、原則として一人称の主語に限定される表現です(三人称の願望には「〜たがる」を用います)。「だろう」「はずだ」「らしい」といった推量・伝聞のモダリティ表現には、このような人称制限は基本的にありません。"},

{id:"R1-16-62", tag:"R1 試験III 問題14 問4", cat:"人称詞:親族名称",
 text:"問4 文章中の下線部Dに関する記述として最も適当なものを、次の1〜4の中から一つ選べ。",
 choices:["年上の親族に対する自称詞として親族名称を使う。","年上の親族に対する対称詞として人称代名詞を使う。","年下の親族に対する自称詞として名前を使う。","年下の親族に対する対称詞として人称代名詞を使う。"], answer:3,
 explain:"日本語の親族間の呼び方には、年上の親族には親族名称(「お兄さん」など)を用い、年下の親族には名前や人称代名詞を用いるという、年齢関係を反映した一般的な使い分けのパターンがあります。「年下の親族に対する対称詞として人称代名詞を使う」がこれに該当します。"},

{id:"R1-16-63", tag:"R1 試験III 問題14 問5", cat:"教授法:人称詞の指導",
